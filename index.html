<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>INTEL_GATEKEEPER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #01080b; --cyan: #00f3ff; --red: #ff003c; --green: #00ff66; --border: rgba(0, 243, 255, 0.15); --mono: 'Share Tech Mono', monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; background: #000; }
        .header-title { font-family: var(--mono); color: var(--cyan); font-size: 14px; letter-spacing: 4px; }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        
        .scanner-unit { margin-bottom: 40px; }
        #status-msg { font-family: var(--mono); font-size: 11px; color: var(--cyan); margin-bottom: 8px; text-transform: uppercase; }
        .identity-slot { font-size: 32px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; min-height: 40px; }
        #link-indicator { font-size: 10px; padding: 4px 12px; border: 1px solid #333; color: #333; display: inline-block; font-family: var(--mono); }

        .report-btn { 
            background: transparent; border: 2px solid #333; color: #333; 
            padding: 22px 50px; font-family: var(--mono); font-size: 15px; 
            cursor: pointer; clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%); 
            transition: 0.4s; pointer-events: none;
        }
        .report-btn.unlocked { border-color: var(--cyan); color: var(--cyan); pointer-events: auto; box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }

        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #222; font-size: 11px; font-family: var(--mono); text-decoration: none; }
        .nav-link.active { color: var(--cyan); border-top: 2px solid var(--cyan); }
    </style>
</head>
<body>

<header><div class="header-title">INTEL_TERMINAL</div></header>

<main>
    <div class="scanner-unit">
        <div id="status-msg">Initializing_Scan...</div>
        <div class="identity-slot" id="agent-name">PROTECTED</div>
        <div id="link-indicator">UPLINK_OFFLINE</div>
    </div>

    <button id="main-btn" class="report-btn">LOCKED</button>
</main>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="#" class="nav-link active">INTEL</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
        authDomain: "my-admin-portal-12691.firebaseapp.com",
        projectId: "my-admin-portal-12691",
        storageBucket: "my-admin-portal-12691.firebasestorage.app",
        messagingSenderId: "317015091563",
        appId: "1:317015091563:web:baab5171d8e0a58acd442e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function runDeviceAudit() {
        const nameDisplay = document.getElementById('agent-name');
        const statusDisplay = document.getElementById('status-msg');
        const linkDisplay = document.getElementById('link-indicator');
        const btn = document.getElementById('main-btn');

        // Fingerprint Generation (Permanent ID)
        const signature = (navigator.userAgent + screen.width + navigator.platform).replace(/\s/g, '');
        
        statusDisplay.innerText = "Scanning_Hardware_Profile...";

        try {
            const snap = await getDocs(collection(db, "agents"));
            let verified = false;

            snap.forEach(doc => {
                const data = doc.data();
                // I-scan kung ang device na ito ay linked sa agent sa Firebase
                if (data.lastFingerprint === signature || (data.linkedDevice && data.linkedDevice.includes(localStorage.getItem("agency_node_secret")))) {
                    verified = true;
                    nameDisplay.innerText = data.agentName;
                    statusDisplay.innerText = "Access_Granted";
                    linkDisplay.innerText = "LINK_ACTIVE";
                    linkDisplay.style.color = "var(--green)";
                    linkDisplay.style.borderColor = "var(--green)";
                    
                    btn.innerText = "INITIATE REPORT";
                    btn.classList.add('unlocked');
                    btn.onclick = () => window.location.href = 'report.html';
                    
                    localStorage.setItem("cia_agent", data.agentName);
                }
            });

            if (!verified) {
                nameDisplay.innerText = "UNAUTHORIZED";
                nameDisplay.style.color = "var(--red)";
                statusDisplay.innerText = "Device_Not_Registered";
                linkDisplay.innerText = "ID: " + signature.substring(0, 12); // Ipakita ang snippet ng ID para sa admin
            }

        } catch (e) {
            statusDisplay.innerText = "Connection_Error";
        }
    }

    window.onload = runDeviceAudit;
</script>

</body>
</html>
