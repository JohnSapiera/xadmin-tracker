<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEBUG SCANNER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { background: #01080b; color: #00f3ff; font-family: 'Share Tech Mono', monospace; padding: 20px; }
        .box { border: 1px solid #00f3ff; padding: 15px; background: #051218; }
        input { width: 100%; background: #000; border: 1px solid #00f3ff; color: #00f3ff; font-size: 24px; padding: 10px; text-align: center; outline: none; }
        #main-btn { width: 100%; margin-top: 10px; padding: 15px; border: 1px solid #00ff66; color: #00ff66; background: transparent; font-weight: bold; }
        .btn-blue { background: #007bff !important; color: white !important; border-color: #007bff !important; }
        #terminal { margin-top: 15px; font-size: 11px; color: #666; height: 150px; overflow-y: auto; border: 1px solid #111; padding: 5px; }
    </style>
</head>
<body>

    <div class="box">
        <div style="font-size: 10px; margin-bottom: 5px;">MISSION_ID AUTO-SCAN</div>
        <input type="tel" id="mission-input" placeholder="00000" maxlength="5">
        <button id="main-btn">SAVE</button>
    </div>

    <div id="terminal">> SYSTEM STANDBY...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
        authDomain: "my-admin-portal-12691.firebaseapp.com",
        projectId: "my-admin-portal-12691",
        storageBucket: "my-admin-portal-12691.firebasestorage.app",
        messagingSenderId: "317015091563",
        appId: "1:317015091563:web:baab5171d8e0a58acd442e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const input = document.getElementById('mission-input');
    const btn = document.getElementById('main-btn');
    const term = document.getElementById('terminal');

    input.addEventListener('input', async (e) => {
        const val = e.target.value.trim();
        
        if (val.length >= 4) {
            writeLog(`SCANNING DATA: ${val}...`, 'cyan');
            
            try {
                // TEST 1: Simple query sa 'blacklist' collection
                // Gagamitin natin ang 'targetID' na field name
                const colRef = collection(db, "blacklist");
                const q = query(colRef, where("targetID", "==", val));
                
                const snapshot = await getDocs(q);

                if (!snapshot.empty) {
                    btn.textContent = "RETRIEVE";
                    btn.className = "btn-blue";
                    writeLog(`[MATCH FOUND] ID: ${val}`, 'blue');
                } else {
                    // Try searching as Number if String fails
                    const qNum = query(colRef, where("targetID", "==", Number(val)));
                    const snapNum = await getDocs(qNum);
                    
                    if(!snapNum.empty) {
                        btn.textContent = "RETRIEVE";
                        btn.className = "btn-blue";
                        writeLog(`[MATCH FOUND AS NUMBER] ID: ${val}`, 'blue');
                    } else {
                        btn.textContent = "SAVE";
                        btn.className = "";
                        writeLog(`NO RECORD FOR: ${val}`, 'gray');
                    }
                }
            } catch (err) {
                // DITO NATIN MAKIKITA ANG TUNAY NA SAKIT
                writeLog(`CRITICAL ERROR: ${err.code}`, 'red');
                console.error("FULL ERROR DETAILS:", err);
            }
        } else {
            btn.textContent = "SAVE";
            btn.className = "";
        }
    });

    function writeLog(msg, color) {
        const time = new Date().toLocaleTimeString();
        const colorHex = color === 'cyan' ? '#00f3ff' : color === 'blue' ? '#007bff' : color === 'red' ? '#ff003c' : '#666';
        term.innerHTML = `<div style="color:${colorHex}">[${time}] > ${msg}</div>` + term.innerHTML;
    }
</script>
</body>
</html>
