<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERATIONS CENTER - SECURE ACCESS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cia-dark-ops">
    <div class="crt-overlay"></div>
    
    <nav class="status-bar">
        <div class="system-id">ID: 098-INTEL</div>
        <div class="location">LOC: [REDACTED]</div>
        <div class="connection-status">CONNECTION: <span class="secure-pulse">ENCRYPTED</span></div>
    </nav>

    <div class="dashboard-container">
        <div class="panel side-panel" id="bounty-panel">
            <h3 class="panel-tag">// BOUNTY_OPS</h3>
            <div class="redacted-content">
                <p class="blink">SYSTEM STANDBY...</p>
                <div class="redacted-box">REDACTED BY COMMAND</div>
            </div>
        </div>

        <div class="panel main-panel" id="ban-protocol">
            <h3 class="panel-tag">// BAN_PROTOCOL_v4</h3>
            <div class="input-container">
                <label for="secretCode">IDENTIFICATION / SECRET CODE:</label>
                <input type="text" id="secretCode" placeholder="Enter target code..." autocomplete="off">
                <button id="executeBanBtn" onclick="executeSingleBan()">EXECUTE TERMINATION</button>
            </div>
            <div class="terminal-output" id="banOutput">
                <p>>_ WAITING FOR INPUT...</p>
            </div>
        </div>

        <div class="panel side-panel" id="chat-panel">
            <h3 class="panel-tag">// SECURE_COMM_LINK</h3>
            <div class="chat-feed" id="chatFeed">
                <div class="chat-msg system">SECURE LINE ESTABLISHED.</div>
            </div>
            <div class="chat-controls">
                <label for="imgUpload" class="custom-upload">📎</label>
                <input type="file" id="imgUpload" accept="image/*" style="display:none">
                <input type="text" id="chatInput" placeholder="Classified message...">
                <button id="sendChat">SEND</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
