<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENCY_OS_v9.0_LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000508;
            --cyan: #00f3ff;
            --red: #ff003c;
            --border: rgba(0, 243, 255, 0.2);
            --mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--cyan);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            padding: 40px 30px;
            background: rgba(2, 12, 18, 0.98);
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 1);
        }

        .status-header {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 3px;
            margin-bottom: 30px;
            color: #4a5a61;
            display: flex;
            justify-content: space-between;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 243, 255, 0.03);
            border: 1px solid #1a262b;
            padding: 18px;
            color: #fff;
            font-family: var(--mono);
            margin-bottom: 25px;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 2px;
        }

        .input-field:focus {
            border-color: var(--cyan);
            background: rgba(0, 243, 255, 0.08);
        }

        .auth-btn {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            font-family: var(--mono);
            font-weight: bold;
            letter-spacing: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-btn:hover {
            background: var(--cyan);
            color: #000;
            box-shadow: 0 0 20px var(--cyan);
        }

        #log-output {
            margin-top: 20px;
            font-family: var(--mono);
            font-size: 11px;
            text-align: center;
            height: 15px;
        }

        .loader-bar {
            position: absolute;
            bottom: 0; left: 0;
            height: 2px; background: var(--cyan);
            width: 0%; transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="status-header">
            <span>UPLINK: READY</span>
            <span id="node-id">---</span>
        </div>

        <h2 style="text-align: center; letter-spacing: 8px; margin-bottom: 40px; font-size: 24px;">AGENCY OS</h2>

        <input type="text" id="agentName" class="input-field" placeholder="AGENT_NAME" autocomplete="off">

        <button id="loginBtn" class="auth-btn">VERIFY_AGENT</button>

        <div id="log-output">AWAITING_IDENTIFICATION</div>
        <div class="loader-bar" id="loadBar"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Manage Device UUID
        const getDeviceID = () => {
            let id = localStorage.getItem("device_uuid");
            if (!id) {
                id = "NODE-" + Math.random().toString(36).substr(2, 6).toUpperCase();
                localStorage.setItem("device_uuid", id);
            }
            return id;
        };

        const currentDevice = getDeviceID();
        document.getElementById('node-id').innerText = currentDevice;

        const loginBtn = document.getElementById('loginBtn');
        const logOutput = document.getElementById('log-output');
        const loadBar = document.getElementById('loadBar');

        loginBtn.onclick = async () => {
            const nameInput = document.getElementById('agentName').value.trim().toUpperCase();

            if(!nameInput) {
                logOutput.innerText = "ERROR: NAME_REQUIRED";
                return;
            }

            loginBtn.disabled = true;
            logOutput.innerText = "QUERYING_AGENTS_DATABASE...";
            loadBar.style.width = "50%";

            try {
                // Hahanapin sa 'agents' collection
                const q = query(collection(db, "agents"), where("agentName", "==", nameInput));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    const agentDoc = snap.docs[0];
                    logOutput.innerText = "AGENT_VERIFIED. SYNCING_NODE...";
                    
                    // I-update ang linkedDevice sa 'agents' collection record
                    await updateDoc(doc(db, "agents", agentDoc.id), {
                        linkedDevice: currentDevice,
                        lastAccess: new Date().toISOString()
                    });

                    // Save session local
                    localStorage.setItem("cia_agent", nameInput);
                    
                    loadBar.style.width = "100%";
                    logOutput.style.color = "var(--cyan)";
                    logOutput.innerText = "ACCESS_GRANTED. WELCOME AGENT.";

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1200);

                } else {
                    throw new Error("AGENT_NOT_FOUND");
                }

            } catch (error) {
                loginBtn.disabled = false;
                logOutput.style.color = "var(--red)";
                logOutput.innerText = "UNAUTHORIZED: AGent NOT FOUND";
                loadBar.style.width = "0%";
            }
        };
    </script>
</body>
</html>
