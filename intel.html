<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>INTEL_TERMINAL_v30</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root { 
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c; --cia-green: #00ff66; 
            --cia-border: rgba(0, 243, 255, 0.15); 
            --font-digital: 'Share Tech Mono', monospace; 
            --font-header: 'Rajdhani', sans-serif;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--cia-bg); color: #c8e1e5; font-family: var(--font-header); 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            background-image: 
                linear-gradient(var(--cia-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--cia-border) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header { padding: 15px; border-bottom: 1px solid var(--cia-border); text-align: center; background: rgba(0,0,0,0.8); }
        .intel-title { font-family: var(--font-digital); color: var(--cia-cyan); font-size: 11px; letter-spacing: 3px; }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        
        /* Tactical Avatar Circle */
        .scanner-ring {
            width: 120px; height: 120px; border: 2px solid var(--cia-cyan); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); position: relative;
        }
        .scanner-ring::after {
            content: ""; position: absolute; inset: -5px; border: 1px dashed var(--cia-cyan);
            border-radius: 50%; animation: rotate 10s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .agent-name { font-size: 38px; font-weight: 800; text-transform: uppercase; color: #fff; letter-spacing: 2px; }
        
        .report-btn { 
            margin-top: 30px; background: none; border: 1px solid var(--cia-cyan); 
            color: var(--cia-cyan); width: 250px; height: 60px; font-family: var(--font-digital); 
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .report-btn:active { background: var(--cia-cyan); color: #000; transform: scale(0.95); }

        /* NOIR POPUP STYLE (PROJECTOR EFFECT) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; }
        
        @keyframes noir-jitter {
            0% { transform: translate(0,0); }
            10% { transform: translate(-0.5px, -0.5px); }
            20% { transform: translate(0.5px, 0px); }
            100% { transform: translate(0,0); }
        }

        .modal-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 92%; max-width: 360px; background: #d4b98a; 
            padding: 35px 25px; font-family: var(--font-noir); color: #3d2b1f;
            box-shadow: 15px 15px 0px #000;
            animation: noir-jitter 0.2s infinite;
        }

        /* Film Grain for Modal */
        .modal-box::before {
            content: ""; position: absolute; inset: 0;
            background: url('https://media.giphy.com/media/oEI9uWUicT3hu/giphy.gif');
            opacity: 0.05; pointer-events: none; mix-blend-mode: multiply;
        }

        .input-group { margin-bottom: 15px; }
        .input-label { font-size: 10px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        .intel-input { 
            width: 100%; background: none; border: none; border-bottom: 2px solid rgba(61,43,31,0.2); 
            padding: 10px; color: #3d2b1f; font-family: var(--font-noir); font-size: 20px; outline: none; text-align: center;
        }

        /* WEAPON GRID NOIR */
        .weapon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
        .weapon-grid.single-mode { grid-template-columns: 1fr; }

        .weapon-card { 
            padding: 12px; border: 1px dashed rgba(61,43,31,0.4); background: rgba(0,0,0,0.03); 
            font-size: 11px; text-align: center; cursor: pointer; color: #3d2b1f; 
        }
        .weapon-card.selected { 
            background: #3d2b1f; color: #d4b98a; border-style: solid;
        }

        .btn-transmit { 
            width: 100%; padding: 15px; background: #3d2b1f; color: #d4b98a; 
            border: none; font-family: var(--font-noir); font-size: 14px; font-weight: bold; 
            cursor: pointer; margin-top: 15px; box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }
        .btn-transmit:disabled { opacity: 0.3; cursor: not-allowed; }

        /* NAV */
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid var(--cia-border); display: grid; grid-template-columns: 1fr 1fr; }
        .nav-link { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-family: var(--font-digital); text-decoration: none; font-size: 10px; letter-spacing: 1px; }
        .nav-link.active { color: var(--cia-cyan); border-top: 2px solid var(--cia-cyan); background: linear-gradient(to bottom, rgba(0,243,255,0.05), transparent); }
    </style>
</head>
<body>

<header><div class="intel-title">SYSTEM_INTEL // UPLINK_v3.0</div></header>

<main>
    <div class="scanner-ring">
        <span style="font-size: 40px;">👤</span>
    </div>
    <div id="display-name" class="agent-name">---</div>
    <div style="font-size:10px; color:var(--cia-cyan); font-family:var(--font-digital); opacity: 0.7; margin-top: 5px;">
        STATUS: ONLINE // ENCRYPTION: AES-256
    </div>
    
    <button class="report-btn" onclick="openReport()">INITIATE_UPLINK_SCAN</button>
</main>

<div id="report-modal" class="modal">
    <div class="modal-box">
        <div id="scan-status" style="font-size:10px; text-align:center; margin-bottom:15px; font-weight:bold; letter-spacing:1px;">AWAITING_INPUT...</div>

        <div class="input-group">
            <span class="input-label">vAgent_Serial_Number</span>
            <input type="text" id="vAgentInput" class="intel-input" placeholder="0000" oninput="handleDualSearch(this.value)">
        </div>

        <div id="weapon-selection-zone" style="display:none; margin-bottom:15px;">
            <span class="input-label">System_Identity_Detected:</span>
            <div id="weapon-grid" class="weapon-grid"></div>
        </div>

        <div class="input-group">
            <span class="input-label">Bounty_Amount_PHP</span>
            <input type="number" id="expensesInput" class="intel-input" placeholder="0.00" oninput="validateForm()">
        </div>

        <button id="transmit-btn" onclick="transmitData()" class="btn-transmit" disabled>LOCKED_TARGET_REQUIRED</button>
        <button onclick="closeReport()" style="width:100%; background:transparent; color:#8b0000; border:none; margin-top:15px; font-family:var(--font-noir); font-size:11px; cursor:pointer;">[ ABORT_TRANSMISSION ]</button>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link"><span>DASHBOARD</span></a>
    <a href="#" class="nav-link active"><span>INTEL</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, increment, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let selectedDeviceName = null;

    window.onload = () => {
        const agent = localStorage.getItem("cia_agent");
        if (!agent) { window.location.href = "index.html"; return; }
        document.getElementById('display-name').innerText = agent;
    };

    window.handleDualSearch = async (val) => {
        const currentAgent = localStorage.getItem("cia_agent");
        const status = document.getElementById('scan-status');
        const grid = document.getElementById('weapon-grid');
        const zone = document.getElementById('weapon-selection-zone');
        const cleanVal = val.trim();

        if(cleanVal.length < 1) { 
            zone.style.display = "none"; 
            selectedDeviceName = null;
            validateForm();
            return; 
        }

        try {
            const agentQ = query(collection(db, "agents"), where("agentName", "==", currentAgent));
            const agentSnap = await getDocs(agentQ);
            if (agentSnap.empty) { status.innerText = "ACCESS_DENIED_UNAUTHORIZED"; return; }

            const queries = [
                query(collection(db, "mission_orders"), where("agentName", "==", currentAgent), where("vAgentID", "==", cleanVal)),
                query(collection(db, "mission_orders"), where("agentName", "==", currentAgent), where("vAgentID", "==", Number(cleanVal)))
            ];

            let foundDocs = [];
            for (let q of queries) {
                const snap = await getDocs(q);
                if (!snap.empty) {
                    snap.forEach(d => foundDocs.push(d.data()));
                    break;
                }
            }

            if (foundDocs.length > 0) {
                zone.style.display = "block";
                grid.innerHTML = "";
                
                if (foundDocs.length === 1) grid.classList.add('single-mode');
                else grid.classList.remove('single-mode');

                foundDocs.forEach((data, index) => {
                    const card = document.createElement('div');
                    card.className = 'weapon-card';
                    card.id = "card-" + index;
                    card.innerHTML = `SYS: <b>${data.weaponSystem}</b>`;
                    card.onclick = () => selectWeapon(card, data.weaponSystem);
                    grid.appendChild(card);
                });

                if (foundDocs.length === 1) {
                    setTimeout(() => {
                        const firstCard = document.getElementById('card-0');
                        selectWeapon(firstCard, foundDocs[0].weaponSystem);
                        status.innerText = "TARGET_LOCKED_AUTO";
                        status.style.color = "#2b5329";
                    }, 50);
                } else {
                    selectedDeviceName = null;
                    status.innerText = "MULTIPLE_SYSTEMS_DETECTED";
                    status.style.color = "#3d2b1f";
                }
            } else {
                status.innerText = "SERIAL_NOT_FOUND";
                status.style.color = "#8b0000";
                zone.style.display = "none";
                selectedDeviceName = null;
            }
            validateForm();
        } catch (e) { console.error(e); }
    };

    window.selectWeapon = (element, name) => {
        document.querySelectorAll('.weapon-card').forEach(c => c.classList.remove('selected'));
        if (element) {
            element.classList.add('selected');
            selectedDeviceName = name;
        }
        validateForm();
    };

    window.validateForm = () => {
        const v = document.getElementById('vAgentInput').value;
        const e = document.getElementById('expensesInput').value;
        const btn = document.getElementById('transmit-btn');
        
        if (v && e > 0 && selectedDeviceName) {
            btn.disabled = false;
            btn.innerText = "TRANSMIT_TO_" + selectedDeviceName.toUpperCase();
        } else {
            btn.disabled = true;
            btn.innerText = selectedDeviceName ? "ENTER_BOUNTY_AMOUNT" : "LOCKED_TARGET_REQUIRED";
        }
    };

    window.transmitData = async () => {
        const v = document.getElementById('vAgentInput').value.trim();
        const e = parseFloat(document.getElementById('expensesInput').value);
        const agent = localStorage.getItem("cia_agent");

        try {
            const reportID = `${agent}_${selectedDeviceName}_${v}`.replace(/\s+/g, '_');
            const reportRef = doc(db, "bounty_report", reportID);

            await setDoc(reportRef, {
                agentOwner: agent,
                weaponSystem: selectedDeviceName,
                vAgentID: v,
                totalExpenses: increment(e),
                lastUpdate: serverTimestamp()
            }, { merge: true });

            await addDoc(collection(db, "bounty_report", reportID, "logs"), {
                amount: e,
                timestamp: serverTimestamp(),
                reportedBy: agent
            });

            alert("✅ TRANSMISSION_COMPLETE: Data logged in Archives.");
            location.reload();
        } catch (err) { alert("❌ ERROR: Uplink Interrupted."); }
    };

    window.openReport = () => {
        document.getElementById('report-modal').style.display = 'block';
        document.getElementById('vAgentInput').focus();
    }
    window.closeReport = () => document.getElementById('report-modal').style.display = 'none';
</script>
</body>
</html>
