<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_AUTH_v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #01080b; --cyan: #00f2ff; --red: #ff003c; --green: #00ff66; }
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        
        body { 
            background: var(--bg); color: var(--cyan); 
            font-family: 'Share Tech Mono', monospace;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .auth-container {
            width: 350px; padding: 40px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid var(--cyan);
            position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            clip-path: polygon(0 15%, 10% 0, 100% 0, 100% 85%, 90% 100%, 0 100%);
        }

        .header { font-size: 10px; letter-spacing: 5px; opacity: 0.5; margin-bottom: 30px; text-align: center; }
        
        input {
            width: 100%; background: rgba(0, 242, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 15px; color: var(--cyan);
            font-family: 'Share Tech Mono'; text-align: center;
            font-size: 18px; outline: none; margin-bottom: 20px;
            transition: 0.3s;
        }

        input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        button {
            width: 100%; padding: 15px; background: transparent;
            border: 1px solid var(--cyan); color: var(--cyan);
            font-family: 'Share Tech Mono'; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }

        button:hover { background: var(--cyan); color: var(--bg); font-weight: bold; }

        #status {
            margin-top: 25px; font-size: 12px; text-align: center;
            height: 40px; letter-spacing: 1px;
            line-height: 1.4;
        }

        .denied { color: var(--red) !important; animation: shake 0.2s infinite; }
        .granted { color: var(--green) !important; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(2px); } 50% { transform: translateX(-2px); } 100% { transform: translateX(0); } }
        
        .bypass-note {
            font-size: 9px;
            text-align: center;
            margin-top: 15px;
            color: #5c7882;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header">DECRYPT_ACCESS_KEY</div>
        
        <input type="password" id="keyInput" placeholder="ENTER SECRET KEY" autocomplete="off">
        <button id="authBtn">AUTHORIZE</button>

        <div id="status">SYSTEM_IDLE</div>
        <div class="bypass-note">[Enter 1010 or 4646]</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ===== EMERGENCY BYPASS - DIRECT LOGIN =====
        const BYPASS_KEYS = {
            "1010": "AGENT_JFSN",
            "4646": "AGENT_LZ"
        };

        document.getElementById('authBtn').addEventListener('click', async () => {
            const key = document.getElementById('keyInput').value.trim();
            const statusDiv = document.getElementById('status');

            if(!key || key.length === 0) {
                statusDiv.innerText = "ENTER SECRET KEY";
                statusDiv.classList.add('denied');
                return;
            }

            statusDiv.innerText = "AUTHENTICATING...";
            statusDiv.classList.remove('denied');
            statusDiv.classList.remove('granted');

            // ===== EMERGENCY BYPASS - Skip Firebase if key matches =====
            if (BYPASS_KEYS[key]) {
                const agentName = BYPASS_KEYS[key];
                console.log("⚠️ BYPASS MODE: Logging in as " + agentName);
                
                statusDiv.innerText = "ACCESS_GRANTED (BYPASS)";
                statusDiv.classList.add('granted');
                statusDiv.style.color = "var(--green)";
                
                localStorage.setItem("cia_agent", agentName);
                localStorage.setItem("agent", agentName);
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("last_auth", new Date().toISOString());
                
                setTimeout(() => {
                    window.location.replace("dashboard.html");
                }, 1000);
                return;
            }

            // ===== NORMAL FIREBASE AUTH (if bypass doesn't match) =====
            try {
                const snap = await db.collection("agents")
                                     .where("secretKey", "==", key)
                                     .get();

                if (!snap.empty) {
                    const agentData = snap.docs[0].data();
                    const agentName = agentData.agentName || snap.docs[0].id;
                    
                    statusDiv.innerText = "ACCESS_GRANTED";
                    statusDiv.classList.add('granted');
                    statusDiv.style.color = "var(--green)";

                    localStorage.setItem("cia_agent", agentName);
                    localStorage.setItem("agent", agentName);
                    localStorage.setItem("agent_verified", "true");
                    localStorage.setItem("last_auth", new Date().toISOString());

                    setTimeout(() => {
                        window.location.replace("dashboard.html");
                    }, 1000);
                } else {
                    statusDiv.innerText = "INVALID_SECRET_KEY";
                    statusDiv.classList.add('denied');
                    localStorage.clear();
                }
            } catch (e) {
                console.error("Auth error:", e);
                statusDiv.innerText = "CONNECTION_ERROR - Using bypass?";
                statusDiv.classList.add('denied');
                
                // Last resort: check if key matches bypass even if Firebase fails
                if (BYPASS_KEYS[key]) {
                    statusDiv.innerText = "ACCESS_GRANTED (FALLBACK)";
                    statusDiv.classList.add('granted');
                    const agentName = BYPASS_KEYS[key];
                    localStorage.setItem("cia_agent", agentName);
                    localStorage.setItem("agent", agentName);
                    localStorage.setItem("agent_verified", "true");
                    setTimeout(() => window.location.replace("dashboard.html"), 1000);
                }
            }
        });

        document.getElementById('keyInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('authBtn').click();
            }
        });
    </script>
</body>
</html>
