<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT_DOSSIER | ARCHIVE_SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0c0c0e; 
            --cyan: #00f2ff; 
            --folder: #ffd700; 
            --paper: #f0f0f0; 
            --red: #ff3c3c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'JetBrains Mono', monospace; 
            margin: 0; 
            padding: 15px; 
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px); 
            background-size: 25px 25px;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .breadcrumb { font-size: 9px; color: var(--cyan); letter-spacing: 1px; }

        .back-home {
            background: none; border: 1px solid var(--cyan); color: var(--cyan);
            padding: 5px 12px; font-size: 10px; cursor: pointer; font-family: inherit;
        }

        /* Folder Grid View */
        .explorer-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            padding: 10px;
        }

        .folder-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 15px;
            transition: 0.2s;
        }

        .folder-item:active { background: rgba(0, 242, 255, 0.1); border-radius: 8px; }

        .folder-icon {
            width: 70px; height: 50px;
            background: var(--folder);
            position: relative;
            border-radius: 0 4px 4px 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .folder-icon::before {
            content: ''; position: absolute; top: -8px; left: 0;
            width: 30px; height: 10px; background: var(--folder);
            border-radius: 4px 4px 0 0;
        }

        .folder-name { font-size: 11px; font-weight: 800; margin-top: 12px; text-align: center; color: #fff; }

        /* File View (Papers) */
        .file-view-container { display: none; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .paper-stack { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }

        .mission-paper {
            background: var(--paper);
            color: #1a1a1a;
            padding: 25px 20px;
            position: relative;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
            border-left: 12px solid #bbb;
        }

        .stamp {
            position: absolute; top: 15px; right: 15px;
            border: 3px solid var(--red); color: var(--red);
            padding: 4px 8px; font-size: 10px; font-weight: 900;
            transform: rotate(12deg); opacity: 0.8;
            letter-spacing: 1px;
        }

        .paper-header { 
            border-bottom: 2px solid #1a1a1a; 
            margin-bottom: 15px; 
            font-size: 14px; 
            font-weight: 800;
            padding-bottom: 5px;
        }

        .data-row {
            display: flex; justify-content: space-between;
            font-size: 11px; margin-bottom: 8px;
            border-bottom: 1px dashed #aaa;
            padding-bottom: 2px;
        }

        .label { font-weight: 800; text-transform: uppercase; color: #555; }
        .value { font-weight: 500; }

        .footer-note { font-size: 8px; color: #888; text-align: right; margin-top: 15px; font-style: italic; }

        .hidden { display: none !important; }
        .empty-msg { text-align: center; color: #666; font-size: 11px; margin-top: 50px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="nav-header">
        <div class="breadcrumb">DATABASE://BLACKLIST/<span id="agentDisplay">...</span></div>
        <button class="back-home" onclick="window.location.href='dashboard.html'">DASHBOARD</button>
    </div>

    <div id="explorerRoot">
        <div class="explorer-grid">
            <div class="folder-item" onclick="openFolder('R8P')">
                <div class="folder-icon"></div>
                <div class="folder-name">R8P_FILES</div>
            </div>
            <div class="folder-item" onclick="openFolder('RMN14')">
                <div class="folder-icon"></div>
                <div class="folder-name">RMN14_FILES</div>
            </div>
        </div>
    </div>

    <div id="fileView" class="file-view-container">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
            <button class="back-home" onclick="closeFolder()"><< BACK</button>
            <div style="font-size: 10px; color: var(--cyan);">DIR: <span id="currentFolder">...</span></div>
        </div>

        <div id="paperStack" class="paper-stack">
            </div>
    </div>

    <script>
        // 1. Firebase Setup
        const activeAgent = localStorage.getItem("cia_agent") || "GHOST";
        document.getElementById('agentDisplay').innerText = activeAgent;

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Navigation
        function openFolder(weapon) {
            document.getElementById('explorerRoot').classList.add('hidden');
            document.getElementById('fileView').classList.remove('hidden');
            document.getElementById('currentFolder').innerText = weapon;
            loadBlacklistData(weapon);
        }

        function closeFolder() {
            document.getElementById('fileView').classList.add('hidden');
            document.getElementById('explorerRoot').classList.remove('hidden');
        }

        // 3. Load Data from 'blacklist' collection
        function loadBlacklistData(weaponType) {
            const stack = document.getElementById('paperStack');
            stack.innerHTML = "<div style='color:var(--cyan); font-size:10px;'>DECRYPTING_BLACKLIST...</div>";

            // Direct fetch from 'blacklist' collection
            db.collection("blacklist").onSnapshot(snapshot => {
                stack.innerHTML = "";
                
                // CLIENT-SIDE FILTERING (No Index Required)
                const filtered = snapshot.docs.filter(doc => {
                    const data = doc.data();
                    const aMatch = data.agent && data.agent.toUpperCase() === activeAgent.toUpperCase();
                    const wMatch = data.weapon && data.weapon.toUpperCase() === weaponType.toUpperCase();
                    return aMatch && wMatch;
                });

                // Manual Sort: Newest First
                filtered.sort((a, b) => {
                    const tA = a.data().timestamp?.seconds || 0;
                    const tB = b.data().timestamp?.seconds || 0;
                    return tB - tA;
                });

                if(filtered.length === 0) {
                    stack.innerHTML = `<div class="empty-msg">EMPTY_DIRECTORY: NO RECORDS FOUND FOR ${weaponType}</div>`;
                    return;
                }

                filtered.forEach(doc => {
                    const data = doc.data();
                    
                    // Date Calculations
                    const dDate = data.timestamp ? data.timestamp.toDate() : new Date();
                    const tDate = new Date(dDate);
                    tDate.setDate(tDate.getDate() + 30); // Auto 30-Day Limit

                    const isExpired = new Date() > tDate;

                    stack.innerHTML += `
                        <div class="mission-paper">
                            <div class="stamp">BLACKLISTED</div>
                            <div class="paper-header">MISSION ORDER: #${data.missionOrder || 'N/A'}</div>
                            
                            <div class="data-row">
                                <span class="label">V-ID:</span>
                                <span class="value">V-${data.vid || '0000'}</span>
                            </div>
                            
                            <div class="data-row">
                                <span class="label">EXPENSES:</span>
                                <span class="value">PHP 0.00</span>
                            </div>

                            <div class="data-row">
                                <span class="label">DEPLOYMENT_DATE:</span>
                                <span class="value">${dDate.toLocaleDateString()}</span>
                            </div>

                            <div class="data-row" style="${isExpired ? 'color:var(--red); font-weight:800;' : ''}">
                                <span class="label">TERMINATION_DATE:</span>
                                <span class="value">${tDate.toLocaleDateString()} ${isExpired ? '[EXPIRED]' : ''}</span>
                            </div>

                            <div class="footer-note">
                                ARCHIVE_REF: ${doc.id.substring(0,8).toUpperCase()}
                            </div>
                        </div>
                    `;
                });
            }, error => {
                console.error(error);
                stack.innerHTML = "<div style='color:red; font-size:10px;'>ACCESS_DENIED: CHECK CONNECTION.</div>";
            });
        }
    </script>
</body>
</html>
