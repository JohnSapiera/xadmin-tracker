<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASHBOARD TEST</title>
    <style>
        body { background: black; color: cyan; font-family: monospace; padding: 20px; }
        button { background: cyan; color: black; padding: 15px; margin: 10px; font-size: 18px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); padding: 50px; }
        .popup { background: #111; padding: 20px; border: 1px solid cyan; }
        input { display: block; margin: 10px 0; padding: 10px; width: 90%; }
    </style>
</head>
<body>

<h1>DASHBOARD TEST</h1>
<p>Agent: <span id="prof-name">Loading...</span></p>

<button id="action-btn">OPEN MODAL</button>

<div id="modal-overlay" class="overlay">
    <div class="popup">
        <h3>Save Mission</h3>
        <input type="text" id="v-agent-input" placeholder="vAgent ID">
        <button id="modal-submit">CONFIRM</button>
        <button id="modal-close">CANCEL</button>
    </div>
</div>

<script>
    // Set agent
    const agent = localStorage.getItem("cia_agent") || "AGENT_LZ";
    document.getElementById('prof-name').innerText = agent;
    
    // Get elements
    const actionBtn = document.getElementById('action-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalSubmit = document.getElementById('modal-submit');
    const modalClose = document.getElementById('modal-close');
    
    // Open modal
    actionBtn.onclick = () => {
        console.log("Open modal");
        modalOverlay.style.display = 'flex';
    };
    
    // Close modal
    modalClose.onclick = () => {
        modalOverlay.style.display = 'none';
    };
    
    // Submit button
    modalSubmit.onclick = () => {
        const vID = document.getElementById('v-agent-input').value;
        alert("Confirm clicked! vAgent: " + vID);
        modalOverlay.style.display = 'none';
    };
    
    console.log("Test page loaded");
    alert("Page loaded! Click OPEN MODAL then CONFIRM");
</script>

</body>
</html>
