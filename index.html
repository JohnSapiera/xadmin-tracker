<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIA - AUTHORIZATION REQUIRED</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;800&display=swap" rel="stylesheet">
    <style>
        body { background: #050506; color: #00f2ff; font-family: 'JetBrains Mono'; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { width: 300px; padding: 40px; border: 1px solid #00f2ff; text-align: center; background: rgba(0,0,0,0.8); }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #000; border: 1px solid #333; color: #00f2ff; text-align: center; outline: none; }
        button { width: 100%; padding: 12px; background: transparent; border: 1px solid #00f2ff; color: #00f2ff; cursor: pointer; font-weight: 800; }
        button:hover { background: #00f2ff; color: #000; }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="font-size: 10px; margin-bottom: 20px; letter-spacing: 2px;">SECURE_GATEWAY_v2</div>
        <input type="text" id="agentInput" placeholder="ENTER CODENAME">
        <button onclick="auth()">AUTHORIZE</button>
    </div>

    <script>
        const TG_URL = "https://api.telegram.org/bot8639737111:AAGvCqiHzkiJvVqH6YPocRIVMoiXZlK4ZWg/sendMessage?chat_id=7298607329";
        const validAgents = ["LZ", "JFSN"];

        async function auth() {
            const code = document.getElementById('agentInput').value.trim().toUpperCase();
            if (validAgents.includes(code)) {
                localStorage.setItem("cia_agent", code);
                await fetch(`${TG_URL}&text=${encodeURIComponent("🔓 LOGIN: Agent [" + code + "] has accessed the terminal.")}`);
                window.location.href = "dashboard.html";
            } else {
                alert("ACCESS DENIED: INVALID CODENAME");
                fetch(`${TG_URL}&text=${encodeURIComponent("⚠️ ALERT: Unauthorized login attempt with code: " + code)}`);
            }
        }
    </script>
</body>
</html>
