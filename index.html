<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_AUTH_v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #01080b; --cyan: #00f2ff; --red: #ff003c; --green: #00ff66; }
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        
        body { 
            background: var(--bg); color: var(--cyan); 
            font-family: 'Share Tech Mono', monospace;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        /* Tactical UI Box */
        .auth-container {
            width: 350px; padding: 40px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid var(--cyan);
            position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            clip-path: polygon(0 15%, 10% 0, 100% 0, 100% 85%, 90% 100%, 0 100%);
        }

        .header { font-size: 10px; letter-spacing: 5px; opacity: 0.5; margin-bottom: 30px; text-align: center; }
        
        input {
            width: 100%; background: rgba(0, 242, 255, 0.05);
            border: 1px solid rgba(0, 242, 255, 0.2);
            padding: 15px; color: var(--cyan);
            font-family: 'Share Tech Mono'; text-align: center;
            font-size: 18px; outline: none; margin-bottom: 20px;
            transition: 0.3s;
        }

        input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        button {
            width: 100%; padding: 15px; background: transparent;
            border: 1px solid var(--cyan); color: var(--cyan);
            font-family: 'Share Tech Mono'; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }

        button:hover { background: var(--cyan); color: var(--bg); font-weight: bold; }

        #status {
            margin-top: 25px; font-size: 12px; text-align: center;
            height: 15px; letter-spacing: 1px;
        }

        /* Glitch Effect on Denied */
        .denied { color: var(--red) !important; animation: shake 0.2s infinite; }
        @keyframes shake { 0% { x:0; } 25% { transform: translateX(2px); } 50% { transform: translateX(-2px); } 100% { transform: x:0; } }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header">DECRYPT_ACCESS_KEY</div>
        
        <input type="password" id="keyInput" placeholder="********" autocomplete="off">
        <button id="authBtn">AUTHORIZE</button>

        <div id="status">SYSTEM_IDLE</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('authBtn').addEventListener('click', async () => {
            const key = document.getElementById('keyInput').value;
            const status = document.getElementById('status');

            if(!key) return;

            status.innerText = "AUTHENTICATING...";
            status.classList.remove('denied');

            try {
                // Hahanapin natin ang agent na may match na secretKey at status ay true
                const snap = await db.collection("agents")
                                     .where("secretKey", "==", key)
                                     .where("status", "==", true)
                                     .get();

                if (!snap.empty) {
                    const agentData = snap.docs[0].data();
                    status.innerText = "ACCESS_GRANTED";
                    status.style.color = "var(--green)";

                    // SECURED STORAGE: Naglalagay tayo ng timestamp para sa session validation
                    const sessionToken = {
                        agent: agentData.agent,
                        authorized: true,
                        expiry: Date.now() + (1000 * 60 * 60) // Valid for 1 hour
                    };
                    
                    localStorage.setItem("session_token", btoa(JSON.stringify(sessionToken)));

                    setTimeout(() => {
                        window.location.replace("dashboard.html");
                    }, 1000);
                } else {
                    status.innerText = "INVALID_KEY_OR_REVOKED";
                    status.classList.add('denied');
                    localStorage.clear();
                }
            } catch (e) {
                status.innerText = "CONNECTION_ERROR";
            }
        });
    </script>
</body>
</html>
