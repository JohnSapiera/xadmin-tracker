<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOSSAD - MOBILE TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(10, 10, 14, 0.98);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --border: rgba(0, 242, 255, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Tactical Overlay */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px; z-index: 9999; pointer-events: none;
        }

        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: #000;
            border-bottom: 1px solid var(--accent-cyan); font-size: 9px;
            letter-spacing: 1px; color: var(--accent-cyan);
        }

        /* Responsive Dashboard */
        .dashboard {
            display: flex; flex-direction: column;
            flex-grow: 1; overflow: hidden; position: relative;
        }

        .panel {
            display: none; /* Hidden by default on mobile, toggled by nav */
            flex-direction: column; height: 100%; background: var(--panel-bg);
        }

        .panel.active { display: flex; }

        /* Desktop View Overrides */
        @media (min-width: 900px) {
            .dashboard { display: grid; grid-template-columns: 320px 1fr 320px; gap: 10px; padding: 10px; }
            .panel { display: flex !important; border: 1px solid var(--border); }
            .mobile-nav { display: none !important; }
        }

        .panel-header {
            padding: 12px; font-size: 10px; font-weight: 800;
            background: rgba(0, 242, 255, 0.07); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* Mobile Bottom Nav */
        .mobile-nav {
            display: flex; background: #000; border-top: 1px solid var(--accent-cyan);
            height: 60px; justify-content: space-around; align-items: center;
            z-index: 1000;
        }

        .nav-item {
            color: #444; font-size: 10px; text-align: center; cursor: pointer;
            display: flex; flex-direction: column; gap: 4px;
        }

        .nav-item.active { color: var(--accent-cyan); font-weight: 800; }

        /* Content Areas */
        .scroll-area { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .bounty-card { 
            border-left: 3px solid var(--accent-cyan); 
            padding: 12px; margin-bottom: 10px; 
            background: rgba(255,255,255,0.03); font-size: 11px;
        }

        /* Comms Interface */
        .chat-msg { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 4px; margin-bottom: 10px; border-left: 1px solid #333; }
        .chat-input-row { padding: 15px; background: #08080a; border-top: 1px solid var(--border); padding-bottom: 25px; }
        
        input, button { border-radius: 0; -webkit-appearance: none; }
        input[type="text"], input[type="number"] {
            background: #000; border: 1px solid #222; color: var(--accent-cyan);
            padding: 12px; font-family: inherit; font-size: 16px; width: 100%;
        }

        .execute-btn { 
            background: var(--accent-cyan); color: #000; border: none; 
            padding: 15px; font-weight: 800; width: 100%; cursor: pointer;
            letter-spacing: 2px;
        }

        /* Floating Scan Info */
        .scan-overlay {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--accent-cyan);
            padding: 15px; border-radius: 4px; margin-top: 10px;
        }

        .terminal-log {
            height: 150px; background: #000; padding: 10px; font-size: 10px;
            overflow-y: auto; color: #00ff00; border: 1px solid #111; margin-top: 10px;
        }

        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.98); display:none; justify-content:center; align-items:center; z-index:9999;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
</head>
<body>

    <nav class="status-header">
        <div id="agentBadge" onclick="window.location.href='profile.html'">AGENT: GHOST</div>
        <div id="clock">00:00:00</div>
    </nav>

    <div class="dashboard">
        
        <div class="panel active" id="panel-bounty">
            <div class="panel-header">🎯 BOUNTY_REPORTS</div>
            <div class="scroll-area" id="bountyDisplay"></div>
            <div style="padding: 15px;">
                <button class="execute-btn" onclick="openBountyModal()">+ INITIALIZE TARGET</button>
            </div>
        </div>

        <div class="panel" id="panel-comms">
            <div class="panel-header">📡 COMMS_ENCRYPTED</div>
            <div class="scroll-area" id="chatFeed"></div>
            <div class="chat-input-row">
                <div style="display:flex; gap:8px;">
                    <button style="background:#111; color:white; border:1px solid #333; padding:0 15px;" onclick="document.getElementById('photoInput').click()">📁</button>
                    <input type="text" id="chatInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:var(--accent-cyan); color:#000; padding:0 15px; font-weight:800;">SEND</button>
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="attachPhoto(this)">
            </div>
        </div>

        <div class="panel" id="panel-scanner">
            <div class="panel-header">🔒 TERMINATION_SCANNER</div>
            <div class="scroll-area">
                <label style="font-size: 9px; color: var(--accent-cyan);">INPUT MISSION ORDER:</label>
                <input type="text" id="scanInput" placeholder="4-5 DIGIT CODE" oninput="autoScanMission(this.value)" style="margin-top:5px;">
                
                <div id="scanResult"></div>
                <div class="terminal-log" id="banLog">> Scanner Standby...</div>

                <div id="confirmFinal" class="hidden scan-overlay">
                    <div id="finalIntel" style="font-size: 11px; margin-bottom: 15px; line-height:1.6;"></div>
                    <div style="display:flex; gap:10px;">
                        <button onclick="executeFinalLog()" style="flex:1; background:#00ff00; color:#000; border:none; padding:12px; font-weight:800;">CONFIRM</button>
                        <button onclick="cancelScan()" style="flex:1; background:#222; color:#fff; border:none; padding:12px;">ABORT</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="mobile-nav">
        <div class="nav-item active" onclick="switchPanel('bounty', this)">
            <span>🎯</span><span>BOUNTY</span>
        </div>
        <div class="nav-item" onclick="switchPanel('comms', this)">
            <span>📡</span><span>COMMS</span>
        </div>
        <div class="nav-item" onclick="switchPanel('scanner', this)">
            <span>🔒</span><span>SCANNER</span>
        </div>
    </div>

    <div class="modal-overlay" id="bountyModal">
        <div style="background:#0a0a0c; border:1px solid var(--accent-cyan); width:90%; max-width:320px; padding:25px;">
            <div id="modalStep1" class="modal-step active-step">
                <p style="font-size:10px; color:var(--accent-cyan); margin-bottom:15px;">SELECT WEAPON:</p>
                <div id="weaponOptions" style="display:flex; flex-direction:column; gap:10px;"></div>
                <button onclick="closeModal()" style="margin-top:20px; background:none; border:none; color:#555; width:100%;">[ CLOSE ]</button>
            </div>
            <div id="modalStep2" class="modal-step" style="display:none;">
                <p style="font-size:10px; color:var(--accent-cyan); margin-bottom:15px;">TARGET INTEL:</p>
                <input type="text" id="mOrder" placeholder="MISSION ORDER #" style="margin-bottom:10px;">
                <input type="number" id="vID" placeholder="V-AGENT ID" style="margin-bottom:10px;">
                <input type="number" id="bAmount" placeholder="AMOUNT (₱)" style="margin-bottom:20px;">
                <button class="execute-btn" onclick="saveBounty()">DEPLOY DATA</button>
                <button onclick="openBountyModal()" style="margin-top:10px; background:none; border:none; color:#555; width:100%;">BACK</button>
            </div>
        </div>
    </div>

    <script>
        // --- MOBILE NAV LOGIC ---
        function switchPanel(panelId, el) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('panel-' + panelId).classList.add('active');
            el.classList.add('active');
        }

        // --- FIREBASE CONFIG (SAME AS BEFORE) ---
        const activeAgent = localStorage.getItem("cia_agent");
        if (!activeAgent) window.location.href = "index.html";
        document.getElementById('agentBadge').innerText = `AGENT: ${activeAgent}`;

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const TG_URL = "https://api.telegram.org/bot8639737111:AAGvCqiHzkiJvVqH6YPocRIVMoiXZlK4ZWg/sendMessage?chat_id=7298607329";

        // (Insert previous JavaScript functions here: sendMsg, saveBounty, autoScanMission, etc.)
        // Siguraduhin lang na i-update ang IDs sa JS para mag-match sa bagong HTML.
        
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
