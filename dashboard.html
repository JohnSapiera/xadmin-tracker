<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSSAD - ENCRYPTED TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(18, 18, 24, 0.95);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --text-dim: #626a77;
            --border: rgba(0, 242, 255, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 2px, 3px 100%;
        }

        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 20px; background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid var(--accent-cyan); font-size: 10px;
            letter-spacing: 1px; color: var(--accent-cyan);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            gap: 12px; padding: 12px; flex-grow: 1; overflow: hidden;
        }

        .panel {
            background: var(--panel-bg); border: 1px solid var(--border);
            display: flex; flex-direction: column; border-radius: 2px; overflow: hidden;
        }

        .panel-header {
            padding: 10px; font-size: 10px; font-weight: 800;
            background: rgba(0, 242, 255, 0.05); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            letter-spacing: 2px;
        }

        /* PORTAL 1: BOUNTY */
        .bounty-list { flex-grow: 1; padding: 10px; font-size: 10px; overflow-y: auto; }
        .bounty-card { 
            border-left: 2px solid var(--accent-cyan); 
            padding: 10px; margin-bottom: 8px; 
            background: rgba(255,255,255,0.02);
            transition: 0.3s;
        }
        .bounty-card:hover { background: rgba(0, 242, 255, 0.05); }

        .add-bounty-btn { 
            background: transparent; border: 1px solid var(--accent-cyan); 
            color: var(--accent-cyan); padding: 12px; margin: 10px; 
            cursor: pointer; font-family: inherit; font-weight: 800;
            transition: 0.3s;
        }
        .add-bounty-btn:hover { background: var(--accent-cyan); color: #000; }

        /* PORTAL 2: CHATS */
        .chat-area { flex-grow: 1; overflow-y: auto; padding: 15px; font-size: 11px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.05); }
        .chat-img { max-width: 100%; border-radius: 2px; margin-top: 8px; border: 1px solid #333; max-height: 250px; }
        
        .chat-input-row { padding: 12px; background: #000; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); }
        .input-controls { display: flex; gap: 5px; }

        /* PORTAL 3: TERMINATION */
        .ban-container { padding: 15px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        input[type="text"], input[type="number"], textarea {
            background: #08080a; border: 1px solid #222; color: var(--accent-cyan);
            padding: 12px; font-family: inherit; width: 100%; outline: none; font-size: 11px;
        }
        .execute-btn { background: var(--danger-red); color: white; border: none; padding: 12px; font-weight: 800; cursor: pointer; }
        .terminal-log { height: 180px; background: #000; padding: 10px; font-size: 10px; overflow-y: auto; color: #00ff00; border: 1px solid #111; }

        /* MODAL */
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:none; justify-content:center; align-items:center; z-index:999; }
        .modal-box { background: #0a0a0c; border: 1px solid var(--accent-cyan); width: 300px; padding: 20px; text-align: center; }
        .modal-step { display: none; flex-direction: column; gap: 10px; }
        .active-step { display: flex; }
        .option-btn { background: #111; border: 1px solid #333; color: #fff; padding: 12px; cursor: pointer; font-family: inherit; }
        .option-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.2; } }
        .hidden { display: none !important; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
</head>
<body>

    <nav class="status-header">
        <div style="display:flex; align-items:center; gap:15px;">
            <div id="agentBadge" style="background:var(--accent-cyan); color:#000; padding:2px 8px; font-weight:800; border-radius:2px;">AGENT: GHOST</div>
            <div onclick="window.location.href='profile.html'" style="cursor:pointer; text-decoration:underline;">[MY_PROFILE]</div>
        </div>
        <div class="blink" id="dbStatus">● MOSSAD SECRET SERVICE ONLINE</div>
        <div id="clock">00:00:00</div>
    </nav>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">BOUNTY_REPORTS</div>
            <div class="bounty-list" id="bountyDisplay"></div>
            <button class="add-bounty-btn" onclick="openBountyModal()">+ INITIALIZE TARGET</button>
        </div>

        <div class="panel">
            <div class="panel-header">COMMS_CHANNEL_SECURE</div>
            <div class="chat-area" id="chatFeed"></div>
            <div class="chat-input-row">
                <div id="photoStatus" style="font-size: 9px; color: var(--accent-cyan); display: none; margin-bottom:5px;">[SECURE_FILE_ATTACHED]</div>
                <div class="input-controls">
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="attachPhoto(this)">
                    <button style="background:#111; color:white; border:1px solid #333; padding:0 15px; cursor:pointer;" onclick="document.getElementById('photoInput').click()">📁</button>
                    <input type="text" id="chatInput" placeholder="Send encrypted message..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:var(--accent-cyan); color:#000; border:none; padding:0 20px; font-weight:800; cursor:pointer;">SEND</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span onclick="toggleBulkMode()" style="cursor:pointer;">TERMINATION_PROTOCOL</span>
                <span id="modeStatus" style="font-size: 8px; color: var(--text-dim);">SINGLE</span>
            </div>
            <div class="ban-container">
                <input type="text" id="singleCode" placeholder="Search target code..." oninput="autoSearch(this.value)">
                <textarea id="bulkCodes" class="hidden" placeholder="Paste bulk codes..."></textarea>
                <button class="execute-btn" onclick="processBan()">EXECUTE BLACKLIST</button>
                <div class="terminal-log" id="banLog">> Terminal online. Awaiting target data...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bountyModal">
        <div class="modal-box">
            <div id="modalStep1" class="modal-step active-step">
                <p style="font-size:10px; color:var(--accent-cyan); margin-bottom:15px;">SELECT WEAPON SYSTEM:</p>
                <div id="weaponOptions" style="display:flex; flex-direction:column; gap:8px;"></div>
                <button onclick="closeModal()" style="margin-top:15px; background:none; border:none; color:#555; cursor:pointer; font-size:10px;">ABORT</button>
            </div>
            <div id="modalStep2" class="modal-step">
                <p style="font-size:10px; color:var(--accent-cyan); margin-bottom:15px;">TARGET_INTEL:</p>
                <input type="number" id="vID" placeholder="V-Agent Number (e.g. 5566)">
                <div style="margin-bottom:10px;"></div>
                <input type="number" id="bAmount" placeholder="Bounty Amount (₱)">
                <div style="margin-bottom:15px;"></div>
                <button class="execute-btn" style="background:var(--accent-cyan); color:#000; width:100%;" onclick="saveBounty()">DEPLOY DATA</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIG & AUTH ---
        const activeAgent = localStorage.getItem("cia_agent");
        if (!activeAgent) window.location.href = "index.html";
        document.getElementById('agentBadge').innerText = `AGENT: ${activeAgent}`;

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const TG_URL = "https://api.telegram.org/bot8639737111:AAGvCqiHzkiJvVqH6YPocRIVMoiXZlK4ZWg/sendMessage?chat_id=7298607329";

        // --- 2. CHAT LOGIC ---
        let pendingPhotoData = null;
        function attachPhoto(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => { pendingPhotoData = e.target.result; document.getElementById('photoStatus').style.display='block'; };
                reader.readAsDataURL(file);
            }
        }

        async function sendMsg() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text && !pendingPhotoData) return;

            let imageUrl = null;
            if(pendingPhotoData) {
                const ref = storage.ref().child(`chats/${Date.now()}.jpg`);
                await ref.putString(pendingPhotoData, 'data_url');
                imageUrl = await ref.getDownloadURL();
            }

            await db.collection("chats").add({
                agent: activeAgent, text, imageUrl, timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            input.value = ""; pendingPhotoData = null;
            document.getElementById('photoStatus').style.display = 'none';
        }

        db.collection("chats").orderBy("timestamp", "asc").onSnapshot(snap => {
            const feed = document.getElementById('chatFeed'); feed.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                feed.innerHTML += `
                    <div class="chat-msg">
                        <span style="color:var(--accent-cyan)">[${d.agent}]:</span> ${d.text}
                        ${d.imageUrl ? `<br><img src="${d.imageUrl}" class="chat-img">` : ''}
                    </div>`;
            });
            feed.scrollTop = feed.scrollHeight;
        });

        // --- 3. BOUNTY LOGIC (IMPROVED) ---
        let selectedWeapon = "";
        function openBountyModal() {
            document.getElementById('bountyModal').style.display = 'flex';
            document.getElementById('modalStep1').classList.add('active-step');
            document.getElementById('modalStep2').classList.remove('active-step');
            
            const weaponsDiv = document.getElementById('weaponOptions');
            weaponsDiv.innerHTML = "";
            const list = activeAgent === 'LZ' ? ['R8', 'RM14'] : ['R9', 'TechCP'];
            list.forEach(w => weaponsDiv.innerHTML += `<button class="option-btn" onclick="selectWeapon('${w}')">${w}</button>`);
        }

        function selectWeapon(w) {
            selectedWeapon = w;
            document.getElementById('modalStep1').classList.remove('active-step');
            document.getElementById('modalStep2').classList.add('active-step');
        }

        async function saveBounty() {
            const vid = document.getElementById('vID').value;
            const amt = document.getElementById('bAmount').value;
            if(!vid || !amt) return;

            await db.collection("bounties").add({
                agent: activeAgent, weapon: selectedWeapon, vid, amt,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            fetch(`${TG_URL}&text=${encodeURIComponent(`📡 AGENT [${activeAgent}]: Deployed Bounty V-ID:${vid} (₱${amt})`)}`);
            closeModal();
            document.getElementById('vID').value = ""; document.getElementById('bAmount').value = "";
        }

        function closeModal() { document.getElementById('bountyModal').style.display = 'none'; }

        db.collection("bounties").orderBy("timestamp", "desc").onSnapshot(snap => {
            const list = document.getElementById('bountyDisplay'); list.innerHTML = "";
            snap.forEach(doc => {
                const b = doc.data();
                list.innerHTML += `
                    <div class="bounty-card">
                        <div style="color:var(--accent-cyan); font-weight:800;">${b.agent} >> ${b.weapon}</div>
                        <div style="margin-top:4px;">V-ID: #${b.vid} | BOUNTY: ₱${b.amt}</div>
                    </div>`;
            });
        });

        // --- 4. TERMINATION PROTOCOL ---
        let isBulk = false;
        function toggleBulkMode() {
            isBulk = !isBulk;
            document.getElementById('singleCode').classList.toggle('hidden');
            document.getElementById('bulkCodes').classList.toggle('hidden');
            document.getElementById('modeStatus').innerText = isBulk ? "BULK" : "SINGLE";
        }

        async function autoSearch(val) {
            if(!val) return;
            const log = document.getElementById('banLog');
            const snap = await db.collection("blacklist").where("code", "==", val.toUpperCase()).get();
            log.innerHTML = snap.empty ? `<div>> ID ${val} IS CLEAR.</div>` : `<div style="color:red">> WARNING: ID ${val} ALREADY BANNED.</div>`;
        }

        async function processBan() {
            const log = document.getElementById('banLog');
            let codes = isBulk ? document.getElementById('bulkCodes').value.split("\n") : [document.getElementById('singleCode').value];
            
            for(let c of codes) {
                let code = c.trim().toUpperCase();
                if(!code) continue;
                await db.collection("blacklist").add({ code, bannedBy: activeAgent, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                fetch(`${TG_URL}&text=${encodeURIComponent(`🚫 AGENT [${activeAgent}]: Terminated ID ${code}`)}`);
            }
            log.innerHTML += `<div style="color:#00ff00">> EXECUTION SUCCESSFUL.</div>`;
            document.getElementById('singleCode').value = ""; document.getElementById('bulkCodes').value = "";
        }

        function closeModal() { document.getElementById('bountyModal').style.display = 'none'; }
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
