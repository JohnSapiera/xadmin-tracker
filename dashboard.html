<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v9.0_REMASTERED</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #01080b; 
      --panel: rgba(2, 12, 18, 0.98); 
      --cyan: #00f3ff; 
      --red: #ff003c; 
      --blue: #007bff; 
      --green: #00ff66; 
      --border: rgba(0, 243, 255, 0.3); 
      --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: 0%; } }
    @keyframes glitch { 0% { clip: rect(44px, 450px, 56px, 0); } 10% { clip: rect(12px, 450px, 30px, 0); } 20% { clip: rect(60px, 450px, 70px, 0); } 100% { clip: rect(44px, 450px, 56px, 0); } }
    @keyframes pulse-cyan { 0%, 100% { box-shadow: 0 0 5px var(--cyan); } 50% { box-shadow: 0 0 20px var(--cyan); } }

    body { 
        background: var(--bg); 
        color: #c8e1e5; 
        font-family: 'Rajdhani', sans-serif; 
        height: 100vh; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column;
    }

    /* CIA Background Effects */
    body::before {
        content: ""; position: fixed; inset: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 100;
    }
    body::after {
        content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 2px;
        background: var(--cyan); opacity: 0.1; animation: scanline 8s linear infinite; pointer-events: none;
    }

    header { 
        padding: 12px 15px; background: #000; 
        border-bottom: 2px solid var(--cyan); 
        display: flex; justify-content: space-between; align-items: center; 
        position: relative; z-index: 110;
    }

    /* Animated Profile Button (Top Right) */
    .profile-trigger {
        background: transparent; border: 1px solid var(--cyan);
        color: var(--cyan); padding: 5px 12px; font-family: var(--mono);
        font-size: 10px; cursor: pointer; position: relative;
        overflow: hidden; transition: 0.3s; letter-spacing: 1px;
        animation: pulse-cyan 3s infinite;
    }
    .profile-trigger::after {
        content: "ACCESSING..."; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: var(--cyan); color: #000; display: flex; align-items: center;
        justify-content: center; transform: translateY(100%); transition: 0.3s;
    }
    .profile-trigger:active::after { transform: translateY(0); }

    .status-bar { 
        font-size: 9px; font-family: var(--mono); color: var(--cyan); 
        padding: 6px 15px; background: rgba(0, 243, 255, 0.05); 
        border-bottom: 1px solid var(--border); letter-spacing: 2px;
        display: flex; justify-content: space-between; text-transform: uppercase;
    }

    main { flex: 1; padding: 25px 20px; overflow-y: auto; padding-bottom: 110px; position: relative; }

    /* Module Container */
    .command-module { 
        background: var(--panel); border: 1px solid var(--border); 
        padding: 25px; position: relative;
        box-shadow: 0 0 30px rgba(0,0,0,1);
    }
    .command-module::before {
        content: ""; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px;
        border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
    }

    .box-label { font-family: var(--mono); font-size: 11px; color: var(--cyan); margin-bottom: 15px; letter-spacing: 2px; }

    /* Input Field Redesign */
    .input-wrapper { position: relative; margin-bottom: 20px; }
    #mission-input { 
      width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--cyan); 
      font-family: var(--mono); font-size: 42px; padding: 15px; text-align: center; 
      letter-spacing: 15px; outline: none; transition: 0.3s;
    }
    #mission-input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { 
        padding: 18px; font-family: var(--mono); font-size: 14px; font-weight: bold; 
        border: 1px solid; background: transparent; text-transform: uppercase; 
        cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
    }
    .btn:active { transform: scale(0.96); }

    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-save:hover { background: rgba(0, 255, 102, 0.1); }
    
    .btn-retrieve { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; box-shadow: 0 0 20px var(--blue); }
    
    .btn-terminate { color: var(--red); border-color: var(--red); }
    .btn-terminate:hover { background: rgba(255, 0, 60, 0.1); }

    .btn-prohibited { color: #333; border-color: #222; cursor: not-allowed; opacity: 0.5; background: #111 !important; }

    /* Decoy/Background Data - CIA Style */
    .bg-data-stream {
        font-family: var(--mono); font-size: 8px; color: rgba(0, 243, 255, 0.1);
        position: absolute; bottom: 100px; left: 20px; pointer-events: none;
    }

    /* Tactical Terminal */
    #terminal { 
        background: rgba(0,0,0,0.8); border: 1px solid #111; padding: 15px; 
        font-family: var(--mono); font-size: 11px; height: 150px; color: #4a5a61; 
        margin-top: 25px; overflow-y: auto; border-radius: 2px;
        line-height: 1.5;
    }

    /* Modal System */
    .modal-overlay { 
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
      z-index: 1000; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(10px);
    }
    .modal-content { 
      background: #000; border: 1px solid var(--cyan); width: 100%; max-width: 340px; 
      padding: 40px 25px; position: relative; box-shadow: 0 0 50px rgba(0, 243, 255, 0.2);
    }
    .modal-close { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; border: none; padding: 12px 18px; cursor: pointer; font-family: var(--mono); }

    .form-id { font-size: 32px; color: var(--cyan); text-align: center; margin-bottom: 30px; font-family: var(--mono); text-shadow: 0 0 10px var(--cyan); }
    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; }
    .data-label { font-size: 10px; color: #555; text-transform: uppercase; font-family: var(--mono); }
    .data-val { font-size: 15px; font-family: var(--mono); color: #fff; }
    .m-input { background: #080808; border: 1px solid #222; color: var(--cyan); width: 140px; text-align: right; font-family: var(--mono); padding: 8px; outline: none; }
    .m-input:focus { border-color: var(--cyan); }

    .btn-initiate { width: 100%; margin-top: 20px; background: var(--green); color: #000; border: none; padding: 20px; font-family: var(--mono); font-weight: bold; cursor: pointer; font-size: 14px; letter-spacing: 2px; }

    /* Nav Bar */
    nav { 
        position: fixed; bottom: 0; width: 100%; height: 80px; 
        background: #000; border-top: 2px solid var(--border); 
        display: grid; grid-template-columns: 1fr 1fr; z-index: 100;
    }
    .nav-btn { 
        display: flex; flex-direction: column; align-items: center; 
        justify-content: center; color: #333; font-size: 11px; 
        font-family: var(--mono); text-decoration: none; transition: 0.3s;
        letter-spacing: 2px;
    }
    .nav-btn.active { color: var(--cyan); background: rgba(0, 243, 255, 0.05); border-top: 4px solid var(--cyan); }
    .nav-ico { font-size: 24px; margin-bottom: 6px; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:15px; height:15px; border:2px solid var(--cyan); margin-right:12px; animation: glitch 2s infinite;"></div>
    <span style="font-family: var(--mono); font-size: 15px; font-weight: bold; letter-spacing: 3px; color: var(--cyan);">CENTRAL_NODE</span>
  </div>
  <button class="profile-trigger" onclick="window.location.href='profile.html'">AGENT_PROFILE</button>
</header>

<div class="status-bar">
    <span id="clock">00:00:00</span>
    <span id="device-tag">LINK: SECURE</span>
</div>

<main>
  <div class="command-module">
    <div class="box-label">// INITIATE_DATA_ENCRYPTION_SCAN</div>
    <div class="input-wrapper">
        <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
    </div>
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE_DATA</button>
      <button id="term-btn" class="btn btn-terminate">TERMINATE</button>
    </div>
  </div>

  <div class="bg-data-stream">
      TRX_LOG: 0x882...PENDING<br>
      IP_STAMP: 192.168.1.1<br>
      UPLINK_STATUS: OPTIMAL
  </div>

  <div id="terminal">> SYSTEM_READY...<br>> ENCRYPTION_LAYER_ACTIVE...</div>
</main>

<div id="entry-modal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="form-id" id="m-id-display">#00000</div>
    
    <div class="data-row">
      <span class="data-label">V-Agent_Signature</span>
      <input type="tel" id="input-vagent" class="m-input" placeholder="REQUIRED">
    </div>
    <div class="data-row">
      <span class="data-label">Resource_Cost</span>
      <span class="data-val" style="color: var(--green);">0.00 PHP</span>
    </div>
    <div class="data-row">
      <span class="data-label">Deployment_TS</span>
      <span class="data-val" id="m-dep">--</span>
    </div>
    <div class="data-row">
      <span class="data-label">Expiration_TS</span>
      <span class="data-val" id="m-expir" style="color: var(--red);">--</span>
    </div>
    <div id="status-box" style="text-align: center; font-size: 11px; color: var(--cyan); margin-top: 15px; font-family: var(--mono); opacity: 0.6; text-transform: uppercase;"></div>
    
    <button id="initiate-btn" class="btn btn-initiate">CONFIRM_UPLINK</button>
  </div>
</div>

<nav>
  <a href="#" class="nav-btn active">
      <span class="nav-ico">⬢</span>
      DASHBOARD
  </a>
  <a href="intel.html" class="nav-btn">
      <span class="nav-ico">◰</span>
      INTEL
  </a>
</nav>

<script type="module">
  // FIREBASE LOGIC (WALA PONG BINURA)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:d996e585751d5087cd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const termBtn = document.getElementById('term-btn');
  const initiateBtn = document.getElementById('initiate-btn');
  const vagentInput = document.getElementById('input-vagent');
  const termLog = document.getElementById('terminal');
  const deviceTag = document.getElementById('device-tag');
  
  let currentData = null;
  let accessStatus = "NEW";
  const linkedDeviceName = localStorage.getItem("device_uuid") || "UNRECOGNIZED_NODE";
  deviceTag.textContent = `NODE: ${linkedDeviceName}`;

  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    if (val.length >= 4) {
      log(`SCANNING DATABASE...`, 'cyan');
      try {
        const qB = query(collection(db, "blacklist"), where("targetID", "==", val));
        const sB = await getDocs(qB);
        if (!sB.empty) {
          accessStatus = "PROHIBITED";
          updateButton("PROHIBITED", "btn-prohibited");
          log(`TARGET ${val} BLACKLISTED. ACCESS DENIED.`, 'red');
          return;
        }

        const qM = query(collection(db, "mission_orders"), where("orderNumber", "==", val));
        const sM = await getDocs(qM);
        if (!sM.empty) {
          const data = sM.docs[0].data();
          const expDate = data.expirationDate.toDate ? data.expirationDate.toDate() : new Date(data.expirationDate);
          
          if (new Date() > expDate) {
            log(`DECRYPTION FAILED: ID ${val} EXPIRED.`, 'red');
            await addDoc(collection(db, "blacklist"), { targetID: val, reason: "AUTO_EXPIRY", timestamp: serverTimestamp() });
            accessStatus = "PROHIBITED";
            updateButton("PROHIBITED", "btn-prohibited");
          } else {
            accessStatus = "AUTHORIZED";
            currentData = data;
            updateButton("RETRIEVE", "btn-retrieve");
            log(`ACCESS GRANTED: ID ${val} AUTHORIZED.`, 'blue');
          }
        } else {
          accessStatus = "NEW";
          updateButton("SAVE_DATA", "btn-save");
          log(`ID ${val} NOT IN RECORDS. READY TO SAVE.`, 'green');
        }
      } catch (err) { log("UPLINK_ERROR: DATABASE TIMEOUT", "red"); }
    } else { resetUI(); }
  });

  function updateButton(text, className) {
    actionBtn.textContent = text;
    actionBtn.className = `btn ${className}`;
  }

  function resetUI() {
    accessStatus = "NEW";
    updateButton("SAVE_DATA", "btn-save");
    currentData = null;
  }

  actionBtn.addEventListener('click', () => {
    if (accessStatus === "PROHIBITED" || input.value.length < 4) return;
    const val = input.value.trim();
    document.getElementById('m-id-display').textContent = `#${val}`;

    if (accessStatus === "NEW") {
      const depDate = new Date();
      const expDate = new Date();
      expDate.setDate(depDate.getDate() + 30);
      vagentInput.value = ""; vagentInput.readOnly = false;
      document.getElementById('m-dep').textContent = depDate.toLocaleDateString();
      document.getElementById('m-expir').textContent = expDate.toLocaleDateString();
      initiateBtn.style.display = "block";
      document.getElementById('status-box').textContent = "AWAITING AGENT SIGNATURE";
    } else {
      const dep = currentData.deploymentDate.toDate ? currentData.deploymentDate.toDate() : new Date(currentData.deploymentDate);
      const exp = currentData.expirationDate.toDate ? currentData.expirationDate.toDate() : new Date(currentData.expirationDate);
      vagentInput.value = currentData.vAgent;
      vagentInput.readOnly = true;
      document.getElementById('m-dep').textContent = dep.toLocaleDateString();
      document.getElementById('m-expir').textContent = exp.toLocaleDateString();
      initiateBtn.style.display = "none";
      document.getElementById('status-box').textContent = "RECORD RETRIEVED SUCCESSFULLY";
    }
    document.getElementById('entry-modal').style.display = 'flex';
    if(accessStatus === "NEW") vagentInput.focus();
  });

  initiateBtn.addEventListener('click', async () => {
    const val = input.value.trim();
    const vAgentValue = vagentInput.value.trim();
    if (!vAgentValue) return;
    log(`EXECUTING UPLINK...`, 'green');
    initiateBtn.disabled = true; initiateBtn.textContent = "WAIT...";
    
    try {
      const depDate = new Date(document.getElementById('m-dep').textContent);
      const expDate = new Date(document.getElementById('m-expir').textContent);
      
      await addDoc(collection(db, "mission_orders"), {
        orderNumber: val, 
        vAgent: vAgentValue, 
        expenses: 0,
        deploymentDate: depDate, 
        expirationDate: expDate, 
        linkedDevice: linkedDeviceName, 
        agentName: localStorage.getItem("cia_agent") || "UNKNOWN",
        timestamp: serverTimestamp()
      });
      
      log(`MISSION ${val} SAVED TO CLOUD.`, 'green');
      closeModal();
      input.value = ""; resetUI();
    } catch (e) { log(`CRITICAL_FAILURE: ${e.message}`, 'red'); } finally {
      initiateBtn.disabled = false; initiateBtn.textContent = "CONFIRM_UPLINK";
    }
  });

  termBtn.addEventListener('click', async () => {
    const val = input.value.trim();
    if (val.length < 4 || !confirm(`CONFIRM TERMINATION OF #${val}?`)) return;
    await addDoc(collection(db, "blacklist"), { targetID: val, reason: "MANUAL_TERMINATION", timestamp: serverTimestamp() });
    log(`ID ${val} HAS BEEN TERMINATED.`, 'red');
    input.value = ""; resetUI();
  });

  window.closeModal = () => document.getElementById('entry-modal').style.display = 'none';
  function log(m, c) {
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.3">${new Date().toLocaleTimeString('en-GB')}</span> > <span style="color:var(--${c})">${m}</span>`;
    termLog.prepend(d);
  }
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
