<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Test</title>
    <style>
        body {
            background: #0a0c12;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
        }
        .box {
            background: #0d0f14;
            border: 1px solid #1f232c;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
            font-size: 14px;
        }
        input {
            background: #000;
            border: 1px solid #2a3240;
            padding: 12px;
            color: #00ff66;
            font-family: monospace;
            font-size: 20px;
            text-align: center;
            letter-spacing: 5px;
            border-radius: 8px;
            width: 120px;
        }
        .log {
            background: #03050a;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
            word-break: break-all;
            font-family: monospace;
        }
        .green { color: #00ff66; }
        .red { color: #ff4444; }
        .yellow { color: #ffaa33; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
    <h3>STEP 1: TEST CONNECTION</h3>
    <button id="testBtn">TEST SUPABASE CONNECTION</button>
    <div id="connectionLog" class="log">Click the button to test...</div>
</div>

<div class="box">
    <h3>STEP 2: REGISTER DEVICE</h3>
    <input type="text" id="masterKey" maxlength="4" placeholder="____">
    <br><br>
    <button id="registerBtn">REGISTER DEVICE</button>
    <div id="registerLog" class="log">Waiting...</div>
</div>

<script>
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    let supabase = null;
    
    function log(element, message, color) {
        element.innerHTML = message;
        element.className = 'log ' + color;
        console.log(message);
    }
    
    // TEST CONNECTION BUTTON
    document.getElementById('testBtn').onclick = async () => {
        const logDiv = document.getElementById('connectionLog');
        log(logDiv, 'Creating Supabase client...', 'yellow');
        
        try {
            // Create client
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            log(logDiv, 'Client created. Testing query...', 'yellow');
            
            // Try to fetch agents
            const { data, error, status } = await supabase
                .from('agents')
                .select('count', { count: 'exact', head: true });
            
            if (error) {
                log(logDiv, 'ERROR: ' + error.message + ' (Status: ' + status + ')', 'red');
                return;
            }
            
            log(logDiv, 'SUCCESS! Connected to Supabase.', 'green');
            
            // Now get actual data
            const { data: agents, error: agentsError } = await supabase
                .from('agents')
                .select('agent_name, secret_key');
            
            if (agentsError) {
                log(logDiv, 'Connected but cannot read agents: ' + agentsError.message, 'yellow');
                return;
            }
            
            if (!agents || agents.length === 0) {
                log(logDiv, 'Connected! But NO AGENTS found in database.', 'yellow');
                log(logDiv, 'Run this SQL in Supabase:<br>INSERT INTO agents (agent_name, secret_key) VALUES ("AGENT_LZ", "4646"), ("AGENT_JFSN", "1010");', 'yellow');
                return;
            }
            
            let msg = 'Connected! Found ' + agents.length + ' agent(s):<br>';
            agents.forEach(a => {
                msg += '• ' + a.agent_name + ' (key: ' + a.secret_key + ')<br>';
            });
            log(logDiv, msg, 'green');
            
        } catch(err) {
            log(logDiv, 'EXCEPTION: ' + err.message, 'red');
            console.error(err);
        }
    };
    
    // REGISTER BUTTON
    document.getElementById('registerBtn').onclick = async () => {
        const masterKey = document.getElementById('masterKey').value.trim();
        const logDiv = document.getElementById('registerLog');
        
        if (!masterKey || masterKey.length !== 4) {
            log(logDiv, 'Please enter a 4-digit master key', 'red');
            return;
        }
        
        if (!supabase) {
            log(logDiv, 'Please test connection first (Step 1)', 'red');
            return;
        }
        
        log(logDiv, 'Verifying key: ' + masterKey + '...', 'yellow');
        
        try {
            const { data, error } = await supabase
                .from('agents')
                .select('agent_name, secret_key, weapon_system')
                .eq('secret_key', masterKey)
                .maybeSingle();
            
            if (error) {
                log(logDiv, 'Database error: ' + error.message, 'red');
                return;
            }
            
            if (!data) {
                log(logDiv, 'INVALID KEY: ' + masterKey + ' not found in database', 'red');
                return;
            }
            
            // Generate device fingerprint
            let hash = 0;
            const raw = navigator.userAgent + screen.width + screen.height;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            }
            const fingerprint = 'DEV-' + Math.abs(hash).toString(16).toUpperCase().slice(0, 10);
            
            // Save to localStorage
            const registration = {
                agent_name: data.agent_name,
                secret_key: masterKey,
                device_fingerprint: fingerprint,
                devices: data.weapon_system || [],
                registered_at: new Date().toISOString(),
                is_registered: true
            };
            localStorage.setItem('cia_device_registration', JSON.stringify(registration));
            
            log(logDiv, 'SUCCESS! Registered as: ' + data.agent_name, 'green');
            
        } catch(err) {
            log(logDiv, 'Error: ' + err.message, 'red');
        }
    };
    
    // Check existing registration on load
    const saved = localStorage.getItem('cia_device_registration');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            document.getElementById('registerLog').innerHTML = 'Already registered as: ' + data.agent_name;
            document.getElementById('registerLog').className = 'log green';
        } catch(e) {}
    }
</script>
</body>
</html>
