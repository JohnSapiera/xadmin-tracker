<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT_ACCESS_TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .terminal {
            width: 100%;
            max-width: 400px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid rgba(0, 242, 255, 0.4);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,242,255,0.1);
        }
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f2ff;
            animation: scanMove 2s ease-in-out infinite;
            opacity: 0.6;
            pointer-events: none;
        }
        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .badge {
            font-size: 9px;
            letter-spacing: 3px;
            color: #4a5a61;
            margin-bottom: 6px;
        }
        .status-text {
            font-size: 12px;
            font-weight: bold;
            color: #00f2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .trace-container {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .trace-label {
            font-size: 8px;
            color: #5c7882;
        }
        .trace-value {
            font-size: 9px;
            color: #05ffa1;
            word-break: break-all;
            margin-top: 5px;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .key-btn {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #00f2ff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.1s ease;
        }
        .key-btn:active {
            transform: scale(0.92);
            background: #00f2ff;
            color: #000;
        }
        .code-area {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .code-digits {
            font-size: 32px;
            letter-spacing: 8px;
            color: #05ffa1;
            font-weight: bold;
        }
        .helper-text {
            font-size: 8px;
            color: #5c7882;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid #1a2f37;
            padding: 10px;
            color: #5c7882;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
        }
        .btn-danger {
            border-color: #ff003c;
            color: #ff003c;
        }
        .btn-danger:active {
            background: #ff003c20;
        }
        .btn:active {
            background: #1a2f3740;
        }
        .message-area {
            margin-top: 16px;
            font-size: 10px;
            min-height: 40px;
            padding: 6px;
        }
        .error-msg {
            color: #ff003c;
        }
        .success-msg {
            color: #00ff66;
        }
        .weapons-list {
            margin-top: 10px;
            padding: 8px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 4px;
        }
        .weapons-list span {
            color: #00f2ff;
            font-size: 9px;
        }
        .weapon-item {
            display: inline-block;
            background: #0a1f29;
            padding: 3px 8px;
            margin: 3px;
            border-radius: 3px;
            color: #05ffa1;
            font-size: 9px;
        }
        .loader {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 1px solid #00f2ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="terminal">
    <div class="scan-line"></div>
    
    <div class="header">
        <div class="badge">🔐 SUPABASE_AGENT_NEXUS</div>
        <div class="status-text" id="statusLabel">INITIALIZING_SCAN</div>
    </div>

    <div class="trace-container">
        <div class="trace-label">🖨️ DEVICE_FINGERPRINT</div>
        <div class="trace-value" id="deviceSig">-- SCANNING --</div>
    </div>

    <div id="keypadSection" class="hidden">
        <div class="code-area">
            <div class="code-digits" id="codeDisplay">────</div>
            <div class="helper-text">ENTER 4-DIGIT SECRET KEY</div>
        </div>
        
        <div class="keypad" id="numericKeypad"></div>
        
        <div class="action-buttons">
            <div class="btn btn-danger" id="clearBtn">⌫ CLEAR</div>
            <div class="btn" id="cancelBtn">✗ CANCEL</div>
        </div>
    </div>

    <div class="message-area" id="messageArea"></div>
    <div id="weaponsDisplay" class="weapons-list hidden"></div>
</div>

<script>
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    const statusLabel = document.getElementById('statusLabel');
    const deviceSigSpan = document.getElementById('deviceSig');
    const keypadSection = document.getElementById('keypadSection');
    const codeDisplay = document.getElementById('codeDisplay');
    const messageArea = document.getElementById('messageArea');
    const weaponsDisplay = document.getElementById('weaponsDisplay');
    
    let currentSignature = "";
    let enteredCode = "";
    let isProcessing = false;
    let supabaseClient = null;
    
    function showMessage(text, isError = false) {
        messageArea.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`;
        console.log(`${isError ? '❌' : '✅'}`, text);
        setTimeout(() => {
            if (messageArea.innerHTML.includes(text)) {
                messageArea.innerHTML = "";
            }
        }, 4000);
    }
    
    function displayWeapons(weaponsArray) {
        if (!weaponsArray || weaponsArray.length === 0) {
            weaponsDisplay.classList.add('hidden');
            return;
        }
        
        let weaponsHtml = '<span>🔫 WEAPON SYSTEMS:</span><br>';
        weaponsArray.forEach(weapon => {
            weaponsHtml += `<div class="weapon-item">⚔️ ${weapon}</div>`;
        });
        weaponsDisplay.innerHTML = weaponsHtml;
        weaponsDisplay.classList.remove('hidden');
    }
    
    function clearCode() {
        enteredCode = "";
        codeDisplay.innerText = "────";
    }
    
    function addDigit(digit) {
        if (enteredCode.length < 4 && !isProcessing) {
            enteredCode += digit;
            let displayStr = enteredCode + "────".substring(enteredCode.length);
            codeDisplay.innerText = displayStr;
            
            if (enteredCode.length === 4) {
                setTimeout(() => verifySecretKey(enteredCode), 100);
            }
        }
    }
    
    function generateSignature() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC";
        
        const specs = {
            gpu: gpu.split('/').pop().trim(),
            res: `${window.screen.width}x${window.screen.height}`,
            plt: navigator.platform,
            ua: navigator.userAgent.substring(0, 50)
        };
        
        const raw = specs.gpu + specs.res + specs.plt + specs.ua;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "SIG-" + Math.abs(hash).toString(16).toUpperCase().slice(0, 12);
    }
    
    async function verifySecretKey(secretKey) {
        if (isProcessing) return;
        isProcessing = true;
        
        statusLabel.innerHTML = "VERIFYING_KEY";
        showMessage(`Verifying secret key: ${secretKey}...`);
        
        try {
            // Query the agents table
            const { data: agent, error } = await supabaseClient
                .from('agents')
                .select('*')
                .eq('secret_key', secretKey)
                .maybeSingle();
            
            if (error) {
                console.error("Query error:", error);
                showMessage(`Database error: ${error.message}`, true);
                statusLabel.innerHTML = "ERROR";
                clearCode();
                isProcessing = false;
                return;
            }
            
            if (agent) {
                const agentName = agent.agent_name;
                const weaponsArray = agent.weapons_array || [];
                
                showMessage(`✓ Verified! Welcome, ${agentName}`, false);
                statusLabel.innerHTML = "ACCESS_GRANTED";
                
                // Display weapons if any
                if (weaponsArray.length > 0) {
                    displayWeapons(weaponsArray);
                    showMessage(`✓ Agent has ${weaponsArray.length} weapon system(s)`, false);
                }
                
                // STORE TO LOCAL DATABASE (localStorage)
                localStorage.setItem("agent_name", agentName);
                localStorage.setItem("secret_key", secretKey);
                localStorage.setItem("device_signature", currentSignature);
                localStorage.setItem("device_print", currentSignature);
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("weapon_systems", JSON.stringify(weaponsArray));
                localStorage.setItem("last_auth", new Date().toISOString());
                
                console.log("✅ LOCAL DATABASE STORED:");
                console.log("   - agent_name:", agentName);
                console.log("   - secret_key:", secretKey);
                console.log("   - device_print:", currentSignature);
                console.log("   - weapons:", weaponsArray);
                
                // Update last_fingerprint in Supabase
                await supabaseClient
                    .from('agents')
                    .update({ 
                        last_fingerprint: currentSignature,
                        updated_at: new Date().toISOString()
                    })
                    .eq('secret_key', secretKey);
                
                // Add to linked_signatures if not already there
                const currentSignatures = agent.linked_signatures || [];
                if (!currentSignatures.includes(currentSignature)) {
                    await supabaseClient
                        .from('agents')
                        .update({ 
                            linked_signatures: [...currentSignatures, currentSignature]
                        })
                        .eq('secret_key', secretKey);
                }
                
                showMessage(`Device registered successfully!`, false);
                
                setTimeout(() => {
                    keypadSection.classList.add("hidden");
                    statusLabel.innerHTML = "SYSTEM_READY";
                }, 2000);
                
            } else {
                showMessage(`Invalid secret key: ${secretKey}. Access denied.`, true);
                statusLabel.innerHTML = "ACCESS_DENIED";
                clearCode();
            }
            
        } catch (err) {
            console.error("Verification error:", err);
            showMessage(`Error: ${err.message}`, true);
            statusLabel.innerHTML = "ERROR";
            clearCode();
        }
        
        isProcessing = false;
    }
    
    async function checkExistingDevice() {
        statusLabel.innerHTML = "SCANNING_DEVICE";
        showMessage("Checking if device is already registered...");
        
        try {
            const { data: agents, error } = await supabaseClient
                .from('agents')
                .select('agent_name, weapons_array, linked_signatures')
                .contains('linked_signatures', [currentSignature]);
            
            if (error) {
                console.error("Check error:", error);
                showMessage(`Database error: ${error.message}`, true);
                return false;
            }
            
            if (agents && agents.length > 0) {
                const agent = agents[0];
                showMessage(`✓ Device recognized! Welcome back, ${agent.agent_name}`, false);
                statusLabel.innerHTML = "ACCESS_GRANTED";
                
                if (agent.weapons_array && agent.weapons_array.length > 0) {
                    displayWeapons(agent.weapons_array);
                }
                
                localStorage.setItem("agent_name", agent.agent_name);
                localStorage.setItem("device_signature", currentSignature);
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("weapon_systems", JSON.stringify(agent.weapons_array || []));
                
                return true;
            }
            
            return false;
            
        } catch (err) {
            console.error("Check error:", err);
            return false;
        }
    }
    
    function buildKeypad() {
        const keypadContainer = document.getElementById('numericKeypad');
        const layout = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        keypadContainer.innerHTML = '';
        
        layout.forEach(digit => {
            const btn = document.createElement('div');
            btn.className = 'key-btn';
            if (digit === '0') btn.classList.add('key-zero');
            btn.innerText = digit;
            btn.onclick = () => addDigit(digit);
            keypadContainer.appendChild(btn);
        });
    }
    
    document.getElementById('clearBtn').onclick = () => clearCode();
    document.getElementById('cancelBtn').onclick = () => {
        keypadSection.classList.add("hidden");
        statusLabel.innerHTML = "SCAN_CANCELLED";
        showMessage("Registration cancelled", true);
        setTimeout(() => location.reload(), 1500);
    };
    
    async function init() {
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("Supabase client initialized");
            
            // Test connection
            const { error } = await supabaseClient.from('agents').select('count', { count: 'exact', head: true });
            if (error) {
                console.error("Connection test failed:", error);
                showMessage(`Cannot connect: ${error.message}`, true);
                statusLabel.innerHTML = "CONNECTION_ERROR";
                return;
            }
            
            console.log("Connected to Supabase");
            showMessage("Connected to Supabase database", false);
            
        } catch (err) {
            console.error("Init error:", err);
            showMessage(`Init error: ${err.message}`, true);
            statusLabel.innerHTML = "ERROR";
            return;
        }
        
        buildKeypad();
        currentSignature = generateSignature();
        deviceSigSpan.innerText = currentSignature;
        console.log("Device signature:", currentSignature);
        
        const isRegistered = await checkExistingDevice();
        
        if (!isRegistered) {
            showMessage("Device not registered. Please enter your 4-digit SECRET KEY.", false);
            keypadSection.classList.remove("hidden");
            statusLabel.innerHTML = "ENTER_SECRET_KEY";
        }
    }
    
    init();
</script>
</body>
</html>
