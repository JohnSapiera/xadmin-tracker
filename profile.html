<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AGENT_ARCHIVE_SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --locked: #121214; --paper: #ffffff; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; }

        .header { border-left: 3px solid var(--neon); padding-left: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .breadcrumb { font-size: 10px; color: var(--neon); cursor: pointer; text-decoration: underline; }

        /* GRID SYSTEM */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }

        /* WEAPON FOLDER STYLE */
        .wpn-folder {
            background: #1a1a1c; border: 1px solid #333; padding: 30px 10px; text-align: center;
            cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
        }
        .wpn-folder:hover { border-color: var(--neon); background: #222; transform: translateY(-3px); }
        .wpn-folder::before { content: "🗃️"; font-size: 50px; display: block; margin-bottom: 10px; }
        .wpn-label { font-size: 14px; font-weight: 800; color: var(--neon); letter-spacing: 1px; }

        /* V-AGENT FOLDER STYLE */
        .v-folder {
            padding: 20px 10px; text-align: center; border: 1px solid #222;
            background: var(--locked); filter: grayscale(1) brightness(0.4);
            cursor: not-allowed; transition: 0.3s; font-size: 11px;
        }
        /* ACTIVE V-AGENT (Naka-Scan/Puti) */
        .v-folder.active {
            background: #eee; color: #000; border-color: #fff; filter: none;
            cursor: pointer; box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .v-folder.active:hover { transform: scale(1.05); }
        .v-folder::before { content: "📁"; font-size: 30px; display: block; margin-bottom: 5px; }

        /* DOCUMENT OVERLAY */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 99;
        }
        .paper {
            background: var(--paper); color: #000; width: 90%; max-width: 400px;
            padding: 40px; border: 1px solid #ccc; position: relative; box-shadow: 15px 15px 0px var(--neon);
        }
        .doc-line { border-bottom: 1px solid #000; margin: 15px 0; }
        .close-btn { position: absolute; top: 10px; right: 10px; cursor: pointer; color: red; font-weight: bold; }

        .hidden { display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="header">
        <div>
            <div id="path" class="breadcrumb" onclick="showWeaponFolders()">[ ROOT_DIRECTORY ]</div>
            <div id="agentDisplay" style="font-size: 20px; font-weight: 800;">AGENT_ACCESS</div>
        </div>
    </div>

    <div id="weaponGrid" class="grid"></div>

    <div id="vAgentGrid" class="grid hidden"></div>

    <div class="overlay" id="overlay">
        <div class="paper" id="paper"></div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const loggedInAgent = localStorage.getItem("cia_agent") || "LZ";
        const weapons = (loggedInAgent === "LZ") ? ["R8P", "RMN14"] : ["RMN9", "TechnoCP"];

        document.getElementById('agentDisplay').innerText = "AGENT_" + loggedInAgent;

        // SHOW WEAPON SYSTEMS FIRST
        function showWeaponFolders() {
            const wGrid = document.getElementById('weaponGrid');
            const vGrid = document.getElementById('vAgentGrid');
            wGrid.classList.remove('hidden');
            vGrid.classList.add('hidden');
            document.getElementById('path').innerText = "[ ROOT_DIRECTORY ]";

            wGrid.innerHTML = "";
            weapons.forEach(wpn => {
                wGrid.innerHTML += `
                    <div class="wpn-folder" onclick="loadVAgents('${wpn}')">
                        <div class="wpn-label">${wpn}</div>
                        <div style="font-size:8px; opacity:0.5; margin-top:5px;">SYSTEM_ARMORY</div>
                    </div>`;
            });
        }

        // LOAD V-AGENTS INSIDE WEAPON
        async function loadVAgents(wpn) {
            const wGrid = document.getElementById('weaponGrid');
            const vGrid = document.getElementById('vAgentGrid');
            wGrid.classList.add('hidden');
            vGrid.classList.remove('hidden');
            document.getElementById('path').innerText = `[ ROOT ] / ${wpn}_SYSTEM`;

            vGrid.innerHTML = "<div style='color:var(--neon)'>SCANNING_ARCHIVES...</div>";

            const snap = await db.collection("system_registry")
                .where("agent", "==", loggedInAgent)
                .where("weapon", "==", wpn)
                .orderBy("vid", "asc").get();

            vGrid.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                const isActive = data.status === "OFFICIAL_DOCUMENT";
                
                const card = document.createElement('div');
                card.className = isActive ? 'v-folder active' : 'v-folder';
                card.innerHTML = `V-AGENT #${data.vid}<br><span style="font-size:8px;">${isActive ? 'OFFICIAL' : 'PENDING'}</span>`;
                
                if(isActive) card.onclick = () => openDocument(data);
                
                vGrid.appendChild(card);
            });
        }

        function openDocument(d) {
            const date = d.timestamp.toDate();
            const exp = new Date(date); exp.setDate(exp.getDate() + 30);
            
            document.getElementById('paper').innerHTML = `
                <div class="close-btn" onclick="closeDoc()">[X]</div>
                <center><b style="letter-spacing:2px;">OFFICIAL MISSION ORDER</b><br>
                <small>SERIAL: ${d.missionOrder}</small></center>
                <div class="doc-line"></div>
                <b>AGENT:</b> ${d.agent}<br>
                <b>SYSTEM:</b> ${d.weapon}<br>
                <b>UNIT:</b> V-AGENT #${d.vid}
                <div class="doc-line"></div>
                <div style="display:flex; justify-content:space-between;">
                    <div><b>AMOUNT:</b><br>₱ ${d.amount || "0.00"}</div>
                    <div style="text-align:right;"><b>DATE:</b><br>${date.toLocaleDateString()}</div>
                </div>
                <div class="doc-line"></div>
                <small>DEPLOYED: ${date.toLocaleString()}</small><br>
                <small style="color:red; font-weight:bold;">EXPIRES: ${exp.toLocaleString()}</small>
                <p style="text-align:center; font-size:9px; margin-top:20px; opacity:0.5;">*** CONFIDENTIAL RECORD ***</p>
            `;
            document.getElementById('overlay').style.display = "flex";
        }

        function closeDoc() { document.getElementById('overlay').style.display = "none"; }

        // Start
        showWeaponFolders();
    </script>
</body>
</html>
