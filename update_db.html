<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPDATE_DB - STATUS MANAGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #051014;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,243,255,0.1);
        }
        h2 {
            color: #00f3ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 18px;
        }
        .agents-section {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a2f37;
        }
        .section-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #05ffa1;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 15px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 30px;
            transition: 0.2s;
        }
        .radio-group input[type="radio"] {
            accent-color: #00f3ff;
            width: 16px;
            height: 16px;
        }
        .radio-group label:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.15);
            color: #00f3ff;
        }
        /* Dropdown Grid */
        .dropdown-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .dropdown-card {
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
        }
        .dropdown-title {
            color: #00f3ff;
            font-size: 10px;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 1px;
        }
        select {
            width: 100%;
            background: #01080b;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            padding: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            border-radius: 6px;
            outline: none;
        }
        select:focus {
            border-color: #00f3ff;
        }
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Status Radio Buttons */
        .status-section {
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .status-title {
            color: #00f3ff;
            font-size: 10px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }
        .status-options {
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        .status-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 25px;
            background: #01080b;
            border: 1px solid #1a2f37;
            border-radius: 40px;
        }
        .status-option input {
            accent-color: #00f3ff;
            width: 18px;
            height: 18px;
        }
        .status-option span {
            color: #05ffa1;
            font-size: 12px;
            font-weight: bold;
        }
        .status-option:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.1);
        }
        .status-option:has(input:checked) span {
            color: #00f3ff;
        }
        .update-section {
            text-align: center;
            margin-top: 20px;
        }
        .update-btn {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .update-btn:hover {
            background: #05ffa1;
            box-shadow: 0 0 15px rgba(5,255,161,0.4);
        }
        .update-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-msg {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
        }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
        .loading, .empty {
            text-align: center;
            color: #5c7882;
            padding: 20px;
        }
        .info-text {
            font-size: 9px;
            color: #5c7882;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 STATUS MANAGER</h2>

        <!-- AGENTS SECTION (Top Center) -->
        <div class="agents-section">
            <div class="section-title">📡 SELECT AGENT</div>
            <div id="agentRadioGroup" class="radio-group">
                <div class="loading">Loading agents...</div>
            </div>
        </div>

        <!-- 4 DROPDOWNS (2x2 Grid) -->
        <div class="dropdown-grid">
            <!-- 1st: Weapon System with vAgent -->
            <div class="dropdown-card">
                <div class="dropdown-title">🔫 WEAPON SYSTEM (with vAgent)</div>
                <select id="weaponWithVAgent" disabled>
                    <option>Select agent first</option>
                </select>
                <div class="info-text">Active devices with vAgent#</div>
            </div>

            <!-- 2nd: Weapon System without vAgent -->
            <div class="dropdown-card">
                <div class="dropdown-title">⚠️ WEAPON SYSTEM (NO vAGENT)</div>
                <select id="weaponNoVAgent" disabled>
                    <option>Select agent first</option>
                </select>
                <div class="info-text">Unassigned weapon systems</div>
            </div>

            <!-- 3rd: Mission Order # without vAgent -->
            <div class="dropdown-card">
                <div class="dropdown-title">📋 MISSION ORDER (NO vAGENT)</div>
                <select id="missionNoVAgent" disabled>
                    <option>Select agent first</option>
                </select>
                <div class="info-text">Mission orders without vAgent#</div>
            </div>

            <!-- 4th: BLACKLIST (targetID) -->
            <div class="dropdown-card">
                <div class="dropdown-title">🚫 BLACKLIST (targetID)</div>
                <select id="blacklistSelect" disabled>
                    <option>Select agent first</option>
                </select>
                <div class="info-text">Targeted IDs for termination</div>
            </div>
        </div>

        <!-- STATUS RADIO BUTTONS -->
        <div class="status-section">
            <div class="status-title">📌 SELECT STATUS</div>
            <div class="status-options">
                <label class="status-option">
                    <input type="radio" name="status" value="ACTIVE">
                    <span>🟢 ACTIVE</span>
                </label>
                <label class="status-option">
                    <input type="radio" name="status" value="TERMINATED">
                    <span>🔴 TERMINATED</span>
                </label>
            </div>
        </div>

        <!-- UPDATE BUTTON -->
        <div class="update-section">
            <button id="updateBtn" class="update-btn" disabled>💾 SAVE TO DATABASE</button>
        </div>

        <div class="status-msg" id="statusMsg">Ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // DOM Elements
        const agentRadioGroup = document.getElementById('agentRadioGroup');
        const weaponWithVAgent = document.getElementById('weaponWithVAgent');
        const weaponNoVAgent = document.getElementById('weaponNoVAgent');
        const missionNoVAgent = document.getElementById('missionNoVAgent');
        const blacklistSelect = document.getElementById('blacklistSelect');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('statusMsg');
        const statusRadios = document.querySelectorAll('input[name="status"]');

        let allAgents = [];
        let currentAgent = null;
        
        // Data stores
        let weaponWithVAgentList = [];      // { value, display }
        let weaponNoVAgentList = [];
        let missionNoVAgentList = [];        // { value: missionID, display: missionID }
        let blacklistList = [];               // { value: targetID, display: targetID }

        // ========== LOAD AGENTS ==========
        async function loadAgents() {
            statusMsg.innerHTML = '⏳ Loading agents...';
            agentRadioGroup.innerHTML = '<div class="loading">Loading agents...</div>';
            
            try {
                const snapshot = await db.collection("mission_orders").get();
                const agentSet = new Set();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.agent && data.agent.trim() !== '') {
                        agentSet.add(data.agent);
                    }
                });
                
                allAgents = Array.from(agentSet).sort();
                
                if (allAgents.length === 0) {
                    agentRadioGroup.innerHTML = '<div class="empty">⚠️ No agents found</div>';
                    statusMsg.innerHTML = '<span class="error">No agents found. Please create missions first.</span>';
                } else {
                    renderAgentRadios();
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${allAgents.length} agent(s)</span>`;
                }
            } catch (error) {
                agentRadioGroup.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                statusMsg.innerHTML = `<span class="error">❌ Failed to load agents</span>`;
            }
        }

        function renderAgentRadios() {
            agentRadioGroup.innerHTML = '';
            allAgents.forEach(agent => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'agent';
                radio.value = agent;
                radio.onclick = () => selectAgent(agent);
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(` ${agent}`));
                agentRadioGroup.appendChild(label);
            });
        }

        // ========== SELECT AGENT: LOAD ALL DATA ==========
        async function selectAgent(agent) {
            currentAgent = agent;
            statusMsg.innerHTML = `⏳ Loading data for ${agent}...`;
            
            // Reset dropdowns
            const dropdowns = [weaponWithVAgent, weaponNoVAgent, missionNoVAgent, blacklistSelect];
            dropdowns.forEach(d => { d.disabled = true; d.innerHTML = '<option>Loading...</option>'; });
            updateBtn.disabled = true;
            statusRadios.forEach(r => r.checked = false);
            
            weaponWithVAgentList = [];
            weaponNoVAgentList = [];
            missionNoVAgentList = [];
            blacklistList = [];
            
            try {
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", agent)
                    .get();
                
                const weaponMap = new Map(); // for weapon categorization
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const weapon = data.weaponSystem;
                    const vAgent = data.vAgentID;
                    const missionID = data.missionID;
                    const targetID = data.targetID;
                    
                    if (!weapon || weapon === 'INIT') return;
                    
                    // Track weapon categories
                    if (!weaponMap.has(weapon)) {
                        weaponMap.set(weapon, { hasVAgent: false, noVAgent: false });
                    }
                    const weaponInfo = weaponMap.get(weapon);
                    if (vAgent && vAgent !== '' && vAgent !== 'INIT') {
                        weaponInfo.hasVAgent = true;
                    } else {
                        weaponInfo.noVAgent = true;
                    }
                    
                    // Collect mission orders without vAgent
                    if ((!vAgent || vAgent === '' || vAgent === 'INIT') && missionID && missionID !== 'INIT') {
                        missionNoVAgentList.push({ value: missionID, display: missionID });
                    }
                    
                    // Collect blacklist (targetID)
                    if (targetID && targetID !== '' && targetID !== 'INIT') {
                        blacklistList.push({ value: targetID, display: targetID });
                    }
                });
                
                // Build weapon lists
                for (const [weapon, info] of weaponMap.entries()) {
                    if (info.hasVAgent) {
                        weaponWithVAgentList.push({ value: weapon, display: weapon });
                    }
                    if (info.noVAgent) {
                        weaponNoVAgentList.push({ value: weapon, display: weapon });
                    }
                }
                
                // Remove duplicates from mission list and blacklist
                missionNoVAgentList = [...new Map(missionNoVAgentList.map(item => [item.value, item])).values()];
                blacklistList = [...new Map(blacklistList.map(item => [item.value, item])).values()];
                
                // Sort alphabetically
                weaponWithVAgentList.sort((a,b) => a.display.localeCompare(b.display));
                weaponNoVAgentList.sort((a,b) => a.display.localeCompare(b.display));
                missionNoVAgentList.sort((a,b) => a.display.localeCompare(b.display));
                blacklistList.sort((a,b) => a.display.localeCompare(b.display));
                
                // Populate dropdowns
                populateDropdown(weaponWithVAgent, weaponWithVAgentList, 'No weapons with vAgent');
                populateDropdown(weaponNoVAgent, weaponNoVAgentList, 'No unassigned weapons');
                populateDropdown(missionNoVAgent, missionNoVAgentList, 'No missions without vAgent');
                populateDropdown(blacklistSelect, blacklistList, 'No blacklist entries');
                
                const total = weaponWithVAgentList.length + weaponNoVAgentList.length + missionNoVAgentList.length + blacklistList.length;
                statusMsg.innerHTML = `<span class="success">✅ Loaded ${total} items for ${agent}</span>`;
                
                // Enable update button if at least one dropdown has selection
                updateBtn.disabled = false;
                
            } catch (error) {
                console.error("Error loading data:", error);
                statusMsg.innerHTML = `<span class="error">❌ Failed to load data: ${error.message}</span>`;
            }
        }

        function populateDropdown(selectElement, items, emptyMessage) {
            selectElement.innerHTML = '';
            if (items.length === 0) {
                selectElement.innerHTML = `<option>${emptyMessage}</option>`;
                selectElement.disabled = true;
            } else {
                items.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.value;
                    option.textContent = item.display;
                    selectElement.appendChild(option);
                });
                selectElement.disabled = false;
            }
        }

        // ========== GET CURRENT SELECTION ==========
        function getCurrentSelection() {
            let type = '';
            let value = '';
            let display = '';
            
            if (weaponWithVAgent.value && weaponWithVAgent.value !== 'Select agent first' && weaponWithVAgent.value !== 'No weapons with vAgent') {
                type = 'weapon_vagent';
                value = weaponWithVAgent.value;
                display = `Weapon: ${value} (with vAgent)`;
            } else if (weaponNoVAgent.value && weaponNoVAgent.value !== 'Select agent first' && weaponNoVAgent.value !== 'No unassigned weapons') {
                type = 'weapon_novagent';
                value = weaponNoVAgent.value;
                display = `Weapon: ${value} (NO vAgent)`;
            } else if (missionNoVAgent.value && missionNoVAgent.value !== 'Select agent first' && missionNoVAgent.value !== 'No missions without vAgent') {
                type = 'mission_novagent';
                value = missionNoVAgent.value;
                display = `Mission Order: ${value}`;
            } else if (blacklistSelect.value && blacklistSelect.value !== 'Select agent first' && blacklistSelect.value !== 'No blacklist entries') {
                type = 'blacklist';
                value = blacklistSelect.value;
                display = `Target ID: ${value}`;
            }
            
            return { type, value, display };
        }

        // ========== SAVE TO DATABASE (active_status / terminated_status) ==========
        async function saveToDatabase() {
            if (!currentAgent) {
                statusMsg.innerHTML = '<span class="error">❌ No agent selected</span>';
                return;
            }
            
            let selectedStatus = null;
            statusRadios.forEach(radio => {
                if (radio.checked) selectedStatus = radio.value;
            });
            
            if (!selectedStatus) {
                statusMsg.innerHTML = '<span class="error">❌ Please select ACTIVE or TERMINATED</span>';
                return;
            }
            
            const selection = getCurrentSelection();
            if (!selection.type) {
                statusMsg.innerHTML = '<span class="error">❌ Please select an item from dropdown</span>';
                return;
            }
            
            // Determine collection name based on status
            const collectionName = (selectedStatus === 'ACTIVE') ? 'active_status' : 'terminated_status';
            
            if (!confirm(`Save to "${collectionName}"?\n\nAgent: ${currentAgent}\n${selection.display}\nStatus: ${selectedStatus}`)) {
                return;
            }
            
            statusMsg.innerHTML = `⏳ Saving to ${collectionName}...`;
            updateBtn.disabled = true;
            
            try {
                // Create document ID based on agent and value
                const docId = `${currentAgent}_${selection.value.replace(/\s/g, '_')}`;
                
                await db.collection(collectionName).doc(docId).set({
                    agent: currentAgent,
                    type: selection.type,
                    value: selection.value,
                    status: selectedStatus,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    originalDisplay: selection.display
                }, { merge: true });
                
                statusMsg.innerHTML = `<span class="success">✅ SUCCESS: Saved to "${collectionName}" - ${selection.display}</span>`;
                
                // Optional: show what's saved
                console.log(`Saved to ${collectionName}:`, { agent: currentAgent, type: selection.type, value: selection.value });
                
            } catch (error) {
                console.error("Error saving:", error);
                statusMsg.innerHTML = `<span class="error">❌ ERROR: ${error.message}</span>`;
            } finally {
                updateBtn.disabled = false;
            }
        }

        // Event listener
        updateBtn.onclick = saveToDatabase;

        // Load agents on page load
        loadAgents();
    </script>
</body>
</html>
