<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>AGENCY_INTEL_v24.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #01080b; --cyan: #00f3ff; --red: #ff003c; --green: #00ff66; 
            --border: rgba(0, 243, 255, 0.15); --mono: 'Share Tech Mono', monospace; 
            --glass: rgba(2, 12, 18, 0.95);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* ANIMATIONS */
        @keyframes neonPulse {
            0% { text-shadow: 0 0 2px var(--green); opacity: 0.7; }
            50% { text-shadow: 0 0 10px var(--green), 0 0 20px var(--green); opacity: 1; color: #fff; }
            100% { text-shadow: 0 0 2px var(--green); opacity: 0.7; }
        }

        header { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .intel-title { font-family: var(--mono); color: var(--cyan); font-size: 14px; letter-spacing: 5px; text-shadow: 0 0 10px var(--cyan); }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; text-align: center; }
        
        .auth-zone { margin-bottom: 40px; }
        #log-status { font-family: var(--mono); font-size: 10px; color: #5c7882; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .agent-name { font-size: 42px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #fff; margin-bottom: 5px; }
        .device-tag { font-size: 11px; padding: 5px 12px; background: rgba(0,0,0,0.5); border: 1px solid #1a2f37; color: #5c7882; font-family: var(--mono); display: inline-block; border-radius: 2px; }

        .report-btn { 
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan); 
            padding: 25px 60px; font-family: var(--mono); font-size: 18px; font-weight: bold;
            cursor: pointer; position: relative; transition: 0.3s;
            clip-path: polygon(15% 0, 100% 0, 100% 70%, 85% 100%, 0 100%, 0 30%);
            opacity: 0.1; pointer-events: none;
        }
        .report-btn.unlocked { opacity: 1; pointer-events: auto; background: rgba(0, 243, 255, 0.05); }
        .report-btn.unlocked:hover { background: var(--cyan); color: #000; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; backdrop-filter: blur(15px); }
        .modal-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 400px; background: var(--glass); 
            border-top: 4px solid var(--cyan); padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            max-height: 85vh; overflow-y: auto;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-label { font-family: var(--mono); font-size: 10px; color: var(--cyan); margin-bottom: 8px; display: block; letter-spacing: 1px; transition: 0.3s; }
        
        /* Highlight Class for Detection */
        .weapon-detected-active { color: var(--green) !important; animation: neonPulse 1.5s infinite; }

        .intel-input { 
            width: 100%; background: #05131a; border: 1px solid #1a2f37; padding: 15px; 
            color: #fff; font-family: var(--mono); font-size: 16px; outline: none;
            transition: 0.3s; border-left: 3px solid #1a2f37;
        }
        .intel-input:focus { border-color: var(--cyan); border-left-color: var(--cyan); background: #071b25; }

        .grid-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .grid-item { 
            background: #05131a; border: 1px solid #1a2f37; color: #5c7882; 
            padding: 12px; font-family: var(--mono); font-size: 11px; 
            cursor: pointer; transition: 0.3s; text-align: center;
            text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .grid-item.selected { 
            border-color: var(--cyan); color: var(--cyan); 
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .btn-transmit { 
            width: 100%; padding: 20px; background: var(--cyan); color: #000; 
            border: none; font-family: var(--mono); font-size: 16px; font-weight: 900; 
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 92% 100%, 0 100%);
            margin-top: 10px; transition: 0.3s;
        }
        .btn-transmit:disabled { opacity: 0.2; pointer-events: none; filter: grayscale(1); }

        nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
        .nav-link { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-size: 11px; font-family: var(--mono); text-decoration: none; font-weight: bold; }
        .nav-link.active { color: var(--cyan); background: rgba(0,243,255,0.03); border-top: 2px solid var(--cyan); }
    </style>
</head>
<body>

<header><div class="intel-title">INTEL_TERMINAL_V24</div></header>

<main>
    <div class="auth-zone">
        <div id="log-status">>> Establishing_Secure_Link...</div>
        <div class="agent-name" id="display-name">---</div>
        <div class="device-tag" id="device-tag">CHECKING_SESSION...</div>
    </div>

    <button id="main-btn" class="report-btn" onclick="openReport()">
        [ INITIATE_BOUNTY_REPORT ]
    </button>
</main>

<div id="report-modal" class="modal">
    <div class="modal-box">
        <div style="text-align:center; margin-bottom:20px;">
            <h2 style="font-family:var(--mono); font-size:12px; letter-spacing:3px; color:var(--cyan);">TACTICAL_ENTRY_PROTOCOL</h2>
            <div id="scan-status" style="font-size:10px; color:#5c7882; margin-top:5px;">AWAITING_INPUT...</div>
        </div>

        <div class="input-group">
            <span class="input-label">TARGET_V_AGENT_NO (NAME)</span>
            <input type="text" id="vAgent" class="intel-input" placeholder="SCAN NAME..." autocomplete="off">
        </div>

        <div id="weapon-zone" style="display:none; margin-bottom:20px;">
            <span class="input-label" id="weapon-label">WEAPON_SYSTEM_DETECTION</span>
            <div id="weapon-list" class="grid-list"></div>
        </div>

        <div class="input-group">
            <span class="input-label">BOUNTY_EXPENSES (PHP)</span>
            <input type="number" id="expenses" class="intel-input" placeholder="0.00">
        </div>

        <div id="device-zone" style="display:none; margin-bottom:20px;">
            <span class="input-label" id="device-label">DETECTED_AGENT_DEVICES</span>
            <div id="target-device-list" class="grid-list"></div>
        </div>

        <button id="transmit-btn" onclick="transmitData()" class="btn-transmit" disabled>DATA_INCOMPLETE</button>
        
        <button onclick="closeReport()" style="width:100%; background:transparent; color:var(--red); border:none; margin-top:15px; font-family:var(--mono); cursor:pointer; font-size:10px;">
            // ABORT_TRANSMISSION
        </button>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="#" class="nav-link active">INTEL</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
        authDomain: "my-admin-portal-12691.firebaseapp.com",
        projectId: "my-admin-portal-12691",
        storageBucket: "my-admin-portal-12691.firebasestorage.app",
        messagingSenderId: "317015091563",
        appId: "1:317015091563:web:baab5171d8e0a58acd442e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedWeapon = "N/A";
    let selectedTargetDevice = "N/A";

    async function runSecurityScan() {
        const nameDisplay = document.getElementById('display-name');
        const tag = document.getElementById('device-tag');
        const log = document.getElementById('log-status');
        const btn = document.getElementById('main-btn');
        
        const savedAgent = localStorage.getItem("cia_agent");
        const isVerified = localStorage.getItem("agent_verified");
        const sig = localStorage.getItem("intel_device_signature") || "N/A";

        if (isVerified === "true" && savedAgent) {
            nameDisplay.innerText = savedAgent;
            tag.innerText = "AGENT_SESSION_ACTIVE // " + sig;
            log.innerText = ">> UPLINK_STABLE";
            btn.classList.add('unlocked');
        } else {
            window.location.href = "index.html";
        }
    }

    const scanAgent = async (val) => {
        const status = document.getElementById('scan-status');
        const weaponZone = document.getElementById('weapon-zone');
        const weaponLabel = document.getElementById('weapon-label');
        const weaponList = document.getElementById('weapon-list');
        const deviceZone = document.getElementById('device-zone');
        const deviceList = document.getElementById('target-device-list');

        if(val.length < 3) {
            weaponZone.style.display = "none";
            deviceZone.style.display = "none";
            weaponLabel.classList.remove('weapon-detected-active');
            selectedWeapon = "N/A";
            selectedTargetDevice = "N/A";
            validateForm();
            return;
        }

        status.innerText = ">> ANALYZING_REGISTRY...";
        status.style.color = "var(--cyan)";

        try {
            // Search by Name in mission_orders
            let q = query(collection(db, "mission_orders"), where("agentName", "==", val));
            let snap = await getDocs(q);

            if (!snap.empty) {
                const data = snap.docs[0].data();
                status.innerText = ">> UNIT_FOUND: ID#" + (data.vAgentID || "N/A");
                status.style.color = "var(--green)";
                
                // 1. WEAPON SYSTEMS + ANIMATION
                const weapons = data.weaponSystems || [];
                weaponZone.style.display = "block";
                weaponList.innerHTML = "";
                
                if(weapons.length > 0) {
                    weaponLabel.innerText = "⚠️ WEAPON_SYSTEM_DETECTED";
                    weaponLabel.classList.add('weapon-detected-active');
                    weapons.forEach(w => {
                        const b = document.createElement('div');
                        b.className = 'grid-item';
                        b.innerText = w;
                        b.onclick = () => {
                            document.querySelectorAll('#weapon-list .grid-item').forEach(x => x.classList.remove('selected'));
                            b.classList.add('selected');
                            selectedWeapon = w;
                            validateForm();
                        };
                        weaponList.appendChild(b);
                    });
                } else {
                    weaponLabel.innerText = "WEAPON_SYSTEM_DETECTION (EMPTY)";
                    weaponLabel.classList.remove('weapon-detected-active');
                    weaponList.innerHTML = "<div style='grid-column:1/-1; font-size:10px; color:#5c7882;'>NO_WEAPONS_ASSIGNED</div>";
                }

                // 2. DEVICE SIGNATURES
                deviceZone.style.display = "block";
                deviceList.innerHTML = "";
                const sigs = data.linkedSignatures || [];
                if(sigs.length > 0) {
                    sigs.forEach(sig => {
                        const d = document.createElement('div');
                        d.className = 'grid-item';
                        d.innerText = sig.substring(0, 10) + "...";
                        d.onclick = () => {
                            document.querySelectorAll('#target-device-list .grid-item').forEach(x => x.classList.remove('selected'));
                            d.classList.add('selected');
                            selectedTargetDevice = sig;
                            validateForm();
                        };
                        deviceList.appendChild(d);
                    });
                } else {
                    deviceList.innerHTML = "<div style='grid-column:1/-1; font-size:10px; color:#5c7882;'>NO_DEVICE_LOGS</div>";
                }

            } else {
                status.innerText = ">> IDENTITY_NOT_FOUND";
                status.style.color = "#5c7882";
                weaponZone.style.display = "none";
                deviceZone.style.display = "none";
                weaponLabel.classList.remove('weapon-detected-active');
            }
        } catch (e) { console.error(e); }
    };

    function validateForm() {
        const v = document.getElementById('vAgent').value;
        const e = document.getElementById('expenses').value;
        const btn = document.getElementById('transmit-btn');
        
        // Unlocks if: Name is set, Expenses > 0, Weapon chosen, and Device chosen
        if (v.length >= 3 && e > 0 && selectedWeapon !== "N/A" && selectedTargetDevice !== "N/A") {
            btn.disabled = false;
            btn.innerText = "CONFIRM_TRANSMISSION";
        } else {
            btn.disabled = true;
            btn.innerText = "DATA_INCOMPLETE";
        }
    }

    document.getElementById('vAgent').addEventListener('input', (e) => scanAgent(e.target.value));
    document.getElementById('expenses').addEventListener('input', validateForm);

    window.transmitData = async () => {
        const v = document.getElementById('vAgent').value;
        const e = document.getElementById('expenses').value;
        const agentName = localStorage.getItem("cia_agent");
        const mySig = localStorage.getItem("intel_device_signature");
        const brand = localStorage.getItem("agent_brand");

        try {
            await addDoc(collection(db, "bounties"), {
                reportedBy: agentName,
                brandName: brand,
                targetV_Agent_No: v,
                targetDevice: selectedTargetDevice,
                weaponSystem: selectedWeapon,
                expenses: parseFloat(e),
                reporterSignature: mySig,
                timestamp: serverTimestamp(),
                orderNumber: "BNT-" + Math.floor(10000 + Math.random() * 90000),
                status: "PENDING_REVIEW"
            });
            alert("✅ BOUNTY_TRANSMITTED");
            location.reload();
        } catch (err) { alert("❌ FAILED"); }
    };

    window.openReport = () => document.getElementById('report-modal').style.display = 'block';
    window.closeReport = () => document.getElementById('report-modal').style.display = 'none';
    window.onload = runSecurityScan;
</script>
</body>
</html>
