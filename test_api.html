<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom API Tester</title>
    <style>
        /* Dark Terminal / Technical Minimalist Theme */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        h2 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #8b949e; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            background-color: #010409;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
        }
        input:focus, textarea:focus { border-color: #58a6ff; outline: none; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        
        .button-group { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 20px; }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: 0.2s;
        }
        #btnRaw { background-color: #238636; color: white; border: 1px solid #2ea043; }
        #btnRaw:hover { background-color: #2ea043; }
        #btnSend { background-color: #1f6feb; color: white; border: 1px solid #388bfd; }
        #btnSend:hover { background-color: #388bfd; }
        
        /* Response Area */
        .output-box {
            background-color: #010409;
            border: 1px solid #30363d;
            padding: 15px;
            min-height: 150px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-x: auto;
            border-radius: 4px;
        }
        .status { margin-top: 10px; font-weight: bold; }
        .success { color: #3fb950; }
        .error { color: #f85149; }
    </style>
</head>
<body>

    <h2>[ SYSTEM_API_TESTER ]</h2>

    <div class="row form-group">
        <div style="flex: 1;">
            <label>Method</label>
            <select id="method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
            </select>
        </div>
        <div style="flex: 4;">
            <label>Target URL</label>
            <input type="text" id="url" placeholder="https://api.example.com/data" value="https://httpbin.org/post">
        </div>
    </div>

    <div class="form-group">
        <label>Headers</label>
        <div class="row">
            <div>
                <input type="text" id="contentType" placeholder="Content-Type" value="application/json">
            </div>
            <div>
                <input type="text" id="cookie" placeholder="Cookie (e.g., cna=xyz; lzd_sid=123)" value="">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>Body (Payload)</label>
        <textarea id="body" rows="5" placeholder='{"key": "value"}'></textarea>
    </div>

    <div class="button-group">
        <button id="btnRaw" onclick="convertToRaw()">CONVERT TO RAW</button>
        <button id="btnSend" onclick="sendRequest()">SEND REQUEST</button>
    </div>

    <label>Result / Output:</label>
    <div id="statusIndicator" class="status">Waiting for action...</div>
    <pre id="output" class="output-box">// Ang resulta o raw code ay lalabas dito...</pre>

    <script>
        // Kunin ang mga HTML elements
        const getEl = (id) => document.getElementById(id);

        // Function 1: I-convert ang inputs sa "Raw Text" format
        function convertToRaw() {
            const method = getEl('method').value;
            let urlText = getEl('url').value;
            const contentType = getEl('contentType').value;
            const cookie = getEl('cookie').value;
            const body = getEl('body').value;

            // Extract Host and Path for raw format
            let host = "unknown-host.com";
            let path = "/";
            try {
                if (urlText) {
                    const urlObj = new URL(urlText);
                    host = urlObj.host;
                    path = urlObj.pathname + urlObj.search;
                }
            } catch (e) {
                // Ignore invalid URL formatting for raw view
            }

            // Buuin ang Raw String
            let rawRequest = `${method} ${path} HTTP/1.1\n`;
            rawRequest += `Host: ${host}\n`;
            if (contentType) rawRequest += `Content-Type: ${contentType}\n`;
            if (cookie) rawRequest += `Cookie: ${cookie}\n`;
            rawRequest += `User-Agent: System_Tester/1.0\n`;
            
            if (body) {
                rawRequest += `Content-Length: ${new Blob([body]).size}\n`;
                rawRequest += `\n${body}`;
            } else {
                rawRequest += `\n`;
            }

            // I-display sa box
            getEl('statusIndicator').innerText = "Raw Request Generated";
            getEl('statusIndicator').className = "status";
            getEl('output').innerText = rawRequest;
        }

        // Function 2: I-send ang mismong API Request
        async function sendRequest() {
            const method = getEl('method').value;
            const url = getEl('url').value;
            const contentType = getEl('contentType').value;
            const cookie = getEl('cookie').value;
            const body = getEl('body').value;

            const outputBox = getEl('output');
            const statusBox = getEl('statusIndicator');

            if (!url) {
                alert("Please enter a Target URL first!");
                return;
            }

            outputBox.innerText = "Sending request... Please wait.";
            statusBox.innerText = "Processing...";
            statusBox.className = "status";

            // I-setup ang headers
            let reqHeaders = {};
            if (contentType) reqHeaders['Content-Type'] = contentType;
            // Note: Ang mga browsers minsan ay bina-block ang custom "Cookie" header sa fetch dahil sa security, pero ipapasa pa rin natin dito.
            if (cookie) reqHeaders['Cookie'] = cookie;

            // I-setup ang configuration ng request
            let config = {
                method: method,
                headers: reqHeaders
            };

            // GET requests ay bawal magkaroon ng body
            if (method !== 'GET' && body) {
                config.body = body;
            }

            try {
                const response = await fetch(url, config);
                const isJson = response.headers.get("content-type")?.includes("application/json");
                
                // Kunin ang response text o JSON
                const responseData = isJson ? await response.json() : await response.text();

                // I-display ang Status code
                statusBox.innerText = `Status: ${response.status} ${response.statusText}`;
                statusBox.className = response.ok ? "status success" : "status error";

                // I-display ang data nang maayos
                if (typeof responseData === 'object') {
                    outputBox.innerText = JSON.stringify(responseData, null, 2);
                } else {
                    outputBox.innerText = responseData;
                }

            } catch (error) {
                statusBox.innerText = "Request Failed (Check CORS or Network)";
                statusBox.className = "status error";
                outputBox.innerText = `Error Details:\n${error.message}\n\nTip: Kapag nag-test ka sa Lazada at nag-CORS error, ibig sabihin hinarang ito ng browser security.`;
            }
        }
    </script>
</body>
</html>
