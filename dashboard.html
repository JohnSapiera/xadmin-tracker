<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TACTICAL OPS | DASHBOARD V4.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a0e;
      --panel: rgba(5, 18, 24, 0.95);
      --cyan: #00f3ff;
      --red: #ff003c;
      --blue: #007bff;
      --green: #00ff66;
      --border: rgba(0, 243, 255, 0.3);
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: #c8e1e5; font-family: var(--font-ui); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header { padding: 15px; border-bottom: 1px solid var(--cyan); background: #000; display: flex; justify-content: space-between; align-items: center; }
    .ticker-wrap { background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid var(--border); padding: 5px 10px; font-family: var(--font-mono); font-size: 11px; color: var(--cyan); }

    main { flex: 1; overflow-y: auto; padding: 20px 15px 100px 15px; }
    .portal-section { display: none; }
    .portal-section.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .search-box { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 4px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }
    #mission-input { width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--cyan); font-family: var(--font-mono); font-size: 32px; padding: 10px; text-align: center; letter-spacing: 8px; outline: none; margin-bottom: 20px; }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 15px; font-family: var(--font-mono); font-size: 14px; font-weight: bold; border: 1px solid; background: transparent; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
    
    /* Button States */
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    #terminal { background: #000; border: 1px solid #1a1a1a; padding: 15px; font-family: var(--font-mono); font-size: 11px; min-height: 150px; color: #888; margin-top: 20px; overflow-y: auto; }
    .log-entry { margin-bottom: 5px; border-bottom: 1px solid #111; padding-bottom: 2px; }

    /* Modal */
    #weapon-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--panel); border: 2px solid var(--red); width: 100%; max-width: 380px; position: relative; padding: 40px 20px 25px; box-shadow: 0 0 30px rgba(255,0,60,0.3); }
    .modal-close { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; border: none; padding: 8px 15px; cursor: pointer; font-family: var(--font-mono); }
    .modal-tag { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 2px 15px; border: 1px solid var(--red); color: var(--red); font-family: var(--font-mono); font-size: 14px; white-space: nowrap; }
    .weapon-info { font-family: var(--font-mono); border: 1px solid rgba(255,255,255,0.1); padding: 15px; background: rgba(0,0,0,0.2); }
    .weapon-info span { color: var(--cyan); display: block; font-size: 18px; margin-top: 5px; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; border-top: 2px solid var(--cyan); display: grid; grid-template-columns: 1fr 1fr; z-index: 200; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-family: var(--font-mono); font-size: 12px; }
    .nav-item.active { color: var(--cyan); background: rgba(0, 243, 255, 0.1); }
  </style>
</head>
<body>

<header>
  <div style="font-family: var(--font-mono);">[ GATEWAY_V4.2 ]</div>
  <div id="clock" style="color: var(--cyan); font-family: var(--font-mono);">00:00:00</div>
</header>

<div class="ticker-wrap"><span id="ticker-text">SYSTEM STANDBY...</span></div>

<main>
  <section id="mission" class="portal-section active">
    <div class="search-box">
      <label style="font-family: var(--font-mono); font-size: 11px; color: var(--cyan); margin-bottom: 8px; display: block;">MISSION ID ENTRY</label>
      <input type="tel" id="mission-input" placeholder="00000" maxlength="5">
      
      <div class="btn-row">
        <button id="main-action-btn" class="btn btn-save">SAVE</button>
        <button id="terminate-btn" class="btn btn-terminate">TERMINATE</button>
      </div>
    </div>

    <div id="terminal">
      <div class="log-entry">> Initializing secure console...</div>
    </div>
  </section>

  <section id="vault" class="portal-section">
    <div style="text-align: center; margin-top: 50px; color: var(--cyan);">[ DATA_VAULT_ACTIVE ]</div>
  </section>
</main>

<div id="weapon-modal">
  <div class="modal-content">
    <button class="modal-close" id="close-modal">X</button>
    <div class="modal-tag" id="modal-title">MISSION ORDER #: 00000</div>
    <div class="weapon-info">
      <div>WEAPON SYSTEM: <span id="disp-weapon">--</span></div>
      <div>V-AGENT #: <span id="disp-agent">--</span></div>
      <div id="blacklist-status" style="margin-top:10px; font-size:12px;"></div>
    </div>
  </div>
</div>

<nav>
  <div class="nav-item active" id="tab-mission">MISSION</div>
  <div class="nav-item" id="tab-vault">VAULT</div>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const missionInput = document.getElementById('mission-input');
  const mainBtn = document.getElementById('main-action-btn');
  const term = document.getElementById('terminal');
  let activeData = null;
  let isBlacklisted = false;

  // --- DUAL SEARCH LOGIC ---
  missionInput.addEventListener('input', async (e) => {
    let val = e.target.value.replace(/\D/g, '');
    missionInput.value = val;

    if (val.length >= 4) {
      writeLog(`SCANNING FREQUENCY: ${val}...`, 'cyan');
      try {
        // 1. Check Blacklist first
        const qB = query(collection(db, "blacklist"), where("targetID", "==", val));
        const snapB = await getDocs(qB);
        isBlacklisted = !snapB.empty;

        // 2. Check Mission Orders
        const qM = query(collection(db, "mission_orders"), where("orderNumber", "==", val));
        const snapM = await getDocs(qM);

        if (!snapM.empty) {
          activeData = snapM.docs[0].data();
          mainBtn.textContent = "RETRIEVE";
          mainBtn.className = "btn btn-retrieve"; // Becomes Blue
          writeLog(isBlacklisted ? `[!!!] BLACKLISTED ID DETECTED.` : `RECORD FOUND. RETRIEVAL READY.`, 'blue');
        } else if (isBlacklisted) {
            // Even if not in mission_orders but in blacklist
            mainBtn.textContent = "RETRIEVE";
            mainBtn.className = "btn btn-retrieve";
            activeData = { weaponSystem: "BLOCKED", agent: "BLACKLISTED" };
            writeLog(`[!!!] BLACKLISTED ID WITHOUT RECORD.`, 'red');
        } else {
          resetBtn();
        }
      } catch (err) { console.error(err); }
    } else {
      resetBtn();
    }
  });

  function resetBtn() {
    activeData = null;
    isBlacklisted = false;
    mainBtn.textContent = "SAVE";
    mainBtn.className = "btn btn-save";
  }

  // --- SAVE / RETRIEVE ACTION ---
  mainBtn.addEventListener('click', async () => {
    const code = missionInput.value;
    if (code.length < 4) return writeLog("INVALID ID", "red");

    if (mainBtn.textContent === "RETRIEVE" && activeData) {
      document.getElementById('modal-title').textContent = `MISSION ORDER #: ${code}`;
      document.getElementById('disp-weapon').textContent = activeData.weaponSystem || "TACTICAL_V1";
      document.getElementById('disp-agent').textContent = activeData.agent || "AGENT_REDACTED";
      
      const bStatus = document.getElementById('blacklist-status');
      bStatus.innerHTML = isBlacklisted ? "<b style='color:red;'>STATUS: BLACKLISTED</b>" : "<b style='color:green;'>STATUS: AUTHORIZED</b>";
      
      document.getElementById('weapon-modal').style.display = 'flex';
    } else {
      writeLog(`UPLOADING MISSION ${code}...`, 'green');
      try {
        await addDoc(collection(db, "mission_orders"), {
          orderNumber: code,
          weaponSystem: "ARC_GEN_1",
          agent: "V-AGENT_" + Math.floor(100+Math.random()*900),
          timestamp: serverTimestamp()
        });
        writeLog(`SUCCESS: MISSION ${code} SAVED.`, 'green');
        missionInput.value = ''; resetBtn();
      } catch (e) { writeLog("SAVE FAILED", "red"); }
    }
  });

  // --- TERMINATE / BLACKLIST ACTION ---
  document.getElementById('terminate-btn').addEventListener('click', async () => {
    const code = missionInput.value;
    if (code.length < 4) return writeLog("INVALID ID", "red");

    if(confirm(`TERMINATE & BLACKLIST ID ${code}?`)) {
      writeLog(`EXECUTING BLACKLIST FOR ${code}...`, 'red');
      try {
        await addDoc(collection(db, "blacklist"), {
          targetID: code,
          timestamp: serverTimestamp()
        });
        // Also ensure it exists in mission orders marked as terminated
        await addDoc(collection(db, "mission_orders"), {
          orderNumber: code,
          status: "TERMINATED",
          weaponSystem: "DEACTIVATED",
          agent: "NONE",
          timestamp: serverTimestamp()
        });
        writeLog(`${code} IS NOW BLACKLISTED.`, 'red');
        missionInput.value = ''; resetBtn();
      } catch (e) { writeLog("BLACKLIST FAILED", "red"); }
    }
  });

  // UI Helpers
  document.getElementById('close-modal').onclick = () => document.getElementById('weapon-modal').style.display = 'none';
  function writeLog(msg, color) {
    const time = new Date().toLocaleTimeString('en-GB');
    term.innerHTML = `<div class="log-entry" style="color:var(--${color})">[${time}] > ${msg}</div>` + term.innerHTML;
  }
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
