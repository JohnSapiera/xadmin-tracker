<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CENTRAL_AUTH_v17</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #01080b; --cyan: #00f2ff; --red: #ff003c; }
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        body { 
            background: var(--bg); color: var(--cyan); 
            font-family: 'Share Tech Mono', monospace;
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        /* CIA Terminal Aesthetic */
        .auth-box {
            width: 280px; padding: 40px 30px;
            border: 1px solid rgba(0, 242, 255, 0.1);
            background: rgba(2, 10, 13, 0.9);
            text-align: center; position: relative;
        }
        .scan-line {
            width: 100%; height: 1px; background: var(--cyan);
            position: absolute; left: 0; top: 0;
            box-shadow: 0 0 15px var(--cyan);
            animation: move 2.5s infinite linear;
        }
        @keyframes move { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .label { font-size: 9px; letter-spacing: 4px; color: #3d4d54; margin-bottom: 20px; text-transform: uppercase; }
        #status { font-size: 14px; font-weight: bold; height: 20px; }
        #error-msg { display: none; color: var(--red); font-size: 10px; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="auth-box">
        <div class="scan-line"></div>
        <div class="label">Hardware_Security_Audit</div>
        <div id="status">AUDITING...</div>
        
        <div id="error-msg">
            ACCESS_DENIED<br>
            UNREGISTERED_HARDWARE<br>
            <span style="font-size:8px; opacity:0.5;">LINK DEVICE VIA UPLINK_v17</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Get Hardware Specs (Match sa update_db logic)
        function getHardwareID() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
            
            const specs = {
                gpu: gpu.split('/').pop().trim(),
                res: `${window.screen.width}x${window.screen.height}`,
                plt: navigator.platform
            };

            // 2. Generate Hash Fingerprint (Match sa generateFP function mo)
            const raw = specs.gpu + specs.res + specs.plt;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash |= 0;
            }
            return "HW-" + Math.abs(hash).toString(16).toUpperCase();
        }

        async function verifyDevice() {
            const status = document.getElementById('status');
            const error = document.getElementById('error-msg');
            const currentFP = getHardwareID();

            try {
                // I-check sa "agents" collection kung may record na may ganitong fingerprint
                const snap = await db.collection("agents")
                                     .where("lastFingerprint", "==", currentFP)
                                     .get();

                if (!snap.empty) {
                    const agentData = snap.docs[0].data();
                    status.innerText = "ACCESS_GRANTED";
                    status.style.color = "#00ff66";
                    
                    // Itabi ang pangalan for personal session
                    localStorage.setItem("cia_agent", agentData.agentName);
                    
                    setTimeout(() => {
                        window.location.href = "intel.html";
                    }, 1200);
                } else {
                    status.innerText = "DENIED";
                    status.style.color = "var(--red)";
                    error.style.display = "block";
                }
            } catch (e) {
                status.innerText = "OFFLINE";
                console.error(e);
            }
        }

        window.onload = verifyDevice;
    </script>
</body>
</html>
