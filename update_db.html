<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Agent Account</title>
    <!-- Supabase JS library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <h1>Create Agent Account</h1>

    <!-- Form para sa agent account -->
    <form id="agentForm">
        <div>
            <label for="agentName">Agent Name:</label><br>
            <input type="text" id="agentName" name="agentName" required>
        </div>
        <br>
        <div>
            <label for="secretKey">Secret Key (4-digit):</label><br>
            <input type="password" id="secretKey" name="secretKey" maxlength="4" pattern="[0-9]{4}" required>
            <small>Enter exactly 4 digits (0-9)</small>
        </div>
        <br>
        <div>
            <button type="submit">Create Agent Account</button>
        </div>
    </form>

    <!-- Para sa messages -->
    <div id="message" style="margin-top: 20px;"></div>

    <script>
        // Supabase configuration - PALITAN MO ITO NG ACTUAL KEYS MO
        const SUPABASE_URL = 'https://pgclrzqfpoznvrjrzced.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s';
        
        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Reference sa form at message div
        const form = document.getElementById('agentForm');
        const messageDiv = document.getElementById('message');

        // Function para magpakita ng message
        function showMessage(text, isError = false) {
            messageDiv.innerHTML = text;
            messageDiv.style.color = isError ? 'red' : 'green';
            // Mag-clear ng message after 5 seconds
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // Handle form submission
        form.addEventListener('submit', async (event) => {
            event.preventDefault();  // Para hindi mag-reload ang page
            
            // Kunin ang values mula sa form
            const agentName = document.getElementById('agentName').value.trim();
            const secretKey = document.getElementById('secretKey').value;
            
            // Basic validation
            if (!agentName) {
                showMessage('Please enter agent name', true);
                return;
            }
            
            if (!secretKey || secretKey.length !== 4 || !/^\d+$/.test(secretKey)) {
                showMessage('Secret key must be exactly 4 digits (0-9 only)', true);
                return;
            }
            
            // I-disable ang button habang nagpo-process
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Creating...';
            
            try {
                // Una, check kung existing na ang agent name
                const { data: existingAgent, error: checkError } = await supabase
                    .from('agents')
                    .select('agent_name')
                    .eq('agent_name', agentName)
                    .single();
                
                if (existingAgent) {
                    showMessage('Agent name already exists! Please choose another name.', true);
                    submitButton.disabled = false;
                    submitButton.textContent = 'Create Agent Account';
                    return;
                }
                
                // Insert ang bagong agent sa database
                const { data, error } = await supabase
                    .from('agents')
                    .insert([
                        { 
                            agent_name: agentName, 
                            secret_key: secretKey,
                            created_at: new Date().toISOString(),
                            device_info: {
                                userAgent: navigator.userAgent,
                                platform: navigator.platform,
                                created_at: new Date().toISOString()
                            }
                        }
                    ])
                    .select();
                
                if (error) {
                    console.error('Supabase error:', error);
                    showMessage('Error creating agent: ' + error.message, true);
                } else {
                    showMessage(`✅ Agent "${agentName}" created successfully! Secret key: ${secretKey}`);
                    form.reset();  // I-clear ang form
                    
                    // Optional: Ipakita ang agent details
                    console.log('Created agent:', data);
                }
                
            } catch (err) {
                console.error('Unexpected error:', err);
                showMessage('An unexpected error occurred. Please try again.', true);
            } finally {
                // I-enable ulit ang button
                submitButton.disabled = false;
                submitButton.textContent = 'Create Agent Account';
            }
        });
        
        // Optional: Function para i-check kung connected sa Supabase
        async function checkConnection() {
            try {
                const { data, error } = await supabase.from('agents').select('count', { count: 'exact', head: true });
                if (error) {
                    console.warn('Connection check failed:', error);
                    showMessage('⚠️ Warning: Cannot connect to database. Check if table "agents" exists.', true);
                } else {
                    console.log('Connected to Supabase successfully');
                }
            } catch (err) {
                console.error('Connection error:', err);
            }
        }
        
        // I-check ang connection pag nag-load ang page
        checkConnection();
    </script>

</body>
</html>
