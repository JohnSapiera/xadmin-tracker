<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Test - Working Version</title>
    <style>
        body {
            background: #0a0c12;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
        }
        .box {
            background: #0d0f14;
            border: 1px solid #1f232c;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        input {
            background: #000;
            border: 1px solid #2a3240;
            padding: 12px;
            color: #00ff66;
            font-family: monospace;
            font-size: 20px;
            text-align: center;
            letter-spacing: 5px;
            border-radius: 8px;
            width: 150px;
        }
        .log {
            background: #03050a;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
            word-break: break-all;
        }
        .green { color: #00ff66; }
        .red { color: #ff4444; }
        .yellow { color: #ffaa33; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
    <h3>SUPABASE CONNECTION TEST</h3>
    <p>Project ID: pgclrzqfpoznvrjrzced</p>
    <button id="testBtn">TEST CONNECTION</button>
    <div id="result" class="log">Click the button to test...</div>
</div>

<div class="box">
    <h3>REGISTER DEVICE</h3>
    <input type="text" id="masterKey" maxlength="4" placeholder="____">
    <br><br>
    <button id="registerBtn">REGISTER</button>
    <div id="registerResult" class="log">Waiting...</div>
</div>

<script>
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    let supabase = null;
    
    function log(element, message, color) {
        element.innerHTML = message;
        element.className = 'log ' + color;
        console.log(message);
    }
    
    // TEST CONNECTION
    document.getElementById('testBtn').onclick = async () => {
        const resultDiv = document.getElementById('result');
        log(resultDiv, 'Connecting to Supabase...', 'yellow');
        
        try {
            // Create client
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            log(resultDiv, 'Client created. Checking agents table...', 'yellow');
            
            // Try to get agents
            const { data, error } = await supabase
                .from('agents')
                .select('agent_name, secret_key');
            
            if (error) {
                log(resultDiv, 'ERROR: ' + error.message, 'red');
                
                if (error.message.includes('relation') && error.message.includes('does not exist')) {
                    log(resultDiv, 'Table "agents" does not exist. Creating it...', 'yellow');
                    
                    // Note: You need to create table in Supabase SQL editor
                    log(resultDiv, 'Please run this SQL in Supabase SQL Editor:<br><br>' +
                        'CREATE TABLE agents (<br>' +
                        '    id SERIAL PRIMARY KEY,<br>' +
                        '    agent_name TEXT,<br>' +
                        '    secret_key TEXT UNIQUE,<br>' +
                        '    weapon_system TEXT[]<br>' +
                        ');<br><br>' +
                        'INSERT INTO agents (agent_name, secret_key) VALUES <br>' +
                        '("AGENT_LZ", "4646"),<br>' +
                        '("AGENT_JFSN", "1010");', 'red');
                }
                return;
            }
            
            if (data && data.length > 0) {
                let msg = 'CONNECTED! Found ' + data.length + ' agent(s):<br><br>';
                data.forEach(agent => {
                    msg += '• ' + agent.agent_name + ' (key: ' + agent.secret_key + ')<br>';
                });
                log(resultDiv, msg, 'green');
            } else {
                log(resultDiv, 'CONNECTED! But no agents found. Please add agents to database.', 'yellow');
            }
            
        } catch(err) {
            log(resultDiv, 'EXCEPTION: ' + err.message, 'red');
        }
    };
    
    // REGISTER DEVICE
    document.getElementById('registerBtn').onclick = async () => {
        const masterKey = document.getElementById('masterKey').value.trim();
        const resultDiv = document.getElementById('registerResult');
        
        if (!masterKey || masterKey.length !== 4) {
            log(resultDiv, 'Please enter 4-digit key', 'red');
            return;
        }
        
        if (!supabase) {
            log(resultDiv, 'Please test connection first', 'red');
            return;
        }
        
        log(resultDiv, 'Verifying key: ' + masterKey + '...', 'yellow');
        
        try {
            const { data, error } = await supabase
                .from('agents')
                .select('agent_name, secret_key, weapon_system')
                .eq('secret_key', masterKey)
                .maybeSingle();
            
            if (error) {
                log(resultDiv, 'Error: ' + error.message, 'red');
                return;
            }
            
            if (!data) {
                log(resultDiv, 'INVALID KEY: ' + masterKey + ' not found', 'red');
                return;
            }
            
            // Generate fingerprint
            let hash = 0;
            const raw = navigator.userAgent + screen.width + screen.height;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            }
            const fingerprint = 'DEV-' + Math.abs(hash).toString(16).toUpperCase().slice(0, 10);
            
            // Save to localStorage
            const registration = {
                agent_name: data.agent_name,
                secret_key: masterKey,
                device_fingerprint: fingerprint,
                devices: data.weapon_system || [],
                registered_at: new Date().toISOString(),
                is_registered: true
            };
            localStorage.setItem('cia_device_registration', JSON.stringify(registration));
            
            log(resultDiv, 'SUCCESS! Registered as: ' + data.agent_name, 'green');
            
        } catch(err) {
            log(resultDiv, 'Error: ' + err.message, 'red');
        }
    };
    
    // Check existing registration
    const saved = localStorage.getItem('cia_device_registration');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            document.getElementById('registerResult').innerHTML = 'Already registered as: ' + data.agent_name;
            document.getElementById('registerResult').className = 'log green';
        } catch(e) {}
    }
</script>
</body>
</html>
