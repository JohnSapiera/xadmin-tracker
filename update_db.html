<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_REGISTRY_SETTER</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #0a0a0a; }
        body { 
            background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .panel {
            background: #111; border: 2px solid var(--neon); padding: 30px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); width: 100%; max-width: 400px;
        }
        h2 { font-size: 16px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 10px; margin-bottom: 8px; color: #888; }
        select {
            width: 100%; background: #000; border: 1px solid #333; color: #fff;
            padding: 12px; font-family: inherit; outline: none; cursor: pointer;
        }
        .btn-register {
            width: 100%; background: var(--neon); color: #000; border: none;
            padding: 15px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .btn-register:hover { background: #fff; }
        #status { font-size: 10px; margin-top: 20px; text-align: center; color: #888; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="panel">
        <h2>SYSTEM_REGISTRY</h2>
        
        <div class="form-group">
            <label>SELECT AGENT</label>
            <select id="agentId">
                <option value="LZ">AGENT LZ</option>
                <option value="JFSN">AGENT JFSN</option>
            </select>
        </div>

        <div class="form-group">
            <label>REGISTER WEAPON SYSTEM</label>
            <select id="weaponId">
                <option value="R8P">R8P SYSTEM</option>
                <option value="RMN14">RMN14 SYSTEM</option>
                <option value="RMN9">RMN9 SYSTEM</option>
                <option value="TechnoCP">TechnoCP SYSTEM</option>
            </select>
        </div>

        <button class="btn-register" onclick="registerSystem()">REGISTER TO DATABASE</button>
        <div id="status">READY_FOR_REGISTRATION</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function registerSystem() {
            const agent = document.getElementById('agentId').value;
            const weapon = document.getElementById('weaponId').value;
            const status = document.getElementById('status');

            status.innerText = "LINKING_SYSTEMS...";

            try {
                // Gagawa tayo ng collection na 'registry' para sa folders
                // Gagamitin ang ID format na 'AGENT_WEAPON' para walang duplicate
                const registryID = `${agent}_${weapon}`;
                
                await db.collection("system_registry").doc(registryID).set({
                    agentName: agent,
                    weaponSystem: weapon,
                    status: "ACTIVE",
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                });

                status.style.color = "#00ff00";
                status.innerText = `SUCCESS: ${weapon} LINKED TO ${agent}`;
                
            } catch (error) {
                status.style.color = "red";
                status.innerText = "ERROR: " + error.message;
            }
        }
    </script>
</body>
</html>
