<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_GATEWAY_V6.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #01080b; --cyan: #00f3ff; --blue: #007bff; --green: #00ff66; --red: #ff003c; --panel: #051218; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--cyan); font-family: 'Share Tech Mono', monospace; margin: 0; padding: 12px; height: 100vh; display: flex; flex-direction: column; }
    
    header { font-size: 11px; border-bottom: 1px solid rgba(0,243,255,0.2); padding: 5px 0; margin-bottom: 10px; display: flex; justify-content: space-between; }
    
    .section-title { font-size: 9px; margin-bottom: 5px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
    .input-wrap { background: var(--panel); border: 1px solid rgba(0,243,255,0.3); padding: 12px; border-radius: 2px; margin-bottom: 10px; }
    
    /* Main Input */
    #mission-input { 
      width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--cyan); 
      font-size: 26px; text-align: center; padding: 8px; outline: none; margin-bottom: 12px;
      font-family: 'Share Tech Mono', monospace; letter-spacing: 3px;
    }
    
    /* Bulk Field */
    #bulk-input {
      width: 100%; background: #000; border: 1px solid var(--red); color: var(--red);
      font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 8px;
      height: 80px; outline: none; resize: none; margin-bottom: 10px;
    }

    .btn { 
      width: 100%; padding: 12px; border: 1px solid; background: transparent; 
      font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; font-family: 'Share Tech Mono', monospace;
    }
    .btn-save { border-color: var(--green); color: var(--green); }
    .btn-blue { background: var(--blue) !important; color: #fff !important; border-color: var(--blue) !important; }
    .btn-terminate { border-color: var(--red); color: var(--red); }
    
    #terminal { 
      margin-top: 10px; font-size: 10px; color: #555; flex: 1;
      overflow-y: auto; border: 1px solid #111; padding: 10px; line-height: 1.4; background: #000;
    }
  </style>
</head>
<body>

<header>
  <span>SECURE_GATEWAY_V6.2</span>
  <span id="clock">00:00:00</span>
</header>

<div class="input-wrap">
  <div class="section-title">Single Mission Scan</div>
  <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
  <button id="main-btn" class="btn btn-save">SAVE DATA</button>
</div>

<div class="input-wrap" style="border-color: var(--red);">
  <div class="section-title" style="color: var(--red);">Bulk Trash Termination (1 ID per line)</div>
  <textarea id="bulk-input" placeholder="11437&#10;11438&#10;11439"></textarea>
  <button id="bulk-btn" class="btn btn-terminate">TERMINATE ALL TRASH</button>
</div>

<div id="terminal">> UPLINK_SUCCESS. SYSTEM_READY...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:d996e585751d5087cd442e",
    measurementId: "G-ZSV1PYKPZQ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const btn = document.getElementById('main-btn');
  const bulkInput = document.getElementById('bulk-input');
  const bulkBtn = document.getElementById('bulk-btn');
  const term = document.getElementById('terminal');

  // --- AUTO SEARCH (SINGLE) ---
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    if (val.length >= 4) {
      log(`SCANNING: ${val}...`, '#888');
      try {
        const q = query(collection(db, "blacklist"), where("targetID", "==", val));
        const snap = await getDocs(q);
        if (!snap.empty) {
          btn.textContent = "RETRIEVE DATA";
          btn.className = "btn btn-blue";
          log(`[MATCH FOUND] ID ${val} IS BLACKLISTED.`, '#007bff');
        } else {
          btn.textContent = "SAVE DATA";
          btn.className = "btn btn-save";
          log(`ID ${val} NOT FOUND.`, '#666');
        }
      } catch (err) { log(`SCAN_ERR: ${err.code}`, '#ff003c'); }
    } else {
      btn.textContent = "SAVE DATA";
      btn.className = "btn btn-save";
    }
  });

  // --- SINGLE SAVE ---
  btn.addEventListener('click', async () => {
    const val = input.value.trim();
    if (val.length < 4 || btn.textContent.includes("RETRIEVE")) return;
    log(`ARCHIVING ${val}...`, '#00ff66');
    try {
      await addDoc(collection(db, "blacklist"), {
        targetID: val,
        timestamp: serverTimestamp(),
        status: "BLACKLISTED",
        type: "TRASH_NO_PROFILE"
      });
      log(`SUCCESS: ${val} BLACKLISTED.`, '#00ff66');
      input.value = "";
    } catch (e) { log(`SAVE_ERR: ${e.message}`, '#ff003c'); }
  });

  // --- BULK TERMINATE ACTION ---
  bulkBtn.addEventListener('click', async () => {
    const rawData = bulkInput.value.trim();
    if (!rawData) return log("BULK_ERR: NO DATA PROVIDED", "#ff003c");

    const ids = rawData.split('\n').map(id => id.trim()).filter(id => id.length >= 4);
    if (ids.length === 0) return log("BULK_ERR: NO VALID IDs", "#ff003c");

    if (!confirm(`TERMINATE ${ids.length} MISSION ORDERS?`)) return;

    bulkBtn.disabled = true;
    bulkBtn.textContent = "PROCESSING...";
    log(`STARTING BULK TERMINATION [${ids.length} IDs]`, '#ff003c');

    let successCount = 0;
    for (const id of ids) {
      try {
        await addDoc(collection(db, "blacklist"), {
          targetID: id,
          timestamp: serverTimestamp(),
          status: "BLACKLISTED",
          type: "BULK_TRASH"
        });
        log(`BLACKLISTED: ${id}`, '#ff003c');
        successCount++;
      } catch (e) {
        log(`FAILED: ${id}`, '#555');
      }
    }

    log(`BULK OPERATION COMPLETE. ${successCount} IDs TERMINATED.`, '#00ff66');
    bulkInput.value = "";
    bulkBtn.disabled = false;
    bulkBtn.textContent = "TERMINATE ALL TRASH";
  });

  function log(msg, color) {
    const time = new Date().toLocaleTimeString('en-GB');
    term.innerHTML = `<div style="color:${color}">[${time}] > ${msg}</div>` + term.innerHTML;
  }

  setInterval(() => { 
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); 
  }, 1000);
</script>
</body>
</html>
