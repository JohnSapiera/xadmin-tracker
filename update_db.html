<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLACKLIST MANAGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #051014;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,243,255,0.1);
        }
        h2 {
            color: #00f3ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 18px;
        }
        .dropdown-section {
            margin-bottom: 25px;
        }
        .dropdown-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }
        select {
            width: 100%;
            background: #01080b;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            padding: 14px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            border-radius: 8px;
            outline: none;
            text-align: center;
            cursor: pointer;
        }
        select:focus {
            border-color: #00f3ff;
        }
        .info-section {
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .info-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .info-value {
            color: #05ffa1;
            font-size: 24px;
            font-weight: bold;
        }
        .update-section {
            text-align: center;
        }
        .update-btn {
            width: 100%;
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .update-btn:hover {
            background: #05ffa1;
            box-shadow: 0 0 15px rgba(5,255,161,0.4);
        }
        .update-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-msg {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
        }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
        .warning { color: #ffbd00; }
        .loading {
            text-align: center;
            color: #5c7882;
            padding: 20px;
        }
        .target-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
            padding-top: 10px;
        }
        .target-list span {
            color: #05ffa1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚫ BLACKLIST MANAGER</h2>

        <!-- INFO SECTION - Display count -->
        <div class="info-section">
            <div class="info-title">📊 TOTAL BLACKLIST TARGETS</div>
            <div class="info-value" id="totalCount">0</div>
            <div id="targetList" class="target-list"></div>
        </div>

        <!-- UPDATE BUTTON -->
        <div class="update-section">
            <button id="updateBtn" class="update-btn">📦 MOVE ALL TO TERMINATED_INFO</button>
        </div>

        <div class="status-msg" id="statusMsg">Ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // DOM Elements
        const totalCountSpan = document.getElementById('totalCount');
        const targetListDiv = document.getElementById('targetList');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('statusMsg');

        let blacklistItems = []; // Array of { targetID, docId, ...other fields }

        // ========== LOAD ALL TARGET IDs FROM BLACKLIST COLLECTION ==========
        async function loadBlacklist() {
            statusMsg.innerHTML = '⏳ Loading blacklist collection...';
            updateBtn.disabled = true;
            
            try {
                const snapshot = await db.collection("blacklist").get();
                
                blacklistItems = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const targetID = data.targetID;
                    
                    if (targetID && targetID.trim() !== '') {
                        blacklistItems.push({
                            docId: doc.id,
                            targetID: targetID,
                            ...data
                        });
                    } else if (doc.id) {
                        // If targetID is not a field, use document ID as targetID
                        blacklistItems.push({
                            docId: doc.id,
                            targetID: doc.id,
                            ...data
                        });
                    }
                });
                
                // Remove duplicates by targetID
                const uniqueMap = new Map();
                blacklistItems.forEach(item => {
                    if (!uniqueMap.has(item.targetID)) {
                        uniqueMap.set(item.targetID, item);
                    }
                });
                blacklistItems = Array.from(uniqueMap.values());
                
                // Sort alphabetically
                blacklistItems.sort((a, b) => a.targetID.localeCompare(b.targetID));
                
                const count = blacklistItems.length;
                totalCountSpan.innerHTML = count;
                
                if (count === 0) {
                    targetListDiv.innerHTML = '<span style="color:#5c7882;">No blacklist targets found</span>';
                    statusMsg.innerHTML = '<span class="warning">⚠️ No documents in "blacklist" collection</span>';
                    updateBtn.disabled = true;
                } else {
                    // Display list of targetIDs
                    let listHtml = '';
                    blacklistItems.forEach(item => {
                        listHtml += `<div>🔴 <span>${item.targetID}</span></div>`;
                    });
                    targetListDiv.innerHTML = listHtml;
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${count} target(s) from blacklist collection</span>`;
                    updateBtn.disabled = false;
                }
                
            } catch (error) {
                console.error("Error loading blacklist:", error);
                statusMsg.innerHTML = `<span class="error">❌ Failed to load: ${error.message}</span>`;
                updateBtn.disabled = true;
            }
        }

        // ========== MOVE ALL BLACKLIST TARGETS TO TERMINATED_INFO ==========
        async function moveToTerminatedInfo() {
            if (blacklistItems.length === 0) {
                statusMsg.innerHTML = '<span class="error">❌ No blacklist targets to move</span>';
                return;
            }
            
            const confirmMsg = `Confirm move ${blacklistItems.length} blacklist target(s) to "terminated_info" collection?\n\nTargets:\n${blacklistItems.map(i => `  - ${i.targetID}`).join('\n')}\n\nThis will copy all data to terminated_info.`;
            
            if (!confirm(confirmMsg)) {
                statusMsg.innerHTML = 'Operation cancelled';
                return;
            }
            
            statusMsg.innerHTML = `⏳ Moving ${blacklistItems.length} target(s) to terminated_info...`;
            updateBtn.disabled = true;
            
            try {
                const batch = db.batch();
                const timestamp = firebase.firestore.FieldValue.serverTimestamp();
                let successCount = 0;
                
                for (const item of blacklistItems) {
                    // Create document in terminated_info collection
                    const docId = `${item.targetID}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                    const docRef = db.collection("terminated_info").doc(docId);
                    
                    batch.set(docRef, {
                        targetID: item.targetID,
                        sourceCollection: 'blacklist',
                        originalDocId: item.docId,
                        movedAt: timestamp,
                        status: 'TERMINATED',
                        ...item
                    });
                    successCount++;
                }
                
                await batch.commit();
                
                statusMsg.innerHTML = `<span class="success">✅ SUCCESS: Moved ${successCount} target(s) to "terminated_info" collection</span>`;
                
                // Optional: Ask if user wants to delete from blacklist collection
                const deleteOriginal = confirm(`Move completed!\n\nDo you want to DELETE the original ${successCount} document(s) from "blacklist" collection?`);
                
                if (deleteOriginal) {
                    statusMsg.innerHTML = `⏳ Deleting original blacklist documents...`;
                    const deleteBatch = db.batch();
                    for (const item of blacklistItems) {
                        const docRef = db.collection("blacklist").doc(item.docId);
                        deleteBatch.delete(docRef);
                    }
                    await deleteBatch.commit();
                    statusMsg.innerHTML = `<span class="success">✅ SUCCESS: Deleted ${successCount} document(s) from "blacklist" collection</span>`;
                    
                    // Reload the blacklist
                    await loadBlacklist();
                } else {
                    // Just reload to refresh display
                    await loadBlacklist();
                }
                
            } catch (error) {
                console.error("Error moving to terminated_info:", error);
                statusMsg.innerHTML = `<span class="error">❌ ERROR: ${error.message}</span>`;
                updateBtn.disabled = false;
            }
        }

        // Event listener for update button
        updateBtn.onclick = moveToTerminatedInfo;

        // Load blacklist on page load
        loadBlacklist();
    </script>
</body>
</html>
