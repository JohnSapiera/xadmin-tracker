<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CORE_DASH | OS V2.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#02080a">
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/dbintel.css">

    <script>
        if (!localStorage.getItem('agent_verified') || !localStorage.getItem('cia_agent')) {
            window.location.replace("index.html");
        }
    </script>
</head>
<body>

    <header>
        <div class="header-inner">
            <span class="logo">CORE_DASH</span>
            <div class="uplink-status">
                <span class="dot pulse"></span> UPLINK_STABLE
            </div>
        </div>
    </header>

    <div class="status-bar">
        <div>SYS_TIME: <span id="clock">00:00:00</span></div>
        <div id="mission-status">STANDBY</div> </div>

    <main>
        <div class="command-module">
            <div class="input-wrapper">
                <span class="input-prefix">ID_</span>
                <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
            </div>
            
            <div class="btn-row main-actions">
                <button id="action-btn" class="btn btn-save hidden">SAVE</button>
                <button id="reserve-btn" class="btn btn-reserve hidden">RESERVE</button>
            </div>
        </div>

        <div id="terminal" class="terminal-container"></div>
        
        <div class="profile-mini">
            <div class="avatar" id="avatar-init">?</div>
            <div class="profile-info">
                <div id="prof-name">AUTHENTICATING...</div>
                <div class="auth-level">AUTH_LEVEL: <span style="color: var(--cyan);">OMEGA</span></div>
            </div>
        </div>
    </main>

    <div class="overlay" id="modal-overlay">
        <div class="popup">
            <div class="popup-header">
                <div class="popup-header-icon"><span>⚙️</span></div>
                <div id="pop-header">MISSION_ORDER</div>
            </div>
            
            <div class="popup-body">
                <div class="popup-field">
                    <label class="popup-label">🔹 vAGENT IDENTIFIER</label>
                    <input type="text" id="v-agent-input" class="pop-input" placeholder="ENTER vAGENT ID">
                </div>
                
                <div class="secure-line-wrapper">
                    <button type="button" id="add-secure-line" class="btn-text">+ ADD SECURE LINE</button>
                    <input type="tel" id="secure-input-field" class="pop-input hidden" maxlength="11" placeholder="09XXXXXXXXX">
                </div>

                <div class="popup-field">
                    <label class="popup-label">🔫 WEAPON SYSTEM</label>
                    <div class="weapon-selector" id="weapon-list">
                        </div>
                </div>
            </div>

            <div class="btn-row popup-actions">
                <button id="modal-submit" class="btn btn-save">DEPLOY</button>
                <button id="modal-close" class="btn btn-abort">ABORT</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
            <span class="nav-icon">📊</span>
            <span class="nav-text">DASHBOARD</span>
        </a>
        <a href="intel.html" class="nav-item">
            <span class="nav-icon">🛰️</span>
            <span class="nav-text">INTEL</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-text">PROFILE</span>
        </a>
    </nav>

    <script type="module" src="js/jsdash.js"></script>

</body>
</html>
