<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA INTELLIGENCE UNIT - ENCRYPTED</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(18, 18, 24, 0.95);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --text-dim: #626a77;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--accent-cyan);
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent-cyan);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 15px;
            padding: 15px;
            flex-grow: 1;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        .panel-header {
            padding: 8px 12px;
            font-size: 10px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        .ban-container { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .secret-trigger { font-size: 10px; color: var(--accent-cyan); cursor: pointer; }

        input[type="text"], textarea {
            background: #000;
            border: 1px solid #333;
            color: var(--accent-cyan);
            padding: 12px;
            font-family: inherit;
            width: 100%;
            outline: none;
            border-radius: 4px;
        }

        textarea { height: 150px; resize: none; display: none; }

        .execute-btn {
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 15px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
        }

        .terminal-log {
            flex-grow: 1;
            background: rgba(0,0,0,0.6);
            margin-top: 10px;
            padding: 15px;
            font-size: 11px;
            overflow-y: auto;
            color: #88ff88;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-area { flex-grow: 1; overflow-y: auto; padding: 15px; font-size: 12px; }
        .chat-input-row { padding: 10px; background: #000; display: flex; gap: 8px; border-top: 1px solid var(--border); }
        
        .hidden { display: none !important; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .found { color: var(--danger-red); font-weight: bold; }
        .clear { color: #00ff00; }
    </style>
</head>
<body>

    <nav class="status-header">
        <div>OP_ID: <span style="color:white">098-GHOST</span></div>
        <div class="blink">● ENCRYPTED LINK</div>
        <div id="clock">00:00:00</div>
    </nav>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">DATABASE_STATUS</div>
            <div style="padding:15px; font-size:10px; color:var(--text-dim);">
                > SECURE_DB: ONLINE<br>
                > SYNC_STATUS: STABLE<br><br>
                <span style="color:var(--accent-cyan)">[#] READY FOR QUERY</span>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span onclick="toggleBulkMode()" class="secret-trigger">TERMINATION_PROTOCOL (MODE_SWAP)</span>
                <span id="modeStatus" style="font-size: 9px; color: var(--text-dim);">MODE: SINGLE_SEARCH</span>
            </div>
            
            <div class="ban-container">
                <label style="font-size: 10px; color: var(--accent-cyan); letter-spacing: 1px;">SECRET CODES IDENTIFICATION</label>
                
                <input type="text" id="singleCode" placeholder="Type to search database..." oninput="autoSearch(this.value)">
                
                <textarea id="bulkCodes" placeholder="Paste multiple codes here... (Deduplication Active)"></textarea>
                
                <button class="execute-btn" onclick="processBan()">EXECUTE BLACKLIST</button>
                
                <div class="terminal-log" id="banLog">> System Standby. Awaiting input sequence...</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">CLASSIFIED_COMMS</div>
            <div class="chat-area" id="chatFeed"></div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Enter message..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()" style="background:var(--accent-cyan); border:none; padding:5px 10px; font-weight:800; cursor:pointer;">SEND</button>
            </div>
        </div>
    </div>

    <script>
        // Simulated Database (Dito mo i-fetch ang data mula sa Firebase mo later)
        const bannedDatabase = ["12345", "ABCDE", "ADMIN-99", "GHOST-OPS"];

        // --- AUTO SEARCH LOGIC ---
        function autoSearch(val) {
            const log = document.getElementById('banLog');
            const query = val.trim().toUpperCase();

            if (query === "") {
                log.innerHTML = `> System Standby. Awaiting input sequence...`;
                return;
            }

            log.innerHTML = `<div>> SEARCHING DATABASE FOR: <span style="color:white">${query}</span>...</div>`;

            // Check if code exists
            if (bannedDatabase.includes(query)) {
                log.innerHTML += `<div class="found">> WARNING: TARGET [${query}] ALREADY TERMINATED.</div>`;
            } else {
                log.innerHTML += `<div class="clear">> STATUS: [${query}] IS CLEAR. READY FOR TERMINATION.</div>`;
            }
        }

        // --- MODE TOGGLE ---
        let isBulkMode = false;
        function toggleBulkMode() {
            isBulkMode = !isBulkMode;
            const single = document.getElementById('singleCode');
            const bulk = document.getElementById('bulkCodes');
            const status = document.getElementById('modeStatus');
            const log = document.getElementById('banLog');

            if (isBulkMode) {
                single.classList.add('hidden');
                bulk.style.display = 'block';
                status.innerText = "MODE: BULK_AUTO_CLEAN";
                status.style.color = "#ffb000";
                log.innerHTML = `> BULK MODE ACTIVATED. AUTO-DEDUPLICATION ENABLED.`;
            } else {
                single.classList.remove('hidden');
                bulk.style.display = 'none';
                status.innerText = "MODE: SINGLE_SEARCH";
                status.style.color = "var(--text-dim)";
                log.innerHTML = `> SINGLE SEARCH MODE RESTORED.`;
            }
        }

        // --- EXECUTION + DEDUPLICATION ---
        function processBan() {
            const log = document.getElementById('banLog');
            let codes = [];

            if (isBulkMode) {
                const raw = document.getElementById('bulkCodes').value;
                codes = raw.split(/[\n,]+/).map(s => s.trim()).filter(s => s !== "");
            } else {
                const val = document.getElementById('singleCode').value.trim();
                if (val) codes.push(val);
            }

            if (codes.length === 0) return;

            // DEDUPLICATION
            const unique = [...new Set(codes)];
            const dupesRemoved = codes.length - unique.length;

            log.innerHTML += `<div style="color:white">> PROCESSING ${unique.length} UNIQUE IDS...</div>`;
            if (dupesRemoved > 0) log.innerHTML += `<div style="color:#ffb000">> PURGED: ${dupesRemoved} DUPLICATES.</div>`;

            setTimeout(() => {
                log.innerHTML += `<div style="color:#00ff00">> SUCCESS: DATABASE UPDATED.</div>`;
                document.getElementById('singleCode').value = "";
                document.getElementById('bulkCodes').value = "";
                log.scrollTop = log.scrollHeight;
            }, 1000);
        }

        // Clock Script
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        function sendMsg() {
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                document.getElementById('chatFeed').innerHTML += `<div style="margin-bottom:5px;"><strong>[OP]:</strong> ${input.value}</div>`;
                input.value = "";
                document.getElementById('chatFeed').scrollTop = 9999;
            }
        }
    </script>
</body>
</html>
