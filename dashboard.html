<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#02080a">
    
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>CORE_DASH_v29.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #02080a; --panel: rgba(5, 15, 20, 0.9); --cyan: #00f3ff; 
            --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
            --green: #05ffa1; --yellow: #ffbd00; --border: rgba(0, 243, 255, 0.2);
            --font-mono: 'Share Tech Mono', monospace; --font-main: 'Rajdhani', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #e1f5f9; font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 15px 20px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .status-bar { font-size: 11px; padding: 8px 20px; background: rgba(0,243,255,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }
        
        main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }
        
        .command-module { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #mission-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--cyan); color: #fff; font-family: var(--font-mono); font-size: 45px; text-align: center; outline: none; margin-bottom: 5px; letter-spacing: 5px; }
        
        #mission-status { font-family: var(--font-mono); font-size: 12px; text-align: center; height: 18px; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; }
        .status-reserved { color: var(--yellow); animation: blink 1s infinite; }
        .status-deployed { color: var(--green); }
        @keyframes blink { 50% { opacity: 0.3; } }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { height: 50px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; font-family: var(--font-main); font-size: 14px; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-save { background: var(--green); color: #000; }
        .btn-retrieve { background: var(--blue); color: #fff; }
        .btn-reserve { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); opacity: 0.3; pointer-events: none; }
        .btn-reserve.active { opacity: 1; pointer-events: auto; border-color: var(--yellow); color: var(--yellow); }

        #terminal { background: rgba(0,0,0,0.9); border-left: 3px solid var(--cyan); padding: 12px; font-family: var(--font-mono); font-size: 10px; height: 180px; overflow-y: auto; color: #9ab4bc; box-shadow: inset 0 0 15px #000; border-radius: 0 4px 4px 0; }
        .term-line { margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.03); line-height: 1.4; }

        .profile-mini { background: #051014; border: 1px solid var(--border); padding: 12px; display: flex; align-items: center; gap: 15px; border-radius: 4px; }
        .avatar { width: 40px; height: 40px; background: var(--cyan-dim); border: 1px solid var(--cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--cyan); font-weight: bold; font-size: 18px; }
        
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .popup { width: 100%; max-width: 360px; background: #051014; border: 1px solid var(--cyan); padding: 25px; box-shadow: 0 0 40px rgba(0, 243, 255, 0.15); }
        .pop-label { font-size: 10px; color: var(--cyan); letter-spacing: 1px; margin-bottom: 6px; display: block; font-weight: bold; }
        .pop-input { width: 100%; background: #000; border: 1px solid var(--border); color: var(--green); padding: 12px; text-align: center; font-size: 20px; margin-bottom: 15px; font-family: var(--font-mono); outline: none; }
        
        .weapon-selector { display: grid; gap: 8px; margin-bottom: 20px; max-height: 140px; overflow-y: auto; padding-right: 5px; }
        .weapon-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: #fff; padding: 12px; font-size: 11px; cursor: pointer; font-family: var(--font-mono); text-align: left; transition: 0.3s; }
        .weapon-btn.selected { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); box-shadow: inset 0 0 10px var(--cyan); }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #5c7882; text-decoration: none; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
        .nav-item.active { color: var(--cyan); background: var(--cyan-dim); border-top: 2px solid var(--cyan); }
    </style>
</head>
<body>

<header><span style="font-weight: 700; color: #fff; letter-spacing: 2px;">CORE_DASH // v29.0</span></header>

<div class="status-bar">
    <div>SYS_TIME: <span id="clock">00:00:00</span></div>
    <div style="color: var(--green);">UPLINK_STABLE</div>
</div>

<main>
    <div class="command-module">
        <input type="tel" id="mission-input" placeholder="0000" maxlength="5" autocomplete="off">
        <div id="mission-status"></div>
        <div class="btn-row">
            <button id="action-btn" class="btn btn-save">SAVE</button>
            <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
        </div>
    </div>

    <div id="terminal"></div>

    <div class="profile-mini">
        <div class="avatar" id="avatar-init">?</div>
        <div class="profile-info">
            <div style="color: var(--cyan); font-weight: 700; text-transform: uppercase;" id="prof-name">AGENT_PENDING</div>
            <div style="color: #5c7882; font-size: 10px;">AUTH_LEVEL: OMEGA</div>
        </div>
    </div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-item active">DASHBOARD</a>
    <a href="intel.html" class="nav-item">INTEL</a>
    <a href="profile.html" class="nav-item">PROFILE</a>
</nav>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div id="pop-header" style="color:var(--cyan); text-align:center; margin-bottom:18px; font-size:26px; font-weight:700; font-family:var(--font-mono);">#0000</div>
        <div id="form-ui">
            <span class="pop-label">vAGENT_IDENTIFIER:</span>
            <input type="text" id="v-agent-input" class="pop-input" placeholder="V_ID_REQUIRED">
            <span class="pop-label">WEAPON_SYSTEM_LINK:</span>
            <div class="weapon-selector" id="weapon-list"></div>
            <div id="expense-info" style="display:none; text-align:right; margin-bottom:12px; font-family:var(--font-mono); font-size:13px; border-top:1px solid var(--border); padding-top:10px;">
                CUMULATIVE_EXPENSES: <span id="pop-expense" style="color:var(--green)">₱ 0.00</span>
            </div>
        </div>
        <div class="btn-row">
            <button id="modal-submit" class="btn btn-save">CONFIRM</button>
            <button id="modal-close" class="btn" style="background:#222; color:#fff;">ABORT</button>
        </div>
    </div>
</div>

<div class="overlay" id="reserve-overlay">
    <div class="popup" style="border-color: var(--yellow);">
        <div style="color:var(--yellow); text-align:center; margin-bottom:18px; font-size:20px; font-weight:700;">ALERT MESSAGE?</div>
        <div style="text-align:center; color:#fff; margin-bottom:20px; font-family:var(--font-mono); font-size:14px;">Do you want to put this in reserve list?</div>
        <div class="btn-row">
            <button id="reserve-confirm" class="btn" style="background:var(--yellow); color:#000;">RESERVE</button>
            <button id="reserve-close" class="btn" style="background:#222; color:#fff;">CLOSE WINDOW</button>
        </div>
    </div>
</div>

<script type="module">
    import { DEVICE_REGISTRY } from './config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, getDoc, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const currentAgent = localStorage.getItem("cia_agent") || "AGENT_LZ";
    localStorage.setItem("agentName", currentAgent);

    const input = document.getElementById('mission-input');
    const actionBtn = document.getElementById('action-btn');
    const reserveBtn = document.getElementById('reserve-btn');
    const terminal = document.getElementById('terminal');
    const statusLabel = document.getElementById('mission-status');
    const weaponList = document.getElementById('weapon-list');

    let selectedWeaponID = "";
    let agentSignatures = []; 

    document.getElementById('prof-name').innerText = currentAgent;
    document.getElementById('avatar-init').innerText = currentAgent.charAt(0);

    // --- 1. LIVE FEEDBACKS (TERMINAL LOGS) ---
    const qLogs = query(collection(db, "terminal_logs"), orderBy("timestamp", "desc"), limit(20));
    onSnapshot(qLogs, (snap) => {
        terminal.innerHTML = "";
        snap.forEach(doc => {
            const data = doc.data();
            const time = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleTimeString('en-GB') : "PENDING";
            const div = document.createElement('div');
            div.className = "term-line";
            div.innerHTML = `<span style="color:#5c7882">[${time}]</span> <span style="color:${data.color}">${data.message}</span>`;
            terminal.appendChild(div);
        });
    });

    async function addLog(msg, color) {
        try {
            await addDoc(collection(db, "terminal_logs"), {
                agent: currentAgent, message: msg, color: color, timestamp: serverTimestamp()
            });
        } catch(e) { console.error(e); }
    }

    // Fetch Devices
    async function syncAgentDevices() {
        const snap = await getDoc(doc(db, "agents", currentAgent));
        agentSignatures = snap.exists() ? snap.data().linkedSignatures || [] : Object.keys(DEVICE_REGISTRY);
    }
    syncAgentDevices();

    // --- 2. AUTO-SEARCH LOGIC ---
    input.addEventListener('input', async () => {
        const val = input.value.trim();
        if (val.length < 4) { 
            statusLabel.innerHTML = ""; 
            reserveBtn.classList.remove('active'); 
            return; 
        }
        
        statusLabel.innerHTML = "SCANNING DATABASE...";
        const qM = query(collection(db, "mission_orders"), where("missionID", "==", val));
        const snapM = await getDocs(qM);

        if (!snapM.empty) {
            const data = snapM.docs[0].data();
            if (data.status === "RESERVED") {
                actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
                statusLabel.innerHTML = '<span class="status-reserved">STATUS: RESERVED</span>';
                reserveBtn.classList.remove('active');
            } else {
                actionBtn.className = "btn btn-retrieve"; actionBtn.textContent = "RETRIEVE";
                statusLabel.innerHTML = '<span class="status-deployed">STATUS: DEPLOYED</span>';
                reserveBtn.classList.remove('active');
            }
        } else {
            actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
            statusLabel.innerHTML = '<span style="color:#5c7882">STATUS: AVAILABLE</span>';
            reserveBtn.classList.add('active'); // Magiging clickable lang kapag available
        }
    });

    // --- 3. SAVE LOGIC WITH DATES ---
    actionBtn.onclick = () => {
        if (input.value.length < 4) return;
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('pop-header').innerText = `#${input.value}`;
        
        weaponList.innerHTML = "";
        agentSignatures.forEach(sig => {
            const b = document.createElement('button');
            b.className = "weapon-btn";
            b.innerText = `> ${DEVICE_REGISTRY[sig] || sig}`;
            b.onclick = () => {
                document.querySelectorAll('.weapon-btn').forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                selectedWeaponID = sig;
            };
            weaponList.appendChild(b);
        });
    };

    document.getElementById('modal-submit').onclick = async () => {
        const vID = document.getElementById('v-agent-input').value.trim();
        if (!vID || !selectedWeaponID) return alert("COMPLETE ALL DATA");

        const deployDate = new Date();
        const relieveDate = new Date();
        relieveDate.setDate(deployDate.getDate() + 30);

        const formatDate = (d) => `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;

        try {
            await setDoc(doc(db, "mission_orders", input.value), {
                missionID: input.value,
                agent: currentAgent,
                vAgentID: vID,
                weaponSystem: selectedWeaponID,
                status: "DEPLOYED",
                deploymentDate: formatDate(deployDate),
                relieveDate: formatDate(relieveDate),
                timestamp: serverTimestamp()
            }, { merge: true });

            addLog(`MISSION #${input.value} DEPLOYED TO ${vID}`, 'var(--green)');
            document.getElementById('modal-overlay').style.display = 'none';
            input.value = "";
        } catch(e) { alert("ERROR"); }
    };

    // --- 4. RESERVE SYSTEM ---
    reserveBtn.onclick = () => {
        document.getElementById('reserve-overlay').style.display = 'flex';
    };

    document.getElementById('reserve-confirm').onclick = async () => {
        try {
            await setDoc(doc(db, "mission_orders", input.value), {
                missionID: input.value,
                agent: currentAgent,
                status: "RESERVED",
                timestamp: serverTimestamp()
            });
            addLog(`MISSION #${input.value} MOVED TO RESERVE`, 'var(--yellow)');
            document.getElementById('reserve-overlay').style.display = 'none';
            input.value = "";
        } catch(e) { alert("FAILED"); }
    };

    document.getElementById('reserve-close').onclick = () => {
        document.getElementById('reserve-overlay').style.display = 'none';
    };

    document.getElementById('modal-close').onclick = () => {
        document.getElementById('modal-overlay').style.display = 'none';
    };

    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
