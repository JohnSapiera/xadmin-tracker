<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPDATE_DB - WEAPON RENAME</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #051014;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,243,255,0.1);
        }
        h2 {
            color: #00f3ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 18px;
        }
        /* Agents Section - Top Center */
        .agents-section {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a2f37;
        }
        .section-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #05ffa1;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 15px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 30px;
            transition: 0.2s;
        }
        .radio-group input[type="radio"] {
            accent-color: #00f3ff;
            width: 16px;
            height: 16px;
        }
        .radio-group label:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.15);
            color: #00f3ff;
        }
        /* Weapon System Row - Left and Right */
        .weapon-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .weapon-left {
            flex: 1;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
        }
        .weapon-right {
            flex: 1;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
        }
        .weapon-label {
            color: #00f3ff;
            font-size: 10px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }
        select, input {
            width: 100%;
            background: #01080b;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            padding: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            border-radius: 6px;
            outline: none;
            text-align: center;
        }
        select:focus, input:focus {
            border-color: #00f3ff;
        }
        /* Update Button - Center Bottom */
        .update-section {
            text-align: center;
            margin-top: 20px;
        }
        .update-btn {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .update-btn:hover {
            background: #05ffa1;
            box-shadow: 0 0 15px rgba(5,255,161,0.4);
        }
        .update-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
        }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
        .loading, .empty {
            text-align: center;
            color: #5c7882;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 WEAPON SYSTEM RENAME</h2>

        <!-- AGENTS SECTION (Top Center) -->
        <div class="agents-section">
            <div class="section-title">📡 SELECT AGENT</div>
            <div id="agentRadioGroup" class="radio-group">
                <div class="loading">Loading agents...</div>
            </div>
        </div>

        <!-- WEAPON SYSTEM ROW (Left: Dropdown, Right: Input) -->
        <div class="weapon-row">
            <div class="weapon-left">
                <div class="weapon-label">🔫 CURRENT WEAPON SYSTEM</div>
                <select id="weaponSelect" disabled>
                    <option>Select agent first</option>
                </select>
            </div>
            <div class="weapon-right">
                <div class="weapon-label">✏️ NEW WEAPON NAME</div>
                <input type="text" id="newWeaponName" placeholder="Enter new name" disabled>
            </div>
        </div>

        <!-- UPDATE BUTTON (Center Bottom) -->
        <div class="update-section">
            <button id="updateBtn" class="update-btn" disabled>💾 UPDATE WEAPON SYSTEM</button>
        </div>

        <div class="status" id="statusMsg">Ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // DOM Elements
        const agentRadioGroup = document.getElementById('agentRadioGroup');
        const weaponSelect = document.getElementById('weaponSelect');
        const newWeaponName = document.getElementById('newWeaponName');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('statusMsg');

        let allAgents = [];
        let currentAgent = null;
        let weaponSystems = [];

        // ========== LOAD AGENTS FROM mission_orders ==========
        async function loadAgents() {
            statusMsg.innerHTML = '⏳ Loading agents from database...';
            agentRadioGroup.innerHTML = '<div class="loading">Loading agents...</div>';
            
            try {
                const snapshot = await db.collection("mission_orders").get();
                const agentSet = new Set();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.agent && data.agent.trim() !== '') {
                        agentSet.add(data.agent);
                    }
                });
                
                allAgents = Array.from(agentSet).sort();
                
                if (allAgents.length === 0) {
                    agentRadioGroup.innerHTML = '<div class="empty">⚠️ No agents found in mission_orders</div>';
                    statusMsg.innerHTML = '<span class="error">No agents found. Please create missions first.</span>';
                } else {
                    renderAgentRadios();
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${allAgents.length} agent(s)</span>`;
                }
            } catch (error) {
                console.error("Error loading agents:", error);
                agentRadioGroup.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                statusMsg.innerHTML = `<span class="error">❌ Failed to load agents</span>`;
            }
        }

        function renderAgentRadios() {
            agentRadioGroup.innerHTML = '';
            allAgents.forEach(agent => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'agent';
                radio.value = agent;
                radio.onclick = () => selectAgent(agent);
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(` ${agent}`));
                agentRadioGroup.appendChild(label);
            });
        }

        // ========== SELECT AGENT: LOAD WEAPON SYSTEMS ==========
        async function selectAgent(agent) {
            currentAgent = agent;
            statusMsg.innerHTML = `⏳ Loading weapon systems for ${agent}...`;
            
            // Disable controls while loading
            weaponSelect.disabled = true;
            newWeaponName.disabled = true;
            updateBtn.disabled = true;
            weaponSelect.innerHTML = '<option>Loading...</option>';
            newWeaponName.value = '';
            
            try {
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", agent)
                    .get();
                
                const weaponSet = new Set();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.weaponSystem && data.weaponSystem.trim() !== '') {
                        weaponSet.add(data.weaponSystem);
                    }
                });
                
                weaponSystems = Array.from(weaponSet).sort();
                
                if (weaponSystems.length === 0) {
                    weaponSelect.innerHTML = '<option>No weapon systems found</option>';
                    weaponSelect.disabled = true;
                    newWeaponName.disabled = true;
                    updateBtn.disabled = true;
                    statusMsg.innerHTML = `<span class="error">⚠️ No weapon systems for ${agent}</span>`;
                } else {
                    // Populate dropdown
                    weaponSelect.innerHTML = '';
                    weaponSystems.forEach(weapon => {
                        const option = document.createElement('option');
                        option.value = weapon;
                        option.textContent = weapon;
                        weaponSelect.appendChild(option);
                    });
                    weaponSelect.disabled = false;
                    newWeaponName.disabled = false;
                    newWeaponName.value = weaponSystems[0];
                    updateBtn.disabled = false;
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${weaponSystems.length} weapon system(s) for ${agent}</span>`;
                }
                
                // Auto-fill new name with selected weapon
                weaponSelect.onchange = () => {
                    newWeaponName.value = weaponSelect.value;
                };
                
            } catch (error) {
                console.error("Error loading weapon systems:", error);
                weaponSelect.innerHTML = '<option>Error loading</option>';
                statusMsg.innerHTML = `<span class="error">❌ Failed to load weapon systems</span>`;
            }
        }

        // ========== UPDATE WEAPON SYSTEM NAME ==========
        async function updateWeaponSystem() {
            if (!currentAgent) {
                statusMsg.innerHTML = '<span class="error">❌ No agent selected</span>';
                return;
            }
            
            const oldName = weaponSelect.value;
            const newName = newWeaponName.value.trim();
            
            if (!oldName || oldName === 'Select agent first') {
                statusMsg.innerHTML = '<span class="error">❌ No weapon system selected</span>';
                return;
            }
            
            if (!newName || newName === '') {
                statusMsg.innerHTML = '<span class="error">❌ New weapon name cannot be empty</span>';
                return;
            }
            
            if (newName === oldName) {
                statusMsg.innerHTML = '<span class="error">⚠️ New name is same as old name</span>';
                return;
            }
            
            if (!confirm(`Rename "${oldName}" to "${newName}" for agent ${currentAgent}?\n\nThis will update ALL mission orders with this weapon system.`)) {
                return;
            }
            
            statusMsg.innerHTML = `⏳ Updating "${oldName}" → "${newName}"...`;
            updateBtn.disabled = true;
            
            try {
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", currentAgent)
                    .where("weaponSystem", "==", oldName)
                    .get();
                
                if (snapshot.empty) {
                    statusMsg.innerHTML = `<span class="error">❌ No mission orders found with weapon "${oldName}"</span>`;
                    updateBtn.disabled = false;
                    return;
                }
                
                let updateCount = 0;
                const batch = db.batch();
                
                snapshot.forEach(doc => {
                    const docRef = db.collection("mission_orders").doc(doc.id);
                    batch.update(docRef, { weaponSystem: newName });
                    updateCount++;
                });
                
                await batch.commit();
                
                // Update local weaponSystems array
                const index = weaponSystems.indexOf(oldName);
                if (index !== -1) weaponSystems[index] = newName;
                
                // Refresh dropdown
                weaponSelect.innerHTML = '';
                weaponSystems.forEach(weapon => {
                    const option = document.createElement('option');
                    option.value = weapon;
                    option.textContent = weapon;
                    weaponSelect.appendChild(option);
                });
                weaponSelect.value = newName;
                newWeaponName.value = newName;
                
                statusMsg.innerHTML = `<span class="success">✅ SUCCESS: Renamed "${oldName}" → "${newName}" (${updateCount} mission(s) updated)</span>`;
                
            } catch (error) {
                console.error("Error updating weapon name:", error);
                statusMsg.innerHTML = `<span class="error">❌ ERROR: ${error.message}</span>`;
            } finally {
                updateBtn.disabled = false;
            }
        }

        // Event listener for update button
        updateBtn.onclick = updateWeaponSystem;

        // Load agents on page load
        loadAgents();
    </script>
</body>
</html>
