<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#02080a">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --cia-border: rgba(0, 243, 255, 0.15);
            --font-digital: 'Share Tech Mono', monospace;
            --font-header: 'Rajdhani', sans-serif;
            --font-noir: 'Special Elite', cursive;
            --folder-color: #c5a059;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden; 
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        header { border-left: 4px solid var(--cia-cyan); padding-left: 15px; margin-bottom: 30px; }
        .section-title { font-family: var(--font-header); letter-spacing: 4px; color: var(--cia-cyan); text-transform: uppercase; }

        /* DEVICE GRID & SLIDE ANIMATIONS */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55); position: relative; }
        
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8); overflow: hidden;
            transition: 0.8s; filter: grayscale(1) brightness(0.4); 
        }

        /* Movement Classes */
        .move-right { transform: translateX(60px) scale(1.1); z-index: 10; }
        .move-left { transform: translateX(-60px) scale(1.1); z-index: 10; }

        .phone-screen {
            position: absolute; inset: 5px; background: #000; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.05); padding: 10px;
        }
        
        /* LIGHTS ON */
        .phone-wrapper.lights-on .phone-body { 
            filter: grayscale(0) brightness(1.2) contrast(1.1); 
            border-color: var(--cia-cyan); 
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.4); 
        }

        .activate-text { color: var(--cia-cyan); font-size: 9px; margin-top: 10px; letter-spacing: 1px; opacity: 0.6; }
        .typewriter-text { font-size: 10px; color: var(--cia-cyan); text-align: center; line-height: 1.4; }

        /* VAGENT FOLDER GRID */
        .vagent-grid { display: none; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 20px; }
        
        .folder-container { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        
        .folder-wrapper {
            width: 140px; height: 100px; background: var(--folder-color);
            position: relative; border-radius: 0 8px 8px 8px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4); transition: 0.3s;
        }
        .folder-wrapper::before {
            content: ""; position: absolute; top: -12px; left: 0; 
            width: 45px; height: 12px; background: var(--folder-color);
            border-radius: 6px 6px 0 0;
        }
        
        .paper-sheet-inner {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 85%; height: 85%; background: #fffdf5; border: 1px solid #dcd7c5;
            transition: 0.4s ease-out; z-index: 1; padding: 10px;
            color: #222; font-family: var(--font-noir); box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        
        .folder-container:hover .paper-sheet-inner { height: 110%; bottom: 20px; }
        
        .ghost-folder { opacity: 0.3; filter: grayscale(1) blur(1px); }
        .file-label { font-size: 11px; color: var(--cia-cyan); margin-top: 12px; font-weight: bold; }

        /* REST OF EXISTING STYLES */
        .memoirs-section { margin-top: 40px; text-align: center; border-top: 1px solid var(--cia-border); padding-top: 20px; }
        .btn-memoir {
            background: transparent; border: 1px solid var(--cia-red); color: var(--cia-red);
            padding: 12px 25px; font-family: var(--font-digital); font-size: 13px; font-weight: bold;
            cursor: pointer; transition: 0.3s; letter-spacing: 2px;
        }
        .overlay { display: none; position: fixed; inset: 0; z-index: 2000; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); }
        .paper-sheet {
            width: 90%; max-width: 400px; background: #e8e2d2; color: #1a1a1a;
            padding: 25px; font-family: var(--font-noir); position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); max-height: 85vh; overflow-y: auto; border: 1px solid #c5b8a0;
        }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.2); padding: 5px 0; font-size: 12px; }
        .btn-terminate {
            background: var(--cia-red); color: #fff; font-family: var(--font-digital); font-weight: bold;
            font-size: 14px; width: 100%; border: none; padding: 12px; margin-top: 20px; cursor: pointer;
        }
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--cia-border); z-index: 1000; }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #444; text-decoration: none; font-size: 11px; font-weight: bold; }
        .nav-link.active { color: var(--cia-cyan); border-top: 2px solid var(--cia-cyan); background: rgba(0, 243, 255, 0.05); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 class="section-title" id="display-agent">AGENT_UNDEFINED</h2>
        <p style="font-size: 9px; opacity: 0.5; color: var(--cia-cyan);">NODE_RECOVERY // STATUS: ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid">
        <div style="grid-column: span 2; text-align: center; font-size: 12px; color: var(--cia-cyan);" id="loading-text">SCANNING MISSION_ORDERS...</div>
    </div>
    
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:12px; width:100%; margin-top:20px; font-family:var(--font-digital); cursor:pointer;">
        [ << SECURE_LOGOUT_DEVICE ]
    </button>

    <div class="memoirs-section">
        <button class="btn-memoir" onclick="openMasterLedger()">[ VIEW_MEMOIRS ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="paper-sheet">
        <div onclick="closeNoir()" style="position:absolute; top:10px; right:15px; cursor:pointer; font-weight:bold; color:#8b0000;">[ X ]</div>
        <h3 style="text-align: center;">TOP SECRET</h3>
        <p style="text-align: center; font-size: 10px; border-bottom: 2px solid #000; padding-bottom: 5px;">CENTRAL INTELLIGENCE ARCHIVE</p>
        <div id="noir-content" style="font-size: 12px; margin-top: 15px;">
             <p><b>MISSION_ORDER#:</b> <span id="n-order">---</span></p>
             <p><b>vAGENT_ID:</b> <span id="n-vagent" style="font-weight:bold;">---</span></p>
             <div id="history-list" style="margin-top:10px; max-height: 150px; overflow-y: auto;"></div>
             <p style="text-align:right; font-weight:bold; font-size:16px; margin-top:10px;">TOTAL: <span id="n-total">₱ 0.00</span></p>
        </div>
        <button class="btn-terminate" id="terminate-btn" onclick="terminateAgent()">[ TERMINATE ]</button>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="paper-sheet" style="max-width: 450px;">
        <div onclick="document.getElementById('memoirsOverlay').style.display='none'" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#8b0000;">[ X ]</div>
        <h3 style="text-align: center; border-bottom: 2px solid #000;">AGENT MEMOIRS</h3>
        <div id="memoirs-list" style="font-size: 13px; margin-top:15px;"></div>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="intel.html" class="nav-link">INTEL</a>
    <a href="#" class="nav-link active">PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fullWeaponMap = { "SIG-20452634": "REDMI NOTE 14 PRO", "SIG-5B0D3A5C": "REALME 8 PRO", "SIG-121B8F43": "Techno Camon 40 PRO 5G" };
    const currentAgent = localStorage.getItem("cia_agent") || "AGENT_LZ";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {};
    let allMissionsData = [];
    let activeDocID = null;

    window.onload = async () => {
        try {
            const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
            const snap = await getDocs(q);
            if(snap.empty) {
                document.getElementById('loading-text').innerText = "NO DEVICES FOUND.";
                return;
            }
            snap.forEach(d => {
                const data = d.data();
                allMissionsData.push({...data, id: d.id});
                if (data.vAgentID && data.vAgentID.trim() !== "") {
                    const weaponName = fullWeaponMap[data.weaponSystem] || data.weaponSystem || "UNKNOWN_DEVICE";
                    if(!deviceData[weaponName]) deviceData[weaponName] = [];
                    deviceData[weaponName].push({ ...data, id: d.id });
                }
            });
            renderDevices();
        } catch (e) { console.error(e); }
    };

    function renderDevices() {
        const grid = document.getElementById('deviceSection');
        grid.innerHTML = "";
        document.getElementById('loading-text').style.display = "none";

        Object.keys(deviceData).forEach((name, index) => {
            const side = (index % 2 === 0) ? 'left' : 'right';
            const wrapper = document.createElement('div');
            wrapper.className = "phone-wrapper";
            wrapper.id = `dev-${index}`;
            wrapper.onclick = () => activateDevice(name, wrapper, side);
            
            wrapper.innerHTML = `
                <div class="phone-body">
                    <div class="phone-screen">
                        <div id="type-${index}" class="typewriter-text"></div>
                    </div>
                </div>
                <div class="activate-text">[ OFFLINE ]</div>
            `;
            grid.appendChild(wrapper);
        });
    }

    async function activateDevice(name, element, side) {
        // 1. Move Logic
        if(side === 'left') element.classList.add('move-right');
        else element.classList.add('move-left');

        // 2. Lights On
        element.classList.add('lights-on');
        element.querySelector('.activate-text').innerText = "[ UPLINKING... ]";

        // 3. Fade others
        document.querySelectorAll('.phone-wrapper').forEach(el => {
            if(el !== element) el.style.opacity = "0";
        });

        // 4. Typewriter Animation
        const typeBox = element.querySelector('.typewriter-text');
        const text = `Welcome...\nDevice: ${name}\nStatus: Decrypting...`;
        await runTypewriter(text, typeBox);

        setTimeout(() => showvAgents(name), 1000);
    }

    function runTypewriter(text, element) {
        return new Promise(resolve => {
            let i = 0;
            element.innerHTML = "";
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i) === "\n" ? "<br>" : text.charAt(i);
                    i++;
                    setTimeout(type, 40);
                } else resolve();
            }
            type();
        });
    }

    window.showvAgents = (name) => {
        document.getElementById('deviceSection').style.display = 'none';
        document.getElementById('vagentSection').style.display = 'grid';
        document.getElementById('btnBack').style.display = 'block';
        
        const grid = document.getElementById('vagentSection');
        const sortedAgents = deviceData[name].sort((a, b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));

        let filesHTML = sortedAgents.map(v => `
            <div class="folder-container" onclick="openNoirModal('${v.id}')">
                <div class="folder-wrapper">
                    <div class="paper-sheet-inner">
                        <div style="font-size:14px; font-weight:bold; border-bottom:1px solid #ddd;">FILE: #${v.vAgentID}</div>
                        <div style="font-size:8px; margin-top:5px; color:#666;">CONFIDENTIAL_DATA_NODE</div>
                    </div>
                </div>
                <div class="file-label">vAGENT_${v.vAgentID}</div>
            </div>
        `).join('');

        // Shadow Folder
        filesHTML += `
            <div class="folder-container ghost-folder">
                <div class="folder-wrapper">
                    <div class="paper-sheet-inner"></div>
                </div>
                <div class="file-label">ENCRYPTED</div>
            </div>
        `;
        grid.innerHTML = filesHTML;
    };

    // Standard Logic for Modals & Termination
    window.openNoirModal = async (docID) => {
        document.getElementById('noirOverlay').style.display = 'flex';
        activeDocID = docID;
        try {
            const docSnap = await getDoc(doc(db, "mission_orders", docID));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('n-order').innerText = docID;
                document.getElementById('n-vagent').innerText = data.vAgentID;
                const total = data.totalExpenses || 0;
                document.getElementById('n-total').innerText = `₱ ${total.toLocaleString()}`;
            }
        } catch (e) { console.error(e); }
    };

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';

    window.terminateAgent = async () => {
        if(!activeDocID || !confirm("TERMINATE THIS AGENT?")) return;
        try {
            await updateDoc(doc(db, "mission_orders", activeDocID), { vAgentID: "" });
            location.reload();
        } catch(e) { alert("FAILED"); }
    };
    
    // Placeholder for Master Ledger
    window.openMasterLedger = () => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        const mList = document.getElementById('memoirs-list');
        const missionsWithExpenses = allMissionsData.filter(m => m.totalExpenses > 0);
        mList.innerHTML = missionsWithExpenses.map(m => `
            <div class="expense-row">
                <span>#${m.vAgentID || 'VACANT'}</span>
                <span>₱ ${m.totalExpenses.toLocaleString()}</span>
            </div>
        `).join('');
    };
</script>
</body>
</html>
