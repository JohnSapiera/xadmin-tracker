<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SECURE TERMINAL • CIA INTELLIGENCE</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
<div class="terminal">
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="fingerprint-section">
            <span class="fp-icon">🖨️</span>
            <span class="fp-value" id="fingerprintText">--:--:--</span>
        </div>
        <div class="signal-section">
            <div class="signal-bars" id="signalBars">
                <div class="bar bar-1" id="bar1"></div>
                <div class="bar bar-2" id="bar2"></div>
                <div class="bar bar-3" id="bar3"></div>
            </div>
            <div class="battery">
                <span>🔋</span>
                <div class="battery-level">
                    <div class="battery-fill" id="batteryFill"></div>
                </div>
                <span id="batteryPercent">90%</span>
            </div>
        </div>
    </div>

    <!-- CRT Monitor / Terminal Screen -->
    <div class="crt-monitor">
        <div class="terminal-screen">
            <div class="typed-line" id="typedLine">> Enter your 4 Digit Key..</div>
            <div class="display-message" id="displayMessage"></div>
        </div>
    </div>

    <!-- Hidden Input Tracker -->
    <div class="hidden-code" id="hiddenCode"></div>

    <!-- Keypad - Circles -->
    <div class="keypad">
        <div class="key-row">
            <div class="key-circle" data-digit="1">1</div>
            <div class="key-circle" data-digit="2">2</div>
            <div class="key-circle" data-digit="3">3</div>
        </div>
        <div class="key-row">
            <div class="key-circle" data-digit="4">4</div>
            <div class="key-circle" data-digit="5">5</div>
            <div class="key-circle" data-digit="6">6</div>
        </div>
        <div class="key-row">
            <div class="key-circle" data-digit="7">7</div>
            <div class="key-circle" data-digit="8">8</div>
            <div class="key-circle" data-digit="9">9</div>
        </div>
        <div class="key-row">
            <div class="key-circle key-zero" data-digit="0">0</div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <div class="action-btn" id="clearBtn">CLEAR</div>
        <div class="action-btn reset" id="resetBtn">RESET</div>
    </div>

    <!-- Agent Info Panel -->
    <div class="agent-panel" id="agentPanel">
        <div class="agent-row">
            <span class="agent-label">AGENT DESIGNATION</span>
            <span class="agent-value" id="agentName">—</span>
        </div>
        <div class="agent-row">
            <span class="agent-label">CLEARANCE LEVEL</span>
            <span class="agent-value">ALPHA / OMEGA</span>
        </div>
        <hr>
        <div class="agent-label">REGISTERED DEVICES</div>
        <div class="devices-list" id="devicesList"></div>
    </div>
</div>

<script>
    // DASHBOARD SCRIPT - Retrieve data from localStorage (from Supabase agents)
    
    // Check if user is logged in
    const agentName = localStorage.getItem("cia_agent");
    const deviceFingerprint = localStorage.getItem("device_fingerprint");
    const devicesRaw = localStorage.getItem("agent_devices");
    const secretKey = localStorage.getItem("secret_key");
    const lastAuth = localStorage.getItem("last_auth");
    
    // If no session, redirect to index.html (login page)
    if (!agentName) {
        window.location.href = "index.html";
    }
    
    // Display Agent Name
    const agentNameElement = document.getElementById('agentName');
    if (agentNameElement) {
        agentNameElement.innerText = agentName;
    }
    
    // Display Devices (weaponSystem)
    let devices = [];
    if (devicesRaw) {
        try {
            devices = JSON.parse(devicesRaw);
        } catch(e) {
            devices = [];
        }
    }
    
    const devicesListElement = document.getElementById('devicesList');
    if (devicesListElement) {
        if (devices.length > 0) {
            devicesListElement.innerHTML = devices.map(d => `<span class="device-tag">📱 ${d}</span>`).join('');
        } else {
            devicesListElement.innerHTML = '<span class="device-tag">⚠️ No devices registered</span>';
        }
    }
    
    // Display Fingerprint in status bar
    const fingerprintTextElement = document.getElementById('fingerprintText');
    if (fingerprintTextElement && deviceFingerprint) {
        fingerprintTextElement.innerText = deviceFingerprint;
    }
    
    // Update typed line to show dashboard mode
    const typedLineElement = document.getElementById('typedLine');
    if (typedLineElement) {
        typedLineElement.innerHTML = '> Welcome, ' + agentName + ' | Secure Dashboard';
        typedLineElement.style.borderRight = 'none';
    }
    
    // Update status message
    const displayMessageElement = document.getElementById('displayMessage');
    if (displayMessageElement) {
        displayMessageElement.innerHTML = '✓ Session Active | ' + new Date().toLocaleString();
        displayMessageElement.classList.add('success');
    }
    
    // Hide keypad on dashboard (optional - remove if you want to keep it)
    const keypadElement = document.querySelector('.keypad');
    if (keypadElement) {
        // keypadElement.style.display = 'none'; // Uncomment if you want to hide keypad on dashboard
    }
    
    // Hide action buttons (optional)
    const actionButtons = document.querySelector('.action-buttons');
    if (actionButtons) {
        // actionButtons.style.display = 'none'; // Uncomment if you want to hide buttons
    }
    
    console.log("✅ DASHBOARD DATA FROM LOCALSTORAGE (Supabase):");
    console.log("   AGENT:", agentName);
    console.log("   SECRET KEY:", secretKey);
    console.log("   DEVICE FINGERPRINT:", deviceFingerprint);
    console.log("   DEVICES (weaponSystem):", devices);
    console.log("   LAST AUTH:", lastAuth);
</script>
</body>
</html>
