<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>AGENCY_INTEL_v24.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #01080b; --cyan: #00f3ff; --red: #ff003c; --green: #00ff66; 
            --border: rgba(0, 243, 255, 0.15); --mono: 'Share Tech Mono', monospace; 
            --glass: rgba(2, 12, 18, 0.95);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* NEON PULSE ANIMATION */
        @keyframes neonPulse {
            0% { text-shadow: 0 0 2px var(--green); opacity: 0.7; box-shadow: inset 0 0 5px var(--green); }
            50% { text-shadow: 0 0 15px var(--green), 0 0 25px var(--green); opacity: 1; color: #fff; box-shadow: inset 0 0 15px var(--green); }
            100% { text-shadow: 0 0 2px var(--green); opacity: 0.7; box-shadow: inset 0 0 5px var(--green); }
        }

        header { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; background: #000; }
        .intel-title { font-family: var(--mono); color: var(--cyan); font-size: 14px; letter-spacing: 5px; }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; text-align: center; }
        
        .agent-name { font-size: 42px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #fff; margin-bottom: 5px; }
        .device-tag { font-size: 10px; color: #5c7882; font-family: var(--mono); letter-spacing: 1px; }

        .report-btn { 
            margin-top: 40px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); 
            padding: 20px 40px; font-family: var(--mono); font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; backdrop-filter: blur(10px); }
        .modal-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 380px; background: var(--glass); 
            border: 1px solid var(--border); border-top: 4px solid var(--cyan); padding: 30px;
        }

        .input-group { margin-bottom: 20px; }
        .input-label { font-family: var(--mono); font-size: 10px; color: var(--cyan); margin-bottom: 8px; display: block; text-align: left; }
        
        .intel-input { 
            width: 100%; background: #05131a; border: 1px solid #1a2f37; padding: 15px; 
            color: #fff; font-family: var(--mono); font-size: 18px; outline: none; text-align: center;
        }

        .weapon-detected-active { 
            border-color: var(--green) !important; 
            animation: neonPulse 1.5s infinite; 
            color: var(--green) !important;
        }

        #weapon-list .grid-item {
            margin-top: 10px; padding: 15px; border: 1px solid #1a2f37;
            background: rgba(0,255,102,0.05); font-family: var(--mono);
            font-size: 14px; text-transform: uppercase;
        }

        .btn-transmit { 
            width: 100%; padding: 18px; background: var(--cyan); color: #000; 
            border: none; font-family: var(--mono); font-size: 16px; font-weight: 900; 
            cursor: pointer; margin-top: 10px;
        }
        .btn-transmit:disabled { opacity: 0.1; pointer-events: none; }

        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #444; font-family: var(--mono); text-decoration: none; font-size: 12px; }
        .nav-link.active { color: var(--cyan); border-top: 2px solid var(--cyan); }
    </style>
</head>
<body>

<header><div class="intel-title">INTEL_TERMINAL_V24</div></header>

<main>
    <div id="display-name" class="agent-name">---</div>
    <div id="device-tag" class="device-tag">LINKING_SESSION...</div>
    
    <button class="report-btn" onclick="openReport()">[ INITIATE_BOUNTY_REPORT ]</button>
</main>

<div id="report-modal" class="modal">
    <div class="modal-box">
        <h2 style="font-family:var(--mono); font-size:12px; color:var(--cyan); text-align:center; margin-bottom:20px;">DATA_UPLINK</h2>
        
        <div id="scan-status" style="font-size:10px; color:#5c7882; text-align:center; margin-bottom:15px;">AWAITING_V_AGENT_ID...</div>

        <div class="input-group">
            <span class="input-label">SEARCH_V_AGENT_NO</span>
            <input type="text" id="vAgentInput" class="intel-input" placeholder="0000" autocomplete="off">
        </div>

        <div id="weapon-zone" style="display:none; margin-bottom:20px;">
            <span class="input-label">WEAPON_SYSTEM_STATUS</span>
            <div id="weapon-list"></div>
        </div>

        <div class="input-group">
            <span class="input-label">BOUNTY_EXPENSES (PHP)</span>
            <input type="number" id="expensesInput" class="intel-input" placeholder="0.00">
        </div>

        <button id="transmit-btn" onclick="transmitData()" class="btn-transmit" disabled>INCOMPLETE_DATA</button>
        <button onclick="closeReport()" style="width:100%; background:transparent; color:var(--red); border:none; margin-top:15px; font-family:var(--mono); cursor:pointer; font-size:10px;">// ABORT</button>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="#" class="nav-link active">INTEL</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedWeapon = "N/A";

    // 1. Session Check
    window.onload = () => {
        const name = localStorage.getItem("cia_agent");
        if (!name) window.location.href = "index.html";
        document.getElementById('display-name').innerText = name;
        document.getElementById('device-tag').innerText = "SECURE_UPLINK_STABLE // " + (localStorage.getItem("intel_device_signature") || "UNKNOWN");
    };

    // 2. Scan Logic (V_AGENT_NO to vAgentID)
    const handleScan = async (val) => {
        const status = document.getElementById('scan-status');
        const weaponZone = document.getElementById('weapon-zone');
        const weaponList = document.getElementById('weapon-list');
        const cleanVal = val.trim();

        if(cleanVal.length < 1) {
            weaponZone.style.display = "none";
            status.innerText = "AWAITING_V_AGENT_ID...";
            return;
        }

        status.innerText = ">> SEARCHING_DATABASE...";

        try {
            // Hinahanap ang vAgentID na string (e.g. "3232") sa mission_orders
            const q = query(collection(db, "mission_orders"), where("vAgentID", "==", cleanVal));
            const snap = await getDocs(q);

            if (!snap.empty) {
                const data = snap.docs[0].data();
                status.innerText = ">> TARGET_CONFIRMED: " + (data.missionID || "MISSION_ACTIVE");
                status.style.color = "var(--green)";

                weaponZone.style.display = "block";
                const weapon = data.weaponSystem || "N/A";
                
                // Ipakita ang weapon na may Pulse Animation
                weaponList.innerHTML = `<div class="grid-item weapon-detected-active">${weapon}</div>`;
                selectedWeapon = weapon;
            } else {
                status.innerText = ">> NO_MATCHING_ID_FOUND";
                status.style.color = "#5c7882";
                weaponZone.style.display = "none";
                selectedWeapon = "N/A";
            }
            validateForm();
        } catch (e) {
            console.error("Query Error:", e);
            status.innerText = ">> SYSTEM_OFFLINE";
        }
    };

    const validateForm = () => {
        const v = document.getElementById('vAgentInput').value;
        const e = document.getElementById('expensesInput').value;
        const btn = document.getElementById('transmit-btn');
        if (v.length > 0 && e > 0 && selectedWeapon !== "N/A") {
            btn.disabled = false;
            btn.innerText = "CONFIRM_TRANSMISSION";
        } else {
            btn.disabled = true;
            btn.innerText = "INCOMPLETE_DATA";
        }
    };

    // 3. Transmit
    window.transmitData = async () => {
        const v = document.getElementById('vAgentInput').value;
        const e = document.getElementById('expensesInput').value;
        const agent = localStorage.getItem("cia_agent");

        try {
            await addDoc(collection(db, "bounties"), {
                reportedBy: agent,
                targetV_Agent: v,
                weaponUsed: selectedWeapon,
                amount: parseFloat(e),
                timestamp: serverTimestamp()
            });
            alert("TRANSMISSION_COMPLETE");
            location.reload();
        } catch (err) { alert("ERROR_SENDING_DATA"); }
    };

    // Events
    document.getElementById('vAgentInput').addEventListener('input', (e) => handleScan(e.target.value));
    document.getElementById('expensesInput').addEventListener('input', validateForm);
    window.openReport = () => document.getElementById('report-modal').style.display = 'block';
    window.closeReport = () => document.getElementById('report-modal').style.display = 'none';
</script>
</body>
</html>
