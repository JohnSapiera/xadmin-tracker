<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        /* --- DEVICE DESIGN --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.4s; }
        
        /* Pre-click movement logic */
        .phone-wrapper:nth-child(odd):hover { transform: translateX(10px); }
        .phone-wrapper:nth-child(even):hover { transform: translateX(-10px); }

        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            filter: grayscale(1) brightness(0.3);
            transition: all 0.5s ease;
        }

        /* --- THE "WHITE SCREEN" LIGHTS ON --- */
        .phone-wrapper.lights-on .phone-body {
            filter: grayscale(0) brightness(1);
            border-color: var(--cia-cyan);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.6);
        }

        .phone-screen {
            position: absolute; inset: 5px; background: #000; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.3s ease-in; /* Bibilis ang pagputi */
            overflow: hidden;
        }

        /* Pag-click, magiging PURE WHITE */
        .phone-wrapper.lights-on .phone-screen {
            background: #ffffff; 
            box-shadow: inset 0 0 20px rgba(255,255,255,1);
        }

        /* Ang text ay lalabas pagkatapos mag-white screen */
        .typing-text {
            display: none; color: #000; font-size: 11px; font-weight: bold;
            width: 0; overflow: hidden; white-space: nowrap; 
            border-right: 2px solid #000;
        }

        .phone-wrapper.lights-on .typing-text {
            display: block;
            animation: typing 0.8s steps(15) 0.4s forwards; /* Delay para makita muna ang white screen */
        }

        @keyframes typing { from { width: 0 } to { width: 90% } }

        /* --- FOLDERS & MEMOIRS (SAME LOGIC) --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .folder-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 15px; }
        .folder-main { width: 50px; height: 35px; background: var(--cia-cyan); border-radius: 0 4px 4px 4px; z-index: 2; clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%); }
        .paper-sheet { position: absolute; top: 8px; width: 38px; height: 32px; background: #fff; border: 1px solid #ccc; z-index: 1; transition: 0.3s; }
        .folder-box:hover .paper-sheet { transform: translateY(-10px); }

        /* OVERLAYS & PAGE FLIP */
        .overlay { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .book { width: 90%; max-width: 400px; height: 75vh; perspective: 1500px; }
        .page { width: 100%; height: 100%; background: #e8e2d2; color: #1a1a1a; padding: 30px; font-family: var(--font-noir); position: absolute; box-shadow: 0 0 15px rgba(0,0,0,0.5); transition: transform 0.8s; transform-origin: left; backface-visibility: hidden; overflow-y: auto; border: 1px solid #c5b8a0; }
        .page.flipped { transform: rotateY(-180deg); }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.3); padding: 8px 0; font-size: 13px; }
        .btn-page { position: absolute; bottom: 15px; right: 20px; font-weight: bold; cursor: pointer; border-bottom: 2px solid #000; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px;">AGENT_LZ</h2>
        <p style="font-size: 9px; opacity: 0.5;">MEMOIRS_PROTOCOL_ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:10px; width:100%; margin-top:20px; cursor:pointer;">[ EXIT_DEVICE_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 40px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 25px; cursor:pointer; font-weight:bold;">[ VIEW_MASTER_MEMOIRS ]</button>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="book">
        <div id="p1" class="page">
            <h3 style="text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px;">CLASSIFIED REPORT</h3>
            <p style="font-size: 10px; margin-bottom: 20px;">TARGET: <span id="target-name">MASTER_LEDGER</span></p>
            <div id="active-list"></div>
            <div class="btn-page" onclick="flip(true)">NEXT PAGE >></div>
        </div>
        <div id="p2" class="page" style="transform: rotateY(180deg);">
            <h4 style="border-bottom: 1px solid #000; margin-bottom: 10px;">VACANT_LOGS</h4>
            <div id="vacant-list"></div>
            <div style="margin-top: 30px; border-top: 2px solid #000; text-align: right; font-weight: bold; font-size: 18px;">
                TOTAL: <span id="total-val">₱ 0.00</span>
            </div>
            <div class="btn-page" style="left:20px; right:auto;" onclick="flip(false)"><< PREV</div>
            <div onclick="closeMemoirs()" style="position:absolute; top:10px; right:15px; cursor:pointer; color:#8b0000; font-weight:bold;">[ CLOSE ]</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const fullWeaponMap = { "SIG-20452634": "REDMI NOTE 14 PRO", "SIG-5B0D3A5C": "REALME 8 PRO", "SIG-121B8F43": "Techno Camon 40 PRO 5G" };
    const currentAgent = localStorage.getItem("cia_agent") || "AGENT_LZ";

    let deviceData = {};
    let allMissions = [];

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        snap.forEach(d => {
            const data = d.data();
            allMissions.push({...data, id: d.id});
            const name = fullWeaponMap[data.weaponSystem] || data.weaponSystem;
            if(data.vAgentID) {
                if(!deviceData[name]) deviceData[name] = [];
                deviceData[name].push({...data, id: d.id});
            }
        });
        renderDevices();
    };

    function renderDevices() {
        const grid = document.getElementById('deviceSection');
        grid.innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body">
                    <div class="phone-screen">
                        <div class="typing-text">WELCOME<br>NODE_${name}</div>
                    </div>
                </div>
                <div style="font-size:9px; color:var(--cia-cyan); margin-top:10px;">[ STANDBY_LINK ]</div>
            </div>
        `).join('');
    }

    window.activateDevice = (name, element) => {
        element.classList.add('lights-on'); // TRIGGER WHITE SCREEN
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `
                <button onclick="openMemoirs('${name}')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:10px; width:100%; cursor:pointer;">[ VIEW_${name}_MEMOIRS ]</button>
            `;

            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => `
                <div class="folder-box">
                    <div class="paper-sheet"></div>
                    <div class="folder-main"></div>
                    <div class="file-label">#${v.vAgentID}</div>
                </div>
            `).join('');
        }, 1800); // 1.8s duration para masulit ang white flare
    };

    window.openMemoirs = (mode) => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        const activeList = document.getElementById('active-list');
        const vacantList = document.getElementById('vacant-list');
        let total = 0;

        let filtered = (mode === 'ALL') ? allMissions : allMissions.filter(m => (fullWeaponMap[m.weaponSystem] || m.weaponSystem) === mode);

        const active = filtered.filter(m => m.vAgentID && m.totalExpenses > 0);
        const vacant = filtered.filter(m => !m.vAgentID && m.totalExpenses > 0);

        activeList.innerHTML = active.map(m => {
            total += m.totalExpenses;
            return `<div class="expense-row"><span>vAgent #${m.vAgentID}</span><b>₱ ${m.totalExpenses.toLocaleString()}</b></div>`;
        }).join('') || "NO_DATA";

        vacantList.innerHTML = vacant.map(m => {
            total += m.totalExpenses;
            return `<div class="expense-row"><span>ID:${m.id.substring(0,5)}</span><b>₱ ${m.totalExpenses.toLocaleString()}</b></div>`;
        }).join('') || "NO_DATA";

        document.getElementById('target-name').innerText = mode;
        document.getElementById('total-val').innerText = `₱ ${total.toLocaleString(undefined, {minimumFractionDigits:2})}`;
    };

    window.flip = (next) => {
        const p1 = document.getElementById('p1');
        const p2 = document.getElementById('p2');
        if(next) { p1.classList.add('flipped'); p2.style.transform = "rotateY(0deg)"; }
        else { p1.classList.remove('flipped'); p2.style.transform = "rotateY(180deg)"; }
    };

    window.closeMemoirs = () => document.getElementById('memoirsOverlay').style.display = 'none';
</script>
</body>
</html>
