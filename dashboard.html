<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CORE_DASH_v25.6_FINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #02080a; --panel: rgba(5, 15, 20, 0.85); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
      --green: #05ffa1; --border: rgba(0, 243, 255, 0.2);
      --font-main: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
        background: var(--bg); color: #e1f5f9; font-family: var(--font-main); 
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        background-image: 
            radial-gradient(circle at 50% 50%, #0a252e 0%, #02080a 100%),
            linear-gradient(var(--border) 1px, transparent 1px), 
            linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    .uplinking { position: relative; color: transparent !important; pointer-events: none; }
    .uplinking::after {
        content: "UPLINKING..."; position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        color: var(--cyan); font-size: 14px; letter-spacing: 2px;
        animation: pulse-text 0.8s infinite;
    }
    @keyframes pulse-text { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; text-shadow: 0 0 10px var(--cyan); } }

    header { padding: 18px 20px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .profile-link { background: var(--cyan-dim); border: 1px solid var(--cyan); color: var(--cyan); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; padding: 6px 12px; text-decoration: none; font-weight: bold; }

    .status-bar { font-size: 11px; padding: 10px 20px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }

    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; display: flex; flex-direction: column; gap: 20px; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 25px; position: relative; backdrop-filter: blur(10px); clip-path: polygon(0 0, 100% 0, 100% 90%, 92% 100%, 0 100%); }

    #mission-input { width: 100%; background: rgba(0,0,0,0.6); border: none; border-bottom: 2px solid var(--cyan); color: #fff; font-family: var(--font-mono); font-size: 55px; font-weight: 700; padding: 15px 0; text-align: center; letter-spacing: 12px; outline: none; margin-bottom: 20px; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { height: 55px; font-family: var(--font-main); font-size: 18px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-save { background: var(--green); color: #01080a; }
    .btn-retrieve { background: var(--blue); color: #fff; }
    .btn-reserve { background: transparent; color: #fff; border: 1px solid #fff; opacity: 0.8; }

    #terminal { background: rgba(0,0,0,0.7); border-left: 3px solid var(--cyan); padding: 15px; font-family: var(--font-mono); font-size: 11px; height: 180px; color: #9ab4bc; overflow-y: auto; line-height: 1.5; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(1, 4, 5, 0.98); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .popup { width: 100%; max-width: 380px; background: #051014; border: 1px solid var(--cyan); padding: 25px; position: relative; }
    .pop-title { font-size: 48px; color: var(--cyan); text-align: center; font-weight: 700; font-family: var(--font-main); letter-spacing: -2px; }
    
    .data-card { background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
    .data-label { color: #5c7882; text-transform: uppercase; font-size: 11px; font-family: var(--font-mono); }
    
    .pop-input { background: #000; border: 1px solid var(--cyan); color: var(--green); font-family: var(--font-mono); font-size: 16px; padding: 8px; width: 150px; text-align: right; outline: none; }

    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
    .dev-btn { background: #08161b; border: 1px solid #1a2f37; color: #5c7882; padding: 10px; font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
    .dev-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); box-shadow: 0 0 10px var(--cyan-dim); }

    .pop-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tactical-btn { height: 50px; font-family: var(--font-main); font-size: 18px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; }
    .btn-confirm { background: var(--green); color: #000; }
    .btn-abort { background: transparent; color: var(--red); border: 1px solid var(--red); }

    .cia-scanner { width: 100px; height: 100px; border: 1px solid var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 30px; }
    .cia-scanner::before { content: ""; position: absolute; width: 80%; height: 1px; background: var(--green); animation: scan-line 2s linear infinite; }
    @keyframes scan-line { 0% { top: 20%; opacity: 0; } 50% { opacity: 1; } 100% { top: 80%; opacity: 0; } }

    nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 2px solid var(--cyan); display: grid; grid-template-columns: 1fr 1fr; z-index: 90; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #4a5a61; font-size: 11px; text-decoration: none; font-family: var(--font-mono); }
    .nav-btn.active { color: var(--cyan); background: var(--cyan-dim); font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="width:4px; height:20px; background:var(--cyan);"></div>
    <span style="font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 1px;">CORE_DASH</span>
  </div>
  <a href="profile.html" class="profile-link">ID:AGENT_SECURE</a>
</header>

<div class="status-bar">
    <div style="display:flex; gap:15px">
        <span id="clock">00:00:00</span>
        <span style="color:var(--border)">|</span>
        <span>DEVICE: <span id="sync-device-name" style="color:#fff">IDENTIFYING...</span></span>
    </div>
    <span>UPLINK: <span style="color:var(--green)">SYNC_ACTIVE</span></span>
</div>

<main>
  <div class="command-module">
    <div style="font-size: 10px; color: var(--cyan); margin-bottom: 10px; font-family:var(--font-mono)">// ENTER_TARGET_ID</div>
    <input type="tel" id="mission-input" placeholder="----" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
    </div>
  </div>
  <div id="terminal"></div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup" id="popup-box">
        <div class="pop-title" id="pop-m-id">#0000</div>
        <div id="pop-agent" style="text-align:center; font-size:10px; color:#5c7882; margin-bottom:20px;">AGENT_NAME</div>
        
        <div class="data-card">
            <div class="data-row">
                <span class="data-label">V_AGENT_NO:</span> 
                <input type="text" id="v-agent-input" class="pop-input" placeholder="0000">
            </div>
            <div class="data-row">
                <span class="data-label">EXPENSES (PHP):</span> 
                <input type="number" id="expenses-input" class="pop-input" placeholder="0.00">
            </div>
            <div id="date-info" style="display:none; border-top: 1px solid var(--border); margin-top:10px; padding-top:10px;">
                <div class="data-row"><span class="data-label">ORIGINAL_DEPLOY:</span> <span id="pop-dep" style="color:#fff">--/--</span></div>
            </div>
        </div>

        <div class="data-label" style="margin-bottom:5px">Target Weapon System:</div>
        <div class="device-grid" id="pop-device-list"></div>
        
        <div class="pop-btn-row">
            <button id="uplink-confirm-btn" onclick="submitMission()" class="tactical-btn btn-confirm">UPLINK</button>
            <button onclick="closePopup()" class="tactical-btn btn-abort">CANCEL</button>
        </div>
    </div>
</div>

<div class="overlay" id="success-screen" style="flex-direction: column; background: #01080a; z-index: 9999;">
    <div class="cia-scanner">
        <div style="font-size: 10px; color: var(--green); font-weight: bold;">CLEARED</div>
    </div>
    <div style="color:var(--green); font-size:22px; font-weight:700; letter-spacing:6px;">UPLINK_SUCCESS</div>
    <button onclick="location.reload()" class="btn btn-save" style="margin-top: 50px; width: 220px; background: transparent; border: 1px solid var(--green); color: var(--green);">ACKNOWLEDGE</button>
</div>

<nav>
    <a href="#" class="nav-btn active">DASHBOARD</a>
    <a href="intel.html" class="nav-btn">INTEL_LOGS</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const weaponMap = {
    "SIG-3A14D65A": "REDMI NOTE 14 PRO 5G", "SIG-5B0D3A5C": "REALME 8 PRO",
    "SIG-82A9E4B": "SAMSUNG S23 ULTRA", "SIG-X921FFA": "IPHONE 15 PRO",
    "SIG-K882190": "POCO X6 PRO", "SIG-V001122": "VIVO V30"
  };

  const currentAgent = localStorage.getItem("cia_agent") || "AUTHORIZED_AGENT";
  const currentDeviceSig = localStorage.getItem("device_signature") || "N/A";
  let selectedDeviceForSave = currentDeviceSig; 
  let authorizedDevices = [];
  let isRetrieveMode = false;

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const reserveBtn = document.getElementById('reserve-btn');

  async function loadAgentDevices() {
      document.getElementById('sync-device-name').innerText = weaponMap[currentDeviceSig] || "IDENTIFYING...";
      try {
          const q = query(collection(db, "agents"), where("agentName", "==", currentAgent));
          const snap = await getDocs(q);
          if (!snap.empty) {
              const data = snap.docs[0].data();
              authorizedDevices = Array.isArray(data.linkedSignatures) ? data.linkedSignatures : [data.linkedSignatures];
          } else { authorizedDevices = [currentDeviceSig]; }
      } catch (e) {}
  }
  loadAgentDevices();

  const log = async (msg, color = "#5c7882") => {
    try { await addDoc(collection(db, "terminal_logs"), { timestamp: serverTimestamp(), message: msg, color, agent: currentAgent }); } catch (e) {}
  };

  onSnapshot(query(collection(db, "terminal_logs"), orderBy("timestamp", "desc"), limit(12)), (snap) => {
      const term = document.getElementById('terminal'); term.innerHTML = "";
      snap.forEach((d) => {
          const data = d.data();
          const div = document.createElement('div');
          div.innerHTML = `> <span style="color:${data.color}">${data.message}</span>`;
          term.appendChild(div);
      });
  });

  input.addEventListener('input', async () => {
    const val = input.value.trim();
    if (val.length < 4) {
        isRetrieveMode = false;
        actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
        return;
    }
    const q = query(collection(db, "mission_orders"), where("missionID", "==", val));
    const snap = await getDocs(q);
    if (!snap.empty) {
        isRetrieveMode = true;
        actionBtn.className = "btn btn-retrieve"; actionBtn.textContent = "RETRIEVE";
    } else {
        isRetrieveMode = false;
        actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
    }
  });

  function renderDeviceButtons() {
      const container = document.getElementById('pop-device-list');
      container.innerHTML = "";
      authorizedDevices.forEach(sig => {
          const btn = document.createElement('button');
          btn.className = `dev-btn ${sig === selectedDeviceForSave ? 'active' : ''}`;
          btn.innerText = weaponMap[sig] || sig;
          btn.onclick = () => {
              document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              selectedDeviceForSave = sig;
          };
          container.appendChild(btn);
      });
  }

  actionBtn.onclick = async () => {
    if (input.value.length < 4) return;
    document.getElementById('pop-agent').innerText = currentAgent;
    document.getElementById('pop-m-id').innerText = `#${input.value}`;

    if (isRetrieveMode) {
        const q = query(collection(db, "mission_orders"), where("missionID", "==", input.value));
        const snap = await getDocs(q);
        const data = snap.docs[0].data();
        document.getElementById('v-agent-input').value = data.vAgentID || "";
        document.getElementById('expenses-input').value = data.expenses ? data.expenses.replace("PHP ", "") : "";
        document.getElementById('pop-dep').innerText = data.deploymentDate?.toDate().toLocaleDateString() || "--";
        document.getElementById('date-info').style.display = 'block';
        selectedDeviceForSave = data.weaponSystem || currentDeviceSig;
    } else {
        document.getElementById('v-agent-input').value = "";
        document.getElementById('expenses-input').value = "";
        document.getElementById('date-info').style.display = 'none';
        selectedDeviceForSave = currentDeviceSig;
    }
    renderDeviceButtons();
    document.getElementById('modal-overlay').style.display = 'flex';
  };

  window.closePopup = () => document.getElementById('modal-overlay').style.display = 'none';

  window.submitMission = async () => {
    const missionID = input.value;
    const vId = document.getElementById('v-agent-input').value.trim();
    const exp = document.getElementById('expenses-input').value;
    const confirmBtn = document.getElementById('uplink-confirm-btn');

    if(!vId) return alert("V_AGENT_ID REQUIRED");

    // 1. DATA PARA SA mission_orders (Key: missionID)
    let missionData = {
        missionID: missionID,
        agentName: currentAgent,
        vAgentID: vId,
        weaponSystem: selectedDeviceForSave,
        status: "ACTIVE"
    };

    // 2. CORRECT INTEL KEY FORMAT: AGENT_WEAPON_vAgent#
    // Format: AGENT_LZ_SIG-3A14D65A_101
    const bountyDocID = `${currentAgent}_${selectedDeviceForSave}_${vId}`;
    
    // 3. DATA PARA SA bounty_report (Key: bountyDocID)
    let bountyData = {
        intelKey: bountyDocID,
        missionID: missionID,
        agentName: currentAgent,
        vAgentID: vId,
        weaponSystem: selectedDeviceForSave,
        lastUpdated: serverTimestamp()
    };

    // EXPENSES logic (Sync sa dalawang table kung may value)
    if (exp && parseFloat(exp) > 0) {
        const formattedExp = `PHP ${parseFloat(exp).toFixed(2)}`;
        missionData.expenses = formattedExp;
        bountyData.expenses = formattedExp;
    }

    // DATE PROTECTION logic
    if (!isRetrieveMode) {
        missionData.deploymentDate = serverTimestamp();
        const futureDate = new Date();
        futureDate.setDate(futureDate.getDate() + 30);
        missionData.relieveDate = futureDate.toLocaleDateString('en-US');
        bountyData.createdDate = serverTimestamp();
    }

    try {
        confirmBtn.classList.add('uplinking');
        
        // Update mission_orders gamit ang Mission ID
        await setDoc(doc(db, "mission_orders", missionID), missionData, { merge: true });
        
        // Update bounty_report gamit ang bagong format (AGENT_WEAPON_vAgent#)
        await setDoc(doc(db, "bounty_report", bountyDocID), bountyData, { merge: true });

        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('success-screen').style.display = 'flex';
        await log(`INTEL_UPLINK: ${bountyDocID}`, 'var(--green)');
    } catch (e) { 
        confirmBtn.classList.remove('uplinking');
        alert("CRITICAL_ERROR: INTEL_SYNC_FAILED"); 
    }
  };

  reserveBtn.onclick = async () => {
    if (input.value.length < 4) return;
    try {
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value, agentName: currentAgent, vAgentID: "RESERVED",
            weaponSystem: currentDeviceSig, status: "RESERVED", deploymentDate: serverTimestamp()
        }, { merge: true });
        location.reload();
    } catch (e) {}
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
