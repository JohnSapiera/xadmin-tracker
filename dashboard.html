<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v12_FINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #01080b; --panel: rgba(2, 15, 20, 0.98); --cyan: #00f3ff; 
      --red: #ff003c; --blue: #007bff; --green: #00ff66; --yellow: #ffcc00;
      --border: rgba(0, 243, 255, 0.2); --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header { padding: 15px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .status-bar { font-size: 9px; font-family: var(--mono); color: var(--cyan); padding: 8px 15px; background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }

    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 30px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }

    #mission-input { 
        width: 100%; background: #000; border: 2px solid #1a262b; border-left: 5px solid var(--cyan);
        color: var(--cyan); font-family: var(--mono); font-size: 45px; padding: 15px; text-align: center; letter-spacing: 10px; outline: none;
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
    .btn { height: 60px; font-family: var(--mono); font-size: 14px; font-weight: 800; border: 1px solid; background: rgba(0,0,0,0.4); cursor: pointer; transition: 0.3s; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%); }
    
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { color: var(--blue); border-color: var(--blue); box-shadow: 0 0 15px var(--blue); }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    #terminal { background: rgba(0,0,0,0.9); border: 1px solid #111; padding: 15px; font-family: var(--mono); font-size: 11px; height: 140px; color: #4a5a61; margin-top: 20px; overflow-y: auto; border-radius: 2px; }

    /* POP-UP REMASTERED */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .popup { width: 340px; background: #020a0d; border: 1px solid var(--cyan); padding: 25px; position: relative; }
    
    .pop-title { font-family: var(--mono); font-size: 24px; color: var(--cyan); text-align: center; text-shadow: 0 0 10px var(--cyan); }
    .pop-subtitle { font-family: var(--mono); font-size: 10px; color: #4a5a61; text-align: center; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; }

    .p-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-family: var(--mono); font-size: 11px; border-bottom: 1px solid rgba(0,243,255,0.05); padding-bottom: 4px; }
    .p-label { color: #556b73; text-transform: uppercase; }
    
    /* Device Buttons */
    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .dev-btn { background: transparent; border: 1px solid #1a262b; color: #4a5a61; padding: 8px; font-family: var(--mono); font-size: 9px; cursor: pointer; transition: 0.3s; }
    .dev-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(0, 243, 255, 0.1); box-shadow: inset 0 0 10px var(--cyan); }

    /* Circle/X Buttons */
    .action-circle { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--green); color: var(--green); background: transparent; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .action-x { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--red); color: var(--red); background: transparent; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .action-circle:active, .action-x:active { transform: scale(0.9); }

    /* Success Lockdown Overlay */
    .lockdown-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

    nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 2px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-size: 11px; font-family: var(--mono); text-decoration: none; }
    .nav-btn.active { color: var(--cyan); background: rgba(0, 243, 255, 0.05); border-top: 4px solid var(--cyan); }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:12px; height:12px; background:var(--cyan); margin-right:10px; box-shadow: 0 0 10px var(--cyan);"></div>
    <span style="font-family: var(--mono); font-size: 14px; letter-spacing: 2px; color: var(--cyan);">INTEL_CORE_v12</span>
  </div>
  <button style="background:none; border:1px solid var(--cyan); color:var(--cyan); font-family:var(--mono); font-size:9px; padding:5px 10px;">AGENT_PROFILE</button>
</header>

<div class="status-bar">
    <span id="clock">00:00:00</span>
    <span id="device-tag">NODE: <span style="color:var(--cyan)">ONLINE</span></span>
</div>

<main>
  <div class="command-module">
    <div style="font-family: var(--mono); font-size: 10px; color: var(--cyan); margin-bottom: 20px; opacity: 0.6;">// SECTOR_SCANNER_v12</div>
    <div class="input-container">
        <input type="tel" id="mission-input" placeholder="00000" maxlength="5">
    </div>
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="abort-btn" class="btn btn-terminate" onclick="location.reload()">ABORT</button>
    </div>
  </div>
  <div id="terminal">> SYSTEM_READY...</div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div class="pop-title" id="pop-m-id">#00000</div>
        <div class="pop-subtitle" id="pop-agent">AGENT_NAME</div>

        <div class="p-row"><span class="p-label">WEAPON_SYSTEM:</span></div>
        <div class="device-grid" id="device-list">
            </div>

        <div class="p-row" style="margin-top:20px;">
            <span class="p-label">V_AGENT#:</span> 
            <input type="text" id="v-agent-input" style="background:transparent; border:none; border-bottom:1px solid var(--cyan); color:var(--green); width:120px; text-align:right; font-family:var(--mono); outline:none;" placeholder="ID_REQUIRED">
        </div>
        <div class="p-row"><span class="p-label">EXPENSES:</span> <span id="pop-exp" style="color:var(--green); font-family:var(--mono);">PHP 0.00</span></div>
        <div class="p-row"><span class="p-label">DEPLOY_DATE:</span> <span id="pop-dep" style="color:#fff; font-family:var(--mono);">--/--/--</span></div>
        <div class="p-row"><span class="p-label">RELIEVE_DATE:</span> <span id="pop-rel" style="color:#fff; font-family:var(--mono);">--/--/--</span></div>

        <div style="display: flex; justify-content: space-around; margin-top: 30px;">
            <button onclick="submitMission()" class="action-circle">O</button>
            <button onclick="closePopup()" class="action-x">X</button>
        </div>
    </div>
</div>

<div class="lockdown-overlay" id="success-screen">
    <div style="border: 2px solid var(--green); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green); font-size: 40px; margin-bottom: 20px; box-shadow: 0 0 20px var(--green);">✓</div>
    <div style="color:#fff; font-family:var(--mono); letter-spacing:5px;">DATA_LOGGED</div>
    <div style="color:var(--green); font-family:var(--mono); font-size:10px; margin-top:10px;">UPLINK_STABLE // SECURE</div>
    <button onclick="location.reload()" class="btn btn-save" style="margin-top: 50px; width: 200px; height: 45px;">RESTART_TERMINAL</button>
</div>

<nav id="bottom-nav">
  <a href="#" class="nav-btn active">DASHBOARD</a>
  <a href="intel.html" class="nav-btn">INTEL_LOGS</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:baab5171d8e0a58acd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const termLog = document.getElementById('terminal');
  let selectedDevice = navigator.platform;
  let isRetrieveMode = false;

  function log(msg, color = "#4a5a61") {
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.3">${new Date().toLocaleTimeString('en-GB')}</span> > <span style="color:${color}">${msg}</span>`;
    termLog.prepend(d);
  }

  // --- SCANNER LOGIC ---
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    isRetrieveMode = false;
    actionBtn.className = "btn btn-save";
    actionBtn.textContent = "SAVE";

    if (val.length >= 4) {
        log(`SCANNING: [${val}]`, 'var(--cyan)');
        
        try {
            // Check existing mission_orders
            const qExist = query(collection(db, "mission_orders"), where("missionID", "==", val));
            const snapExist = await getDocs(qExist);

            if (!snapExist.empty) {
                log(`EXISTING_DATA_DETECTED: Mission ${val}`, 'var(--yellow)');
                actionBtn.className = "btn btn-retrieve";
                actionBtn.textContent = "RETRIEVE";
                isRetrieveMode = true;
                return;
            }

            // Check Blacklist
            const qBlack = query(collection(db, "blacklist"), where("targetID", "==", val));
            const snapBlack = await getDocs(qBlack);

            if (!snapBlack.empty) {
                log(`ALERT: ID ${val} RESTRICTED.`, 'var(--red)');
                actionBtn.className = "btn btn-terminate";
                actionBtn.textContent = "LOCKED";
            }
        } catch (e) { log("OFFLINE", "red"); }
    }
  });

  // --- POPUP HANDLER ---
  actionBtn.onclick = async () => {
    const val = input.value;
    if (val.length < 4 || actionBtn.textContent === "LOCKED") return;

    const agentName = localStorage.getItem("cia_agent") || "JEFFERSON VALLES";
    document.getElementById('pop-agent').innerText = agentName;
    document.getElementById('pop-m-id').innerText = `#${val}`;

    // Load Devices from Firestore
    const devGrid = document.getElementById('device-list');
    devGrid.innerHTML = "";
    try {
        const qAgent = query(collection(db, "agents"), where("agentName", "==", agentName));
        const snap = await getDocs(qAgent);
        if (!snap.empty) {
            const devices = snap.docs[0].data().linkedDevice || [navigator.platform];
            devices.forEach(dev => {
                const b = document.createElement('button');
                b.className = `dev-btn ${dev === selectedDevice ? 'active' : ''}`;
                b.innerText = dev;
                b.onclick = () => {
                    document.querySelectorAll('.dev-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    selectedDevice = dev;
                };
                devGrid.appendChild(b);
            });
        }
    } catch (e) { log("DEV_FETCH_FAIL", "red"); }

    if (isRetrieveMode) {
        log("RETRIEVING_REMOTE_DATA...", "var(--blue)");
        const q = query(collection(db, "mission_orders"), where("missionID", "==", val));
        const snap = await getDocs(q);
        const data = snap.docs[0].data();
        
        document.getElementById('v-agent-input').value = data.vAgentID;
        document.getElementById('pop-exp').innerText = data.expenses;
        document.getElementById('pop-dep').innerText = data.deploymentDate?.toDate().toLocaleDateString('en-GB') || "--/--/--";
        document.getElementById('pop-rel').innerText = data.relieveDate?.toDate().toLocaleDateString('en-GB') || "--/--/--";
        selectedDevice = data.weaponSystem;
    } else {
        const now = new Date();
        const rel = new Date(); rel.setDate(now.getDate() + 30);
        document.getElementById('pop-dep').innerText = now.toLocaleDateString('en-GB');
        document.getElementById('pop-rel').innerText = rel.toLocaleDateString('en-GB');
        document.getElementById('v-agent-input').value = "";
    }

    document.getElementById('modal-overlay').style.display = 'flex';
  };

  window.closePopup = () => document.getElementById('modal-overlay').style.display = 'none';

  // --- SUBMIT / UPDATE (THE "O" BUTTON) ---
  window.submitMission = async () => {
    const vId = document.getElementById('v-agent-input').value;
    if (!vId) return alert("V_AGENT# REQUIRED");

    log("UPLOADING_ENCRYPTED_PACKET...", "var(--cyan)");
    try {
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value,
            agentName: document.getElementById('pop-agent').innerText,
            vAgentID: vId,
            weaponSystem: selectedDevice,
            expenses: document.getElementById('pop-exp').innerText,
            deploymentDate: isRetrieveMode ? serverTimestamp() : serverTimestamp(), // Pwedeng i-preserve ang orig date kung gusto
            relieveDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000),
            status: "ACTIVE"
        }, { merge: true });

        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('success-screen').style.display = 'flex';
        log("MISSION_PROFILE_ENCRYPTED", "var(--green)");
    } catch (e) { log("UPLOAD_FAILED", "red"); }
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
