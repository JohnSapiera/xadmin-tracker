<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENT_DOSSIER | ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0c0c0e; --cyan: #00f2ff; --folder: #ffd700; --paper: #e0e0e0; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono'; 
            margin: 0; padding: 20px; background-image: radial-gradient(#1a1a1a 1px, transparent 1px); background-size: 20px 20px;
        }

        .breadcrumb { font-size: 10px; color: var(--cyan); margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 5px; }

        /* Folder Grid */
        .explorer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; }

        .folder-icon {
            display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .folder-icon:hover { transform: scale(1.05); }
        .folder-shape {
            width: 60px; height: 45px; background: var(--folder); position: relative;
            border-radius: 0 5px 5px 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .folder-shape::before {
            content: ''; position: absolute; top: -10px; left: 0;
            width: 25px; height: 10px; background: var(--folder); border-radius: 5px 5px 0 0;
        }
        .folder-label { font-size: 10px; margin-top: 8px; text-align: center; font-weight: 800; color: #fff; }

        /* File / Paper Styling */
        .file-list { display: none; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; animation: fadeIn 0.5s; }
        
        .mission-paper {
            background: var(--paper); color: #111; padding: 20px; position: relative;
            box-shadow: 5px 5px 0px rgba(0,242,255,0.2); border-left: 10px solid #ccc;
        }
        .mission-paper::after {
            content: 'CONFIDENTIAL'; position: absolute; top: 10px; right: 10px;
            border: 2px solid #ff3c3c; color: #ff3c3c; padding: 2px 5px;
            font-size: 8px; transform: rotate(15deg); font-weight: 800;
        }

        .paper-header { border-bottom: 2px solid #111; margin-bottom: 10px; font-weight: 800; font-size: 14px; }
        .data-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; border-bottom: 1px dashed #999; }
        .label { font-weight: 800; text-transform: uppercase; }

        .back-btn { background: none; border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 10px; cursor: pointer; font-size: 10px; margin-bottom: 15px; }
        
        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="breadcrumb">C:\MOSSAD\AGENTS\<span id="agentDisplay">...</span>\DEPLOYMENTS</div>

    <div id="rootView">
        <div class="explorer-grid">
            <div class="folder-icon" onclick="openFolder('R8P')">
                <div class="folder-shape"></div>
                <div class="folder-label">WEAPON_R8P</div>
            </div>
            <div class="folder-icon" onclick="openFolder('RMN14')">
                <div class="folder-shape"></div>
                <div class="folder-label">WEAPON_RMN14</div>
            </div>
        </div>
    </div>

    <div id="folderView" class="hidden">
        <button class="back-btn" onclick="closeFolder()"><< BACK TO ROOT</button>
        <div class="breadcrumb">PATH: DEPLOYMENTS / <span id="currentFolderName">...</span></div>
        <div id="fileContainer" class="file-list" style="display: grid;">
            </div>
    </div>

    <script>
        const activeAgent = localStorage.getItem("cia_agent") || "GHOST";
        document.getElementById('agentDisplay').innerText = activeAgent;

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function openFolder(weaponName) {
            document.getElementById('rootView').classList.add('hidden');
            document.getElementById('folderView').classList.remove('hidden');
            document.getElementById('currentFolderName').innerText = weaponName;
            fetchFiles(weaponName);
        }

        function closeFolder() {
            document.getElementById('folderView').classList.add('hidden');
            document.getElementById('rootView').classList.remove('hidden');
        }

        function fetchFiles(weaponName) {
            const container = document.getElementById('fileContainer');
            container.innerHTML = "<div style='color:var(--cyan)'>ACCESSING ENCRYPTED FILES...</div>";

            db.collection("bounties")
              .where("agent", "==", activeAgent)
              .where("weapon", "==", weaponName)
              .orderBy("timestamp", "desc")
              .onSnapshot(snap => {
                  container.innerHTML = "";
                  if (snap.empty) {
                      container.innerHTML = "<div style='color:#555'>FOLDER_EMPTY: NO_RECORDS_FOUND</div>";
                      return;
                  }

                  snap.forEach(doc => {
                      const data = doc.data();
                      const deployDate = data.timestamp ? data.timestamp.toDate() : new Date();
                      
                      // Termination Date (30 Days After)
                      const termDate = new Date(deployDate);
                      termDate.setDate(termDate.getDate() + 30);

                      const isExpired = new Date() > termDate;

                      container.innerHTML += `
                        <div class="mission-paper">
                            <div class="paper-header">MISSION ORDER: #${data.missionOrder}</div>
                            <div class="data-row">
                                <span class="label">V-AGENT ID:</span>
                                <span>V-${data.vid}</span>
                            </div>
                            <div class="data-row">
                                <span class="label">EXPENSES:</span>
                                <span>PHP 0.00</span>
                            </div>
                            <div class="data-row">
                                <span class="label">DEPLOYMENT_DATE:</span>
                                <span>${deployDate.toLocaleDateString()}</span>
                            </div>
                            <div class="data-row" style="${isExpired ? 'color:red; font-weight:800;' : ''}">
                                <span class="label">TERMINATION_DATE:</span>
                                <span>${termDate.toLocaleDateString()} ${isExpired ? '[EXPIRED]' : ''}</span>
                            </div>
                            <div style="font-size:8px; margin-top:10px; color:#777; text-align:right;">
                                REF_ID: ${doc.id.substring(0,8).toUpperCase()}
                            </div>
                        </div>
                      `;
                  });
              });
        }
    </script>
</body>
</html>
