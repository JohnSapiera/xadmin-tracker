<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARDWARE_ENROLLMENT_v10.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #01080b; --green: #00ff66; --border: rgba(0, 242, 255, 0.2); --mono: 'Share Tech Mono', monospace; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 50%, #0a1f29 0%, var(--bg) 100%); }
        .wrapper { width: 90%; max-width: 400px; background: rgba(2, 12, 18, 0.98); padding: 35px; border: 1px solid var(--border); }
        h2 { font-size: 18px; color: var(--cyan); letter-spacing: 3px; margin-bottom: 25px; border-left: 4px solid var(--cyan); padding-left: 15px; }
        .info-display { background: #000; border: 1px dashed #1a262b; padding: 12px; color: var(--cyan); font-family: var(--mono); font-size: 13px; margin-bottom: 20px; text-align: center; }
        select { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 15px; margin-bottom: 25px; font-family: var(--mono); outline: none; }
        .btn-sync { width: 100%; padding: 20px; background: transparent; color: var(--green); border: 2px solid var(--green); font-family: var(--mono); font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-sync:hover { background: var(--green); color: #000; }
        #terminal { font-family: var(--mono); font-size: 10px; color: #4a5a61; margin-top: 20px; background: #000; padding: 10px; min-height: 80px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>NODE_ENROLLMENT</h2>
        <div id="device-sig" class="info-display">DETECTING...</div>
        <select id="agentSelect">
            <option value="JEFFERSON">AGENT_JEFFERSON</option>
            <option value="LZ">AGENT_LZ</option>
        </select>
        <button class="btn-sync" onclick="syncDevice()">BIND_HARDWARE_NODE</button>
        <div id="terminal">> SYSTEM_READY</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let deviceUUID = localStorage.getItem("device_uuid");
        if (!deviceUUID) {
            deviceUUID = "NODE-" + Math.random().toString(36).substr(2, 6).toUpperCase();
            localStorage.setItem("device_uuid", deviceUUID);
        }
        document.getElementById('device-sig').innerText = deviceUUID;

        async function syncDevice() {
            const agentName = document.getElementById('agentSelect').value;
            const log = document.getElementById('terminal');
            try {
                const agentQuery = await db.collection("agents").where("agentName", "==", agentName).get();
                if (agentQuery.empty) {
                    await db.collection("agents").add({
                        agentName: agentName,
                        linkedDevice: [deviceUUID],
                        lastSync: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    const docId = agentQuery.docs[0].id;
                    await db.collection("agents").doc(docId).update({
                        linkedDevice: firebase.firestore.FieldValue.arrayUnion(deviceUUID),
                        lastSync: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                log.innerHTML += `<br>> SUCCESS: ${agentName} LINKED.`;
                alert("Link Successful!");
            } catch (e) { log.innerHTML += `<br>> ERROR: ${e.message}`; }
        }
    </script>
</body>
</html>
