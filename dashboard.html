<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TERMINAL_UPLINK_v19.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020a0d">

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --cyan: #00f2ff; --bg: #020a0d; --green: #00ff66; --red: #ff003c; --border: rgba(0, 242, 255, 0.2); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Share Tech Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #020a0d 100%);
        }

        .card { 
            width: 340px; background: rgba(1, 15, 20, 0.95); padding: 30px; 
            border: 1px solid var(--border); backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(0,0,0,0.9); position: relative;
        }

        h2 { 
            font-size: 16px; margin: 0 0 25px 0; color: var(--cyan); 
            text-align: center; letter-spacing: 4px; text-transform: uppercase;
            border-bottom: 2px solid var(--cyan); padding-bottom: 12px;
        }

        .form-container { display: flex; flex-direction: column; gap: 20px; }
        label { font-size: 10px; color: var(--cyan); text-transform: uppercase; margin-bottom: 8px; display: block; opacity: 0.8; letter-spacing: 1px; }

        .input-field {
            width: 100%; padding: 14px; background: #000; border: 1px solid var(--border);
            color: var(--green); font-family: 'Share Tech Mono'; font-size: 12px;
            outline: none; border-radius: 0;
        }

        select.input-field {
            cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
            background-position: calc(100% - 20px) 22px, calc(100% - 15px) 22px;
            background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
            appearance: none;
        }

        .btn-auth {
            width: 100%; padding: 18px; background: transparent; 
            color: var(--green); border: 2px solid var(--green);
            font-family: 'Rajdhani'; font-weight: 700; cursor: pointer;
            text-transform: uppercase; letter-spacing: 3px; font-size: 14px;
            margin-top: 10px; transition: 0.4s;
        }

        .btn-auth:hover { background: var(--green); color: #000; box-shadow: 0 0 30px rgba(0, 255, 102, 0.4); }
        .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; }

        .ticker-wrap {
            margin-top: 30px; background: rgba(0, 242, 255, 0.03);
            border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
            overflow: hidden; white-space: nowrap; padding: 10px 0;
        }

        .ticker-move { display: inline-block; animation: marquee 15s linear infinite; font-size: 10px; color: #556b73; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .ticker-item { display: inline-block; margin-right: 50px; }
        .ticker-item span { color: var(--cyan); }

        #status { font-size: 10px; text-align: center; margin-top: 20px; color: #4a5a61; min-height: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>HARDWARE_UPLINK</h2>

        <div class="form-container">
            <div class="field-group">
                <label>NODE_SIGNATURE_DETECTED:</label>
                <input type="text" id="val-fp" class="input-field" readonly>
            </div>

            <div class="field-group">
                <label>AGENT_IDENTITY_PROFILE:</label>
                <select id="agentSelect" class="input-field">
                    <option value="AGENT_JFSN">AGENT_JFSN</option>
                    <option value="AGENT_LZ">AGENT_LZ</option>
                </select>
            </div>

            <button class="btn-auth" id="syncBtn">EXECUTE_UPLINK</button>
        </div>

        <div id="status">> WAITING_FOR_COMMAND...</div>

        <div class="ticker-wrap">
            <div class="ticker-move" id="ticker-content"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Hardware Specs Detection
        function getHardwareSpecs() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
            
            return {
                brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || "NODE_STATION",
                gpu: gpu.split('/').pop().trim(),
                res: `${window.screen.width}x${window.screen.height}`,
                plt: navigator.platform
            };
        }

        function generateSignature(s) {
            const raw = s.gpu + s.res + s.plt + s.brand;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash |= 0;
            }
            return "SIG-" + Math.abs(hash).toString(16).toUpperCase();
        }

        const specs = getHardwareSpecs();
        const signature = generateSignature(specs);

        // UI Prep
        document.getElementById('val-fp').value = signature;
        const tickerHtml = `
            <div class="ticker-item">MODEL: <span>${specs.brand}</span></div>
            <div class="ticker-item">GPU: <span>${specs.gpu}</span></div>
            <div class="ticker-item">RES: <span>${specs.res}</span></div>
            <div class="ticker-item">PLT: <span>${specs.plt}</span></div>
        `;
        document.getElementById('ticker-content').innerHTML = tickerHtml + tickerHtml;

        // Execute Uplink
        document.getElementById('syncBtn').onclick = async () => {
            const agent = document.getElementById('agentSelect').value;
            const log = document.getElementById('status');
            const btn = document.getElementById('syncBtn');

            btn.disabled = true;
            log.innerHTML = `> SYNCING_WITH_CORE_DATABASE...`;

            try {
                // Update Firebase: I-add ang signature sa listahan ni Agent
                await db.collection("agents").doc(agent).set({
                    agentName: agent,
                    linkedSignatures: firebase.firestore.FieldValue.arrayUnion(signature),
                    lastFingerprint: signature,
                    brandName: specs.brand,
                    lastSync: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                // Try to save to LocalStorage (with catch for access denied)
                try {
                    localStorage.setItem("cia_agent", agent);
                    localStorage.setItem("agent_verified", "true");
                    localStorage.setItem("device_signature", signature);
                } catch (storageErr) {
                    console.warn("LocalStorage blocked. Using session-only auth.");
                }

                log.innerHTML = `> <span style="color:var(--green)">UPLINK_SUCCESSFUL</span>`;
                
                setTimeout(() => {
                    alert(`ACCESS GRANTED: Device ${signature} linked to ${agent}`);
                    window.location.href = "dashboard.html";
                }, 1000);

            } catch (e) {
                log.innerHTML = `> <span style="color:var(--red)">UPLINK_FAILED: ${e.message}</span>`;
                console.error(e);
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
