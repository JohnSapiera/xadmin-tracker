<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_PROTOCOL // ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --error: #ff3c3c; --success: #00ff66; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .gate-card { width: 100%; max-width: 350px; padding: 40px; background: #0a0a0c; border: 1px solid #222; text-align: center; }
        h2 { font-size: 15px; letter-spacing: 5px; color: var(--neon); margin-bottom: 30px; }
        .btn-auth { width: 100%; padding: 20px; background: transparent; color: var(--neon); border: 1px solid var(--neon); font-weight: 800; cursor: pointer; letter-spacing: 2px; transition: 0.3s; }
        .btn-auth:hover { background: rgba(0, 242, 255, 0.1); }
        #status { font-size: 10px; color: #444; margin-top: 25px; min-height: 40px; line-height: 1.5; text-align: left; background: #000; padding: 10px; border: 1px solid #111; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="gate-card">
        <h2>CENTRAL_UPLINK</h2>
        <button class="btn-auth" id="authBtn" onclick="verifyDevice()">INITIALIZE_HANDSHAKE</button>
        <div id="status">> SYSTEM_READY_</div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function verifyDevice() {
            const status = document.getElementById('status');
            const btn = document.getElementById('authBtn');
            const localUUID = localStorage.getItem("device_uuid");

            btn.disabled = true;
            status.innerHTML = `> SCANNING_LOCAL_HARDWARE...<br>> KEY: ${localUUID || "NOT_FOUND"}`;

            if (!localUUID) {
                status.innerHTML += `<br>> <span style="color:var(--error)">[!] ACCESS_DENIED: UNREGISTERED_DEVICE</span>`;
                btn.disabled = false;
                return;
            }

            try {
                // Search sa database: "Sino ang may-ari ng ID na ito?"
                const snap = await db.collection("agents").where("linkedDevice", "==", localUUID).get();

                if (snap.empty) {
                    status.innerHTML += `<br>> <span style="color:var(--error)">[!] ACCESS_DENIED: SIGNATURE_MISMATCH</span>`;
                    btn.disabled = false;
                } else {
                    const agentName = snap.docs[0].id;
                    status.innerHTML += `<br>> <span style="color:var(--success)">[+] MATCH_FOUND: AGENT_${agentName}</span>`;
                    status.innerHTML += `<br>> REDIRECTING_TO_DASHBOARD...`;
                    
                    localStorage.setItem("cia_agent", agentName);
                    setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
                }
            } catch (e) {
                status.innerHTML += `<br>> ERROR: ${e.message}`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
