<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE_OPS // EXECUTIVE DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B0F19; 
            --bg-card: #151C2C;
            --bg-card-hover: #1E293B;
            --accent-primary: #00D2FF; 
            --accent-subtle: rgba(0, 210, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --font-data: 'Inter', sans-serif;
            --font-header: 'Rajdhani', sans-serif;
            --danger: #FF4D4D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-main);
            color: var(--text-main); 
            font-family: var(--font-data); 
            height: 100vh; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(0, 210, 255, 0.05), transparent 400px);
        }

        .container { max-width: 560px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        header { 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
        }
        #display-agent { font-family: var(--font-header); font-size: 22px; font-weight: 600; letter-spacing: 1px; }
        header p { font-size: 10px; color: var(--accent-primary); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .phone-wrapper { cursor: pointer; transition: 0.3s ease; }
        .phone-body {
            width: 100%; height: 100px; 
            background: var(--bg-card); 
            border-radius: 12px; 
            border: 1px solid var(--border-color); 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .phone-wrapper:hover .phone-body { border-color: var(--accent-primary); background: var(--bg-card-hover); transform: translateY(-2px); }
        .status-label { font-size: 10px; color: var(--text-muted); margin-top: 8px; text-align: center; font-weight: 500; }

        /* --- 5-COLUMN VAGENT GRID (ANDROID OPTIMIZED) --- */
        .vagent-grid { 
            display: none; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            margin-top: 20px; 
        }

        .folder-box { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color);
            border-radius: 8px; 
            aspect-ratio: 1 / 1; 
            cursor: pointer; 
            transition: 0.2s ease;
            display: flex; 
            justify-content: center; 
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .folder-box:hover { border-color: var(--accent-primary); background: var(--bg-card-hover); }
        
        /* Number Only Label - BOLD */
        .file-label { 
            font-family: var(--font-header); 
            font-size: 20px; 
            color: var(--text-main); 
            font-weight: 700; 
        }

        /* Badge Styling: OPERATING COST */
        .folder-box.has-expenses::after {
            content: "OPERATING COST"; 
            position: absolute; 
            bottom: 4px; 
            left: 0; 
            right: 0;
            font-size: 5.5px; 
            font-weight: 800; 
            color: var(--accent-primary);
            text-align: center;
            letter-spacing: 0.2px;
        }
        .folder-box.has-expenses { border-bottom: 2px solid var(--accent-primary); }

        /* --- MODALS --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 4000; background: rgba(5, 8, 15, 0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; }
        .dossier-paper { width: 90%; max-width: 400px; background: #0D131F; color: var(--text-main); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h3 { font-family: var(--font-header); font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-weight: 600; }
        
        .close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); color: #fff; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }

        #btnBack, #memoirsBtnContainer button { 
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); 
            padding: 12px; width: 100%; font-size: 12px; font-weight: 600; margin-top: 15px; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        #btnBack:hover, #memoirsBtnContainer button:hover { border-color: var(--accent-primary); color: var(--accent-primary); }

        .expense-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding: 12px 0; font-size: 13px; }
        .grand-total-box { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 15px; text-align: right; }
        .grand-total-box h1 { font-size: 28px; font-weight: 700; color: var(--text-main); }
        .secure-marker { background: rgba(255,255,255,0.05); color: var(--accent-primary); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <p>Intelligence System Active</p>
        <h2 id="display-agent">---</h2>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none;">RETURN TO OVERVIEW</button>
    <div id="memoirsBtnContainer" style="margin-top: 20px;">
        <button onclick="openMemoirs('ALL')">GENERATE MASTER REPORT</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper" style="position:relative;">
        <button class="close-btn" onclick="closeNoir()">✕</button>
        <h3>Node Details</h3>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px;">
            <p style="font-size: 10px; color: var(--text-muted);">REF: <span id="n-order" style="color:#fff;">--</span></p>
            <p style="font-size: 13px; font-weight: 700; color: var(--accent-primary);">ID: <span id="n-vagent">--</span></p>
        </div>
        <div id="n-content"></div>
        <div class="grand-total-box">
            <p style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">Total Expenditure</p>
            <h1 id="n-total">₱ 0</h1>
        </div>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="dossier-paper" style="width:95%; height:85vh; display:flex; flex-direction:column; position:relative;">
        <button class="close-btn" onclick="closeMemoirs()">✕</button>
        <h3>Financial Audit</h3>
        <p style="font-size: 11px; margin-bottom: 10px; color: var(--text-muted);">SOURCE: <span id="target-name" style="color: var(--accent-primary); font-weight: 600;">--</span></p>
        <div id="active-list" style="flex-grow:1; overflow-y:auto; padding-right: 5px;"></div>
        <div class="grand-total-box">
            <p style="font-size: 10px; text-transform: uppercase;">Grand Total</p>
            <h1 id="total-val">0</h1>
        </div>
    </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {};
    let allMissions = [];

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';
    window.closeMemoirs = () => document.getElementById('memoirsOverlay').style.display = 'none';

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        allMissions = [];
        snap.forEach(d => {
            const data = d.data();
            const docWithID = {...data, id: d.id};
            allMissions.push(docWithID);
            if (data.vAgentID) {
                const deviceName = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[deviceName]) deviceData[deviceName] = [];
                deviceData[deviceName].push(docWithID);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        const grid = document.getElementById('deviceSection');
        const keys = Object.keys(deviceData);
        if (keys.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; opacity:0.5; font-size:12px; margin-top:20px;">No active nodes found.</p>`;
            return;
        }
        grid.innerHTML = keys.map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body">
                    <p style="font-size: 9px; opacity:0.6; font-weight:600; letter-spacing:1px;">NODE</p>
                    <h3 style="margin:0; border:none; color:var(--text-main); font-size:16px;">${name}</h3>
                </div>
                <div class="status-label">Standby</div>
            </div>
        `).join('');
    };

    window.activateDevice = (name, element) => {
        element.querySelector('.status-label').innerText = "Syncing...";
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `<button onclick="openMemoirs('${name}')">${name} REPORT</button>`;
            
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => {
                const hasHistory = v.expensesBreakdown && v.expensesBreakdown.length > 0;
                // LABEL GINAWANG NUMBER ONLY AT BOLD
                return `
                    <div class="folder-box ${hasHistory ? 'has-expenses' : ''}" onclick="openNoirModal('${v.id}')">
                        <div class="file-label">${v.vAgentID}</div>
                    </div>
                `;
            }).join('');
        }, 600);
    };

    window.openNoirModal = (docID) => {
        const data = allMissions.find(m => m.id === docID);
        if(!data) return;
        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-order').innerText = docID.substring(0,8).toUpperCase();
        document.getElementById('n-vagent').innerText = data.vAgentID;
        
        let expHTML = "";
        if(data.expensesBreakdown && data.expensesBreakdown.length > 0) {
            expHTML = data.expensesBreakdown.map(e => `
                <div class="expense-row">
                    <span style="font-size:12px; color:var(--text-main);">${e.description || 'System Log'}</span>
                    <b style="color:var(--text-main);">₱${(e.amount || 0).toLocaleString()}</b>
                </div>`).join('');
        } else {
            expHTML = `<p style="text-align:center; color:var(--text-muted); font-size:12px; padding:20px 0;">No logs found.</p>`;
        }
        
        document.getElementById('n-content').innerHTML = `
            <p style="font-size:10px; color:var(--text-muted); margin-bottom:12px;">SECURE_MARKER: <span class="secure-marker">${data.marker || 'UNSET'}</span></p>
            <div style="max-height:180px; overflow-y:auto; padding-right:5px;">${expHTML}</div>
        `;
        document.getElementById('n-total').innerText = `₱ ${(data.totalExpenses || 0).toLocaleString()}`;
    };

    window.openMemoirs = (mode) => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        let filtered = (mode === 'ALL') ? allMissions : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);
        
        // Sorting: with vAgentID first, then by amount
        filtered.sort((a, b) => (b.totalExpenses || 0) - (a.totalExpenses || 0));
        
        let overallTotal = 0;
        let listHTML = filtered.filter(m => (m.totalExpenses || 0) > 0).map(m => {
            overallTotal += (m.totalExpenses || 0);
            return `<div class="expense-row">
                <div>
                    <p style="font-weight:700; color:var(--text-main); font-size:14px;">${m.vAgentID ? 'ID: '+m.vAgentID : 'Agent: '+m.agent}</p>
                    <p style="font-size:9px; color:var(--text-muted); font-family:monospace;">REF: ${m.id.substring(0,8).toUpperCase()}</p>
                </div>
                <b style="font-size:14px;">₱${(m.totalExpenses || 0).toLocaleString()}</b>
            </div>`;
        }).join('');
        
        document.getElementById('active-list').innerHTML = listHTML || `<p style="text-align:center; color:var(--text-muted); margin-top:30px;">Empty audit trail.</p>`;
        document.getElementById('total-val').innerText = "₱ " + overallTotal.toLocaleString();
        document.getElementById('target-name').innerText = mode;
    };
</script>
</body>
</html>
