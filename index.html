<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Test</title>
    <style>
        body {
            background: #0a0c12;
            color: #00ff66;
            font-family: monospace;
            padding: 20px;
        }
        .box {
            background: #0d0f14;
            border: 1px solid #1f232c;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .error {
            color: #ff4444;
        }
        .success {
            color: #00ff66;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        input {
            background: #000;
            border: 1px solid #2a3240;
            padding: 10px;
            color: #00ff66;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
            border-radius: 8px;
        }
        .log {
            background: #03050a;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
    <h3>DATABASE CONNECTION TEST</h3>
    <div id="status" class="log">Testing connection...</div>
</div>

<div class="box">
    <h3>REGISTER DEVICE</h3>
    <input type="text" id="masterKey" maxlength="4" placeholder="____">
    <br><br>
    <button id="registerBtn">REGISTER</button>
    <div id="result" class="log"></div>
</div>

<div class="box">
    <h3>STORAGE STATUS</h3>
    <div id="storageStatus" class="log">Checking...</div>
</div>

<script>
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    let supabase = null;
    
    async function testConnection() {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = 'Creating Supabase client...';
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            statusDiv.innerHTML = 'Supabase client created. Testing query...';
            
            const { data, error, count } = await supabase
                .from('agents')
                .select('*', { count: 'exact' })
                .limit(5);
            
            if (error) {
                statusDiv.innerHTML = 'ERROR: ' + error.message;
                statusDiv.style.color = '#ff4444';
                console.error('Supabase error:', error);
                return;
            }
            
            if (data && data.length > 0) {
                statusDiv.innerHTML = 'SUCCESS: Connected! Found ' + data.length + ' agent(s)';
                statusDiv.style.color = '#00ff66';
                
                // Show agents
                let agentsList = 'Agents:<br>';
                data.forEach(agent => {
                    agentsList += '• ' + (agent.agent_name || 'unknown') + ' (key: ' + (agent.secret_key || 'none') + ')<br>';
                });
                statusDiv.innerHTML += '<br>' + agentsList;
            } else {
                statusDiv.innerHTML = 'SUCCESS: Connected! But no agents found in database.';
                statusDiv.style.color = '#ffaa33';
                statusDiv.innerHTML += '<br><br>Run this SQL in Supabase:<br>';
                statusDiv.innerHTML += 'INSERT INTO agents (agent_name, secret_key) VALUES ("AGENT_LZ", "4646"), ("AGENT_JFSN", "1010");';
            }
            
        } catch(err) {
            statusDiv.innerHTML = 'EXCEPTION: ' + err.message;
            statusDiv.style.color = '#ff4444';
            console.error('Exception:', err);
        }
    }
    
    async function registerDevice() {
        const masterKey = document.getElementById('masterKey').value.trim();
        const resultDiv = document.getElementById('result');
        
        if (!masterKey || masterKey.length !== 4) {
            resultDiv.innerHTML = 'Please enter 4-digit key';
            resultDiv.style.color = '#ff4444';
            return;
        }
        
        if (!supabase) {
            resultDiv.innerHTML = 'Supabase not initialized. Wait for connection test.';
            resultDiv.style.color = '#ff4444';
            return;
        }
        
        resultDiv.innerHTML = 'Verifying key: ' + masterKey + '...';
        resultDiv.style.color = '#ffaa33';
        
        try {
            const { data, error } = await supabase
                .from('agents')
                .select('agent_name, secret_key, weapon_system')
                .eq('secret_key', masterKey)
                .maybeSingle();
            
            if (error) {
                resultDiv.innerHTML = 'Database error: ' + error.message;
                resultDiv.style.color = '#ff4444';
                return;
            }
            
            if (!data) {
                resultDiv.innerHTML = 'INVALID KEY: ' + masterKey + ' not found in database';
                resultDiv.style.color = '#ff4444';
                return;
            }
            
            // Success
            const agentName = data.agent_name;
            const devices = data.weapon_system || [];
            
            // Generate fingerprint
            let hash = 0;
            const raw = navigator.userAgent + screen.width + screen.height;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            }
            const fingerprint = 'DEV-' + Math.abs(hash).toString(16).toUpperCase().slice(0, 10);
            
            // Save to localStorage
            const registration = {
                agent_name: agentName,
                secret_key: masterKey,
                device_fingerprint: fingerprint,
                devices: devices,
                registered_at: new Date().toISOString(),
                is_registered: true
            };
            localStorage.setItem('cia_device_registration', JSON.stringify(registration));
            
            resultDiv.innerHTML = 'SUCCESS! Registered as: ' + agentName;
            resultDiv.style.color = '#00ff66';
            
            // Update storage status
            checkStorage();
            
        } catch(err) {
            resultDiv.innerHTML = 'Error: ' + err.message;
            resultDiv.style.color = '#ff4444';
        }
    }
    
    function checkStorage() {
        const storageDiv = document.getElementById('storageStatus');
        const saved = localStorage.getItem('cia_device_registration');
        
        if (saved) {
            try {
                const data = JSON.parse(saved);
                storageDiv.innerHTML = 'Device registered to: ' + data.agent_name;
                storageDiv.innerHTML += '<br>Fingerprint: ' + data.device_fingerprint;
                storageDiv.innerHTML += '<br>Registered: ' + new Date(data.registered_at).toLocaleString();
                storageDiv.style.color = '#00ff66';
            } catch(e) {
                storageDiv.innerHTML = 'Storage error: ' + e.message;
                storageDiv.style.color = '#ff4444';
            }
        } else {
            storageDiv.innerHTML = 'No device registered yet.';
            storageDiv.style.color = '#ffaa33';
        }
    }
    
    document.getElementById('registerBtn').onclick = registerDevice;
    document.getElementById('masterKey').onkeypress = (e) => {
        if (e.key === 'Enter') registerDevice();
    };
    
    testConnection();
    checkStorage();
</script>
</body>
</html>
