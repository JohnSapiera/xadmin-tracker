<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v10.1_ELITE</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #01080b; --panel: rgba(2, 15, 20, 0.98); --cyan: #00f3ff; 
      --red: #ff003c; --blue: #007bff; --green: #00ff66; 
      --border: rgba(0, 243, 255, 0.2); --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: 0%; } }
    @keyframes radar-scan { 0% { top: -100%; } 100% { top: 100%; } }
    @keyframes device-glow { 0%, 100% { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); } 50% { color: #fff; text-shadow: 0 0 15px var(--cyan); } }

    body { 
        background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; 
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        background-image: radial-gradient(circle at 50% 50%, #0a1f29 0%, var(--bg) 100%);
    }

    body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: var(--cyan); opacity: 0.1; animation: scanline 8s linear infinite; pointer-events: none; z-index: 1000; }

    header { padding: 15px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .status-bar { font-size: 9px; font-family: var(--mono); color: var(--cyan); padding: 8px 15px; background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; letter-spacing: 2px; }

    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }

    .command-module { 
        background: var(--panel); border: 1px solid var(--border); padding: 30px; 
        position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    .command-module::before {
        content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, transparent, rgba(0, 243, 255, 0.08), transparent);
        animation: radar-scan 4s linear infinite; pointer-events: none;
    }

    .box-label { font-family: var(--mono); font-size: 10px; color: var(--cyan); margin-bottom: 25px; display: flex; justify-content: space-between; opacity: 0.8; }

    .input-container { display: flex; justify-content: center; margin-bottom: 30px; }
    #mission-input { 
        width: 100%; background: #000; border: 2px solid #1a262b; border-left: 5px solid var(--cyan);
        color: var(--cyan); font-family: var(--mono); font-size: 45px; padding: 15px; 
        text-align: center; letter-spacing: 10px; outline: none; transition: 0.3s;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    #mission-input:focus { border-color: var(--cyan); box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn { 
        height: 65px; font-family: var(--mono); font-size: 12px; font-weight: 800; 
        border: 1px solid; background: rgba(0,0,0,0.4); cursor: pointer; transition: 0.2s;
        clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
    }
    .btn:active { transform: scale(0.95); }
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    #terminal { 
        background: rgba(0,0,0,0.9); border: 1px solid #111; padding: 15px; 
        font-family: var(--mono); font-size: 11px; height: 160px; color: #4a5a61; 
        margin-top: 25px; overflow-y: auto; line-height: 1.6; border-radius: 2px;
    }

    nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 2px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-size: 11px; font-family: var(--mono); text-decoration: none; }
    .nav-btn.active { color: var(--cyan); background: rgba(0, 243, 255, 0.05); border-top: 4px solid var(--cyan); }
    
    .anim-device { animation: device-glow 2s infinite; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:12px; height:12px; background:var(--cyan); margin-right:10px; box-shadow: 0 0 10px var(--cyan);"></div>
    <span style="font-family: var(--mono); font-size: 14px; letter-spacing: 2px; color: var(--cyan);">INTEL_CORE_v10</span>
  </div>
  <button style="background:none; border:1px solid var(--cyan); color:var(--cyan); font-family:var(--mono); font-size:9px; padding:5px 10px;" onclick="window.location.href='profile.html'">AGENT_PROFILE</button>
</header>

<div class="status-bar">
    <span id="clock">00:00:00</span>
    <span id="device-tag">NODE: <span class="anim-device">SYNCING...</span></span>
</div>

<main>
  <div class="command-module">
    <div class="box-label">
        <span>// DATA_ENTRY_ENCRYPTION</span>
        <span id="scan-status">AWAITING_INPUT</span>
    </div>
    <div class="input-container">
        <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
    </div>
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="term-btn" class="btn btn-terminate">TERMINATE_ID</button>
    </div>
  </div>

  <div id="terminal">> CORE_SYSTEM_ONLINE...<br>> ENCRYPTION_KEYS_LOADED...</div>
</main>

<nav>
  <a href="#" class="nav-btn active">DASHBOARD</a>
  <a href="intel.html" class="nav-btn">INTEL_LOGS</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:d996e585751d5087cd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const scanStatus = document.getElementById('scan-status');
  const termLog = document.getElementById('terminal');
  const deviceTag = document.getElementById('device-tag');

  // --- HARDWARE FINGERPRINT ---
  function getFingerprint() {
      const canvas = document.createElement('canvas');
      const gl = canvas.getContext('webgl');
      const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
      const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC";
      const specs = gpu + screen.width + "x" + screen.height + navigator.platform;
      let hash = 0;
      for (let i = 0; i < specs.length; i++) {
          hash = ((hash << 5) - hash) + specs.charCodeAt(i);
          hash |= 0;
      }
      return "HW-" + Math.abs(hash).toString(16).toUpperCase();
  }

  const currentFP = getFingerprint();

  // --- DEVICE SYNC & VERIFICATION ---
  async function syncDevice() {
      try {
          const q = query(collection(db, "agents"), where("lastFingerprint", "==", currentFP));
          const snap = await getDocs(q);

          if (!snap.empty) {
              const data = snap.docs[0].data();
              const brand = data.brandName || "RECOGNIZED_NODE";
              deviceTag.innerHTML = `NODE: <span class="anim-device">${brand.toUpperCase()}</span>`;
              log(`UPLINK_ESTABLISHED: Agent ${data.agentName} verified via Hardware ID.`, 'green');
              localStorage.setItem("cia_agent", data.agentName);
          } else {
              deviceTag.innerHTML = `NODE: <span class="anim-device" style="color:var(--red)">UNREGISTERED</span>`;
              log("WARNING: Unregistered hardware signature detected.", "red");
          }
      } catch (e) { 
          deviceTag.innerHTML = `NODE: <span class="anim-device">OFFLINE</span>`; 
      }
  }

  // --- AUTO-SCAN (BLACKLIST/MISSION) LOGIC ---
  input.addEventListener('input', async (e) => {
      const val = e.target.value.trim();
      
      if(val.length >= 4) {
          scanStatus.textContent = "SCANNING_SECTOR...";
          scanStatus.style.color = "var(--cyan)";

          try {
              // I-scan ang "blacklist" collection para sa match
              const q = query(collection(db, "blacklist"), where("targetID", "==", val));
              const snap = await getDocs(q);

              if(!snap.empty) {
                  scanStatus.textContent = "TARGET_RESTRICTED!";
                  scanStatus.style.color = "var(--red)";
                  log(`BLACKLIST_ALERT: ID ${val} is flagged!`, 'red');
              } else {
                  // I-scan naman ang "mission_orders"
                  const q2 = query(collection(db, "mission_orders"), where("missionID", "==", val));
                  const snap2 = await getDocs(q2);
                  
                  if(!snap2.empty) {
                      scanStatus.textContent = "MISSION_MATCHED";
                      scanStatus.style.color = "var(--green)";
                      log(`INTEL: Mission ID ${val} recognized.`, 'green');
                  } else {
                      scanStatus.textContent = "CLEAN_ID";
                      scanStatus.style.color = "var(--cyan)";
                  }
              }
          } catch (err) {
              console.error("Scan Error:", err);
          }
      } else if(val.length > 0) {
          scanStatus.textContent = "AWAITING_DATA...";
      } else {
          scanStatus.textContent = "AWAITING_INPUT";
          scanStatus.style.color = "inherit";
      }
  });

  function log(m, c) {
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.3">${new Date().toLocaleTimeString('en-GB')}</span> > <span style="color:var(--${c})">${m}</span>`;
    termLog.prepend(d);
  }

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
  
  window.onload = syncDevice;
</script>
</body>
</html>
