<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.4s; }
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            filter: grayscale(1) brightness(0.3); transition: all 0.5s ease;
        }
        .phone-wrapper.lights-on .phone-body { filter: grayscale(0) brightness(1); border-color: var(--cia-cyan); box-shadow: 0 0 40px rgba(0, 243, 255, 0.6); }
        .phone-screen { position: absolute; inset: 5px; background: #000; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .phone-wrapper.lights-on .phone-screen { background: #ffffff; }

        /* --- FOLDERS --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .folder-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 15px; }
        .folder-main { width: 50px; height: 35px; background: var(--cia-cyan); border-radius: 0 4px 4px 4px; z-index: 2; clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%); position: relative; }
        .paper-sheet { position: absolute; top: 8px; width: 38px; height: 32px; background: #fff; border: 1px solid #ccc; z-index: 1; transition: 0.3s; }
        .folder-box:hover .paper-sheet { transform: translateY(-10px); }
        .file-label { font-size: 8.5px; color: #fff; text-align: center; margin-top: 8px; font-weight: bold; }
        .folder-box.has-expenses .folder-main::after {
            content: "CIA"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            font-family: var(--font-noir); font-size: 10px; font-weight: bold; color: rgba(0, 0, 0, 0.7);
            border: 1.5px solid rgba(0, 0, 0, 0.7); padding: 1px 3px; border-radius: 2px;
        }

        /* --- OVERLAYS & BOOK --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .book { width: 95%; max-width: 400px; height: 85vh; perspective: 1500px; position: relative; }
        
        .page { 
            width: 100%; height: 100%; position: absolute; transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1); 
            transform-origin: left; backface-visibility: hidden; background: #e8e2d2; color: #1a1a1a; padding: 45px 25px 25px 25px; 
            font-family: var(--font-noir); box-shadow: inset 0 0 50px rgba(0,0,0,0.1), 10px 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #c5b8a0; display: flex; flex-direction: column; z-index: 5;
        }
        .page-front { z-index: 10; }
        .page-back { transform: rotateY(180deg); }
        .page.flipped { transform: rotateY(-180deg); }

        .audit-list { flex-grow: 1; overflow-y: auto; padding-right: 5px; margin-bottom: 10px; }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.2); padding: 8px 0; font-size: 12px; align-items: center; }
        .audit-separator { border-top: 2px double #8b0000; margin: 15px 0 10px 0; text-align: center; font-size: 10px; color: #8b0000; font-weight: bold; }
        
        .close-btn {
            position: absolute; top: 12px; right: 12px; background: #8b0000; color: white; border: none;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer; z-index: 9999; font-weight: bold;
            display: flex; align-items: center; justify-content: center; font-family: sans-serif;
        }

        .swipe-hint { padding: 10px 0; font-size: 11px; font-weight: bold; color: #8b0000; border-top: 1px dashed #8b0000; cursor: pointer; }
        
        .dossier-paper { width: 90%; max-width: 360px; background: #e8e2d2; color: #1a1a1a; padding: 25px; font-family: var(--font-noir); border: 1px solid #c5b8a0; position: relative; }
        .status-label { font-size: 9px; color: var(--cia-cyan); margin-top: 10px; }
        .uplink-sync { animation: opacity 0.5s infinite alternate; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px;">AUTHENTICATING...</h2>
        <p style="font-size: 9px; opacity: 0.5;">MEMOIRS_PROTOCOL_V3</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:10px; width:100%; margin-top:20px; cursor:pointer;">[ EXIT_DEVICE_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 40px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 25px; cursor:pointer; font-weight:bold;">[ VIEW_MASTER_MEMOIRS ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <button class="close-btn" onclick="closeNoir()">X</button>
        <h3 style="text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px;">vAGENT_DOSSIER</h3>
        <p style="font-size: 11px;"><b>MO#:</b> <span id="n-order">---</span></p>
        <p style="font-size: 11px;"><b>vAgent#:</b> <span id="n-vagent">---</span></p>
        <div id="n-content" style="margin-top: 15px; border-top: 1px dashed #000; padding-top: 10px;"></div>
        <div style="text-align: right; margin-top: 20px; border-top: 2px solid #000; padding-top: 8px;">
            <p style="font-weight: bold; font-size: 18px;">Total: <span id="n-total">₱ 0.00</span></p>
        </div>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="book" id="dossierBook">
        <div id="p1" class="page page-front">
            <button class="close-btn" onclick="closeMemoirs()">X</button>
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 10px;">MEMOIRS_AUDIT</h3>
            <p style="font-size: 9px; opacity: 0.6;">SUBJECT: <span id="target-name">---</span></p>
            <div id="active-list" class="audit-list"></div>
            
            <div id="p1-total-box" style="display:none; margin-top: auto; border-top: 3px double #000; padding-top: 10px;">
                <p style="font-size: 10px; font-weight: bold;">OVERALL TOTAL:</p>
                <h2 style="font-size: 24px;">₱ <span id="total-val-p1">0.00</span></h2>
            </div>
            
            <div class="swipe-hint" id="flipNextBtn" onclick="flipPage(true)" style="text-align: right; display:none;">
                [ VIEW_OVERFLOW_RECORDS ] >>
            </div>
        </div>

        <div id="p2" class="page page-back">
            <button class="close-btn" onclick="closeMemoirs()">X</button>
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 10px;">OVERFLOW_LOGS</h3>
            <div id="overflow-list" class="audit-list"></div>
            <div style="margin-top: auto; border-top: 3px double #000; padding-top: 15px;">
                <p style="font-size: 12px; font-weight: bold;">OVERALL TOTAL:</p>
                <h1 style="font-size: 32px; letter-spacing: -1px;">₱ <span id="total-val-p2">0.00</span></h1>
            </div>
            <div class="swipe-hint" onclick="flipPage(false)" style="text-align: left;">
                << [ FLIP_BACK_TO_START ]
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN_AGENT";
    document.getElementById('display-agent').innerText = currentAgent;
    let allMissions = [], deviceData = {};

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';
    window.closeMemoirs = () => document.getElementById('memoirsOverlay').style.display = 'none';

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        snap.forEach(d => {
            const data = {...d.data(), id: d.id};
            allMissions.push(data);
            if (data.vAgentID) {
                const dev = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[dev]) deviceData[dev] = [];
                deviceData[dev].push(data);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        document.getElementById('deviceSection').innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body"><div class="phone-screen"><div style="color:#000;font-size:10px;font-weight:bold;">${name}</div></div></div>
                <div class="status-label">[ STANDBY ]</div>
            </div>`).join('');
    };

    window.activateDevice = (name, el) => {
        el.classList.add('lights-on');
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `<button onclick="openMemoirs('${name}')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:10px; width:100%; cursor:pointer;">[ VIEW_${name}_MEMOIRS ]</button>`;
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => `
                <div class="folder-box ${v.expensesBreakdown?.length > 0 ? 'has-expenses' : ''}" onclick="openNoirModal('${v.id}')">
                    <div class="paper-sheet"></div><div class="folder-main"></div><div class="file-label">#${v.vAgentID}</div>
                </div>`).join('');
        }, 1000);
    };

    window.openNoirModal = (id) => {
        const d = allMissions.find(m => m.id === id);
        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-order').innerText = id.substring(0,10);
        document.getElementById('n-vagent').innerText = d.vAgentID || "N/A";
        document.getElementById('n-content').innerHTML = (d.expensesBreakdown || []).map(e => `
            <div class="expense-row"><span>${e.description}</span><b>₱${e.amount}</b></div>`).join('');
        document.getElementById('n-total').innerText = `₱ ${d.totalExpenses.toLocaleString()}`;
    };

    window.flipPage = (f) => {
        const book = document.getElementById('p1');
        f ? book.classList.add('flipped') : book.classList.remove('flipped');
    };

    window.openMemoirs = (mode) => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        flipPage(false);

        const filtered = (mode === 'ALL') ? allMissions : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);
        const valid = filtered.filter(m => (m.totalExpenses || 0) > 0);

        const withV = valid.filter(m => m.vAgentID).sort((a,b) => {
            const tA = a.expensesBreakdown?.length ? new Date(a.expensesBreakdown[a.expensesBreakdown.length-1].timestamp) : 0;
            const tB = b.expensesBreakdown?.length ? new Date(b.expensesBreakdown[b.expensesBreakdown.length-1].timestamp) : 0;
            return tB - tA;
        });
        const withoutV = valid.filter(m => !m.vAgentID).sort((a,b) => b.totalExpenses - a.totalExpenses);

        let p1HTML = "", p2HTML = "", vSub = 0, uSub = 0, grand = 0;
        const getRow = (m, isV) => `
            <div class="expense-row">
                <span><b style="font-size:8px;">MO# ${m.id.substring(0,10)}</b><br>${isV?'#vAgent '+m.vAgentID : 'AGENT: '+m.agent}<br><i style="font-size:8px;color:#8b0000">SYS: ${DEVICE_REGISTRY[m.weaponSystem]||m.weaponSystem}</i></span>
                <b style="font-size:14px;">₱${m.totalExpenses.toLocaleString()}</b>
            </div>`;

        // Logic vAgents
        withV.forEach((m, i) => {
            vSub += m.totalExpenses; grand += m.totalExpenses;
            if(i < 10) p1HTML += getRow(m, true); else p2HTML += getRow(m, true);
        });
        const vSubHTML = `<div style="text-align:right; font-size:11px; font-weight:bold; border-top:1px solid #000; padding:5px 0;">vAGENT_SUB: ₱${vSub.toLocaleString()}</div>`;
        if(withV.length <= 10) p1HTML += vSubHTML; else p2HTML += vSubHTML;

        // Logic Unassigned
        if(withoutV.length > 0) {
            const sep = `<div class="audit-separator">--- UNASSIGNED ---</div>`;
            if(withV.length < 10) p1HTML += sep; else p2HTML += sep;
            withoutV.forEach((m, i) => {
                uSub += m.totalExpenses; grand += m.totalExpenses;
                if((withV.length + i) < 10) p1HTML += getRow(m, false); else p2HTML += getRow(m, false);
            });
            const uSubHTML = `<div style="text-align:right; font-size:11px; font-weight:bold; border-top:1px solid #8b0000; padding:5px 0;">UN_SUB: ₱${uSub.toLocaleString()}</div>`;
            if((withV.length + withoutV.length) <= 10) p1HTML += uSubHTML; else p2HTML += uSubHTML;
        }

        document.getElementById('active-list').innerHTML = p1HTML;
        document.getElementById('overflow-list').innerHTML = p2HTML;
        document.querySelectorAll('.grand-total-display').forEach(el => el.innerText = grand.toLocaleString());
        
        document.getElementById('flipNextBtn').style.display = p2HTML ? "block" : "none";
        document.getElementById('p1-total-box').style.display = p2HTML ? "none" : "block";
        document.getElementById('target-name').innerText = mode;
    };
</script>
</body>
</html>
