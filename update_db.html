<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPDATE_DB - STATUS MANAGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #051014;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,243,255,0.1);
        }
        h2 {
            color: #00f3ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 18px;
        }
        /* Agents Section - Top Center */
        .agents-section {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a2f37;
        }
        .section-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #05ffa1;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 15px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 30px;
            transition: 0.2s;
        }
        .radio-group input[type="radio"] {
            accent-color: #00f3ff;
            width: 16px;
            height: 16px;
        }
        .radio-group label:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.15);
            color: #00f3ff;
        }
        /* Main Row - Left and Right */
        .main-row {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .left-panel {
            flex: 1;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
        }
        .right-panel {
            flex: 1;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
        }
        .panel-title {
            color: #00f3ff;
            font-size: 10px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }
        select {
            width: 100%;
            background: #01080b;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            padding: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            border-radius: 6px;
            outline: none;
        }
        select:focus {
            border-color: #00f3ff;
        }
        /* Status Radio Buttons */
        .status-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
        }
        .status-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 10px 20px;
            background: #01080b;
            border: 1px solid #1a2f37;
            border-radius: 40px;
            width: 80%;
            justify-content: center;
        }
        .status-option input {
            accent-color: #00f3ff;
            width: 18px;
            height: 18px;
        }
        .status-option span {
            color: #05ffa1;
            font-size: 13px;
            font-weight: bold;
        }
        .status-option:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.1);
        }
        .status-option:has(input:checked) span {
            color: #00f3ff;
        }
        /* Update Button - Center Bottom */
        .update-section {
            text-align: center;
            margin-top: 20px;
        }
        .update-btn {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 14px 30px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .update-btn:hover {
            background: #05ffa1;
            box-shadow: 0 0 15px rgba(5,255,161,0.4);
        }
        .update-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-msg {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
        }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
        .loading, .empty {
            text-align: center;
            color: #5c7882;
            padding: 20px;
        }
        .weapon-category {
            font-size: 10px;
            color: #5c7882;
            padding: 5px 0 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 STATUS MANAGER</h2>

        <!-- AGENTS SECTION (Top Center) -->
        <div class="agents-section">
            <div class="section-title">📡 SELECT AGENT</div>
            <div id="agentRadioGroup" class="radio-group">
                <div class="loading">Loading agents...</div>
            </div>
        </div>

        <!-- MAIN ROW (Left: Weapon System Dropdown, Right: Status Radio) -->
        <div class="main-row">
            <!-- LEFT PANEL: Weapon System Dropdown -->
            <div class="left-panel">
                <div class="panel-title">🔫 WEAPON SYSTEM</div>
                <select id="weaponSelect" disabled>
                    <option>Select agent first</option>
                </select>
                <div id="weaponInfo" class="weapon-category"></div>
            </div>

            <!-- RIGHT PANEL: Status Radio Buttons -->
            <div class="right-panel">
                <div class="panel-title">📌 STATUS</div>
                <div class="status-options">
                    <label class="status-option">
                        <input type="radio" name="status" value="DEPLOYED">
                        <span>🔹 DEPLOYED</span>
                    </label>
                    <label class="status-option">
                        <input type="radio" name="status" value="TERMINATED">
                        <span>🔻 TERMINATED</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- UPDATE BUTTON (Center Bottom) -->
        <div class="update-section">
            <button id="updateBtn" class="update-btn" disabled>💾 UPDATE STATUS</button>
        </div>

        <div class="status-msg" id="statusMsg">Ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // DOM Elements
        const agentRadioGroup = document.getElementById('agentRadioGroup');
        const weaponSelect = document.getElementById('weaponSelect');
        const weaponInfo = document.getElementById('weaponInfo');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('statusMsg');
        const statusRadios = document.querySelectorAll('input[name="status"]');

        let allAgents = [];
        let currentAgent = null;
        let weaponItems = []; // { value, display, type, docId, currentStatus }

        // ========== LOAD AGENTS FROM mission_orders ==========
        async function loadAgents() {
            statusMsg.innerHTML = '⏳ Loading agents from database...';
            agentRadioGroup.innerHTML = '<div class="loading">Loading agents...</div>';
            
            try {
                const snapshot = await db.collection("mission_orders").get();
                const agentSet = new Set();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.agent && data.agent.trim() !== '') {
                        agentSet.add(data.agent);
                    }
                });
                
                allAgents = Array.from(agentSet).sort();
                
                if (allAgents.length === 0) {
                    agentRadioGroup.innerHTML = '<div class="empty">⚠️ No agents found in mission_orders</div>';
                    statusMsg.innerHTML = '<span class="error">No agents found. Please create missions first.</span>';
                } else {
                    renderAgentRadios();
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${allAgents.length} agent(s)</span>`;
                }
            } catch (error) {
                console.error("Error loading agents:", error);
                agentRadioGroup.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                statusMsg.innerHTML = `<span class="error">❌ Failed to load agents</span>`;
            }
        }

        function renderAgentRadios() {
            agentRadioGroup.innerHTML = '';
            allAgents.forEach(agent => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'agent';
                radio.value = agent;
                radio.onclick = () => selectAgent(agent);
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(` ${agent}`));
                agentRadioGroup.appendChild(label);
            });
        }

        // ========== SELECT AGENT: LOAD WEAPON SYSTEMS ==========
        async function selectAgent(agent) {
            currentAgent = agent;
            statusMsg.innerHTML = `⏳ Loading weapon systems for ${agent}...`;
            
            weaponSelect.disabled = true;
            weaponSelect.innerHTML = '<option>Loading...</option>';
            weaponInfo.innerHTML = '';
            updateBtn.disabled = true;
            statusRadios.forEach(r => r.checked = false);
            
            try {
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", agent)
                    .get();
                
                // Collect weapon systems with their vAgent info and status
                const weaponMap = new Map(); // key = weaponSystem, value = { hasVAgent, noVAgent, blacklist, status }
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const weapon = data.weaponSystem;
                    const vAgent = data.vAgentID;
                    const targetID = data.targetID;
                    const status = data.status || "DEPLOYED";
                    
                    if (!weapon || weapon === 'INIT') return;
                    
                    if (!weaponMap.has(weapon)) {
                        weaponMap.set(weapon, {
                            hasVAgent: false,
                            noVAgent: false,
                            blacklist: false,
                            status: status,
                            docId: doc.id
                        });
                    }
                    
                    const entry = weaponMap.get(weapon);
                    if (vAgent && vAgent !== '' && vAgent !== 'INIT') {
                        entry.hasVAgent = true;
                    } else if (targetID && targetID !== '') {
                        entry.blacklist = true;
                    } else {
                        entry.noVAgent = true;
                    }
                    entry.status = status;
                });
                
                // Build dropdown items: first with vAgent, then NO vAGENT, then BLACKLIST
                weaponItems = [];
                
                for (const [weapon, info] of weaponMap.entries()) {
                    let displayName = weapon;
                    let type = 'normal';
                    
                    if (info.hasVAgent) {
                        displayName = `${weapon} (vAgent)`;
                        type = 'vagent';
                    } else if (info.blacklist) {
                        displayName = `${weapon} [BLACKLIST]`;
                        type = 'blacklist';
                    } else if (info.noVAgent) {
                        displayName = `${weapon} [NO vAGENT]`;
                        type = 'novagent';
                    }
                    
                    weaponItems.push({
                        value: weapon,
                        display: displayName,
                        type: type,
                        docId: info.docId,
                        currentStatus: info.status
                    });
                }
                
                // Sort: vAgent first, then NO vAGENT, then BLACKLIST
                const typeOrder = { 'vagent': 1, 'novagent': 2, 'blacklist': 3, 'normal': 4 };
                weaponItems.sort((a, b) => typeOrder[a.type] - typeOrder[b.type]);
                
                if (weaponItems.length === 0) {
                    weaponSelect.innerHTML = '<option>No weapon systems found</option>';
                    weaponSelect.disabled = true;
                    statusMsg.innerHTML = `<span class="error">⚠️ No weapon systems for ${agent}</span>`;
                } else {
                    // Populate dropdown
                    weaponSelect.innerHTML = '';
                    weaponItems.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.value;
                        option.textContent = item.display;
                        option.setAttribute('data-type', item.type);
                        option.setAttribute('data-status', item.currentStatus);
                        weaponSelect.appendChild(option);
                    });
                    weaponSelect.disabled = false;
                    updateBtn.disabled = false;
                    
                    // Set current status radio based on selected weapon
                    updateStatusRadioForSelected();
                    weaponSelect.onchange = () => updateStatusRadioForSelected();
                    
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${weaponItems.length} weapon system(s) for ${agent}</span>`;
                }
                
            } catch (error) {
                console.error("Error loading weapon systems:", error);
                weaponSelect.innerHTML = '<option>Error loading</option>';
                statusMsg.innerHTML = `<span class="error">❌ Failed to load weapon systems</span>`;
            }
        }

        function updateStatusRadioForSelected() {
            const selectedOption = weaponSelect.options[weaponSelect.selectedIndex];
            if (selectedOption && selectedOption.getAttribute('data-status')) {
                const currentStatus = selectedOption.getAttribute('data-status');
                statusRadios.forEach(radio => {
                    radio.checked = (radio.value === currentStatus);
                });
            } else {
                statusRadios.forEach(radio => radio.checked = false);
            }
        }

        // ========== UPDATE STATUS ==========
        async function updateStatus() {
            if (!currentAgent) {
                statusMsg.innerHTML = '<span class="error">❌ No agent selected</span>';
                return;
            }
            
            const selectedWeapon = weaponSelect.value;
            if (!selectedWeapon || selectedWeapon === 'Select agent first') {
                statusMsg.innerHTML = '<span class="error">❌ No weapon system selected</span>';
                return;
            }
            
            let selectedStatus = null;
            statusRadios.forEach(radio => {
                if (radio.checked) selectedStatus = radio.value;
            });
            
            if (!selectedStatus) {
                statusMsg.innerHTML = '<span class="error">❌ Please select a status (DEPLOYED or TERMINATED)</span>';
                return;
            }
            
            // Find the weapon item to get current status
            const weaponItem = weaponItems.find(w => w.value === selectedWeapon);
            if (!weaponItem) {
                statusMsg.innerHTML = '<span class="error">❌ Weapon not found</span>';
                return;
            }
            
            if (weaponItem.currentStatus === selectedStatus) {
                statusMsg.innerHTML = `<span class="error">⚠️ Status is already "${selectedStatus}"</span>`;
                return;
            }
            
            if (!confirm(`Update "${selectedWeapon}" status from "${weaponItem.currentStatus}" to "${selectedStatus}" for agent ${currentAgent}?\n\nThis will update ALL mission orders with this weapon system.`)) {
                return;
            }
            
            statusMsg.innerHTML = `⏳ Updating status to "${selectedStatus}"...`;
            updateBtn.disabled = true;
            
            try {
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", currentAgent)
                    .where("weaponSystem", "==", selectedWeapon)
                    .get();
                
                if (snapshot.empty) {
                    statusMsg.innerHTML = `<span class="error">❌ No mission orders found with weapon "${selectedWeapon}"</span>`;
                    updateBtn.disabled = false;
                    return;
                }
                
                let updateCount = 0;
                const batch = db.batch();
                
                snapshot.forEach(doc => {
                    const docRef = db.collection("mission_orders").doc(doc.id);
                    batch.update(docRef, { status: selectedStatus });
                    updateCount++;
                });
                
                await batch.commit();
                
                // Update local status
                weaponItem.currentStatus = selectedStatus;
                const selectedOption = weaponSelect.options[weaponSelect.selectedIndex];
                if (selectedOption) selectedOption.setAttribute('data-status', selectedStatus);
                
                statusMsg.innerHTML = `<span class="success">✅ SUCCESS: Updated "${selectedWeapon}" status to "${selectedStatus}" (${updateCount} mission(s) updated)</span>`;
                
            } catch (error) {
                console.error("Error updating status:", error);
                statusMsg.innerHTML = `<span class="error">❌ ERROR: ${error.message}</span>`;
            } finally {
                updateBtn.disabled = false;
            }
        }

        // Event listener for update button
        updateBtn.onclick = updateStatus;

        // Load agents on page load
        loadAgents();
    </script>
</body>
</html>
