<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <style>
        body { background: #01080b; color: #00f3ff; font-family: monospace; padding: 20px; }
        pre { background: #051014; padding: 15px; border: 1px solid #00f3ff; color: #05ffa1; overflow: auto; }
        input, button { padding: 10px; margin: 10px 0; background: #000; border: 1px solid #00f3ff; color: #05ffa1; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h2>🔐 Firebase Test</h2>
    <input type="text" id="secretKey" placeholder="Enter secret key (4646)">
    <button id="testBtn">TEST</button>
    <pre id="result">Ready...</pre>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const result = document.getElementById('result');
        const testBtn = document.getElementById('testBtn');

        testBtn.onclick = async () => {
            const key = document.getElementById('secretKey').value.trim();
            result.innerHTML = "Searching...\n";
            
            try {
                const snap = await db.collection("agents").where("secretKey", "==", key).get();
                
                if (snap.empty) {
                    result.innerHTML = "❌ No agent found with that secret key\n";
                    result.innerHTML += "💡 Check: Is the secretKey field correct?\n";
                    result.innerHTML += "💡 Check: Is the collection name 'agents'?\n";
                } else {
                    snap.forEach(doc => {
                        const data = doc.data();
                        result.innerHTML = "✅ FOUND!\n";
                        result.innerHTML += `Document ID: ${doc.id}\n`;
                        result.innerHTML += `agentName: ${data.agentName}\n`;
                        result.innerHTML += `secretKey: ${data.secretKey}\n`;
                    });
                }
            } catch (e) {
                result.innerHTML = `❌ ERROR: ${e.message}\n`;
                if (e.message.includes("quota")) {
                    result.innerHTML += "⚠️ QUOTA EXCEEDED - Wait until tomorrow\n";
                }
            }
        };
    </script>
</body>
</html>
