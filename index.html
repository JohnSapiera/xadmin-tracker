<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AGENT LOGIN SYSTEM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0a1a2a 100%);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(10, 20, 30, 0.95);
            border: 2px solid #00f2ff;
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }
        .title {
            text-align: center;
            margin-bottom: 30px;
        }
        .title h1 {
            color: #00f2ff;
            font-size: 24px;
            letter-spacing: 3px;
        }
        .title p {
            color: #5c7882;
            font-size: 11px;
            margin-top: 8px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            color: #00f2ff;
            font-size: 12px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-align: center;
            letter-spacing: 3px;
            border-radius: 5px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #00f2ff;
            color: #00f2ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: #00f2ff;
            color: #000;
        }
        .btn-login:active {
            transform: scale(0.98);
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            border-radius: 5px;
        }
        .error {
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid #ff003c;
            color: #ff003c;
        }
        .success {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            color: #00ff66;
        }
        .info {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid #00f2ff;
            color: #00f2ff;
        }
        .device-info {
            margin-top: 20px;
            padding: 10px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 5px;
            font-size: 9px;
            color: #5c7882;
            word-break: break-all;
        }
        .device-info span {
            color: #05ffa1;
        }
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #00f2ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 9px;
            color: #4a5a61;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-container">
    <div class="title">
        <h1>🔐 AGENT LOGIN</h1>
        <p>SUPABASE SECURE ACCESS SYSTEM</p>
    </div>

    <div class="input-group">
        <label>📱 SECRET KEY</label>
        <input type="password" id="secretKey" maxlength="4" placeholder="••••" autocomplete="off">
    </div>

    <button class="btn-login" id="loginBtn">VERIFY & LOGIN</button>

    <div id="message" class="message"></div>

    <div class="device-info">
        <div>🖨️ DEVICE FINGERPRINT</div>
        <div id="devicePrint" style="color: #05ffa1; margin-top: 5px;">-- CALCULATING --</div>
    </div>

    <div class="footer">
        AUTHORIZED AGENTS: AGENT_LZ | AGENT_JFSN
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    let supabaseClient = null;
    
    // Generate device fingerprint
    function generateDeviceFingerprint() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC";
        
        const data = {
            gpu: gpu,
            screen: `${window.screen.width}x${window.screen.height}`,
            platform: navigator.platform,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            language: navigator.language
        };
        
        const raw = JSON.stringify(data);
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "FP-" + Math.abs(hash).toString(16).toUpperCase();
    }
    
    // Display message
    function showMessage(text, type = 'info') {
        const messageDiv = document.getElementById('message');
        messageDiv.className = `message ${type}`;
        messageDiv.innerHTML = text;
        
        setTimeout(() => {
            if (messageDiv.innerHTML === text) {
                messageDiv.className = 'message';
                messageDiv.innerHTML = '';
            }
        }, 5000);
    }
    
    // Set loading state
    function setLoading(isLoading) {
        const btn = document.getElementById('loginBtn');
        if (isLoading) {
            btn.innerHTML = 'VERIFYING... <span class="loading"></span>';
            btn.disabled = true;
        } else {
            btn.innerHTML = 'VERIFY & LOGIN';
            btn.disabled = false;
        }
    }
    
    // Login function
    async function login(secretKey, devicePrint) {
        setLoading(true);
        showMessage(`🔍 Verifying secret key: ${secretKey}...`, 'info');
        
        try {
            // Query Supabase for agent with matching secret_key
            const { data: agent, error } = await supabaseClient
                .from('agents')
                .select('*')
                .eq('secret_key', secretKey)
                .maybeSingle();
            
            if (error) {
                console.error("Database error:", error);
                showMessage(`❌ Database error: ${error.message}`, 'error');
                setLoading(false);
                return false;
            }
            
            if (!agent) {
                showMessage(`❌ Invalid secret key: ${secretKey}. Access denied.`, 'error');
                setLoading(false);
                return false;
            }
            
            // Check if agent is authorized (AGENT_LZ or AGENT_JFSN only)
            const authorizedAgents = ['AGENT_LZ', 'AGENT_JFSN'];
            if (!authorizedAgents.includes(agent.agent_name)) {
                showMessage(`❌ Unauthorized agent: ${agent.agent_name}. Access denied.`, 'error');
                setLoading(false);
                return false;
            }
            
            // Login successful!
            showMessage(`✅ ACCESS GRANTED! Welcome, ${agent.agent_name}`, 'success');
            
            // Store login data in localStorage
            const loginData = {
                agent_name: agent.agent_name,
                secret_key: secretKey,
                device_print: devicePrint,
                login_time: new Date().toISOString(),
                weapons: agent.weapons_array || []
            };
            
            localStorage.setItem("agent_session", JSON.stringify(loginData));
            localStorage.setItem("agent_name", agent.agent_name);
            localStorage.setItem("secret_key", secretKey);
            localStorage.setItem("device_print", devicePrint);
            localStorage.setItem("weapon_systems", JSON.stringify(agent.weapons_array || []));
            
            console.log("✅ LOGIN SUCCESSFUL - Stored in localStorage:");
            console.log("   Agent:", agent.agent_name);
            console.log("   Secret Key:", secretKey);
            console.log("   Device Print:", devicePrint);
            console.log("   Weapons:", agent.weapons_array || []);
            
            // Update Supabase with last login and device fingerprint
            const currentSignatures = agent.linked_signatures || [];
            if (!currentSignatures.includes(devicePrint)) {
                await supabaseClient
                    .from('agents')
                    .update({ 
                        linked_signatures: [...currentSignatures, devicePrint],
                        last_fingerprint: devicePrint,
                        updated_at: new Date().toISOString()
                    })
                    .eq('secret_key', secretKey);
            } else {
                await supabaseClient
                    .from('agents')
                    .update({ 
                        last_fingerprint: devicePrint,
                        updated_at: new Date().toISOString()
                    })
                    .eq('secret_key', secretKey);
            }
            
            setTimeout(() => {
                // Redirect to dashboard or show success screen
                showMessage(`✅ Login successful! Redirecting...`, 'success');
                setTimeout(() => {
                    // You can redirect to another page here
                    // window.location.href = "dashboard.html";
                    document.body.innerHTML = `
                        <div class="login-container" style="text-align: center;">
                            <div class="title">
                                <h1>✅ ACCESS GRANTED</h1>
                            </div>
                            <div style="color: #05ffa1; margin: 20px 0;">
                                <p>Welcome, <strong>${agent.agent_name}</strong>!</p>
                                <p style="margin-top: 10px;">Device fingerprint registered.</p>
                                <p style="margin-top: 10px; font-size: 11px;">Weapons: ${(agent.weapons_array || []).join(', ') || 'None'}</p>
                            </div>
                            <button class="btn-login" onclick="location.reload()">LOG OUT</button>
                        </div>
                    `;
                }, 1000);
            }, 1500);
            
            setLoading(false);
            return true;
            
        } catch (err) {
            console.error("Login error:", err);
            showMessage(`❌ Login error: ${err.message}`, 'error');
            setLoading(false);
            return false;
        }
    }
    
    // Check if already logged in
    function checkExistingSession() {
        const session = localStorage.getItem("agent_session");
        if (session) {
            try {
                const data = JSON.parse(session);
                const loginTime = new Date(data.login_time);
                const now = new Date();
                const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
                
                // Session expires after 24 hours
                if (hoursDiff < 24) {
                    showMessage(`✅ Welcome back, ${data.agent_name}! You are already logged in.`, 'success');
                    return true;
                } else {
                    localStorage.removeItem("agent_session");
                    return false;
                }
            } catch(e) {
                localStorage.removeItem("agent_session");
                return false;
            }
        }
        return false;
    }
    
    // Initialize
    async function init() {
        // Display device fingerprint
        const devicePrint = generateDeviceFingerprint();
        document.getElementById('devicePrint').innerText = devicePrint;
        
        // Initialize Supabase
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("Supabase initialized");
            
            // Test connection
            const { error } = await supabaseClient.from('agents').select('count', { count: 'exact', head: true });
            if (error) {
                showMessage(`⚠️ Database connection issue: ${error.message}`, 'error');
            } else {
                console.log("Connected to Supabase");
            }
        } catch (err) {
            console.error("Init error:", err);
            showMessage(`⚠️ Failed to connect: ${err.message}`, 'error');
        }
        
        // Check existing session
        const hasSession = checkExistingSession();
        if (hasSession) {
            document.getElementById('secretKey').disabled = true;
            document.getElementById('loginBtn').innerHTML = 'ALREADY LOGGED IN';
            document.getElementById('loginBtn').disabled = true;
        }
        
        // Add event listener for Enter key
        document.getElementById('secretKey').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const secretKey = document.getElementById('secretKey').value.trim();
                if (secretKey.length === 4) {
                    login(secretKey, devicePrint);
                } else {
                    showMessage('❌ Please enter a 4-digit secret key', 'error');
                }
            }
        });
        
        // Login button click
        document.getElementById('loginBtn').addEventListener('click', () => {
            const secretKey = document.getElementById('secretKey').value.trim();
            if (secretKey.length === 4) {
                login(secretKey, devicePrint);
            } else {
                showMessage('❌ Please enter a 4-digit secret key', 'error');
            }
        });
    }
    
    // Start the app
    init();
</script>
</body>
</html>
