<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT_PROFILE | MOSSAD DOSSIER</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050506; 
            --cyan: #00f2ff; 
            --danger: #ff3c3c;
            --border: rgba(0, 242, 255, 0.15); 
            --panel: rgba(15, 15, 20, 0.95);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'JetBrains Mono', monospace; 
            margin: 0; 
            padding: 15px;
            /* Tactical Grid Background */
            background-image: radial-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Top Navigation */
        .header-nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid var(--cyan); 
            padding-bottom: 12px; 
            margin-bottom: 20px; 
        }

        .agent-id-card {
            display: flex;
            flex-direction: column;
        }

        .agent-name { font-size: 18px; font-weight: 800; color: var(--cyan); letter-spacing: 1px; }
        .clearance-tag { font-size: 9px; color: #555; font-weight: 800; }

        .back-btn {
            background: var(--cyan);
            color: #000;
            border: none;
            padding: 8px 15px;
            font-family: inherit;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Profile Layout */
        .profile-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (min-width: 900px) {
            .profile-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        }

        .section { 
            border: 1px solid var(--border); 
            background: var(--panel); 
            padding: 20px; 
            min-height: 400px;
            position: relative;
        }

        .section-title { 
            font-size: 11px; 
            color: var(--cyan); 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px; 
            margin-bottom: 20px; 
            letter-spacing: 2px; 
            display: flex;
            justify-content: space-between;
        }

        /* Memoirs / Bounty Cards */
        .weapon-group { margin-bottom: 25px; }
        .weapon-header { 
            font-weight: 800; 
            font-size: 10px;
            color: #000; 
            background: var(--cyan); 
            padding: 3px 10px; 
            display: inline-block; 
            margin-bottom: 10px; 
        }
        
        .vagent-card { 
            background: rgba(0,0,0,0.4); 
            border: 1px solid #222; 
            padding: 12px; 
            margin-bottom: 10px; 
            font-size: 11px;
            position: relative;
            overflow: hidden;
        }

        .info-row { display: flex; justify-content: space-between; margin-top: 6px; color: #666; font-size: 10px; }
        .info-val { color: #ccc; }
        
        .status-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: 800;
        }
        .expired-bg { color: var(--danger); border: 1px solid var(--danger); }
        .active-bg { color: #00ff00; border: 1px solid #00ff00; }

        /* Dossier Archive Style */
        .archive-entry {
            border-bottom: 1px solid #1a1a1f;
            padding: 10px 0;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .archive-meta { color: #555; font-size: 9px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--cyan); }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="header-nav">
        <div class="agent-id-card">
            <div class="agent-name">AGENT: <span id="codenameDisplay">---</span></div>
            <div class="clearance-tag">SECURE_LEVEL_5 // MOSSAD_CENTRAL</div>
        </div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">RETURN</button>
    </div>

    <div class="profile-container">
        
        <div class="section">
            <div class="section-title">
                <span>DEPLOYMENT_HISTORY</span>
                <span style="color:#333">JSON_FEED</span>
            </div>
            <div id="memoirsList">
                <div style="color:#333; font-size:10px;">> DECRYPTING FILES...</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                <span>CONFIDENTIAL_ARCHIVE</span>
                <span style="color:#333">TERM_LOGS</span>
            </div>
            <div id="confidentialInfo">
                <div style="color:#333; font-size:10px;">> WAITING FOR SCANNER DATA...</div>
            </div>
        </div>

    </div>

    <script>
        const activeAgent = localStorage.getItem("cia_agent");
        if (!activeAgent) { window.location.href = "index.html"; }
        document.getElementById('codenameDisplay').innerText = activeAgent;

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. MEMOIRS FETCH (Bounties)
        db.collection("bounties")
          .where("agent", "==", activeAgent)
          .orderBy("timestamp", "desc")
          .onSnapshot((snapshot) => {
            const memoirsDiv = document.getElementById('memoirsList');
            if (snapshot.empty) {
                memoirsDiv.innerHTML = "<div style='color:#555; font-size:10px;'>[ NO_DATA_RECORDED ]</div>";
                return;
            }

            let weaponsData = {};
            snapshot.forEach(doc => {
                const data = doc.data();
                if (!weaponsData[data.weapon]) weaponsData[data.weapon] = [];
                weaponsData[data.weapon].push(data);
            });

            let html = "";
            for (let wpn in weaponsData) {
                html += `<div class="weapon-group">
                            <div class="weapon-header">${wpn} SYSTEM</div>`;
                
                weaponsData[wpn].forEach(item => {
                    const termDate = item.timestamp ? item.timestamp.toDate() : new Date();
                    const expDate = new Date(termDate);
                    expDate.setMonth(expDate.getMonth() + 1);
                    const isExpired = new Date() > expDate;

                    html += `
                        <div class="vagent-card">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="color:var(--cyan); font-weight:800;">ID: #${item.vid}</span>
                                <span class="status-badge ${isExpired ? 'expired-bg' : 'active-bg'}">
                                    ${isExpired ? 'EXPIRED' : 'ACTIVE'}
                                </span>
                            </div>
                            <div class="info-row">
                                <span>DATE_DEPLOYED:</span>
                                <span class="info-val">${termDate.toLocaleDateString()}</span>
                            </div>
                            <div class="info-row">
                                <span>EXPIRATION:</span>
                                <span class="info-val" style="${isExpired ? 'color:var(--danger)' : ''}">${expDate.toLocaleDateString()}</span>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            }
            memoirsDiv.innerHTML = html;
        });

        // 2. ARCHIVE FETCH (Dossier from Scanner)
        db.collection("dossier")
          .where("agent", "==", activeAgent)
          .orderBy("timestamp", "desc")
          .onSnapshot(snapshot => {
              const confDiv = document.getElementById('confidentialInfo');
              if(snapshot.empty) {
                  confDiv.innerHTML = "<div style='color:#555; font-size:10px;'>[ ARCHIVE_EMPTY ]</div>";
                  return;
              }

              let html = "";
              snapshot.forEach(doc => {
                  const d = doc.data();
                  const dateArchived = d.timestamp ? d.timestamp.toDate().toLocaleString() : 'N/A';
                  html += `
                    <div class="archive-entry">
                        <div style="color:#fff; font-weight:800;">MISSION: ${d.missionOrder}</div>
                        <div style="color:#aaa;">WEAPON: ${d.weapon} // TARGET: V-${d.vid}</div>
                        <div class="archive-meta">ARCHIVED_AT: ${dateArchived}</div>
                    </div>`;
              });
              confDiv.innerHTML = html;
          });
    </script>
</body>
</html>
