<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT_DOSSIER | SECURE_SYSTEM</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0c0c0e; --cyan: #00f2ff; --folder: #d4af37; 
            --subfolder: #5a6268; --paper: #fdfdfd; --red: #ff3c3c; 
        }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 15px; }
        
        /* Navigation Header */
        .nav-header { display: flex; justify-content: space-between; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        .breadcrumb { font-size: 10px; color: var(--cyan); word-break: break-all; }
        .back-btn { background: none; border: 1px solid var(--cyan); color: var(--cyan); padding: 5px 10px; cursor: pointer; font-family: inherit; font-size: 10px; }
        
        /* Grid System para sa Folders */
        .explorer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .folder-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 10px; transition: transform 0.2s; }
        .folder-item:active { transform: scale(0.95); }
        
        /* Main Folder (Gold) */
        .folder-icon { width: 70px; height: 50px; background: var(--folder); position: relative; border-radius: 0 4px 4px 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .folder-icon::before { content: ''; position: absolute; top: -8px; left: 0; width: 30px; height: 10px; background: var(--folder); border-radius: 4px 4px 0 0; }
        
        /* Sub Folder (Gray) */
        .sub-icon { background: var(--subfolder); }
        .sub-icon::before { background: var(--subfolder); }
        
        .folder-name { font-size: 11px; margin-top: 10px; text-align: center; font-weight: 800; letter-spacing: 1px; }

        /* Document Paper Style */
        .paper-stack { display: none; flex-direction: column; gap: 20px; margin-top: 10px; }
        .official-paper { 
            background: var(--paper); color: #1a1a1a; padding: 30px 20px; font-family: 'Courier Prime', monospace;
            box-shadow: 5px 5px 0px #333; border-left: 10px solid #ccc; position: relative;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .paper-header { border-bottom: 2px solid #1a1a1a; margin-bottom: 15px; font-weight: bold; font-size: 16px; text-align: center; }
        .v-agent-tag { background: #1a1a1a; color: #fff; padding: 4px 10px; font-size: 12px; display: inline-block; margin-bottom: 20px; font-family: 'JetBrains Mono'; }
        
        .expenses-table { width: 100%; border: 1px solid #ddd; font-size: 12px; margin-bottom: 15px; border-collapse: collapse; }
        .expenses-table th, .expenses-table td { border: 1px solid #ddd; padding: 8px; text-align: left; font-family: 'JetBrains Mono'; }
        .expenses-table th { background: #f0f0f0; }

        .deployment-footer { border-top: 2px dashed #1a1a1a; padding-top: 10px; font-size: 11px; font-weight: bold; margin-top: 20px; font-family: 'JetBrains Mono'; display: flex; justify-content: space-between; }
        
        .hidden { display: none !important; }
        .empty-msg { text-align: center; color: #666; font-size: 12px; grid-column: span 2; margin-top: 50px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="nav-header">
        <div class="breadcrumb" id="breadcrumbPath">SYSTEM://ARCHIVE</div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">DASHBOARD</button>
    </div>

    <div id="weaponGrid" class="explorer-grid"></div>

    <div id="vAgentView" class="hidden">
        <button class="back-btn" onclick="backToWeapons()" style="margin-bottom: 20px;"><< BACK TO WEAPONS</button>
        <div id="vAgentGrid" class="explorer-grid"></div>
    </div>

    <div id="documentStack" class="paper-stack">
        <button class="back-btn" onclick="backToVAgents()" style="width: 120px; margin-bottom: 15px;"><< CLOSE FOLDER</button>
        <div id="papers"></div>
    </div>

    <script>
        const activeAgent = localStorage.getItem("cia_agent") || "GHOST";
        let currentSelectedWeapon = "";
        let currentWeaponRecords = []; // Dito natin i-store pansamantala ang data

        const agentRegistry = {
            "LZ": ["R8P", "RMN"],
            "JFSN": ["RMN9", "TechnoCP"]
        };

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // INIT BREADCRUMB
        function updatePath(weapon, vAgent) {
            let path = `ARCHIVE / ${activeAgent}`;
            if(weapon) path += ` / ${weapon}`;
            if(vAgent) path += ` / V-${vAgent}`;
            document.getElementById('breadcrumbPath').innerText = path;
        }

        // TIER 1: RENDER MAIN WEAPON FOLDERS
        function loadWeaponFolders() {
            updatePath();
            const grid = document.getElementById('weaponGrid');
            const weapons = agentRegistry[activeAgent.toUpperCase()] || [];
            grid.innerHTML = "";

            weapons.forEach(wpn => {
                grid.innerHTML += `
                    <div class="folder-item" onclick="openWeaponFolder('${wpn}')">
                        <div class="folder-icon"></div>
                        <div class="folder-name">${wpn}_SYSTEM</div>
                    </div>`;
            });
        }

        // TIER 2: FETCH DATA & RENDER V.AGENT SUBFOLDERS
        function openWeaponFolder(weaponType) {
            currentSelectedWeapon = weaponType;
            document.getElementById('weaponGrid').classList.add('hidden');
            document.getElementById('vAgentView').classList.remove('hidden');
            updatePath(weaponType);

            const grid = document.getElementById('vAgentGrid');
            grid.innerHTML = "<div style='color:var(--cyan); font-size:10px; grid-column: span 2; text-align:center;'>SCANNING_DATABASE...</div>";

            db.collection("blacklist")
                .where("agent", "==", activeAgent.toUpperCase())
                .where("weapon", "==", weaponType)
                .onSnapshot(snapshot => {
                    grid.innerHTML = "";
                    currentWeaponRecords = snapshot.docs.map(doc => doc.data());

                    if(currentWeaponRecords.length === 0) {
                        grid.innerHTML = "<div class='empty-msg'>NO SUB-FILES FOUND.<br>SAVE A MISSION ORDER FIRST.</div>";
                        return;
                    }

                    // Kunin lang ang mga UNIQUE na V.Agent Numbers
                    const uniqueVids = [...new Set(currentWeaponRecords.map(item => parseInt(item.vid) || 1))];
                    uniqueVids.sort((a, b) => a - b); // Sequence in order (1, 2, 3...)

                    uniqueVids.forEach(vid => {
                        grid.innerHTML += `
                            <div class="folder-item" onclick="openDocument(${vid})">
                                <div class="folder-icon sub-icon"></div>
                                <div class="folder-name">V.AGENT_#${vid}</div>
                            </div>`;
                    });
                });
        }

        // TIER 3: RENDER THE OFFICIAL PAPER INSIDE V.AGENT FOLDER
        function openDocument(vid) {
            document.getElementById('vAgentView').classList.add('hidden');
            document.getElementById('documentStack').style.display = 'flex';
            updatePath(currentSelectedWeapon, vid);

            const paperContainer = document.getElementById('papers');
            paperContainer.innerHTML = "";

            // Hanapin ang papel na nakapangalan kay V.Agent na ito
            const myPapers = currentWeaponRecords.filter(item => (parseInt(item.vid) || 1) === vid);

            myPapers.forEach(data => {
                const date = data.timestamp ? data.timestamp.toDate().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase() : "CLASSIFIED";
                
                paperContainer.innerHTML += `
                    <div class="official-paper">
                        <div class="paper-header">MISSION ORDER: #${data.missionOrder}</div>
                        <div class="v-agent-tag">V.AGENT ID: V-${data.vid}</div>
                        
                        <table class="expenses-table">
                            <tr><th>EXPENSES</th><th>AMOUNT</th><th>DATE FILED</th></tr>
                            <tr>
                                <td>OPERATIONAL</td>
                                <td style="color:var(--red); font-weight:bold;">PHP ${data.amount || '0.00'}</td>
                                <td>${date}</td>
                            </tr>
                        </table>

                        <div class="deployment-footer">
                            <span>STATUS: DEPLOYED</span>
                            <span>DATE: ${date}</span>
                        </div>
                    </div>`;
            });
        }

        // BACK BUTTON LOGICS
        function backToWeapons() {
            document.getElementById('vAgentView').classList.add('hidden');
            document.getElementById('weaponGrid').classList.remove('hidden');
            updatePath();
        }

        function backToVAgents() {
            document.getElementById('documentStack').style.display = 'none';
            document.getElementById('vAgentView').classList.remove('hidden');
            updatePath(currentSelectedWeapon);
        }

        // START SYSTEM
        loadWeaponFolders();
    </script>
</body>
</html>
