<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AGENCY_INTEL_SYSTEM_v12.5</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #01080b; --panel: rgba(2, 12, 18, 0.95); --cyan: #00f3ff; --red: #ff003c; --green: #00ff66; --border: rgba(0, 243, 255, 0.2); --mono: 'Share Tech Mono', monospace; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 50%, #0a1f29 0%, var(--bg) 100%); }
    header { padding: 12px; border-bottom: 2px solid var(--border); text-align: center; background: #000; }
    .agent-welcome { font-family: var(--mono); color: var(--cyan); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .intel-greet { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 35px; text-shadow: 0 0 10px var(--cyan); line-height: 1.4; }
    .report-btn { background: transparent; border: 2px solid var(--cyan); color: var(--cyan); padding: 22px 55px; font-family: var(--mono); font-size: 16px; cursor: pointer; clip-path: polygon(15% 0, 85% 0, 100% 50%, 85% 100%, 15% 100%, 0 50%); transition: 0.3s; }
    .report-btn.locked { opacity: 0.15; cursor: not-allowed; pointer-events: none; border-color: #333; color: #333; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; backdrop-filter: blur(8px); }
    .modal-panel { position: fixed; top: 50%; left: 50%; width: 95%; max-width: 380px; background: var(--panel); border: 2px solid var(--cyan); padding: 30px 20px; transform: translate(-50%, -50%); border-radius: 3px; }
    .intel-input { width: 100%; background: #000; border: 1px solid #1a262b; padding: 15px; color: #fff; font-family: var(--mono); margin-bottom: 15px; outline: none; }
    .send-btn { width: 100%; padding: 20px; background: var(--green); color: #000; border: none; font-family: var(--mono); font-weight: bold; cursor: pointer; }
    nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
    .nav-link { display: flex; align-items: center; justify-content: center; color: #333; font-size: 10px; font-family: var(--mono); text-decoration: none; }
    .nav-link.active { color: var(--cyan); border-top: 2px solid var(--cyan); }
    #device-info { font-size: 10px; color: #4a5a61; margin-top: 15px; font-family: var(--mono); text-align: center; max-width: 80%; line-height: 1.5; }
  </style>
</head>
<body>

<header><div class="agent-welcome" id="agent-display">TRACE_INITIALIZING...</div></header>
<main>
    <div class="intel-greet" id="intel-msg">SCANNING_HARDWARE...</div>
    <button id="main-report-btn" class="report-btn locked" onclick="openReport()" disabled>INITIATE REPORT</button>
    <div id="device-info">WAITING_FOR_NODE_SIGNATURE...</div>
</main>

<div id="report-modal" class="modal-overlay">
    <div class="modal-panel">
        <h3 style="color:var(--cyan); font-family:var(--mono); margin-bottom:20px;">INTEL_DATA_ENTRY</h3>
        <input type="tel" id="vagent-num" class="intel-input" placeholder="V-AGENT NUMBER">
        <input type="number" id="expenses-val" class="intel-input" placeholder="EXPENSES (PHP)">
        <button id="send-btn" class="send-btn">SEND_INTEL_DATA</button>
        <button onclick="closeReport()" style="width:100%; background:transparent; color:var(--red); border:none; margin-top:10px; cursor:pointer;">CANCEL</button>
    </div>
</div>

<nav>
  <a href="dashboard.html" class="nav-link">DASHBOARD</a>
  <a href="#" class="nav-link active">INTEL</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:baab5171d8e0a58acd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Kuhanin ang PERMANENT ID sa browser memory
  const localNodeSecret = localStorage.getItem("agency_node_secret");

  async function silentTrace() {
    const display = document.getElementById('agent-display');
    const msg = document.getElementById('intel-msg');
    const btn = document.getElementById('main-report-btn');
    const info = document.getElementById('device-info');

    if (!localNodeSecret) {
        display.textContent = "ACCESS_DENIED";
        msg.innerHTML = `<span style="color:var(--red);">UNREGISTERED_HARDWARE</span>`;
        info.innerHTML = `ERROR: NO_NODE_SECRET_FOUND<br>PLEASE RUN AUTHORIZATION_PROTOCOL.`;
        return;
    }

    info.textContent = `TRACE_ID: ${localNodeSecret}...`;

    try {
        const snap = await getDocs(collection(db, "agents"));
        let foundAgent = null;
        let deviceBrandFromDB = "GENERIC_NODE";

        snap.forEach(doc => {
            const data = doc.data();
            
            // 1. I-check kung ang localNodeSecret ay nasa linkedDevice array
            if (data.linkedDevice && data.linkedDevice.includes(localNodeSecret)) {
                foundAgent = data.agentName;

                // 2. Hanapin ang Brand Name sa deviceDetails array para sa UI display
                if (data.deviceDetails) {
                    const detail = data.deviceDetails.find(d => d.signature === localNodeSecret || d.id === localNodeSecret);
                    if (detail) {
                        deviceBrandFromDB = detail.brandName || detail.brand;
                    }
                }
            }
        });

        if (foundAgent) {
            display.textContent = `AGENT_VERIFIED: ${foundAgent}`;
            msg.innerHTML = `Welcome back, Agent ${foundAgent}.<br><span style="font-size:12px; color:var(--green);">UPLINK_STABLE</span>`;
            info.innerHTML = `AUTHORIZED_BRAND: <span style="color:var(--cyan)">${deviceBrandFromDB}</span><br>NODE_ID: ${localNodeSecret}`;
            
            btn.classList.remove('locked');
            btn.disabled = false;
            
            // I-save ang verified agent name para sa ibang pages
            localStorage.setItem("cia_agent", foundAgent);
        } else {
            display.textContent = "ACCESS_DENIED";
            msg.innerHTML = `<span style="color:var(--red);">SIGNATURE_MISMATCH</span>`;
            info.innerHTML = `NODE_ID ${localNodeSecret} is not linked to any active Agent profile.`;
        }
    } catch (e) { 
        console.error(e);
        display.textContent = "UPLINK_ERROR";
        info.textContent = "DATABASE_CONNECTION_FAILED";
    }
  }

  window.openReport = () => document.getElementById('report-modal').style.display = 'block';
  window.closeReport = () => document.getElementById('report-modal').style.display = 'none';

  // Simulan ang trace pag-load
  silentTrace();
</script>
</body>
</html>
