<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root { --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c; --font-digital: 'Share Tech Mono', monospace; --font-noir: 'Special Elite', cursive; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--cia-bg); color: #fff; font-family: var(--font-digital); height: 100vh; overflow: hidden; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .phone-wrapper { cursor: pointer; text-align: center; }
        .phone-body { width: 100px; height: 180px; background: #050a0c; border: 2px solid #1a2a30; border-radius: 12px; margin: 0 auto; transition: 0.3s; position: relative; }
        .phone-wrapper.lights-on .phone-body { border-color: var(--cia-cyan); box-shadow: 0 0 20px var(--cia-cyan); }
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .folder-box { cursor: pointer; text-align: center; }
        .folder-main { width: 45px; height: 30px; background: var(--cia-cyan); border-radius: 0 4px 4px 4px; margin: 0 auto; position: relative; clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%); }

        /* --- BOOK OVERLAY SYSTEM --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .book { width: 90%; max-width: 380px; height: 80vh; position: relative; perspective: 1500px; }
        
        .page { 
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background: #e8e2d2; color: #1a1a1a; padding: 40px 20px; font-family: var(--font-noir);
            box-shadow: 5px 5px 20px rgba(0,0,0,0.5); transition: transform 0.6s;
            transform-origin: left; backface-visibility: hidden; display: flex; flex-direction: column;
        }
        .page-front { z-index: 5002; }
        .page-back { z-index: 5001; transform: rotateY(0deg); display: none; } /* Default hide */
        
        .page.flipped { transform: rotateY(-180deg); }

        .audit-list { flex-grow: 1; overflow-y: auto; margin: 10px 0; border-top: 1px solid #000; padding-top: 10px; }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.2); padding: 5px 0; font-size: 11px; }
        .audit-separator { border-top: 2px double #8b0000; margin: 10px 0; text-align: center; font-size: 9px; color: #8b0000; font-weight: bold; }

        .close-btn { position: absolute; top: 10px; right: 10px; background: #8b0000; color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; z-index: 6000; font-weight: bold; }
        .swipe-hint { padding: 10px; font-size: 11px; font-weight: bold; color: #8b0000; text-align: right; cursor: pointer; border-top: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan);">AUTHENTICATING...</h2>
        <p style="font-size: 9px; opacity: 0.5;">MEMOIRS_PROTOCOL_V3_FINAL</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:10px; width:100%; margin-top:20px;">[ EXIT_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 30px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 20px; font-weight:bold;">[ MASTER_MEMOIRS ]</button>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="book">
        <button class="close-btn" onclick="closeMemoirs()">X</button>
        
        <div id="p1" class="page page-front">
            <h3 style="border-bottom: 2px solid #000;">AUDIT_LOGS</h3>
            <p style="font-size: 9px;">MODE: <span id="target-name">---</span></p>
            <div id="active-list" class="audit-list"></div>
            <div id="p1-total-box" style="display:none; border-top: 2px solid #000; padding-top: 5px;">
                <p style="font-size: 10px;">TOTAL EXPENDITURE:</p>
                <h2 id="total-val-p1">₱ 0.00</h2>
            </div>
            <div id="flipNextBtn" class="swipe-hint" onclick="flipPage(true)">[ NEXT_PAGE ] >></div>
        </div>

        <div id="p2" class="page page-back">
            <h3 style="border-bottom: 2px solid #000;">FINAL_AUDIT</h3>
            <div id="overflow-list" class="audit-list"></div>
            <div style="margin-top: auto; border-top: 3px double #000; padding-top: 10px;">
                <p style="font-size: 10px; font-weight: bold;">GRAND TOTAL:</p>
                <h1 id="total-val-p2" style="font-size: 28px;">₱ 0.00</h1>
            </div>
            <div class="swipe-hint" onclick="flipPage(false)" style="text-align: left;"><< [ PREVIOUS_PAGE ]</div>
        </div>
    </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN";
    document.getElementById('display-agent').innerText = currentAgent;
    let allMissions = [], deviceData = {};

    window.closeMemoirs = () => { document.getElementById('memoirsOverlay').style.display = 'none'; };

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        snap.forEach(d => {
            const data = {...d.data(), id: d.id};
            allMissions.push(data);
            if (data.vAgentID) {
                const dev = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[dev]) deviceData[dev] = [];
                deviceData[dev].push(data);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        document.getElementById('deviceSection').innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body"></div><div style="font-size:10px; margin-top:5px;">${name}</div>
            </div>`).join('');
    };

    window.activateDevice = (name, el) => {
        el.classList.add('lights-on');
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `<button onclick="openMemoirs('${name}')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:10px; width:100%;">[ VIEW_${name}_MEMOIRS ]</button>`;
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => `<div class="folder-box"><div class="folder-main"></div><div style="font-size:9px;">#${v.vAgentID}</div></div>`).join('');
        }, 800);
    };

    window.flipPage = (forward) => {
        const p1 = document.getElementById('p1');
        const p2 = document.getElementById('p2');
        if (forward) {
            p1.classList.add('flipped');
            p2.style.display = 'flex';
        } else {
            p1.classList.remove('flipped');
            setTimeout(() => { p2.style.display = 'none'; }, 600);
        }
    };

    window.openMemoirs = (mode) => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        flipPage(false);

        const filtered = (mode === 'ALL') ? allMissions : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);
        const valid = filtered.filter(m => (m.totalExpenses || 0) > 0);

        const withV = valid.filter(m => m.vAgentID).sort((a,b) => b.id.localeCompare(a.id));
        const withoutV = valid.filter(m => !m.vAgentID).sort((a,b) => b.totalExpenses - a.totalExpenses);

        let p1HTML = "", p2HTML = "", vSub = 0, uSub = 0, grand = 0;
        const getRow = (m, isV) => `
            <div class="expense-row">
                <span><b>${isV ? '#vAgent '+m.vAgentID : 'AGENT: '+m.agent}</b><br><i style="font-size:8px;">REF: ${m.id.substring(0,8)}</i></span>
                <b>₱${m.totalExpenses.toLocaleString()}</b>
            </div>`;

        // Process vAgents
        withV.forEach((m, i) => {
            vSub += m.totalExpenses; grand += m.totalExpenses;
            if (i < 10) p1HTML += getRow(m, true); else p2HTML += getRow(m, true);
        });
        if (withV.length > 0) {
            const vSHTML = `<div style="text-align:right; font-weight:bold; font-size:10px; margin-bottom:10px;">vAGENT_SUBTOTAL: ₱${vSub.toLocaleString()}</div>`;
            if (withV.length <= 10) p1HTML += vSHTML; else p2HTML += vSHTML;
        }

        // Process Unassigned
        if (withoutV.length > 0) {
            const sep = `<div class="audit-separator">--- UNASSIGNED_LOGS ---</div>`;
            if (withV.length < 10) p1HTML += sep; else p2HTML += sep;
            withoutV.forEach((m, i) => {
                uSub += m.totalExpenses; grand += m.totalExpenses;
                if ((withV.length + i) < 10) p1HTML += getRow(m, false); else p2HTML += getRow(m, false);
            });
            const uSHTML = `<div style="text-align:right; font-weight:bold; font-size:10px; color:#8b0000;">UNASSIGNED_SUBTOTAL: ₱${uSub.toLocaleString()}</div>`;
            if ((withV.length + withoutV.length) <= 10) p1HTML += uSHTML; else p2HTML += uSHTML;
        }

        document.getElementById('active-list').innerHTML = p1HTML || "NO_RECORDS";
        document.getElementById('overflow-list').innerHTML = p2HTML || "NO_OVERFLOW";
        document.getElementById('total-val-p1').innerText = `₱ ${grand.toLocaleString()}`;
        document.getElementById('total-val-p2').innerText = `₱ ${grand.toLocaleString()}`;
        document.getElementById('target-name').innerText = mode;

        document.getElementById('flipNextBtn').style.display = p2HTML ? "block" : "none";
        document.getElementById('p1-total-box').style.display = p2HTML ? "none" : "block";
    };
</script>
</body>
</html>
