<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA INTELLIGENCE UNIT - ENCRYPTED</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(18, 18, 24, 0.95);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --text-dim: #626a77;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--accent-cyan); font-size: 11px;
            letter-spacing: 2px; color: var(--accent-cyan);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 15px; padding: 15px; flex-grow: 1;
        }

        .panel {
            background: var(--panel-bg); border: 1px solid var(--border);
            display: flex; flex-direction: column; border-radius: 4px;
            overflow: hidden;
        }

        .panel-header {
            padding: 8px 12px; font-size: 10px; font-weight: 800;
            background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* --- PORTAL 1: BOUNTY --- */
        .bounty-list { flex-grow: 1; padding: 15px; font-size: 11px; overflow-y: auto; }
        .bounty-card { border-left: 2px solid var(--accent-cyan); padding: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.02); }
        .add-bounty-btn { background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 10px; margin: 10px; cursor: pointer; font-family: inherit; font-weight: 800; }
        
        /* --- MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: #0f1117; border: 2px solid var(--accent-cyan); width: 320px; padding: 20px; }
        .modal-step { display: none; flex-direction: column; gap: 10px; }
        .active-step { display: flex; }
        .option-btn { background: #1a1d26; border: 1px solid #333; color: #fff; padding: 10px; cursor: pointer; text-align: left; font-family: inherit; }

        /* --- PORTAL 2: CHAT --- */
        .chat-area { flex-grow: 1; overflow-y: auto; padding: 15px; font-size: 12px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 4px; word-wrap: break-word; }
        .chat-img { max-width: 100%; border-radius: 4px; margin-top: 5px; border: 1px solid #333; }
        .chat-input-row { padding: 10px; background: #000; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); }
        .input-controls { display: flex; gap: 8px; }
        .upload-btn { background: #222; border: 1px solid #444; color: white; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .preview-text { font-size: 9px; color: var(--accent-cyan); display: none; }

        /* --- PORTAL 3: BAN PROTOCOL --- */
        .ban-container { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex-grow:1;}
        .secret-trigger { font-size: 10px; color: var(--accent-cyan); cursor: pointer; }
        input[type="text"], input[type="number"], textarea {
            background: #000; border: 1px solid #333; color: var(--accent-cyan);
            padding: 12px; font-family: inherit; width: 100%; outline: none; border-radius: 4px;
        }
        textarea { height: 100px; resize: none; }
        .execute-btn { background: var(--danger-red); color: white; border: none; padding: 15px; font-family: inherit; font-weight: 800; cursor: pointer; border-radius: 4px; }
        .terminal-log { flex-grow: 1; background: rgba(0,0,0,0.6); padding: 15px; font-size: 11px; overflow-y: auto; color: #88ff88; border: 1px solid rgba(255,255,255,0.05); }

        .hidden { display: none !important; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        .found { color: var(--danger-red); font-weight: bold; }
        .clear { color: #00ff00; }
    </style>
</head>
<body onload="initializeData()">

    <nav class="status-header">
        <div>OP_ID: <span style="color:white">098-GHOST</span></div>
        <div class="blink">● ENCRYPTED LINK</div>
        <div id="clock">00:00:00</div>
    </nav>

    <div class="dashboard">
        
        <div class="panel">
            <div class="panel-header">BOUNTY_REPORTS</div>
            <div class="bounty-list" id="bountyDisplay"></div>
            <button class="add-bounty-btn" onclick="openBountyModal()">+ ADD TARGET</button>
        </div>

        <div class="panel">
            <div class="panel-header">CLASSIFIED_COMMS</div>
            <div class="chat-area" id="chatFeed"></div>
            
            <div class="chat-input-row">
                <div id="photoStatus" class="preview-text">Attachment Loaded: [Image]</div>
                <div class="input-controls">
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="attachPhoto(this)">
                    <button class="upload-btn" onclick="document.getElementById('photoInput').click()">📷</button>
                    <input type="text" id="chatInput" placeholder="Enter message..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:var(--accent-cyan); border:none; padding:8px 15px; font-weight:800; cursor:pointer;">SEND</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span onclick="toggleBulkMode()" class="secret-trigger">TERMINATION_PROTOCOL (SWAP)</span>
                <span id="modeStatus" style="font-size: 9px; color: var(--text-dim);">MODE: SINGLE</span>
            </div>
            
            <div class="ban-container">
                <label style="font-size: 10px; color: var(--accent-cyan); letter-spacing: 1px;">SECRET CODES IDENTIFICATION</label>
                <input type="text" id="singleCode" placeholder="Type to search database..." oninput="autoSearch(this.value)">
                <textarea id="bulkCodes" class="hidden" placeholder="Paste multiple codes here..."></textarea>
                <button class="execute-btn" onclick="processBan()">EXECUTE BLACKLIST</button>
                <div class="terminal-log" id="banLog">> System Standby...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bountyModal">
        <div class="modal-box">
            <div id="step1" class="modal-step active-step">
                <p style="font-size:11px; color:var(--accent-cyan)">SELECT AGENT:</p>
                <button class="option-btn" onclick="selectAgent('LZ')">Agent LZ</button>
                <button class="option-btn" onclick="selectAgent('JFSN')">Agent JFSN</button>
                <button onclick="closeModal()" style="background:none; border:none; color:grey; cursor:pointer; margin-top:10px;">CANCEL</button>
            </div>
            <div id="step2" class="modal-step">
                <p style="font-size:11px; color:var(--accent-cyan)">SELECT WEAPON:</p>
                <div id="weaponOptions" style="display:flex; flex-direction:column; gap:5px;"></div>
            </div>
            <div id="step3" class="modal-step">
                <p style="font-size:11px; color:var(--accent-cyan)">TARGET DATA:</p>
                <input type="number" id="vID" placeholder="V-Agent Number">
                <input type="number" id="bAmount" placeholder="Bounty Amount">
                <button class="execute-btn" style="background:var(--accent-cyan); color:#000;" onclick="saveBounty()">DEPLOY</button>
            </div>
        </div>
    </div>

    <script>
        // --- GLOBAL INITIALIZATION (PERSISTENT DATA) ---
        let chatDB = [];
        let bountyDB = [];
        const bannedDatabase = ["12345", "ABCDE", "ADMIN-99", "GHOST-OPS"];

        function initializeData() {
            // Load Chats
            const savedChats = localStorage.getItem('cia_chats');
            if (savedChats) { chatDB = JSON.parse(savedChats); renderChats(); }
            
            // Load Bounties
            const savedBounties = localStorage.getItem('cia_bounties');
            if (savedBounties) { bountyDB = JSON.parse(savedBounties); renderBounties(); }
        }

        // --- CLASSIFIED COMMS (CHAT & PHOTO UPLOAD) ---
        let pendingPhotoData = null;

        function attachPhoto(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    pendingPhotoData = e.target.result;
                    document.getElementById('photoStatus').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function sendMsg() {
            const textInput = document.getElementById('chatInput');
            const text = textInput.value.trim();
            
            if (text === "" && !pendingPhotoData) return;

            const msgData = {
                text: text,
                photo: pendingPhotoData,
                time: new Date().toLocaleTimeString()
            };

            chatDB.push(msgData);
            localStorage.setItem('cia_chats', JSON.stringify(chatDB));
            
            // Reset inputs
            textInput.value = "";
            pendingPhotoData = null;
            document.getElementById('photoInput').value = "";
            document.getElementById('photoStatus').style.display = 'none';
            
            renderChats();
        }

        function renderChats() {
            const feed = document.getElementById('chatFeed');
            feed.innerHTML = chatDB.map(msg => `
                <div class="chat-msg">
                    <span style="color:var(--accent-cyan); font-weight:bold;">[OP_GHOST]:</span> ${msg.text}
                    ${msg.photo ? `<br><img src="${msg.photo}" class="chat-img">` : ''}
                    <div style="font-size:8px; color:#555; text-align:right; margin-top:3px;">${msg.time}</div>
                </div>
            `).join('');
            feed.scrollTop = feed.scrollHeight;
        }

        // --- BOUNTY PROTOCOL ---
        let tAgent = "", tWeapon = "";
        function openBountyModal() { document.getElementById('bountyModal').style.display = 'flex'; resetModal(); }
        function closeModal() { document.getElementById('bountyModal').style.display = 'none'; }
        function resetModal() { document.getElementById('step1').className='modal-step active-step'; document.getElementById('step2').className='modal-step'; document.getElementById('step3').className='modal-step'; }

        function selectAgent(agent) {
            tAgent = agent;
            document.getElementById('step1').classList.remove('active-step'); document.getElementById('step2').classList.add('active-step');
            const opts = document.getElementById('weaponOptions');
            opts.innerHTML = "";
            let weapons = agent === 'LZ' ? ['R8', 'RM14'] : ['R9', 'TechCP'];
            weapons.forEach(w => opts.innerHTML += `<button class="option-btn" onclick="selectWeapon('${w}')">${w}</button>`);
        }

        function selectWeapon(weapon) {
            tWeapon = weapon;
            document.getElementById('step2').classList.remove('active-step'); document.getElementById('step3').classList.add('active-step');
        }

        function saveBounty() {
            const vid = document.getElementById('vID').value;
            const amt = document.getElementById('bAmount').value;
            if (!vid || !amt) return alert("Missing data");

            bountyDB.push({ agent: tAgent, weapon: tWeapon, vid: vid, amount: amt, time: new Date().toLocaleTimeString() });
            localStorage.setItem('cia_bounties', JSON.stringify(bountyDB));
            
            renderBounties(); closeModal();
            document.getElementById('vID').value = ""; document.getElementById('bAmount').value = "";
        }

        function renderBounties() {
            document.getElementById('bountyDisplay').innerHTML = bountyDB.map(b => `
                <div class="bounty-card">
                    <div style="font-size:9px; color:var(--text-dim)">${b.time}</div>
                    <div style="color:var(--accent-cyan)">AGENT: ${b.agent} | WPN: ${b.weapon}</div>
                    <div>V-ID: ${b.vid} | BOUNTY: ₱${b.amount}</div>
                </div>
            `).join('');
        }

        // --- BAN PROTOCOL ---
        function autoSearch(val) {
            const log = document.getElementById('banLog');
            const query = val.trim().toUpperCase();
            if (!query) return log.innerHTML = `> System Standby...`;
            
            log.innerHTML = `<div>> SEARCHING: <span style="color:white">${query}</span>...</div>`;
            if (bannedDatabase.includes(query)) log.innerHTML += `<div class="found">> WARNING: TARGET BANNED.</div>`;
            else log.innerHTML += `<div class="clear">> STATUS: CLEAR.</div>`;
        }

        let isBulkMode = false;
        function toggleBulkMode() {
            isBulkMode = !isBulkMode;
            document.getElementById('singleCode').classList.toggle('hidden');
            document.getElementById('bulkCodes').classList.toggle('hidden');
            document.getElementById('modeStatus').innerText = isBulkMode ? "MODE: BULK" : "MODE: SINGLE";
        }

        function processBan() {
            const log = document.getElementById('banLog');
            log.innerHTML += `<div class="blink">> EXECUTING...</div>`;
            setTimeout(() => log.innerHTML += `<div style="color:#00ff00">> SUCCESS: DATABASE UPDATED.</div>`, 800);
        }

        // Clock Script
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
