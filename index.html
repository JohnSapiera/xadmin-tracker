<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AGENT ACCESS TERMINAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #01080b;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .terminal {
            width: 100%;
            max-width: 380px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid #00f2ff;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,242,255,0.1);
            position: relative;
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f2ff;
            animation: scanMove 2s ease-in-out infinite;
            opacity: 0.6;
        }
        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .badge {
            font-size: 9px;
            letter-spacing: 3px;
            color: #4a5a61;
        }
        .status {
            font-size: 11px;
            color: #00f2ff;
            margin-top: 8px;
            text-transform: uppercase;
        }
        .device-box {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .device-label {
            font-size: 8px;
            color: #5c7882;
        }
        .device-sig {
            font-size: 9px;
            color: #05ffa1;
            word-break: break-all;
            margin-top: 4px;
        }
        .code-area {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .code-digits {
            font-size: 32px;
            letter-spacing: 10px;
            color: #05ffa1;
            font-weight: bold;
        }
        .helper {
            font-size: 8px;
            color: #5c7882;
            margin-top: 5px;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .key {
            aspect-ratio: 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #00f2ff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.05s linear;
        }
        .key:active {
            background: #00f2ff;
            color: #000;
            transform: scale(0.92);
        }
        .key-zero {
            grid-column: 2 / 3;
        }
        .hidden {
            display: none;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid #1a2f37;
            padding: 10px;
            color: #5c7882;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
        }
        .btn-clear {
            border-color: #ff003c;
            color: #ff003c;
        }
        .message {
            margin-top: 16px;
            padding: 8px;
            text-align: center;
            font-size: 10px;
            border-radius: 4px;
        }
        .error {
            color: #ff003c;
            background: rgba(255,0,60,0.1);
        }
        .success {
            color: #00ff66;
            background: rgba(0,255,102,0.1);
        }
        .info {
            color: #00f2ff;
            background: rgba(0,242,255,0.1);
        }
        .agent-name {
            margin-top: 10px;
            padding: 8px;
            background: #000;
            border: 1px solid #00f2ff;
            border-radius: 4px;
            text-align: center;
        }
        .agent-name span {
            color: #00f2ff;
            font-size: 9px;
        }
        .agent-name div {
            color: #05ffa1;
            font-size: 14px;
            font-weight: bold;
            margin-top: 4px;
        }
        .devices {
            margin-top: 10px;
            padding: 8px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 4px;
        }
        .devices span {
            color: #00f2ff;
            font-size: 9px;
        }
        .device-item {
            display: inline-block;
            background: #0a1f29;
            padding: 3px 8px;
            margin: 3px;
            border-radius: 3px;
            color: #05ffa1;
            font-size: 9px;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 8px;
            color: #4a5a61;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="terminal">
    <div class="scan-line"></div>
    
    <div class="header">
        <div class="badge">🔐 AGENT ACCESS TERMINAL</div>
        <div class="status" id="statusLabel">INITIALIZING SCAN</div>
    </div>

    <div class="device-box">
        <div class="device-label">🖨️ DEVICE FINGERPRINT</div>
        <div class="device-sig" id="deviceSig">-- SCANNING --</div>
    </div>

    <div id="keypadSection">
        <div class="code-area">
            <div class="code-digits" id="codeDisplay">────</div>
            <div class="helper">ENTER 4-DIGIT SECRET KEY</div>
        </div>
        
        <div class="keypad" id="keypad"></div>
        
        <div class="action-buttons">
            <div class="btn btn-clear" id="clearBtn">⌫ CLEAR</div>
            <div class="btn" id="cancelBtn">✗ RESET</div>
        </div>
    </div>

    <div id="message" class="message"></div>
    <div id="agentDisplay" class="agent-name hidden">
        <span>👤 CURRENT AGENT</span>
        <div id="agentName"></div>
    </div>
    <div id="devicesDisplay" class="devices hidden">
        <span>📱 REGISTERED DEVICES</span>
        <div id="devicesList"></div>
    </div>

    <div class="footer">
        AUTHORIZED: AGENT_LZ | AGENT_JFSN
    </div>
</div>

<script>
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    let supabase = null;
    let deviceFingerprint = "";
    let enteredCode = "";
    let isProcessing = false;
    
    const statusLabel = document.getElementById('statusLabel');
    const deviceSigSpan = document.getElementById('deviceSig');
    const codeDisplay = document.getElementById('codeDisplay');
    const messageDiv = document.getElementById('message');
    const agentDisplay = document.getElementById('agentDisplay');
    const agentNameSpan = document.getElementById('agentName');
    const devicesDisplay = document.getElementById('devicesDisplay');
    const devicesList = document.getElementById('devicesList');
    
    function showMessage(text, type = 'info') {
        messageDiv.className = `message ${type}`;
        messageDiv.innerHTML = text;
        setTimeout(() => {
            if (messageDiv.innerHTML === text) {
                messageDiv.className = 'message';
                messageDiv.innerHTML = '';
            }
        }, 4000);
    }
    
    function generateFingerprint() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC";
        
        const data = {
            gpu: gpu,
            screen: `${window.screen.width}x${window.screen.height}`,
            platform: navigator.platform
        };
        
        const raw = JSON.stringify(data);
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "SIG-" + Math.abs(hash).toString(16).toUpperCase().slice(0, 12);
    }
    
    function clearCode() {
        enteredCode = "";
        codeDisplay.innerText = "────";
    }
    
    function addDigit(digit) {
        if (enteredCode.length < 4 && !isProcessing) {
            enteredCode += digit;
            let display = enteredCode + "────".substring(enteredCode.length);
            codeDisplay.innerText = display;
            
            if (enteredCode.length === 4) {
                setTimeout(() => verifySecretKey(enteredCode), 100);
            }
        }
    }
    
    async function verifySecretKey(secretKey) {
        if (isProcessing) return;
        isProcessing = true;
        
        statusLabel.innerHTML = "VERIFYING KEY";
        showMessage(`Verifying secret key: ${secretKey}...`, 'info');
        
        try {
            const { data: agent, error } = await supabase
                .from('agents')
                .select('agent_name, secret_key, brand_name, weapon_system')
                .eq('secret_key', secretKey)
                .maybeSingle();
            
            if (error) {
                showMessage(`Database error: ${error.message}`, 'error');
                statusLabel.innerHTML = "ERROR";
                clearCode();
                isProcessing = false;
                return;
            }
            
            if (!agent) {
                showMessage(`Invalid secret key: ${secretKey}. Access denied.`, 'error');
                statusLabel.innerHTML = "ACCESS DENIED";
                clearCode();
                isProcessing = false;
                return;
            }
            
            const agentName = agent.agent_name;
            const devices = agent.weapon_system || [];
            
            showMessage(`✅ ACCESS GRANTED! Welcome, ${agentName}`, 'success');
            statusLabel.innerHTML = "ACCESS GRANTED";
            
            agentNameSpan.innerText = agentName;
            agentDisplay.classList.remove('hidden');
            
            if (devices.length > 0) {
                devicesList.innerHTML = devices.map(d => `<div class="device-item">📱 ${d}</div>`).join('');
                devicesDisplay.classList.remove('hidden');
            }
            
            localStorage.setItem("agent_name", agentName);
            localStorage.setItem("secret_key", secretKey);
            localStorage.setItem("device_fingerprint", deviceFingerprint);
            localStorage.setItem("devices", JSON.stringify(devices));
            
            console.log("STORED IN LOCALSTORAGE:");
            console.log("  agent_name:", agentName);
            console.log("  secret_key:", secretKey);
            console.log("  device_fingerprint:", deviceFingerprint);
            console.log("  devices:", devices);
            
            isProcessing = false;
            
        } catch (err) {
            showMessage(`Error: ${err.message}`, 'error');
            statusLabel.innerHTML = "ERROR";
            clearCode();
            isProcessing = false;
        }
    }
    
    function buildKeypad() {
        const keypadContainer = document.getElementById('keypad');
        const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        keypadContainer.innerHTML = '';
        
        keys.forEach(key => {
            const btn = document.createElement('div');
            btn.className = 'key';
            if (key === '0') btn.classList.add('key-zero');
            btn.innerText = key;
            btn.onclick = () => addDigit(key);
            keypadContainer.appendChild(btn);
        });
    }
    
    document.getElementById('clearBtn').onclick = () => clearCode();
    document.getElementById('cancelBtn').onclick = () => {
        clearCode();
        showMessage("Reset. Enter your 4-digit key.", 'info');
        statusLabel.innerHTML = "ENTER KEY";
    };
    
    async function init() {
        buildKeypad();
        
        deviceFingerprint = generateFingerprint();
        deviceSigSpan.innerText = deviceFingerprint;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { error } = await supabase.from('agents').select('count', { count: 'exact', head: true });
            if (error) {
                showMessage(`Connection issue: ${error.message}`, 'error');
                statusLabel.innerHTML = "CONNECTION ERROR";
            } else {
                showMessage("Connected to Supabase. Enter your 4-digit key.", 'info');
                statusLabel.innerHTML = "READY";
            }
        } catch (err) {
            showMessage(`Init error: ${err.message}`, 'error');
            statusLabel.innerHTML = "ERROR";
        }
        
        const savedAgent = localStorage.getItem("agent_name");
        if (savedAgent) {
            agentNameSpan.innerText = savedAgent;
            agentDisplay.classList.remove('hidden');
            const savedDevices = localStorage.getItem("devices");
            if (savedDevices) {
                const devices = JSON.parse(savedDevices);
                if (devices.length > 0) {
                    devicesList.innerHTML = devices.map(d => `<div class="device-item">📱 ${d}</div>`).join('');
                    devicesDisplay.classList.remove('hidden');
                }
            }
        }
    }
    
    init();
</script>
</body>
</html>
