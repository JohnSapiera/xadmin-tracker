<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_REGISTRY // DOSSIER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon: #00f3ff; --bg: #030a0d; --red: #ff003c; 
            --folder-tan: #bba982; --folder-dark: #8b7d60;
            --border: rgba(0, 243, 255, 0.2);
            --font-mono: 'Share Tech Mono', monospace;
            --font-main: 'Rajdhani', sans-serif;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); color: #e1f5f9; font-family: var(--font-mono); 
            overflow-x: hidden; padding: 15px; padding-bottom: 80px;
            background-image: radial-gradient(circle at top, rgba(0, 243, 255, 0.05), transparent 60%), linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 100%, 100% 4px;
        }

        .container { max-width: 500px; margin: 0 auto; }

        /* Tactical Header */
        .header { 
            border: 1px solid var(--border); border-left: 5px solid var(--neon); 
            padding: 15px; margin-bottom: 15px; background: rgba(5, 15, 20, 0.85); 
            backdrop-filter: blur(5px);
        }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .btn-memoir {
            background: var(--neon); color: #000; border: none; padding: 8px 15px;
            font-family: var(--font-main); font-size: 14px; font-weight: bold; 
            cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        #agentName { font-family: var(--font-main); font-size: 26px; font-weight: 700; color: #fff; text-transform: uppercase; }
        #brandTag { font-size: 10px; color: var(--neon); font-weight: bold; letter-spacing: 1px; }

        .status-bar { font-size: 9px; color: #5c7882; margin: 10px 0; border-top: 1px solid var(--border); padding-top: 5px; display: flex; justify-content: space-between; }

        /* Device Grid */
        .device-card {
            background: rgba(0,0,0,0.6); border: 1px solid #1a2f37; padding: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; border-radius: 2px; transition: 0.2s;
        }
        .device-card:active { background: rgba(0, 243, 255, 0.1); border-color: var(--neon); }
        .device-label { font-family: var(--font-main); font-size: 18px; font-weight: 700; color: #fff; }

        /* File Grid */
        .folder-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 10px; }
        .file-item { position: relative; cursor: pointer; text-align: center; }
        .file-folder { 
            height: 80px; background: var(--folder-tan); border-radius: 0 4px 2px 2px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; z-index: 2; border-bottom: 3px solid var(--folder-dark);
        }
        .file-folder::before {
            content: ""; position: absolute; top: -7px; left: 0; width: 25px; height: 8px;
            background: var(--folder-tan); border-radius: 2px 2px 0 0;
        }
        .file-id { font-size: 11px; color: #000; font-weight: 900; font-family: var(--font-main); }

        /* Overlay */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .paper {
            width: 300px; background: #e8e0cc; padding: 25px; color: #222; transform: rotate(-1deg);
            box-shadow: 5px 5px 20px rgba(0,0,0,0.5); font-family: serif;
        }

        /* Navigation Fix */
        nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; z-index: 900; }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #444; font-family: var(--font-mono); text-decoration: none; font-size: 10px; }
        .nav-link.active { color: var(--neon); border-top: 2px solid var(--neon); background: rgba(0,243,255,0.05); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-top">
                <div>
                    <h2 id="agentName">LOADING...</h2>
                    <div id="brandTag">INITIALIZING_SESSION</div>
                </div>
                <button class="btn-memoir" onclick="openMemoir()">MEMOIR</button>
            </div>
            <div class="status-bar">
                <span id="currentDate">--/--/----</span>
                <span id="sigDisplay" style="color:var(--neon)">SIG: PENDING</span>
                <span id="totalExpenses" style="color:var(--red)">₱ 0.00</span>
            </div>
        </div>

        <div id="terminal" style="font-size:10px; color:#5c7882; margin-bottom:15px; font-family: var(--font-mono);">>> BOOTING_SECURE_CORE...</div>

        <div id="deviceGrid"></div>
        
        <div class="folder-grid" id="mainFileGrid"></div>
        <button id="btnBack" style="display:none; width: 100%; margin-top:20px; background:none; border:1px solid var(--neon); color:var(--neon); padding:12px; cursor:pointer; font-family: var(--font-mono); font-size: 11px;" onclick="showDevices()">< RETURN_TO_NODES</button>
    </div>

    <div id="memoirOverlay" class="overlay">
        <div class="paper">
            <h3 style="border-bottom:2px solid #333; margin-bottom:10px; font-family: var(--font-main); font-weight: 800;">MISSION_DOSSIER</h3>
            <div style="line-height: 1.6;">
                <p style="font-size:12px;"><strong>REF_ID:</strong> <span id="m-order">---</span></p>
                <p style="font-size:12px;"><strong>NODE:</strong> <span id="m-weapon">---</span></p>
                <p style="font-size:12px;"><strong>V_ID:</strong> <span id="m-vagent">---</span></p>
                <p style="font-size:12px;"><strong>STAMP:</strong> <span id="m-date">---</span></p>
                <h2 id="m-expenses" style="color:#8b0000; margin-top:15px; font-family: var(--font-main);">₱ 0.00</h2>
            </div>
            <div style="margin-top:25px; display:flex; justify-content:space-between;">
                <button onclick="closeMemoir()" style="padding:8px 15px; cursor:pointer; border:1px solid #333; background: none;">CLOSE</button>
                <button onclick="nextMemoir()" style="padding:8px 20px; cursor:pointer; background:#333; color:#fff; border:none;">NEXT_FILE</button>
            </div>
        </div>
    </div>

    <nav>
        <a href="dashboard.html" class="nav-link">DASHBOARD</a>
        <a href="intel.html" class="nav-link">INTEL</a>
        <a href="#" class="nav-link active">PROFILE</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let deviceDataMap = {}; 
        let allMissions = [];
        let currentIdx = 0;

        function generateSignature() {
            const raw = navigator.userAgent + screen.width + (navigator.hardwareConcurrency || "8");
            let hash = 0;
            for (let i = 0; i < raw.length; i++) hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            return "SIG-" + Math.abs(hash).toString(16).toUpperCase();
        }

        async function syncProfile() {
            const signature = generateSignature();
            const localAgent = localStorage.getItem("cia_agent"); // Same implementation as intel.html
            
            document.getElementById('sigDisplay').innerText = "SIG: " + signature;
            document.getElementById('currentDate').innerText = new Date().toLocaleDateString();

            if (!localAgent) {
                document.getElementById('terminal').innerText = ">> ERR: NO_SESSION_FOUND. RELOGIN.";
                setTimeout(() => window.location.href = "index.html", 2000);
                return;
            }

            try {
                // Fetch agent data using the logged-in name
                const q = query(collection(db, "agents"), where("agentName", "==", localAgent));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    const agentDoc = snap.docs[0];
                    const agentData = agentDoc.data();

                    // Sync signature if missing
                    if (!agentData.deviceSignature) {
                        await updateDoc(doc(db, "agents", agentDoc.id), { deviceSignature: signature });
                    }

                    document.getElementById('agentName').innerText = "AGENT_" + agentData.agentName;
                    document.getElementById('brandTag').innerText = "ID: " + (agentData.brandName || "UNASSIGNED").toUpperCase();
                    document.getElementById('terminal').innerText = ">> UPLINK_STABLE. ACCESS_GRANTED.";

                    loadMissions(agentData.agentName);
                } else {
                    document.getElementById('agentName').innerText = "INVALID_AGENT";
                    document.getElementById('terminal').innerText = ">> ERR: AGENT_RECORD_NOT_FOUND.";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('terminal').innerText = ">> ERR: DATABASE_CONNECTION_TIMEOUT.";
            }
        }

        async function loadMissions(agentName) {
            const q = query(collection(db, "mission_orders"), where("agentName", "==", agentName));
            const snap = await getDocs(q);
            let total = 0;

            // Reset data containers
            allMissions = [];
            deviceDataMap = {};

            snap.forEach(d => {
                const data = d.data();
                allMissions.push(data);
                const weapon = data.weaponSystem || "UNKNOWN_NODE";
                
                if(!deviceDataMap[weapon]) deviceDataMap[weapon] = [];
                deviceDataMap[weapon].push(data);
                
                total += parseFloat(data.expenses || 0);
            });

            document.getElementById('totalExpenses').innerText = `₱ ${total.toLocaleString()}`;
            renderDevices();
        }

        function renderDevices() {
            const grid = document.getElementById('deviceGrid');
            const keys = Object.keys(deviceDataMap);

            if (keys.length === 0) {
                grid.innerHTML = "<div style='text-align:center; padding:20px; color:#5c7882;'>NO_NODES_FOUND</div>";
                return;
            }

            grid.innerHTML = keys.map(name => `
                <div class="device-card" onclick="openDevice('${name}')">
                    <div class="device-label">${name}</div>
                    <div style="color:var(--neon); font-size:10px;">${deviceDataMap[name].length} LOGS</div>
                </div>
            `).join('');
        }

        window.openDevice = (name) => {
            document.getElementById('deviceGrid').style.display = 'none';
            document.getElementById('mainFileGrid').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            
            const fGrid = document.getElementById('mainFileGrid');
            fGrid.innerHTML = deviceDataMap[name].map(d => `
                <div class="file-item" onclick="viewSpecificMission('${d.vAgentID}')">
                    <div class="file-folder">
                        <span class="file-id">#${d.vAgentID || '??'}</span>
                        <span style="font-size:7px; color:#000; margin-top:5px;">EXP: ₱${d.expenses || 0}</span>
                    </div>
                </div>
            `).join('');
        };

        window.viewSpecificMission = (vID) => {
            const mission = allMissions.find(m => m.vAgentID == vID);
            if (mission) {
                const idx = allMissions.indexOf(mission);
                currentIdx = idx;
                openMemoir();
            }
        };

        window.showDevices = () => {
            document.getElementById('deviceGrid').style.display = 'block';
            document.getElementById('mainFileGrid').style.display = 'none';
            document.getElementById('btnBack').style.display = 'none';
        };

        window.openMemoir = () => {
            if (allMissions.length === 0) return alert("NO_DATA_AVAILABLE");
            updateMemoir();
            document.getElementById('memoirOverlay').style.display = 'flex';
        };

        window.closeMemoir = () => document.getElementById('memoirOverlay').style.display = 'none';

        window.nextMemoir = () => {
            currentIdx = (currentIdx + 1) % allMissions.length;
            updateMemoir();
        };

        function updateMemoir() {
            const d = allMissions[currentIdx];
            document.getElementById('m-order').innerText = d.orderNumber || "---";
            document.getElementById('m-weapon').innerText = d.weaponSystem || "---";
            document.getElementById('m-vagent').innerText = d.vAgentID || "---";
            document.getElementById('m-date').innerText = d.penalizeDate || d.lastUpdate || "---";
            document.getElementById('m-expenses').innerText = "₱ " + parseFloat(d.expenses || 0).toLocaleString();
        }

        window.onload = syncProfile;
    </script>
</body>
</html>
