<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>AGENCY_INTEL_SYSTEM_v9.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #000508; 
      --panel: rgba(2, 12, 18, 0.98); 
      --cyan: #00f3ff; 
      --red: #ff003c; 
      --green: #00ff66; 
      --border: rgba(0, 243, 255, 0.2); 
      --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    @keyframes pulse-border { 0% { border-color: var(--border); } 50% { border-color: var(--cyan); } 100% { border-color: var(--border); } }
    @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    body { 
        background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; 
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    }

    header { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; background: #000; }

    .agent-welcome {
        font-family: var(--mono); color: var(--cyan); font-size: 13px;
        letter-spacing: 2px; text-transform: uppercase;
    }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

    .intel-greet {
        text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 30px;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    /* Report Trigger Button */
    .report-btn {
        background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
        padding: 20px 50px; font-family: var(--mono); font-size: 16px;
        cursor: pointer; transition: 0.3s; animation: pulse-border 2s infinite;
    }
    .report-btn.locked { opacity: 0.2; cursor: not-allowed; border-color: #333; color: #333; animation: none; }

    /* Modal Styling */
    .modal-overlay { 
        display: none; position: fixed; inset: 0; background: var(--bg); 
        z-index: 1000; flex-direction: column; padding: 20px;
        animation: slide-up 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .close-x { font-size: 24px; color: var(--red); cursor: pointer; font-family: var(--mono); padding: 5px 15px; }

    /* Device Selector */
    .device-section { text-align: center; margin-bottom: 20px; }
    .section-title { font-family: var(--mono); font-size: 10px; color: var(--cyan); margin-bottom: 10px; letter-spacing: 2px; }
    
    .device-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .dev-btn {
        background: #051218; border: 1px solid var(--border); color: #4a5a61;
        padding: 10px 12px; font-family: var(--mono); font-size: 10px;
        cursor: pointer; transition: 0.3s;
    }
    .dev-btn.selected { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 15px var(--cyan); transform: scale(1.05); }
    .dev-btn.disabled { opacity: 0.1; filter: grayscale(1); pointer-events: none; }

    /* Form Styling */
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; font-family: var(--mono); font-size: 10px; color: var(--cyan); margin-bottom: 5px; }
    .intel-input {
        width: 100%; background: rgba(0,243,255,0.05); border: 1px solid #1a262b;
        padding: 12px; color: #fff; font-family: var(--mono); outline: none;
    }
    .intel-input:focus { border-color: var(--cyan); }
    .va-notice { font-size: 10px; font-family: var(--mono); margin-top: 5px; color: var(--red); }

    .upload-area {
        border: 1px dashed #222; padding: 20px; text-align: center;
        font-family: var(--mono); font-size: 11px; color: #444; margin: 20px 0;
    }

    .send-btn {
        width: 100%; padding: 20px; background: var(--green); color: #000;
        border: none; font-family: var(--mono); font-weight: bold;
        letter-spacing: 4px; cursor: pointer;
    }

    nav { 
        position: fixed; bottom: 0; width: 100%; height: 70px; 
        background: #000; border-top: 1px solid var(--border); 
        display: grid; grid-template-columns: 1fr 1fr;
    }
    .nav-link { 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #333; font-size: 10px; font-family: var(--mono); text-decoration: none;
    }
    .nav-link.active { color: var(--cyan); }
  </style>
</head>
<body>

<header>
    <div class="agent-welcome" id="agent-display">TRACE_INITIALIZING...</div>
</header>

<main>
    <div class="intel-greet" id="intel-msg">AWAITING_IDENTITY_TRACE...</div>
    <button id="main-report-btn" class="report-btn locked" onclick="openReport()" disabled>INITIATE REPORT</button>
</main>

<div id="report-modal" class="modal-overlay">
    <div class="modal-header">
        <span class="agent-welcome">INTEL_ENTRY_FORM</span>
        <span class="close-x" onclick="closeReport()">X</span>
    </div>

    <div class="device-section">
        <div class="section-title">SELECT_TARGET_NODE</div>
        <div id="device-container" class="device-grid"></div>
    </div>

    <div class="form-group">
        <label class="form-label">V-AGENT_IDENTIFIER:</label>
        <input type="tel" id="vagent-num" class="intel-input" placeholder="00000">
        <div id="va-status" class="va-notice"></div>
    </div>

    <div class="form-group">
        <label class="form-label">EXPENSES_CLAIM (PHP):</label>
        <input type="number" id="expenses-val" class="intel-input" placeholder="0.00">
    </div>

    <div class="upload-area" onclick="document.getElementById('photo-up').click()">
        <input type="file" id="photo-up" hidden>
        [ UPLOAD_INTEL_PHOTO ]
    </div>

    <button id="send-btn" class="send-btn">SEND_INTEL_DATA</button>
</div>

<nav>
  <a href="dashboard.html" class="nav-link"><span>◈</span>DASHBOARD</a>
  <a href="#" class="nav-link active"><span>◰</span>INTEL</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, updateDoc, doc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:baab5171d8e0a58acd442e",
    measurementId: "G-150YYLS5FP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const deviceUUID = localStorage.getItem("device_uuid");
  const mainReportBtn = document.getElementById('main-report-btn');
  let activeAgent = null;
  let selectedDevice = null;

  // 1. SILENT IDENTITY TRACE (From 'agents' collection)
  async function silentTrace() {
    if(!deviceUUID) {
        document.getElementById('agent-display').textContent = "NODE_UNRECOGNIZED";
        return;
    }

    try {
        const q = query(collection(db, "agents"), where("linkedDevice", "==", deviceUUID));
        const snap = await getDocs(q);

        if(!snap.empty) {
            activeAgent = snap.docs[0].data().agentName;
            document.getElementById('agent-display').textContent = `AGENT_VERIFIED: ${activeAgent}`;
            document.getElementById('intel-msg').innerHTML = `Hello Agent ${activeAgent}!<br><span style="font-size:12px; color:#555;">What is your INTEL INFO Today?</span>`;
            
            mainReportBtn.classList.remove('locked');
            mainReportBtn.disabled = false;
            loadAgentDevices(activeAgent);
        } else {
            document.getElementById('agent-display').textContent = "UNAUTHORIZED_NODE";
            document.getElementById('intel-msg').innerHTML = "SYSTEM_LOCKED<br><span style='font-size:10px; color:var(--red)'>INITIALIZE DEVICE VIA LOGIN</span>";
        }
    } catch (e) { document.getElementById('agent-display').textContent = "SYSTEM_OFFLINE"; }
  }

  // 2. LOAD DEVICES
  async function loadAgentDevices(name) {
    const q = query(collection(db, "mission_orders"), where("agentName", "==", name));
    const snap = await getDocs(q);
    const container = document.getElementById('device-container');
    container.innerHTML = "";

    let devices = [...new Set(snap.docs.map(d => d.data().linkedDevice))];
    if(!devices.includes(deviceUUID)) devices.push(deviceUUID);

    devices.forEach(dev => {
        const btn = document.createElement('button');
        btn.className = 'dev-btn';
        btn.textContent = dev;
        if(dev === deviceUUID) btn.style.borderStyle = "dashed";
        btn.onclick = () => {
            document.querySelectorAll('.dev-btn').forEach(b => { b.classList.add('disabled'); b.classList.remove('selected'); });
            btn.classList.remove('disabled'); btn.classList.add('selected');
            selectedDevice = dev;
            checkVAgent();
        };
        btn.ondblclick = () => {
            document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('disabled', 'selected'));
            selectedDevice = null;
        };
        container.appendChild(btn);
    });
  }

  // 3. VAGENT LOGIC
  async function checkVAgent() {
    const va = document.getElementById('vagent-num').value.trim();
    if(!va || !selectedDevice) return;
    const q = query(collection(db, "mission_orders"), where("vAgent", "==", va), where("linkedDevice", "==", selectedDevice));
    const snap = await getDocs(q);
    document.getElementById('va-status').textContent = snap.empty ? "NOTICE: NO DESIGNATED V-AGENT IN NODE" : "";
  }
  document.getElementById('vagent-num').addEventListener('input', checkVAgent);

  // 4. SEND REPORT
  document.getElementById('send-btn').onclick = async () => {
    const va = document.getElementById('vagent-num').value.trim();
    const exp = document.getElementById('expenses-val').value;
    if(!selectedDevice || !va) return alert("COMPLETE ALL INTEL FIELDS");

    const btn = document.getElementById('send-btn');
    btn.disabled = true; btn.innerText = "TRANSMITTING...";

    try {
        // Update mission_orders expenses
        const q = query(collection(db, "mission_orders"), where("vAgent", "==", va));
        const snap = await getDocs(q);
        if(!snap.empty) {
            const current = Number(snap.docs[0].data().expenses || 0);
            await updateDoc(doc(db, "mission_orders", snap.docs[0].id), { expenses: current + Number(exp) });
        }
        // Save to ExpensesReport
        await addDoc(collection(db, "ExpensesReport"), {
            deviceName: selectedDevice, vAgentNum: va, expensesAmount: exp,
            agentName: activeAgent, timestamp: serverTimestamp()
        });
        alert("INTEL_REPORT_SENT"); location.reload();
    } catch (e) { alert("ERROR: " + e.message); btn.disabled = false; }
  };

  window.openReport = () => document.getElementById('report-modal').style.display = 'flex';
  window.closeReport = () => document.getElementById('report-modal').style.display = 'none';
  silentTrace();
</script>
</body>
</html>
