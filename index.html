<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <style>
        body { background: #01080b; color: #00f3ff; font-family: monospace; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #00f3ff; color: #05ffa1; font-family: monospace; }
        button { background: #00f3ff; color: #000; cursor: pointer; font-weight: bold; }
        .debug { background: #051014; padding: 15px; margin-top: 20px; font-size: 11px; border: 1px solid #1a2f37; white-space: pre-wrap; word-break: break-all; }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Firebase Auth Test</h2>
        <input type="text" id="secretInput" placeholder="Enter secret key (ex: 1234)">
        <button id="testBtn">TEST CONNECTION</button>
        <div id="result" class="debug">Ready...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const resultDiv = document.getElementById('result');

        async function testAll() {
            resultDiv.innerHTML = '⏳ Testing connection...\n';
            
            try {
                // 1. Test connection
                resultDiv.innerHTML += '✅ Firebase connected\n';
                
                // 2. List all collections (optional, limited)
                resultDiv.innerHTML += '📡 Checking "agent" collection...\n';
                
                // Get all documents from "agent" collection
                const snapshot = await db.collection("agent").get();
                
                if (snapshot.empty) {
                    resultDiv.innerHTML += '❌ "agent" collection is EMPTY!\n';
                    resultDiv.innerHTML += '💡 Create a document first using update_db.html\n';
                } else {
                    resultDiv.innerHTML += `✅ Found ${snapshot.size} document(s) in "agent" collection:\n`;
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        resultDiv.innerHTML += `\n📄 Document ID: ${doc.id}\n`;
                        resultDiv.innerHTML += `   Fields: ${Object.keys(data).join(', ')}\n`;
                        resultDiv.innerHTML += `   Data: ${JSON.stringify(data, null, 2)}\n`;
                    });
                }
                
                // 3. Test secret key if provided
                const secretKey = document.getElementById('secretInput').value.trim();
                if (secretKey) {
                    resultDiv.innerHTML += `\n🔍 Searching for secretKey = "${secretKey}"...\n`;
                    const querySnap = await db.collection("agent").where("secretKey", "==", secretKey).get();
                    
                    if (querySnap.empty) {
                        resultDiv.innerHTML += `❌ No document found with secretKey = "${secretKey}"\n`;
                        resultDiv.innerHTML += `💡 Check: Are you using the correct secretKey?\n`;
                        resultDiv.innerHTML += `💡 Check: Is the field name "secretKey" (case-sensitive)?\n`;
                    } else {
                        resultDiv.innerHTML += `✅ Found ${querySnap.size} document(s)!\n`;
                        querySnap.forEach(doc => {
                            const data = doc.data();
                            resultDiv.innerHTML += `   - Agent: ${data.agentName || doc.id}\n`;
                            resultDiv.innerHTML += `   - secretKey: ${data.secretKey}\n`;
                        });
                        resultDiv.innerHTML += `\n🎉 AUTHENTICATION SUCCESSFUL! You can now login.\n`;
                    }
                }
                
            } catch (error) {
                resultDiv.innerHTML += `❌ ERROR: ${error.message}\n`;
                console.error(error);
            }
        }

        document.getElementById('testBtn').onclick = testAll;
        
        // Auto-run on load
        setTimeout(testAll, 500);
    </script>
</body>
</html>
