<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUREAU_REGISTRY // PROFILE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --red: #ff3c3c; --folder: #333; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; }

        .container { max-width: 600px; margin: 0 auto; }
        .header { border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 30px; }
        
        /* Device Info */
        .device-card { background: #0a0a0c; border: 1px solid #222; padding: 15px; margin-bottom: 20px; }
        .device-label { font-size: 10px; color: #555; }

        /* V-Agents Section */
        .section-title { font-size: 12px; color: var(--neon); margin-bottom: 15px; letter-spacing: 2px; }
        .vagent-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        
        .folder { 
            background: var(--folder); padding: 15px 10px; text-align: center; cursor: not-allowed; 
            opacity: 0.2; transition: 0.3s; position: relative; border-radius: 4px 15px 4px 4px;
        }
        .folder.active { opacity: 1; cursor: pointer; background: #1a1a1a; border: 1px solid var(--neon); }
        .folder.active:hover { box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); transform: translateY(-3px); }
        .folder-num { font-size: 14px; font-weight: 800; display: block; }
        .folder-label { font-size: 8px; color: #555; }

        /* Mission Order Document (CIA Inspired) */
        #missionOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center;
        }
        .classified-doc {
            background: #e2dcc8; color: #1a1a1a; width: 90%; max-width: 450px; padding: 40px;
            position: relative; box-shadow: 10px 10px 0px #000;
            animation: folderOpen 0.5s ease-out;
            background-image: repeating-linear-gradient(#dcd5bc 0px, #dcd5bc 1px, transparent 1px, transparent 25px);
        }
        @keyframes folderOpen { from { transform: scale(0.8) rotate(-2deg); opacity: 0; } to { transform: scale(1) rotate(0deg); opacity: 1; } }

        .doc-header { border-bottom: 2px solid #1a1a1a; margin-bottom: 20px; text-align: center; }
        .doc-header h1 { margin: 0; font-size: 24px; letter-spacing: 5px; }
        .stamp { 
            position: absolute; top: 20px; right: 20px; border: 3px solid var(--red); 
            color: var(--red); padding: 5px; transform: rotate(15deg); font-weight: 800; 
            opacity: 0.8; font-size: 12px;
        }

        .field-group { margin-bottom: 15px; border-bottom: 1px dashed #999; padding-bottom: 5px; }
        .f-label { font-size: 10px; font-weight: bold; color: #666; text-transform: uppercase; }
        .f-value { font-size: 14px; font-family: 'Courier New', Courier, monospace; }

        .expense-box { background: rgba(0,0,0,0.05); padding: 10px; margin-top: 15px; }
        .btn-update { 
            background: #1a1a1a; color: #fff; border: none; padding: 5px 10px; 
            font-size: 10px; cursor: pointer; margin-top: 5px; 
        }

        .close-doc { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); color: #fff; cursor: pointer; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="header">
            <div style="font-size: 10px; color: #555;">REGISTRY_BUREAU // TOP_SECRET</div>
            <h2 id="agentTitle">AGENT_UNKNOWN</h2>
        </div>

        <div class="device-card">
            <div class="device-label">LINKED_DEVICE_SIGNATURE:</div>
            <div id="deviceName" style="color: var(--neon); font-size: 14px;">-- SCANNING --</div>
        </div>

        <div class="section-title">V-AGENTS_SHADOW_FOLDERS</div>
        <div class="vagent-grid" id="vagentGrid">
            <script>
                for(let i=1; i<=8; i++) {
                    document.write(`
                        <div class="folder" id="vagent-${i}" onclick="openMission(${i})">
                            <span class="folder-num">${i}</span>
                            <span class="folder-label">V-AGENT</span>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>

    <div id="missionOverlay">
        <div class="classified-doc">
            <div class="stamp">CLASSIFIED</div>
            <div class="doc-header">
                <h1>MISSION ORDER</h1>
                <div id="moNumber" style="font-size: 12px; font-weight: bold;">#0000</div>
            </div>

            <div class="field-group">
                <div class="f-label">Mission Details</div>
                <div class="f-value" id="moDetails">NO_DATA_FOUND</div>
            </div>

            <div class="field-group">
                <div class="f-label">Operational Expenses</div>
                <div class="f-value" style="color: #b22222; font-weight: bold;">
                    ₱ <span id="moExpenses">0.00</span>
                </div>
                <button class="btn-update" onclick="updateExpense()">+ ADD_FUNDS</button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                <div class="field-group">
                    <div class="f-label">Deployment Date</div>
                    <div class="f-value" id="moDeploy" style="font-size: 11px;">--/--/--</div>
                </div>
                <div class="field-group">
                    <div class="f-label">Expiration Date</div>
                    <div class="f-value" id="moExpire" style="font-size: 11px;">--/--/--</div>
                </div>
            </div>
        </div>
        <div class="close-doc" onclick="closeMission()">[ CLOSE_FILE ]</div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentAgent = localStorage.getItem("cia_agent") || "LZ";
        let currentVNum = null;

        async function initProfile() {
            document.getElementById('agentTitle').innerText = `AGENT_${currentAgent}`;
            document.getElementById('deviceName').innerText = localStorage.getItem("device_uuid") || "UNRECOGNIZED";

            // Check existing VAgents in Database
            for(let i=1; i<=8; i++) {
                const doc = await db.collection("agents").doc(currentAgent).collection("VAgents").doc(`Agent${i}`).get();
                if(doc.exists) {
                    document.getElementById(`vagent-${i}`).classList.add('active');
                }
            }
        }

        async function openMission(num) {
            const folder = document.getElementById(`vagent-${num}`);
            if(!folder.classList.contains('active')) return;

            currentVNum = num;
            const doc = await db.collection("agents").doc(currentAgent).collection("VAgents").doc(`Agent${num}`).get();
            const data = doc.data();

            document.getElementById('moNumber').innerText = `#VA-0${num}`;
            document.getElementById('moDetails').innerText = data.missionDetails || "ENCRYPTED_DATA";
            document.getElementById('moExpenses').innerText = parseFloat(data.expenses || 0).toLocaleString('en-PH', {minimumFractionDigits: 2});
            document.getElementById('moDeploy').innerText = data.deploymentDate || "PENDING";
            document.getElementById('moExpire').innerText = data.expirationDate || "N/A";

            document.getElementById('missionOverlay').style.display = 'flex';
        }

        function closeMission() {
            document.getElementById('missionOverlay').style.display = 'none';
        }

        async function updateExpense() {
            const amount = prompt("Enter amount to add (PHP):");
            if(amount && !isNaN(amount)) {
                const ref = db.collection("agents").doc(currentAgent).collection("VAgents").doc(`Agent${currentVNum}`);
                const doc = await ref.get();
                const newTotal = parseFloat(doc.data().expenses || 0) + parseFloat(amount);
                
                await ref.update({ expenses: newTotal });
                document.getElementById('moExpenses').innerText = newTotal.toLocaleString('en-PH', {minimumFractionDigits: 2});
                alert("Database Updated.");
            }
        }

        window.onload = initProfile;
    </script>
</body>
</html>
