<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA - TACTICAL TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: 'Fira Code', monospace; overflow: hidden; }
        .scanline { width: 100%; height: 2px; background: rgba(0, 112, 243, 0.1); position: fixed; animation: scan 4s linear infinite; z-index: 100; pointer-events: none; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        
        /* Elimination Animation */
        #elim-overlay {
            display: none; position: fixed; inset: 0; background: rgba(255,0,0,0.2);
            z-index: 200; align-items: center; justify-content: center;
            border: 10px solid red; animation: pulse-red 0.2s infinite;
        }
        @keyframes pulse-red { 0% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .floating-window { display: none; position: fixed; top: 15%; right: 2%; z-index: 50; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-xs border-t-2 border-blue-600">
    <div class="scanline"></div>

    <div id="elim-overlay" class="flex flex-col">
        <h1 class="text-white text-6xl font-black italic tracking-tighter">TARGET NEUTRALIZED</h1>
        <p class="text-white mt-4 font-bold tracking-[1em]">UPDATING GLOBAL REGISTRY...</p>
    </div>

    <nav class="bg-black/80 p-4 border-b border-white/10 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-4">
            <div class="px-2 py-1 border border-blue-500 text-blue-500 font-bold text-[10px]">AUTH: ADMIN_LVL5</div>
            <h1 class="tracking-[0.3em] uppercase font-bold text-white">Operational Terminal</h1>
        </div>
        <button onclick="toggleEliminated()" class="text-red-500 border border-red-500/30 px-3 py-1 hover:bg-red-500 font-bold uppercase text-[10px]">
            [ REGISTRY ]
        </button>
    </nav>

    <div class="max-w-4xl mx-auto p-6 space-y-6 h-[calc(100vh-80px)] flex flex-col">
        
        <section class="bg-zinc-900/40 border border-white/5 p-8 rounded shadow-2xl">
            <h2 class="text-blue-400 mb-4 tracking-widest uppercase font-bold text-xs">Dynamic Code Scan</h2>
            <input type="number" id="codeInput" oninput="autoScan()" placeholder="ENTER CODE..." 
                   class="w-full bg-black border border-white/10 p-5 outline-none focus:border-blue-500 text-blue-400 font-bold tracking-[0.8em] text-3xl text-center">
            
            <div id="statusReport" class="mt-6 min-h-[100px] flex flex-col items-center justify-center border border-dashed border-white/5 rounded bg-black/20 p-4">
                <p class="text-gray-700 italic uppercase tracking-widest text-[9px]">Listening for transmission...</p>
            </div>
        </section>

        <section class="bg-zinc-900/40 border border-white/5 rounded overflow-hidden flex flex-col flex-1">
            <div id="chatFeed" class="flex-1 p-4 overflow-y-auto space-y-2 bg-black/30 text-[10px]"></div>
            <div class="p-3 bg-black/40 border-t border-white/5 flex gap-2">
                <input type="text" id="chatMsg" placeholder="MSG..." class="flex-1 bg-black border border-white/10 p-2 outline-none text-amber-500 uppercase text-[10px] font-bold">
                <button onclick="sendMsg()" class="bg-amber-600 px-4 py-1 font-bold text-black text-[10px] uppercase">Transmit</button>
            </div>
        </section>
    </div>

    <div id="eliminatedWindow" class="floating-window w-64 bg-black border border-red-500 shadow-2xl">
        <div class="bg-red-900/30 p-2 border-b border-red-500 flex justify-between text-[10px] font-black text-red-500 uppercase">
            <span>Classified List</span>
            <button onclick="toggleEliminated()">[X]</button>
        </div>
        <div id="eliminatedList" class="p-3 max-h-60 overflow-y-auto space-y-1 text-red-500 font-bold tracking-widest text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rdb = getDatabase(app);

        // --- AUTO SCAN LOGIC ---
        window.autoScan = async () => {
            const code = document.getElementById('codeInput').value;
            const report = document.getElementById('statusReport');

            // Trigger scan only at 4 or 5 digits
            if (code.length < 4) {
                report.innerHTML = '<p class="text-gray-700 italic uppercase text-[9px]">Input insufficient...</p>';
                return;
            }

            report.innerHTML = `<span class="text-blue-500 animate-pulse font-bold uppercase tracking-widest text-[10px]">Database Inquiry in Progress...</span>`;

            const q = query(collection(db, "eliminated_codes"), where("code", "==", code));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                report.innerHTML = `
                    <div class="text-center">
                        <p class="text-amber-500 font-bold mb-2 tracking-widest">STATUS: UNKNOWN</p>
                        <button onclick="initiateElimination('${code}')" class="bg-red-600 px-6 py-2 text-white text-[10px] font-bold uppercase border border-red-400 hover:bg-red-700 transition">
                            Initiate Elimination Protocol
                        </button>
                    </div>`;
            } else {
                report.innerHTML = `
                    <div class="text-center border border-red-600 p-2 bg-red-600/10">
                        <p class="text-red-600 font-black tracking-widest uppercase">🚨 TARGET ALREADY ELIMINATED 🚨</p>
                        <p class="text-gray-500 text-[9px] mt-1 uppercase tracking-tighter italic">Duplicate entry blocked by security protocol.</p>
                    </div>`;
            }
        };

        // --- ELIMINATION ANIMATION & LOGIC ---
        window.initiateElimination = async (code) => {
            const overlay = document.getElementById('elim-overlay');
            
            // Show Animation
            overlay.style.display = 'flex';
            
            try {
                await addDoc(collection(db, "eliminated_codes"), {
                    code: code,
                    timestamp: serverTimestamp()
                });

                setTimeout(() => {
                    overlay.style.display = 'none';
                    document.getElementById('codeInput').value = "";
                    autoScan(); // Reset report
                }, 1500); // 1.5 seconds animation

            } catch (err) {
                overlay.style.display = 'none';
                alert("Critical System Error: Connection Lost.");
            }
        };

        // --- THE REST OF LOGIC ---
        window.sendMsg = () => {
            const input = document.getElementById('chatMsg');
            if (input.value.trim()) {
                push(ref(rdb, 'secure_comms'), { text: input.value.toUpperCase(), time: Date.now() });
                input.value = "";
            }
        };

        onChildAdded(ref(rdb, 'secure_comms'), (snap) => {
            const data = snap.val();
            const div = document.createElement('div');
            div.className = "bg-white/5 border-l border-amber-500 p-2 mb-1";
            div.innerHTML = `<span class="text-amber-500 font-bold tracking-widest text-[9px] uppercase">${data.text}</span>`;
            document.getElementById('chatFeed').appendChild(div);
            document.getElementById('chatFeed').scrollTop = document.getElementById('chatFeed').scrollHeight;
        });

        window.toggleEliminated = () => {
            const win = document.getElementById('eliminatedWindow');
            win.style.display = win.style.display === 'block' ? 'none' : 'block';
        };

        onSnapshot(collection(db, "eliminated_codes"), (snap) => {
            const list = document.getElementById('eliminatedList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const item = document.createElement('div');
                item.className = "border-b border-red-900/20 py-1 flex items-center justify-center gap-2";
                item.innerHTML = `<span class="text-[8px]">🎯</span><span>${doc.data().code}</span>`;
                list.appendChild(item);
            });
        });
    </script>
</body>
</html>
