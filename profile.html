<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; 
            --cia-cyan: #00f3ff; 
            --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        header { border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 10px; margin-bottom: 20px; }
        #display-agent { color: var(--cia-cyan); letter-spacing: 2px; text-transform: uppercase; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .phone-wrapper { cursor: pointer; text-align: center; }
        .phone-body {
            width: 100%; height: 120px; background: #050a0c; border-radius: 12px; border: 2px solid #1a2a30;
            display: flex; align-items: center; justify-content: center; transition: 0.4s;
        }
        .phone-wrapper.lights-on .phone-body { border-color: var(--cia-cyan); box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
        .status-label { font-size: 9px; color: var(--cia-cyan); margin-top: 5px; }

        /* --- 5-COLUMN VAGENT GRID (NEW UPDATE) --- */
        .vagent-grid { 
            display: none; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            margin-top: 20px; 
        }

        .folder-box { 
            display: flex; flex-direction: column; align-items: center; 
            cursor: pointer; position: relative; aspect-ratio: 1/1;
            background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 4px; justify-content: center;
        }
        
        /* BOLD AND NUMBER ONLY */
        .file-label { 
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px; 
            color: #fff; 
            font-weight: 700; 
        }

        /* CHANGE LOGS FOUND INTO OPERATING COST */
        .folder-box.has-expenses::after {
            content: "OPERATING COST"; 
            position: absolute; 
            bottom: 2px; 
            font-size: 5px; 
            font-family: var(--font-digital);
            color: var(--cia-cyan);
            font-weight: bold;
            text-align: center;
            width: 100%;
        }
        .folder-box.has-expenses { border-bottom: 2px solid var(--cia-cyan); }

        /* --- DOSSIER MODAL (NOIR STYLE) --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .dossier-paper {
            width: 90%; max-width: 360px; background: #e8e2d2; color: #1a1a1a; padding: 25px;
            font-family: var(--font-noir); position: relative; border: 1px solid #c5b8a0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .dossier-paper h3 { text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px; font-size: 1.2rem; }
        .close-btn { position: absolute; top: -10px; right: -10px; background: var(--cia-red); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.3); padding: 8px 0; font-size: 12px; }
        .secure-marker { background: #1a1a1a; color: #1a1a1a; padding: 0 5px; cursor: pointer; transition: 0.2s; }
        .secure-marker:active { background: transparent; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent">AUTHENTICATING...</h2>
        <p style="font-size: 9px; opacity: 0.5;">MEMOIRS_PROTOCOL_ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:10px; width:100%; margin-top:20px; font-family:var(--font-digital);">[ EXIT_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 40px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 25px; cursor:pointer; font-weight:bold; font-family:var(--font-digital);">[ MASTER_AUDIT ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <button class="close-btn" onclick="closeNoir()">X</button>
        <h3>vAGENT_DOSSIER</h3>
        <p style="font-size: 11px;"><b>MO#:</b> <span id="n-order">---</span></p>
        <p style="font-size: 11px;"><b>vAgent#:</b> <span id="n-vagent" style="background:rgba(0,0,0,0.1); padding: 0 5px;">---</span></p>
        
        <div id="n-content" style="margin-top: 15px; border-top: 1px dashed #000; padding-top: 10px; max-height: 200px; overflow-y: auto;"></div>
        
        <div style="text-align: right; margin-top: 20px; border-top: 2px solid #000; padding-top: 8px;">
            <p style="font-weight: bold; font-size: 1.4rem;">Total: <span id="n-total">₱ 0.00</span></p>
        </div>
    </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN_AGENT";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {};
    let allMissions = [];

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        allMissions = [];
        snap.forEach(d => {
            const data = d.data();
            const docWithID = {...data, id: d.id};
            allMissions.push(docWithID);
            if (data.vAgentID) {
                const deviceName = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[deviceName]) deviceData[deviceName] = [];
                deviceData[deviceName].push(docWithID);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        const grid = document.getElementById('deviceSection');
        grid.innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body">
                    <span style="font-size:12px; color:var(--cia-cyan);">NODE_${name}</span>
                </div>
                <div class="status-label">[ STANDBY ]</div>
            </div>
        `).join('');
    };

    window.activateDevice = (name, element) => {
        element.classList.add('lights-on');
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => {
                const hasHistory = v.expensesBreakdown && v.expensesBreakdown.length > 0;
                return `
                    <div class="folder-box ${hasHistory ? 'has-expenses' : ''}" onclick="openNoirModal('${v.id}')">
                        <div class="file-label">${v.vAgentID}</div>
                    </div>
                `;
            }).join('');
        }, 1000);
    };

    window.openNoirModal = (docID) => {
        const data = allMissions.find(m => m.id === docID);
        if(!data) return;
        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-order').innerText = docID.substring(0,10).toUpperCase();
        document.getElementById('n-vagent').innerText = data.vAgentID;

        let expHTML = (data.expensesBreakdown || []).map(e => `
            <div class="expense-row">
                <span>${e.description || 'FIELD_OP'}</span>
                <b>₱${(e.amount || 0).toLocaleString()}</b>
            </div>
        `).join('') || "No logs found.";

        document.getElementById('n-content').innerHTML = `
            <p style="font-size:10px;">Marker: <span class="secure-marker">${data.marker || 'CLASSIFIED'}</span></p>
            <div style="margin-top:10px;">${expHTML}</div>
        `;
        document.getElementById('n-total').innerText = `₱ ${(data.totalExpenses || 0).toLocaleString()}`;
    };
</script>
</body>
</html>
