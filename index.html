<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMERGENCY LOGIN</title>
    <style>
        body { background: #01080b; color: #00f3ff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #051014; border: 1px solid #00f3ff; padding: 40px; width: 320px; text-align: center; border-radius: 8px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #00f3ff; color: #05ffa1; font-family: monospace; font-size: 14px; }
        button { cursor: pointer; background: #00f3ff; color: #000; font-weight: bold; }
        .note { font-size: 10px; color: #5c7882; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔐 EMERGENCY LOGIN</h2>
        <input type="text" id="secretKey" placeholder="Enter secret key (1010 or 4646)">
        <button id="loginBtn">AUTHORIZE</button>
        <div id="status" style="margin-top: 10px; font-size: 11px;"></div>
        <div class="note">Direct login - No Firebase required</div>
    </div>

    <script>
        // Emergency bypass mapping
        const AGENT_MAP = {
            "1010": "AGENT_JFSN",
            "4646": "AGENT_LZ"
        };
        
        document.getElementById('loginBtn').onclick = () => {
            const key = document.getElementById('secretKey').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!key) {
                statusDiv.innerHTML = "❌ Enter secret key";
                statusDiv.style.color = "#ff003c";
                return;
            }
            
            const agentName = AGENT_MAP[key];
            
            if (agentName) {
                // Save to localStorage
                localStorage.setItem("cia_agent", agentName);
                localStorage.setItem("agent", agentName);
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("last_auth", new Date().toISOString());
                
                console.log("✅ Saved agent:", agentName);
                console.log("📦 localStorage:", localStorage.getItem("cia_agent"));
                
                statusDiv.innerHTML = `✅ ACCESS GRANTED as ${agentName}`;
                statusDiv.style.color = "#00ff66";
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1000);
            } else {
                statusDiv.innerHTML = "❌ INVALID SECRET KEY";
                statusDiv.style.color = "#ff003c";
            }
        };
        
        // Enter key support
        document.getElementById('secretKey').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>
