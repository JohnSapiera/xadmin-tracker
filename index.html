<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GHOST_PROTOCOL // UPLINK</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --error: #ff3c3c; --success: #00ff66; --dark: #0a0a0c; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-image: 
                radial-gradient(circle at center, rgba(0, 242, 255, 0.05) 0%, transparent 60%),
                linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9));
            overflow: hidden;
        }

        .terminal-card {
            width: 100%; max-width: 350px; padding: 40px 30px; background: var(--dark);
            border: 1px solid #222; box-shadow: 0 0 40px rgba(0,0,0,0.9);
            text-align: center; position: relative;
        }

        /* Top Red Bar - Classified Vibe */
        .terminal-card::before {
            content: "TOP_SECRET // EYES_ONLY"; position: absolute; top: -1px; left: -1px; 
            background: var(--error); color: #000; font-size: 9px; padding: 3px 10px; font-weight: 800;
        }

        h2 { 
            font-size: 16px; letter-spacing: 4px; color: var(--neon); 
            margin-bottom: 10px; text-transform: uppercase; 
        }

        .subtitle { font-size: 9px; color: #555; margin-bottom: 40px; letter-spacing: 1px; }

        /* Fingerprint / Scan Button */
        .btn-scan {
            width: 100%; padding: 20px; background: transparent; color: var(--neon);
            border: 1px solid var(--neon); font-weight: 800; cursor: pointer; 
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
            position: relative; overflow: hidden;
        }

        .btn-scan:hover { background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
        .btn-scan:active { transform: scale(0.98); }
        .btn-scan:disabled { border-color: #333; color: #555; cursor: not-allowed; box-shadow: none; background: transparent; }

        .terminal-log { 
            font-size: 10px; margin-top: 30px; color: #555; 
            min-height: 50px; line-height: 1.6; text-align: left;
            background: #000; padding: 10px; border: 1px solid #111;
        }
        
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="terminal-card">
        <h2>CENTRAL_MAINFRAME</h2>
        <div class="subtitle">ENCRYPTED HARDWARE HANDSHAKE REQUIRED</div>
        
        <button id="authBtn" class="btn-scan" onclick="authenticateTerminal()">
            Authenticate_Terminal
        </button>

        <div id="logBox" class="terminal-log">> STANDBY_ <span class="blink">_</span></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function authenticateTerminal() {
            const btn = document.getElementById('authBtn');
            const logBox = document.getElementById('logBox');
            
            // 1. Kunin ang Hardware Signature ng phone na gamit ngayon
            const localUUID = localStorage.getItem("device_uuid");

            btn.disabled = true;
            btn.innerText = "SCANNING_SIGNATURE...";
            logBox.innerHTML = `> EXTRACTING_LOCAL_KEY...<br>> <span style="color:var(--neon)">KEY: ${localUUID ? localUUID : "NULL"}</span><br>> TRANSMITTING_TO_HQ...`;

            // Kapag walang UUID, ibig sabihin hindi pa ito na-register sa update_db.html
            if (!localUUID) {
                setTimeout(() => {
                    logBox.innerHTML += `<br>> <span style="color:var(--error)">[!] FATAL: NO_CRYPTOGRAPHIC_SIGNATURE_FOUND</span><br>> ALIEN_DEVICE_DETECTED.`;
                    btn.disabled = false;
                    btn.innerText = "AUTHENTICATION_FAILED";
                }, 1000);
                return;
            }

            try {
                // 2. HANAPIN SA DATABASE KUNG KANINONG AGENT NAKAPANGALAN ANG PHONE NA ITO
                // (Zero-Input Magic: Ang system ang maghahanap, hindi ka na pipili)
                const snapshot = await db.collection("agents").where("linkedDevice", "==", localUUID).get();

                setTimeout(() => {
                    if (snapshot.empty) {
                        // Walang nakitang match sa database
                        logBox.innerHTML += `<br>> <span style="color:var(--error)">[!] ACCESS_DENIED: HARDWARE_NOT_RECOGNIZED</span><br>> INITIATING_LOCKDOWN...`;
                        btn.disabled = false;
                        btn.innerText = "ACCESS_DENIED";
                    } else {
                        // MATCH FOUND! 
                        const agentDoc = snapshot.docs[0];
                        const agentName = agentDoc.id; // Kukunin niya kung "LZ" o "JFSN"

                        logBox.innerHTML += `<br>> <span style="color:var(--success)">[+] MATCH_FOUND_IN_REGISTRY.</span>`;
                        logBox.innerHTML += `<br>> <span style="color:var(--neon)">WELCOME_BACK, AGENT_${agentName}</span>`;
                        logBox.innerHTML += `<br>> DECRYPTING_DASHBOARD...`;
                        
                        btn.style.color = "var(--success)";
                        btn.style.borderColor = "var(--success)";
                        btn.innerText = "ACCESS_GRANTED";

                        // 3. I-save ang pangalan ng Agent para gamitin sa Dashboard
                        localStorage.setItem("cia_agent", agentName);

                        // 4. Pasok sa Dashboard
                        setTimeout(() => { window.location.href = "dashboard.html"; }, 2000);
                    }
                }, 1500); // Artificial delay para mas dama ang "scanning" vibe

            } catch (error) {
                logBox.innerHTML += `<br>> <span style="color:var(--error)">[!] UPLINK_ERROR: ${error.message}</span>`;
                btn.disabled = false;
                btn.innerText = "RETRY_AUTHENTICATION";
            }
        }
    </script>
</body>
</html>
