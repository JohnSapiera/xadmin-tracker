<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v9.5_NODE_SYNC</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ... [EXISTING STYLES MAINTAINED] ... */
    :root { 
      --bg: #01080b; --panel: rgba(2, 12, 18, 0.98); --cyan: #00f3ff; 
      --red: #ff003c; --blue: #007bff; --green: #00ff66; 
      --border: rgba(0, 243, 255, 0.3); --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: 0%; } }
    @keyframes glitch { 0% { clip: rect(44px, 450px, 56px, 0); } 10% { clip: rect(12px, 450px, 30px, 0); } 20% { clip: rect(60px, 450px, 70px, 0); } 100% { clip: rect(44px, 450px, 56px, 0); } }
    
    /* NEW: Device Name Animation */
    @keyframes device-glow {
        0%, 100% { color: var(--cyan); text-shadow: 0 0 5px var(--cyan); }
        50% { color: #fff; text-shadow: 0 0 15px var(--cyan), 0 0 25px var(--cyan); }
    }
    .anim-device {
        animation: device-glow 2s infinite;
        font-weight: bold;
        letter-spacing: 1px;
    }

    body { background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    body::after { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: var(--cyan); opacity: 0.1; animation: scanline 8s linear infinite; pointer-events: none; }

    header { padding: 12px 15px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; z-index: 110; }
    .status-bar { font-size: 9px; font-family: var(--mono); color: var(--cyan); padding: 6px 15px; background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid var(--border); letter-spacing: 2px; display: flex; justify-content: space-between; text-transform: uppercase; }

    main { flex: 1; padding: 25px 20px; overflow-y: auto; padding-bottom: 110px; position: relative; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 25px; position: relative; box-shadow: 0 0 30px rgba(0,0,0,1); }
    #mission-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: var(--cyan); font-family: var(--mono); font-size: 42px; padding: 15px; text-align: center; letter-spacing: 15px; outline: none; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .btn { padding: 18px; font-family: var(--mono); font-size: 14px; font-weight: bold; border: 1px solid; background: transparent; text-transform: uppercase; cursor: pointer; }
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-terminate { color: var(--red); border-color: var(--red); }
    
    #terminal { background: rgba(0,0,0,0.8); border: 1px solid #111; padding: 15px; font-family: var(--mono); font-size: 11px; height: 150px; color: #4a5a61; margin-top: 25px; overflow-y: auto; line-height: 1.5; }

    nav { position: fixed; bottom: 0; width: 100%; height: 80px; background: #000; border-top: 2px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; z-index: 100; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-size: 11px; font-family: var(--mono); text-decoration: none; letter-spacing: 2px; }
    .nav-btn.active { color: var(--cyan); border-top: 4px solid var(--cyan); }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:15px; height:15px; border:2px solid var(--cyan); margin-right:12px; animation: glitch 2s infinite;"></div>
    <span style="font-family: var(--mono); font-size: 15px; font-weight: bold; letter-spacing: 3px; color: var(--cyan);">INTEL_DASH</span>
  </div>
  <button class="profile-trigger" style="color:var(--cyan); background:none; border:1px solid var(--cyan); padding:5px 10px; font-family:var(--mono); font-size:10px;" onclick="window.location.href='profile.html'">AGENT_PROFILE</button>
</header>

<div class="status-bar">
    <span id="clock">00:00:00</span>
    <span id="device-tag">NODE: <span class="anim-device">INITIALIZING...</span></span>
</div>

<main>
  <div class="command-module">
    <div class="box-label">// INITIATE_DATA_ENCRYPTION_SCAN</div>
    <div class="input-wrapper">
        <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
    </div>
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE_DATA</button>
      <button id="term-btn" class="btn btn-terminate">TERMINATE</button>
    </div>
  </div>

  <div id="terminal">> SYSTEM_READY...<br>> SYNCING_NODE_IDENTITY...</div>
</main>

<nav>
  <a href="#" class="nav-btn active">DASHBOARD</a>
  <a href="intel.html" class="nav-btn">INTEL</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:d996e585751d5087cd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- NEW DEVICE LOGIC ---
  const nodeSecret = localStorage.getItem("agency_node_secret");
  const deviceTag = document.getElementById('device-tag');

  async function syncDeviceName() {
      if (!nodeSecret) {
          deviceTag.innerHTML = `NODE: <span class="anim-device" style="color:var(--red)">UNREGISTERED</span>`;
          return;
      }

      try {
          const snap = await getDocs(collection(db, "agents"));
          let foundBrand = "UNKNOWN_NODE";

          snap.forEach(doc => {
              const data = doc.data();
              if (data.linkedDevice && data.linkedDevice.includes(nodeSecret)) {
                  if (data.deviceDetails) {
                      const detail = data.deviceDetails.find(d => d.signature === nodeSecret || d.id === nodeSecret);
                      if (detail) foundBrand = detail.brandName || detail.brand;
                  }
              }
          });

          // Implement Animation and Change
          deviceTag.innerHTML = `NODE: <span class="anim-device">${foundBrand.toUpperCase()}</span>`;
          log(`NODE_SYNC: ${foundBrand} VERIFIED.`, 'green');

      } catch (e) {
          console.error(e);
          deviceTag.innerHTML = `NODE: <span class="anim-device">OFFLINE</span>`;
      }
  }

  // Common UI functions
  function log(m, c) {
    const termLog = document.getElementById('terminal');
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.3">${new Date().toLocaleTimeString('en-GB')}</span> > <span style="color:var(--${c})">${m}</span>`;
    termLog.prepend(d);
  }

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);

  // Initialize
  syncDeviceName();
</script>
</body>
</html>
