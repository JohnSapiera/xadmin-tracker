<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XADMIN - SECURE INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(18, 18, 24, 0.98);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; border-bottom: 1px solid var(--accent-cyan); font-size: 11px; color: var(--accent-cyan);
        }

        .dashboard {
            display: grid; grid-template-columns: 320px 1fr 320px; gap: 15px; padding: 15px; flex-grow: 1;
        }

        .panel { background: var(--panel-bg); border: 1px solid var(--border); display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; }
        .panel-header { padding: 8px 12px; font-size: 10px; font-weight: 800; background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }

        /* Bounty List */
        .bounty-list { flex-grow: 1; padding: 15px; font-size: 11px; overflow-y: auto; }
        .bounty-item { border-left: 2px solid var(--accent-cyan); padding: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.02); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .add-bounty-btn { background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 10px; margin: 10px; cursor: pointer; font-family: inherit; font-weight: 800; }
        .add-bounty-btn:hover { background: var(--accent-cyan); color: #000; }

        /* Ban Protocol */
        .ban-container { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        input, textarea { background: #000; border: 1px solid #333; color: var(--accent-cyan); padding: 12px; font-family: inherit; width: 100%; outline: none; border-radius: 4px; }
        .terminal-log { flex-grow: 1; background: rgba(0,0,0,0.6); margin-top: 10px; padding: 15px; font-size: 11px; overflow-y: auto; color: #88ff88; border: 1px solid var(--border); height: 200px; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: #0f1117; border: 2px solid var(--accent-cyan); width: 350px; padding: 20px; }
        .modal-step { display: none; flex-direction: column; gap: 10px; }
        .active-step { display: flex; }
        .option-btn { background: #1a1d26; border: 1px solid #333; color: #fff; padding: 10px; cursor: pointer; text-align: left; font-family: inherit; }
        
        .hidden { display: none !important; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <nav class="status-header">
        <div>XADMIN_ID: <span style="color:white">X-GHOST</span></div>
        <div class="blink">● SECURE_FIREBASE_CONNECTED</div>
        <div id="clock">00:00:00</div>
    </nav>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">BOUNTY_REPORTS (LIVE)</div>
            <div class="bounty-list" id="bountyDisplay"></div>
            <button class="add-bounty-btn" onclick="openBountyModal()">+ ADD BOUNTY</button>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span onclick="toggleBulkMode()" style="cursor:pointer; color:var(--accent-cyan)">TERMINATION_PROTOCOL</span>
                <span id="modeStatus" style="font-size: 9px; color: #666;">MODE: SINGLE_SEARCH</span>
            </div>
            <div class="ban-container">
                <input type="text" id="singleCode" placeholder="Search code in Firebase..." oninput="autoSearch(this.value)">
                <textarea id="bulkCodes" class="hidden" placeholder="Paste multiple codes here..."></textarea>
                <button id="execBtn" style="background:var(--danger-red); color:white; border:none; padding:12px; cursor:pointer; font-weight:800; border-radius:4px;" onclick="processBan()">EXECUTE TERMINATION</button>
                <div class="terminal-log" id="banLog">> Connection Ready...</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">CLASSIFIED_COMMS</div>
            <div id="chatFeed" style="flex-grow:1; padding:15px; font-size:11px; overflow-y:auto;"></div>
            <div style="padding:10px; display:flex; gap:5px; background:#000;">
                <input type="text" id="chatInput" placeholder="Secure message..." style="border:none;">
                <button onclick="sendMsg()" style="background:var(--accent-cyan); border:none; padding:5px 10px; font-weight:800;">SEND</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bountyModal">
        <div class="modal-box">
            <div id="step1" class="modal-step active-step">
                <p style="font-size:11px; color:var(--accent-cyan)">SELECT AGENT:</p>
                <button class="option-btn" onclick="selectAgent('LZ')">LZ</button>
                <button class="option-btn" onclick="selectAgent('JFSN')">JFSN</button>
                <button onclick="closeModal()" style="background:none; border:none; color:grey; cursor:pointer; margin-top:10px;">CANCEL</button>
            </div>
            <div id="step2" class="modal-step">
                <p style="font-size:11px; color:var(--accent-cyan)">SELECT WEAPON:</p>
                <div id="weaponOptions" style="display:flex; flex-direction:column; gap:5px;"></div>
            </div>
            <div id="step3" class="modal-step">
                <p style="font-size:11px; color:var(--accent-cyan)">INPUT TARGET DATA:</p>
                <input type="number" id="vAgentNum" placeholder="V-Agent# (<100)">
                <input type="number" id="bountyAmt" placeholder="Bounty (<11,000)">
                <button class="add-bounty-btn" style="margin:10px 0" onclick="finalizeBounty()">DEPLOY TO CLOUD</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        // Your Config
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- 1. BOUNTY REPORTS (REAL-TIME) ---
        window.finalizeBounty = async () => {
            const vid = document.getElementById('vAgentNum').value;
            const amt = document.getElementById('bountyAmt').value;

            if (vid >= 100 || amt >= 11000) { alert("Invalid Stats"); return; }

            try {
                await addDoc(collection(db, "bounty_reports"), {
                    agent: window.tempAgent,
                    weapon: window.tempWeapon,
                    vid: parseInt(vid),
                    amount: parseInt(amt),
                    timestamp: new Date()
                });
                window.closeModal();
            } catch (e) { console.error(e); }
        };

        // Listen for data
        onSnapshot(collection(db, "bounty_reports"), (snapshot) => {
            const display = document.getElementById('bountyDisplay');
            display.innerHTML = "";
            snapshot.forEach((doc) => {
                const b = doc.data();
                display.innerHTML += `
                    <div class="bounty-item">
                        <div style="color:var(--accent-cyan)">AGENT: ${b.agent} | ${b.weapon}</div>
                        <div>V-ID: ${b.vid} | BOUNTY: ${b.amount}</div>
                    </div>`;
            });
        });

        // --- 2. AUTO SEARCH (BLACKlIST CHECK) ---
        window.autoSearch = async (val) => {
            const log = document.getElementById('banLog');
            const code = val.trim().toUpperCase();
            if(!code) return;

            log.innerHTML = `<div>> QUERYING CLOUD DATABASE...</div>`;
            
            // Search in "blacklist" collection where field "code" matches
            const q = query(collection(db, "blacklist"), where("code", "==", code));
            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                log.innerHTML += `<div style="color:var(--danger-red)">> WARNING: TARGET [${code}] ALREADY BANNED.</div>`;
            } else {
                log.innerHTML += `<div style="color:#00ff00">> STATUS: [${code}] IS CLEAR.</div>`;
            }
        };

        // --- 3. EXECUTE BAN ---
        window.processBan = async () => {
            const code = document.getElementById('singleCode').value.toUpperCase();
            if(!code) return;

            try {
                // Add to "blacklist" collection
                await addDoc(collection(db, "blacklist"), {
                    code: code,
                    bannedAt: new Date()
                });
                document.getElementById('banLog').innerHTML += `<div style="color:#00ff00">> SUCCESS: ${code} TERMINATED.</div>`;
                document.getElementById('singleCode').value = "";
            } catch (e) { alert("Error saving to Firebase"); }
        };

    </script>

    <script>
        // GLOBAL HELPERS (NON-FIREBASE)
        window.tempAgent = ""; window.tempWeapon = "";
        function openBountyModal() { document.getElementById('bountyModal').style.display = 'flex'; resetSteps(); }
        function closeModal() { document.getElementById('bountyModal').style.display = 'none'; }
        function resetSteps() { document.getElementById('step1').className = 'modal-step active-step'; document.getElementById('step2').className = 'modal-step'; document.getElementById('step3').className = 'modal-step'; }

        function selectAgent(a) { 
            window.tempAgent = a; 
            document.getElementById('step1').classList.remove('active-step');
            document.getElementById('step2').classList.add('active-step');
            const opts = document.getElementById('weaponOptions');
            opts.innerHTML = "";
            let ws = a === 'LZ' ? ['R8', 'RM14'] : ['R9', 'TechCP'];
            ws.forEach(w => opts.innerHTML += `<button class="option-btn" onclick="selectWeapon('${w}')">${w}</button>`);
        }

        function selectWeapon(w) { window.tempWeapon = w; document.getElementById('step2').classList.remove('active-step'); document.getElementById('step3').classList.add('active-step'); }
        function toggleBulkMode() { /* Bulk logic same as before */ }
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
