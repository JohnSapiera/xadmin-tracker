<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA INTELLIGENCE UNIT - ENCRYPTED</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(18, 18, 24, 0.95);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --text-dim: #626a77;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--accent-cyan);
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--accent-cyan);
        }

        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 15px;
            padding: 15px;
            flex-grow: 1;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        .panel-header {
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            cursor: default;
        }

        /* BAN SYSTEM STYLES */
        .ban-container { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Hidden Toggle Label */
        .secret-trigger {
            font-size: 10px;
            color: var(--accent-cyan);
            cursor: help;
            transition: 0.3s;
        }
        .secret-trigger:hover { text-shadow: 0 0 5px var(--accent-cyan); }

        input[type="text"], textarea {
            background: #000;
            border: 1px solid #333;
            color: var(--accent-cyan);
            padding: 12px;
            font-family: inherit;
            width: 100%;
            outline: none;
            border-radius: 4px;
        }

        textarea { height: 120px; resize: none; display: none; font-size: 12px; }

        .execute-btn {
            background: var(--danger-red);
            color: white;
            border: none;
            padding: 15px;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 5px;
        }

        .terminal-log {
            flex-grow: 1;
            background: rgba(0,0,0,0.4);
            margin-top: 10px;
            padding: 15px;
            font-size: 11px;
            overflow-y: auto;
            color: #88ff88;
            border: 1px solid rgba(255,255,255,0.02);
        }

        /* CHAT STYLES */
        .chat-area { flex-grow: 1; overflow-y: auto; padding: 15px; font-size: 12px; }
        .chat-input-row { padding: 10px; background: #000; display: flex; gap: 8px; }
        #chatInput { flex-grow: 1; background: transparent; border: none; color: #fff; outline: none; font-family: inherit; }

        .hidden { display: none !important; }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <nav class="status-header">
        <div>AGENT: <span style="color:white">098-GHOST</span></div>
        <div class="blink">● ENCRYPTED CONNECTION</div>
        <div>v.4.0.1-STABLE</div>
    </nav>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">BOUNTY_REPORTS</div>
            <div style="padding:20px; color:var(--text-dim); font-size:10px;">
                [!] NO ACTIVE TARGETS FOUND IN SECTOR.
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span onclick="toggleBulkMode()" class="secret-trigger" title="Click to switch Mode">TERMINATION_PROTOCOL</span>
                <span id="modeStatus" style="font-size: 9px; color: var(--text-dim);">MODE: SINGLE</span>
            </div>
            
            <div class="ban-container">
                <label style="font-size: 10px; color: var(--accent-cyan);">IDENTIFICATION / SECRET CODES</label>
                
                <input type="text" id="singleCode" placeholder="Enter target ID...">
                
                <textarea id="bulkCodes" placeholder="Paste multiple codes here (one per line)..."></textarea>
                
                <button class="execute-btn" onclick="processBan()">EXECUTE BLACKLIST</button>
                
                <div class="terminal-log" id="banLog">> System Standby...</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">SECURE_COMMS</div>
            <div class="chat-area" id="chatFeed">
                <div style="color:var(--accent-cyan)">[SYSTEM]: LINK ESTABLISHED.</div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()" style="background:var(--accent-cyan); border:none; padding:5px 10px; font-weight:800; cursor:pointer;">SEND</button>
            </div>
        </div>
    </div>

    <script>
        let isBulkMode = false;

        // Hidden Switch Logic
        function toggleBulkMode() {
            isBulkMode = !isBulkMode;
            const singleInput = document.getElementById('singleCode');
            const bulkInput = document.getElementById('bulkCodes');
            const status = document.getElementById('modeStatus');

            if (isBulkMode) {
                singleInput.classList.add('hidden');
                bulkInput.style.display = 'block';
                status.innerText = "MODE: BULK_ENROLLMENT";
                status.style.color = "#ffb000";
            } else {
                singleInput.classList.remove('hidden');
                bulkInput.style.display = 'none';
                status.innerText = "MODE: SINGLE";
                status.style.color = "var(--text-dim)";
            }
        }

        // Main Execution Logic
        function processBan() {
            const log = document.getElementById('banLog');
            let codesArray = [];

            if (isBulkMode) {
                const rawData = document.getElementById('bulkCodes').value;
                // Split by lines or commas, then trim and remove empty
                codesArray = rawData.split(/[\n,]+/).map(s => s.trim()).filter(s => s !== "");
            } else {
                const val = document.getElementById('singleCode').value.trim();
                if (val) codesArray.push(val);
            }

            if (codesArray.length === 0) {
                log.innerHTML += `<div style="color:var(--danger-red)">> ERROR: NO DATA DETECTED.</div>`;
                return;
            }

            // --- AUTO DELETE DUPLICATES ---
            const originalCount = codesArray.length;
            const uniqueCodes = [...new Set(codesArray)]; // Eto yung magic ng unique data
            const duplicateCount = originalCount - uniqueCodes.length;

            log.innerHTML += `<div>> SCANNING: ${originalCount} entries found.</div>`;
            
            if (duplicateCount > 0) {
                log.innerHTML += `<div style="color:#ffb000">> PURGING: ${duplicateCount} duplicates removed.</div>`;
            }

            log.innerHTML += `<div class="blink">> UPLOADING ${uniqueCodes.length} UNIQUE CODES TO DATABASE...</div>`;

            // Dito mo ilalagay ang Firebase logic mo para sa uniqueCodes
            setTimeout(() => {
                log.innerHTML += `<div style="color:#00ff00">> TRANSACTION COMPLETE. DATABASE SYNCHRONIZED.</div>`;
                log.scrollTop = log.scrollHeight;
                
                // Clear inputs
                document.getElementById('singleCode').value = "";
                document.getElementById('bulkCodes').value = "";
            }, 1500);
        }

        function sendMsg() {
            const input = document.getElementById('chatInput');
            if (input.value.trim()) {
                document.getElementById('chatFeed').innerHTML += `<div><strong>[YOU]:</strong> ${input.value}</div>`;
                input.value = "";
                const feed = document.getElementById('chatFeed');
                feed.scrollTop = feed.scrollHeight;
            }
        }
    </script>
</body>
</html>
