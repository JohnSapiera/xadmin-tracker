<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GATEWAY_v9.0_INTEL_CENTER</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #01080b; 
      --panel: rgba(5, 18, 24, 0.95); 
      --cyan: #00f3ff; 
      --red: #ff003c; 
      --blue: #007bff; 
      --green: #00ff66; 
      --border: rgba(0, 243, 255, 0.2); 
      --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
        background: var(--bg); 
        color: #c8e1e5; 
        font-family: 'Rajdhani', sans-serif; 
        height: 100vh; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column;
    }

    /* Background Scanner Effect */
    body::before {
        content: ""; position: fixed; inset: 0;
        background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 50px 50px; pointer-events: none; opacity: 0.05;
    }

    header { 
        padding: 10px 15px; background: #000; 
        border-bottom: 2px solid var(--cyan); 
        display: flex; justify-content: space-between; align-items: center; 
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
        z-index: 10;
    }
    
    .status-bar { 
        font-size: 10px; font-family: var(--mono); color: var(--cyan); 
        padding: 6px 15px; background: rgba(0, 243, 255, 0.05); 
        border-bottom: 1px solid var(--border); letter-spacing: 1px;
        display: flex; justify-content: space-between;
    }

    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }

    /* Entry Module */
    .command-box { 
        background: var(--panel); border: 1px solid var(--border); 
        padding: 20px; border-radius: 4px; position: relative;
        backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .box-label { font-family: var(--mono); font-size: 10px; color: #444; margin-bottom: 10px; border-left: 2px solid var(--cyan); padding-left: 8px; }

    #mission-input { 
      width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--cyan); 
      font-family: var(--mono); font-size: 38px; padding: 10px; text-align: center; 
      letter-spacing: 12px; outline: none; margin-bottom: 15px;
      box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { 
        padding: 16px; font-family: var(--mono); font-size: 13px; font-weight: bold; 
        border: 1px solid; background: transparent; text-transform: uppercase; 
        cursor: pointer; transition: 0.2s; border-radius: 2px;
    }

    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; }
    .btn-terminate { color: var(--red); border-color: var(--red); }
    .btn-prohibited { color: #333; border-color: #222; cursor: not-allowed; opacity: 0.5; }

    /* Agent Profile Central Hub */
    .agent-center { 
        margin: 35px 0; display: flex; flex-direction: column; align-items: center; 
    }
    
    .profile-hex {
        width: 90px; height: 90px; background: #000; 
        border: 2px solid var(--cyan); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.3s;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }
    .profile-hex:active { transform: scale(0.9); box-shadow: 0 0 40px var(--cyan); }
    
    .hex-inner { 
        width: 40px; height: 40px; background: var(--cyan); 
        clip-path: polygon(50% 10%, 90% 90%, 10% 90%); opacity: 0.8; 
    }

    .agent-label { font-family: var(--mono); font-size: 11px; color: var(--cyan); margin-top: 12px; letter-spacing: 3px; font-weight: bold; }

    /* Logs */
    #terminal { 
        background: rgba(0,0,0,0.6); border-radius: 4px; padding: 12px; 
        font-family: var(--mono); font-size: 10px; height: 120px; color: #555; 
        margin-top: 10px; overflow-y: auto; border: 1px solid #111;
    }

    /* Modal Styling */
    .modal-overlay { 
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); 
      z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content { 
      background: var(--panel); border: 2px solid var(--cyan); width: 100%; max-width: 320px; 
      padding: 30px 20px; position: relative; border-radius: 4px;
    }
    .modal-close { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; border: none; padding: 10px 15px; cursor: pointer; font-family: var(--mono); }

    .form-id { font-size: 28px; color: var(--cyan); text-align: center; margin-bottom: 25px; font-family: var(--mono); }
    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
    .data-label { font-size: 10px; color: #666; text-transform: uppercase; font-family: var(--mono); }
    .data-val { font-size: 14px; font-family: var(--mono); color: #fff; }
    .m-input { background: rgba(0,243,255,0.05); border: 1px solid #333; color: var(--cyan); width: 130px; text-align: right; font-family: var(--mono); padding: 5px; outline: none; }

    .btn-initiate { width: 100%; margin-top: 15px; background: var(--green); color: #000; border: none; padding: 18px; font-family: var(--mono); font-weight: bold; cursor: pointer; letter-spacing: 2px; }

    /* Nav Bar */
    nav { 
        position: fixed; bottom: 0; width: 100%; height: 75px; 
        background: #000; border-top: 2px solid var(--border); 
        display: grid; grid-template-columns: 1fr 1fr; z-index: 100;
    }
    .nav-btn { 
        display: flex; flex-direction: column; align-items: center; 
        justify-content: center; color: #333; font-size: 11px; 
        font-family: var(--mono); text-decoration: none; transition: 0.3s;
    }
    .nav-btn.active { color: var(--cyan); background: rgba(0, 243, 255, 0.05); border-top: 3px solid var(--cyan); }
    .nav-ico { font-size: 22px; margin-bottom: 5px; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:12px; height:12px; background:var(--cyan); border-radius:50%; margin-right:10px; box-shadow: 0 0 10px var(--cyan);"></div>
    <span style="font-family: var(--mono); font-size: 13px; font-weight: bold; letter-spacing: 2px;">INTEL_CENTER</span>
  </div>
  <span id="clock" style="color:var(--cyan); font-family: var(--mono); font-weight: bold;">00:00:00</span>
</header>

<div class="status-bar">
    <span>UPLINK: ACTIVE</span>
    <span id="device-tag">DEVICE: --</span>
</div>

<main>
  <div class="command-box">
    <div class="box-label">AWAITING_MISSION_INPUT</div>
    <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="term-btn" class="btn btn-terminate">TERMINATE</button>
    </div>
  </div>

  <div class="agent-center">
      <div class="profile-hex" onclick="window.location.href='profile.html'">
          <div class="hex-inner"></div>
      </div>
      <div class="agent-label">AGENT'S PROFILE</div>
  </div>

  <div id="terminal">> CORE_INITIALIZED...<br>> READY_FOR_SCAN...</div>
</main>

<div id="entry-modal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="form-id" id="m-id-display">#00000</div>
    
    <div class="data-row">
      <span class="data-label">VAgent_ID</span>
      <input type="tel" id="input-vagent" class="m-input" placeholder="REQUIRED">
    </div>
    <div class="data-row">
      <span class="data-label">Expenses</span>
      <span class="data-val" style="color: var(--green);">0.00</span>
    </div>
    <div class="data-row">
      <span class="data-label">Deployment</span>
      <span class="data-val" id="m-dep">--</span>
    </div>
    <div class="data-row">
      <span class="data-label">Expiration</span>
      <span class="data-val" id="m-expir" style="color: var(--red);">--</span>
    </div>
    <div id="status-box" style="text-align: center; font-size: 11px; color: var(--cyan); margin-top: 15px; font-family: var(--mono); opacity: 0.6;"></div>
    
    <button id="initiate-btn" class="btn btn-initiate">INITIATE_UPLINK</button>
  </div>
</div>

<nav>
  <a href="#" class="nav-btn active">
      <span class="nav-ico">◈</span>
      DASHBOARD
  </a>
  <a href="intel.html" class="nav-btn">
      <span class="nav-ico">◰</span>
      INTEL
  </a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:d996e585751d5087cd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const termBtn = document.getElementById('term-btn');
  const initiateBtn = document.getElementById('initiate-btn');
  const vagentInput = document.getElementById('input-vagent');
  const termLog = document.getElementById('terminal');
  const deviceTag = document.getElementById('device-tag');
  
  let currentData = null;
  let accessStatus = "NEW";
  const linkedDeviceName = localStorage.getItem("device_uuid") || "UNRECOGNIZED_HW";
  deviceTag.textContent = `DEVICE: ${linkedDeviceName}`;

  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    if (val.length >= 4) {
      log(`SCANNING...`, 'cyan');
      try {
        const qB = query(collection(db, "blacklist"), where("targetID", "==", val));
        const sB = await getDocs(qB);
        if (!sB.empty) {
          accessStatus = "PROHIBITED";
          updateButton("PROHIBITED", "btn-prohibited");
          log(`ID ${val} BLACKLISTED.`, 'red');
          return;
        }

        const qM = query(collection(db, "mission_orders"), where("orderNumber", "==", val));
        const sM = await getDocs(qM);
        if (!sM.empty) {
          const data = sM.docs[0].data();
          const expDate = data.expirationDate.toDate ? data.expirationDate.toDate() : new Date(data.expirationDate);
          
          if (new Date() > expDate) {
            log(`ID ${val} EXPIRED.`, 'red');
            await addDoc(collection(db, "blacklist"), { targetID: val, reason: "AUTO_EXPIRY", timestamp: serverTimestamp() });
            accessStatus = "PROHIBITED";
            updateButton("PROHIBITED", "btn-prohibited");
          } else {
            accessStatus = "AUTHORIZED";
            currentData = data;
            updateButton("RETRIEVE", "btn-retrieve");
            log(`ID ${val} AUTHORIZED.`, 'blue');
          }
        } else {
          accessStatus = "NEW";
          updateButton("SAVE", "btn-save");
          log(`ID ${val} NOT FOUND.`, 'green');
        }
      } catch (err) { log("DB_ERROR", "red"); }
    } else { resetUI(); }
  });

  function updateButton(text, className) {
    actionBtn.textContent = text;
    actionBtn.className = `btn ${className}`;
  }

  function resetUI() {
    accessStatus = "NEW";
    updateButton("SAVE", "btn-save");
    currentData = null;
  }

  actionBtn.addEventListener('click', () => {
    if (accessStatus === "PROHIBITED" || input.value.length < 4) return;
    const val = input.value.trim();
    document.getElementById('m-id-display').textContent = `#${val}`;

    if (accessStatus === "NEW") {
      const depDate = new Date();
      const expDate = new Date();
      expDate.setDate(depDate.getDate() + 30);
      vagentInput.value = ""; vagentInput.readOnly = false;
      document.getElementById('m-dep').textContent = depDate.toLocaleDateString();
      document.getElementById('m-expir').textContent = expDate.toLocaleDateString();
      initiateBtn.style.display = "block";
      document.getElementById('status-box').textContent = "AWAITING VAGENT ID";
    } else {
      const dep = currentData.deploymentDate.toDate ? currentData.deploymentDate.toDate() : new Date(currentData.deploymentDate);
      const exp = currentData.expirationDate.toDate ? currentData.expirationDate.toDate() : new Date(currentData.expirationDate);
      vagentInput.value = currentData.vAgent;
      vagentInput.readOnly = true;
      document.getElementById('m-dep').textContent = dep.toLocaleDateString();
      document.getElementById('m-expir').textContent = exp.toLocaleDateString();
      initiateBtn.style.display = "none";
      document.getElementById('status-box').textContent = "ACCESS AUTHORIZED";
    }
    document.getElementById('entry-modal').style.display = 'flex';
    if(accessStatus === "NEW") vagentInput.focus();
  });

  initiateBtn.addEventListener('click', async () => {
    const val = input.value.trim();
    const vAgentValue = vagentInput.value.trim();
    if (!vAgentValue) { alert("ENTER V-AGENT ID"); return; }
    log(`INITIATING UPLINK...`, 'green');
    initiateBtn.disabled = true; initiateBtn.textContent = "WAIT...";
    
    try {
      const depDate = new Date(document.getElementById('m-dep').textContent);
      const expDate = new Date(document.getElementById('m-expir').textContent);
      
      await addDoc(collection(db, "mission_orders"), {
        orderNumber: val, 
        vAgent: vAgentValue, 
        expenses: 0,
        deploymentDate: depDate, 
        expirationDate: expDate, 
        linkedDevice: linkedDeviceName, 
        agentName: localStorage.getItem("cia_agent") || "UNKNOWN",
        timestamp: serverTimestamp()
      });
      
      log(`MISSION ${val} INITIATED.`, 'green');
      closeModal();
      input.value = ""; resetUI();
    } catch (e) { log(`FAILED: ${e.message}`, 'red'); } finally {
      initiateBtn.disabled = false; initiateBtn.textContent = "INITIATE_UPLINK";
    }
  });

  termBtn.addEventListener('click', async () => {
    const val = input.value.trim();
    if (val.length < 4 || !confirm(`TERMINATE #${val}?`)) return;
    await addDoc(collection(db, "blacklist"), { targetID: val, reason: "MANUAL", timestamp: serverTimestamp() });
    log(`ID ${val} TERMINATED.`, 'red');
    input.value = ""; resetUI();
  });

  window.closeModal = () => document.getElementById('entry-modal').style.display = 'none';
  function log(m, c) {
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.4">[${new Date().toLocaleTimeString('en-GB')}]</span> > <span style="color:var(--${c})">${m}</span>`;
    termLog.prepend(d);
  }
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
