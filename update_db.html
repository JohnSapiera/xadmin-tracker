<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPDATE_DB - WEAPON MANAGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #051014;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,243,255,0.1);
        }
        h2 {
            color: #00f3ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 18px;
        }
        .section {
            margin-bottom: 25px;
            border-bottom: 1px solid #1a2f37;
            padding-bottom: 20px;
        }
        .section-title {
            color: #00f3ff;
            font-size: 12px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #05ffa1;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 12px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 20px;
        }
        .radio-group input[type="radio"] {
            accent-color: #00f3ff;
            width: 16px;
            height: 16px;
        }
        .radio-group label:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.1);
            color: #00f3ff;
        }
        .weapon-list {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .weapon-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #1a2f37;
            gap: 15px;
            flex-wrap: wrap;
        }
        .weapon-name {
            flex: 1;
            color: #fff;
            font-size: 12px;
            font-family: monospace;
            word-break: break-all;
        }
        .weapon-left {
            flex: 2;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .weapon-left select {
            flex: 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 6px;
            outline: none;
        }
        .weapon-left select:focus {
            border-color: #00f3ff;
        }
        .weapon-right {
            flex: 2;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .weapon-right input {
            flex: 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 11px;
            border-radius: 6px;
            outline: none;
        }
        .weapon-right input:focus {
            border-color: #00f3ff;
        }
        .rename-btn {
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .rename-btn:hover {
            background: #05ffa1;
            box-shadow: 0 0 8px rgba(5,255,161,0.3);
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
        }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
        .loading {
            text-align: center;
            color: #00f3ff;
            padding: 20px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 WEAPON SYSTEM MANAGER</h2>

        <!-- AGENT SELECTION (Radio Buttons from mission_orders) -->
        <div class="section">
            <div class="section-title">📡 SELECT AGENT</div>
            <div id="agentRadioGroup" class="radio-group">
                <div class="loading">Loading agents...</div>
            </div>
        </div>

        <!-- WEAPON SYSTEMS LIST -->
        <div class="section">
            <div class="section-title">🔫 WEAPON SYSTEMS (Click radio button above to load)</div>
            <div id="weaponListContainer" class="weapon-list">
                <div class="loading">Select an agent first</div>
            </div>
        </div>

        <div class="status" id="statusMsg">Ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Global variables
        let allAgents = [];          // List of unique agent names
        let currentAgent = null;     // Currently selected agent
        let weaponSystems = [];       // List of weapon systems for current agent

        // DOM Elements
        const agentRadioGroup = document.getElementById('agentRadioGroup');
        const weaponListContainer = document.getElementById('weaponListContainer');
        const statusMsg = document.getElementById('statusMsg');

        // ========== LOAD AGENTS FROM mission_orders ==========
        async function loadAgents() {
            statusMsg.innerHTML = '⏳ Loading agents from database...';
            agentRadioGroup.innerHTML = '<div class="loading">Loading agents...</div>';
            
            try {
                const snapshot = await db.collection("mission_orders").get();
                const agentSet = new Set();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.agent) {
                        agentSet.add(data.agent);
                    }
                });
                
                allAgents = Array.from(agentSet).sort();
                
                if (allAgents.length === 0) {
                    agentRadioGroup.innerHTML = '<div style="color:#5c7882;">No agents found in mission_orders</div>';
                    statusMsg.innerHTML = '<span class="error">⚠️ No agents found in database</span>';
                } else {
                    renderAgentRadios();
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${allAgents.length} agent(s)</span>`;
                }
            } catch (error) {
                console.error("Error loading agents:", error);
                agentRadioGroup.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                statusMsg.innerHTML = `<span class="error">❌ Failed to load agents</span>`;
            }
        }

        // Render radio buttons for agents
        function renderAgentRadios() {
            agentRadioGroup.innerHTML = '';
            allAgents.forEach(agent => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'agent';
                radio.value = agent;
                radio.onclick = () => selectAgent(agent);
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(` ${agent}`));
                agentRadioGroup.appendChild(label);
            });
        }

        // ========== SELECT AGENT: LOAD WEAPON SYSTEMS ==========
        async function selectAgent(agent) {
            currentAgent = agent;
            statusMsg.innerHTML = `⏳ Loading weapon systems for ${agent}...`;
            weaponListContainer.innerHTML = '<div class="loading">Loading weapon systems...</div>';
            
            try {
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", agent)
                    .get();
                
                const weaponSet = new Set();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.weaponSystem) {
                        weaponSet.add(data.weaponSystem);
                    }
                });
                
                weaponSystems = Array.from(weaponSet).sort();
                
                if (weaponSystems.length === 0) {
                    weaponListContainer.innerHTML = '<div style="color:#5c7882; text-align:center; padding:20px;">No weapon systems found for this agent</div>';
                    statusMsg.innerHTML = `<span class="error">⚠️ No weapon systems for ${agent}</span>`;
                } else {
                    renderWeaponList();
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${weaponSystems.length} weapon system(s) for ${agent}</span>`;
                }
            } catch (error) {
                console.error("Error loading weapon systems:", error);
                weaponListContainer.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                statusMsg.innerHTML = `<span class="error">❌ Failed to load weapon systems</span>`;
            }
        }

        // Render weapon systems with dropdown and rename input
        function renderWeaponList() {
            weaponListContainer.innerHTML = '';
            
            weaponSystems.forEach((weapon, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'weapon-item';
                
                // Left side: Dropdown (for selection, but we just display the weapon name)
                // Since user wants dropdown field, we'll make a dropdown with the current weapon as selected
                const leftDiv = document.createElement('div');
                leftDiv.className = 'weapon-left';
                
                const select = document.createElement('select');
                // Populate with all weapon systems for this agent (or just the current one)
                weaponSystems.forEach(w => {
                    const option = document.createElement('option');
                    option.value = w;
                    option.textContent = w;
                    if (w === weapon) option.selected = true;
                    select.appendChild(option);
                });
                select.onchange = (e) => {
                    // Update the corresponding rename input with the selected weapon
                    const renameInput = rightDiv.querySelector('input');
                    if (renameInput) renameInput.value = e.target.value;
                };
                
                leftDiv.appendChild(select);
                
                // Right side: Input field for new name + rename button
                const rightDiv = document.createElement('div');
                rightDiv.className = 'weapon-right';
                
                const renameInput = document.createElement('input');
                renameInput.type = 'text';
                renameInput.placeholder = 'New weapon name';
                renameInput.value = weapon;
                
                const renameBtn = document.createElement('button');
                renameBtn.textContent = 'RENAME';
                renameBtn.className = 'rename-btn';
                renameBtn.onclick = () => updateWeaponName(weapon, renameInput.value.trim(), select);
                
                rightDiv.appendChild(renameInput);
                rightDiv.appendChild(renameBtn);
                
                itemDiv.appendChild(leftDiv);
                itemDiv.appendChild(rightDiv);
                weaponListContainer.appendChild(itemDiv);
            });
        }

        // ========== UPDATE WEAPON NAME IN ALL MISSION ORDERS ==========
        async function updateWeaponName(oldName, newName, selectElement) {
            if (!currentAgent) {
                statusMsg.innerHTML = '<span class="error">❌ No agent selected</span>';
                return;
            }
            
            if (!newName || newName === '') {
                statusMsg.innerHTML = '<span class="error">❌ New weapon name cannot be empty</span>';
                return;
            }
            
            if (newName === oldName) {
                statusMsg.innerHTML = '<span class="error">⚠️ New name is same as old name</span>';
                return;
            }
            
            // Confirm
            if (!confirm(`Rename "${oldName}" to "${newName}" for agent ${currentAgent}?\n\nThis will update ALL mission orders with this weapon system.`)) {
                return;
            }
            
            statusMsg.innerHTML = `⏳ Updating "${oldName}" → "${newName}" for ${currentAgent}...`;
            
            try {
                // Find all mission orders with this agent and weaponSystem
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", currentAgent)
                    .where("weaponSystem", "==", oldName)
                    .get();
                
                if (snapshot.empty) {
                    statusMsg.innerHTML = `<span class="error">❌ No mission orders found with weapon "${oldName}"</span>`;
                    return;
                }
                
                let updateCount = 0;
                const batch = db.batch();
                
                snapshot.forEach(doc => {
                    const docRef = db.collection("mission_orders").doc(doc.id);
                    batch.update(docRef, { weaponSystem: newName });
                    updateCount++;
                });
                
                await batch.commit();
                
                // Update local array and re-render
                const index = weaponSystems.indexOf(oldName);
                if (index !== -1) weaponSystems[index] = newName;
                
                // Update the dropdown options
                if (selectElement) {
                    // Update all select elements in the weapon list
                    document.querySelectorAll('.weapon-left select').forEach(select => {
                        for (let i = 0; i < select.options.length; i++) {
                            if (select.options[i].value === oldName) {
                                select.options[i].value = newName;
                                select.options[i].textContent = newName;
                            }
                        }
                    });
                }
                
                renderWeaponList(); // Re-render to reflect changes
                statusMsg.innerHTML = `<span class="success">✅ SUCCESS: Renamed "${oldName}" → "${newName}" (${updateCount} mission(s) updated)</span>";
                
            } catch (error) {
                console.error("Error updating weapon name:", error);
                statusMsg.innerHTML = `<span class="error">❌ ERROR: ${error.message}</span>`;
            }
        }

        // ========== INIT ==========
        loadAgents();
    </script>
</body>
</html>
