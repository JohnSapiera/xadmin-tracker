<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>CORE_DASH_v28_FIXED</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #02080a; --panel: rgba(5, 15, 20, 0.9); --cyan: #00f3ff; 
            --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
            --green: #05ffa1; --yellow: #ffbd00; --border: rgba(0, 243, 255, 0.2);
            --font-mono: 'Share Tech Mono', monospace; --font-main: 'Rajdhani', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #e1f5f9; font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { padding: 15px 20px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
        .status-bar { font-size: 11px; padding: 8px 20px; background: rgba(0,243,255,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }
        main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }
        .command-module { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 4px; }
        #mission-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--cyan); color: #fff; font-family: var(--font-mono); font-size: 45px; text-align: center; outline: none; margin-bottom: 5px; letter-spacing: 5px; }
        #mission-status { font-family: var(--font-mono); font-size: 12px; text-align: center; height: 15px; margin-bottom: 15px; font-weight: bold; }
        .status-reserved { color: var(--yellow); animation: blink 1s infinite; }
        .status-deployed { color: var(--green); }
        @keyframes blink { 50% { opacity: 0.3; } }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { height: 50px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; font-family: var(--font-main); font-size: 14px; }
        .btn-save { background: var(--green); color: #000; }
        .btn-retrieve { background: var(--blue); color: #fff; }
        .btn-reserve { background: transparent; color: #fff; border: 1px solid #fff; opacity: 0.3; pointer-events: none; }
        .btn-reserve.active { opacity: 1; pointer-events: auto; border-color: var(--yellow); color: var(--yellow); }
        #terminal { background: rgba(0,0,0,0.9); border-left: 3px solid var(--cyan); padding: 12px; font-family: var(--font-mono); font-size: 10px; height: 180px; overflow-y: auto; color: #9ab4bc; box-shadow: inset 0 0 15px #000; }
        .term-line { margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.02); line-height: 1.4; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .popup { width: 100%; max-width: 350px; background: #051014; border: 1px solid var(--cyan); padding: 25px; }
        .pop-input { width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--green); padding: 10px; text-align: center; font-size: 18px; margin-bottom: 15px; font-family: var(--font-mono); }
        .weapon-selector { display: grid; gap: 8px; margin-bottom: 20px; max-height: 120px; overflow-y: auto; }
        .weapon-btn { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; font-size: 11px; text-align: left; cursor: pointer; }
        .weapon-btn.selected { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); animation: highlight 0.5s infinite alternate; }
        @keyframes highlight { from { box-shadow: 0 0 2px var(--cyan); } to { box-shadow: 0 0 8px var(--cyan); } }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #5c7882; text-decoration: none; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--cyan); border-top: 2px solid var(--cyan); }
    </style>
</head>
<body>

<header><span style="font-weight: 700; color: #fff;">CORE_DASH_FIXED</span></header>
<div class="status-bar">
    <div>SYS_TIME: <span id="clock">00:00:00</span></div>
    <div style="color: var(--green);">DATA_SYNC_ACTIVE</div>
</div>

<main>
    <div class="command-module">
        <input type="tel" id="mission-input" placeholder="0000" maxlength="5">
        <div id="mission-status"></div>
        <div class="btn-row">
            <button id="action-btn" class="btn btn-save">SAVE</button>
            <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
        </div>
    </div>
    <div id="terminal"></div>
</main>

<nav class="bottom-nav">
    <a href="#" class="nav-item active">DASHBOARD</a>
    <a href="intel.html" class="nav-item">INTEL</a>
    <a href="profile.html" class="nav-item">PROFILE</a>
</nav>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div id="pop-id-display" style="color:var(--cyan); text-align:center; margin-bottom:15px; font-size:24px; font-weight:700;">#ID</div>
        <div id="form-ui">
            <label style="font-size:10px; color:var(--cyan)">vAGENT#:</label>
            <input type="text" id="v-agent-input" class="pop-input" placeholder="vAgentID">
            <label style="font-size:10px; color:var(--cyan)">WEAPON SYSTEM:</label>
            <div class="weapon-selector" id="weapon-list"></div>
            <div id="pop-expense-div" style="display:none; text-align:right; font-size:12px; margin-bottom:10px;">
                EXPENSES: <span id="pop-total-val" style="color:var(--green)">₱ 0.00</span>
            </div>
        </div>
        <div id="reserve-ui" style="display:none; text-align:center; padding:20px; color:var(--yellow); font-weight:bold;">
            SEND TO RESERVE LIST?
        </div>
        <div class="btn-row">
            <button id="modal-submit" class="btn btn-save">DEPLOY</button>
            <button onclick="closePopup()" class="btn" style="background:#333; color:#fff;">DECLINE</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, orderBy, limit, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const currentAgent = localStorage.getItem("cia_agent") || "AGENT_LZ";
    const input = document.getElementById('mission-input');
    const actionBtn = document.getElementById('action-btn');
    const reserveBtn = document.getElementById('reserve-btn');
    const terminal = document.getElementById('terminal');
    const statusLabel = document.getElementById('mission-status');
    const weaponList = document.getElementById('weapon-list');

    const fullWeaponMap = { "SIG-20452634": "REDMI NOTE 14 PRO", "SIG-5B0D3A5C": "REALME 8 PRO", "SIG-6AC68A2E": "LAPTOP ACER" };
    let selectedWeapon = "";

    // --- LOGS SYSTEM ---
    async function logActivity(msg, color) {
        const div = document.createElement('div');
        div.className = "term-line";
        div.innerHTML = `<span style="color:#5c7882">[${new Date().toLocaleTimeString()}]</span> <span style="color:${color}">${msg}</span>`;
        terminal.prepend(div);
        await addDoc(collection(db, "terminal_logs"), { agent: currentAgent, message: msg, color: color, timestamp: serverTimestamp() });
    }

    async function loadLogs() {
        const q = query(collection(db, "terminal_logs"), where("agent", "==", currentAgent), orderBy("timestamp", "desc"), limit(10));
        const snap = await getDocs(q);
        terminal.innerHTML = "";
        snap.forEach(d => {
            const data = d.data();
            const div = document.createElement('div');
            div.className = "term-line";
            div.innerHTML = `<span style="color:#5c7882">[LOG]</span> <span style="color:${data.color}">${data.message}</span>`;
            terminal.appendChild(div);
        });
    }
    loadLogs();

    // --- SEARCH LOGIC ---
    input.addEventListener('input', async () => {
        const val = input.value.trim();
        if (val.length < 4) { statusLabel.innerHTML = ""; return; }
        
        const qM = query(collection(db, "mission_orders"), where("missionID", "==", val));
        const qR = query(collection(db, "reserve_list"), where("missionID", "==", val));
        
        const [snapM, snapR] = await Promise.all([getDocs(qM), getDocs(qR)]);

        if (!snapM.empty) {
            actionBtn.className = "btn btn-retrieve"; actionBtn.textContent = "RETRIEVE";
            reserveBtn.classList.remove('active');
            const data = snapM.docs[0].data();
            statusLabel.innerHTML = data.vAgentID ? '<span class="status-deployed">DEPLOYED</span>' : "";
        } else if (!snapR.empty) {
            actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
            reserveBtn.classList.remove('active');
            statusLabel.innerHTML = '<span class="status-reserved">RESERVED</span>';
        } else {
            actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
            reserveBtn.classList.add('active');
            statusLabel.innerHTML = "";
        }
    });

    // --- POPUP LOGIC ---
    actionBtn.onclick = async () => {
        if (input.value.length < 4) return;
        const id = input.value;
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('pop-id-display').innerText = `#${id}`;
        document.getElementById('form-ui').style.display = "block";
        document.getElementById('reserve-ui').style.display = "none";
        document.getElementById('v-agent-input').value = "";
        selectedWeapon = "";

        // Load Weapons
        weaponList.innerHTML = "";
        Object.keys(fullWeaponMap).forEach(key => {
            const b = document.createElement('button');
            b.className = "weapon-btn";
            b.id = `w-${key}`;
            b.innerText = `> ${fullWeaponMap[key]}`;
            b.onclick = () => {
                document.querySelectorAll('.weapon-btn').forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                selectedWeapon = key;
            };
            weaponList.appendChild(b);
        });

        if (actionBtn.textContent === "RETRIEVE") {
            const dRef = doc(db, "mission_orders", id);
            const dSnap = await getDoc(dRef);
            if (dSnap.exists()) {
                const d = dSnap.data();
                document.getElementById('v-agent-input').value = d.vAgentID || "";
                document.getElementById('pop-expense-div').style.display = "block";
                document.getElementById('pop-total-val').innerText = `₱ ${(d.totalExpenses || 0).toLocaleString()}`;
                if (d.weaponSystem) {
                    selectedWeapon = d.weaponSystem;
                    setTimeout(() => document.getElementById(`w-${d.weaponSystem}`)?.classList.add('selected'), 100);
                }
            }
        }

        document.getElementById('modal-submit').onclick = async () => {
            const vID = document.getElementById('v-agent-input').value;
            if (!vID || !selectedWeapon) return alert("Fill all fields");
            
            const dep = new Date();
            const rel = new Date(); rel.setDate(dep.getDate() + 30);

            await setDoc(doc(db, "mission_orders", id), {
                missionID: id, agent: currentAgent, vAgentID: vID,
                weaponSystem: selectedWeapon, deploymentDate: dep.toISOString(),
                relieveDate: rel.toISOString(), timestamp: serverTimestamp()
            }, { merge: true });

            await logActivity(`MISSION #${id} DEPLOYED TO ${vID}`, 'var(--green)');
            closePopup();
            input.value = "";
        };
    };

    reserveBtn.onclick = () => {
        const id = input.value;
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('form-ui').style.display = "none";
        document.getElementById('reserve-ui').style.display = "block";
        document.getElementById('modal-submit').innerText = "YES";

        document.getElementById('modal-submit').onclick = async () => {
            await setDoc(doc(db, "reserve_list", id), { missionID: id, agent: currentAgent, timestamp: serverTimestamp() });
            await logActivity(`MISSION #${id} RESERVED`, 'var(--yellow)');
            closePopup();
            input.value = "";
        };
    };

    window.closePopup = () => document.getElementById('modal-overlay').style.display = 'none';
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
