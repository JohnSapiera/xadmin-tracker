<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v21.0_SYNC</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #02080a; --panel: rgba(5, 15, 20, 0.85); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
      --green: #05ffa1; --border: rgba(0, 243, 255, 0.2);
      --font-main: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
        background: var(--bg); color: #e1f5f9; font-family: var(--font-main); 
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        background-image: 
            radial-gradient(circle at 50% 50%, #0a252e 0%, #02080a 100%),
            linear-gradient(var(--border) 1px, transparent 1px), 
            linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    body::after { content: ""; position: fixed; inset: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1000; opacity: 0.3; }

    header { 
        padding: 18px 20px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--cyan); 
        display: flex; justify-content: space-between; align-items: center; z-index: 100;
    }
    .profile-link { 
        background: var(--cyan-dim); border: 1px solid var(--cyan); color: var(--cyan); 
        font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; 
        padding: 6px 12px; text-decoration: none; font-weight: bold;
    }

    .status-bar { 
        font-size: 11px; padding: 10px 20px; background: rgba(0,0,0,0.5); 
        border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; 
        color: var(--cyan); font-family: var(--font-mono);
    }

    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; display: flex; flex-direction: column; gap: 20px; }
    
    .command-module { 
        background: var(--panel); border: 1px solid var(--border); padding: 25px; 
        position: relative; backdrop-filter: blur(10px);
        clip-path: polygon(0 0, 100% 0, 100% 90%, 92% 100%, 0 100%);
    }

    #mission-input { 
        width: 100%; background: rgba(0,0,0,0.6); border: none; border-bottom: 2px solid var(--cyan);
        color: #fff; font-family: var(--font-mono); font-size: 55px; font-weight: 700; padding: 15px 0; 
        text-align: center; letter-spacing: 12px; outline: none; margin-bottom: 20px;
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { 
        height: 55px; font-family: var(--font-main); font-size: 18px; font-weight: 700; 
        text-transform: uppercase; letter-spacing: 1px; border: none; cursor: pointer; transition: 0.2s; 
    }
    .btn-save { background: var(--green); color: #01080a; }
    .btn-retrieve { background: var(--blue); color: #fff; }
    .btn-reserve { background: transparent; color: #fff; border: 1px solid #fff; opacity: 0.8; }
    .btn-faded { opacity: 0.2 !important; pointer-events: none; }

    #terminal { 
        background: rgba(0,0,0,0.7); border-left: 3px solid var(--cyan); 
        padding: 15px; font-family: var(--font-mono); font-size: 11px; 
        height: 180px; color: #9ab4bc; overflow-y: auto; line-height: 1.5;
        display: flex; flex-direction: column;
    }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(1, 4, 5, 0.98); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .popup { 
        width: 100%; max-width: 380px; background: #051014; border: 1px solid var(--cyan); 
        padding: 25px; position: relative;
    }
    .pop-title { font-size: 48px; color: var(--cyan); text-align: center; font-weight: 700; font-family: var(--font-main); letter-spacing: -2px; }
    
    .data-card { background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
    .data-label { color: #5c7882; text-transform: uppercase; font-size: 11px; font-family: var(--font-mono); }
    
    .pop-input { 
        background: #000; border: 1px solid var(--cyan); color: var(--green); 
        font-family: var(--font-mono); font-size: 16px; padding: 8px; width: 150px; text-align: right; outline: none;
    }

    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
    .dev-btn { 
        background: #08161b; border: 1px solid #1a2f37; color: #5c7882; padding: 12px; 
        font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; cursor: pointer;
    }
    .dev-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }

    .pop-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tactical-btn { height: 50px; font-family: var(--font-main); font-size: 18px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; }
    .btn-confirm { background: var(--green); color: #000; }
    .btn-abort { background: transparent; color: var(--red); border: 1px solid var(--red); }

    nav { 
        position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; 
        border-top: 2px solid var(--cyan); display: grid; grid-template-columns: 1fr 1fr; z-index: 90; 
    }
    .nav-btn { 
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
        color: #4a5a61; font-size: 11px; text-decoration: none; font-family: var(--font-mono);
    }
    .nav-btn.active { color: var(--cyan); background: var(--cyan-dim); font-weight: bold; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="width:4px; height:20px; background:var(--cyan);"></div>
    <span style="font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 1px;">CORE_DASH</span>
  </div>
  <a href="profile.html" class="profile-link">ID:AGENT_SECURE</a>
</header>

<div class="status-bar">
    <div style="display:flex; gap:15px">
        <span id="clock">00:00:00</span>
        <span style="color:var(--border)">|</span>
        <span>DEVICE: <span id="sync-device-name" style="color:#fff">IDENTIFYING...</span></span>
    </div>
    <span>UPLINK: <span style="color:var(--green)">SYNC_ACTIVE</span></span>
</div>

<main>
  <div class="command-module">
    <div style="font-size: 10px; color: var(--cyan); margin-bottom: 10px; font-family:var(--font-mono)">// ENTER_TARGET_ID</div>
    <input type="tel" id="mission-input" placeholder="----" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
    </div>
  </div>
  
  <div id="terminal"></div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div class="pop-title" id="pop-m-id">#0000</div>
        <div class="pop-subtitle" id="pop-agent" style="text-align:center; font-size:10px; color:#5c7882; margin-bottom:20px;">AGENT_NAME</div>
        
        <div class="data-card">
            <div class="data-row">
                <span class="data-label">V_AGENT_NO:</span> 
                <input type="text" id="v-agent-input" class="pop-input" placeholder="ENTER NO">
            </div>
            <div class="data-row">
                <span class="data-label">EXPENSES:</span> 
                <input type="text" id="expenses-input" class="pop-input" value="PHP 0.00">
            </div>
            <div class="data-row"><span class="data-label">DEPLOY:</span> <span id="pop-dep" style="color:#fff">--/--</span></div>
            <div class="data-row"><span class="data-label">RELIEVE:</span> <span id="pop-rel" style="color:#fff">--/--</span></div>
        </div>

        <div class="data-label" style="margin-bottom:5px">Weapon System (Locked):</div>
        <div class="device-grid" id="device-list">
            </div>
        
        <div class="pop-btn-row">
            <button onclick="submitMission()" class="tactical-btn btn-confirm">UPLINK</button>
            <button onclick="closePopup()" class="tactical-btn btn-abort">CANCEL</button>
        </div>
    </div>
</div>

<div class="overlay" id="success-screen" style="flex-direction: column; background: var(--bg); z-index: 9999;">
    <div style="font-size: 60px; color: var(--green); margin-bottom: 10px;">⚡</div>
    <div style="color:#fff; font-size:20px; font-weight:700; letter-spacing:4px;" id="success-msg">DATABASE_UPDATED</div>
    <button onclick="location.reload()" class="btn btn-save" style="margin-top: 50px; width: 220px;">CONTINUE</button>
</div>

<nav>
    <a href="#" class="nav-btn active">DASHBOARD</a>
    <a href="intel.html" class="nav-btn">INTEL_LOGS</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const weaponMap = {
    "SIG-3A14D65A": "REDMI NOTE 14 PRO 5G",
    "SIG-5B0D3A5C": "REALME 8 PRO",
    "SIG-82A9E4B": "SAMSUNG S23 ULTRA",
    "SIG-X921FFA": "IPHONE 15 PRO",
    "SIG-K882190": "POCO X6 PRO",
    "SIG-V001122": "VIVO V30"
  };

  const currentAgent = localStorage.getItem("cia_agent") || "AUTHORIZED_AGENT";
  const getWeaponName = (sigID) => {
    if (!sigID || sigID === "N/A") return "NOT_SELECTED";
    return weaponMap[sigID] || sigID;
  };

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const reserveBtn = document.getElementById('reserve-btn');
  const termLog = document.getElementById('terminal');
  const syncDisplay = document.getElementById('sync-device-name');
  
  let selectedDevice = "N/A"; // I-store ang detected device signature
  let isRetrieveMode = false;
  let sourceCollection = "mission_orders";

  // --- DEVICE TRACER LOGIC (AUTOMATIC ON LOAD) ---
  async function traceDevice() {
      // Kunin ang signature na ginamit sa index.html
      const localSig = localStorage.getItem("device_signature");
      
      if (!localSig) {
          syncDisplay.innerText = "NO_SIGNATURE_FOUND";
          return;
      }

      try {
          // I-check sa DB kung ang signature ay naka-link sa Agent
          const q = query(collection(db, "agents"), where("agentName", "==", currentAgent));
          const snap = await getDocs(q);

          if (!snap.empty) {
              const sigs = snap.docs[0].data().linkedSignatures || [];
              const sigArray = Array.isArray(sigs) ? sigs : [sigs];

              if (sigArray.includes(localSig)) {
                  selectedDevice = localSig;
                  syncDisplay.innerText = getWeaponName(localSig);
                  await log(`DEVICE_MATCH: ${getWeaponName(localSig)}`, 'var(--green)');
              } else {
                  syncDisplay.innerText = "UNAUTHORIZED_HW";
                  await log(`HW_MISMATCH_DETECTED`, 'var(--red)');
              }
          }
      } catch (e) { console.error(e); }
  }
  traceDevice();

  const log = async (msg, color = "#5c7882") => {
    try {
        await addDoc(collection(db, "terminal_logs"), {
            timestamp: serverTimestamp(),
            message: msg,
            color: color,
            agent: currentAgent,
            targetID: input.value || "SYSTEM"
        });
    } catch (e) {}
  };

  const initTerminal = () => {
    const q = query(collection(db, "terminal_logs"), orderBy("timestamp", "desc"), limit(15));
    onSnapshot(q, (snapshot) => {
        termLog.innerHTML = "";
        snapshot.forEach((doc) => {
            const data = doc.data();
            const timeStr = data.timestamp ? data.timestamp.toDate().toLocaleTimeString('en-GB') : "SYNC";
            const d = document.createElement('div');
            d.innerHTML = `<span style="opacity:0.4">${timeStr}</span> > <span style="color:${data.color}">${data.message}</span>`;
            termLog.appendChild(d);
        });
    });
  };
  initTerminal();

  input.addEventListener('input', async () => {
    const val = input.value.trim();
    isRetrieveMode = false;
    actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
    reserveBtn.disabled = false; reserveBtn.classList.remove('btn-faded');

    if (val.length >= 4) {
        try {
            const qOrders = query(collection(db, "mission_orders"), where("missionID", "==", val));
            const qBlack = query(collection(db, "blacklist"), where("targetID", "==", val));
            const [snapOrders, snapBlack] = await Promise.all([getDocs(qOrders), getDocs(qBlack)]);

            if (!snapOrders.empty || !snapBlack.empty) {
                isRetrieveMode = true;
                reserveBtn.disabled = true; reserveBtn.classList.add('btn-faded');
                actionBtn.className = "btn btn-retrieve"; actionBtn.textContent = "RETRIEVE";
                
                if (!snapBlack.empty) { sourceCollection = "blacklist"; await log(`ALERT: BLACKLIST`, 'var(--red)'); }
                else { sourceCollection = "mission_orders"; await log(`RECORD FOUND`, 'var(--green)'); }
            }
        } catch (e) {}
    }
  });

  actionBtn.onclick = async () => {
    if (input.value.length < 4) return;
    
    document.getElementById('pop-agent').innerText = currentAgent;
    document.getElementById('pop-m-id').innerText = `#${input.value}`;

    // Ipakita lang ang Detected Device sa Popup (Locked)
    const devGrid = document.getElementById('device-list');
    devGrid.innerHTML = "";
    const b = document.createElement('button');
    b.className = `dev-btn active`;
    b.innerText = getWeaponName(selectedDevice);
    devGrid.appendChild(b);

    if (isRetrieveMode) {
        const idField = sourceCollection === "mission_orders" ? "missionID" : "targetID";
        const q = query(collection(db, sourceCollection), where(idField, "==", input.value));
        const snap = await getDocs(q);
        const data = snap.docs[0].data();
        document.getElementById('v-agent-input').value = data.vAgentID === "RESERVED" ? "" : (data.vAgentID || "");
        document.getElementById('expenses-input').value = data.expenses || "PHP 0.00";
        document.getElementById('pop-dep').innerText = data.deploymentDate ? data.deploymentDate.toDate().toLocaleDateString('en-US', {month:'short', day:'2-digit'}) : "--/--";
        document.getElementById('pop-rel').innerText = data.relieveDate ? data.relieveDate.toDate().toLocaleDateString('en-US', {month:'short', day:'2-digit'}) : "--/--";
    } else {
        const now = new Date(); const rel = new Date(); rel.setDate(now.getDate() + 30);
        document.getElementById('pop-dep').innerText = now.toLocaleDateString('en-US', {month:'short', day:'2-digit'});
        document.getElementById('pop-rel').innerText = rel.toLocaleDateString('en-US', {month:'short', day:'2-digit'});
        document.getElementById('v-agent-input').value = "";
        document.getElementById('expenses-input').value = "PHP 0.00";
    }
    document.getElementById('modal-overlay').style.display = 'flex';
  };

  window.closePopup = () => document.getElementById('modal-overlay').style.display = 'none';

  window.submitMission = async () => {
    const vId = document.getElementById('v-agent-input').value;
    const exp = document.getElementById('expenses-input').value;
    if(!vId) return alert("V_AGENT_NO REQUIRED");
    if(selectedDevice === "N/A") return alert("HARDWARE NOT IDENTIFIED");
    
    try {
        await log(`SYNCING TO DB...`, 'var(--cyan)');
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value,
            agentName: currentAgent,
            vAgentID: vId,
            weaponSystem: selectedDevice, // Ginagamit ang auto-detected signature
            expenses: exp,
            deploymentDate: serverTimestamp(),
            relieveDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000),
            status: "ACTIVE"
        }, { merge: true });
        
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('success-screen').style.display = 'flex';
    } catch (e) { await log("UPLOAD_FAIL", "red"); }
  };

  reserveBtn.onclick = async () => {
    if (input.value.length < 4 || reserveBtn.disabled) return;
    try {
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value, 
            agentName: currentAgent,
            vAgentID: "RESERVED", weaponSystem: selectedDevice, status: "RESERVED",
            deploymentDate: serverTimestamp(), 
            relieveDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000)
        }, { merge: true });
        document.getElementById('success-msg').innerText = "ID_RESERVED";
        document.getElementById('success-screen').style.display = 'flex';
    } catch (e) {}
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
