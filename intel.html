<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>INTEL_CORE_v4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --cia-bg: #00080b;
            --cia-cyan: #00f3ff;
            --cia-cyan-dim: rgba(0, 243, 255, 0.2);
            --cia-red: #ff003c;
            --cia-green: #00ff66;
            --font-main: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-main); 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; pointer-events: none; z-index: -1;
        }

        header { padding: 15px; border-bottom: 1px solid var(--cia-cyan-dim); text-align: center; background: rgba(0, 10, 15, 0.9); }
        .intel-title { font-family: var(--font-mono); color: var(--cia-cyan); font-size: 11px; letter-spacing: 4px; text-shadow: 0 0 10px var(--cia-cyan); }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .agent-id-card {
            text-align: center; border: 1px solid var(--cia-cyan-dim); padding: 30px;
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px);
            position: relative; width: 100%; max-width: 320px;
        }
        .agent-id-card::before { content: "AGENT_VERIFIED"; position: absolute; top: -10px; left: 10px; background: var(--cia-cyan); color: #000; font-size: 9px; padding: 2px 8px; font-weight: bold; }

        .agent-name { font-size: 42px; font-weight: 700; text-transform: uppercase; margin: 10px 0; letter-spacing: 2px; color: #fff; }

        .report-btn { 
            margin-top: 30px; background: none; border: 1px solid var(--cia-cyan); 
            color: var(--cia-cyan); width: 220px; height: 55px; font-family: var(--font-mono); 
            font-size: 13px; font-weight: bold; cursor: pointer; position: relative;
            transition: 0.3s; overflow: hidden;
        }
        .report-btn::after { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.2), transparent); transition: 0.5s; }
        .report-btn:hover::after { left: 100%; }
        .report-btn:active { background: var(--cia-cyan-dim); transform: translateY(2px); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0, 5, 10, 0.85); backdrop-filter: blur(8px); z-index: 1000; }
        
        .modal-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 360px; background: rgba(0, 20, 30, 0.95); 
            border: 1px solid var(--cia-cyan); padding: 25px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
        }

        .modal-box::after { content: ""; position: absolute; bottom: 0; right: 0; width: 40px; height: 40px; border-right: 3px solid var(--cia-cyan); border-bottom: 3px solid var(--cia-cyan); }
        .modal-box::before { content: ""; position: absolute; top: 0; left: 0; width: 40px; height: 40px; border-left: 3px solid var(--cia-cyan); border-top: 3px solid var(--cia-cyan); }

        .scan-status-bar { 
            font-family: var(--font-mono); font-size: 10px; color: var(--cia-cyan); 
            text-align: center; margin-bottom: 20px; text-transform: uppercase;
            border-bottom: 1px solid var(--cia-cyan-dim); padding-bottom: 10px;
        }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-label { font-size: 10px; color: var(--cia-cyan); margin-bottom: 5px; display: block; letter-spacing: 1px; opacity: 0.8; }
        
        .intel-input { 
            width: 100%; background: rgba(0, 243, 255, 0.05); border: 1px solid var(--cia-cyan-dim); 
            padding: 12px; color: #fff; font-family: var(--font-mono); font-size: 20px; outline: none; text-align: center;
        }
        .intel-input:focus { border-color: var(--cia-cyan); background: rgba(0, 243, 255, 0.1); }

        .weapon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .weapon-grid.single-mode { grid-template-columns: 1fr; }

        .weapon-card { 
            padding: 12px; border: 1px solid var(--cia-cyan-dim); background: rgba(255,255,255,0.02); 
            font-size: 11px; text-align: center; cursor: pointer; color: var(--cia-cyan); 
            font-family: var(--font-mono); text-transform: uppercase;
        }
        .weapon-card.selected { 
            background: var(--cia-cyan); color: #000; border-color: var(--cia-cyan); font-weight: bold;
            box-shadow: 0 0 15px var(--cia-cyan-dim);
        }

        .btn-transmit { 
            width: 100%; padding: 16px; background: var(--cia-cyan); color: #000; 
            border: none; font-family: var(--font-mono); font-size: 13px; font-weight: 900; 
            cursor: pointer; margin-top: 10px; letter-spacing: 2px;
        }
        .btn-transmit:disabled { background: #111; color: #444; cursor: not-allowed; border: 1px solid #222; }

        .abort-link { width: 100%; background: transparent; color: var(--cia-red); border: none; margin-top: 15px; font-family: var(--font-mono); font-size: 10px; cursor: pointer; opacity: 0.6; }
        .abort-link:hover { opacity: 1; text-decoration: underline; }

        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid var(--cia-cyan-dim); display: grid; grid-template-columns: 1fr 1fr; }
        .nav-link { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-family: var(--font-mono); text-decoration: none; font-size: 11px; }
        .nav-link.active { color: var(--cia-cyan); background: linear-gradient(0deg, rgba(0, 243, 255, 0.1), transparent); }
    </style>
</head>
<body>

<header><div class="intel-title">SECURE_INTEL_UPLINK_v4.0</div></header>

<main>
    <div class="agent-id-card">
        <div style="font-size: 10px; color: var(--cia-cyan); opacity: 0.5;">ACTIVE_SESSION</div>
        <div id="display-name" class="agent-name">---</div>
        <div style="font-size: 11px; color: var(--cia-cyan); font-family: var(--font-mono); letter-spacing: 2px;">ENCRYPTION_LEVEL_5</div>
    </div>
    
    <button class="report-btn" onclick="openReport()">[ INITIATE_DATA_STREAM ]</button>
</main>

<div id="report-modal" class="modal">
    <div class="modal-box">
        <div class="scan-status-bar" id="scan-status">AWAITING_LOCAL_IDENTIFIER...</div>

        <div class="input-group">
            <span class="input-label">V_AGENT_SERIAL_ID</span>
            <input type="text" id="vAgentInput" class="intel-input" placeholder="0000" oninput="handleDualSearch(this.value)">
        </div>

        <div id="weapon-selection-zone" style="display:none; margin-bottom:15px;">
            <span class="input-label">SYSTEM_LOCKED:</span>
            <div id="weapon-grid" class="weapon-grid"></div>
        </div>

        <div class="input-group">
            <span class="input-label">TRANSMISSION_VALUE (PHP)</span>
            <input type="number" id="expensesInput" class="intel-input" placeholder="0.00" oninput="validateForm()">
        </div>

        <button id="transmit-btn" onclick="transmitData()" class="btn-transmit" disabled>ESTABLISH_CONNECTION</button>
        <button onclick="closeReport()" class="abort-link">// TERMINATE_PROCESS</button>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link"><span>DASHBOARD</span></a>
    <a href="#" class="nav-link active"><span>INTEL</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, increment, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let selectedDeviceName = null; // Ito ang raw SIG-XXX na ise-save sa DB
    let displayDeviceName = null;  // Ito ang readable name para sa Button UI

    // --- WEAPON MAP SYNC ---
    const weaponMap = {
        "SIG-3A14D65A": "REDMI NOTE 14 PRO 5G",
        "SIG-5B0D3A5C": "REALME 8 PRO",
        "SIG-82A9E4B": "SAMSUNG S23 ULTRA",
        "SIG-X921FFA": "IPHONE 15 PRO",
        "SIG-K882190": "POCO X6 PRO",
        "SIG-V001122": "VIVO V30"
    };

    const getReadableName = (sig) => weaponMap[sig] || sig;

    window.onload = () => {
        const agent = localStorage.getItem("cia_agent");
        if (!agent) { window.location.href = "index.html"; return; }
        document.getElementById('display-name').innerText = agent;
    };

    window.handleDualSearch = async (val) => {
        const currentAgent = localStorage.getItem("cia_agent");
        const status = document.getElementById('scan-status');
        const grid = document.getElementById('weapon-grid');
        const zone = document.getElementById('weapon-selection-zone');
        const cleanVal = val.trim();

        if(cleanVal.length < 1) { 
            zone.style.display = "none"; 
            selectedDeviceName = null;
            validateForm();
            return; 
        }

        try {
            const agentQ = query(collection(db, "agents"), where("agentName", "==", currentAgent));
            const agentSnap = await getDocs(agentQ);
            if (agentSnap.empty) { status.innerText = "ACCESS_DENIED_UNAUTHORIZED"; return; }

            const queries = [
                query(collection(db, "mission_orders"), where("agentName", "==", currentAgent), where("vAgentID", "==", cleanVal)),
                query(collection(db, "mission_orders"), where("agentName", "==", currentAgent), where("vAgentID", "==", Number(cleanVal)))
            ];

            let foundDocs = [];
            for (let q of queries) {
                const snap = await getDocs(q);
                if (!snap.empty) {
                    snap.forEach(d => {
                        const data = d.data();
                        // Iwasan ang duplicate entries sa UI
                        if(!foundDocs.some(item => item.weaponSystem === data.weaponSystem)) {
                             foundDocs.push(data);
                        }
                    });
                    break;
                }
            }

            if (foundDocs.length > 0) {
                zone.style.display = "block";
                grid.innerHTML = "";
                if (foundDocs.length === 1) grid.classList.add('single-mode');
                else grid.classList.remove('single-mode');

                foundDocs.forEach((data, index) => {
                    const card = document.createElement('div');
                    card.className = 'weapon-card';
                    card.id = "card-" + index;
                    
                    // RENAME LOGIC HERE:
                    const readable = getReadableName(data.weaponSystem);
                    card.innerText = readable;
                    
                    card.onclick = () => selectWeapon(card, data.weaponSystem, readable);
                    grid.appendChild(card);
                });

                if (foundDocs.length === 1) {
                    setTimeout(() => {
                        const firstCard = document.getElementById('card-0');
                        const sig = foundDocs[0].weaponSystem;
                        selectWeapon(firstCard, sig, getReadableName(sig));
                        status.innerText = "TARGET_SYNC_COMPLETE";
                        status.style.color = "var(--cia-green)";
                    }, 50);
                } else {
                    selectedDeviceName = null;
                    status.innerText = "MULTIPLE_TARGETS_DETECTED";
                    status.style.color = "var(--cia-cyan)";
                }
            } else {
                status.innerText = "IDENTIFIER_NOT_IN_DATABASE";
                status.style.color = "var(--cia-red)";
                zone.style.display = "none";
                selectedDeviceName = null;
            }
            validateForm();
        } catch (e) { console.error(e); }
    };

    window.selectWeapon = (element, sig, readable) => {
        document.querySelectorAll('.weapon-card').forEach(c => c.classList.remove('selected'));
        if (element) {
            element.classList.add('selected');
            selectedDeviceName = sig;      // For DB saving
            displayDeviceName = readable; // For Button UI
        }
        validateForm();
    };

    window.validateForm = () => {
        const v = document.getElementById('vAgentInput').value;
        const e = document.getElementById('expensesInput').value;
        const btn = document.getElementById('transmit-btn');
        
        if (v && e > 0 && selectedDeviceName) {
            btn.disabled = false;
            // Ipinapakita ang Readable Name sa button habang tina-transmit
            btn.innerText = "UPLINK_TO_" + displayDeviceName.replace(/\s+/g, '_').toUpperCase();
        } else {
            btn.disabled = true;
            btn.innerText = selectedDeviceName ? "ENTER_UPLINK_AMOUNT" : "ESTABLISH_CONNECTION";
        }
    };

    window.transmitData = async () => {
        const v = document.getElementById('vAgentInput').value.trim();
        const e = parseFloat(document.getElementById('expensesInput').value);
        const agent = localStorage.getItem("cia_agent");

        try {
            // Gagamitin pa rin ang SIG-XXX sa reportID para sa database consistency
            const reportID = `${agent}_${selectedDeviceName}_${v}`.replace(/\s+/g, '_');
            const reportRef = doc(db, "bounty_report", reportID);

            await setDoc(reportRef, {
                agentOwner: agent,
                weaponSystem: selectedDeviceName, // Sine-save pa rin ang raw SIG para sa tracing
                vAgentID: v,
                totalExpenses: increment(e),
                lastUpdate: serverTimestamp()
            }, { merge: true });

            await addDoc(collection(db, "bounty_report", reportID, "logs"), {
                amount: e,
                timestamp: serverTimestamp(),
                reportedBy: agent
            });

            alert("UPLINK_SUCCESSFUL: DATA_ENCRYPTED_AND_SENT");
            location.reload();
        } catch (err) { alert("UPLINK_FAILED: CONNECTION_LOST"); }
    };

    window.openReport = () => {
        document.getElementById('report-modal').style.display = 'block';
        document.getElementById('vAgentInput').focus();
    }
    window.closeReport = () => document.getElementById('report-modal').style.display = 'none';
</script>
</body>
</html>
