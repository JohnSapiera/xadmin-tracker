<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENT_PROFILE_ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --paper: #f0f0f0; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; 
            margin: 0; padding: 20px; 
        }
        
        /* Breadcrumbs & Navigation */
        .nav-header { font-size: 12px; color: var(--neon); margin-bottom: 20px; border-bottom: 1px dashed #333; padding-bottom: 10px; }
        .back-btn { cursor: pointer; text-decoration: underline; margin-right: 10px; }

        /* Folder Grid View */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .folder {
            background: #111; border: 1px solid #333; padding: 20px; text-align: center;
            cursor: pointer; transition: 0.3s; position: relative;
        }
        .folder:hover { border-color: var(--neon); background: #1a1a1a; }
        .folder::before { content: "📁"; display: block; font-size: 30px; margin-bottom: 10px; }
        .folder-label { font-size: 11px; font-weight: bold; color: var(--neon); }

        /* OFFICIAL DOCUMENT STYLING */
        .document-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center;
            align-items: center; z-index: 1000; overflow-y: auto; padding: 40px 0;
        }
        .paper {
            background: var(--paper); color: #000; width: 90%; max-width: 500px;
            padding: 40px; box-shadow: 10px 10px 0px rgba(0,242,255,0.3);
            position: relative; border: 1px solid #ccc;
        }
        .doc-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        .doc-title { font-weight: 800; font-size: 18px; text-transform: uppercase; }
        
        .section-title { font-weight: 800; font-size: 12px; border-bottom: 1px solid #000; margin: 20px 0 10px; }
        
        /* Expenses Column Split */
        .expenses-table { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #000; }
        .exp-col { padding: 10px; font-size: 12px; }
        .exp-col:first-child { border-right: 1px solid #000; }
        .exp-header { font-weight: bold; text-decoration: underline; margin-bottom: 5px; }

        .footer-dates { margin-top: 40px; font-size: 10px; border-top: 1px dashed #666; padding-top: 10px; }
        .close-doc { position: absolute; top: 10px; right: 10px; cursor: pointer; font-weight: bold; color: #ff3c3c; }

        .hidden { display: none; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="nav-header">
        <span class="back-btn" onclick="location.reload()">[ROOT]</span> / 
        <span id="pathDisplay">SELECT_AGENT</span>
    </div>

    <div id="agentSelect" class="grid-container">
        <div class="folder" onclick="loadWeapons('LZ')"><span class="folder-label">AGENT_LZ</span></div>
        <div class="folder" onclick="loadWeapons('JFSN')"><span class="folder-label">AGENT_JFSN</span></div>
    </div>

    <div id="weaponSelect" class="grid-container hidden"></div>

    <div id="vAgentSelect" class="grid-container hidden"></div>

    <div id="documentOverlay" class="document-overlay">
        <div class="paper" id="paperContent">
            </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let selectedAgent = "";
        let selectedWeapon = "";

        // LOAD WEAPONS
        function loadWeapons(agent) {
            selectedAgent = agent;
            document.getElementById('pathDisplay').innerText = agent;
            document.getElementById('agentSelect').classList.add('hidden');
            const container = document.getElementById('weaponSelect');
            container.classList.remove('hidden');
            container.innerHTML = "";

            const weapons = (agent === "LZ") ? ["R8P", "RMN14"] : ["RMN9", "TechnoCP"];
            weapons.forEach(wpn => {
                container.innerHTML += `<div class="folder" onclick="loadVAgents('${wpn}')"><span class="folder-label">${wpn}_SYSTEM</span></div>`;
            });
        }

        // LOAD V-AGENTS
        async function loadVAgents(wpn) {
            selectedWeapon = wpn;
            document.getElementById('pathDisplay').innerText = `${selectedAgent} / ${wpn}`;
            document.getElementById('weaponSelect').classList.add('hidden');
            const container = document.getElementById('vAgentSelect');
            container.classList.remove('hidden');
            container.innerHTML = "> SCANNING_VAULT...";

            const snap = await db.collection("system_registry")
                .where("agent", "==", selectedAgent)
                .where("weapon", "==", selectedWeapon)
                .get();

            container.innerHTML = "";
            snap.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="folder" onclick='viewDocument(${JSON.stringify(data)})'>
                        <span class="folder-label">V.AGENT #${data.vid}</span>
                    </div>`;
            });
        }

        // VIEW OFFICIAL DOCUMENT
        function viewDocument(data) {
            const overlay = document.getElementById('documentOverlay');
            const paper = document.getElementById('paperContent');
            
            // Date Logic
            const deployDate = data.timestamp ? data.timestamp.toDate() : new Date();
            const expDate = new Date(deployDate);
            expDate.setDate(expDate.getDate() + 30); // +30 Days

            paper.innerHTML = `
                <div class="close-doc" onclick="closeDoc()">[X]</div>
                <div class="doc-header">
                    <div style="font-size: 10px;">TOP SECRET // MOSSAD ARCHIVE</div>
                    <div class="doc-title">MISSION ORDER: ${data.missionOrder}</div>
                </div>

                <div class="section-title">MISSION DETAILS</div>
                <div style="font-size: 12px;">
                    AGENT CODENAME: ${data.agent}<br>
                    WEAPON SYSTEM: ${data.weapon}<br>
                    V-AGENT UNIT: #${data.vid}
                </div>

                <div class="section-title">EXPENSES REPORT</div>
                <div class="expenses-table">
                    <div class="exp-col">
                        <div class="exp-header">AMOUNT</div>
                        ₱ ${data.amount || "0.00"}
                    </div>
                    <div class="exp-col">
                        <div class="exp-header">DATE_FILED</div>
                        ${deployDate.toLocaleDateString()}
                    </div>
                </div>

                <div class="footer-dates">
                    <strong>DEPLOYMENT_DATE:</strong> ${deployDate.toLocaleString()}<br>
                    <strong>EXPIRATION_DATE:</strong> ${expDate.toLocaleString()}<br>
                    <div style="margin-top:10px; text-align:center; opacity:0.5;">*** END OF DOCUMENT ***</div>
                </div>
            `;
            overlay.style.display = "flex";
        }

        function closeDoc() { document.getElementById('documentOverlay').style.display = "none"; }
    </script>
</body>
</html>
