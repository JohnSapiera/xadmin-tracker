<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_CENTRAL_UPLINK // SECURE_GATEWAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b;
            --cia-cyan: #00f3ff;
            --cia-red: #ff003c;
            --cia-glass: rgba(0, 243, 255, 0.05);
            --cia-border: rgba(0, 243, 255, 0.15);
            --font-digital: 'Share Tech Mono', monospace;
            --font-header: 'Rajdhani', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--cia-bg);
            color: var(--cia-cyan);
            font-family: var(--font-digital);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Subtle Grid Background */
            background-image: 
                linear-gradient(var(--cia-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--cia-border) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Access Portal Box */
        .login-box {
            width: 90%;
            max-width: 400px;
            background: rgba(0, 10, 15, 0.9);
            border: 1px solid var(--cia-cyan);
            padding: 40px 30px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        /* Decorative Corners */
        .login-box::before, .login-box::after {
            content: ""; position: absolute; width: 20px; height: 20px;
            border: 2px solid var(--cia-cyan);
        }
        .login-box::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .login-box::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

        .terminal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .terminal-header h1 {
            font-family: var(--font-header);
            font-size: 28px;
            letter-spacing: 5px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .status-line {
            font-size: 10px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        /* Input Styles */
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 8px;
            opacity: 0.6;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--cia-border);
            padding: 12px 15px;
            color: #fff;
            font-family: var(--font-digital);
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--cia-cyan);
            background: rgba(0, 243, 255, 0.05);
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
        }

        /* Access Button */
        .access-btn {
            width: 100%;
            padding: 15px;
            background: none;
            border: 1px solid var(--cia-cyan);
            color: var(--cia-cyan);
            font-family: var(--font-header);
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .access-btn:hover {
            background: var(--cia-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--cia-cyan);
        }

        .access-btn:active {
            transform: scale(0.98);
        }

        /* Terminal Logs simulation */
        #logDisplay {
            margin-top: 20px;
            height: 60px;
            font-size: 9px;
            overflow: hidden;
            color: #4a6c72;
            line-height: 1.5;
        }

        /* Glitch Effect on error */
        .error-shake {
            animation: shake 0.2s ease-in-out 0s 2;
            border-color: var(--cia-red) !important;
            color: var(--cia-red) !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            50% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .loading-bar {
            height: 2px;
            background: var(--cia-cyan);
            width: 0%;
            position: absolute;
            bottom: 0;
            left: 0;
            transition: 0.5s;
        }
    </style>
</head>
<body>

<div class="login-box" id="loginContainer">
    <div class="terminal-header">
        <h1>UPLINK_NODE</h1>
        <div class="status-line" id="statusLine">WAITING_FOR_AUTHORIZATION...</div>
    </div>

    <div class="input-group">
        <label>AGENT_IDENTIFICATION</label>
        <input type="text" id="agentInput" placeholder="ENTER_AGENT_ID" autocomplete="off">
    </div>

    <div class="input-group" style="margin-bottom: 10px;">
        <label>ENCRYPTION_KEY</label>
        <input type="password" id="passInput" placeholder="••••••••" autocomplete="off">
    </div>

    <div id="logDisplay"></div>

    <button class="access-btn" onclick="initiateUplink()">INITIALIZE_ACCESS</button>
    <div class="loading-bar" id="loadBar"></div>
</div>

<script>
    const logs = [
        "> INITIALIZING_HANDSHAKE...",
        "> BYPASSING_FIREWALL...",
        "> DECRYPTING_LOCAL_STORAGE...",
        "> VALIDATING_CREDENTIALS...",
        "> ACCESS_GRANTED_AGENT_PROCEEDING"
    ];

    function addLog(text) {
        const logBox = document.getElementById('logDisplay');
        const line = document.createElement('div');
        line.innerText = text;
        logBox.appendChild(line);
        if (logBox.childNodes.length > 4) logBox.removeChild(logBox.firstChild);
    }

    async function initiateUplink() {
        const agent = document.getElementById('agentInput').value.toUpperCase();
        const pass = document.getElementById('passInput').value;
        const btn = document.querySelector('.access-btn');
        const container = document.getElementById('loginContainer');
        const status = document.getElementById('statusLine');
        const bar = document.getElementById('loadBar');

        if (!agent || !pass) {
            container.classList.add('error-shake');
            status.innerText = "ERROR: CREDENTIALS_REQUIRED";
            setTimeout(() => container.classList.remove('error-shake'), 400);
            return;
        }

        // Disable UI during "login"
        btn.disabled = true;
        btn.innerText = "AUTHENTICATING...";
        status.innerText = "ESTABLISHING_SECURE_CONNECTION...";

        // Simulate Terminal Logs
        for (let i = 0; i < logs.length; i++) {
            await new Promise(r => setTimeout(r, 600));
            addLog(logs[i]);
            bar.style.width = ((i + 1) * 25) + "%";
        }

        // Store Session and Redirect
        localStorage.setItem("cia_agent", agent);
        status.innerText = "ACCESS_CONFIRMED. WELCOME, " + agent;
        
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1000);
    }

    // Enter Key Support
    document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') initiateUplink();
    });
</script>

</body>
</html>
