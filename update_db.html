<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MISSION_ORDER_REGISTRY</title>
    <style>
        body { background: #050505; color: #ff3c3c; font-family: 'Courier New', monospace; padding: 20px; text-align: center; }
        .container { max-width: 450px; margin: auto; border: 2px solid #ff3c3c; padding: 25px; box-shadow: 0 0 15px rgba(255, 60, 60, 0.2); }
        h2 { letter-spacing: 3px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        textarea { 
            width: 100%; height: 250px; background: #111; color: #fff; 
            border: 1px solid #444; margin-top: 15px; padding: 10px; 
            box-sizing: border-box; font-size: 16px; outline: none;
        }
        textarea:focus { border-color: #ff3c3c; }
        button { 
            width: 100%; padding: 15px; margin-top: 20px; cursor: pointer; 
            background: #ff3c3c; color: #000; font-weight: bold; border: none; 
            font-size: 14px; transition: 0.3s;
        }
        button:hover { background: #fff; }
        #status { font-size: 11px; margin-top: 15px; color: #888; text-transform: uppercase; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>BLACKLIST_REGISTRY</h2>
    <p style="font-size: 10px; color: #666;">PASTE ALREADY EXISTED MISSION ORDER# TO BAN THEM</p>

    <textarea id="orderList" placeholder="Enter Order Numbers...&#10;50501&#10;50502&#10;50503"></textarea>

    <button onclick="registerBlacklist()">EXECUTE_BAN_SEQUENCE</button>
    <div id="status">STATUS: STANDBY</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
        authDomain: "my-admin-portal-12691.firebaseapp.com",
        projectId: "my-admin-portal-12691",
        storageBucket: "my-admin-portal-12691.firebasestorage.app",
        messagingSenderId: "317015091563",
        appId: "1:317015091563:web:baab5171d8e0a58acd442e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function registerBlacklist() {
        const rawInput = document.getElementById('orderList').value.trim();
        const status = document.getElementById('status');

        if(!rawInput) {
            alert("INPUT_REQUIRED: No numbers detected.");
            return;
        }

        const orders = rawInput.split('\n').map(n => n.trim()).filter(n => n !== "");
        status.innerText = "PROCESSING_BAN_LIST...";
        status.style.color = "yellow";

        const batch = db.batch();

        orders.forEach((num) => {
            // Gagamitin natin ang mismong Number bilang Document ID 
            // para maiwasan ang duplicate at mabilis ma-check later
            const docRef = db.collection("blacklist").doc(num); 
            batch.set(docRef, {
                missionOrder: num,
                status: "BANNED",
                registeredAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        });

        try {
            await batch.commit();
            status.style.color = "#00ff00";
            status.innerText = "SUCCESS: " + orders.length + " ORDERS HAVE BEEN BLACKLISTED.";
            document.getElementById('orderList').value = "";
        } catch (e) {
            status.style.color = "red";
            status.innerText = "ERROR: " + e.message;
        }
    }
</script>

</body>
</html>
