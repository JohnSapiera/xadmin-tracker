<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DEVICE REGISTRATION • CIA INTELLIGENCE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0c12 0%, #06080e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #0d0f14;
            border-radius: 24px;
            padding: 30px;
            border: 1px solid #1f232c;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00ff66;
            font-size: 20px;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .header p {
            color: #5a7a6a;
            font-size: 11px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #00ff66;
            font-size: 11px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            background: #000;
            border: 1px solid #2a3240;
            border-radius: 12px;
            padding: 14px;
            color: #00ff66;
            font-family: monospace;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .btn {
            width: 100%;
            background: #00ff66;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            font-size: 11px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            color: #00ff66;
            display: block;
        }

        .message.info {
            background: rgba(0, 255, 102, 0.05);
            border: 1px solid #2a3240;
            color: #5a7a6a;
            display: block;
        }

        .device-info {
            margin-top: 20px;
            padding: 16px;
            background: #03050a;
            border-radius: 16px;
            border: 1px solid #1f232c;
            display: none;
        }

        .device-info.show {
            display: block;
        }

        .device-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 11px;
        }

        .device-label {
            color: #5a7a6a;
        }

        .device-value {
            color: #00ff66;
            font-weight: bold;
        }

        .status-badge {
            text-align: center;
            margin-top: 15px;
            padding: 8px;
            background: #1a2a22;
            border-radius: 8px;
            font-size: 10px;
            color: #00ff66;
        }

        hr {
            border-color: #1f232c;
            margin: 15px 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>DEVICE REGISTRATION</h1>
        <p>CIA INTELLIGENCE SYSTEM</p>
    </div>

    <div class="form-group">
        <label>MASTER KEY (4-DIGIT)</label>
        <input type="password" id="masterKey" maxlength="4" placeholder="____" autocomplete="off">
    </div>

    <button class="btn" id="registerBtn">REGISTER DEVICE</button>

    <div id="message" class="message"></div>

    <div id="deviceInfo" class="device-info">
        <div class="device-row">
            <span class="device-label">DEVICE STATUS</span>
            <span class="device-value">REGISTERED</span>
        </div>
        <div class="device-row">
            <span class="device-label">AGENT NAME</span>
            <span class="device-value" id="agentName">—</span>
        </div>
        <div class="device-row">
            <span class="device-label">DEVICE FINGERPRINT</span>
            <span class="device-value" id="deviceFp">—</span>
        </div>
        <hr>
        <div class="device-label">REGISTERED DEVICES</div>
        <div id="devicesList" style="margin-top: 8px;"></div>
        <div class="status-badge" id="statusBadge">● PERMANENT SESSION ACTIVE</div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    let supabase = null;
    
    const masterKeyInput = document.getElementById('masterKey');
    const registerBtn = document.getElementById('registerBtn');
    const messageDiv = document.getElementById('message');
    const deviceInfoDiv = document.getElementById('deviceInfo');
    const agentNameSpan = document.getElementById('agentName');
    const deviceFpSpan = document.getElementById('deviceFp');
    const devicesListDiv = document.getElementById('devicesList');
    
    function showMessage(msg, type) {
        messageDiv.className = 'message ' + type;
        messageDiv.innerHTML = msg;
        setTimeout(() => {
            if (messageDiv.innerHTML === msg) {
                messageDiv.style.display = 'none';
                messageDiv.className = 'message';
            }
        }, 4000);
    }
    
    function generateDeviceFingerprint() {
        let hash = 0;
        const raw = navigator.userAgent + window.screen.width + window.screen.height + navigator.language;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "DEV-" + Math.abs(hash).toString(16).toUpperCase().slice(0, 12);
    }
    
    async function registerDevice(masterKey, deviceFp) {
        registerBtn.disabled = true;
        registerBtn.innerText = 'REGISTERING...';
        showMessage('Verifying master key...', 'info');
        
        try {
            const { data: agent, error } = await supabase
                .from('agents')
                .select('agent_name, secret_key, weapon_system')
                .eq('secret_key', masterKey)
                .maybeSingle();
            
            if (error) {
                showMessage('Database error: ' + error.message, 'error');
                registerBtn.disabled = false;
                registerBtn.innerText = 'REGISTER DEVICE';
                return;
            }
            
            if (!agent) {
                showMessage('Invalid master key. Access denied.', 'error');
                registerBtn.disabled = false;
                registerBtn.innerText = 'REGISTER DEVICE';
                return;
            }
            
            const agentName = agent.agent_name;
            const devices = agent.weapon_system || [];
            
            // Check if device already registered
            const { data: existingCheck } = await supabase
                .from('agents')
                .select('linked_signatures')
                .eq('secret_key', masterKey)
                .maybeSingle();
            
            let linkedSigs = existingCheck?.linked_signatures || [];
            
            if (!linkedSigs.includes(deviceFp)) {
                linkedSigs.push(deviceFp);
                
                await supabase
                    .from('agents')
                    .update({ 
                        linked_signatures: linkedSigs,
                        last_fingerprint: deviceFp,
                        updated_at: new Date().toISOString()
                    })
                    .eq('secret_key', masterKey);
            }
            
            // Save to localStorage (permanent)
            const registrationData = {
                agent_name: agentName,
                secret_key: masterKey,
                device_fingerprint: deviceFp,
                devices: devices,
                registered_at: new Date().toISOString(),
                is_registered: true
            };
            
            localStorage.setItem('cia_device_registration', JSON.stringify(registrationData));
            
            showMessage('Device registered successfully!', 'success');
            
            // Display device info
            agentNameSpan.innerText = agentName;
            deviceFpSpan.innerText = deviceFp;
            devicesListDiv.innerHTML = devices.map(d => `<div class="device-value" style="font-size:10px; margin-bottom:4px;">• ${d}</div>`).join('');
            deviceInfoDiv.classList.add('show');
            
            registerBtn.disabled = false;
            registerBtn.innerText = 'REGISTER DEVICE';
            masterKeyInput.value = '';
            
        } catch (err) {
            showMessage('Error: ' + err.message, 'error');
            registerBtn.disabled = false;
            registerBtn.innerText = 'REGISTER DEVICE';
        }
    }
    
    function checkExistingRegistration() {
        const saved = localStorage.getItem('cia_device_registration');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                if (data.is_registered === true) {
                    agentNameSpan.innerText = data.agent_name;
                    deviceFpSpan.innerText = data.device_fingerprint;
                    devicesListDiv.innerHTML = (data.devices || []).map(d => `<div class="device-value" style="font-size:10px; margin-bottom:4px;">• ${d}</div>`).join('');
                    deviceInfoDiv.classList.add('show');
                    showMessage('Device already registered. Permanent session active.', 'info');
                    return true;
                }
            } catch(e) {
                console.error('Parse error:', e);
            }
        }
        return false;
    }
    
    registerBtn.addEventListener('click', () => {
        const masterKey = masterKeyInput.value.trim();
        if (masterKey.length !== 4) {
            showMessage('Please enter a 4-digit master key', 'error');
            return;
        }
        const deviceFp = generateDeviceFingerprint();
        registerDevice(masterKey, deviceFp);
    });
    
    masterKeyInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const masterKey = masterKeyInput.value.trim();
            if (masterKey.length === 4) {
                const deviceFp = generateDeviceFingerprint();
                registerDevice(masterKey, deviceFp);
            } else {
                showMessage('Please enter a 4-digit master key', 'error');
            }
        }
    });
    
    async function init() {
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Supabase initialized');
            
            const { error } = await supabase.from('agents').select('count', { count: 'exact', head: true });
            if (error) console.warn('Supabase warning:', error.message);
            else console.log('Supabase connected');
        } catch(e) {
            console.error('Init error:', e);
            showMessage('Database connection failed', 'error');
        }
        
        checkExistingRegistration();
    }
    
    init();
</script>
</body>
</html>
