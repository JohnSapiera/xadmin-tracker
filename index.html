<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA - OPERATIONAL TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: 'Fira Code', monospace; }
        .scanline {
            width: 100%; height: 2px; background: rgba(0, 112, 243, 0.1);
            position: fixed; animation: scan 4s linear infinite; z-index: 100; pointer-events: none;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        .floating-window { display: none; position: fixed; top: 15%; right: 2%; z-index: 50; }
    </style>
</head>
<body class="text-xs border-t-2 border-blue-600">
    <div class="scanline"></div>

    <nav class="bg-black/80 p-4 border-b border-white/10 flex justify-between items-center sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-4">
            <div class="px-2 py-1 border border-blue-500 text-blue-500 font-bold text-[10px]">L5 CLEARANCE</div>
            <h1 class="tracking-[0.3em] uppercase font-bold text-white">Central Intelligence Registry</h1>
        </div>
        <button onclick="toggleEliminated()" class="text-red-500 border border-red-500/30 px-3 py-1 hover:bg-red-500/10 transition">
            [ VIEW ELIMINATED ]
        </button>
    </nav>

    <div class="max-w-4xl mx-auto p-6 space-y-6">
        
        <section class="bg-zinc-900/50 border border-white/5 p-6 rounded-sm shadow-2xl">
            <h2 class="text-blue-400 mb-4 tracking-tighter uppercase font-bold text-sm">Target Code Query</h2>
            <div class="flex gap-2">
                <input type="number" id="codeInput" placeholder="INPUT CODE..." 
                       class="flex-1 bg-black border border-white/10 p-3 outline-none focus:border-blue-500 text-blue-400 font-bold tracking-widest">
                <button onclick="scanCode()" class="bg-blue-600 px-6 font-bold text-white hover:bg-blue-700 transition uppercase">Scan</button>
            </div>
            <div id="statusReport" class="mt-4 min-h-[40px] flex items-center justify-center border border-dashed border-white/5 rounded italic text-gray-600">
                Awaiting input...
            </div>
        </section>

        <section class="bg-zinc-900/50 border border-white/5 rounded-sm overflow-hidden flex flex-col h-[400px]">
            <div class="bg-white/5 p-2 text-[10px] flex justify-between border-b border-white/5">
                <span class="text-amber-500 font-bold tracking-widest uppercase">Secure Comms Channel-Alpha</span>
                <span class="animate-pulse text-green-500">● LIVE</span>
            </div>
            <div id="chatFeed" class="flex-1 p-4 overflow-y-auto space-y-2 bg-black/20">
                </div>
            <div class="p-3 border-t border-white/5 flex gap-2">
                <input type="text" id="chatMsg" placeholder="TYPE TRANSMISSION..." 
                       class="flex-1 bg-black border border-white/10 p-2 outline-none text-amber-500 uppercase text-[11px]">
                <button onclick="sendMsg()" class="bg-amber-600 px-4 py-1 font-bold text-black text-[10px] hover:bg-amber-500 transition uppercase">Transmit</button>
            </div>
        </section>
    </div>

    <div id="eliminatedWindow" class="floating-window w-64 bg-black border border-red-500 shadow-[0_0_15px_rgba(255,0,0,0.3)]">
        <div class="bg-red-900/20 p-2 border-b border-red-500 flex justify-between text-[10px] font-bold text-red-500 uppercase">
            <span>Neutralized Targets</span>
            <button onclick="toggleEliminated()">[X]</button>
        </div>
        <div id="eliminatedList" class="p-3 max-h-60 overflow-y-auto space-y-2 text-red-400 font-bold tracking-widest text-center">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rdb = getDatabase(app);

        // --- CODE SCANNER ---
        window.scanCode = async () => {
            const code = document.getElementById('codeInput').value;
            const report = document.getElementById('statusReport');

            // Validation: Starts with 0 (4 digits) or non-zero (5 digits). Bawal 1,2,3.
            const isValid = code.startsWith('0') ? code.length === 4 : code.length === 5;
            
            if (!isValid) {
                report.innerHTML = `<span class="text-red-500 font-bold uppercase">Invalid Protocol: 4-5 digit code only</span>`;
                return;
            }

            report.innerText = "Scanning Satellite Database...";
            const q = query(collection(db, "eliminated_codes"), where("code", "==", code));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                report.innerHTML = `
                    <div class="text-center py-2">
                        <p class="text-amber-500 font-bold mb-2">TARGET UNKNOWN</p>
                        <button onclick="eliminate('${code}')" class="bg-red-600 px-3 py-1 text-white text-[10px] font-bold uppercase">Initiate Elimination</button>
                    </div>`;
            } else {
                report.innerHTML = `<span class="text-red-600 font-black animate-pulse uppercase">🚨 ELIMINATED TARGET: ${code} 🚨</span>`;
            }
        };

        window.eliminate = async (code) => {
            await addDoc(collection(db, "eliminated_codes"), { code: code, date: serverTimestamp() });
            document.getElementById('codeInput').value = "";
            scanCode(); 
        };

        // --- LIVE CHAT ---
        window.sendMsg = () => {
            const input = document.getElementById('chatMsg');
            if (input.value) {
                push(ref(rdb, 'comms'), { text: input.value.toUpperCase(), time: Date.now() });
                input.value = "";
            }
        };

        onChildAdded(ref(rdb, 'comms'), (snap) => {
            const data = snap.val();
            const div = document.createElement('div');
            div.className = "bg-white/5 border-l border-amber-500 p-2 mb-2";
            div.innerHTML = `<span class="text-[9px] text-gray-500 block">${new Date(data.time).toLocaleTimeString()}</span><span class="text-amber-500 font-bold">${data.text}</span>`;
            document.getElementById('chatFeed').appendChild(div);
            document.getElementById('chatFeed').scrollTop = document.getElementById('chatFeed').scrollHeight;
        });

        // --- UI CONTROLS ---
        window.toggleEliminated = () => {
            const win = document.getElementById('eliminatedWindow');
            win.style.display = win.style.display === 'block' ? 'none' : 'block';
        };

        onSnapshot(collection(db, "eliminated_codes"), (snap) => {
            const list = document.getElementById('eliminatedList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const item = document.createElement('div');
                item.className = "border-b border-red-900/30 py-1";
                item.innerText = `🎯 ${doc.data().code}`;
                list.appendChild(item);
            });
        });
    </script>
</body>
</html>
