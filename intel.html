<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#02080a">
  
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CORE_INTEL_v28.8</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #02080a; --panel: rgba(5, 15, 20, 0.9); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
      --green: #05ffa1; --yellow: #ffbd00; --border: rgba(0, 243, 255, 0.2);
      --font-mono: 'Share Tech Mono', monospace; --font-main: 'Rajdhani', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: #e1f5f9; font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    header { padding: 15px 20px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .status-bar { font-size: 11px; padding: 8px 20px; background: rgba(0,243,255,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }
    
    main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }
    
    .intel-module { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 4px; position: relative; }
    .module-title { color: var(--cyan); font-family: var(--font-mono); font-size: 12px; margin-bottom: 15px; letter-spacing: 2px; border-bottom: 1px solid rgba(0,243,255,0.2); padding-bottom: 5px;}
    
    .input-field { width: 100%; background: #000; border: 1px solid var(--border); color: var(--green); font-family: var(--font-mono); font-size: 20px; padding: 12px; text-align: center; outline: none; margin-bottom: 10px; transition: 0.3s; }
    .input-field:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,243,255,0.2); }
    
    .device-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; margin-bottom: 15px; }
    .dev-btn { background: #08161b; border: 1px solid #1a2f37; color: #fff; padding: 15px; font-size: 13px; cursor: pointer; text-align: left; font-family: var(--font-mono); transition: 0.3s; position: relative; display: flex; flex-direction: column; gap: 4px; }
    
    .dev-btn.active { border-color: var(--cyan); background: rgba(0, 243, 255, 0.08); box-shadow: inset 0 0 15px rgba(0,243,255,0.1); }
    .dev-btn .agent-tag { font-size: 9px; color: var(--cyan); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .dev-btn .mission-tag { font-size: 10px; color: #5c7882; align-self: flex-end; }

    .btn-save { background: var(--green); color: #000; height: 50px; font-weight: 700; width: 100%; border: none; font-family: var(--font-main); font-size: 16px; cursor: pointer; transition: 0.3s; opacity: 0.3; pointer-events: none; }
    .btn-save.ready { opacity: 1; pointer-events: auto; }
    
    #scan-status { font-family: var(--font-mono); font-size: 11px; color: var(--yellow); text-align: center; margin-bottom: 10px; min-height: 15px; }
    .blink { animation: blinker 1s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }

    .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #5c7882; text-decoration: none; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
    .nav-item.active { color: var(--cyan); background: var(--cyan-dim); border-top: 2px solid var(--cyan); }
  </style>
</head>
<body>

<header><span style="font-weight: 700; color: #fff;">CORE_INTEL // v28.8</span></header>

<div class="status-bar">
    <div>SYS_TIME: <span id="clock">00:00:00</span></div>
    <div style="color: var(--cyan);">EXPENSE_TRACKER_ONLINE</div>
</div>

<main>
  <div class="intel-module">
    <div class="module-title">TARGET IDENTIFICATION</div>
    <input type="text" id="vagent-input" class="input-field" placeholder="ENTER V_AGENT#" autocomplete="off">
    <div id="scan-status">AWAITING INPUT...</div>
    
    <div id="device-list" class="device-grid"></div>
  </div>

  <div class="intel-module" id="expense-module" style="opacity: 0.1; pointer-events: none; transition: 0.3s;">
    <div class="module-title">EXPENSE INJECTION</div>
    <input type="number" id="expense-input" class="input-field" placeholder="0.00" autocomplete="off">
    <button id="submit-btn" class="btn-save">EXECUTE OVERRIDE</button>
  </div>
</main>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">DASHBOARD</a>
    <a href="#" class="nav-item active">INTEL</a>
    <a href="profile.html" class="nav-item">PROFILE</a>
</nav>

<script type="module">
  import { DEVICE_REGISTRY } from './config.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
    authDomain: "my-admin-portal-12691.firebaseapp.com", 
    projectId: "my-admin-portal-12691", 
    storageBucket: "my-admin-portal-12691.firebasestorage.app", 
    messagingSenderId: "317015091563", 
    appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const vAgentInput = document.getElementById('vagent-input');
  const scanStatus = document.getElementById('scan-status');
  const deviceList = document.getElementById('device-list');
  const expenseModule = document.getElementById('expense-module');
  const expenseInput = document.getElementById('expense-input');
  const submitBtn = document.getElementById('submit-btn');

  let typingTimer;
  let selectedMissionDocId = null;

  // 1. KUNIN ANG AGENT ID MULA SA LOCALSTORAGE
  const localAgentID = localStorage.getItem('agentID'); 

  vAgentInput.addEventListener('input', () => {
    clearTimeout(typingTimer);
    const val = vAgentInput.value.trim();
    
    deviceList.innerHTML = "";
    expenseModule.style.opacity = "0.1";
    expenseModule.style.pointerEvents = "none";
    submitBtn.classList.remove('ready');
    selectedMissionDocId = null;

    if (val.length > 0) {
        scanStatus.innerHTML = `<span class="blink">[SYSTEM] VERIFYING V_AGENT# ${val}...</span>`;
        typingTimer = setTimeout(() => executeSecureSearch(val), 2000);
    } else {
        scanStatus.innerHTML = "AWAITING INPUT...";
    }
  });

  // 2. SECURE SEARCH LOGIC
  async function executeSecureSearch(vInput) {
    if (!localAgentID) {
        scanStatus.innerHTML = `<span style="color:var(--red)">[ERROR] NO LOCAL AGENT_ID FOUND. PLEASE RE-LOGIN.</span>`;
        return;
    }

    try {
        scanStatus.innerHTML = `<span style="color:var(--cyan)">[SYSTEM] ANALYZING MISSION LOGS...</span>`;
        
        // Multi-Filter: vAgentID (Input) + agentID (LocalStorage)
        const q = query(
            collection(db, "mission_orders"), 
            where("vAgentID", "==", vInput),
            where("agentID", "==", localAgentID)
        );

        const snap = await getDocs(q);

        if (snap.empty) {
            scanStatus.innerHTML = `<span style="color:var(--red)">[ACCESS DENIED] UNKNOWN TARGET OR UNAUTHORIZED</span>`;
            return;
        }

        scanStatus.innerHTML = `<span style="color:var(--green)">[SUCCESS] ${snap.size} DEVICE(S) IDENTIFIED.</span>`;
        
        snap.forEach(d => {
            const data = d.data();
            const btn = document.createElement('button');
            btn.className = "dev-btn";
            
            // Translate SIG via config.js
            const deviceDisplayName = DEVICE_REGISTRY[data.weaponSystem] || `SIG: ${data.weaponSystem}`;

            btn.innerHTML = `
              <span class="agent-tag">AGENT: ${data.agent || 'AUTHORIZED_OPERATOR'}</span>
              <span style="font-weight:700">> ${deviceDisplayName}</span>
              <span class="mission-tag">MISSION_ORDER: #${data.missionID}</span>
            `;
            
            btn.onclick = () => {
                document.querySelectorAll('.dev-btn').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                selectedMissionDocId = d.id;
                
                expenseModule.style.opacity = "1";
                expenseModule.style.pointerEvents = "auto";
                submitBtn.classList.add('ready');
            };
            deviceList.appendChild(btn);
        });

    } catch (e) {
        console.error(e);
        scanStatus.innerHTML = `<span style="color:var(--red)">[ERROR] DATABASE_LINK_SEVERED</span>`;
    }
  }

  // 3. SUBMIT EXPENSE
  submitBtn.onclick = async () => {
    const expenseAmount = parseFloat(expenseInput.value);
    if (!selectedMissionDocId || isNaN(expenseAmount) || expenseAmount <= 0) return;

    submitBtn.innerText = "UPLINKING DATA...";
    submitBtn.classList.add('processing');

    try {
        const missionRef = doc(db, "mission_orders", selectedMissionDocId);
        await updateDoc(missionRef, {
            expensesBreakdown: arrayUnion({
                amount: expenseAmount,
                timestamp: new Date().toISOString()
            }),
            totalExpenses: increment(expenseAmount)
        });

        submitBtn.innerText = "[ OVERRIDE SUCCESS ]";
        submitBtn.style.background = "var(--cyan)";

        setTimeout(() => {
            location.reload(); 
        }, 1500);

    } catch (e) {
        submitBtn.innerText = "[ FAILED ]";
        submitBtn.style.background = "var(--red)";
    }
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
