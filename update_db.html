<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILING_SYSTEM_v3</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #0a0a0a; --gold: #d4af37; }
        body { 
            background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .panel {
            background: #111; border: 2px solid var(--neon); padding: 30px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); width: 100%; max-width: 400px;
        }
        h2 { font-size: 16px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 15px; letter-spacing: 2px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 9px; margin-bottom: 5px; color: #888; text-transform: uppercase; }
        select, input {
            width: 100%; background: #000; border: 1px solid #333; color: #fff;
            padding: 12px; font-family: inherit; outline: none; box-sizing: border-box;
        }
        select:focus, input:focus { border-color: var(--neon); }
        .btn-execute {
            width: 100%; background: var(--neon); color: #000; border: none;
            padding: 15px; font-weight: 800; cursor: pointer; margin-top: 10px;
        }
        .btn-execute:hover { background: #fff; }
        #status { font-size: 10px; margin-top: 15px; text-align: center; color: #888; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="panel">
        <h2>MISSION_PROFILING</h2>
        
        <div class="form-group">
            <label>ACTIVE AGENT</label>
            <select id="agentId" onchange="updateWeapons()">
                <option value="">-- SELECT AGENT --</option>
                <option value="LZ">AGENT LZ</option>
                <option value="JFSN">AGENT JFSN</option>
            </select>
        </div>

        <div class="form-group">
            <label>WEAPON SYSTEM</label>
            <select id="weaponId">
                <option value="">-- SELECT AGENT FIRST --</option>
            </select>
        </div>

        <div class="form-group">
            <label>V.AGENT SUB-FOLDER NUMBER (#)</label>
            <input type="number" id="vAgentNum" placeholder="Example: 1">
        </div>

        <div class="form-group">
            <label>NEW MISSION ORDER #</label>
            <input type="text" id="moNum" placeholder="Enter Order Number">
        </div>

        <button class="btn-execute" onclick="saveProfile()">ARCHIVE MISSION</button>
        <div id="status">SYSTEM_READY</div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // WEAPON REGISTRY LOGIC
        const weaponMap = {
            "LZ": ["R8P", "RMN14"],
            "JFSN": ["RMN9", "TechnoCP"]
        };

        function updateWeapons() {
            const agent = document.getElementById('agentId').value;
            const weaponSelect = document.getElementById('weaponId');
            
            weaponSelect.innerHTML = ""; // Clear existing

            if (weaponMap[agent]) {
                weaponMap[agent].forEach(wpn => {
                    let opt = document.createElement('option');
                    opt.value = wpn;
                    opt.innerHTML = wpn + " SYSTEM";
                    weaponSelect.appendChild(opt);
                });
            } else {
                weaponSelect.innerHTML = "<option value=''>-- SELECT AGENT FIRST --</option>";
            }
        }

        async function saveProfile() {
            const agent = document.getElementById('agentId').value;
            const weapon = document.getElementById('weaponId').value;
            const vid = document.getElementById('vAgentNum').value;
            const mo = document.getElementById('moNum').value;
            const status = document.getElementById('status');

            if (!agent || !weapon || !vid || !mo) {
                alert("COMPLETE_ALL_FIELDS: Data missing.");
                return;
            }

            status.innerText = "ARCHIVING_TO_SECURE_SERVER...";

            try {
                // Ginagamit natin ang Collection 'blacklist' pero as Profile Data na ito
                await db.collection("blacklist").add({
                    agent: agent,
                    weapon: weapon,
                    vid: parseInt(vid),
                    missionOrder: mo,
                    amount: 0, // Default for new profile
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                status.style.color = "#00ff00";
                status.innerText = "SUCCESS: MISSION_ARCHIVED_IN_FOLDER_V" + vid;
                
                // Clear input only for the next order
                document.getElementById('moNum').value = "";
            } catch (error) {
                status.style.color = "red";
                status.innerText = "ERROR: " + error.message;
            }
        }
    </script>
</body>
</html>
