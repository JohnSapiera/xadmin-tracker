
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.4s; }
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            filter: grayscale(1) brightness(0.3); transition: all 0.5s ease;
        }

        .phone-wrapper.lights-on .phone-body {
            filter: grayscale(0) brightness(1); border-color: var(--cia-cyan);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.6);
        }
        .phone-screen {
            position: absolute; inset: 5px; background: #000; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.3s ease-in; overflow: hidden;
        }
        .phone-wrapper.lights-on .phone-screen { background: #ffffff; }

        .typing-text {
            display: none; color: #000; font-size: 11px; font-weight: bold;
            width: 0; overflow: hidden; white-space: nowrap; border-right: 2px solid #000;
        }
        .phone-wrapper.lights-on .typing-text {
            display: block; animation: typing 0.8s steps(15) 0.4s forwards;
        }
        @keyframes typing { from { width: 0 } to { width: 90% } }

        /* --- FOLDERS --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .folder-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 15px; }
        .folder-main { width: 50px; height: 35px; background: var(--cia-cyan); border-radius: 0 4px 4px 4px; z-index: 2; clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%); }
        .paper-sheet { position: absolute; top: 8px; width: 38px; height: 32px; background: #fff; border: 1px solid #ccc; z-index: 1; transition: 0.3s; }
        .folder-box:hover .paper-sheet { transform: translateY(-10px); }
        .file-label { font-size: 8.5px; color: #fff; text-align: center; margin-top: 8px; font-weight: bold; letter-spacing: 1px; }

        /* --- OVERLAYS --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .dossier-paper {
            width: 88%; max-width: 360px; background: #e8e2d2; color: #1a1a1a; padding: 25px 20px;
            font-family: var(--font-noir); position: relative; border: 1px solid #c5b8a0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); transform: rotate(-0.5deg);
        }

        .secure-marker { background: #1a1a1a; color: #1a1a1a; padding: 0 5px; border-radius: 2px; cursor: pointer; transition: 0.2s; user-select: all; }
        .secure-marker:active { background: transparent; }

        /* --- BOOK EFFECT --- */
        .book { width: 90%; max-width: 400px; height: 70vh; perspective: 1500px; }
        .page { 
            width: 100%; height: 100%; background: #e8e2d2; color: #1a1a1a; padding: 30px; 
            font-family: var(--font-noir); position: absolute; transition: transform 0.8s; 
            transform-origin: left; backface-visibility: hidden; overflow-y: auto; border: 1px solid #c5b8a0;
        }
        .page.flipped { transform: rotateY(-180deg); }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.3); padding: 8px 0; font-size: 13px; }
        .btn-page { position: absolute; bottom: 15px; right: 20px; font-weight: bold; cursor: pointer; border-bottom: 2px solid #000; font-size: 12px; }
        
        /* --- TERMINATE DESIGN (ORIGINAL) --- */
        .btn-terminate {
            background: none; border: 2px solid #8b0000; color: #8b0000; padding: 8px 15px;
            font-family: var(--font-noir); font-weight: bold; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; transform: rotate(-2deg); margin-top: 15px;
        }
        .btn-terminate:hover { background: #8b0000; color: #e8e2d2; }

        /* --- MISC --- */
        .shadow-folder { filter: brightness(0.2) grayscale(1) opacity(0.3); cursor: default !important; pointer-events: none; }
        @keyframes uplink-blink { 0%, 100% { opacity: 1; color: var(--cia-cyan); } 50% { opacity: 0.3; } }
        .uplink-sync { animation: uplink-blink 0.4s infinite; font-weight: bold; }
        .status-label { font-size: 9px; color: var(--cia-cyan); margin-top: 10px; transition: all 0.3s ease; }
		
		/* --- CIA FOLDER STAMP --- */
.folder-box.has-expenses .folder-main::after {
    content: "CIA";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-family: var(--font-noir);
    font-size: 10px;
    font-weight: bold;
    color: rgba(0, 0, 0, 0.7); /* Ink black color */
    border: 1.5px solid rgba(0, 0, 0, 0.7);
    padding: 1px 3px;
    border-radius: 2px;
    pointer-events: none;
    letter-spacing: 1px;
    z-index: 5;
}

/* Optional: Gawing medyo "used" ang look ng folder na may laman */
.folder-box.has-expenses .folder-main {
    box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
}

/* --- CLASSIFIED PAPER DESIGN --- */
.book { 
    width: 95%; max-width: 400px; height: 75vh; 
    perspective: 2000px; position: relative; 
}

.page { 
    width: 100%; height: 100%; position: absolute; 
    transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1); 
    transform-origin: left; backface-visibility: hidden; 
    background: #f0ebe0; /* Off-white/old paper */
    color: #1a1a1a; padding: 35px 25px; 
    font-family: 'Special Elite', cursive; 
    box-shadow: inset 0 0 50px rgba(0,0,0,0.1), 5px 5px 20px rgba(0,0,0,0.5);
    border: 1px solid #dcd7c9; overflow-y: auto;
}

/* Background markings para sa Classified look */
.page::before {
    content: "CLASSIFIED";
    position: absolute; top: 10%; left: 50%;
    transform: translate(-50%, -50%) rotate(-30deg);
    font-size: 5rem; color: rgba(139, 0, 0, 0.05);
    pointer-events: none; z-index: 0;
}

/* Page Flip Classes */
.page.flipped { transform: rotateY(-180deg); }
.page-front { z-index: 2; }
.page-back { transform: rotateY(180deg); z-index: 1; }

/* Close Button Fix */
.close-dossier {
    position: absolute; top: 15px; right: 20px;
    font-size: 18px; font-weight: bold; color: #8b0000;
    cursor: pointer; z-index: 5000; /* Mataas na z-index para ma-click */
    padding: 5px; border: 1px solid transparent;
}
.close-dossier:hover { border-color: #8b0000; background: rgba(139,0,0,0.1); }

/* Swipe Label */
.swipe-hint {
    position: absolute; bottom: 15px; right: 25px;
    font-size: 10px; color: #8b0000; font-weight: bold;
    border-bottom: 1px solid #8b0000; cursor: pointer;
}
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px;">AUTHENTICATING...</h2>
        <p style="font-size: 9px; opacity: 0.5;">MEMOIRS_PROTOCOL_ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:10px; width:100%; margin-top:20px; cursor:pointer;">[ EXIT_DEVICE_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 40px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 25px; cursor:pointer; font-weight:bold;">[ VIEW_MASTER_MEMOIRS ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <div onclick="closeNoir()" style="position:absolute; top:10px; right:15px; cursor:pointer; font-weight:bold; color:#8b0000;">[ X ]</div>
        <h3 style="text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px; letter-spacing: 1px;">vAGENT_DOSSIER</h3>
        <p style="font-size: 11px; margin-bottom: 4px;"><b>MO#:</b> <span id="n-order">---</span></p>
        <p style="font-size: 11px; margin-bottom: 4px;"><b>vAgent#:</b> <span id="n-vagent" style="background:rgba(0,0,0,0.1); padding: 0 5px;">---</span></p>
        <div id="n-content" style="margin-top: 15px; border-top: 1px dashed #000; padding-top: 10px;"></div>
        <div style="text-align: right; margin-top: 20px; border-top: 2px solid #000; padding-top: 8px;">
            <p style="font-size: 9px; opacity: 0.7; margin-bottom: 2px;">TOTAL_OPERATIONAL_COST</p>
            <p style="font-weight: bold; font-size: 18px;">Total: <span id="n-total">₱ 0.00</span></p>
        </div>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="close-dossier" onclick="closeMemoirs()" style="color: white; top: 20px; right: 20px;">[ CLOSE_SYSTEM ]</div>
    
    <div class="book" id="dossierBook">
        <div id="p1" class="page page-front" onclick="flipPage(true)">
            <h2 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 20px;">TOP SECRET</h2>
            <p style="font-size: 10px; margin-bottom: 15px;">SUBJECT: <span id="target-name">---</span></p>
            <div id="active-list"></div>
            <div class="swipe-hint">TAP TO FLIP >></div>
        </div>

        <div id="p2" class="page page-back" onclick="flipPage(false)">
            <h2 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 20px;">SUMMARY_LOG</h2>
            <div id="weapon-system-breakdown"></div>
            <div style="margin-top: 40px; border-top: 3px double #000; padding-top: 15px;">
                <p style="font-size: 12px; font-weight: bold;">TOTAL EXPENDITURE:</p>
                <h1 style="font-size: 32px;">₱ <span id="total-val">0.00</span></h1>
            </div>
            <div class="swipe-hint" style="left: 25px; right: auto;"><< BACK</div>
        </div>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <div class="close-dossier" onclick="closeNoir()">[ X ]</div>
        <h3 id="n-header" style="text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px;">vAGENT_DOSSIER</h3>
        </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY, INTEL_TERMS } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN_AGENT";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {};
    let allMissions = [];

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        allMissions = [];
        deviceData = {};

        snap.forEach(d => {
            const data = d.data();
            if (data.vAgentID) {
                const docWithID = {...data, id: d.id};
                allMissions.push(docWithID);
                const deviceName = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[deviceName]) deviceData[deviceName] = [];
                deviceData[deviceName].push(docWithID);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        const grid = document.getElementById('deviceSection');
        const keys = Object.keys(deviceData);
        if (keys.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; opacity:0.5;">[ NO_ACTIVE_DATA ]</p>`;
            return;
        }
        grid.innerHTML = keys.map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body"><div class="phone-screen"><div class="typing-text">WELCOME<br>NODE_${name}</div></div></div>
                <div class="status-label">[ STANDBY_LINK ]</div>
            </div>
        `).join('');
    };

    window.activateDevice = (name, element) => {
        element.classList.add('lights-on'); 
        const statusLabel = element.querySelector('.status-label');
        statusLabel.innerHTML = "[ UPLINK_SYNC_DATA ]";
        statusLabel.classList.add('uplink-sync');

        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `
                <button onclick="openMemoirs('${name}')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:10px; width:100%; cursor:pointer;">[ VIEW_${name}_MEMOIRS ]</button>
            `;
            
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));

            // --- ETO YUNG BINAGO: NILAGYAN NG HAS-EXPENSES CHECK ---
            document.getElementById('vagentSection').innerHTML = sorted.map(v => {
                // Check kung may laman ang listahan ng gastos
                const hasHistory = v.expensesBreakdown && v.expensesBreakdown.length > 0;
                
                return `
                    <div class="folder-box ${hasHistory ? 'has-expenses' : ''}" onclick="openNoirModal('${v.id}')">
                        <div class="paper-sheet"></div>
                        <div class="folder-main"></div>
                        <div class="file-label">#${v.vAgentID}</div>
                    </div>
                `;
            }).join('') + `<div class="folder-box shadow-folder"><div class="folder-main"></div><div class="file-label">LOCKED</div></div>`;
            
        }, 1800);
    };

    window.openNoirModal = (docID) => {
        const data = allMissions.find(m => m.id === docID);
        if(!data) return;

        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-order').innerText = docID.substring(0,12).toUpperCase();
        document.getElementById('n-vagent').innerText = data.vAgentID;

        let expHTML = "";
        if(data.expensesBreakdown && Array.isArray(data.expensesBreakdown)) {
            const sorted = data.expensesBreakdown.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            expHTML = sorted.map(e => {
                const d = e.timestamp ? new Date(e.timestamp) : new Date();
                const displayDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).replace(',', ' /');
                const randomIndex = Math.floor(Math.random() * INTEL_TERMS.length);
                const intelDesc = e.description || INTEL_TERMS[randomIndex];
                return `
                    <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:6px; border-bottom: 1px dotted rgba(0,0,0,0.3); padding-bottom: 2px;">
                        <span><span style="opacity:0.6;">${displayDate}</span> — ${intelDesc}</span>
                        <b>₱${(e.amount || 0).toLocaleString()}</b>
                    </div>`;
            }).join('');
        } else {
            expHTML = "<p style='font-size:10px; opacity:0.5; text-align:center;'>[ NO_OPERATIONAL_LOGS ]</p>";
        }

        document.getElementById('n-content').innerHTML = `
            <div style="font-size:11px; margin-bottom:12px;">
                <p><b>SecureLine:</b> <span class="secure-marker">${data.marker || 'SECRET_LINE'}</span></p>
                <p><b>Deployment:</b> ${data.deploymentDate || 'TBD'}</p>
            </div>
            <p style="font-size:10px; font-weight:bold; border-top:1px solid #000; padding-top:10px; margin-bottom:8px; letter-spacing:1.5px;">OPERATIONAL_LOGS:</p>
            <div style="max-height:160px; overflow-y:auto; margin-bottom:15px; padding-right:5px;">
                ${expHTML}
            </div>
            <center>
                <button onclick="alert('System Locked: Auth Required')" class="btn-terminate">TERMINATE_AGENT</button>
            </center>
        `;
        document.getElementById('n-total').innerText = `₱ ${(data.totalExpenses || 0).toLocaleString()}`;
    };

   // Flip Function
window.flipPage = (isFlipped) => {
    const p1 = document.getElementById('p1');
    const p2 = document.getElementById('p2');
    if(isFlipped) {
        p1.classList.add('flipped');
        p2.style.zIndex = "3";
        p1.style.zIndex = "1";
    } else {
        p1.classList.remove('flipped');
        p2.style.zIndex = "1";
        p1.style.zIndex = "3";
    }
};

window.openMemoirs = (mode) => {
    document.getElementById('memoirsOverlay').style.display = 'flex';
    // Reset page to front whenever opened
    flipPage(false);

    let filtered = (mode === 'ALL') 
        ? allMissions 
        : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);

    // No-Zero Filter & Sort
    const validRecords = filtered.filter(m => (m.totalExpenses || 0) > 0);
    validRecords.sort((a, b) => b.id.localeCompare(a.id));

    // Display Page 1 (Limit 10)
    document.getElementById('active-list').innerHTML = validRecords.slice(0, 10).map(m => `
        <div class="expense-row" style="border-bottom: 1px solid rgba(0,0,0,0.2); padding: 10px 0;">
            <span>
                <b style="font-size: 9px; color: #8b0000;">REF: ${m.id.substring(0,8)}</b><br>
                ${m.vAgentID ? 'vAGENT_#' + m.vAgentID : 'AGENT_' + (m.agent || 'SYSTEM')}
            </span>
            <b style="font-size: 16px;">₱${m.totalExpenses.toLocaleString()}</b>
        </div>
    `).join('') || "<p style='text-align:center; opacity:0.4;'>NO DATA RECORDED</p>";

    // Calculate Summary Page
    let grandTotal = 0;
    const systems = {};
    validRecords.forEach(m => {
        const sys = DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem;
        systems[sys] = (systems[sys] || 0) + m.totalExpenses;
        grandTotal += m.totalExpenses;
    });

    document.getElementById('weapon-system-breakdown').innerHTML = Object.keys(systems).map(s => `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
            <span>${s.toUpperCase()}:</span>
            <b>₱${systems[s].toLocaleString()}</b>
        </div>
    `).join('');

    document.getElementById('total-val').innerText = grandTotal.toLocaleString();
    document.getElementById('target-name').innerText = mode;
};

</script>
</body>
</html>
