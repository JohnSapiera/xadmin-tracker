<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v11_REMASTERED</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #01080b; --panel: rgba(2, 15, 20, 0.98); --cyan: #00f3ff; 
      --red: #ff003c; --blue: #007bff; --green: #00ff66; 
      --border: rgba(0, 243, 255, 0.2); --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Terminal Font Styling */
    .cia-text { font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; }

    /* Header & Status */
    header { padding: 15px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .status-bar { font-size: 9px; font-family: var(--mono); color: var(--cyan); padding: 8px 15px; background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }

    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 30px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }

    /* Input Field */
    #mission-input { 
        width: 100%; background: #000; border: 2px solid #1a262b; border-left: 5px solid var(--cyan);
        color: var(--cyan); font-family: var(--mono); font-size: 45px; padding: 15px; text-align: center; letter-spacing: 10px; outline: none;
    }

    /* Buttons */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
    .btn { height: 60px; font-family: var(--mono); font-size: 12px; font-weight: 800; border: 1px solid; background: rgba(0,0,0,0.4); cursor: pointer; transition: 0.3s; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%); }
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { color: var(--blue) !important; border-color: var(--blue) !important; box-shadow: 0 0 15px var(--blue); }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    #terminal { background: rgba(0,0,0,0.9); border: 1px solid #111; padding: 15px; font-family: var(--mono); font-size: 11px; height: 150px; color: #4a5a61; margin-top: 20px; overflow-y: auto; }

    /* POP-UP REMASTERED */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; align-items: center; justify-content: center; }
    .popup { width: 340px; background: #020a0d; border: 1px solid var(--cyan); padding: 25px; position: relative; border-radius: 2px; }
    
    .pop-title { font-family: var(--mono); font-size: 22px; color: var(--cyan); text-align: center; margin-bottom: 5px; text-shadow: 0 0 10px var(--cyan); }
    .pop-subtitle { font-family: var(--mono); font-size: 10px; color: #4a5a61; text-align: center; margin-bottom: 20px; letter-spacing: 2px; }

    .p-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-family: var(--mono); font-size: 11px; border-bottom: 1px solid rgba(0,243,255,0.05); padding-bottom: 5px; }
    .p-label { color: #556b73; }
    .p-val { color: #fff; }

    /* Weapon System Device Buttons */
    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
    .dev-btn { 
        background: transparent; border: 1px solid #1a262b; color: #4a5a61; padding: 8px; 
        font-family: var(--mono); font-size: 9px; cursor: pointer; transition: 0.3s;
    }
    .dev-btn.active { 
        border-color: var(--cyan); color: var(--cyan); 
        background: rgba(0, 243, 255, 0.1); 
        animation: dev-pulse 1.5s infinite;
    }
    @keyframes dev-pulse { 0%, 100% { box-shadow: inset 0 0 5px var(--cyan); } 50% { box-shadow: inset 0 0 12px var(--cyan); } }

    .v-input { background: transparent; border: none; border-bottom: 1px solid var(--cyan); color: var(--green); width: 100px; text-align: right; font-family: var(--mono); outline: none; }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:12px; height:12px; background:var(--cyan); margin-right:10px; box-shadow: 0 0 10px var(--cyan);"></div>
    <span class="cia-text" style="font-size: 14px; color: var(--cyan);">INTEL_CORE_v11</span>
  </div>
</header>

<div class="status-bar">
    <span id="clock">00:00:00</span>
    <span id="device-tag">NODE: <span class="cia-text">OFFLINE</span></span>
</div>

<main>
  <div class="command-module">
    <div class="cia-text" style="font-size: 10px; color: var(--cyan); margin-bottom: 20px; opacity: 0.6;">// SECTOR_SCANNER_v11</div>
    <div class="input-container">
        <input type="tel" id="mission-input" placeholder="00000" maxlength="5">
    </div>
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="term-btn" class="btn btn-terminate" onclick="location.reload()">ABORT</button>
    </div>
  </div>
  <div id="terminal">> SYSTEM_READY...</div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div class="pop-title" id="pop-m-id">#00000</div>
        <div class="pop-subtitle" id="pop-agent">AGENT_NAME</div>

        <div class="p-row"><span class="p-label">WEAPON_SYSTEM:</span></div>
        <div class="device-grid" id="device-list">
            </div>

        <div class="p-row" style="margin-top:20px;">
            <span class="p-label">V_AGENT#:</span> 
            <input type="text" id="v-agent-input" class="v-input" placeholder="REQUIRED">
        </div>
        <div class="p-row"><span class="p-label">EXPENSES:</span> <span class="p-val" style="color:var(--green)">PHP 0.00</span></div>
        <div class="p-row"><span class="p-label">DEPLOY_DATE:</span> <span class="p-val" id="pop-dep">--/--/--</span></div>
        <div class="p-row"><span class="p-label">RELIEVE_DATE:</span> <span class="p-val" id="pop-rel">--/--/--</span></div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px;">
            <button onclick="submitMission()" class="btn btn-save" style="height:45px;">ASSIGN</button>
            <button onclick="closePopup()" class="btn btn-terminate" style="height:45px;">ABORT</button>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:baab5171d8e0a58acd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const termLog = document.getElementById('terminal');
  let selectedDevice = navigator.platform;

  function log(msg, color = "#4a5a61") {
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.3">${new Date().toLocaleTimeString('en-GB')}</span> > <span style="color:${color}">${msg}</span>`;
    termLog.prepend(d);
  }

  // --- SCANNER LOGIC ---
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    actionBtn.className = "btn btn-save"; // Default Green
    actionBtn.textContent = "SAVE";

    if (val.length >= 4) {
        log(`ANALYZING_ID: [${val}]`, 'var(--cyan)');
        
        try {
            // 1. Check existing mission_orders (Para sa Retrieve/Blue Mode)
            const qExist = query(collection(db, "mission_orders"), where("missionID", "==", val));
            const snapExist = await getDocs(qExist);

            if (!snapExist.empty) {
                log(`MATCH_FOUND: Mission ${val} is active.`, 'var(--blue)');
                actionBtn.className = "btn btn-retrieve";
                actionBtn.textContent = "RETRIEVE";
                return;
            }

            // 2. Check Blacklist
            const qBlack = query(collection(db, "blacklist"), where("targetID", "==", val));
            const snapBlack = await getDocs(qBlack);

            if (!snapBlack.empty) {
                log(`ALERT: ID ${val} RESTRICTED.`, 'var(--red)');
                actionBtn.className = "btn btn-terminate";
                actionBtn.textContent = "LOCKED";
            } else {
                log(`STATUS: ID ${val} CLEAR. READY FOR SAVE.`, 'var(--green)');
            }
        } catch (e) { log("CONNECTION_ERROR", "red"); }
    }
  });

  // --- POPUP & DEVICE SELECTOR ---
  actionBtn.onclick = async () => {
    if (actionBtn.textContent === "RETRIEVE") {
        log(`FETCHING_DATA: Mission ${input.value}...`, 'var(--blue)');
        return; // Dito pwede ilagay ang redirect sa intel.html
    }
    if (input.value.length < 4 || actionBtn.textContent === "LOCKED") return;

    // Load Devices from Agent Record
    const agentName = localStorage.getItem("cia_agent") || "JEFFERSON VALLES";
    const devGrid = document.getElementById('device-list');
    devGrid.innerHTML = ""; // Clear

    try {
        const qAgent = query(collection(db, "agents"), where("agentName", "==", agentName));
        const snapAgent = await getDocs(qAgent);
        
        if (!snapAgent.empty) {
            const linkedDevices = snapAgent.docs[0].data().linkedDevice || [navigator.platform];
            linkedDevices.forEach(dev => {
                const b = document.createElement('button');
                b.className = `dev-btn ${dev === navigator.platform ? 'active' : ''}`;
                b.innerText = dev;
                b.onclick = () => {
                    document.querySelectorAll('.dev-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    selectedDevice = dev;
                };
                devGrid.appendChild(b);
            });
        }
    } catch (e) { log("DEVICE_FETCH_ERROR", "red"); }

    const now = new Date();
    const rel = new Date(); rel.setDate(now.getDate() + 30);
    
    document.getElementById('pop-m-id').innerText = `#${input.value}`;
    document.getElementById('pop-agent').innerText = agentName;
    document.getElementById('pop-dep').innerText = now.toLocaleDateString('en-GB');
    document.getElementById('pop-rel').innerText = rel.toLocaleDateString('en-GB');
    document.getElementById('modal-overlay').style.display = 'flex';
  };

  window.closePopup = () => document.getElementById('modal-overlay').style.display = 'none';

  // --- SUBMIT ---
  window.submitMission = async () => {
    const vId = document.getElementById('v-agent-input').value;
    if (!vId) return alert("V_AGENT# IS MANDATORY");

    log("UPLOADING_MISSION_PROFILE...", "var(--cyan)");
    try {
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value,
            agentName: document.getElementById('pop-agent').innerText,
            vAgentID: vId,
            weaponSystem: selectedDevice,
            expenses: "PHP 0.00",
            deploymentDate: serverTimestamp(),
            relieveDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000),
            status: "ACTIVE"
        });
        log("MISSION_PROFILE_ENCRYPTED", "var(--green)");
        setTimeout(() => location.reload(), 1500);
    } catch (e) { log("UPLOAD_FAILED", "red"); }
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
