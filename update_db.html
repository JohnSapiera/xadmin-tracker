<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_UPLINK_v18.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #020a0d; --green: #00ff66; --border: rgba(0, 242, 255, 0.2); }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Share Tech Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #020a0d 100%);
        }

        .card { 
            width: 320px; background: rgba(1, 15, 20, 0.9); padding: 25px; 
            border: 1px solid var(--border); backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0,0,0,0.9); position: relative;
        }

        h2 { 
            font-size: 14px; margin: 0 0 20px 0; color: var(--cyan); 
            text-align: center; letter-spacing: 3px; text-transform: uppercase;
            border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }

        .form-container { display: flex; flex-direction: column; gap: 15px; }
        .field-group { width: 100%; }
        label { font-size: 9px; color: var(--cyan); text-transform: uppercase; margin-bottom: 6px; display: block; opacity: 0.7; }
        
        .input-field {
            width: 100%; box-sizing: border-box; padding: 12px; 
            background: rgba(0,0,0,0.8); border: 1px solid var(--border);
            color: var(--green); font-family: 'Share Tech Mono'; font-size: 11px;
            outline: none; border-radius: 0;
        }

        .btn-auth {
            width: 100%; padding: 16px; background: transparent; 
            color: var(--green); border: 1px solid var(--green);
            font-family: 'Share Tech Mono'; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; font-size: 11px;
            margin-top: 10px; transition: 0.3s;
        }
        .btn-auth:hover { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(0, 255, 102, 0.3); }

        .ticker-wrap {
            margin-top: 25px; background: rgba(0, 242, 255, 0.05);
            border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
            overflow: hidden; white-space: nowrap; padding: 8px 0;
        }
        .ticker-move { display: inline-block; animation: marquee 20s linear infinite; font-size: 9px; color: #556b73; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .ticker-item { display: inline-block; margin-right: 40px; }
        .ticker-item span { color: var(--cyan); font-weight: bold; }

        #status { font-size: 9px; text-align: center; margin-top: 15px; color: #4a5a61; min-height: 12px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>MULTI_DEVICE_UPLINK</h2>

        <div class="form-container">
            <div class="field-group">
                <label>CURRENT_NODE_SIGNATURE:</label>
                <input type="text" id="val-fp" class="input-field" readonly>
            </div>

            <div class="field-group">
                <label>SELECT_AGENT_PROFILE:</label>
                <select id="agentSelect" class="input-field">
                    <option value="JEFFERSON VALLES">AGENT_JEFFERSON</option>
                    <option value="AGENT_LZ">AGENT_LZ</option>
                </select>
            </div>

            <button class="btn-auth" onclick="authorizeAccess()">Authorize Current Device</button>
        </div>

        <div id="status">> SYSTEM_READY...</div>

        <div class="ticker-wrap">
            <div class="ticker-move" id="ticker-content"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function getHardwareSpecs() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
            
            return {
                brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || "NODE_STATION",
                gpu: gpu.split('/').pop().trim(),
                res: `${window.screen.width}x${window.screen.height}`,
                plt: navigator.platform
            };
        }

        function generateSignature(s) {
            const raw = s.gpu + s.res + s.plt + s.brand;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash |= 0;
            }
            return "SIG-" + Math.abs(hash).toString(16).toUpperCase();
        }

        const specs = getHardwareSpecs();
        const signature = generateSignature(specs);

        document.getElementById('val-fp').value = signature;
        const tickerHtml = `
            <div class="ticker-item">MODEL: <span>${specs.brand}</span></div>
            <div class="ticker-item">GPU: <span>${specs.gpu}</span></div>
            <div class="ticker-item">SCREEN: <span>${specs.res}</span></div>
            <div class="ticker-item">PLATFORM: <span>${specs.plt}</span></div>
        `;
        document.getElementById('ticker-content').innerHTML = tickerHtml + tickerHtml;

        async function authorizeAccess() {
            const agent = document.getElementById('agentSelect').value;
            const log = document.getElementById('status');
            log.innerHTML = `> SYNCING_WITH_CENTRAL_DB...`;

            try {
                // Gagamit tayo ng arrayUnion para ma-store ang signature sa 'linkedSignatures' array
                await db.collection("agents").doc(agent).set({
                    agentName: agent,
                    // Ito ang magic part: ina-add nito ang bagong signature sa listahan nang hindi nabubura ang luma
                    linkedSignatures: firebase.firestore.FieldValue.arrayUnion(signature),
                    lastFingerprint: signature,
                    lastSync: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                localStorage.setItem("cia_agent", agent);
                log.innerHTML = `> <span style="color:var(--green)">UPLINK_SUCCESSFUL</span>`;
                alert(`DEVICE AUTHORIZED: Current device signature [${signature}] has been linked to Agent ${agent}.`);
            } catch (e) {
                log.innerHTML = `> ERROR: ${e.message}`;
            }
        }
    </script>
</body>
</html>
