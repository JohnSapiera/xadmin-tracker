<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT_ACCESS_TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #01080b; --cyan: #00f2ff; --red: #ff003c; --green: #00ff66; --yellow: #ffbd00; }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
            padding: 16px;
        }

        .terminal {
            width: 100%;
            max-width: 400px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 24px 20px;
            position: relative;
            border-radius: 8px;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
            animation: scanMove 2.5s ease-in-out infinite;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }

        .badge {
            text-align: center;
            font-size: 10px;
            letter-spacing: 3px;
            color: #4a5a61;
            margin-bottom: 20px;
        }

        .status-text {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: #00f2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .trace-container {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 4px;
        }

        .trace-label {
            font-size: 8px;
            color: #5c7882;
            letter-spacing: 1px;
        }

        .trace-value {
            font-size: 10px;
            color: #05ffa1;
            word-break: break-all;
            margin-top: 5px;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .key-btn {
            aspect-ratio: 1 / 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #00f2ff;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            border-radius: 50%;
        }

        .key-btn:active {
            transform: scale(0.92);
            background: #00f2ff;
            color: #000;
            border-color: #00f2ff;
        }

        .key-zero {
            grid-column: 2 / 3;
        }

        .hidden {
            display: none;
        }

        .code-area {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .code-digits {
            font-size: 28px;
            letter-spacing: 8px;
            color: #05ffa1;
            font-weight: bold;
        }

        .helper-text {
            font-size: 9px;
            color: #5c7882;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid #1a2f37;
            padding: 12px;
            color: #5c7882;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-clear {
            border-color: #ff003c;
            color: #ff003c;
        }

        .btn-clear:active {
            background: #ff003c;
            color: #000;
        }

        .message-area {
            margin-top: 15px;
            text-align: center;
            font-size: 11px;
            min-height: 40px;
            padding: 8px;
        }

        .error-msg {
            color: #ff003c;
        }

        .success-msg {
            color: #00ff66;
        }

        .info-msg {
            color: #ffbd00;
        }
    </style>
</head>
<body>

<div class="terminal" id="app">
    <div class="scan-line"></div>
    
    <div class="badge">HARDWARE_AUDIT_TERMINAL</div>
    <div class="status-text" id="statusLabel">INITIALIZING_SCAN</div>

    <div class="trace-container">
        <div class="trace-label">DEVICE_FINGERPRINT</div>
        <div class="trace-value" id="deviceSig">-- SCANNING --</div>
    </div>

    <div id="keypadSection" class="hidden">
        <div class="code-area">
            <div class="code-digits" id="codeDisplay">----</div>
            <div class="helper-text">ENTER 4-DIGIT SECRET KEY</div>
        </div>
        
        <div class="keypad" id="numericKeypad"></div>
        
        <div class="action-buttons">
            <div class="btn btn-clear" id="clearBtn">CLEAR</div>
            <div class="btn" id="cancelBtn">CANCEL</div>
        </div>
    </div>

    <div class="message-area" id="messageArea"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    // ========== FIREBASE CONFIGURATION ==========
    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // ========== DOM ELEMENTS ==========
    const statusLabel = document.getElementById('statusLabel');
    const deviceSigSpan = document.getElementById('deviceSig');
    const keypadSection = document.getElementById('keypadSection');
    const codeDisplay = document.getElementById('codeDisplay');
    const messageArea = document.getElementById('messageArea');
    
    // ========== STATE ==========
    let currentSignature = "";
    let enteredCode = "";
    let isProcessing = false;
    
    // ========== HELPER FUNCTIONS ==========
    function showMessage(text, type = 'info') {
        let className = '';
        if (type === 'error') className = 'error-msg';
        else if (type === 'success') className = 'success-msg';
        else className = 'info-msg';
        
        messageArea.innerHTML = `<div class="${className}">${text}</div>`;
        setTimeout(() => {
            if (messageArea.innerHTML === `<div class="${className}">${text}</div>`) {
                messageArea.innerHTML = "";
            }
        }, 3000);
    }
    
    function clearCode() {
        enteredCode = "";
        codeDisplay.innerText = "----";
    }
    
    function addDigit(digit) {
        if (enteredCode.length < 4) {
            enteredCode += digit;
            let displayStr = enteredCode + "----".substring(enteredCode.length);
            codeDisplay.innerText = displayStr;
            
            const buttons = document.querySelectorAll('.key-btn');
            buttons.forEach(btn => {
                if (btn.innerText === digit) {
                    btn.style.transform = 'scale(0.92)';
                    btn.style.background = '#00f2ff';
                    btn.style.color = '#000';
                    setTimeout(() => {
                        btn.style.transform = '';
                        btn.style.background = '';
                        btn.style.color = '';
                    }, 150);
                }
            });
            
            if (enteredCode.length === 4) {
                verifySecretKey(enteredCode);
            }
        }
    }
    
    // ========== DEVICE FINGERPRINT ==========
    function generateSignature() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
        
        const specs = {
            brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || "NODE_STATION",
            gpu: gpu.split('/').pop().trim(),
            res: `${window.screen.width}x${window.screen.height}`,
            plt: navigator.platform
        };
        
        const raw = specs.gpu + specs.res + specs.plt + specs.brand;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "SIG-" + Math.abs(hash).toString(16).toUpperCase();
    }
    
    // ========== REGISTER FINGERPRINT TO AGENT ==========
    async function registerFingerprint(agentName, signature) {
        try {
            const agentRef = db.collection("agents").doc(agentName);
            const agentDoc = await agentRef.get();
            
            if (agentDoc.exists) {
                const currentSignatures = agentDoc.data().linkedSignatures || [];
                if (!currentSignatures.includes(signature)) {
                    currentSignatures.push(signature);
                }
                await agentRef.update({
                    linkedSignatures: currentSignatures,
                    lastFingerprint: signature,
                    lastSync: firebase.firestore.FieldValue.serverTimestamp()
                });
            } else {
                await agentRef.set({
                    agentName: agentName,
                    linkedSignatures: [signature],
                    lastFingerprint: signature,
                    lastSync: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            return true;
        } catch (error) {
            console.error("Registration error:", error);
            return false;
        }
    }
    
    // ========== VERIFY SECRET KEY ==========
    async function verifySecretKey(secretKey) {
        if (isProcessing) return;
        isProcessing = true;
        
        statusLabel.innerHTML = "VERIFYING_KEY";
        showMessage("Authenticating secret key...", 'info');
        
        try {
            const snapshot = await db.collection("agents")
                .where("secretKey", "==", secretKey)
                .get();
            
            if (!snapshot.empty) {
                const agentData = snapshot.docs[0].data();
                const agentName = agentData.agentName;
                
                showMessage(`Key verified. Registering device...`, 'info');
                statusLabel.innerHTML = "REGISTERING_DEVICE";
                
                const success = await registerFingerprint(agentName, currentSignature);
                
                if (success) {
                    showMessage(`Device registered successfully. Access granted.`, 'success');
                    statusLabel.innerHTML = "ACCESS_GRANTED";
                    
                    localStorage.setItem("cia_agent", agentName);
                    localStorage.setItem("agent", agentName);
                    localStorage.setItem("agent_verified", "true");
                    localStorage.setItem("device_signature", currentSignature);
                    localStorage.setItem("secret_key", secretKey);
                    
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);
                } else {
                    showMessage("Registration failed. Please try again.", 'error');
                    statusLabel.innerHTML = "REGISTRATION_FAILED";
                    clearCode();
                    isProcessing = false;
                }
            } else {
                showMessage("Invalid secret key. Access denied.", 'error');
                statusLabel.innerHTML = "ACCESS_DENIED";
                clearCode();
                isProcessing = false;
            }
        } catch (error) {
            console.error("Verification error:", error);
            showMessage("Connection error. Please try again.", 'error');
            statusLabel.innerHTML = "ERROR";
            isProcessing = false;
        }
    }
    
    // ========== CHECK EXISTING FINGERPRINT ==========
    async function checkExistingFingerprint(signature) {
        statusLabel.innerHTML = "SCANNING_DATABASE";
        deviceSigSpan.innerText = signature;
        
        try {
            const snapshot = await db.collection("agents")
                .where("linkedSignatures", "array-contains", signature)
                .get();
            
            if (!snapshot.empty) {
                const agentData = snapshot.docs[0].data();
                const agentName = agentData.agentName;
                
                statusLabel.innerHTML = "ACCESS_GRANTED";
                showMessage(`Welcome back, ${agentName}. Redirecting...`, 'success');
                
                localStorage.setItem("cia_agent", agentName);
                localStorage.setItem("agent", agentName);
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("device_signature", signature);
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);
            } else {
                statusLabel.innerHTML = "DEVICE_NOT_REGISTERED";
                showMessage("Device not recognized. Enter your 4-digit secret key to register.", 'error');
                keypadSection.classList.remove("hidden");
            }
        } catch (error) {
            console.error("Check error:", error);
            statusLabel.innerHTML = "SCAN_ERROR";
            showMessage("Database connection error. Please try again.", 'error');
        }
    }
    
    // ========== BUILD KEYPAD ==========
    function buildKeypad() {
        const keypadContainer = document.getElementById('numericKeypad');
        const layout = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        keypadContainer.innerHTML = '';
        
        layout.forEach(digit => {
            const btn = document.createElement('div');
            btn.className = 'key-btn';
            if (digit === '0') btn.classList.add('key-zero');
            btn.innerText = digit;
            btn.onclick = () => addDigit(digit);
            keypadContainer.appendChild(btn);
        });
    }
    
    // ========== EVENT LISTENERS ==========
    document.getElementById('clearBtn').onclick = () => {
        clearCode();
    };
    
    document.getElementById('cancelBtn').onclick = () => {
        keypadSection.classList.add("hidden");
        statusLabel.innerHTML = "SCAN_CANCELLED";
        showMessage("Registration cancelled. Reloading...", 'error');
        setTimeout(() => location.reload(), 1500);
    };
    
    // ========== INITIALIZE ==========
    function init() {
        buildKeypad();
        currentSignature = generateSignature();
        deviceSigSpan.innerText = currentSignature;
        setTimeout(() => {
            checkExistingFingerprint(currentSignature);
        }, 1000);
    }
    
    init();
</script>

</body>
</html>
