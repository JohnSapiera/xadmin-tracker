<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE_ACCESS_TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
            padding: 20px;
        }

        /* Main Container */
        .terminal {
            width: 100%;
            max-width: 400px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 30px 20px;
            position: relative;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.05);
        }

        /* Scan Line Effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f2ff;
            box-shadow: 0 0 15px #00f2ff;
            animation: scanMove 2.5s ease-in-out infinite;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .badge {
            font-size: 10px;
            letter-spacing: 4px;
            color: #4a5a61;
            margin-bottom: 10px;
        }
        .status-text {
            font-size: 14px;
            font-weight: bold;
            color: #00f2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Trace / Signature Display */
        .trace-container {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 12px;
            margin-bottom: 25px;
            text-align: center;
        }
        .trace-label {
            font-size: 9px;
            color: #5c7882;
            letter-spacing: 2px;
        }
        .trace-value {
            font-size: 11px;
            color: #05ffa1;
            word-break: break-all;
            margin-top: 5px;
            font-family: monospace;
        }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .key-btn {
            aspect-ratio: 1 / 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #00f2ff;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .key-btn:active {
            transform: scale(0.92);
            background: #00f2ff;
            color: #000;
            border-color: #00f2ff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
        }
        .key-zero {
            grid-column: 2 / 3;
        }

        /* Hidden initially */
        .hidden {
            display: none;
        }

        /* Code Display */
        .code-area {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        .code-digits {
            font-size: 28px;
            letter-spacing: 8px;
            color: #05ffa1;
            font-family: monospace;
        }
        .helper-text {
            font-size: 9px;
            color: #5c7882;
            margin-top: 5px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid #1a2f37;
            padding: 12px;
            color: #5c7882;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn-primary {
            border-color: #00f2ff;
            color: #00f2ff;
        }
        .btn-primary:active {
            background: #00f2ff;
            color: #000;
        }
        .btn-danger {
            border-color: #ff003c;
            color: #ff003c;
        }

        /* Error / Success Messages */
        .message-area {
            margin-top: 20px;
            text-align: center;
            font-size: 11px;
            min-height: 45px;
            padding: 8px;
        }
        .error-msg {
            color: #ff003c;
            border-top: 1px solid rgba(255,0,60,0.2);
            padding-top: 8px;
        }
        .success-msg {
            color: #00ff66;
        }

        /* Loading Animation */
        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 1px solid #00f2ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="terminal" id="app">
    <div class="scan-line" id="scanLine"></div>
    
    <div class="header">
        <div class="badge">HARDWARE_AUDIT_TERMINAL</div>
        <div class="status-text" id="statusLabel">INITIALIZING_SCAN</div>
    </div>

    <!-- Device Signature Section -->
    <div class="trace-container">
        <div class="trace-label">DEVICE_FINGERPRINT</div>
        <div class="trace-value" id="deviceSig">-- SCANNING --</div>
    </div>

    <!-- Keypad Section (Hidden by default) -->
    <div id="keypadSection" class="hidden">
        <div class="code-area">
            <div class="code-digits" id="codeDisplay">----</div>
            <div class="helper-text">ENTER 4-DIGIT SECRET KEY</div>
        </div>
        
        <div class="keypad" id="numericKeypad">
            <!-- Dynamic buttons will be injected -->
        </div>
        
        <div class="action-buttons">
            <div class="btn btn-danger" id="clearBtn">CLEAR</div>
            <div class="btn" id="cancelBtn">CANCEL</div>
        </div>
    </div>

    <!-- Message Area -->
    <div class="message-area" id="messageArea"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    // Firebase Configuration
    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // DOM Elements
    const statusLabel = document.getElementById('statusLabel');
    const deviceSigSpan = document.getElementById('deviceSig');
    const keypadSection = document.getElementById('keypadSection');
    const codeDisplay = document.getElementById('codeDisplay');
    const messageArea = document.getElementById('messageArea');
    const scanLine = document.getElementById('scanLine');

    // State
    let currentSignature = "";
    let enteredCode = "";
    let isProcessing = false;

    // Helper: Show message
    function showMessage(text, isError = false) {
        messageArea.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`;
        setTimeout(() => {
            if (messageArea.innerHTML === `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`) {
                messageArea.innerHTML = "";
            }
        }, 3000);
    }

    // Helper: Clear keypad input
    function clearCode() {
        enteredCode = "";
        codeDisplay.innerText = "----";
    }

    // Helper: Add digit to code
    function addDigit(digit) {
        if (enteredCode.length < 4) {
            enteredCode += digit;
            let displayStr = enteredCode + "----".substring(enteredCode.length);
            codeDisplay.innerText = displayStr;
            
            // Animate button press effect (blink)
            const buttons = document.querySelectorAll('.key-btn');
            buttons.forEach(btn => {
                if (btn.innerText === digit) {
                    btn.style.transform = 'scale(0.92)';
                    btn.style.background = '#00f2ff';
                    btn.style.color = '#000';
                    setTimeout(() => {
                        btn.style.transform = '';
                        btn.style.background = '';
                        btn.style.color = '';
                    }, 150);
                }
            });

            // If 4 digits are entered, auto-submit
            if (enteredCode.length === 4) {
                verifySecretKey(enteredCode);
            }
        }
    }

    // Generate Device Signature (Fingerprint)
    function generateSignature() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
        
        const specs = {
            brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || "NODE_STATION",
            gpu: gpu.split('/').pop().trim(),
            res: `${window.screen.width}x${window.screen.height}`,
            plt: navigator.platform
        };

        const raw = specs.gpu + specs.res + specs.plt + specs.brand;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "SIG-" + Math.abs(hash).toString(16).toUpperCase();
    }

    // Register new fingerprint to existing agent (using secret key)
    async function registerFingerprint(agentName, signature) {
        try {
            const agentRef = db.collection("agents").doc(agentName);
            await agentRef.update({
                linkedSignatures: firebase.firestore.FieldValue.arrayUnion(signature),
                lastFingerprint: signature,
                lastSync: firebase.firestore.FieldValue.serverTimestamp()
            });
            return true;
        } catch (error) {
            console.error("Registration error:", error);
            return false;
        }
    }

    // Verify Secret Key from agents collection
    async function verifySecretKey(secretKey) {
        if (isProcessing) return;
        isProcessing = true;
        
        statusLabel.innerHTML = "VERIFYING_KEY";
        showMessage("Authenticating secret key...");
        
        try {
            const snapshot = await db.collection("agents")
                .where("secretKey", "==", secretKey)
                .get();
            
            if (!snapshot.empty) {
                const agentData = snapshot.docs[0].data();
                const agentName = agentData.agentName || snapshot.docs[0].id;
                
                showMessage(`Key verified. Registering device...`);
                statusLabel.innerHTML = "REGISTERING_DEVICE";
                
                // Register the fingerprint to this agent
                const success = await registerFingerprint(agentName, currentSignature);
                
                if (success) {
                    showMessage(`Device registered successfully. Access granted.`);
                    statusLabel.innerHTML = "ACCESS_GRANTED";
                    
                    // Save to localStorage
                    localStorage.setItem("cia_agent", agentName);
                    localStorage.setItem("agent", agentName);
                    localStorage.setItem("agent_verified", "true");
                    localStorage.setItem("device_signature", currentSignature);
                    
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);
                } else {
                    showMessage("Registration failed. Please try again.", true);
                    statusLabel.innerHTML = "REGISTRATION_FAILED";
                    clearCode();
                    isProcessing = false;
                }
            } else {
                showMessage("Invalid secret key. Access denied.", true);
                statusLabel.innerHTML = "ACCESS_DENIED";
                clearCode();
                isProcessing = false;
            }
        } catch (error) {
            console.error(error);
            showMessage("Connection error. Please try again.", true);
            statusLabel.innerHTML = "ERROR";
            isProcessing = false;
        }
    }

    // Main Authentication: Check if device signature exists in Firebase
    async function authenticateDevice(signature) {
        statusLabel.innerHTML = "SCANNING_DATABASE";
        deviceSigSpan.innerText = signature;
        
        try {
            const snapshot = await db.collection("agents")
                .where("linkedSignatures", "array-contains", signature)
                .get();
            
            if (!snapshot.empty) {
                const agentData = snapshot.docs[0].data();
                const agentName = agentData.agentName || snapshot.docs[0].id;
                
                statusLabel.innerHTML = "ACCESS_GRANTED";
                showMessage(`Welcome back, ${agentName}. Redirecting...`);
                
                localStorage.setItem("cia_agent", agentName);
                localStorage.setItem("agent", agentName);
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("device_signature", signature);
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);
            } else {
                // No match found -> Show keypad for registration
                statusLabel.innerHTML = "DEVICE_NOT_REGISTERED";
                showMessage("Device not recognized. Please enter your 4-digit secret key to register.", true);
                keypadSection.classList.remove("hidden");
                scanLine.style.opacity = "0.2";
            }
        } catch (error) {
            console.error(error);
            statusLabel.innerHTML = "SCAN_ERROR";
            showMessage("Database connection error. Please try again.", true);
        }
    }

    // Initialize Keypad UI
    function buildKeypad() {
        const keypadContainer = document.getElementById('numericKeypad');
        const layout = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        keypadContainer.innerHTML = '';
        
        layout.forEach(digit => {
            const btn = document.createElement('div');
            btn.className = 'key-btn';
            if (digit === '0') btn.classList.add('key-zero');
            btn.innerText = digit;
            btn.onclick = () => addDigit(digit);
            keypadContainer.appendChild(btn);
        });
    }

    // Event Listeners for Buttons
    document.getElementById('clearBtn').onclick = () => clearCode();
    document.getElementById('cancelBtn').onclick = () => {
        keypadSection.classList.add("hidden");
        scanLine.style.opacity = "0.6";
        statusLabel.innerHTML = "SCAN_CANCELLED";
        showMessage("Registration cancelled. Reloading...", true);
        setTimeout(() => location.reload(), 1500);
    };

    // Start the process
    function init() {
        buildKeypad();
        currentSignature = generateSignature();
        deviceSigSpan.innerText = currentSignature;
        
        setTimeout(() => {
            authenticateDevice(currentSignature);
        }, 1000);
    }
    
    init();
</script>
</body>
</html>
