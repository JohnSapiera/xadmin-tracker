<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOSSAD - TACTICAL TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050506;
            --panel: #0a0a0c;
            --cyan: #00f2ff;
            --red: #ff3c3c;
            --green: #00ff00;
            --border: rgba(0, 242, 255, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: #e0e6ed;
            font-family: 'JetBrains Mono', monospace;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border: 1px solid var(--cyan);
            font-size: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.8);
        }

        /* Main Container - Single Column for Mobile */
        .main-container {
            display: flex; flex-direction: column; gap: 15px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 15px;
            display: flex; flex-direction: column;
        }

        .panel-header {
            font-size: 11px; font-weight: 800; color: var(--cyan);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px; margin-bottom: 12px;
            letter-spacing: 2px;
        }

        /* Scanner Styling */
        input[type="text"], input[type="number"] {
            background: #000; border: 1px solid #333; color: var(--cyan);
            padding: 15px; width: 100%; font-family: inherit;
            font-size: 16px; outline: none; margin-bottom: 10px;
        }

        .terminal-log {
            background: #000; padding: 10px; font-size: 10px;
            height: 80px; overflow-y: auto; color: #888;
            border-left: 2px solid #333; margin-bottom: 10px;
        }

        /* Animated Buttons */
        .btn-green-pulse {
            background: var(--green); color: #000; border: none;
            padding: 15px; font-weight: 800; width: 100%;
            cursor: pointer; animation: pulse 1.5s infinite;
            text-transform: uppercase; margin-top: 5px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
        }

        .folder-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-top: 10px;
        }

        .folder-btn {
            background: #111; border: 1px solid var(--cyan);
            color: #fff; padding: 12px; font-size: 11px; cursor: pointer;
        }

        .accept-btn {
            background: var(--cyan); color: #000; border: none;
            padding: 15px; font-weight: 800; width: 100%;
            margin-top: 15px; cursor: pointer;
        }

        /* Bounty List Styling */
        .bounty-item {
            border-left: 2px solid var(--cyan); background: rgba(255,255,255,0.02);
            padding: 10px; margin-bottom: 8px; font-size: 11px;
        }

        .hidden { display: none !important; }
        
        /* Navigation */
        .nav-link { color: var(--cyan); text-decoration: underline; cursor: pointer; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="status-header">
        <div>AGENT: <span id="agentID" style="color:var(--cyan)">GHOST</span></div>
        <div class="nav-link" onclick="window.location.href='profile.html'">[MY_PROFILE]</div>
        <div id="clock">00:00:00</div>
    </div>

    <div class="main-container">
        
        <div class="panel">
            <div class="panel-header">🔒 TERMINATION_SCANNER</div>
            
            <input type="text" id="scanInput" placeholder="ENTER MISSION ORDER" oninput="runTacticalScan(this.value)" maxlength="5">
            
            <div class="terminal-log" id="scanLog">> SYSTEM READY. STANDBY FOR INPUT...</div>

            <div id="saveStage" class="hidden">
                <button class="btn-green-pulse" onclick="showFolders()">📂 INITIALIZE SAVE PROTOCOL</button>
            </div>

            <div id="folderStage" class="hidden">
                <div style="font-size: 9px; color: var(--cyan); margin-bottom: 5px;">SELECT WEAPON SYSTEM:</div>
                <div class="folder-grid">
                    <button class="folder-btn" onclick="selectWeapon('R8P')">>> R8P</button>
                    <button class="folder-btn" onclick="selectWeapon('RMN14')">>> RMN14</button>
                </div>
            </div>

            <div id="finalStage" class="hidden">
                <div style="font-size: 10px; color: #888; margin-bottom: 5px;">WEAPON: <span id="displayWpn" style="color:var(--cyan)"></span></div>
                <input type="number" id="vAgentInput" placeholder="ENTER V.AGENTS #">
                <button class="accept-btn" onclick="finalizeMission()">ACCEPT MISSION ORDER</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">🛰️ RECENT_DEPLOYMENTS</div>
            <div id="deploymentList" style="max-height: 300px; overflow-y: auto;">
                </div>
        </div>

    </div>

    <script>
        // 1. CONFIG
        const activeAgent = localStorage.getItem("cia_agent") || "GHOST";
        document.getElementById('agentID').innerText = activeAgent;

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const TG_URL = "https://api.telegram.org/bot8639737111:AAGvCqiHzkiJvVqH6YPocRIVMoiXZlK4ZWg/sendMessage?chat_id=7298607329";

        let currentMO = "";
        let currentWpn = "";

        // 2. SCANNER LOGIC
        async function runTacticalScan(val) {
            const log = document.getElementById('scanLog');
            const saveStage = document.getElementById('saveStage');
            
            // Hide all stages if typing
            resetStages();

            if(val.length < 4) {
                log.innerHTML = "> SCANNING SIGNALS...";
                return;
            }

            log.innerHTML = `> QUERYING DATABASE FOR MO# ${val}...`;

            try {
                // Tinitignan kung EXISTED na sa blacklist
                const snap = await db.collection("blacklist").where("code", "==", val.trim()).get();

                if(!snap.empty) {
                    log.innerHTML = `<span style="color:var(--red)">> ACCESS DENIED: MO# ${val} ALREADY REGISTERED.</span>`;
                } else {
                    log.innerHTML = `<span style="color:var(--green)">> MO# ${val} IS CLEAR. READY FOR REGISTRATION.</span>`;
                    currentMO = val.trim();
                    saveStage.classList.remove('hidden'); // Papakita ang Green Button
                }
            } catch (e) {
                log.innerHTML = "> DATABASE ERROR. CHECK CONNECTION.";
            }
        }

        function showFolders() {
            document.getElementById('saveStage').classList.add('hidden');
            document.getElementById('folderStage').classList.remove('hidden');
            document.getElementById('scanLog').innerHTML = "> SELECT WEAPON SYSTEM...";
        }

        function selectWeapon(wpn) {
            currentWpn = wpn;
            document.getElementById('displayWpn').innerText = wpn;
            document.getElementById('folderStage').classList.add('hidden');
            document.getElementById('finalStage').classList.remove('hidden');
        }

        async function finalizeMission() {
            const vID = document.getElementById('vAgentInput').value;
            if(!vID) return alert("V-AGENT ID REQUIRED");

            const log = document.getElementById('scanLog');
            log.innerHTML = "> REGISTERING TO CLOUD SERVER...";

            try {
                // I-save sa 'bounties' (Para sa Profile)
                await db.collection("bounties").add({
                    agent: activeAgent,
                    weapon: currentWpn,
                    vid: vID,
                    missionOrder: currentMO,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // I-save sa 'blacklist' (Para hindi na ma-scan ulit)
                await db.collection("blacklist").add({
                    code: currentMO,
                    agent: activeAgent,
                    status: "USED",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Telegram Alert
                fetch(`${TG_URL}&text=${encodeURIComponent(`🛡️ NEW REGISTRATION\nAgent: ${activeAgent}\nMO#: ${currentMO}\nWpn: ${currentWpn}\nV-ID: ${vID}`)}`);

                log.innerHTML = "<span style='color:var(--green)'>> MISSION ARCHIVED SUCCESSFULLY.</span>";
                
                setTimeout(() => {
                    location.reload(); // Refresh para malinis ang UI
                }, 2000);

            } catch (e) {
                log.innerHTML = "<span style='color:var(--red)'>> UPLOAD FAILED.</span>";
            }
        }

        function resetStages() {
            document.getElementById('saveStage').classList.add('hidden');
            document.getElementById('folderStage').classList.add('hidden');
            document.getElementById('finalStage').classList.add('hidden');
        }

        // 3. FETCH RECENT DEPLOYMENTS
        db.collection("bounties").orderBy("timestamp", "desc").limit(5).onSnapshot(snap => {
            const list = document.getElementById('deploymentList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `
                    <div class="bounty-item">
                        <div style="color:var(--cyan)">[${d.missionOrder}] - ${d.weapon}</div>
                        <div style="color:#666; font-size:9px;">TARGET: V-${d.vid} | AGENT: ${d.agent}</div>
                    </div>`;
            });
        });

        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
