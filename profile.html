<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #020608; 
            --cia-cyan: #00e5ff; 
            --cia-red: #ff2a2a;
            --cia-dark-accent: #071a24;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
            --font-hud: 'Rajdhani', sans-serif;
            --paper: #e3dccf;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* --- GLOBAL HUD & SCANLINE EFFECTS --- */
        body { 
            background-color: var(--cia-bg);
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #fff; 
            font-family: var(--font-digital); 
            height: 100vh; 
            overflow-x: hidden;
        }

        /* CRT Scanline Overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.6;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 25px 20px; padding-bottom: 120px; position: relative; z-index: 10; }

        /* --- HEADER --- */
        header { border-left: 3px solid var(--cia-cyan); padding-left: 15px; margin-bottom: 30px; background: linear-gradient(90deg, rgba(0, 229, 255, 0.1) 0%, transparent 100%); padding: 10px 15px; }
        #display-agent { font-family: var(--font-hud); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); font-weight: 700; text-transform: uppercase; }

        /* --- DEVICE GRID (TACTICAL TABLETS) --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.4s; perspective: 1000px; }
        
        .phone-body {
            width: 130px; height: 240px; background: #0a0a0a; margin: 0 auto;
            border-radius: 12px; border: 2px solid #1f3a47; position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,1), 0 5px 15px rgba(0,0,0,0.8);
            filter: grayscale(1) brightness(0.4); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Ruggedized Corners */
        .phone-body::before, .phone-body::after {
            content: ""; position: absolute; width: 20px; height: 5px; background: #1f3a47; transition: 0.5s;
        }
        .phone-body::before { top: -2px; left: 50%; transform: translateX(-50%); border-radius: 0 0 5px 5px; }
        .phone-body::after { bottom: -2px; left: 50%; transform: translateX(-50%); border-radius: 5px 5px 0 0; }

        .phone-wrapper.lights-on .phone-body {
            filter: grayscale(0) brightness(1.2); 
            border-color: var(--cia-cyan);
            box-shadow: inset 0 0 20px rgba(0, 229, 255, 0.2), 0 0 30px rgba(0, 229, 255, 0.4);
            transform: translateY(-5px);
        }
        .phone-wrapper.lights-on .phone-body::before, .phone-wrapper.lights-on .phone-body::after { background: var(--cia-cyan); box-shadow: 0 0 10px var(--cia-cyan); }

        .phone-screen {
            position: absolute; inset: 6px; background: #000; border-radius: 6px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid #111;
        }
        .phone-wrapper.lights-on .phone-screen { background: #f4f6f7; border: 1px solid var(--cia-cyan); }

        .typing-text {
            display: none; color: #000; font-size: 11px; font-weight: bold;
            width: 0; overflow: hidden; white-space: nowrap; border-right: 2px solid #000;
            font-family: var(--font-hud); letter-spacing: 1px;
        }
        .phone-wrapper.lights-on .typing-text { display: block; animation: typing 0.8s steps(15) 0.4s forwards; }
        @keyframes typing { from { width: 0 } to { width: 90% } }

        /* --- FOLDERS (CLASSIFIED MANILA THEME) --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .folder-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 15px; }
        
        .folder-main { 
            width: 65px; height: 45px; background: #c5b69c; /* Manila Folder Color */
            border-radius: 0 4px 4px 4px; z-index: 2; 
            clip-path: polygon(0 0, 35% 0, 45% 15%, 100% 15%, 100% 100%, 0 100%);
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.5);
            border-left: 2px solid rgba(255,255,255,0.2);
        }
        .paper-sheet { 
            position: absolute; top: 8px; width: 55px; height: 40px; background: #f9f9f9; 
            border: 1px solid #ccc; z-index: 1; transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
        .folder-box:hover .paper-sheet { transform: translateY(-12px) rotate(3deg); }
        .file-label { font-family: var(--font-hud); font-size: 11px; color: var(--cia-cyan); text-align: center; margin-top: 10px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 5px rgba(0,229,255,0.5); }

        .folder-box.has-expenses .folder-main::after {
            content: "CIA"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%) rotate(-15deg);
            font-family: var(--font-noir); font-size: 12px; font-weight: bold; color: rgba(139, 0, 0, 0.8);
            border: 2px solid rgba(139, 0, 0, 0.8); padding: 1px 4px; border-radius: 2px; opacity: 0.8;
        }

        /* --- OVERLAYS & CLASSIFIED DOSSIER --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        
        .book { width: 95%; max-width: 420px; height: 82vh; perspective: 2500px; position: relative; z-index: 100; }
        .page { 
            width: 100%; height: 100%; position: absolute; transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1); 
            transform-origin: left; backface-visibility: hidden; 
            background-color: var(--paper); 
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png'); /* Subtle paper texture */
            color: #1a1a1a; padding: 40px 30px; 
            font-family: var(--font-noir); 
            box-shadow: inset 0 0 60px rgba(139, 69, 19, 0.1), 15px 15px 40px rgba(0,0,0,0.7);
            border: 1px solid #bba37b; overflow: hidden; display: flex; flex-direction: column;
            border-radius: 2px 5px 5px 2px;
        }
        /* Top Secret Watermark */
        .page::after {
            content: "TOP SECRET"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-35deg);
            font-size: 4rem; color: rgba(139, 0, 0, 0.05); border: 5px solid rgba(139, 0, 0, 0.05); padding: 15px; pointer-events: none; z-index: 0; font-weight: bold;
        }
        .page.flipped { transform: rotateY(-180deg); }
        .page-front { z-index: 10; }
        .page-back { transform: rotateY(180deg); z-index: 5; }

        /* --- BUTTONS & LABELS --- */
        .close-btn {
            position: absolute; top: 15px; right: 15px; background: #8b0000; color: white; border: 2px solid #5a0000;
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer; z-index: 9999; font-weight: bold; font-family: var(--font-hud);
            display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .close-btn:active { transform: scale(0.9); }

        .swipe-hint {
            margin-top: auto; padding-top: 15px; text-align: center; font-size: 12px; font-weight: bold; color: #8b0000; 
            border-top: 1px dashed #8b0000; cursor: pointer; z-index: 5; transition: 0.3s;
        }
        .swipe-hint:hover { background: rgba(139,0,0,0.05); }

        .audit-list { flex-grow: 1; overflow-y: auto; padding-right: 8px; z-index: 2; position: relative; }
        .audit-list::-webkit-scrollbar { width: 5px; }
        .audit-list::-webkit-scrollbar-thumb { background: rgba(139,0,0,0.3); border-radius: 10px; }

        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.3) !important; padding: 12px 0 !important; font-size: 13px; align-items: center; }
        .audit-separator { border-top: 3px double #8b0000 !important; margin: 25px 0 15px 0 !important; text-align: center; font-size: 11px !important; color: #8b0000; letter-spacing: 3px; font-weight: bold; }
        
        .dossier-paper {
            width: 90%; max-width: 380px; background-color: var(--paper); background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: #1a1a1a; padding: 35px 25px;
            font-family: var(--font-noir); position: relative; border: 1px solid #bba37b;
            box-shadow: 0 0 50px rgba(0,0,0,0.9); border-radius: 3px;
            transform: rotate(-1deg); /* Slight tilt for realism */
        }

        .secure-marker { background: #000; color: #000; padding: 2px 8px; border-radius: 2px; cursor: help; transition: 0.3s; user-select: all; display: inline-block; }
        .secure-marker:hover, .secure-marker:active { background: transparent; color: #000; font-weight: bold; }

        .btn-terminate {
            background: rgba(139,0,0,0.05); border: 2px solid #8b0000; color: #8b0000; padding: 10px 20px;
            font-family: var(--font-noir); font-weight: bold; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; transform: rotate(-2deg); margin-top: 20px; font-size: 12px; box-shadow: 2px 2px 0px rgba(139,0,0,0.2);
        }
        .btn-terminate:hover { background: #8b0000; color: #e8e2d2; box-shadow: none; transform: rotate(0deg); }
        .btn-terminate:active { transform: scale(0.95); }

        .status-label { font-size: 10px; color: var(--cia-cyan); margin-top: 12px; transition: all 0.3s ease; font-family: var(--font-hud); letter-spacing: 1px; text-shadow: 0 0 5px var(--cia-cyan); }
        @keyframes uplink-blink { 0%, 100% { opacity: 1; color: var(--cia-cyan); text-shadow: 0 0 8px var(--cia-cyan); } 50% { opacity: 0.4; text-shadow: none; } }
        .uplink-sync { animation: uplink-blink 0.5s infinite; font-weight: bold; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px dotted rgba(0,0,0,0.4); padding-bottom: 4px; font-size: 13px; }
        .summary-row b { color: #8b0000; }
        .grand-total-box { margin-top: auto; border-top: 4px double #000; padding-top: 15px; background: rgba(139, 0, 0, 0.03); padding: 10px; text-align: right; }

        /* General Buttons Upgrades */
        #btnBack { font-family: var(--font-hud); letter-spacing: 2px; font-weight: bold; text-shadow: 0 0 5px var(--cia-cyan); box-shadow: inset 0 0 10px rgba(0,229,255,0.1); transition: 0.3s; }
        #btnBack:hover { background: rgba(0,229,255,0.1) !important; }
        
        #memoirsBtnContainer button { font-family: var(--font-hud); letter-spacing: 2px; font-size: 14px; text-shadow: 0 0 5px var(--cia-red); transition: 0.3s; box-shadow: inset 0 0 10px rgba(255,0,0,0.1); }
        #memoirsBtnContainer button:hover { background: rgba(255,0,0,0.1) !important; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px;">AUTHENTICATING...</h2>
        <p style="font-size: 10px; opacity: 0.7; letter-spacing: 1px; margin-top: 4px;">MEMOIRS_PROTOCOL_ACTIVE // CLR_LEVEL_4</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:12px; width:100%; margin-top:25px; cursor:pointer;">[ EXIT_DEVICE_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 40px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:15px 25px; cursor:pointer; font-weight:bold; width: 100%;">[ VIEW_MASTER_MEMOIRS ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <button class="close-btn" onclick="closeNoir()" style="top: -15px; right: -15px;">X</button>
        <h3 style="text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px; letter-spacing: 2px; font-weight: bold;">vAGENT_DOSSIER</h3>
        <p style="font-size: 12px; margin-bottom: 6px;"><b>MO#:</b> <span id="n-order">---</span></p>
        <p style="font-size: 12px; margin-bottom: 6px;"><b>vAgent#:</b> <span id="n-vagent" style="background:rgba(0,0,0,0.08); padding: 2px 6px; border: 1px solid rgba(0,0,0,0.2);">---</span></p>
        <div id="n-content" style="margin-top: 15px; border-top: 2px dashed #000; padding-top: 15px;"></div>
        <div style="text-align: right; margin-top: 20px; border-top: 3px double #000; padding-top: 10px;">
            <p style="font-size: 10px; opacity: 0.8; margin-bottom: 2px;">TOTAL_FUNDS_ALLOCATED:</p>
            <p style="font-weight: bold; font-size: 22px; letter-spacing: -0.5px;"><span id="n-total">₱ 0.00</span></p>
        </div>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="book" id="dossierBook">
        <div id="p1" class="page page-front">
            <button class="close-btn" onclick="closeMemoirs()">X</button>
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 15px; letter-spacing: 2px;">AUDIT_REPORT</h3>
            <p style="font-size: 11px; margin-bottom: 15px; font-weight: bold; opacity: 0.8;">TARGET_NODE: <span id="target-name" style="color: #8b0000;">---</span></p>
            
            <div id="active-list" class="audit-list" style="height: 60%; overflow-y: auto;"></div>
            
            <div class="grand-total-box">
                <p style="font-size: 10px; font-weight: bold; color: #8b0000; margin-bottom: 3px;">TOTAL_EXPENDITURE:</p>
                <h1 style="font-size: 28px; color: #000; letter-spacing: -1px;">₱ <span id="total-val">0.00</span></h1>
            </div>

            <div id="flipNextBtn" class="swipe-hint" onclick="flipPage(true)" style="display:none;">[ VIEW_SUMMARY_DATA ] >></div>
        </div>

        <div id="p2" class="page page-back">
            <button class="close-btn" onclick="closeMemoirs()">X</button>
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 25px; letter-spacing: 2px;">SUMMARY_CONTINUATION</h3>
            
            <div id="weapon-system-breakdown" class="audit-list"></div>
            
            <div class="grand-total-box">
                <p style="font-size: 10px; font-weight: bold; color: #8b0000; margin-bottom: 3px;">GRAND_TOTAL_EXPENSES:</p>
                <h1 style="font-size: 28px; color: #000; letter-spacing: -1px;">₱ <span id="total-val-p2">0.00</span></h1>
            </div>
            <div class="swipe-hint" onclick="flipPage(false)" style="text-align: left;"><< RETURN_TO_LOGS</div>
        </div>
    </div>
</div>

<script type="module">
    /* -------------------------------------------------------------
       DO NOT TOUCH - EXACT COPY OF YOUR EXISTING LOGIC
       WALANG BINAGO SA KAHIT ANONG JAVASCRIPT O FIREBASE LOGIC MO
       ------------------------------------------------------------- */
    import { db, DEVICE_REGISTRY, INTEL_TERMS } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN_AGENT";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {};
    let allMissions = [];

    // Global Functions
    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';
    window.closeMemoirs = () => document.getElementById('memoirsOverlay').style.display = 'none';

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        allMissions = [];
        deviceData = {};

        snap.forEach(d => {
            const data = d.data();
            const docWithID = {...data, id: d.id};
            allMissions.push(docWithID);
            
            if (data.vAgentID) {
                const deviceName = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[deviceName]) deviceData[deviceName] = [];
                deviceData[deviceName].push(docWithID);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        const grid = document.getElementById('deviceSection');
        const keys = Object.keys(deviceData);
        if (keys.length === 0) {
            grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; opacity:0.5;">[ NO_ACTIVE_DATA ]</p>`;
            return;
        }
        grid.innerHTML = keys.map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body"><div class="phone-screen"><div class="typing-text">WELCOME<br>NODE_${name}</div></div></div>
                <div class="status-label">[ STANDBY_LINK ]</div>
            </div>
        `).join('');
    };

    window.activateDevice = (name, element) => {
        element.classList.add('lights-on'); 
        const statusLabel = element.querySelector('.status-label');
        statusLabel.innerHTML = "[ UPLINK_SYNC_DATA ]";
        statusLabel.classList.add('uplink-sync');

        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `
                <button onclick="openMemoirs('${name}')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:10px; width:100%; cursor:pointer;">[ VIEW_${name}_MEMOIRS ]</button>
            `;
            
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => {
                const hasHistory = v.expensesBreakdown && v.expensesBreakdown.length > 0;
                return `
                    <div class="folder-box ${hasHistory ? 'has-expenses' : ''}" onclick="openNoirModal('${v.id}')">
                        <div class="paper-sheet"></div>
                        <div class="folder-main"></div>
                        <div class="file-label">#${v.vAgentID}</div>
                    </div>
                `;
            }).join('') + `<div class="folder-box shadow-folder"><div class="folder-main" style="background:#333;"></div><div class="file-label" style="color:#555;">LOCKED</div></div>`;
        }, 1800);
    };

    window.openNoirModal = (docID) => {
        const data = allMissions.find(m => m.id === docID);
        if(!data) return;

        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-order').innerText = docID.substring(0,12).toUpperCase();
        document.getElementById('n-vagent').innerText = data.vAgentID || "N/A";

        let expHTML = "";
        if(data.expensesBreakdown && Array.isArray(data.expensesBreakdown)) {
            const sorted = data.expensesBreakdown.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            expHTML = sorted.map(e => {
                const d = e.timestamp ? new Date(e.timestamp) : new Date();
                const displayDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                const intelDesc = e.description || "FIELD_OPERATION";
                return `
                    <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:6px; border-bottom: 1px dotted rgba(0,0,0,0.3); padding-bottom: 2px;">
                        <span><span style="opacity:0.6;">${displayDate}</span> — ${intelDesc}</span>
                        <b>₱${(e.amount || 0).toLocaleString()}</b>
                    </div>`;
            }).join('');
        } else {
            expHTML = "<p style='font-size:10px; opacity:0.5; text-align:center;'>[ NO_OPERATIONAL_LOGS ]</p>";
        }

        document.getElementById('n-content').innerHTML = `
            <div style="font-size:11px; margin-bottom:12px;">
                <p><b>SecureLine:</b> <span class="secure-marker">${data.marker || 'SECRET_LINE'}</span></p>
            </div>
            <p style="font-size:10px; font-weight:bold; border-top:1px solid #000; padding-top:10px; margin-bottom:8px; letter-spacing:1.5px;">OPERATIONAL_LOGS:</p>
            <div style="max-height:160px; overflow-y:auto; margin-bottom:15px; padding-right:5px;">${expHTML}</div>
            <center><button class="btn-terminate" onclick="alert('Auth Required')">TERMINATE_AGENT</button></center>
        `;
        document.getElementById('n-total').innerText = `₱ ${(data.totalExpenses || 0).toLocaleString()}`;
    };

    window.flipPage = (forward) => {
        const p1 = document.getElementById('p1');
        const p2 = document.getElementById('p2');
        if (forward) {
            p1.classList.add('flipped');
            p2.style.display = 'flex';
        } else {
            p1.classList.remove('flipped');
            setTimeout(() => { p2.style.display = 'none'; }, 600);
        }
    };

    window.openMemoirs = (mode) => {
    const overlay = document.getElementById('memoirsOverlay');
    overlay.style.display = 'flex';
    flipPage(false);

    // 1. FILTERING
    let filtered = (mode === 'ALL') 
        ? allMissions 
        : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);

    const valid = filtered.filter(m => (m.totalExpenses || 0) > 0);

    // 2. CATEGORIZATION & SORTING
    const withV = valid.filter(m => m.vAgentID && m.vAgentID !== "");
    const withoutV = valid.filter(m => !m.vAgentID);

    // vAgents: Newest Timestamp First
    withV.sort((a, b) => {
        const timeA = a.timestamp ? new Date(a.timestamp).getTime() : 0;
        const timeB = b.timestamp ? new Date(b.timestamp).getTime() : 0;
        return timeB - timeA;
    });

    // Unassigned: Highest Amount First
    withoutV.sort((a, b) => (b.totalExpenses || 0) - (a.totalExpenses || 0));

    const masterList = [...withV.map(m => ({...m, isV: true})), ...withoutV.map(m => ({...m, isV: false}))];

    let p1HTML = "";
    let p2HTML = "";
    let overallTotal = 0; 

    // 3. RENDER LOOP
    masterList.forEach((m, index) => {
        overallTotal += (m.totalExpenses || 0); // KINUKUHA ANG TOTAL DITO

        const missionRef = m.id.substring(0, 10).toUpperCase();
        const agentName = m.agent || "UNKNOWN_OPERATIVE";

        let rowContent = "";
        
        // Separation Label
        const isFirstUnassigned = !m.isV && (index === 0 || masterList[index-1].isV);
        if (isFirstUnassigned) {
            rowContent += `<div class="audit-separator" style="margin: 15px 0 10px 0; border-top: 1px solid #000; font-size: 9px; text-align: center; font-weight: bold;">--- UNASSIGNED_RECORDS ---</div>`;
        }

        rowContent += `
            <div class="expense-row" style="padding: 10px 0; border-bottom: 1px dashed rgba(0,0,0,0.2);">
                <div style="flex-grow: 1;">
                    <div style="font-size: 11px; font-weight: bold; color: #000;">
                        ${m.isV ? `vAgent#: <span style="color:#8b0000;">${m.vAgentID}</span>` : `AGENT: ${agentName}`}
                    </div>
                    ${m.isV ? `<div style="font-size: 9px; opacity: 0.7;">OPERATOR: ${agentName}</div>` : ''}
                    <div style="font-size: 8px; color: #000; font-weight: bold; margin-top: 2px;">
                        MO#: ${missionRef}
                    </div>
                </div>
                <div style="text-align: right;">
                    <b style="font-size: 14px; color: #000;">₱${(m.totalExpenses || 0).toLocaleString()}</b>
                </div>
            </div>`;

        // PAGHATI NG PAGES
        if (mode !== 'ALL') {
            p1HTML += rowContent;
        } else {
            if (index < 10) p1HTML += rowContent;
            else p2HTML += rowContent;
        }
    });

    // 4. DISPLAY MAPPING
    document.getElementById('active-list').innerHTML = p1HTML || "<center style='opacity:0.5; padding-top:20px;'>NO_RECORDS</center>";
    document.getElementById('target-name').innerText = mode;
    
    // IPAPAKITA ANG TOTAL SA PAGE 1
    const totalDisplayP1 = document.getElementById('total-val');
    if (totalDisplayP1) {
        totalDisplayP1.innerText = overallTotal.toLocaleString();
    }

    // HANDLING PAGE 2
    const p2Area = document.getElementById('weapon-system-breakdown');
    if (mode === 'ALL') {
        p2Area.innerHTML = p2HTML || `<center style="margin-top:50px; font-size:10px; opacity:0.5;">[ NO_OVERFLOW_DATA ]</center>`;
        document.getElementById('flipNextBtn').style.display = 'block';
    } else {
        document.getElementById('flipNextBtn').style.display = 'none';
    }

    // IPAPAKITA ANG TOTAL SA PAGE 2 (GRAND TOTAL)
    const totalDisplayP2 = document.getElementById('total-val-p2');
    if (totalDisplayP2) {
        totalDisplayP2.innerText = overallTotal.toLocaleString();
    }
};
</script>
</body>
</html>
