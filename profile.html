<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; position: relative; z-index: 1; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.4s; z-index: 5; }
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            filter: grayscale(1) brightness(0.3); transition: all 0.5s ease;
        }
        .phone-wrapper.lights-on .phone-body { filter: grayscale(0) brightness(1); border-color: var(--cia-cyan); box-shadow: 0 0 40px rgba(0, 243, 255, 0.6); }
        .phone-screen { position: absolute; inset: 5px; background: #000; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .phone-wrapper.lights-on .phone-screen { background: #ffffff; }

        .typing-text { display: none; color: #000; font-size: 11px; font-weight: bold; width: 0; overflow: hidden; white-space: nowrap; border-right: 2px solid #000; }
        .phone-wrapper.lights-on .typing-text { display: block; animation: typing 0.8s steps(15) 0.4s forwards; }
        @keyframes typing { from { width: 0 } to { width: 90% } }

        /* --- FOLDERS (CLICKABLE FIX) --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; position: relative; z-index: 10; }
        .folder-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 15px; z-index: 20; }
        .folder-main { width: 50px; height: 35px; background: var(--cia-cyan); border-radius: 0 4px 4px 4px; z-index: 2; clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%); pointer-events: none; }
        .paper-sheet { position: absolute; top: 8px; width: 38px; height: 32px; background: #fff; border: 1px solid #ccc; z-index: 1; transition: 0.3s; pointer-events: none; }
        .folder-box:hover .paper-sheet { transform: translateY(-10px); }
        .file-label { font-size: 8.5px; color: #fff; text-align: center; margin-top: 8px; font-weight: bold; letter-spacing: 1px; pointer-events: none; }

        .folder-box.has-expenses .folder-main::after {
            content: "CIA"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            font-family: var(--font-noir); font-size: 10px; font-weight: bold; color: rgba(0, 0, 0, 0.7);
            border: 1.5px solid rgba(0, 0, 0, 0.7); padding: 1px 3px; border-radius: 2px;
        }

        /* --- OVERLAYS --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        
        /* --- DOSSIER POPUP DESIGN --- */
        .dossier-paper { 
            width: 90%; max-width: 360px; max-height: 85vh; background: #e8e2d2; color: #1a1a1a; padding: 35px 25px; 
            font-family: var(--font-noir); border: 1px solid #c5b8a0; position: relative; display: flex; flex-direction: column;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.8);
        }
        .dossier-paper::before { content: "TOP SECRET"; position: absolute; top: 10px; left: 20px; font-size: 10px; color: #8b0000; border: 1px solid #8b0000; padding: 2px 5px; font-weight: bold; }

        /* --- BOOK SYSTEM --- */
        .book { width: 95%; max-width: 400px; height: 82vh; perspective: 2000px; position: relative; }
        .page { 
            width: 100%; height: 100%; position: absolute; transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1); 
            transform-origin: left; backface-visibility: hidden; background: #e8e2d2; color: #1a1a1a; padding: 40px 25px; 
            font-family: var(--font-noir); box-shadow: inset 0 0 30px rgba(0,0,0,0.1), 10px 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #c5b8a0; display: flex; flex-direction: column;
        }
        .page-front { z-index: 10; }
        .page-back { z-index: 5; transform: rotateY(0deg); display: none; }
        .page.flipped { transform: rotateY(-180deg); }

        .audit-list { flex-grow: 1; overflow-y: auto; padding-right: 5px; margin-top: 10px; border-top: 2px solid #000; }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.3); padding: 8px 0; font-size: 11px; align-items: center; }
        
        .close-btn {
            position: absolute; top: 10px; right: 15px; background: #8b0000; color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 9999; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
        }
        .swipe-hint { margin-top: auto; padding-top: 15px; font-size: 11px; font-weight: bold; color: #8b0000; border-top: 1px dashed #8b0000; cursor: pointer; }
        .total-stamp { text-align: right; padding: 10px; background: rgba(0,0,0,0.05); border: 2px solid #1a1a1a; transform: rotate(-2deg); margin-top: 10px; }

        .status-label { font-size: 9px; color: var(--cia-cyan); margin-top: 10px; }
        @keyframes uplink-blink { 0%, 100% { opacity: 1; color: var(--cia-cyan); } 50% { opacity: 0.3; } }
        .uplink-sync { animation: uplink-blink 0.4s infinite; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px;">AUTHENTICATING...</h2>
        <p style="font-size: 9px; opacity: 0.5;">MEMOIRS_PROTOCOL_ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:12px; width:100%; margin-top:20px; cursor:pointer; font-family: var(--font-digital);">[ EXIT_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 40px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 25px; cursor:pointer; font-weight:bold; font-family: var(--font-digital);">[ VIEW_MASTER_MEMOIRS ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <button class="close-btn" onclick="closeNoir()">X</button>
        <h2 style="text-align: center; text-transform: uppercase;">Field Dossier</h2>
        <p style="font-size: 10px; text-align: center; opacity: 0.7;">ASSET_EXPENDITURE_REPORT</p>
        
        <div style="margin-top: 15px;">
            <p style="font-size: 11px;"><b>ASSET_ID:</b> <span id="n-vagent" style="background:#000; color:#fff; padding:0 5px;">---</span></p>
        </div>

        <div id="n-content" class="audit-list"></div>

        <div class="total-stamp">
            <p style="font-size: 9px; font-weight: bold; margin: 0;">CERTIFIED_TOTAL:</p>
            <span id="n-total" style="font-size: 22px; font-weight: 900;">₱ 0.00</span>
        </div>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="book">
        <button class="close-btn" onclick="closeMemoirs()">X</button>
        
        <div id="p1" class="page page-front">
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 10px;">AUDIT_MEMOIRS</h3>
            <p style="font-size: 9px; opacity: 0.6;">MODE: <span id="target-name">---</span></p>
            <div id="active-list" class="audit-list"></div>
            
            <div id="p1-total-box" style="display:none; border-top: 2px solid #000; padding-top: 5px;">
                <p style="font-size: 10px; font-weight: bold;">TOTAL EXPENDITURE:</p>
                <h2 id="total-val-p1">₱ 0.00</h2>
            </div>
            
            <div class="swipe-hint" id="flipNextBtn" onclick="flipPage(true)" style="text-align: right; display:none;">[ NEXT_PAGE ] >></div>
        </div>

        <div id="p2" class="page page-back">
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 10px;">OVERFLOW_AUDIT</h3>
            <div id="overflow-list" class="audit-list"></div>
            
            <div style="margin-top: auto; border-top: 3px double #000; padding-top: 15px;">
                <p style="font-size: 12px; font-weight: bold;">GRAND TOTAL:</p>
                <h1 style="font-size: 30px;">₱ <span id="total-val-p2">0.00</span></h1>
            </div>
            
            <div class="swipe-hint" onclick="flipPage(false)" style="text-align: left;"><< [ PREVIOUS_PAGE ]</div>
        </div>
    </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {}, allMissions = [];

    window.closeMemoirs = () => { document.getElementById('memoirsOverlay').style.display = 'none'; };
    window.closeNoir = () => { document.getElementById('noirOverlay').style.display = 'none'; };

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        allMissions = []; deviceData = {};
        snap.forEach(d => {
            const data = {...d.data(), id: d.id};
            allMissions.push(data);
            if (data.vAgentID) {
                const dev = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[dev]) deviceData[dev] = [];
                deviceData[dev].push(data);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        document.getElementById('deviceSection').innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body"><div class="phone-screen"><div class="typing-text">WELCOME<br>NODE_${name}</div></div></div>
                <div class="status-label">[ STANDBY_LINK ]</div>
            </div>`).join('');
    };

    window.activateDevice = (name, el) => {
        el.classList.add('lights-on'); 
        el.querySelector('.status-label').classList.add('uplink-sync');
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `<button onclick="openMemoirs('${name}')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:10px; width:100%; font-family: var(--font-digital);">[ VIEW_${name}_MEMOIRS ]</button>`;
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => `
                <div class="folder-box ${v.expensesBreakdown?.length > 0 ? 'has-expenses' : ''}" onclick="openNoirModal('${v.id}')">
                    <div class="paper-sheet"></div><div class="folder-main"></div><div class="file-label">#${v.vAgentID}</div>
                </div>`).join('');
        }, 1500);
    };

    window.openNoirModal = (docID) => {
        const data = allMissions.find(m => m.id === docID);
        if(!data) return;

        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-order').innerText = docID.substring(0,12).toUpperCase();
        document.getElementById('n-vagent').innerText = data.vAgentID;

        let expHTML = "";
        if(data.expensesBreakdown && Array.isArray(data.expensesBreakdown)) {
            const sorted = data.expensesBreakdown.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
            expHTML = sorted.map(e => {
                const d = e.timestamp ? new Date(e.timestamp) : new Date();
                const displayDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }).replace(',', ' /');
                const randomIndex = Math.floor(Math.random() * INTEL_TERMS.length);
                const intelDesc = e.description || INTEL_TERMS[randomIndex];
                return `
                    <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:6px; border-bottom: 1px dotted rgba(0,0,0,0.3); padding-bottom: 2px;">
                        <span><span style="opacity:0.6;">${displayDate}</span> — ${intelDesc}</span>
                        <b>₱${(e.amount || 0).toLocaleString()}</b>
                    </div>`;
            }).join('');
        } else {
            expHTML = "<p style='font-size:10px; opacity:0.5; text-align:center;'>[ NO_OPERATIONAL_LOGS ]</p>";
        }

        document.getElementById('n-content').innerHTML = `
            <div style="font-size:11px; margin-bottom:12px;">
                <p><b>SecureLine:</b> <span class="secure-marker">${data.marker || 'SECRET_LINE'}</span></p>
                <p><b>Deployment:</b> ${data.deploymentDate || 'TBD'}</p>
            </div>
            <p style="font-size:10px; font-weight:bold; border-top:1px solid #000; padding-top:10px; margin-bottom:8px; letter-spacing:1.5px;">OPERATIONAL_LOGS:</p>
            <div style="max-height:160px; overflow-y:auto; margin-bottom:15px; padding-right:5px;">
                ${expHTML}
            </div>
            <center>
                <button onclick="alert('System Locked: Auth Required')" class="btn-terminate">TERMINATE_AGENT</button>
            </center>
        `;
        document.getElementById('n-total').innerText = `₱ ${(data.totalExpenses || 0).toLocaleString()}`;
    };

    window.openMemoirs = (mode) => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        let total = 0;
        let filtered = (mode === 'ALL') ? allMissions : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);
        document.getElementById('active-list').innerHTML = filtered.map(m => {
            total += (m.totalExpenses || 0);
            return `<div class="expense-row"><span>vAgent #${m.vAgentID}</span><b>₱${(m.totalExpenses || 0).toLocaleString()}</b></div>`;
        }).join('') || "NO_DATA";
        document.getElementById('target-name').innerText = mode;
        document.getElementById('total-val').innerText = `₱ ${total.toLocaleString()}`;
    };

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';
    window.closeMemoirs = () => document.getElementById('memoirsOverlay').style.display = 'none';
    window.flip = (n) => document.getElementById('p1').classList.toggle('flipped', n);

    window.flipPage = (f) => {
        const p1 = document.getElementById('p1'), p2 = document.getElementById('p2');
        if(f) { p1.classList.add('flipped'); p2.style.display = 'flex'; }
        else { p1.classList.remove('flipped'); setTimeout(() => { p2.style.display = 'none'; }, 600); }
    };

    window.openMemoirs = (mode) => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        flipPage(false);
        const filtered = (mode === 'ALL') ? allMissions : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);
        const valid = filtered.filter(m => (m.totalExpenses || 0) > 0);

        const withV = valid.filter(m => m.vAgentID).sort((a,b) => b.id.localeCompare(a.id));
        const withoutV = valid.filter(m => !m.vAgentID).sort((a,b) => b.totalExpenses - a.totalExpenses);

        let p1H = "", p2H = "", grand = 0;
        const getRow = (m, isV) => `
            <div class="expense-row">
                <span><b>${isV ? '#vAgent '+m.vAgentID : 'AGENT: '+m.agent}</b><br><i style="font-size:8px;">REF: ${m.id.substring(0,8)}</i></span>
                <b>₱${m.totalExpenses.toLocaleString()}</b>
            </div>`;

        withV.forEach((m, i) => {
            grand += m.totalExpenses;
            if(i < 10) p1H += getRow(m, true); else p2H += getRow(m, true);
        });

        withoutV.forEach((m, i) => {
            grand += m.totalExpenses;
            if((withV.length + i) < 10) p1H += getRow(m, false); else p2H += getRow(m, false);
        });

        document.getElementById('active-list').innerHTML = p1H || "NO_RECORDS";
        document.getElementById('overflow-list').innerHTML = p2H;
        document.getElementById('total-val-p1').innerText = `₱ ${grand.toLocaleString()}`;
        document.getElementById('total-val-p2').innerText = grand.toLocaleString();
        document.getElementById('target-name').innerText = mode;
        document.getElementById('flipNextBtn').style.display = p2H ? "block" : "none";
        document.getElementById('p1-total-box').style.display = p2H ? "none" : "block";
    };
</script>
</body>
</html>
