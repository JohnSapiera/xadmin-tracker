<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CORE_DASH_v26.3_STABLE</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #02080a; --panel: rgba(5, 15, 20, 0.85); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
      --green: #05ffa1; --yellow: #ffea00; --border: rgba(0, 243, 255, 0.2);
      --font-main: 'Rajdhani', sans-serif; --font-mono: 'Share Tech Mono', monospace; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #e1f5f9; font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 50%, #0a252e 0%, #02080a 100%); }
    header { padding: 18px 20px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .status-bar { font-size: 11px; padding: 10px 20px; background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }
    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; display: flex; flex-direction: column; gap: 20px; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 25px; clip-path: polygon(0 0, 100% 0, 100% 90%, 92% 100%, 0 100%); }
    #mission-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--cyan); color: #fff; font-family: var(--font-mono); font-size: 55px; font-weight: 700; padding: 15px 0; text-align: center; letter-spacing: 12px; outline: none; margin-bottom: 20px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { height: 55px; font-family: var(--font-main); font-size: 18px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .btn-save { background: var(--green); color: #01080a; }
    .btn-retrieve { background: var(--blue); color: #fff; }
    .btn-reserve { background: transparent; color: #fff; border: 1px solid #fff; }
    .btn:disabled { opacity: 0.1; cursor: not-allowed; filter: grayscale(1); }
    #terminal { background: rgba(0,0,0,0.7); border-left: 3px solid var(--cyan); padding: 15px; font-family: var(--font-mono); font-size: 11px; height: 180px; overflow-y: auto; color: #9ab4bc; border-radius: 0 5px 5px 0; }
    .term-line { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.02); }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(1, 4, 5, 0.98); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .popup { width: 100%; max-width: 380px; background: #051014; border: 1px solid var(--cyan); padding: 25px; }
    .pop-title { font-size: 48px; color: var(--cyan); text-align: center; font-family: var(--font-main); font-weight: 700; }
    .data-card { background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
    .pop-input { background: #000; border: 1px solid var(--cyan); color: var(--green); font-family: var(--font-mono); font-size: 16px; padding: 8px; width: 150px; text-align: right; outline: none; }
    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
    .dev-btn { background: #08161b; border: 1px solid #1a2f37; color: #5c7882; padding: 10px; font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; cursor: pointer; }
    .dev-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .pop-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tactical-btn { height: 50px; font-family: var(--font-main); font-size: 18px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; }
    .btn-confirm-save { background: var(--green); color: #000; }
    .btn-confirm-deploy { background: var(--blue); color: #fff; }
    .btn-abort { background: transparent; color: var(--red); border: 1px solid var(--red); }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="width:4px; height:20px; background:var(--cyan);"></div>
    <span style="font-size: 24px; font-weight: 700; color: #fff;">CORE_DASH</span>
  </div>
</header>

<div class="status-bar">
    <div style="display:flex; gap:12px">
        <span id="clock">00:00:00</span>
        <span style="color:var(--border)">|</span>
        <span style="color:var(--cyan)">AGENT: <span id="agent-display" style="color:#fff">---</span></span>
        <span style="color:var(--border)">|</span>
        <span style="color:var(--cyan)">DEV: <span id="device-display" style="color:#fff">---</span></span>
    </div>
</div>

<main>
  <div class="command-module">
    <input type="tel" id="mission-input" placeholder="----" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
    </div>
  </div>
  <div id="terminal"></div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div class="pop-title" id="pop-m-id">#0000</div>
        <div class="data-card">
            <div class="data-row" style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:11px; color:#5c7882; font-family:var(--font-mono);">V_AGENT_NO:</span> 
                <input type="text" id="v-agent-input" class="pop-input" placeholder="0000">
            </div>
        </div>
        <div style="font-size:11px; color:var(--cyan); margin-bottom:5px; font-family:var(--font-mono)">UPLINK_TARGET_SYSTEM:</div>
        <div class="device-grid" id="pop-device-list"></div>
        <div class="pop-btn-row">
            <button id="modal-action-btn" onclick="submitMission()" class="tactical-btn">ACTION</button>
            <button onclick="closePopup()" class="tactical-btn btn-abort">CANCEL</button>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const fullWeaponMap = {
    "SIG-3A14D65A": "REDMI NOTE 14 PRO 5G", "SIG-5B0D3A5C": "REALME 8 PRO",
    "SIG-82A9E4B": "SAMSUNG S23 ULTRA", "SIG-X921FFA": "IPHONE 15 PRO",
    "SIG-K882190": "POCO X6 PRO", "SIG-V001122": "VIVO V30"
  };

  const currentAgent = localStorage.getItem("cia_agent") || "AUTHORIZED_AGENT";
  const currentDeviceSig = localStorage.getItem("device_signature") || "SIG-3A14D65A";
  
  document.getElementById('agent-display').innerText = currentAgent;
  document.getElementById('device-display').innerText = fullWeaponMap[currentDeviceSig] || "N/A";

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const reserveBtn = document.getElementById('reserve-btn');
  const terminal = document.getElementById('terminal');

  let isRetrieveMode = false;
  let activeRecord = null;
  let selectedDeviceSig = "";

  // --- LIVE TERMINAL ---
  onSnapshot(query(collection(db, "terminal_logs"), orderBy("timestamp", "desc"), limit(12)), (snap) => {
    terminal.innerHTML = "";
    snap.forEach(d => {
      const data = d.data();
      const div = document.createElement('div');
      div.className = "term-line";
      div.innerHTML = `> <span style="color:${data.color}">${data.message}</span>`;
      terminal.appendChild(div);
    });
  });

  const sendLog = async (msg, color = "#5c7882") => {
    await addDoc(collection(db, "terminal_logs"), { message: msg, color: color, timestamp: serverTimestamp(), agent: currentAgent });
  };

  // --- AUTO SCAN LOGIC ---
  input.addEventListener('input', async () => {
    const val = input.value.trim();
    if (val.length < 4) {
        actionBtn.className = "btn btn-save"; actionBtn.textContent = "SAVE";
        reserveBtn.disabled = false;
        return;
    }

    // Immediate terminal feedback
    const scanLine = document.createElement('div');
    scanLine.innerHTML = `> <span style="color:var(--yellow)">AUTOSCAN: SEARCHING ID [${val}]...</span>`;
    terminal.prepend(scanLine);

    const q = query(collection(db, "mission_orders"), where("missionID", "==", val));
    const snap = await getDocs(q);

    if (!snap.empty) {
      activeRecord = snap.docs[0].data();
      isRetrieveMode = true;
      actionBtn.className = "btn btn-retrieve";
      actionBtn.textContent = "RETRIEVE";
      reserveBtn.disabled = true;
      await sendLog(`SCAN_RESULT: ${val} IS REGISTERED TO [${activeRecord.agentName}]`, 'var(--blue)');
    } else {
      isRetrieveMode = false;
      actionBtn.className = "btn btn-save";
      actionBtn.textContent = "SAVE";
      reserveBtn.disabled = false;
      await sendLog(`SCAN_RESULT: ${val} IS AVAILABLE FOR UPLINK`, 'var(--green)');
    }
  });

  // --- POPUP HANDLER ---
  actionBtn.onclick = async () => {
    if (input.value.length < 4) return;
    document.getElementById('modal-overlay').style.display = 'flex';
    document.getElementById('pop-m-id').innerText = `#${input.value}`;
    
    const modalBtn = document.getElementById('modal-action-btn');
    if (isRetrieveMode) {
        modalBtn.innerText = "DEPLOY";
        modalBtn.className = "tactical-btn btn-confirm-deploy";
    } else {
        modalBtn.innerText = "SAVE";
        modalBtn.className = "tactical-btn btn-confirm-save";
    }

    // --- FETCH ALL DEVICES UNDER THIS AGENT ---
    const q = query(collection(db, "mission_orders"), where("agentName", "==", currentAgent));
    const snap = await getDocs(q);
    const myDevices = new Set();
    
    // Add current device signature
    myDevices.add(currentDeviceSig);
    // Add all signatures found in database for this agent
    snap.forEach(d => myDevices.add(d.data().weaponSystem));
