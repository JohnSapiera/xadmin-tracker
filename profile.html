<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-header: 'Rajdhani', sans-serif;
        }

        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden; margin: 0;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        /* --- PHYSICS & LIGHTS ON --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; perspective: 1000px; }
        .phone-wrapper { cursor: pointer; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            filter: grayscale(1) brightness(0.3); transition: all 0.6s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Move Logic: Left phone moves right, Right phone moves left */
        .phone-wrapper:nth-child(odd):hover { transform: translateX(15px) rotateY(-5deg); }
        .phone-wrapper:nth-child(even):hover { transform: translateX(-15px) rotateY(5deg); }

        .phone-wrapper.lights-on .phone-body { 
            filter: grayscale(0) brightness(1.2); 
            border-color: var(--cia-cyan); 
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.4);
            transform: scale(1.1) translateY(-10px) !important;
        }

        /* Typing Animation */
        .typing-welcome { 
            display: none; color: #fff; font-size: 11px; text-align: center; margin-top: 10px;
            white-space: nowrap; overflow: hidden; border-right: 2px solid var(--cia-cyan);
            width: 0; margin-left: auto; margin-right: auto;
        }
        .phone-wrapper.lights-on .typing-welcome {
            display: block;
            animation: typing 1s steps(20, end) forwards, blink-caret 0.75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--cia-cyan) } }

        /* --- ACTUAL FOLDER DESIGN --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        
        .folder-container {
            position: relative; width: 80px; height: 70px; cursor: pointer; transition: 0.3s;
            margin: 0 auto;
        }
        
        /* The Paper Inside */
        .paper-sheet-mini {
            position: absolute; bottom: 10px; left: 10%; width: 80%; height: 80%;
            background: #eee; border: 1px solid #ccc; transition: transform 0.3s;
            z-index: 1; transform: translateY(0);
        }

        /* Front Folder Cover */
        .folder-front {
            position: absolute; bottom: 0; width: 100%; height: 85%;
            background: var(--cia-cyan); border-radius: 0 4px 4px 4px;
            z-index: 2; clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%);
        }

        .folder-container:hover .paper-sheet-mini { transform: translateY(-15px); }
        .folder-label { font-size: 10px; color: #fff; text-align: center; margin-top: 5px; font-weight: bold; }

        /* Shadow Folder (Locked) */
        .ghost-file { opacity: 0.3; filter: grayscale(1) blur(0.5px); }
        .ghost-file .folder-front, .ghost-file .paper-sheet-mini { background: #333; border-color: #444; }

        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid rgba(0,243,255,0.1); }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #444; text-decoration: none; font-size: 11px; }
        .nav-link.active { color: var(--cia-cyan); border-top: 2px solid var(--cia-cyan); }
    </style>
</head>
<body>

<div class="container">
    <header style="border-left: 4px solid var(--cia-cyan); padding-left: 15px; margin-bottom: 30px;">
        <h2 id="display-agent" style="letter-spacing: 4px; color: var(--cia-cyan);">AGENT_LZ</h2>
        <p style="font-size: 9px; opacity: 0.5;">UPLINK STATUS: STABLE</p>
    </header>

    <div id="deviceSection" class="device-grid">
        </div>
    
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:12px; width:100%; margin-top:30px; font-family:var(--font-digital); cursor:pointer;">
        [ << SECURE_EXIT ]
    </button>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="intel.html" class="nav-link">INTEL</a>
    <a href="#" class="nav-link active">PROFILE</a>
</nav>

<script type="module">
    // --- FIREBASE LOGIC (Keep your existing config) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const fullWeaponMap = { "SIG-20452634": "REDMI NOTE 14 PRO", "SIG-5B0D3A5C": "REALME 8 PRO", "SIG-121B8F43": "Techno Camon 40 PRO 5G" };
    const currentAgent = localStorage.getItem("cia_agent") || "AGENT_LZ";

    let deviceData = {};

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        snap.forEach(d => {
            const data = d.data();
            if (data.vAgentID) {
                const name = fullWeaponMap[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[name]) deviceData[name] = [];
                deviceData[name].push({ ...data, id: d.id });
            }
        });
        renderDevices();
    };

    function renderDevices() {
        const grid = document.getElementById('deviceSection');
        grid.innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body">
                    <div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                        <div class="typing-welcome">WELCOME<br>~> ${name}</div>
                    </div>
                </div>
                <div style="font-size:9px; color:var(--cia-cyan); margin-top:10px;">[ STANDBY ]</div>
            </div>
        `).join('');
    }

    window.activateDevice = (name, element) => {
        element.classList.add('lights-on');
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            
            const vGrid = document.getElementById('vagentSection');
            vGrid.innerHTML = deviceData[name].map(v => `
                <div class="folder-group" onclick="console.log('${v.id}')">
                    <div class="folder-container">
                        <div class="paper-sheet-mini"></div>
                        <div class="folder-front"></div>
                    </div>
                    <div class="folder-label">#${v.vAgentID}</div>
                </div>
            `).join('') + `<div class="folder-group ghost-file"><div class="folder-container"><div class="paper-sheet-mini"></div><div class="folder-front"></div></div><div class="folder-label">LOCKED</div></div>`;
        }, 1800);
    };
</script>
</body>
</html>
