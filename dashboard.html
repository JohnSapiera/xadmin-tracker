<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL DASHBOARD V5</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a0e;
      --panel: rgba(5, 18, 24, 0.98);
      --cyan: #00f3ff;
      --red: #ff003c;
      --blue: #007bff;
      --green: #00ff66;
      --border: rgba(0, 243, 255, 0.2);
      --font-mono: 'Share Tech Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Compact Header */
    header { padding: 8px 12px; border-bottom: 1px solid var(--border); background: #000; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    #clock { color: var(--cyan); font-family: var(--font-mono); }

    .ticker-wrap { background: rgba(0, 243, 255, 0.03); border-bottom: 1px solid var(--border); padding: 4px 12px; font-family: var(--font-mono); font-size: 10px; color: var(--cyan); white-space: nowrap; overflow: hidden; }

    main { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 80px; }
    .portal-section { display: none; }
    .portal-section.active { display: block; }

    /* Compact Search Box */
    .search-box { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 2px; }
    .label-mini { font-family: var(--font-mono); font-size: 10px; color: var(--cyan); margin-bottom: 5px; display: block; opacity: 0.8; }
    
    #mission-input { 
      width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--cyan); 
      font-family: var(--font-mono); font-size: 28px; padding: 8px; text-align: center; 
      letter-spacing: 5px; outline: none; margin-bottom: 15px; 
    }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { padding: 12px; font-family: var(--font-mono); font-size: 13px; font-weight: bold; border: 1px solid; background: transparent; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
    
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; box-shadow: 0 0 10px rgba(0,123,255,0.5); }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    /* Compact Terminal */
    #terminal { background: #000; border: 1px solid #111; padding: 10px; font-family: var(--font-mono); font-size: 10px; min-height: 120px; color: #666; margin-top: 15px; overflow-y: auto; line-height: 1.4; }
    .log-entry { border-bottom: 1px solid #080808; padding: 2px 0; }

    /* Modal Mobile Fix */
    #weapon-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--panel); border: 1px solid var(--red); width: 100%; max-width: 320px; position: relative; padding: 35px 15px 20px; }
    .modal-close { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; border: none; padding: 6px 12px; font-family: var(--font-mono); font-size: 14px; }
    .modal-tag { position: absolute; top: -10px; left: 15px; background: var(--bg); padding: 0 10px; border: 1px solid var(--red); color: var(--red); font-family: var(--font-mono); font-size: 11px; }
    .weapon-info { font-family: var(--font-mono); font-size: 13px; background: rgba(0,0,0,0.4); padding: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .weapon-info span { color: var(--cyan); display: block; font-size: 16px; margin-bottom: 8px; }

    /* Navigation */
    nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
    .nav-item { display: flex; align-items: center; justify-content: center; color: #444; font-family: var(--font-mono); font-size: 12px; letter-spacing: 1px; }
    .nav-item.active { color: var(--cyan); background: rgba(0,243,255,0.05); box-shadow: inset 0 0 10px rgba(0,243,255,0.1); }
  </style>
</head>
<body>

<header>
  <div>SYSTEM_v5.0</div>
  <div id="clock">00:00:00</div>
</header>

<div class="ticker-wrap" id="ticker-text">SECURE ACCESS GRANTED // READY FOR SCAN...</div>

<main>
  <section id="mission" class="portal-section active">
    <div class="search-box">
      <span class="label-mini">INPUT MISSION_ID (4-5 DIGITS)</span>
      <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
      
      <div class="btn-row">
        <button id="main-btn" class="btn btn-save">SAVE</button>
        <button id="term-btn" class="btn btn-terminate">TERMINATE</button>
      </div>
    </div>

    <div id="terminal">
      <div class="log-entry">> CONSOLE_INIT_SUCCESS...</div>
    </div>
  </section>

  <section id="vault" class="portal-section">
    <div style="text-align: center; margin-top: 40px; color: var(--cyan); font-family: var(--font-mono); font-size: 14px;">[ VAULT_LOCKED ]</div>
  </section>
</main>

<div id="weapon-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">X</button>
    <div class="modal-tag" id="modal-order">ORDER #00000</div>
    <div class="weapon-info">
      WEAPON_SYSTEM: <span id="m-weapon">--</span>
      V-AGENT_ID: <span id="m-agent">--</span>
      <div id="m-status" style="font-size:11px; margin-top:5px; border-top: 1px solid #222; padding-top:5px;"></div>
    </div>
  </div>
</div>

<nav>
  <div class="nav-item active" id="btn-m">PORTAL_01</div>
  <div class="nav-item" id="btn-v">PORTAL_02</div>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // PAALALA: Siguraduhin na tama ang iyong Firebase Config
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    projectId: "YOUR_PROJECT_ID",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const mainBtn = document.getElementById('main-btn');
  const term = document.getElementById('terminal');
  
  let currentRecord = null;
  let isBlacklisted = false;

  // --- AUTO SEARCH LOGIC (FIXED) ---
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    
    if (val.length >= 4) {
      log(`SCANNING DATA: ${val}...`, 'cyan');
      
      try {
        // PRIORITY 1: BLACKLIST CHECK
        const qB = query(collection(db, "blacklist"), where("targetID", "==", val));
        const snapB = await getDocs(qB);
        isBlacklisted = !snapB.empty;

        // PRIORITY 2: MISSION ORDER CHECK
        // Tandaan: Chine-check natin ang String ("val") at Number (val)
        const qM = query(collection(db, "mission_orders"), where("orderNumber", "==", val));
        const snapM = await getDocs(qM);

        if (!snapM.empty) {
          currentRecord = snapM.docs[0].data();
          activateRetrieve();
          log(`DATA LOCATED [${val}]`, 'blue');
        } else if (isBlacklisted) {
          currentRecord = { weaponSystem: "BLOCKED", agent: "TERMINATED" };
          activateRetrieve();
          log(`WARNING: ID BLACKLISTED`, 'red');
        } else {
          resetToSave();
          log(`NO RECORD FOUND. READY TO SAVE.`, 'green');
        }
      } catch (err) {
        log(`ERR: ${err.message}`, 'red');
      }
    } else {
      resetToSave();
    }
  });

  function activateRetrieve() {
    mainBtn.textContent = "RETRIEVE";
    mainBtn.className = "btn btn-retrieve";
  }

  function resetToSave() {
    currentRecord = null;
    isBlacklisted = false;
    mainBtn.textContent = "SAVE";
    mainBtn.className = "btn btn-save";
  }

  // --- SAVE / RETRIEVE ACTION ---
  mainBtn.addEventListener('click', async () => {
    const val = input.value;
    if (val.length < 4) return log("INVALID ID LENGTH", "red");

    if (mainBtn.textContent === "RETRIEVE") {
      document.getElementById('modal-order').textContent = `ORDER #${val}`;
      document.getElementById('m-weapon').textContent = currentRecord.weaponSystem || "N/A";
      document.getElementById('m-agent').textContent = currentRecord.agent || "X-AGENT";
      document.getElementById('m-status').innerHTML = isBlacklisted ? "<span style='color:red;'>STATUS: BLACKLISTED</span>" : "<span style='color:green;'>STATUS: ACTIVE</span>";
      document.getElementById('weapon-modal').style.display = 'flex';
    } else {
      log(`SAVING MISSION ${val}...`, 'green');
      try {
        await addDoc(collection(db, "mission_orders"), {
          orderNumber: val,
          weaponSystem: "TACTICAL_ISSUE",
          agent: "V" + Math.floor(100+Math.random()*900),
          createdAt: serverTimestamp()
        });
        log(`MISSION ${val} SAVED.`, 'green');
        input.value = ""; resetToSave();
      } catch (e) { log(`SAVE_ERR: ${e.code}`, 'red'); }
    }
  });

  // --- TERMINATE ACTION ---
  document.getElementById('term-btn').addEventListener('click', async () => {
    const val = input.value;
    if (val.length < 4) return log("INVALID ID", "red");
    if(!confirm("BLACKLIST THIS ID?")) return;

    try {
      await addDoc(collection(db, "blacklist"), { targetID: val, timestamp: serverTimestamp() });
      log(`ID ${val} BLACKLISTED.`, 'red');
      input.value = ""; resetToSave();
    } catch (e) { log("ERR: FAILED TO BLACKLIST", "red"); }
  });

  // Helper UI
  window.closeModal = () => document.getElementById('weapon-modal').style.display = 'none';
  function log(msg, color) {
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.style.color = `var(--${color})`;
    entry.textContent = `> ${msg}`;
    term.prepend(entry);
  }
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
