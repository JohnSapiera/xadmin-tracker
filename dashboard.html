<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CORE_DASH_v26.9_FINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #02080a; --panel: rgba(5, 15, 20, 0.9); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
      --green: #05ffa1; --yellow: #ffbd00; --border: rgba(0, 243, 255, 0.2);
      --font-mono: 'Share Tech Mono', monospace; --font-main: 'Rajdhani', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: #e1f5f9; font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    header { padding: 15px 20px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .status-bar { font-size: 11px; padding: 8px 20px; background: rgba(0,243,255,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }
    
    main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 25px; border-radius: 4px; position: relative; }
    
    #mission-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--cyan); color: #fff; font-family: var(--font-mono); font-size: 50px; text-align: center; outline: none; margin-bottom: 20px; letter-spacing: 8px; }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { height: 55px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; font-family: var(--font-main); font-size: 16px; transition: 0.2s; }
    .btn-save { background: var(--green); color: #000; }
    .btn-retrieve { background: var(--blue); color: #fff; }
    .btn-reserve { background: transparent; color: #fff; border: 1px solid #fff; }
    .btn:active { transform: scale(0.98); opacity: 0.8; }
    .btn:disabled { opacity: 0.1; cursor: not-allowed; }

    #terminal { background: rgba(0,0,0,0.85); border-left: 3px solid var(--cyan); padding: 15px; font-family: var(--font-mono); font-size: 11px; height: 220px; overflow-y: auto; color: #9ab4bc; box-shadow: inset 0 0 10px #000; }
    .term-line { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.02); padding-bottom: 2px; animation: scanline 0.2s ease-out; }
    @keyframes scanline { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }

    /* Overlay & Popups */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
    .popup { width: 100%; max-width: 380px; background: #051014; border: 1px solid var(--cyan); padding: 25px; box-shadow: 0 0 30px var(--cyan-dim); }
    .pop-title { font-size: 40px; color: var(--cyan); text-align: center; margin-bottom: 20px; font-weight: 700; font-family: var(--font-main); }
    .pop-input { width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--green); padding: 12px; font-family: var(--font-mono); margin-bottom: 20px; text-align: center; font-size: 18px; outline: none; }
    
    .device-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 20px; max-height: 150px; overflow-y: auto; padding-right: 5px; }
    .dev-btn { background: #08161b; border: 1px solid #1a2f37; color: #5c7882; padding: 12px; font-size: 11px; cursor: pointer; font-family: var(--font-mono); text-align: left; text-transform: uppercase; }
    .dev-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); box-shadow: inset 0 0 10px var(--cyan-dim); }
    .pop-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>

<header>
  <span style="font-weight: 700; color: #fff; letter-spacing: 2px;">CORE_SYSTEM_v26.9</span>
</header>

<div class="status-bar">
    <div>TIME: <span id="clock">00:00:00</span></div>
    <div>AGENT: <span id="agent-display" style="color:#fff">---</span></div>
    <div>DEVICE: <span id="device-display" style="color:#fff">---</span></div>
</div>

<main>
  <div class="command-module">
    <input type="tel" id="mission-input" placeholder="ID NO" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
    </div>
  </div>
  <div id="terminal"></div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div class="pop-title" id="pop-m-id">#0000</div>
        <div style="font-size:10px; color:#5c7882; margin-bottom:5px; font-family:var(--font-mono)">V_AGENT_LINK_ID:</div>
        <input type="text" id="v-agent-input" class="pop-input" placeholder="REQUIRED">
        
        <div style="font-size:10px; color:var(--cyan); margin-bottom:8px; font-family:var(--font-mono)">DISCOVERED_WEAPON_SYSTEMS:</div>
        <div class="device-grid" id="pop-device-list"></div>
        
        <div class="pop-btn-row">
            <button id="modal-submit" onclick="submitMission()" class="btn">ACTION</button>
            <button onclick="closePopup()" class="btn btn-reserve">ABORT</button>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
    authDomain: "my-admin-portal-12691.firebaseapp.com", 
    projectId: "my-admin-portal-12691", 
    storageBucket: "my-admin-portal-12691.firebasestorage.app", 
    messagingSenderId: "317015091563", 
    appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const fullWeaponMap = {
    "SIG-20452634": "REDMI NOTE 14 PRO 5G", 
    "SIG-5B0D3A5C": "REALME 8 PRO",
    "SIG-6AC68A2E": "LAPTOP: ACER", 
    "SIG-X921FFA": "IPHONE 15 PRO",
    "SIG-K882190": "POCO X6 PRO", 
    "SIG-V001122": "VIVO V30"
  };

  const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN";
  const currentDeviceSig = localStorage.getItem("device_signature") || "SIG-3A14D65A";
  
  document.getElementById('agent-display').innerText = currentAgent;
  document.getElementById('device-display').innerText = fullWeaponMap[currentDeviceSig] || "DEV_UNDEFINED";

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const terminal = document.getElementById('terminal');

  let isRetrieveMode = false;
  let activeRecord = null;
  let selectedDeviceSig = currentDeviceSig;

  // --- LOGGING ENGINE ---
  const localLog = (msg, color = "#9ab4bc") => {
    const div = document.createElement('div');
    div.className = "term-line";
    div.innerHTML = `[${new Date().toLocaleTimeString()}] > <span style="color:${color}">${msg}</span>`;
    terminal.prepend(div);
    if (terminal.childNodes.length > 25) terminal.lastChild.remove();
  };

  // Live Sync for DB Logs (records from all devices of this agent)
  onSnapshot(query(collection(db, "terminal_logs"), orderBy("timestamp", "desc"), limit(5)), (snap) => {
    snap.docChanges().forEach((change) => {
      if (change.type === "added") {
        const data = change.doc.data();
        if(data.agent === currentAgent && data.timestamp) {
            localLog(`DB_SYNC: ${data.message}`, data.color || 'var(--cyan)');
        }
      }
    });
  });

  // --- AUTO ID SCAN ---
  input.addEventListener('input', async () => {
    const val = input.value.trim();
    if (val.length >= 1) localLog(`INPUT: ${val}`, 'var(--cyan)');

    if (val.length >= 4) {
      localLog(`SCANNING FREQUENCIES...`, 'var(--yellow)');
      const q = query(collection(db, "mission_orders"), where("missionID", "==", val));
      const snap = await getDocs(q);

      if (!snap.empty) {
        activeRecord = snap.docs[0].data();
        isRetrieveMode = true;
        actionBtn.className = "btn btn-retrieve";
        actionBtn.textContent = "RETRIEVE";
        localLog(`SIGNAL MATCH: REGISTERED TO ${activeRecord.agentName}`, 'var(--blue)');
      } else {
        isRetrieveMode = false;
        actionBtn.className = "btn btn-save";
        actionBtn.textContent = "SAVE";
        localLog(`SIGNAL CLEAR: ID AVAILABLE`, 'var(--green)');
      }
    }
  });

  // --- POPUP & DEVICE HARVESTING ---
  actionBtn.onclick = async () => {
    if (input.value.length < 4) return;
    
    localLog(`PREPARING ${isRetrieveMode ? 'RETRIEVE' : 'SAVE'} INTERFACE`, 'var(--cyan)');
    document.getElementById('modal-overlay').style.display = 'flex';
    document.getElementById('pop-m-id').innerText = `#${input.value}`;

    // Harvesting devices linked to agentName
    const myDeviceSigs = new Set();
    myDeviceSigs.add(currentDeviceSig);

    const q = query(collection(db, "mission_orders"), where("agentName", "==", currentAgent));
    const snap = await getDocs(q);
    snap.forEach(d => { if(d.data().weaponSystem) myDeviceSigs.add(d.data().weaponSystem); });

    const grid = document.getElementById('pop-device-list');
    grid.innerHTML = "";
    
    // Set default selected
    selectedDeviceSig = isRetrieveMode ? activeRecord.weaponSystem : currentDeviceSig;

    myDeviceSigs.forEach(sig => {
      const btn = document.createElement('button');
      btn.className = `dev-btn ${sig === selectedDeviceSig ? 'active' : ''}`;
      btn.innerText = fullWeaponMap[sig] || `ID: ${sig}`;
      
      btn.onclick = () => {
        localLog(`SWITCHING TO: ${fullWeaponMap[sig] || sig}`, 'var(--yellow)');
        document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDeviceSig = sig;
      };
      grid.appendChild(btn);
    });

    const modalBtn = document.getElementById('modal-submit');
    modalBtn.innerText = isRetrieveMode ? "DEPLOY" : "SAVE";
    modalBtn.className = isRetrieveMode ? "btn btn-retrieve" : "btn btn-save";
    document.getElementById('v-agent-input').value = isRetrieveMode ? activeRecord.vAgentID : "";
  };

  window.submitMission = async () => {
    const targetID = input.value.trim();
    const vID = document.getElementById('v-agent-input').value.trim();
    localLog(`INITIATING UPLINK...`, 'var(--yellow)');

    const data = { 
      missionID: targetID, 
      agentName: currentAgent, 
      vAgentID: vID, 
      weaponSystem: selectedDeviceSig, 
      expenses: 0, 
      timestamp: serverTimestamp() 
    };

    try {
      await setDoc(doc(db, "mission_orders", targetID), data, { merge: true });
      await addDoc(collection(db, "terminal_logs"), { 
        message: `${isRetrieveMode ? 'RETRIEVED' : 'SAVED'} ID ${targetID} VIA ${fullWeaponMap[selectedDeviceSig] || selectedDeviceSig}`, 
        color: isRetrieveMode ? 'var(--blue)' : 'var(--green)', 
        timestamp: serverTimestamp(), 
        agent: currentAgent 
      });
      localLog(`TRANSMISSION COMPLETE`, 'var(--green)');
      setTimeout(() => location.reload(), 800);
    } catch(e) {
      localLog(`TRANSMISSION FAILED`, 'var(--red)');
    }
  };

  window.closePopup = () => {
    document.getElementById('modal-overlay').style.display = 'none';
    localLog(`OPERATION ABORTED`, 'var(--red)');
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
  localLog(`SYSTEM_READY: STANDING BY`, 'var(--green)');
</script>
</body>
</html>
