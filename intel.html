<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>AGENCY_INTEL_v24.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #01080b; --cyan: #00f3ff; --red: #ff003c; --green: #00ff66; 
            --border: rgba(0, 243, 255, 0.15); --mono: 'Share Tech Mono', monospace; 
            --glass: rgba(2, 12, 18, 0.95);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        header { padding: 10px; border-bottom: 1px solid var(--border); text-align: center; background: #000; }
        .intel-title { font-family: var(--mono); color: var(--cyan); font-size: 12px; letter-spacing: 3px; }

        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        
        .agent-name { font-size: 32px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        .device-tag { font-size: 9px; color: #5c7882; font-family: var(--mono); margin-top: 5px; }

        /* FIXED MOBILE BUTTON */
        .report-btn { 
            margin-top: 25px; background: rgba(0, 243, 255, 0.05); border: 1px solid var(--cyan); 
            color: var(--cyan); width: 260px; height: 55px; /* Fixed height/width para iwas spacing issues */
            font-family: var(--mono); font-size: 14px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: 0.2s;
        }
        .report-btn:active { background: var(--cyan); color: #000; }

        /* MODAL */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 1000; }
        .modal-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 350px; background: var(--glass); 
            border: 1px solid var(--border); border-top: 4px solid var(--cyan); padding: 20px;
        }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-label { font-family: var(--mono); font-size: 9px; color: var(--cyan); margin-bottom: 5px; display: block; }
        
        .intel-input { 
            width: 100%; background: #05131a; border: 1px solid #1a2f37; padding: 12px; 
            color: #fff; font-family: var(--mono); font-size: 16px; outline: none; text-align: center;
        }

        /* NEON PULSE ANIMATION */
        @keyframes neonPulse {
            0% { border-color: var(--green); box-shadow: 0 0 5px var(--green); }
            50% { border-color: #fff; box-shadow: 0 0 15px var(--green); }
            100% { border-color: var(--green); box-shadow: 0 0 5px var(--green); }
        }

        .weapon-detected-active { 
            animation: neonPulse 1s infinite; 
            color: var(--green) !important;
            border: 1px solid var(--green);
            padding: 10px; margin-top: 5px; font-family: var(--mono); text-align: center;
        }

        .btn-transmit { 
            width: 100%; padding: 15px; background: var(--cyan); color: #000; 
            border: none; font-family: var(--mono); font-size: 14px; font-weight: 900; cursor: pointer;
        }
        .btn-transmit:disabled { opacity: 0.1; }

        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #444; font-family: var(--mono); text-decoration: none; font-size: 11px; }
        .nav-link.active { color: var(--cyan); border-top: 2px solid var(--cyan); }
    </style>
</head>
<body>

<header><div class="intel-title">INTEL_TERMINAL_V24.5</div></header>

<main>
    <div id="display-name" class="agent-name">---</div>
    <div id="device-tag" class="device-tag">SESSION_ENCRYPTED</div>
    
    <button class="report-btn" onclick="openReport()">INITIATE_REPORT</button>
</main>

<div id="report-modal" class="modal">
    <div class="modal-box">
        <div id="scan-status" style="font-size:9px; color:#5c7882; text-align:center; margin-bottom:15px; font-family:var(--mono);">AWAITING_UPLINK...</div>

        <div class="input-group">
            <span class="input-label">V_AGENT_ID</span>
            <input type="text" id="vAgentInput" class="intel-input" placeholder="0000" oninput="handleScan(this.value)">
        </div>

        <div id="weapon-zone" style="display:none; margin-bottom:15px;">
            <span class="input-label">WEAPON_SYSTEM</span>
            <div id="weapon-display" class="weapon-detected-active"></div>
        </div>

        <div class="input-group">
            <span class="input-label">BOUNTY_EXPENSES (PHP)</span>
            <input type="number" id="expensesInput" class="intel-input" placeholder="0.00" oninput="validateForm()">
        </div>

        <button id="transmit-btn" onclick="transmitData()" class="btn-transmit" disabled>INCOMPLETE</button>
        <button onclick="closeReport()" style="width:100%; background:transparent; color:var(--red); border:none; margin-top:10px; font-family:var(--mono); font-size:9px;">// ABORT</button>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="#" class="nav-link active">INTEL</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedWeapon = "N/A";

    window.onload = () => {
        const name = localStorage.getItem("cia_agent");
        if (!name) window.location.href = "index.html";
        document.getElementById('display-name').innerText = name;
    };

    window.handleScan = async (val) => {
        const status = document.getElementById('scan-status');
        const weaponZone = document.getElementById('weapon-zone');
        const weaponDisplay = document.getElementById('weapon-display');
        const cleanVal = val.trim();

        if(cleanVal.length < 1) {
            weaponZone.style.display = "none";
            status.innerText = "AWAITING_INPUT...";
            return;
        }

        try {
            const q = query(collection(db, "mission_orders"), where("vAgentID", "==", cleanVal));
            const snap = await getDocs(q);

            if (!snap.empty) {
                const data = snap.docs[0].data();
                status.innerText = ">> IDENTITY_LOCKED: " + (data.missionID || "ACTIVE");
                status.style.color = "var(--green)";
                weaponZone.style.display = "block";
                weaponDisplay.innerText = data.weaponSystem || "N/A";
                selectedWeapon = data.weaponSystem;
            } else {
                status.innerText = ">> ID_NOT_FOUND";
                status.style.color = "#5c7882";
                weaponZone.style.display = "none";
                selectedWeapon = "N/A";
            }
            validateForm();
        } catch (e) { console.error(e); }
    };

    window.validateForm = () => {
        const v = document.getElementById('vAgentInput').value;
        const e = document.getElementById('expensesInput').value;
        const btn = document.getElementById('transmit-btn');
        btn.disabled = !(v.length > 0 && e > 0 && selectedWeapon !== "N/A");
        if(!btn.disabled) btn.innerText = "TRANSMIT_DATA";
    };

    // FIXED NEW ENTRY LOGIC (Para may history ka lagi)
    window.transmitData = async () => {
        const v = document.getElementById('vAgentInput').value.trim();
        const e = document.getElementById('expensesInput').value;
        const agent = localStorage.getItem("cia_agent");

        try {
            // Ito ay laging gagawa ng BAGONG document (Fix Entry)
            await addDoc(collection(db, "bounties"), {
                reportedBy: agent,
                targetV_Agent: v,
                weaponUsed: selectedWeapon,
                amount: parseFloat(e),
                timestamp: serverTimestamp()
            });
            alert("✅ MISSION_REPORT_LOGGED");
            location.reload();
        } catch (err) { alert("❌ ERROR"); }
    };

    window.openReport = () => document.getElementById('report-modal').style.display = 'block';
    window.closeReport = () => document.getElementById('report-modal').style.display = 'none';
</script>
</body>
</html>
