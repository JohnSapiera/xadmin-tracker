<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MISSION_DATA_RESERVER</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #0a0a0a; }
        body { 
            background: var(--bg); color: var(--neon); font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .panel {
            background: #111; border: 2px solid var(--neon); padding: 30px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); width: 100%; max-width: 450px;
        }
        h2 { font-size: 16px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; margin-bottom: 5px; color: #888; }
        select, textarea {
            width: 100%; background: #000; border: 1px solid #333; color: #fff;
            padding: 12px; font-family: inherit; outline: none; box-sizing: border-box;
        }
        textarea { height: 200px; resize: none; border-color: #444; }
        .btn-execute {
            width: 100%; background: var(--neon); color: #000; border: none;
            padding: 15px; font-weight: 800; cursor: pointer; margin-top: 10px;
        }
        #status { font-size: 10px; margin-top: 15px; text-align: center; color: #888; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="panel">
        <h2>BULK_MISSION_RESERVER</h2>
        
        <div class="form-group">
            <label>SELECT AGENT</label>
            <select id="agentId" onchange="updateWeapons()">
                <option value="">-- SELECT --</option>
                <option value="LZ">LZ</option>
                <option value="JFSN">JFSN</option>
            </select>
        </div>

        <div class="form-group">
            <label>WEAPON SYSTEM</label>
            <select id="weaponId">
                <option value="">-- SELECT AGENT FIRST --</option>
            </select>
        </div>

        <div class="form-group">
            <label>PASTE MISSION ORDER# LIST (ONE PER LINE)</label>
            <textarea id="orderList" placeholder="50501&#10;50502&#10;50503..."></textarea>
        </div>

        <button class="btn-execute" onclick="executeBulkArchive()">EXECUTE ARCHIVE</button>
        <div id="status">SYSTEM_READY</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const weaponMap = {
            "LZ": ["R8P", "RMN", "RMN14"],
            "JFSN": ["RMN9", "TechnoCP"]
        };

        function updateWeapons() {
            const agent = document.getElementById('agentId').value;
            const weaponSelect = document.getElementById('weaponId');
            weaponSelect.innerHTML = "";
            if (weaponMap[agent]) {
                weaponMap[agent].forEach(wpn => {
                    let opt = document.createElement('option');
                    opt.value = wpn;
                    opt.innerHTML = wpn + " SYSTEM";
                    weaponSelect.appendChild(opt);
                });
            } else {
                weaponSelect.innerHTML = "<option value=''>-- SELECT AGENT --</option>";
            }
        }

        async function executeBulkArchive() {
            const agent = document.getElementById('agentId').value;
            const weapon = document.getElementById('weaponId').value;
            const rawInput = document.getElementById('orderList').value.trim();
            const status = document.getElementById('status');

            if (!agent || !weapon || !rawInput) {
                alert("ERROR: Missing Agent, Weapon, or Order List.");
                return;
            }

            const orders = rawInput.split('\n').map(n => n.trim()).filter(n => n !== "");
            status.innerText = "ARCHIVING_" + orders.length + "_ORDERS...";
            
            const batch = db.batch();

            orders.forEach((num, index) => {
                // Gagamitin ang Mission Order# bilang Document ID para BAN na siya (No Duplicates)
                const docRef = db.collection("blacklist").doc(num); 
                batch.set(docRef, {
                    agent: agent,
                    weapon: weapon,
                    missionOrder: num,
                    vid: index + 1, // Awtomatikong sequence para sa profiling folders
                    status: "ARCHIVED",
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            });

            try {
                await batch.commit();
                status.style.color = "#00ff00";
                status.innerText = "SUCCESS: MISSION_ORDERS_RESERVED";
                document.getElementById('orderList').value = "";
            } catch (error) {
                status.style.color = "red";
                status.innerText = "ERROR: " + error.message;
            }
        }
    </script>
</body>
</html>
