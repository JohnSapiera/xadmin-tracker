<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL V5.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #01080b; --panel: #051218; --cyan: #00f3ff; --red: #ff003c;
      --blue: #007bff; --green: #00ff66; --border: rgba(0, 243, 255, 0.15);
      --font-mono: 'Share Tech Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Ultra Compact Header */
    header { padding: 4px 10px; height: 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 11px; background: #000; }
    .ticker { font-size: 9px; color: var(--cyan); padding: 2px 10px; border-bottom: 1px solid var(--border); opacity: 0.7; }

    main { flex: 1; padding: 10px; overflow-y: auto; padding-bottom: 70px; }
    .search-box { background: var(--panel); border: 1px solid var(--border); padding: 12px; border-radius: 2px; }
    
    #mission-input { 
      width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--cyan); 
      font-family: var(--font-mono); font-size: 24px; padding: 8px; text-align: center; 
      letter-spacing: 4px; outline: none; margin-bottom: 12px; 
    }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { padding: 12px; font-family: var(--font-mono); font-size: 12px; font-weight: bold; border: 1px solid; background: transparent; text-transform: uppercase; cursor: pointer; }
    
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    #terminal { background: #000; border: 1px solid #111; padding: 8px; font-family: var(--font-mono); font-size: 10px; min-height: 100px; color: #555; margin-top: 12px; overflow-y: auto; }
    
    /* Modal Mobile */
    #weapon-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--panel); border: 1px solid var(--red); width: 100%; max-width: 300px; padding: 30px 15px 15px; position: relative; }
    .modal-close { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; border: none; padding: 5px 10px; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; height: 55px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
    .nav-item { display: flex; align-items: center; justify-content: center; color: #333; font-size: 11px; font-family: var(--font-mono); }
    .nav-item.active { color: var(--cyan); background: rgba(0,243,255,0.05); }
  </style>
</head>
<body>

<header>
  <div>GATEWAY_v5.1</div>
  <div id="clock" style="color:var(--cyan)">00:00:00</div>
</header>
<div class="ticker">SECURE_ACCESS_V5 // STATUS: ONLINE</div>

<main>
  <div class="search-box">
    <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="term-btn" class="btn btn-terminate">TERMINATE</button>
    </div>
  </div>

  <div id="terminal">
    <div>> SYSTEM_READY...</div>
  </div>
</main>

<div id="weapon-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeM()">X</button>
    <div style="font-family:var(--font-mono); font-size:12px; margin-bottom:10px; color:var(--red)" id="m-id">ID: 00000</div>
    <div style="font-size:14px; line-height:1.6">
      WEAPON: <span id="m-weap" style="color:var(--cyan)">--</span><br>
      AGENT: <span id="m-age" style="color:var(--cyan)">--</span><br>
      STATUS: <span id="m-stat">--</span>
    </div>
  </div>
</div>

<nav>
  <div class="nav-item active">PORTAL_01</div>
  <div class="nav-item">PORTAL_02</div>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    projectId: "YOUR_PROJECT_ID",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const term = document.getElementById('terminal');
  
  let currentData = null;
  let blacklisted = false;

  // --- DUAL SEARCH LOGIC (STR + NUM) ---
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    if (val.length >= 4) {
      log(`SCANNING DATA: ${val}`, 'cyan');
      try {
        let found = false;

        // 1. SEARCH BLACKLIST
        const qB = [
          query(collection(db, "blacklist"), where("targetID", "==", val)),
          query(collection(db, "blacklist"), where("targetID", "==", Number(val)))
        ];
        for(let q of qB) {
          const s = await getDocs(q);
          if(!s.empty) { 
            blacklisted = true; found = true; 
            currentData = { weaponSystem: "LOCKED", agent: "REDACTED" };
            break; 
          }
        }

        // 2. SEARCH MISSIONS (Kung hindi pa nahanap sa blacklist)
        if(!found) {
          const qM = [
            query(collection(db, "mission_orders"), where("orderNumber", "==", val)),
            query(collection(db, "mission_orders"), where("orderNumber", "==", Number(val)))
          ];
          for(let q of qM) {
            const s = await getDocs(q);
            if(!s.empty) { 
              currentData = s.docs[0].data();
              blacklisted = false; found = true; 
              break; 
            }
          }
        }

        if (found) {
          actionBtn.textContent = "RETRIEVE";
          actionBtn.className = "btn btn-retrieve";
          log(`MATCH_FOUND. PROTOCOL: ${blacklisted ? 'BLACKLIST' : 'AUTHORIZED'}`, 'blue');
        } else {
          reset();
          log(`ID_${val} NOT_FOUND.`, 'green');
        }
      } catch (err) { log(`DB_ERR: ${err.message}`, 'red'); }
    } else { reset(); }
  });

  function reset() {
    currentData = null; blacklisted = false;
    actionBtn.textContent = "SAVE";
    actionBtn.className = "btn btn-save";
  }

  actionBtn.addEventListener('click', async () => {
    const val = input.value;
    if (val.length < 4) return;

    if (actionBtn.textContent === "RETRIEVE") {
      document.getElementById('m-id').textContent = `ID: ${val}`;
      document.getElementById('m-weap').textContent = currentData.weaponSystem || "TACTICAL";
      document.getElementById('m-age').textContent = currentData.agent || "V-00";
      document.getElementById('m-stat').innerHTML = blacklisted ? "<b style='color:red'>BLACKLISTED</b>" : "<b style='color:green'>AUTHORIZED</b>";
      document.getElementById('weapon-modal').style.display = 'flex';
    } else {
      log(`ARCHIVING ${val}...`, 'green');
      try {
        await addDoc(collection(db, "mission_orders"), {
          orderNumber: val, weaponSystem: "ARC_V1", agent: "V"+Math.floor(100+Math.random()*900), timestamp: serverTimestamp()
        });
        log(`SUCCESS: ${val} SAVED.`, 'green');
        input.value = ""; reset();
      } catch (e) { log("SAVE_ERROR", "red"); }
    }
  });

  document.getElementById('term-btn').onclick = async () => {
    const val = input.value;
    if (val.length < 4 || !confirm("TERMINATE ID?")) return;
    try {
      await addDoc(collection(db, "blacklist"), { targetID: val, timestamp: serverTimestamp() });
      log(`ID ${val} BLACKLISTED.`, 'red');
      input.value = ""; reset();
    } catch (e) { log("TERM_ERR", "red"); }
  };

  window.closeM = () => document.getElementById('weapon-modal').style.display = 'none';
  function log(m, c) {
    const d = document.createElement('div'); d.style.color = `var(--${c})`;
    d.textContent = `> ${m}`; term.prepend(d);
  }
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
