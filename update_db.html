<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Agent Account</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Create Agent Account</h1>
    <form id="agentForm">
        <div>
            <label>Agent Name:</label><br>
            <input type="text" id="agentName" required>
        </div>
        <br>
        <div>
            <label>Secret Key (4-digit):</label><br>
            <input type="password" id="secretKey" maxlength="4" pattern="[0-9]{4}" required>
            <small>Enter exactly 4 digits</small>
        </div>
        <br>
        <button type="submit">Create Agent Account</button>
    </form>
    <div id="message" style="margin-top: 20px;"></div>

    <script>
        // Supabase configuration - TAMANG KEYS
        const SUPABASE_URL = 'https://pgclrzqfpoznvrjrzced.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s';
        
        // Initialize Supabase client - IISA LANG
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const form = document.getElementById('agentForm');
        const messageDiv = document.getElementById('message');
        
        function showMessage(text, isError = false) {
            messageDiv.innerHTML = text;
            messageDiv.style.color = isError ? 'red' : 'green';
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }
        
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const agentName = document.getElementById('agentName').value.trim();
            const secretKey = document.getElementById('secretKey').value;
            
            if (!agentName) {
                showMessage('Please enter agent name', true);
                return;
            }
            
            if (!secretKey || secretKey.length !== 4 || !/^\d+$/.test(secretKey)) {
                showMessage('Secret key must be exactly 4 digits (0-9 only)', true);
                return;
            }
            
            const submitButton = form.querySelector('button');
            submitButton.disabled = true;
            submitButton.textContent = 'Creating...';
            
            try {
                // Check if agent exists
                const { data: existing } = await supabase
                    .from('agents')
                    .select('agent_name')
                    .eq('agent_name', agentName)
                    .maybeSingle();
                
                if (existing) {
                    showMessage('Agent name already exists!', true);
                    submitButton.disabled = false;
                    submitButton.textContent = 'Create Agent Account';
                    return;
                }
                
                // Insert new agent
                const { data, error } = await supabase
                    .from('agents')
                    .insert([{ 
                        agent_name: agentName, 
                        secret_key: secretKey,
                        created_at: new Date().toISOString()
                    }])
                    .select();
                
                if (error) {
                    showMessage('Error: ' + error.message, true);
                } else {
                    showMessage('✅ Agent "' + agentName + '" created successfully!');
                    form.reset();
                }
            } catch (err) {
                showMessage('Error: ' + err.message, true);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Create Agent Account';
            }
        });
    </script>
</body>
</html>
