<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CORE_DASH</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#02080a">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#01080b;--cyan:#00f2ff;--red:#ff003c;--green:#00ff66;--yellow:#ffbd00;--blue:#007bff;}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
body{background:#01080b;font-family:'Share Tech Mono',monospace;min-height:100vh;padding:16px;padding-bottom:80px;}
header{padding:12px;border-bottom:1px solid rgba(0,242,255,0.3);margin-bottom:16px;}
.status-bar{display:flex;justify-content:space-between;font-size:10px;color:#5c7882;margin-bottom:20px;padding:8px;border:1px solid #1a2f37;}
.command-module{background:rgba(2,10,13,0.95);border:1px solid rgba(0,242,255,0.3);padding:20px;margin-bottom:20px;}
#mission-input{width:100%;background:#000;border:1px solid #1a2f37;padding:15px;color:#05ffa1;font-size:24px;text-align:center;letter-spacing:8px;font-family:monospace;margin-bottom:15px;}
#mission-status{text-align:center;font-size:12px;margin-bottom:15px;min-height:40px;}
.btn-row{display:flex;gap:12px;}
.btn{flex:1;background:transparent;border:1px solid #1a2f37;padding:12px;font-family:monospace;font-size:14px;cursor:pointer;text-align:center;transition:0.2s;}
.btn-save{border-color:#00ff66;color:#00ff66;}
.btn-reserve{border-color:#ffbd00;color:#ffbd00;}
.btn-retrieve{border-color:#007bff;color:#007bff;}
.btn-view{border-color:#00f2ff;color:#00f2ff;}
.hidden{display:none !important;}
#terminal{background:#000;border:1px solid #1a2f37;padding:12px;height:200px;overflow-y:auto;font-size:10px;margin-bottom:16px;}
.term-line{margin-bottom:4px;font-family:monospace;}
.profile-mini{display:flex;align-items:center;gap:12px;background:#000;border:1px solid #1a2f37;padding:12px;margin-bottom:16px;}
.avatar{width:40px;height:40px;border-radius:50%;background:#00f2ff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;}
.profile-info{flex:1;}
.profile-info div:first-child{color:#00f2ff;font-weight:bold;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#01080b;border-top:1px solid #1a2f37;padding:12px;}
.nav-item{flex:1;text-align:center;color:#5c7882;text-decoration:none;font-size:12px;}
.nav-item.active{color:#00f2ff;}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;justify-content:center;align-items:center;z-index:1000;}
.popup{background:#01080b;border:1px solid #00f2ff;width:90%;max-width:400px;padding:20px;position:relative;}
.popup-header-icon{position:absolute;top:-12px;left:10px;background:#01080b;padding:0 8px;color:#00f2ff;}
#pop-header{text-align:center;color:#00f2ff;font-size:18px;margin-bottom:20px;}
.popup-field{margin-bottom:15px;}
.popup-label{font-size:10px;color:#5c7882;margin-bottom:5px;}
.pop-input{width:100%;background:#000;border:1px solid #1a2f37;padding:10px;color:#05ffa1;}
.secure-line-wrapper{margin-bottom:15px;}
#add-secure-line{display:block;color:#ffbd00;font-size:10px;cursor:pointer;margin-bottom:5px;}
#secure-input-field{display:none;width:100%;background:#000;border:1px solid #1a2f37;padding:10px;color:#05ffa1;}
#secure-input-field.show{display:block;}
.weapon-selector{display:flex;flex-wrap:wrap;gap:8px;}
.weapon-btn{background:transparent;border:1px solid #1a2f37;padding:8px 12px;color:#00f2ff;cursor:pointer;font-size:11px;}
.weapon-btn.selected{background:#00f2ff;color:#000;}
</style>
</head>
<body>

<header>
<span style="font-weight:700;color:#fff;letter-spacing:2px;">CORE_DASH</span>
</header>

<div class="status-bar">
<div>SYS_TIME: <span id="clock">00:00:00</span></div>
<div style="color:var(--green);">UPLINK_STABLE</div>
</div>

<main>
<div class="command-module">
<input type="tel" id="mission-input" placeholder="0000" maxlength="5" autocomplete="off">
<div id="mission-status"></div>
<div class="btn-row">
<button id="action-btn" class="btn btn-save">SAVE</button>
<button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
</div>
</div>
<div id="terminal"></div>

<div class="profile-mini">
<div class="avatar" id="avatar-init">?</div>
<div class="profile-info">
<div id="prof-name">AGENT_PENDING</div>
<div>AUTH_LEVEL: OMEGA</div>
</div>
</div>
</main>

<div class="overlay" id="modal-overlay">
<div class="popup">
<div class="popup-header-icon"><span>⚙️</span></div>
<div id="pop-header">MISSION ORDER</div>
<div class="popup-field">
<div class="popup-label">🔹 vAGENT IDENTIFIER</div>
<input type="text" id="v-agent-input" class="pop-input" placeholder="ENTER vAGENT ID">
</div>
<div class="secure-line-wrapper">
<span id="add-secure-line">+ ADD SECURE LINE</span>
<input type="tel" id="secure-input-field" maxlength="11" placeholder="09XXXXXXXXX">
</div>
<div class="popup-field">
<div class="popup-label">🔫 WEAPON SYSTEM</div>
<div class="weapon-selector" id="weapon-list"></div>
</div>
<div class="btn-row">
<button id="modal-submit" class="btn btn-save">DEPLOY</button>
<button id="modal-close" class="btn">ABORT</button>
</div>
</div>
</div>

<nav class="bottom-nav">
<a href="#" class="nav-item active">DASHBOARD</a>
<a href="intel.html" class="nav-item">INTEL</a>
<a href="profile.html" class="nav-item">PROFILE</a>
</nav>

<script type="importmap">
{
"imports": {
"firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
"firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
}
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, getDoc, onSnapshot, orderBy, limit } from "firebase/firestore";

const firebaseConfig = { 
apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
authDomain: "my-admin-portal-12691.firebaseapp.com", 
projectId: "my-admin-portal-12691", 
storageBucket: "my-admin-portal-12691.firebasestorage.app", 
messagingSenderId: "317015091563", 
appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const input = document.getElementById('mission-input');
const actionBtn = document.getElementById('action-btn');
const reserveBtn = document.getElementById('reserve-btn');
const statusLabel = document.getElementById('mission-status');
const terminal = document.getElementById('terminal');
const modalOverlay = document.getElementById('modal-overlay');
const modalSubmit = document.getElementById('modal-submit');
const modalClose = document.getElementById('modal-close');
const vAgentInput = document.getElementById('v-agent-input');
const secureField = document.getElementById('secure-input-field');
const secureBtn = document.getElementById('add-secure-line');
const weaponList = document.getElementById('weapon-list');
const clockSpan = document.getElementById('clock');
const profName = document.getElementById('prof-name');
const avatarInit = document.getElementById('avatar-init');
const popHeader = document.getElementById('pop-header');

const currentAgent = localStorage.getItem("cia_agent") || localStorage.getItem("agent") || "UNKNOWN_AGENT";
let selectedWeaponID = "";
let agentWeapons = [];
let currentMissionData = null;
let searchTimeout = null;

console.log("Dashboard ready:", currentAgent);

const padID = (val) => val.replace(/\D/g, '').padStart(5, '0').slice(-5);
const formatDate = (d) => `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}/${d.getFullYear()}`;
const getRelieveDate = (d) => { let r = new Date(d); r.setDate(r.getDate() + 30); return formatDate(r); };

function addLog(msg, color) {
addDoc(collection(db, "terminal_logs"), { agent: currentAgent, message: msg, color: color, timestamp: serverTimestamp() });
}

function hideAllButtons() {
actionBtn.style.display = 'none';
reserveBtn.style.display = 'none';
}

function showSaveButton() {
actionBtn.style.display = 'block';
actionBtn.textContent = "SAVE";
actionBtn.className = "btn btn-save";
actionBtn.onclick = () => openDeployModal(padID(input.value.trim()));
}

function showReserveButton() {
reserveBtn.style.display = 'block';
reserveBtn.className = "btn btn-reserve";
reserveBtn.onclick = () => openReserveConfirm(padID(input.value.trim()));
}

function showRetrieveButton() {
actionBtn.style.display = 'block';
actionBtn.textContent = "RETRIEVE";
actionBtn.className = "btn btn-retrieve";
actionBtn.onclick = () => openRetrieveModal(currentMissionData.missionID, currentMissionData);
}

function showViewButton() {
actionBtn.style.display = 'block';
actionBtn.textContent = "VIEW";
actionBtn.className = "btn btn-view";
actionBtn.onclick = () => openViewModal(currentMissionData.missionID, currentMissionData);
}

async function searchMission(missionID) {
statusLabel.innerHTML = '<span style="color:#00f3ff;">SCANNING...</span>';
hideAllButtons();
try {
const docRef = doc(db, "mission_orders", missionID);
const snap = await getDoc(docRef);
if (snap.exists()) {
currentMissionData = snap.data();
const { status, agent } = currentMissionData;
if (status === "TERMINATED") {
statusLabel.innerHTML = '<span style="color:#ff003c;text-shadow:0 0 8px #ff003c;">STATUS: TERMINATED</span>';
showViewButton();
} else if (agent === currentAgent) {
const isReserved = status === "RESERVED";
statusLabel.innerHTML = `<span style="color:${isReserved ? '#ffbd00' : '#007bff'};text-shadow:0 0 8px ${isReserved ? '#ffbd00' : '#007bff'};">STATUS: ${status} (YOURS)</span>`;
showRetrieveButton();
} else {
statusLabel.innerHTML = `<span style="color:#ff003c;">OWNED BY: ${agent}</span>`;
addLog(`ACCESS DENIED: Mission ${missionID} owned by ${agent}`, "#ff003c");
}
} else {
currentMissionData = null;
statusLabel.innerHTML = '<span style="color:#05ffa1;text-shadow:0 0 8px #05ffa1;">STATUS: AVAILABLE</span>';
showSaveButton();
showReserveButton();
}
} catch(e) {
console.error(e);
statusLabel.innerHTML = '<span style="color:#ff003c;">CONNECTION ERROR</span>';
}
}

async function openDeployModal(missionID) {
setupModal(missionID, "DEPLOY", "btn-save", false);
modalSubmit.onclick = () => submitToFirebase(missionID, "DEPLOYED", false);
}

async function openRetrieveModal(missionID, data) {
setupModal(missionID, "UPDATE", "btn-retrieve", false);
vAgentInput.value = data.vAgentID || "";
if (data.SecureLine && data.SecureLine !== "NONE" && data.SecureLine !== "") {
toggleSecureField(true, data.SecureLine);
}
await loadWeapons();
renderWeapons(data.weaponSystem, false);
modalSubmit.onclick = () => submitToFirebase(missionID, data.status, true);
}

function openViewModal(missionID, data) {
setupModal(missionID, "CLOSE", "btn-view", true);
vAgentInput.value = data.vAgentID || "";
if (data.SecureLine && data.SecureLine !== "NONE" && data.SecureLine !== "") {
toggleSecureField(true, data.SecureLine);
}
loadWeapons().then(() => renderWeapons(data.weaponSystem, true));
modalSubmit.onclick = () => { modalOverlay.style.display = 'none'; resetModalFields(); };
modalSubmit.classList.add('hidden');
}

function setupModal(missionID, buttonText, buttonClass, readOnly = false) {
popHeader.innerHTML = `${missionID}<div style="color:#5c7882;font-size:10px;margin-top:5px;">###</div>`;
vAgentInput.value = "";
vAgentInput.disabled = readOnly;
selectedWeaponID = "";
toggleSecureField(false);
secureField.disabled = readOnly;
modalOverlay.style.display = 'flex';
modalSubmit.textContent = buttonText;
modalSubmit.className = `btn ${buttonClass}`;
modalSubmit.classList.remove('hidden');
modalClose.onclick = () => { modalOverlay.style.display = 'none'; resetModalFields(); };
if (!readOnly) {
loadWeapons().then(() => renderWeapons(null, false));
}
}

function resetModalFields() {
vAgentInput.disabled = false;
secureField.disabled = false;
secureField.classList.remove('show');
secureBtn.style.display = 'block';
}

async function submitToFirebase(missionID, status, isUpdate = false) {
const vID = vAgentInput.value.trim();
if (!vID) { alert("REQUIRED: vAGENT ID"); return; }
if (!selectedWeaponID) { alert("REQUIRED: WEAPON SYSTEM"); return; }
const now = new Date();
const payload = {
vAgentID: vID,
weaponSystem: selectedWeaponID,
SecureLine: secureField.value.trim() || "NONE",
status: status,
agent: currentAgent,
missionID: missionID,
timestamp: serverTimestamp()
};
if (!isUpdate) {
payload.deploymentDate = formatDate(now);
payload.relieveDate = getRelieveDate(now);
}
try {
await setDoc(doc(db, "mission_orders", missionID), payload, { merge: true });
addLog(`MISSION ${missionID} ${isUpdate ? 'UPDATED' : 'DEPLOYED'} by ${currentAgent}`, isUpdate ? "#007bff" : "#05ffa1");
modalOverlay.style.display = 'none';
resetApp();
alert(`MISSION ${missionID} ${isUpdate ? 'UPDATED' : 'DEPLOYED'} SUCCESSFULLY!`);
} catch(e) {
console.error(e);
alert("SYSTEM ERROR: " + e.message);
}
}

async function openReserveConfirm(missionID) {
if (confirm(`Do you want to RESERVE mission order #${missionID} to your RESERVE LIST?`)) {
try {
await setDoc(doc(db, "mission_orders", missionID), {
missionID: missionID, agent: currentAgent, status: "RESERVED", timestamp: serverTimestamp()
});
addLog(`MISSION ${missionID} RESERVED by ${currentAgent}`, "#ffbd00");
alert(`Mission ${missionID} has been reserved successfully!`);
resetApp();
} catch(e) {
console.error(e);
alert("RESERVE ERROR: " + e.message);
}
}
}

async function loadWeapons() {
try {
const q = query(collection(db, "agents"), where("agentName", "==", currentAgent));
const snap = await getDocs(q);
agentWeapons = !snap.empty ? (snap.docs[0].data().weaponSystem || []) : ["REDMI NOTE 14 PRO", "REALME 8 PRO", "TECHNO CAMON 40 PRO 5G", "REDMI NOTE 12"];
if (agentWeapons.length === 0) {
agentWeapons = ["REDMI NOTE 14 PRO", "REALME 8 PRO", "TECHNO CAMON 40 PRO 5G", "REDMI NOTE 12"];
}
} catch(e) {
console.error(e);
agentWeapons = ["REDMI NOTE 14 PRO", "REALME 8 PRO", "TECHNO CAMON 40 PRO 5G", "REDMI NOTE 12"];
}
}

function renderWeapons(highlightWeapon = null, disabled = false) {
weaponList.innerHTML = "";
agentWeapons.forEach(weaponName => {
const btn = document.createElement('button');
btn.className = `weapon-btn ${weaponName === highlightWeapon ? 'selected' : ''}`;
if (weaponName === highlightWeapon) { selectedWeaponID = weaponName; }
btn.innerText = `> ${weaponName}`;
if (disabled) {
btn.style.pointerEvents = "none";
btn.style.opacity = "0.6";
} else {
btn.onclick = () => {
document.querySelectorAll('.weapon-btn').forEach(x => x.classList.remove('selected'));
btn.classList.add('selected');
selectedWeaponID = weaponName;
};
}
weaponList.appendChild(btn);
});
}

function toggleSecureField(show, value = "") {
if (show) {
secureField.classList.add('show');
secureBtn.style.display = 'none';
secureField.value = value;
} else {
secureField.classList.remove('show');
secureBtn.style.display = 'block';
secureField.value = "";
}
}

function resetApp() {
input.value = "";
statusLabel.innerHTML = "";
hideAllButtons();
currentMissionData = null;
}

function onMissionInput() {
const val = input.value.trim();
if (searchTimeout) clearTimeout(searchTimeout);
if (val.length === 0) { resetApp(); return; }
if (val.length < 4) { statusLabel.innerHTML = '<span style="color:#ffbd00;">ENTER 4-5 DIGITS</span>'; hideAllButtons(); return; }
const missionID = padID(val);
searchTimeout = setTimeout(() => { searchMission(missionID); }, 500);
}

function setupTerminalListener() {
const q = query(collection(db, "terminal_logs"), orderBy("timestamp", "desc"), limit(10));
onSnapshot(q, (snap) => {
terminal.innerHTML = "";
snap.forEach(doc => {
const data = doc.data();
const time = data.timestamp ? data.timestamp.toDate().toLocaleTimeString('en-GB') : "--:--";
let color = data.color;
if (data.message.includes("DEPLOYED")) color = "#05ffa1";
if (data.message.includes("UPDATED")) color = "#007bff";
if (data.message.includes("RESERVED")) color = "#ffbd00";
if (data.message.includes("DENIED")) color = "#ff003c";
terminal.innerHTML += `<div class="term-line"><span style="color:#5c7882">[${time}]</span> <span style="color:${color}">${data.message}</span></div>`;
});
}, (error) => { console.error("Terminal error:", error); });
}

async function init() {
profName.innerText = currentAgent.toUpperCase();
avatarInit.innerText = currentAgent.charAt(0).toUpperCase();
setInterval(() => { clockSpan.textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
setupTerminalListener();
await loadWeapons();
input.addEventListener('input', onMissionInput);
secureBtn.onclick = () => toggleSecureField(true);
hideAllButtons();
console.log("Dashboard ready");
}

init();
</script>

</body>
</html>
