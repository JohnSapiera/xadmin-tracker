<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CIA_PROFILES // TOP_SECRET</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px">AUTHENTICATING...</h2>
      <p style="font-size: 9px; opacity: 0.5">MEMOIRS_PROTOCOL_ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>
    <div id="deviceMemoirsContainer" style="margin-top: 10px;"></div>
    <button id="btnBack" onclick="location.reload()">[ EXIT_DEVICE_SYSTEM ]</button>
    <div id="memoirsBtnContainer">
      <button onclick="openMemoirs('ALL')">[ VIEW_MASTER_MEMOIRS ]</button>
    </div>
  </div>

  <!-- NOIR MODAL -->
  <div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
      <button class="close-btn" onclick="closeNoir()">X</button>
      <h3>vAGENT_DOSSIER</h3>
      <p><b>MO#:</b> <span id="n-order">---</span></p>
      <p><b>vAgent#:</b> <span id="n-vagent">---</span></p>
      <div id="n-content"></div>
      <div style="text-align: right;"><b>Total:</b> <span id="n-total">₱0.00</span></div>
    </div>
  </div>

  <!-- MEMOIRS MODAL -->
  <div id="memoirsOverlay" class="overlay">
    <div class="book" id="dossierBook">
      <div id="p1" class="page page-front">
        <button class="close-btn" onclick="closeMemoirs()">X</button>
        <h3>AUDIT REPORT</h3>
        <p>NODE: <span id="target-name">---</span></p>
        <div id="active-list" class="audit-list"></div>
        <div id="total-container" style="margin-top: auto; text-align: center; padding-top: 10px;">
          <span id="total-val"></span>
        </div>
        <div id="flipNextBtn" class="swipe-hint" onclick="flipPage(true)">[ VIEW SUMMARY ] &gt;&gt;</div>
      </div>
      <div id="p2" class="page page-back">
        <button class="close-btn" onclick="closeMemoirs()">X</button>
        <h3>SUMMARY CONTINUATION</h3>
        <div id="weapon-system-breakdown" class="audit-list"></div>
        <div style="margin-top: auto; text-align: center;"><b>GRAND TOTAL:</b> ₱<span id="total-val-p2">0.00</span></div>
        <div class="swipe-hint" onclick="flipPage(false)">&lt;&lt; BACK</div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">DASHBOARD</a>
    <a href="intel.html" class="nav-item">INTEL</a>
    <a href="profile.html" class="nav-item active">PROFILE</a>
  </nav>
  
  <script type="module" src="js/script.js"></script>
</body>
</html>
