<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUREAU_SYSTEM_AUTH</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #01080b;
            --cyan: #00f3ff;
            --red: #ff003c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background: var(--bg); 
            color: var(--cyan); 
            font-family: 'Share Tech Mono', monospace;
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
        }

        .auth-container {
            text-align: center;
            padding: 40px;
            border: 1px solid rgba(0, 243, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            position: relative;
            width: 80%;
            max-width: 300px;
        }

        .status-label {
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .terminal-text {
            font-size: 14px;
            margin-bottom: 25px;
            height: 20px;
        }

        /* Scanning Animation */
        .scan-line {
            width: 100%;
            height: 1px;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
            position: absolute;
            left: 0;
            animation: moveScan 2s infinite ease-in-out;
        }

        @keyframes moveScan {
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        #error-notice {
            display: none;
            color: var(--red);
            font-size: 11px;
            margin-top: 20px;
            border-top: 1px dashed var(--red);
            padding-top: 15px;
        }

        .hidden-id {
            font-size: 8px;
            color: #1a262b;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="scan-line"></div>
        <div class="status-label">Bureau_Security_Audit</div>
        <div class="terminal-text" id="status-display">INITIALIZING_SCAN...</div>
        
        <div id="error-notice">
            ACCESS_DENIED<br>
            UNAUTHORIZED_HARDWARE_DETECTED<br>
            TERMINATING_CONNECTION...
        </div>

        <div class="hidden-id" id="sig-debug"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
        authDomain: "my-admin-portal-12691.firebaseapp.com",
        projectId: "my-admin-portal-12691",
        storageBucket: "my-admin-portal-12691.firebasestorage.app",
        messagingSenderId: "317015091563",
        appId: "1:317015091563:web:baab5171d8e0a58acd442e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function performAudit() {
        const status = document.getElementById('status-display');
        const errorNotice = document.getElementById('error-notice');
        const debug = document.getElementById('sig-debug');

        // Generate Hardware Fingerprint
        const signature = (navigator.userAgent + screen.width + navigator.platform).replace(/\s/g, '');
        
        // I-save sa console/hidden div para ma-copy mo if needed sa Firebase
        console.log("Device Signature:", signature);
        debug.innerText = "SIG_ID: " + signature.substring(0, 15) + "...";

        try {
            status.innerText = "SCANNING_NODE...";
            const querySnapshot = await getDocs(collection(db, "agents"));
            let isVerified = false;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                
                // I-check ang lastFingerprint o linkedDevice array
                const hwMatch = data.lastFingerprint === signature;
                const secretMatch = data.linkedDevice && data.linkedDevice.includes(localStorage.getItem("agency_node_secret"));

                if (hwMatch || secretMatch) {
                    isVerified = true;
                    // I-store ang verified agent name para magamit sa intel.html
                    localStorage.setItem("cia_agent", data.agentName);
                    
                    // Auto-heal secret key if missing
                    if(!localStorage.getItem("agency_node_secret") && data.linkedDevice) {
                        localStorage.setItem("agency_node_secret", data.linkedDevice[0]);
                    }
                }
            });

            if (isVerified) {
                status.innerText = "ACCESS_GRANTED";
                status.style.color = "#00ff66";
                setTimeout(() => {
                    window.location.href = "intel.html";
                }, 1500);
            } else {
                status.innerText = "AUTH_FAILED";
                errorNotice.style.display = "block";
            }

        } catch (e) {
            status.innerText = "UPLINK_ERROR";
            console.error(e);
        }
    }

    // Run audit immediately
    window.onload = performAudit;
</script>

</body>
</html>
