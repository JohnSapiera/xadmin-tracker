<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL - CLASSIFIED ACCESS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="agency-theme">
    <div class="scanline"></div>
    <header class="top-bar">
        <div class="system-status">SYSTEM: <span class="blink">ENCRYPTED</span></div>
        <div class="agency-title">INTEL-HUB // OPERATIONS</div>
        <div class="timestamp" id="clock">00:00:00</div>
    </header>

    <main class="dashboard-grid">
        <section class="panel locked">
            <h2 class="panel-header">BOUNTY_SYSTEM</h2>
            <div class="panel-content">
                <div class="restricted-overlay">
                    <p>ACCESS RESTRICTED: PENDING OPS</p>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-header">BAN_PROTOCOL</h2>
            <div class="panel-content">
                <div class="input-group">
                    <label>BULK ADD: SECRET CODES</label>
                    <textarea id="secretCodes" placeholder="Input codes separated by lines..."></textarea>
                    <button class="btn-action">EXECUTE BAN</button>
                </div>
                <div class="data-feed">
                    <div class="feed-item">[REDACTED] - 192.168.x.x - BANNED</div>
                </div>
            </div>
        </section>

        <section class="panel chat-panel">
            <h2 class="panel-header">SECURE_COMM_LINK</h2>
            <div class="chat-display" id="chatDisplay">
                <div class="msg system">--- CONNECTION ESTABLISHED ---</div>
            </div>
            <div class="chat-input-area">
                <label for="file-upload" class="upload-btn">
                    <span>+</span>
                    <input type="file" id="file-upload" accept="image/*" hidden>
                </label>
                <input type="text" placeholder="Type classified message..." id="chatInput">
                <button id="sendBtn">SEND</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
