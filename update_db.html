<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PORTAL_01: AGENT_REGISTRY</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #050506; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #0a0a0c; border: 2px solid rgba(0, 242, 255, 0.2); padding: 30px; width: 350px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--cyan); padding: 15px; margin: 20px 0; font-family: inherit; box-sizing: border-box; text-transform: uppercase; }
        button { width: 100%; background: var(--cyan); color: #000; border: none; padding: 15px; font-weight: 800; cursor: pointer; }
        #status { font-size: 10px; margin-top: 15px; color: #666; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="card">
        <h2 style="font-size:14px; color:var(--cyan);">AGENT_REGISTRATION</h2>
        <input type="text" id="agentName" placeholder="ENTER CODENAME">
        <button onclick="register()">EXECUTE_REGISTRATION</button>
        <div id="status">> STANDBY...</div>
    </div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function register() {
            const name = document.getElementById('agentName').value.trim().toUpperCase();
            if(!name) return;
            document.getElementById('status').innerText = ">> COMMUNICATING...";
            try {
                await db.collection("agents").doc(name).set({ agentName: name, status: "ACTIVE", timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                document.getElementById('status').innerText = ">> SUCCESS: REGISTERED";
                document.getElementById('agentName').value = "";
            } catch(e) { document.getElementById('status').innerText = ">> ERROR: " + e.code; }
        }
    </script>
</body>
</html>
