<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#02080a">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --cia-border: rgba(0, 243, 255, 0.15);
            --font-digital: 'Share Tech Mono', monospace;
            --font-header: 'Rajdhani', sans-serif;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden; 
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }
        header { border-left: 4px solid var(--cia-cyan); padding-left: 15px; margin-bottom: 30px; }
        .section-title { font-family: var(--font-header); letter-spacing: 4px; color: var(--cia-cyan); text-transform: uppercase; }

        /* DEVICE GRID */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.3s; }
        
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8); overflow: hidden;
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s ease, box-shadow 0.8s ease; 
            filter: grayscale(1) brightness(0.4); 
        }

        .phone-screen {
            position: absolute; inset: 5px; background: #000; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.05); padding: 10px;
        }
        
        .phone-wrapper:hover .phone-body { filter: grayscale(0.5) brightness(0.8); transform: translateY(-5px); }
        
        .phone-wrapper.lights-on .phone-body { 
            filter: grayscale(0) brightness(1.5) contrast(1.1); 
            border-color: var(--cia-cyan); 
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.5), inset 0 0 15px rgba(0, 243, 255, 0.2); 
            transform: scale(1.08) translateY(-10px); 
        }

        .activate-text { color: var(--cia-cyan); font-size: 9px; margin-top: 10px; letter-spacing: 1px; opacity: 0.6; transition: 0.3s; }
        .phone-wrapper.lights-on .activate-text { opacity: 1; animation: blinker 0.5s linear infinite; font-weight: bold; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* VAGENT GRID */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .file-icon-box { display: flex; flex-direction: column; align-items: center; padding: 10px; cursor: pointer; transition: 0.2s;}
        .file-icon-box:hover { transform: scale(1.1); }
        .file-icon { width: 40px; height: 30px; background: var(--cia-cyan); border-radius: 2px; position: relative; margin-bottom: 8px; opacity: 0.8; }
        .file-icon::after { content: ""; position: absolute; top: -4px; left: 0; width: 15px; height: 4px; background: var(--cia-cyan); border-radius: 2px 2px 0 0; }
        .file-label { font-size: 10px; color: #fff; text-align: center; }

        /* NOIR OVERLAY */
        .overlay { display: none; position: fixed; inset: 0; z-index: 2000; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); }
        .paper-sheet { width: 90%; max-width: 400px; background: #e8e2d2; color: #1a1a1a; padding: 25px; font-family: var(--font-noir); position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.8); max-height: 85vh; overflow-y: auto; border: 1px solid #c5b8a0; }
        .confidential-seal { position: absolute; top: 30px; right: 10px; border: 3px solid #8b0000; color: #8b0000; padding: 5px 10px; font-weight: 900; transform: rotate(15deg); opacity: 0.5; font-size: 18px; pointer-events: none; }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.2); padding: 5px 0; font-size: 12px; }
        .btn-terminate { background: var(--cia-red); color: #fff; font-family: var(--font-digital); font-weight: bold; font-size: 14px; width: 100%; border: none; padding: 12px; margin-top: 20px; cursor: pointer; transition: 0.3s; letter-spacing: 2px; }

        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--cia-border); z-index: 1000; }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #444; text-decoration: none; font-size: 11px; font-weight: bold; }
        .nav-link.active { color: var(--cia-cyan); border-top: 2px solid var(--cia-cyan); background: rgba(0, 243, 255, 0.05); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 class="section-title" id="display-agent">AGENT_UNDEFINED</h2>
        <p style="font-size: 9px; opacity: 0.5; color: var(--cia-cyan);">NODE_RECOVERY // STATUS: ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid">
        <div style="grid-column: span 2; text-align: center; font-size: 12px; color: var(--cia-cyan);" id="loading-text">SCANNING MISSION_ORDERS...</div>
    </div>
    
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:12px; width:100%; margin-top:20px; font-family:var(--font-digital); cursor:pointer;">
        [ << SECURE_LOGOUT_DEVICE ]
    </button>

    <div style="margin-top: 40px; text-align: center;">
        <button class="btn-memoir" onclick="openMasterLedger()" style="background:transparent; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 25px; font-family:var(--font-digital); font-size:13px; font-weight:bold; cursor:pointer; transition:0.3s; letter-spacing:2px;">[ VIEW_MEMOIRS ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="paper-sheet">
        <div onclick="closeNoir()" style="position:absolute; top:10px; right:15px; cursor:pointer; font-weight:bold; color:#8b0000; font-size: 16px;">[ X ]</div>
        <div class="confidential-seal">CONFIDENTIAL</div>
        <h3 style="text-align: center; font-size: 22px; letter-spacing: 2px; margin-bottom: 5px;">TOP SECRET</h3>
        <p style="text-align: center; font-size: 10px; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px;">CENTRAL INTELLIGENCE ARCHIVE</p>
        <div style="font-size: 12px; line-height: 1.6;">
            <p><b>MISSION_ORDER#:</b> <span id="n-order">---</span></p>
            <p><b>AGENT:</b> <span id="n-agent">---</span></p>
            <p><b>WEAPON SYSTEM:</b> <span id="n-weapon">---</span></p>
            <p><b>vAGENT_ID:</b> <span id="n-vagent" style="font-size: 14px; font-weight: bold; background: rgba(0,0,0,0.1); padding: 2px 5px;">---</span></p>
        </div>
        <div id="expense-history" style="margin-top: 20px;">
            <p style="font-weight: bold; font-size: 13px; border-bottom: 1px solid #000; margin-bottom: 10px;">EXPENDITURE LOGS:</p>
            <div id="history-list" style="max-height: 150px; overflow-y: auto;"></div>
            <div style="margin-top: 15px; text-align: right; font-weight: bold; font-size: 18px; border-top: 2px solid #000; padding-top: 5px;">
                TOTAL: <span id="n-total">₱ 0.00</span>
            </div>
        </div>
        <button class="btn-terminate" id="terminate-btn" onclick="terminateAgent()">[ TERMINATE ]</button>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="paper-sheet" style="max-width: 450px;">
        <div onclick="document.getElementById('memoirsOverlay').style.display='none'" style="position:absolute; top:10px; right:15px; cursor:pointer; font-weight:bold; color:#8b0000; font-size: 16px;">[ X ]</div>
        <h3 style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 15px;">AGENT MEMOIRS</h3>
        <div id="memoirs-list" style="font-size: 13px;"></div>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="intel.html" class="nav-link">INTEL</a>
    <a href="#" class="nav-link active">PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fullWeaponMap = { 
        "SIG-20452634": "REDMI NOTE 14 PRO", 
        "SIG-5B0D3A5C": "REALME 8 PRO", 
        "SIG-121B8F43": "Techno Camon 40 PRO 5G" 
    };

    const currentAgent = localStorage.getItem("cia_agent") || "AGENT_LZ";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {};
    let allMissionsData = [];
    let activeDocID = null;

    window.onload = async () => {
        try {
            const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
            const snap = await getDocs(q);
            
            if(snap.empty) {
                document.getElementById('loading-text').innerText = "NO MISSION RECORDS FOUND.";
                return;
            }

            allMissionsData = [];
            deviceData = {};

            snap.forEach(d => {
                const data = d.data();
                allMissionsData.push({...data, id: d.id});

                if (data.vAgentID && data.vAgentID.toString().trim() !== "") {
                    const weaponID = data.weaponSystem || "UNKNOWN_DEVICE";
                    const weaponName = fullWeaponMap[weaponID] || weaponID;
                    
                    if(!deviceData[weaponName]) deviceData[weaponName] = [];
                    deviceData[weaponName].push({ ...data, id: d.id });
                }
            });

            if (Object.keys(deviceData).length === 0) {
                document.getElementById('loading-text').innerText = "DEVICES FOUND BUT NO ACTIVE vAGENTS.";
            } else {
                renderDevices();
            }
        } catch (e) {
            document.getElementById('loading-text').innerText = "DATABASE OFFLINE.";
        }
    };

    function renderDevices() {
        const grid = document.getElementById('deviceSection');
        grid.innerHTML = "";
        document.getElementById('loading-text').style.display = "none";

        Object.keys(deviceData).forEach(name => {
            const wrapper = document.createElement('div');
            wrapper.className = "phone-wrapper";
            wrapper.onclick = function() { window.activateDevice(name, this); };

            wrapper.innerHTML = `
                <div class="phone-body">
                    <div class="phone-screen">
                        <div style="font-size:10px; color:var(--cia-cyan); font-weight:bold; text-align:center; padding:5px; text-transform:uppercase;">${name}</div>
                        <div style="font-size:8px; opacity:0.4; margin-top:5px;">${deviceData[name].length} vAGENT(S)</div>
                    </div>
                </div>
                <div class="activate-text">[ CONNECT ]</div>
            `;
            grid.appendChild(wrapper);
        });
    }

    window.activateDevice = (name, element) => {
        document.querySelectorAll('.phone-wrapper').forEach(el => {
            if(el !== element) el.style.opacity = "0.2";
            el.style.pointerEvents = 'none';
        });
        element.classList.add('lights-on');
        element.querySelector('.activate-text').innerText = "UPLINKING...";
        setTimeout(() => showvAgents(name), 1500);
    };

    window.showvAgents = (name) => {
        document.getElementById('deviceSection').style.display = 'none';
        document.getElementById('vagentSection').style.display = 'grid';
        document.getElementById('btnBack').style.display = 'block';
        const grid = document.getElementById('vagentSection');
        
        const sortedAgents = deviceData[name].sort((a, b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));

        grid.innerHTML = sortedAgents.map(v => `
            <div class="file-icon-box" onclick="window.openNoirModal('${v.id}')">
                <div class="file-icon"></div>
                <div class="file-label">#${v.vAgentID}</div>
            </div>
        `).join('') + `<div class="file-icon-box ghost-file"><div class="file-icon"></div><div class="file-label">ENCRYPTED</div></div>`;
    };

    window.openNoirModal = async (docID) => {
        document.getElementById('noirOverlay').style.display = 'flex';
        activeDocID = docID;
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = "DECRYPTING...";
        
        try {
            const docSnap = await getDoc(doc(db, "mission_orders", docID));
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('n-order').innerText = docID;
                document.getElementById('n-agent').innerText = data.agent;
                document.getElementById('n-weapon').innerText = fullWeaponMap[data.weaponSystem] || data.weaponSystem;
                document.getElementById('n-vagent').innerText = data.vAgentID;
                document.getElementById('n-total').innerText = `₱ ${(data.totalExpenses || 0).toLocaleString()}`;
                
                historyList.innerHTML = data.expensesBreakdown ? data.expensesBreakdown.map(ex => `
                    <div class="expense-row">
                        <span>${new Date(ex.timestamp).toLocaleDateString()}</span>
                        <b>₱ ${ex.amount.toLocaleString()}</b>
                    </div>
                `).join('') : "NO LOGS FOUND.";
            }
        } catch (e) { historyList.innerHTML = "ERROR."; }
    };

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';

    window.terminateAgent = async () => {
        if(!activeDocID || !confirm("TERMINATE THIS vAGENT?")) return;
        const btn = document.getElementById('terminate-btn');
        btn.innerText = "TERMINATING...";
        try {
            await updateDoc(doc(db, "mission_orders", activeDocID), { vAgentID: "" });
            location.reload();
        } catch(e) { alert("ERROR."); btn.innerText = "[ TERMINATE ]"; }
    };

    window.openMasterLedger = () => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        const mList = document.getElementById('memoirs-list');
        const filtered = allMissionsData.filter(m => m.totalExpenses > 0);
        let total = 0;
        mList.innerHTML = filtered.map(m => {
            total += m.totalExpenses;
            return `<div class="expense-row"><span>#${m.vAgentID || 'VACANT'}</span><b>₱ ${m.totalExpenses.toLocaleString()}</b></div>`;
        }).join('') + `<div style="text-align:right; font-weight:bold; margin-top:10px; border-top:2px solid #000;">TOTAL: ₱ ${total.toLocaleString()}</div>`;
    };
</script>
</body>
</html>
