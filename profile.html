<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        /* --- FOLDERS (WITH CIA STAMP) --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .folder-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 15px; z-index: 10; }
        
        .folder-main { 
            width: 50px; height: 35px; background: var(--cia-cyan); border-radius: 0 4px 4px 4px; 
            z-index: 5; clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%); 
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        
        /* IBINALIK KO NA 'YUNG CIA STAMP DITO */
        .folder-main::after {
            content: "CIA"; position: absolute; bottom: 5px; right: 5px;
            font-family: var(--font-noir); font-size: 10px; font-weight: bold; 
            color: rgba(0, 0, 0, 0.6); transform: rotate(-15deg);
            border: 1px solid rgba(0, 0, 0, 0.4); padding: 0 2px;
        }

        .paper-sheet { position: absolute; top: 8px; width: 38px; height: 32px; background: #fff; border: 1px solid #ccc; z-index: 2; transition: 0.3s; }
        .folder-box:hover .paper-sheet { transform: translateY(-10px); }
        .file-label { font-size: 9px; color: #fff; text-align: center; margin-top: 8px; font-weight: bold; }

        /* --- THE BET DESIGN: DOSSIER POPUP --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        
        .dossier-paper { 
            width: 90%; max-width: 360px; max-height: 85vh; background: #e8e2d2; color: #1a1a1a; padding: 40px 25px; 
            font-family: var(--font-noir); border: 1px solid #c5b8a0; position: relative; display: flex; flex-direction: column;
            box-shadow: 15px 15px 50px rgba(0,0,0,0.9);
        }
        
        /* STAMP SA TAAS */
        .dossier-paper::before { 
            content: "TOP SECRET"; position: absolute; top: 15px; left: 20px; font-size: 10px; 
            color: #8b0000; border: 2px solid #8b0000; padding: 2px 6px; font-weight: bold; transform: rotate(-5deg);
        }

        .audit-list { flex-grow: 1; overflow-y: auto; margin: 15px 0; border-top: 2px solid #000; border-bottom: 2px solid #000; padding: 10px 0; }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.3); padding: 8px 0; font-size: 12px; }
        
        .total-stamp { 
            text-align: right; padding: 10px; background: rgba(0,0,0,0.05); border: 2px solid #1a1a1a; 
            margin-top: 10px; transform: rotate(-2deg); box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
        }

        .close-btn { position: absolute; top: 10px; right: 10px; background: #8b0000; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; }
        .phone-body { width: 130px; height: 230px; background: #050a0c; margin: 0 auto; border-radius: 18px; border: 2px solid #1a2a30; position: relative; filter: grayscale(1) brightness(0.3); transition: 0.5s; }
        .phone-wrapper.lights-on .phone-body { filter: grayscale(0) brightness(1); border-color: var(--cia-cyan); box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); }
        .phone-screen { position: absolute; inset: 5px; background: #000; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .phone-wrapper.lights-on .phone-screen { background: #fff; }
        .typing-text { display: none; color: #000; font-size: 11px; font-weight: bold; width: 0; overflow: hidden; white-space: nowrap; border-right: 2px solid #000; }
        .phone-wrapper.lights-on .typing-text { display: block; animation: typing 0.8s steps(15) 0.4s forwards; }
        @keyframes typing { from { width: 0 } to { width: 90% } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px;">AUTHENTICATING...</h2>
        <p style="font-size: 9px; opacity: 0.6;">AGENT_MEMOIRS_V4_FINAL</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:12px; width:100%; margin-top:20px; cursor:pointer;">[ EXIT_NODE ]</button>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <button class="close-btn" onclick="closeNoir()">X</button>
        <h2 style="text-align: center;">FIELD_REPORT</h2>
        <div style="font-size: 11px; margin-top: 10px;">
            <p><b>ASSET_ID:</b> <span id="n-vagent" style="background:#000; color:#fff; padding:0 5px;">---</span></p>
        </div>
        
        <div id="n-content" class="audit-list"></div>

        <div class="total-stamp">
            <p style="font-size: 9px; margin: 0;">CERTIFIED_TOTAL:</p>
            <span id="n-total" style="font-size: 24px; font-weight: 900;">₱ 0.00</span>
        </div>
    </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN";
    document.getElementById('display-agent').innerText = currentAgent;
    let allMissions = [], deviceData = {};

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';

    async function init() {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        snap.forEach(d => {
            const data = {...d.data(), id: d.id};
            allMissions.push(data);
            if (data.vAgentID) {
                const dev = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[dev]) deviceData[dev] = [];
                deviceData[dev].push(data);
            }
        });
        renderDevices();
    }

    function renderDevices() {
        document.getElementById('deviceSection').innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body"><div class="phone-screen"><div class="typing-text">WELCOME<br>${name}</div></div></div>
                <p style="font-size:9px; color:var(--cia-cyan); margin-top:5px;">[ STANDBY ]</p>
            </div>`).join('');
    }

    window.activateDevice = (name, el) => {
        el.classList.add('lights-on'); 
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => `
                <div class="folder-box" onclick="openDossier('${v.id}')">
                    <div class="paper-sheet"></div>
                    <div class="folder-main"></div>
                    <div class="file-label">#${v.vAgentID}</div>
                </div>`).join('');
        }, 1200);
    };

    window.openDossier = (id) => {
        const d = allMissions.find(m => m.id === id);
        if(!d) return;
        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-vagent').innerText = d.vAgentID;
        document.getElementById('n-content').innerHTML = (d.expensesBreakdown || []).map(e => `
            <div class="expense-row"><span>${e.description}</span><b>₱${e.amount.toLocaleString()}</b></div>`).join('');
        document.getElementById('n-total').innerText = `₱ ${d.totalExpenses.toLocaleString()}`;
    };

    init();
</script>
</body>
</html>
