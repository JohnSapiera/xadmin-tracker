<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA - CLASSIFIED TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: 'Fira Code', monospace; overflow: hidden; }
        .scanline { width: 100%; height: 2px; background: rgba(0, 112, 243, 0.05); position: fixed; animation: scan 4s linear infinite; z-index: 100; pointer-events: none; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        
        /* Subtle Success Flash */
        .success-flash { animation: flash-green 0.5s ease-out; }
        @keyframes flash-green { 0% { background-color: rgba(34, 197, 94, 0.2); } 100% { background-color: transparent; } }

        /* Pop-up Semi Page / Modal */
        #archiveModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; backdrop-filter: blur(10px); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-xs border-t-2 border-blue-600">
    <div class="scanline"></div>

    <nav class="bg-black/95 p-3 border-b border-white/10 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="px-2 py-0.5 border border-blue-500 text-blue-500 font-bold text-[8px]">CIA_SECURE_v4</div>
            <h1 class="tracking-[0.2em] uppercase font-bold text-white text-[10px]">Rapid Elimination Unit</h1>
        </div>
        <button onclick="openModal()" class="text-red-500 border border-red-500/30 px-3 py-1 hover:bg-red-500/10 font-bold uppercase text-[9px]">
            [ ACCESS REGISTRY ]
        </button>
    </nav>

    <div class="max-w-4xl mx-auto p-4 space-y-4 h-[calc(100vh-60px)] flex flex-col justify-center">
        
        <section id="inputUnit" class="bg-zinc-900/40 border border-white/5 p-8 rounded shadow-2xl transition-all">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-blue-500 tracking-widest uppercase font-bold text-[9px]">Input Target Code</h2>
                <span id="targetStatus" class="text-[8px] text-gray-600 font-bold">AWAITING INPUT...</span>
            </div>
            
            <input type="number" id="codeInput" oninput="autoScan()" autofocus
                   placeholder="0000" 
                   class="w-full bg-black border border-white/10 p-5 outline-none focus:border-blue-500 text-blue-400 font-bold tracking-[1em] text-4xl text-center">
            
            <div id="statusReport" class="mt-4 min-h-[80px] flex items-center justify-center border border-dashed border-white/10 rounded bg-black/20 p-4">
                <p class="text-gray-700 italic uppercase tracking-widest text-[9px]">Awaiting signal from field operatives...</p>
            </div>
        </section>

        <section class="bg-zinc-900/20 border border-white/5 rounded flex flex-col h-[150px]">
            <div class="bg-white/5 p-1.5 text-[8px] font-bold text-amber-500 uppercase tracking-widest border-b border-white/5 px-4">Live Comms</div>
            <div id="chatFeed" class="flex-1 p-3 overflow-y-auto space-y-1 bg-black/10 text-[9px] text-amber-500/80"></div>
            <div class="p-2 border-t border-white/5 flex gap-1">
                <input type="text" id="chatMsg" placeholder="..." class="flex-1 bg-black border border-white/10 p-1.5 outline-none text-amber-500 uppercase text-[9px]">
                <button onclick="sendMsg()" class="bg-amber-600 px-3 py-1 font-bold text-black text-[9px] uppercase hover:bg-amber-500">SEND</button>
            </div>
        </section>
    </div>

    <div id="archiveModal" class="flex flex-col p-6">
        <div class="max-w-4xl mx-auto w-full flex flex-col h-full">
            <div class="flex justify-between items-center border-b border-red-500/30 pb-4">
                <div>
                    <h1 class="text-red-500 font-black text-xl tracking-[0.2em] uppercase">Classified Registry</h1>
                    <p class="text-gray-600 text-[9px] uppercase tracking-widest mt-1">Authorized personnel only // Data is permanent</p>
                </div>
                <button onclick="closeModal()" class="text-white border border-white/20 px-4 py-2 hover:bg-white/10 font-bold text-[10px] uppercase">
                    [ CLOSE TERMINAL ]
                </button>
            </div>
            
            <div class="flex-1 mt-6 overflow-y-auto">
                <div id="eliminatedList" class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                    </div>
                <div id="emptyMsg" class="text-center text-gray-700 italic uppercase tracking-widest text-[10px] mt-20">
                    Registry database is currently empty.
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rdb = getDatabase(app);

        const codeInput = document.getElementById('codeInput');
        const report = document.getElementById('statusReport');
        const targetStatus = document.getElementById('targetStatus');

        // LOCAL CACHE PARA SA UNIQUE CHECKING
        let existingCodes = new Set();

        // --- RAPID SCANNER ---
        window.autoScan = async () => {
            const code = codeInput.value;

            if (code.length < 4) {
                report.innerHTML = '<p class="text-gray-700 italic uppercase text-[9px]">Scanning signal strength...</p>';
                targetStatus.innerText = "WAITING FOR INPUT";
                return;
            }

            targetStatus.innerText = "INQUIRING DATABASE...";

            // Tingnan muna sa local memory kung andun na para mabilis
            if (existingCodes.has(code)) {
                targetStatus.innerText = "TARGET IDENTIFIED: ELIMINATED";
                report.innerHTML = `
                    <div class="text-center p-3 border border-red-600 bg-red-600/5 w-full">
                        <p class="text-red-600 font-black tracking-widest text-lg uppercase">ALREADY ELIMINATED</p>
                        <p class="text-gray-500 text-[8px] uppercase tracking-tighter italic">This code is already stored permanently in the database.</p>
                    </div>`;
                return;
            }

            // Kung wala sa memory, double check sa Firestore (Just to be safe)
            const q = query(collection(db, "eliminated_codes"), where("code", "==", code));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                targetStatus.innerText = "TARGET IDENTIFIED: UNKNOWN";
                report.innerHTML = `
                    <div class="text-center w-full">
                        <button onclick="initiateElimination('${code}')" class="bg-red-600 w-full py-4 text-white font-black uppercase tracking-widest hover:bg-red-700 transition-all border-b-4 border-red-900 active:border-b-0 active:translate-y-1">
                            ELIMINATE TARGET CODE: ${code}
                        </button>
                    </div>`;
            } else {
                existingCodes.add(code); // Isama na sa memory
                targetStatus.innerText = "TARGET IDENTIFIED: ELIMINATED";
                report.innerHTML = `
                    <div class="text-center p-3 border border-red-600 bg-red-600/5 w-full">
                        <p class="text-red-600 font-black tracking-widest text-lg uppercase">ALREADY ELIMINATED</p>
                    </div>`;
            }
        };

        // --- ELIMINATION ACTION ---
        window.initiateElimination = async (code) => {
            const inputUnit = document.getElementById('inputUnit');
            
            try {
                // Isave sa Firestore
                await addDoc(collection(db, "eliminated_codes"), {
                    code: code,
                    timestamp: serverTimestamp()
                });

                // Dagdag sa local set para hindi na ma-duplicate
                existingCodes.add(code);

                // Quick Visual Feedback
                inputUnit.classList.add('success-flash');
                setTimeout(() => inputUnit.classList.remove('success-flash'), 500);

                // Auto reset
                codeInput.value = "";
                codeInput.focus();
                autoScan();

            } catch (err) {
                alert("Comm-Link Failed. Check your internet or Firebase rules.");
            }
        };

        // --- MODAL CONTROLS ---
        window.openModal = () => document.getElementById('archiveModal').style.display = 'flex';
        window.closeModal = () => document.getElementById('archiveModal').style.display = 'none';

        // --- LIVE DATABASE LISTENER (ARCHIVE) ---
        onSnapshot(collection(db, "eliminated_codes"), (snap) => {
            const list = document.getElementById('eliminatedList');
            const emptyMsg = document.getElementById('emptyMsg');
            
            list.innerHTML = "";
            existingCodes.clear(); // Refresh local memory

            let hasData = false;
            
            // Inaayos natin ang listahan para bago sa taas (Client-side sorting)
            const docs = [];
            snap.forEach(doc => docs.push(doc.data()));
            docs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

            docs.forEach(data => {
                hasData = true;
                existingCodes.add(data.code); // I-cache ang mga codes

                const item = document.createElement('div');
                item.className = "bg-red-500/5 border border-red-500/20 p-3 font-bold text-red-500 tracking-[0.2em] text-sm hover:bg-red-500/10 transition-colors";
                item.innerText = data.code;
                list.appendChild(item);
            });

            if (hasData) {
                emptyMsg.style.display = 'none';
            } else {
                emptyMsg.style.display = 'block';
            }
        });

        // --- COMMS ---
        window.sendMsg = () => {
            const input = document.getElementById('chatMsg');
            if (input.value.trim()) {
                push(ref(rdb, 'secure_comms'), { text: input.value.toUpperCase(), time: Date.now() });
                input.value = "";
            }
        };

        onChildAdded(ref(rdb, 'secure_comms'), (snap) => {
            const data = snap.val();
            const div = document.createElement('div');
            div.className = "mb-1 border-l border-amber-800 pl-2";
            div.innerHTML = `<span class="opacity-50 text-[6px] block">${new Date(data.time).toLocaleTimeString()}</span><span class="tracking-widest uppercase">${data.text}</span>`;
            document.getElementById('chatFeed').appendChild(div);
            document.getElementById('chatFeed').scrollTop = document.getElementById('chatFeed').scrollHeight;
        });
    </script>
</body>
</html>
