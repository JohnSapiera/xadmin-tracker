<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AGENT_ACCESS_TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
            padding: 16px;
        }

        .terminal {
            width: 100%;
            max-width: 380px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 20px 16px;
            position: relative;
            backdrop-filter: blur(4px);
            border-radius: 4px;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
            animation: scanMove 2.5s ease-in-out infinite;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .badge {
            font-size: 9px;
            letter-spacing: 3px;
            color: #4a5a61;
            margin-bottom: 6px;
        }
        .status-text {
            font-size: 12px;
            font-weight: bold;
            color: #00f2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .trace-container {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 8px 10px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 4px;
        }
        .trace-label {
            font-size: 8px;
            color: #5c7882;
            letter-spacing: 1px;
        }
        .trace-value {
            font-size: 9px;
            color: #05ffa1;
            word-break: break-all;
            margin-top: 4px;
            font-family: monospace;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0 16px;
        }
        .key-btn {
            aspect-ratio: 1 / 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #00f2ff;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            border-radius: 50%;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .key-btn:active {
            transform: scale(0.92);
            background: #00f2ff;
            color: #000;
            border-color: #00f2ff;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.4);
        }
        .key-zero {
            grid-column: 2 / 3;
        }

        .hidden {
            display: none;
        }

        .code-area {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 10px;
            text-align: center;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .code-digits {
            font-size: 26px;
            letter-spacing: 6px;
            color: #05ffa1;
            font-family: monospace;
            font-weight: bold;
        }
        .helper-text {
            font-size: 8px;
            color: #5c7882;
            margin-top: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid #1a2f37;
            padding: 10px;
            color: #5c7882;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            border-radius: 4px;
        }
        .btn-danger {
            border-color: #ff003c;
            color: #ff003c;
        }

        .message-area {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            min-height: 40px;
            padding: 6px;
        }
        .error-msg {
            color: #ff003c;
            border-top: 1px solid rgba(255,0,60,0.2);
            padding-top: 6px;
        }
        .success-msg {
            color: #00ff66;
        }

        .loader {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 1px solid #00f2ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="terminal" id="app">
    <div class="scan-line" id="scanLine"></div>
    
    <div class="header">
        <div class="badge">AGENT_ACCESS_TERMINAL</div>
        <div class="status-text" id="statusLabel">INITIALIZING_SCAN</div>
    </div>

    <div class="trace-container">
        <div class="trace-label">DEVICE_FINGERPRINT</div>
        <div class="trace-value" id="deviceSig">-- SCANNING --</div>
    </div>

    <div id="keypadSection" class="hidden">
        <div class="code-area">
            <div class="code-digits" id="codeDisplay">----</div>
            <div class="helper-text">ENTER 4-DIGIT SECRET KEY</div>
        </div>
        
        <div class="keypad" id="numericKeypad"></div>
        
        <div class="action-buttons">
            <div class="btn btn-danger" id="clearBtn">CLEAR</div>
            <div class="btn" id="cancelBtn">CANCEL</div>
        </div>
    </div>

    <div class="message-area" id="messageArea"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    // ========== SOUND MANAGER ==========
    const SoundFX = {
        beep(frequency = 800, duration = 0.1, volume = 0.2) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = frequency;
                gainNode.gain.value = volume;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                oscillator.stop(audioCtx.currentTime + duration);
                setTimeout(() => audioCtx.close(), duration * 1000);
            } catch(e) { console.log("Audio error:", e); }
        },
        
        scanBeep() {
            this.beep(1200, 0.08, 0.15);
        },
        
        keypadTone(digit) {
            const freqs = { '1':697, '2':697, '3':697, '4':770, '5':770, '6':770, '7':852, '8':852, '9':852, '0':941 };
            this.beep(freqs[digit] || 800, 0.06, 0.12);
        },
        
        click() {
            this.beep(600, 0.04, 0.1);
        },
        
        success() {
            this.beep(880, 0.12, 0.2);
            setTimeout(() => this.beep(1100, 0.12, 0.2), 120);
        },
        
        error() {
            this.beep(400, 0.3, 0.25);
        },
        
        register() {
            this.beep(660, 0.1, 0.2);
            setTimeout(() => this.beep(880, 0.1, 0.2), 100);
            setTimeout(() => this.beep(1320, 0.2, 0.2), 200);
        }
    };

    // Firebase Configuration
    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const statusLabel = document.getElementById('statusLabel');
    const deviceSigSpan = document.getElementById('deviceSig');
    const keypadSection = document.getElementById('keypadSection');
    const codeDisplay = document.getElementById('codeDisplay');
    const messageArea = document.getElementById('messageArea');

    let currentSignature = "";
    let enteredCode = "";
    let isProcessing = false;

    function showMessage(text, isError = false) {
        messageArea.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`;
        setTimeout(() => {
            if (messageArea.innerHTML === `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`) {
                messageArea.innerHTML = "";
            }
        }, 3000);
    }

    function clearCode() {
        SoundFX.click();
        enteredCode = "";
        codeDisplay.innerText = "----";
    }

    function addDigit(digit) {
        if (enteredCode.length < 4) {
            SoundFX.keypadTone(digit);
            enteredCode += digit;
            let displayStr = enteredCode + "----".substring(enteredCode.length);
            codeDisplay.innerText = displayStr;
            
            const buttons = document.querySelectorAll('.key-btn');
            buttons.forEach(btn => {
                if (btn.innerText === digit) {
                    btn.style.transform = 'scale(0.92)';
                    btn.style.background = '#00f2ff';
                    btn.style.color = '#000';
                    setTimeout(() => {
                        btn.style.transform = '';
                        btn.style.background = '';
                        btn.style.color = '';
                    }, 150);
                }
            });

            if (enteredCode.length === 4) {
                setTimeout(() => verifySecretKey(enteredCode), 50);
            }
        }
    }

    function generateSignature() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
        
        const specs = {
            brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || "NODE_STATION",
            gpu: gpu.split('/').pop().trim(),
            res: `${window.screen.width}x${window.screen.height}`,
            plt: navigator.platform
        };

        const raw = specs.gpu + specs.res + specs.plt + specs.brand;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "SIG-" + Math.abs(hash).toString(16).toUpperCase();
    }

    async function registerFingerprint(agentName, signature) {
        try {
            // Hanapin ang agent document gamit ang agentName field
            const snapshot = await db.collection("agents")
                .where("agentName", "==", agentName)
                .get();
            
            if (!snapshot.empty) {
                const docRef = snapshot.docs[0].ref;
                await docRef.update({
                    linkedSignatures: firebase.firestore.FieldValue.arrayUnion(signature),
                    lastFingerprint: signature,
                    lastSync: firebase.firestore.FieldValue.serverTimestamp()
                });
                return true;
            }
            return false;
        } catch (error) {
            console.error("Registration error:", error);
            return false;
        }
    }

    // ITO ANG PINAKAIMPORTANTE - VERIFY SECRET KEY
    async function verifySecretKey(secretKey) {
        if (isProcessing) return;
        isProcessing = true;
        
        statusLabel.innerHTML = "VERIFYING_KEY";
        showMessage("Authenticating secret key...");
        SoundFX.scanBeep();
        
        try {
            // Hanapin ang agent gamit ang secretKey field
            const snapshot = await db.collection("agents")
                .where("secretKey", "==", secretKey)
                .get();
            
            if (!snapshot.empty) {
                const agentDoc = snapshot.docs[0];
                const agentData = agentDoc.data();
                const agentName = agentData.agentName;
                const weaponSystem = agentData.weaponSystem || "STANDARD_ISSUE";
                
                showMessage(`Secret key verified. Agent: ${agentName}`);
                statusLabel.innerHTML = "REGISTERING_DEVICE";
                SoundFX.register();
                
                const success = await registerFingerprint(agentName, currentSignature);
                
                if (success) {
                    SoundFX.success();
                    showMessage(`Device registered successfully. Access granted.`);
                    statusLabel.innerHTML = "ACCESS_GRANTED";
                    
                    // STORE SA LOCAL STORAGE - Agent Name at Weapon System
                    localStorage.setItem("cia_agent", agentName);
                    localStorage.setItem("agent", agentName);
                    localStorage.setItem("weapon_system", weaponSystem);
                    localStorage.setItem("secret_key", secretKey);
                    localStorage.setItem("agent_verified", "true");
                    localStorage.setItem("device_signature", currentSignature);
                    
                    console.log("Stored in localStorage:");
                    console.log("- Agent Name:", agentName);
                    console.log("- Weapon System:", weaponSystem);
                    console.log("- Secret Key:", secretKey);
                    
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);
                } else {
                    SoundFX.error();
                    showMessage("Registration failed. Please try again.", true);
                    statusLabel.innerHTML = "REGISTRATION_FAILED";
                    clearCode();
                    isProcessing = false;
                }
            } else {
                SoundFX.error();
                showMessage("Invalid secret key. Access denied.", true);
                statusLabel.innerHTML = "ACCESS_DENIED";
                clearCode();
                isProcessing = false;
            }
        } catch (error) {
            console.error("Verification error:", error);
            SoundFX.error();
            showMessage("Connection error. Please try again.", true);
            statusLabel.innerHTML = "ERROR";
            isProcessing = false;
        }
    }

    async function authenticateDevice(signature) {
        statusLabel.innerHTML = "SCANNING_DATABASE";
        deviceSigSpan.innerText = signature;
        SoundFX.scanBeep();
        
        try {
            const snapshot = await db.collection("agents")
                .where("linkedSignatures", "array-contains", signature)
                .get();
            
            if (!snapshot.empty) {
                const agentData = snapshot.docs[0].data();
                const agentName = agentData.agentName;
                const weaponSystem = agentData.weaponSystem || "STANDARD_ISSUE";
                
                SoundFX.success();
                statusLabel.innerHTML = "ACCESS_GRANTED";
                showMessage(`Welcome back, ${agentName}. Redirecting...`);
                
                localStorage.setItem("cia_agent", agentName);
                localStorage.setItem("agent", agentName);
                localStorage.setItem("weapon_system", weaponSystem);
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("device_signature", signature);
                
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);
            } else {
                SoundFX.error();
                statusLabel.innerHTML = "DEVICE_NOT_REGISTERED";
                showMessage("Device not recognized. Please enter your 4-digit secret key to register.", true);
                keypadSection.classList.remove("hidden");
                document.getElementById('scanLine').style.opacity = "0.2";
            }
        } catch (error) {
            console.error(error);
            SoundFX.error();
            statusLabel.innerHTML = "SCAN_ERROR";
            showMessage("Database connection error. Please try again.", true);
        }
    }

    function buildKeypad() {
        const keypadContainer = document.getElementById('numericKeypad');
        const layout = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        keypadContainer.innerHTML = '';
        
        layout.forEach(digit => {
            const btn = document.createElement('div');
            btn.className = 'key-btn';
            if (digit === '0') btn.classList.add('key-zero');
            btn.innerText = digit;
            btn.onclick = () => addDigit(digit);
            keypadContainer.appendChild(btn);
        });
    }

    document.getElementById('clearBtn').onclick = () => clearCode();
    document.getElementById('cancelBtn').onclick = () => {
        SoundFX.click();
        keypadSection.classList.add("hidden");
        document.getElementById('scanLine').style.opacity = "0.6";
        statusLabel.innerHTML = "SCAN_CANCELLED";
        showMessage("Registration cancelled. Reloading...", true);
        setTimeout(() => location.reload(), 1500);
    };

    function init() {
        buildKeypad();
        currentSignature = generateSignature();
        deviceSigSpan.innerText = currentSignature;
        setTimeout(() => {
            authenticateDevice(currentSignature);
        }, 1000);
    }
    
    init();
</script>
</body>
</html>
