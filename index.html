<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SUPABASE_AGENT_TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
            padding: 16px;
        }

        .terminal {
            width: 100%;
            max-width: 380px;
            background: rgba(2, 10, 13, 0.95);
            border: 1px solid rgba(0, 242, 255, 0.3);
            padding: 20px 16px;
            position: relative;
            backdrop-filter: blur(4px);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,242,255,0.1);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
            animation: scanMove 2.5s ease-in-out infinite;
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { top: 100%; opacity: 0; }
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .badge {
            font-size: 9px;
            letter-spacing: 3px;
            color: #4a5a61;
            margin-bottom: 6px;
        }
        .status-text {
            font-size: 12px;
            font-weight: bold;
            color: #00f2ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 4px rgba(0,242,255,0.4);
        }

        .trace-container {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 8px 10px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 4px;
        }
        .trace-label {
            font-size: 8px;
            color: #5c7882;
            letter-spacing: 1px;
        }
        .trace-value {
            font-size: 9px;
            color: #05ffa1;
            word-break: break-all;
            margin-top: 4px;
            font-family: monospace;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0 16px;
        }
        .key-btn {
            aspect-ratio: 1 / 1;
            background: #000;
            border: 1px solid #1a2f37;
            color: #00f2ff;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            border-radius: 50%;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .key-btn:active {
            transform: scale(0.92);
            background: #00f2ff;
            color: #000;
            border-color: #00f2ff;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.4);
        }
        .key-zero {
            grid-column: 2 / 3;
        }

        .hidden {
            display: none;
        }

        .code-area {
            background: #000;
            border: 1px solid #1a2f37;
            padding: 10px;
            text-align: center;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .code-digits {
            font-size: 28px;
            letter-spacing: 8px;
            color: #05ffa1;
            font-family: monospace;
            font-weight: bold;
            text-shadow: 0 0 3px #00ff66;
        }
        .helper-text {
            font-size: 8px;
            color: #5c7882;
            margin-top: 4px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .btn {
            flex: 1;
            background: transparent;
            border: 1px solid #1a2f37;
            padding: 10px;
            color: #5c7882;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            border-radius: 4px;
        }
        .btn-danger {
            border-color: #ff003c;
            color: #ff003c;
        }
        .btn-danger:active {
            background: #ff003c20;
        }
        .btn:active {
            background: #1a2f3740;
        }

        .message-area {
            margin-top: 16px;
            text-align: center;
            font-size: 10px;
            min-height: 40px;
            padding: 6px;
        }
        .error-msg {
            color: #ff003c;
            border-top: 1px solid rgba(255,0,60,0.2);
            padding-top: 6px;
        }
        .success-msg {
            color: #00ff66;
        }

        .weapons-list {
            margin-top: 10px;
            padding: 8px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 4px;
            font-size: 9px;
        }
        .weapons-list span {
            color: #00f2ff;
        }
        .weapon-item {
            display: inline-block;
            background: #0a1f29;
            padding: 2px 6px;
            margin: 2px;
            border-radius: 3px;
            color: #05ffa1;
        }

        .loader {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 1px solid #00f2ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="terminal" id="app">
    <div class="scan-line" id="scanLine"></div>
    
    <div class="header">
        <div class="badge">SUPABASE_AGENT_NEXUS</div>
        <div class="status-text" id="statusLabel">INITIALIZING_SCAN</div>
    </div>

    <div class="trace-container">
        <div class="trace-label">DEVICE_FINGERPRINT</div>
        <div class="trace-value" id="deviceSig">-- SCANNING --</div>
    </div>

    <div id="keypadSection" class="hidden">
        <div class="code-area">
            <div class="code-digits" id="codeDisplay">----</div>
            <div class="helper-text">ENTER 4-DIGIT SECRET KEY</div>
        </div>
        
        <div class="keypad" id="numericKeypad"></div>
        
        <div class="action-buttons">
            <div class="btn btn-danger" id="clearBtn">CLEAR</div>
            <div class="btn" id="cancelBtn">CANCEL</div>
        </div>
    </div>

    <div class="message-area" id="messageArea"></div>
    <div id="weaponsDisplay" class="weapons-list hidden"></div>
</div>

<script>
    // ========================
    // 🔐 SUPABASE CONFIGURATION
    // ========================
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    // ========================
    // SOUND FX
    // ========================
    const SoundFX = {
        beep(frequency = 800, duration = 0.1, volume = 0.2) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = frequency;
                gainNode.gain.value = volume;
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                oscillator.stop(audioCtx.currentTime + duration);
                setTimeout(() => audioCtx.close(), duration * 1000);
            } catch(e) { console.log("Audio error:", e); }
        },
        scanBeep() { this.beep(1200, 0.08, 0.15); },
        keypadTone(digit) { const freqs = { '1':697, '2':697, '3':697, '4':770, '5':770, '6':770, '7':852, '8':852, '9':852, '0':941 }; this.beep(freqs[digit] || 800, 0.06, 0.12); },
        click() { this.beep(600, 0.04, 0.1); },
        success() { this.beep(880, 0.12, 0.2); setTimeout(() => this.beep(1100, 0.12, 0.2), 120); },
        error() { this.beep(400, 0.3, 0.25); },
        register() { this.beep(660, 0.1, 0.2); setTimeout(() => this.beep(880, 0.1, 0.2), 100); setTimeout(() => this.beep(1320, 0.2, 0.2), 200); }
    };

    const statusLabel = document.getElementById('statusLabel');
    const deviceSigSpan = document.getElementById('deviceSig');
    const keypadSection = document.getElementById('keypadSection');
    const codeDisplay = document.getElementById('codeDisplay');
    const messageArea = document.getElementById('messageArea');
    const weaponsDisplay = document.getElementById('weaponsDisplay');

    let currentSignature = "";
    let enteredCode = "";
    let isProcessing = false;
    let supabaseClient = null;

    function showMessage(text, isError = false) {
        messageArea.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`;
        setTimeout(() => {
            if (messageArea.innerHTML === `<div class="${isError ? 'error-msg' : 'success-msg'}">${text}</div>`) {
                messageArea.innerHTML = "";
            }
        }, 3500);
    }

    function displayWeapons(weaponsArray) {
        if (!weaponsArray || weaponsArray.length === 0) {
            weaponsDisplay.classList.add('hidden');
            return;
        }
        
        let weaponsHtml = '<span>🔫 WEAPON SYSTEMS:</span><br>';
        weaponsArray.forEach(weapon => {
            weaponsHtml += `<div class="weapon-item">⚔️ ${weapon}</div>`;
        });
        weaponsDisplay.innerHTML = weaponsHtml;
        weaponsDisplay.classList.remove('hidden');
    }

    function clearCode() {
        SoundFX.click();
        enteredCode = "";
        codeDisplay.innerText = "----";
    }

    function addDigit(digit) {
        if (enteredCode.length < 4) {
            SoundFX.keypadTone(digit);
            enteredCode += digit;
            let displayStr = enteredCode + "----".substring(enteredCode.length);
            codeDisplay.innerText = displayStr;
            
            const buttons = document.querySelectorAll('.key-btn');
            buttons.forEach(btn => {
                if (btn.innerText === digit) {
                    btn.style.transform = 'scale(0.92)';
                    btn.style.background = '#00f2ff';
                    btn.style.color = '#000';
                    setTimeout(() => {
                        btn.style.transform = '';
                        btn.style.background = '';
                        btn.style.color = '';
                    }, 150);
                }
            });

            if (enteredCode.length === 4) {
                setTimeout(() => verifySecretKeyWithSupabase(enteredCode), 50);
            }
        }
    }

    function generateSignature() {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl');
        const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
        const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
        
        const specs = {
            brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || navigator.platform || "UNKNOWN_STATION",
            gpu: gpu.split('/').pop().trim(),
            res: `${window.screen.width}x${window.screen.height}`,
            plt: navigator.platform,
            tz: Intl.DateTimeFormat().resolvedOptions().timeZone
        };

        const raw = specs.gpu + specs.res + specs.plt + specs.brand + specs.tz;
        let hash = 0;
        for (let i = 0; i < raw.length; i++) {
            hash = ((hash << 5) - hash) + raw.charCodeAt(i);
            hash |= 0;
        }
        return "SIG-" + Math.abs(hash).toString(16).toUpperCase().slice(0, 12);
    }

    // Register device fingerprint sa existing agents table
    async function registerFingerprintToSupabase(agentName, secretKey, signature) {
        try {
            const { data: agentData, error: fetchError } = await supabaseClient
                .from('agents')
                .select('*')
                .eq('secret_key', secretKey)
                .maybeSingle();
            
            if (fetchError || !agentData) {
                console.error("Agent not found:", fetchError);
                return { success: false, reason: "agent_not_found" };
            }
            
            const currentSignatures = agentData.linked_signatures || [];
            let updateData = {
                last_fingerprint: signature,
                updated_at: new Date().toISOString()
            };
            
            if (!currentSignatures.includes(signature)) {
                updateData.linked_signatures = [...currentSignatures, signature];
            }
            
            const { error: updateError } = await supabaseClient
                .from('agents')
                .update(updateData)
                .eq('secret_key', secretKey);
            
            if (updateError) {
                console.error("Update failed:", updateError);
                return { success: false, reason: "update_failed" };
            }
            
            return { 
                success: true, 
                agentName: agentData.agent_name, 
                weaponSystem: agentData.weapons_array || [] // Gamit ang weapons_array column
            };
        } catch (err) {
            console.error("registerFingerprint error:", err);
            return { success: false, reason: "exception" };
        }
    }

    // I-verify ang secret key at kunin ang agent_name
    async function verifySecretKeyWithSupabase(secretKey) {
        if (isProcessing) return;
        isProcessing = true;
        
        statusLabel.innerHTML = "VERIFYING_KEY";
        showMessage("Authenticating secret key via Supabase...");
        SoundFX.scanBeep();
        
        try {
            const { data: agent, error } = await supabaseClient
                .from('agents')
                .select('agent_name, secret_key, weapons_array, linked_signatures')
                .eq('secret_key', secretKey)
                .maybeSingle();
            
            if (error) throw new Error(error.message);
            
            if (agent) {
                const agentName = agent.agent_name;
                const weaponSystem = agent.weapons_array || [];
                
                showMessage(`✓ Secret key verified. Agent: ${agentName}`);
                
                if (weaponSystem.length > 0) {
                    displayWeapons(weaponSystem);
                    showMessage(`✓ Agent has ${weaponSystem.length} weapon system(s) assigned`);
                }
                
                statusLabel.innerHTML = "REGISTERING_DEVICE";
                SoundFX.register();
                
                const regResult = await registerFingerprintToSupabase(agentName, secretKey, currentSignature);
                
                if (regResult.success) {
                    SoundFX.success();
                    showMessage(`Device registered successfully. Welcome, ${agentName}.`);
                    statusLabel.innerHTML = "ACCESS_GRANTED";
                    
                    // STORE SA LOCAL DATABASE (localStorage)
                    localStorage.setItem("supabase_agent", agentName);
                    localStorage.setItem("agent_name", agentName);
                    localStorage.setItem("weapon_system", JSON.stringify(weaponSystem));
                    localStorage.setItem("weapon_system_array", JSON.stringify(weaponSystem));
                    localStorage.setItem("secret_key", secretKey);
                    localStorage.setItem("agent_verified", "true");
                    localStorage.setItem("device_signature", currentSignature);
                    localStorage.setItem("device_print", currentSignature);
                    localStorage.setItem("last_auth", new Date().toISOString());
                    
                    console.log("✅ LOCAL DATABASE STORED (localStorage):");
                    console.log("   📱 agent_name:", agentName);
                    console.log("   🔑 secret_key:", secretKey);
                    console.log("   🖨️ device_print:", currentSignature);
                    console.log("   🔫 weapon_system (ARRAY):", weaponSystem);
                    console.log("   🔫 weapon_system (count):", weaponSystem.length);
                    
                    displayWeapons(weaponSystem);
                    
                    setTimeout(() => {
                        showMessage("Access granted! System ready.");
                        statusLabel.innerHTML = "SYSTEM_READY";
                    }, 1500);
                } else {
                    SoundFX.error();
                    showMessage("Registration failed. Could not update device signature.", true);
                    statusLabel.innerHTML = "REGISTRATION_FAILED";
                    clearCode();
                    isProcessing = false;
                }
            } else {
                SoundFX.error();
                showMessage("Invalid secret key. Access denied.", true);
                statusLabel.innerHTML = "ACCESS_DENIED";
                clearCode();
                isProcessing = false;
            }
        } catch (err) {
            console.error("Supabase verification error:", err);
            SoundFX.error();
            showMessage("Connection error. Check Supabase table/RLS.", true);
            statusLabel.innerHTML = "ERROR";
            isProcessing = false;
        }
    }

    // Suriin kung registered na ang device fingerprint
    async function authenticateDeviceWithSupabase(signature) {
        statusLabel.innerHTML = "SCANNING_SUPABASE";
        deviceSigSpan.innerText = signature;
        SoundFX.scanBeep();
        
        try {
            const { data: agents, error } = await supabaseClient
                .from('agents')
                .select('agent_name, weapons_array, linked_signatures')
                .contains('linked_signatures', [signature]);
            
            if (error) throw error;
            
            if (agents && agents.length > 0) {
                const agentData = agents[0];
                const agentName = agentData.agent_name;
                const weaponSystem = agentData.weapons_array || [];
                
                SoundFX.success();
                statusLabel.innerHTML = "ACCESS_GRANTED";
                showMessage(`Welcome back, ${agentName}. Device recognized.`);
                
                if (weaponSystem.length > 0) {
                    displayWeapons(weaponSystem);
                }
                
                localStorage.setItem("supabase_agent", agentName);
                localStorage.setItem("agent_name", agentName);
                localStorage.setItem("weapon_system", JSON.stringify(weaponSystem));
                localStorage.setItem("weapon_system_array", JSON.stringify(weaponSystem));
                localStorage.setItem("agent_verified", "true");
                localStorage.setItem("device_signature", signature);
                localStorage.setItem("device_print", signature);
                localStorage.setItem("last_auth", new Date().toISOString());
                
                console.log("🔄 Existing device detected. Stored agent_name:", agentName);
                console.log("🖨️ Device print:", signature);
                console.log("🔫 Weapon systems (ARRAY):", weaponSystem);
                
                setTimeout(() => {
                    statusLabel.innerHTML = "SYSTEM_READY";
                }, 1200);
            } else {
                SoundFX.error();
                statusLabel.innerHTML = "DEVICE_NOT_REGISTERED";
                showMessage("Device not recognized. Enter your SECRET KEY to register.", true);
                keypadSection.classList.remove("hidden");
                document.getElementById('scanLine').style.opacity = "0.2";
                weaponsDisplay.classList.add('hidden');
            }
        } catch (err) {
            console.error("Supabase auth error:", err);
            SoundFX.error();
            statusLabel.innerHTML = "SCAN_ERROR";
            showMessage("Supabase connection error. Please check table 'agents' exists.", true);
        }
    }

    function buildKeypad() {
        const keypadContainer = document.getElementById('numericKeypad');
        const layout = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        keypadContainer.innerHTML = '';
        
        layout.forEach(digit => {
            const btn = document.createElement('div');
            btn.className = 'key-btn';
            if (digit === '0') btn.classList.add('key-zero');
            btn.innerText = digit;
            btn.onclick = () => addDigit(digit);
            keypadContainer.appendChild(btn);
        });
    }

    document.getElementById('clearBtn').onclick = () => clearCode();
    document.getElementById('cancelBtn').onclick = () => {
        SoundFX.click();
        keypadSection.classList.add("hidden");
        document.getElementById('scanLine').style.opacity = "0.6";
        statusLabel.innerHTML = "SCAN_CANCELLED";
        showMessage("Registration cancelled. Reloading...", true);
        setTimeout(() => location.reload(), 1500);
    };

    async function init() {
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("✅ Supabase client initialized!");
            
            const { error: testError } = await supabaseClient.from('agents').select('count', { count: 'exact', head: true });
            if (testError) {
                console.warn("⚠️ Table access issue:", testError.message);
                showMessage("⚠️ Cannot access 'agents' table. Check RLS policies.", true);
            } else {
                console.log("✅ Connected to agents table!");
                showMessage("Connected to Supabase. Scanning device...");
            }
        } catch (err) {
            console.error("Fatal: Cannot init Supabase client", err);
            statusLabel.innerHTML = "SUPABASE_FAIL";
            showMessage("Failed to initialize Supabase. Check URL/Key.", true);
            return;
        }
        
        buildKeypad();
        currentSignature = generateSignature();
        deviceSigSpan.innerText = currentSignature;
        
        setTimeout(() => {
            authenticateDeviceWithSupabase(currentSignature);
        }, 800);
    }
    
    init();
</script>
</body>
</html>
