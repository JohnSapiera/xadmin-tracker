<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-noir: 'Special Elite', cursive;
        }

        /* --- BASE STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }

        /* --- DEVICE GRID --- */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.4s; }
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            filter: grayscale(1) brightness(0.3); transition: all 0.5s ease;
        }
        .phone-wrapper.lights-on .phone-body { filter: grayscale(0) brightness(1); border-color: var(--cia-cyan); box-shadow: 0 0 40px rgba(0, 243, 255, 0.6); }
        .phone-screen { position: absolute; inset: 5px; background: #000; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .phone-wrapper.lights-on .phone-screen { background: #ffffff; }

        .typing-text { display: none; color: #000; font-size: 11px; font-weight: bold; width: 0; overflow: hidden; white-space: nowrap; border-right: 2px solid #000; }
        .phone-wrapper.lights-on .typing-text { display: block; animation: typing 0.8s steps(15) 0.4s forwards; }
        @keyframes typing { from { width: 0 } to { width: 90% } }

        /* --- FOLDERS & CIA STAMP --- */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .folder-box { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 15px; }
        .folder-main { 
            width: 50px; height: 35px; background: var(--cia-cyan); border-radius: 0 4px 4px 4px; z-index: 2; 
            clip-path: polygon(0 0, 40% 0, 50% 15%, 100% 15%, 100% 100%, 0 100%); position: relative;
        }
        .paper-sheet { position: absolute; top: 8px; width: 38px; height: 32px; background: #fff; border: 1px solid #ccc; z-index: 1; transition: 0.3s; }
        .folder-box:hover .paper-sheet { transform: translateY(-10px); }
        .file-label { font-size: 8.5px; color: #fff; text-align: center; margin-top: 8px; font-weight: bold; letter-spacing: 1px; }

        /* DYNAMIC CIA STAMP */
        .folder-box.has-expenses .folder-main::after {
            content: "CIA"; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            font-family: var(--font-noir); font-size: 9px; font-weight: bold; color: rgba(0, 0, 0, 0.7);
            border: 1.2px solid rgba(0, 0, 0, 0.7); padding: 0px 2px; border-radius: 1px; line-height: 1;
        }

        /* --- OVERLAYS & UI --- */
        .overlay { display: none; position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .close-btn {
            position: absolute; top: 10px; right: 15px; background: #8b0000; color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 9999; font-weight: bold;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        /* --- BOOK & DOSSIER DESIGN --- */
        .book { width: 95%; max-width: 400px; height: 82vh; perspective: 2000px; position: relative; }
        .page { 
            width: 100%; height: 100%; position: absolute; transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1); 
            transform-origin: left; backface-visibility: hidden; background: #e8e2d2; color: #1a1a1a; padding: 40px 25px; 
            font-family: var(--font-noir); box-shadow: inset 0 0 30px rgba(0,0,0,0.1), 10px 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #c5b8a0; display: flex; flex-direction: column; overflow: hidden;
        }
        .page::after {
            content: "CLASSIFIED"; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%) rotate(-35deg);
            font-size: 3rem; color: rgba(139, 0, 0, 0.05); border: 4px solid rgba(139, 0, 0, 0.05); padding: 10px; pointer-events: none;
        }
        .page.flipped { transform: rotateY(-180deg); }
        .page-front { z-index: 10; }
        .page-back { transform: rotateY(180deg); z-index: 5; }

        .dossier-paper { width: 88%; max-width: 360px; background: #e8e2d2; color: #1a1a1a; padding: 30px 20px; font-family: var(--font-noir); position: relative; border: 1px solid #c5b8a0; box-shadow: 10px 10px 40px rgba(0,0,0,0.5); }
        .audit-list { flex-grow: 1; overflow-y: auto; padding-right: 5px; margin: 10px 0; }
        .expense-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0,0,0,0.2); padding: 8px 0; font-size: 12px; }
        .swipe-hint { margin-top: auto; padding-top: 15px; font-size: 11px; font-weight: bold; color: #8b0000; border-top: 1px dashed #8b0000; cursor: pointer; }
        
        .status-label { font-size: 9px; color: var(--cia-cyan); margin-top: 10px; }
        .uplink-sync { animation: uplink-blink 0.4s infinite; font-weight: bold; }
        @keyframes uplink-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 id="display-agent" style="color: var(--cia-cyan); letter-spacing: 2px;">AUTHENTICATING...</h2>
        <p style="font-size: 9px; opacity: 0.5;">MEMOIRS_PROTOCOL_ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid"></div>
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:10px; width:100%; margin-top:20px; cursor:pointer;">[ EXIT_DEVICE_SYSTEM ]</button>

    <div id="memoirsBtnContainer" style="margin-top: 40px; text-align: center;">
        <button onclick="openMemoirs('ALL')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:12px 25px; cursor:pointer; font-weight:bold;">[ VIEW_MASTER_MEMOIRS ]</button>
    </div>
</div>

<div id="noirOverlay" class="overlay">
    <div class="dossier-paper">
        <button class="close-btn" onclick="closeNoir()">X</button>
        <h3 style="text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px;">vAGENT_DOSSIER</h3>
        <p style="font-size: 11px;"><b>MO#:</b> <span id="n-order">---</span></p>
        <p style="font-size: 11px;"><b>vAgent#:</b> <span id="n-vagent" style="background:rgba(0,0,0,0.1); padding: 0 2px;">---</span></p>
        <div id="n-content" class="audit-list"></div>
        <div style="text-align: right; margin-top: 10px; border-top: 2px solid #000; padding-top: 8px;">
            <p style="font-weight: bold; font-size: 20px;">Total: <span id="n-total">₱ 0.00</span></p>
        </div>
    </div>
</div>

<div id="memoirsOverlay" class="overlay">
    <div class="book">
        <div id="p1" class="page page-front">
            <button class="close-btn" onclick="closeMemoirs()">X</button>
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 10px;">TOP_SECRET_AUDIT</h3>
            <p style="font-size: 9px; opacity: 0.6;">SUBJECT: <span id="target-name">---</span></p>
            <div id="active-list" class="audit-list"></div>
            <div class="swipe-hint" id="flipNextBtn" onclick="flipPage(true)" style="text-align: right;">[ TAP_FOR_SUMMARY ] >></div>
        </div>

        <div id="p2" class="page page-back">
            <button class="close-btn" onclick="closeMemoirs()">X</button>
            <h3 style="text-align:center; border-bottom: 2px solid #000; margin-bottom: 20px;">FINANCIAL_SUMMARY</h3>
            <div id="weapon-system-breakdown" style="font-size: 13px;"></div>
            <div style="margin-top: auto; border-top: 3px double #000; padding-top: 15px;">
                <p style="font-size: 11px; font-weight: bold;">GRAND TOTAL EXPENDITURE:</p>
                <h1 style="font-size: 32px;">₱ <span id="total-val">0.00</span></h1>
            </div>
            <div class="swipe-hint" onclick="flipPage(false)" style="text-align: left;"><< [ BACK_TO_LOGS ]</div>
        </div>
    </div>
</div>

<script type="module">
    import { db, DEVICE_REGISTRY } from "./config.js"; 
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN_AGENT";
    document.getElementById('display-agent').innerText = currentAgent;

    let deviceData = {};
    let allMissions = [];

    window.closeNoir = () => document.getElementById('noirOverlay').style.display = 'none';
    window.closeMemoirs = () => document.getElementById('memoirsOverlay').style.display = 'none';

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        allMissions = []; deviceData = {};
        
        snap.forEach(d => {
            const data = d.data();
            const docWithID = {...data, id: d.id};
            allMissions.push(docWithID);
            if (data.vAgentID) {
                const deviceName = DEVICE_REGISTRY[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[deviceName]) deviceData[deviceName] = [];
                deviceData[deviceName].push(docWithID);
            }
        });
        renderDevices();
    };

    window.renderDevices = () => {
        const grid = document.getElementById('deviceSection');
        grid.innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body"><div class="phone-screen"><div class="typing-text">WELCOME<br>NODE_${name}</div></div></div>
                <div class="status-label">[ STANDBY_LINK ]</div>
            </div>`).join('');
    };

    window.activateDevice = (name, element) => {
        element.classList.add('lights-on'); 
        element.querySelector('.status-label').classList.add('uplink-sync');
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            document.getElementById('memoirsBtnContainer').innerHTML = `<button onclick="openMemoirs('${name}')" style="background:none; border:1px solid var(--cia-red); color:var(--cia-red); padding:10px; width:100%; cursor:pointer;">[ VIEW_${name}_MEMOIRS ]</button>`;
            
            const sorted = deviceData[name].sort((a,b) => parseInt(a.vAgentID) - parseInt(b.vAgentID));
            document.getElementById('vagentSection').innerHTML = sorted.map(v => `
                <div class="folder-box ${v.expensesBreakdown?.length > 0 ? 'has-expenses' : ''}" onclick="openNoirModal('${v.id}')">
                    <div class="paper-sheet"></div><div class="folder-main"></div><div class="file-label">#${v.vAgentID}</div>
                </div>`).join('');
        }, 1200);
    };

    window.openNoirModal = (docID) => {
        const data = allMissions.find(m => m.id === docID);
        if(!data) return;
        document.getElementById('noirOverlay').style.display = 'flex';
        document.getElementById('n-order').innerText = docID.substring(0,10);
        document.getElementById('n-vagent').innerText = data.vAgentID || "N/A";
        
        let expHTML = (data.expensesBreakdown || []).map(e => `
            <div class="expense-row"><span>${e.description}</span><b>₱${(e.amount || 0).toLocaleString()}</b></div>`).join('');
        document.getElementById('n-content').innerHTML = expHTML || 'NO_LOGS_FOUND';
        document.getElementById('n-total').innerText = `₱ ${(data.totalExpenses || 0).toLocaleString()}`;
    };

    window.flipPage = (isFlipped) => {
        const p1 = document.getElementById('p1'), p2 = document.getElementById('p2');
        if(isFlipped) { p1.classList.add('flipped'); setTimeout(() => { p1.style.zIndex="1"; p2.style.zIndex="10"; }, 300); }
        else { p1.classList.remove('flipped'); setTimeout(() => { p1.style.zIndex="10"; p2.style.zIndex="1"; }, 300); }
    };

    window.openMemoirs = (mode) => {
        document.getElementById('memoirsOverlay').style.display = 'flex';
        flipPage(false);
        const filtered = (mode === 'ALL') ? allMissions : allMissions.filter(m => (DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem) === mode);
        const valid = filtered.filter(m => (m.totalExpenses || 0) > 0);

        let logsHTML = "", grand = 0, sysT = {};
        valid.forEach(m => {
            grand += m.totalExpenses;
            const s = DEVICE_REGISTRY[m.weaponSystem] || m.weaponSystem;
            sysT[s] = (sysT[s] || 0) + m.totalExpenses;
            logsHTML += `<div class="expense-row"><span>#${m.vAgentID || 'NA'} (${m.id.substring(0,5)})</span><b>₱${m.totalExpenses.toLocaleString()}</b></div>`;
        });

        document.getElementById('active-list').innerHTML = logsHTML || "NO_RECORDS";
        document.getElementById('weapon-system-breakdown').innerHTML = Object.keys(sysT).map(s => `<div class="expense-row"><span>${s}</span><b>₱${sysT[s].toLocaleString()}</b></div>`).join('');
        document.getElementById('total-val').innerText = grand.toLocaleString();
        document.getElementById('target-name').innerText = mode;
        
        const flipBtn = document.getElementById('flipNextBtn');
        flipBtn.style.display = valid.length > 0 ? "block" : "none";
    };
</script>
</body>
</html>
