<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test Page</title>
</head>
<body>

    <h1>My API Tester</h1>

    <button id="testBtn" style="padding: 20px; background: #007bff; color: white; border-radius: 8px; border: none; cursor: pointer;">
      TEST MULTIPLE REQUESTS
    </button>

    <script>
      document.getElementById('testBtn').addEventListener('click', async () => {
        console.log('Testing started...');
        
        const urls = [
          'https://jsonplaceholder.typicode.com/posts/1',
          'https://jsonplaceholder.typicode.com/posts/2',
          'https://jsonplaceholder.typicode.com/posts/3'
        ];

        try {
          const promiseArray = urls.map(url => fetch(url));
          const responses = await Promise.all(promiseArray);
          
          // Magpapakita ito sa Console ng Inspect window mo sa PC
          console.log('Lahat ng requests ay na-send na!', responses);
          alert('Success! Check mo na ang Network Log sa PC mo.');
        } catch (err) {
          console.error('Ops, may error:', err);
        }
      });
    </script>

</body>
</html>
