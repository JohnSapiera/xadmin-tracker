<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE_GATEWAY_v3 // ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --error: #ff3c3c; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-image: radial-gradient(circle at center, #111 0%, #050506 100%);
        }

        .login-card {
            width: 100%; max-width: 380px; padding: 40px; background: rgba(10, 10, 12, 0.9);
            border: 1px solid rgba(0, 242, 255, 0.1); box-shadow: 0 0 50px rgba(0,0,0,0.8);
            text-align: center; position: relative;
        }

        .login-card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
        }

        h2 { font-size: 14px; letter-spacing: 4px; color: var(--neon); margin-bottom: 30px; text-transform: uppercase; }

        /* DYNAMIC DROPDOWN STYLE */
        select {
            width: 100%; background: #000; border: 1px solid #222; color: var(--neon);
            padding: 15px; font-family: inherit; font-size: 14px; outline: none;
            cursor: pointer; transition: 0.3s; margin-bottom: 20px;
            appearance: none; -webkit-appearance: none;
        }
        select:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        .btn-access {
            width: 100%; padding: 15px; background: var(--neon); color: #000;
            border: none; font-weight: 800; cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.4s;
        }
        .btn-access:hover { background: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.4); }

        .status-msg { font-size: 10px; margin-top: 20px; color: #444; min-height: 15px; }
        .loading-spinner { color: var(--neon); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="login-card">
        <h2>IDENT_VERIFICATION</h2>
        
        <div id="loadingUI" class="loading-spinner">SCANNING_DATABASE...</div>
        
        <div id="loginForm" style="display: none;">
            <label style="display:block; text-align:left; font-size:9px; color:#555; margin-bottom:5px;">SELECT_ACTIVE_AGENT:</label>
            <select id="agentDropdown">
                </select>
            
            <button class="btn-access" onclick="requestAccess()">GRANT_ACCESS</button>
        </div>

        <div id="status" class="status-msg"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. DYNAMIC RETRIEVAL: Load agents from Portal 01 collection
        async function loadAgents() {
            const dropdown = document.getElementById('agentDropdown');
            const status = document.getElementById('status');
            
            try {
                const snap = await db.collection("agents").get();
                
                if (snap.empty) {
                    status.innerHTML = "<span style='color:red'>NO_AGENTS_FOUND_IN_REGISTRY</span>";
                    return;
                }

                dropdown.innerHTML = ""; // Clear
                snap.forEach(doc => {
                    const agent = doc.id; // Gagamitin ang Document ID bilang name
                    dropdown.innerHTML += `<option value="${agent}">AGENT_${agent}</option>`;
                });

                // Show UI
                document.getElementById('loadingUI').style.display = "none";
                document.getElementById('loginForm').style.display = "block";
                status.innerText = ">> DATABASE_SYNC_COMPLETE";

            } catch (error) {
                status.style.color = "red";
                status.innerText = "CONNECTION_ERROR: " + error.message;
            }
        }

        // 2. SESSION LOCK
        function requestAccess() {
            const selectedAgent = document.getElementById('agentDropdown').value;
            const status = document.getElementById('status');

            status.style.color = "var(--neon)";
            status.innerText = "AUTHENTICATING...";

            // Save session to LocalStorage para magamit sa Profile at Dashboard
            localStorage.setItem("cia_agent", selectedAgent);

            setTimeout(() => {
                // Redirect to Dashboard
                window.location.href = "dashboard.html";
            }, 1500);
        }

        // Initial Load
        window.onload = loadAgents;
    </script>
</body>
</html>
