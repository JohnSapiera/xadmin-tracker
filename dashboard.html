<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v18_FINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Chivo+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #010405; --panel: rgba(2, 10, 13, 0.96); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.15); --red: #ff003c; --blue: #007bff; 
      --green: #00ff66; --yellow: #ffcc00; --border: rgba(0, 243, 255, 0.1); 
      --font-main: 'Teko', sans-serif; --font-mono: 'Chivo Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { 
        background: var(--bg); color: #c8e1e5; font-family: var(--font-mono); 
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 50px 50px;
    }
    body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; z-index: 1000; pointer-events: none; opacity: 0.2; }

    header { padding: 15px 20px; background: rgba(0,0,0,0.8); border-bottom: 1px solid var(--cyan-dim); display: flex; justify-content: space-between; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
    .profile-link { background: none; border: 1px solid var(--cyan-dim); color: var(--cyan); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; padding: 6px 12px; text-decoration: none; cursor: pointer; transition: 0.3s; }
    .profile-link:hover { background: var(--cyan-dim); box-shadow: 0 0 10px var(--cyan-dim); }

    .status-bar { font-size: 10px; padding: 8px 20px; background: rgba(0, 243, 255, 0.03); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); }

    main { flex: 1; padding: 25px; overflow-y: auto; padding-bottom: 100px; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 30px; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.9); }
    .command-module::before { content: ""; position: absolute; top: 0; left: 0; width: 15px; height: 15px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }

    #mission-input { 
        width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border); 
        color: var(--cyan); font-family: var(--font-mono); font-size: 50px; font-weight: 700; padding: 10px; 
        text-align: center; letter-spacing: 15px; outline: none; text-shadow: 0 0 15px var(--cyan);
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
    .btn { height: 65px; font-family: var(--font-main); font-size: 24px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border: 1px solid; background: rgba(0,0,0,0.6); cursor: pointer; transition: 0.3s; }
    .btn-save { color: var(--green); border-color: rgba(0,255,102,0.3); }
    .btn-retrieve { color: var(--blue); border-color: rgba(0,123,255,0.3); }
    .btn-reserve { background: linear-gradient(135deg, #1a0000 0%, #000a1a 100%); color: #fff; border-color: rgba(255,0,60,0.4); text-shadow: 0 0 5px var(--cyan); }
    .btn-reserve:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-faded { opacity: 0.1 !important; }

    #terminal { background: rgba(0,0,0,0.85); border: 1px solid #050a0c; padding: 15px; font-family: var(--font-mono); font-size: 11px; height: 160px; color: #5c7882; margin-top: 25px; overflow-y: auto; line-height: 1.6; }

    /* REMASTERED POP-UP */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,1,2,0.97); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .popup { width: 360px; background: #010608; border: 1px solid var(--cyan-dim); padding: 30px; position: relative; box-shadow: 0 0 60px rgba(0,243,255,0.15); }
    .pop-title { font-family: var(--font-main); font-size: 40px; color: var(--cyan); text-align: center; line-height: 1; text-shadow: 0 0 15px var(--cyan); }
    .pop-subtitle { font-family: var(--font-mono); font-size: 10px; color: #4a5a61; text-align: center; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 2px; }

    .data-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 6px; font-size: 12px; }
    .data-label { color: #556b73; text-transform: uppercase; letter-spacing: 1px; }
    .pop-input { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--green); font-family: var(--font-mono); font-size: 13px; padding: 6px; width: 140px; text-align: right; outline: none; }
    
    .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
    .dev-btn { background: rgba(0,0,0,0.5); border: 1px solid var(--border); color: #4a5a61; padding: 10px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
    .dev-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); box-shadow: inset 0 0 10px var(--cyan-dim); }

    .pop-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
    .tactical-btn { height: 45px; font-family: var(--font-main); font-size: 20px; font-weight: 600; text-transform: uppercase; border: 1px solid; cursor: pointer; transition: 0.3s; }
    .btn-confirm { color: var(--green); border-color: rgba(0,255,102,0.4); background: rgba(0,255,102,0.05); }
    .btn-abort { color: var(--red); border-color: rgba(255,0,60,0.4); background: rgba(255,0,60,0.05); }

    .lockdown-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

    nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; z-index: 90; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-size: 11px; text-decoration: none; text-transform: uppercase; }
    .nav-btn.active { color: var(--cyan); background: rgba(0, 243, 255, 0.03); border-top: 3px solid var(--cyan); }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:10px; height:10px; background:var(--cyan); margin-right:12px; box-shadow: 0 0 15px var(--cyan);"></div>
    <span style="font-family: var(--font-main); font-size: 22px; color: var(--cyan); text-transform: uppercase;">INTEL_CORE_v18</span>
  </div>
  <a href="profile.html" class="profile-link">AGENT_PROFILE</a>
</header>

<div class="status-bar">
    <span id="clock">00:00:00</span>
    <span>STATUS: <span style="font-weight:700">ENCRYPTED</span></span>
</div>

<main>
  <div class="command-module">
    <div style="font-size: 10px; color: var(--cyan); margin-bottom: 15px; opacity: 0.5;">// TIER_1_UPLINK_SYSTEM</div>
    <input type="tel" id="mission-input" placeholder="0000" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">INITIALIZE_SAVE</button>
      <button id="reserve-btn" class="btn btn-reserve">RAPID_RESERVE</button>
    </div>
  </div>
  <div id="terminal">> AWAITING_PRIMARY_INPUT...</div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div class="pop-title" id="pop-m-id">#0000</div>
        <div class="pop-subtitle" id="pop-agent">AGENT_NAME</div>
        <div class="device-grid" id="device-list"></div>
        <div class="data-row">
            <span class="data-label">V_AGENT_ID:</span> 
            <input type="text" id="v-agent-input" class="pop-input" placeholder="REQUIRED">
        </div>
        <div class="data-row"><span class="data-label">OPERATIONAL_EXPENSES:</span> <span style="color:var(--green)">PHP 0.00</span></div>
        <div class="data-row"><span class="data-label">DEPLOYMENT:</span> <span id="pop-dep">--/--/--</span></div>
        <div class="data-row"><span class="data-label">RELIEVE:</span> <span id="pop-rel">--/--/--</span></div>
        <div class="pop-btn-row">
            <button onclick="submitMission()" class="tactical-btn btn-confirm">CONFIRM_UPLINK</button>
            <button onclick="closePopup()" class="tactical-btn btn-abort">ABORT</button>
        </div>
    </div>
</div>

<div class="lockdown-overlay" id="success-screen">
    <div style="border: 1px solid var(--green); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--green); font-size: 35px; margin-bottom: 25px; box-shadow: 0 0 20px rgba(0,255,102,0.3);">✓</div>
    <div style="color:#fff; font-size:16px; letter-spacing:4px; text-transform:uppercase;" id="success-msg">UPLINK_SUCCESSFUL</div>
    <button onclick="location.reload()" class="btn btn-save" style="margin-top: 50px; width: 220px; height: 50px;">RETURN_TO_CORE</button>
</div>

<nav><a href="#" class="nav-btn active">DASHBOARD</a><a href="intel.html" class="nav-btn">INTEL_LOGS</a></nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const reserveBtn = document.getElementById('reserve-btn');
  const termLog = document.getElementById('terminal');
  let selectedDevice = navigator.platform;
  let isRetrieveMode = false;

  function log(msg, color = "#5c7882") {
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.4">${new Date().toLocaleTimeString('en-GB')}</span> > <span style="color:${color}">${msg}</span>`;
    termLog.prepend(d);
  }

  input.addEventListener('input', async () => {
    const val = input.value.trim();
    isRetrieveMode = false;
    actionBtn.className = "btn btn-save"; actionBtn.textContent = "INITIALIZE_SAVE"; actionBtn.disabled = false;
    reserveBtn.disabled = false; reserveBtn.classList.remove('btn-faded');

    if (val.length >= 4) {
        log(`CORE_SCANNING: [${val}]`, 'var(--cyan)');
        try {
            const qExist = query(collection(db, "mission_orders"), where("missionID", "==", val));
            const snapExist = await getDocs(qExist);
            if (!snapExist.empty) {
                const data = snapExist.docs[0].data();
                log(`IDENT_MATCH_FOUND`, 'var(--yellow)');
                log(`> MISSION#: ${data.missionID}`, '#fff');
                log(`> V_AGENT#: ${data.vAgentID || 'PENDING'}`, 'var(--green)');
                actionBtn.className = "btn btn-retrieve"; actionBtn.textContent = "RETRIEVE_DATA";
                isRetrieveMode = true; reserveBtn.disabled = true;
                return;
            }
            const qBlack = query(collection(db, "blacklist"), where("targetID", "==", val));
            const snapBlack = await getDocs(qBlack);
            if (!snapBlack.empty) {
                log(`CRITICAL: ID ${val} RESTRICTED`, 'var(--red)');
                actionBtn.className = "btn btn-abort"; actionBtn.textContent = "LOCKED"; actionBtn.disabled = true;
                reserveBtn.disabled = true; reserveBtn.classList.add('btn-faded');
            } else { log(`STATUS: ${val} CLEAR_FOR_UPLINK`, 'var(--green)'); }
        } catch (e) { log("COMMS_ERROR", "red"); }
    }
  });

  actionBtn.onclick = async () => {
    if (input.value.length < 4 || actionBtn.disabled) return;
    const agentName = localStorage.getItem("cia_agent") || "JEFFERSON VALLES";
    document.getElementById('pop-agent').innerText = agentName;
    document.getElementById('pop-m-id').innerText = `#${input.value}`;

    const devGrid = document.getElementById('device-list');
    devGrid.innerHTML = "";
    try {
        const q = query(collection(db, "agents"), where("agentName", "==", agentName));
        const snap = await getDocs(q);
        if (!snap.empty) {
            (snap.docs[0].data().linkedDevice || [navigator.platform]).forEach(dev => {
                const b = document.createElement('button');
                b.className = `dev-btn ${dev === selectedDevice ? 'active' : ''}`;
                b.innerText = dev;
                b.onclick = () => { document.querySelectorAll('.dev-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); selectedDevice = dev; };
                devGrid.appendChild(b);
            });
        }
    } catch(e) {}

    if (isRetrieveMode) {
        const q = query(collection(db, "mission_orders"), where("missionID", "==", input.value));
        const snap = await getDocs(q);
        const data = snap.docs[0].data();
        document.getElementById('v-agent-input').value = data.vAgentID;
        document.getElementById('pop-dep').innerText = data.deploymentDate?.toDate().toLocaleDateString('en-GB') || "--/--/--";
        document.getElementById('pop-rel').innerText = data.relieveDate?.toDate().toLocaleDateString('en-GB') || "--/--/--";
    } else {
        const now = new Date(); const rel = new Date(); rel.setDate(now.getDate() + 30);
        document.getElementById('pop-dep').innerText = now.toLocaleDateString('en-GB');
        document.getElementById('pop-rel').innerText = rel.toLocaleDateString('en-GB');
        document.getElementById('v-agent-input').value = "";
    }
    document.getElementById('modal-overlay').style.display = 'flex';
  };

  window.closePopup = () => document.getElementById('modal-overlay').style.display = 'none';

  window.submitMission = async () => {
    const vId = document.getElementById('v-agent-input').value;
    if(!vId) return alert("V_AGENT_ID REQUIRED");
    try {
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value,
            agentName: document.getElementById('pop-agent').innerText,
            vAgentID: vId,
            weaponSystem: selectedDevice,
            expenses: "PHP 0.00",
            deploymentDate: serverTimestamp(),
            relieveDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000),
            status: "ACTIVE"
        }, { merge: true });
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('success-screen').style.display = 'flex';
    } catch (e) { log("UPLINK_FAILED", "red"); }
  };

  reserveBtn.onclick = async () => {
    if (input.value.length < 4 || reserveBtn.disabled) return;
    try {
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value, agentName: localStorage.getItem("cia_agent") || "JEFFERSON VALLES",
            vAgentID: "RESERVED", weaponSystem: navigator.platform, expenses: "PHP 0.00",
            deploymentDate: serverTimestamp(), relieveDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000), status: "RESERVED"
        }, { merge: true });
        document.getElementById('success-msg').innerText = "MISSION_RESERVED";
        document.getElementById('success-screen').style.display = 'flex';
    } catch (e) { log("RESERVE_FAIL", "red"); }
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
