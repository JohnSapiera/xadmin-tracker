<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOSSAD - AGENT_REGISTRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #050506; --panel: #0a0a0c; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .portal-card {
            background: var(--panel); border: 2px solid rgba(0, 242, 255, 0.2);
            padding: 30px; width: 100%; max-width: 350px; text-align: center;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
        }
        h2 { font-size: 14px; color: var(--cyan); margin-bottom: 20px; letter-spacing: 2px; }
        
        label { display: block; font-size: 10px; color: #666; text-align: left; margin-bottom: 5px; }
        input {
            width: 100%; background: #000; border: 1px solid #333; color: var(--cyan);
            padding: 15px; margin-bottom: 20px; font-family: inherit; outline: none;
            box-sizing: border-box; text-transform: uppercase;
        }
        
        .btn-execute {
            width: 100%; background: var(--cyan); color: #000; border: none;
            padding: 15px; font-weight: 800; cursor: pointer; transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-execute:hover { background: #fff; transform: scale(1.02); }

        #status { font-size: 10px; margin-top: 15px; color: #888; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="portal-card">
        <h2>PORTAL_01: REGISTRY</h2>
        
        <div style="text-align: left;">
            <label>ENTER AGENT IDENTITY (e.g. LZ, JFSN)</label>
            <input type="text" id="agentName" placeholder="CODENAME_REQUIRED">
        </div>

        <button class="btn-execute" onclick="registerToDatabase()">EXECUTE_REGISTRATION</button>
        
        <div id="status">>> STANDBY_FOR_INPUT...</div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function registerToDatabase() {
            const name = document.getElementById('agentName').value.trim().toUpperCase();
            const status = document.getElementById('status');

            if (!name) {
                status.style.color = "red";
                status.innerText = ">> ERROR: NAME_EMPTY";
                return;
            }

            status.style.color = var(--cyan);
            status.innerText = ">> COMMUNICATING_WITH_DATABASE...";

            try {
                // Gagawa tayo ng entry sa 'agents' collection
                // Gagamitin ang mismong 'Name' bilang Document ID para unique
                await db.collection("agents").doc(name).set({
                    agentName: name,
                    status: "ACTIVE",
                    clearanceLevel: "TOP_SECRET",
                    registeredOn: firebase.firestore.FieldValue.serverTimestamp()
                });

                status.style.color = "#00ff00";
                status.innerText = `>> SUCCESS: AGENT_${name}_REGISTERED`;
                document.getElementById('agentName').value = ""; // Clear input

            } catch (error) {
                status.style.color = "red";
                status.innerText = ">> DATABASE_FAILURE: " + error.message;
            }
        }
    </script>
</body>
</html>
