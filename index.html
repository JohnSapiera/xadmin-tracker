<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CENTRAL_AUTH_v18</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #01080b; --cyan: #00f2ff; --red: #ff003c; --green: #00ff66; }
        * { box-sizing: border-box; margin: 0; padding: 0; overflow: hidden; }
        body { 
            background: var(--bg); color: var(--cyan); 
            font-family: 'Share Tech Mono', monospace;
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .auth-box {
            width: 300px; padding: 50px 30px;
            border: 1px solid rgba(0, 242, 255, 0.1);
            background: rgba(2, 10, 13, 0.95);
            text-align: center; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .scan-line {
            width: 100%; height: 2px; background: var(--cyan);
            position: absolute; left: 0; top: 0;
            box-shadow: 0 0 20px var(--cyan);
            animation: move 3s infinite ease-in-out;
            opacity: 0.7;
        }

        @keyframes move { 
            0% { top: 0; opacity: 0; } 
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 100%; opacity: 0; } 
        }

        .label { font-size: 10px; letter-spacing: 5px; color: #3d4d54; margin-bottom: 25px; text-transform: uppercase; }
        #status { font-size: 16px; font-weight: bold; height: 24px; letter-spacing: 2px; transition: 0.3s; }
        
        #error-msg { 
            display: none; color: var(--red); font-size: 11px; margin-top: 25px; 
            line-height: 1.6; border-top: 1px solid rgba(255,0,60,0.2); padding-top: 15px;
        }

        .trace-id { font-size: 8px; color: #233138; margin-top: 30px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="auth-box">
        <div class="scan-line"></div>
        <div class="label">Hardware_Security_Audit</div>
        <div id="status">INITIATING_SCAN...</div>
        
        <div id="error-msg">
            ACCESS_DENIED<br>
            UNREGISTERED_HARDWARE_SIGNATURE<br>
            <span style="font-size:9px; opacity:0.6; color: var(--cyan);">ENROLL VIA UPLINK_v18</span>
        </div>

        <div class="trace-id" id="trace-id">SIG-PENDING</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Get Hardware Signature (Exact match sa update_db logic)
        function getSignature() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
            
            const specs = {
                brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || "MOBILE_NODE",
                gpu: gpu.split('/').pop().trim(),
                res: `${window.screen.width}x${window.screen.height}`,
                plt: navigator.platform
            };

            const raw = specs.gpu + specs.res + specs.plt + specs.brand;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash |= 0;
            }
            return "SIG-" + Math.abs(hash).toString(16).toUpperCase();
        }

        async function verifyDevice() {
            const status = document.getElementById('status');
            const error = document.getElementById('error-msg');
            const trace = document.getElementById('trace-id');
            const currentSIG = getSignature();
            
            trace.innerText = currentSIG;

            try {
                // I-check sa lahat ng agents kung ang currentSIG ay nasa loob ng kanilang 'linkedDevices' array
                // Gagamit tayo ng 'array-contains' filter para sa object checking
                // Note: Sa Firestore, ang 'array-contains' sa objects ay kailangan ng exact match. 
                // Kaya mas safe na i-query muna ang agent list o i-match ang lastFingerprint.
                
                const snap = await db.collection("agents")
                                     .where("lastFingerprint", "==", currentSIG)
                                     .get();

                if (!snap.empty) {
                    const agentData = snap.docs[0].data();
                    status.innerText = "ACCESS_GRANTED";
                    status.style.color = "var(--green)";
                    
                    // Permanent Session Storage
                    localStorage.setItem("cia_agent", agentData.agentName);
                    localStorage.setItem("intel_device_signature", currentSIG);
                    
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);
                } else {
                    // Fallback check: Baka registered na siya pero hindi siya ang "last fingerprint"
                    // Mas mainam na i-link natin ang 'lastFingerprint' sa update_db para dito.
                    status.innerText = "DENIED";
                    status.style.color = "var(--red)";
                    error.style.display = "block";
                }
            } catch (e) {
                status.innerText = "COMMS_OFFLINE";
                console.error(e);
            }
        }

        // Delay scan to allow animation to start
        window.onload = () => {
            setTimeout(verifyDevice, 1000);
        };
    </script>
</body>
</html>
