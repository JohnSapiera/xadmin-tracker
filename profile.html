<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUREAU_REGISTRY // ARCHIVES</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --red: #ff3c3c; --folder-tan: #c2b280; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; }

        .container { max-width: 600px; margin: 0 auto; }
        .header { border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        
        /* File Grid System */
        .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 25px; margin-top: 20px; }

        /* The File/Folder Design */
        .file-item { position: relative; width: 100px; cursor: pointer; transition: 0.3s; }
        
        /* Folder Tab */
        .file-folder { 
            height: 80px; width: 100%; background: var(--folder-tan); border-radius: 2px 10px 2px 2px;
            position: relative; box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .file-folder::before {
            content: ""; position: absolute; top: -8px; left: 0; width: 40px; height: 10px;
            background: var(--folder-tan); border-radius: 4px 4px 0 0;
        }

        /* Top Secret Stamp on File */
        .file-label { font-size: 9px; color: #000; font-weight: 800; text-align: center; line-height: 1; }
        .file-id { font-size: 12px; color: #000; font-weight: 900; margin-top: 5px; }

        /* Silhouette / Placeholder Style */
        .silhouette { opacity: 0.15; filter: grayscale(1); cursor: default; pointer-events: none; }
        .silhouette .file-folder { background: #333; }
        .silhouette .file-label { color: #555; }

        .file-item:not(.silhouette):hover { transform: translateY(-5px) rotate(-2deg); z-index: 10; }

        /* Classified Document Overlay */
        #missionOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center;
        }
        .classified-doc {
            background: #e2dcc8; color: #1a1a1a; width: 85%; max-width: 420px; padding: 40px;
            box-shadow: 15px 15px 0px #000; border: 1px solid #999;
            animation: pullOut 0.4s ease-out; background-image: radial-gradient(#dcd5bc 1px, transparent 1px); background-size: 20px 20px;
        }
        @keyframes pullOut { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .doc-title { text-align: center; border-bottom: 3px double #1a1a1a; margin-bottom: 20px; padding-bottom: 10px; }
        .doc-title h1 { margin: 0; font-size: 22px; letter-spacing: 4px; text-decoration: underline; }
        
        .data-row { margin-bottom: 15px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 5px; }
        .data-label { font-size: 9px; color: #666; font-weight: bold; }
        .data-value { font-size: 14px; color: #000; text-transform: uppercase; }

        .expense-tag { font-size: 18px; color: #b22222; font-weight: 800; display: block; margin-top: 5px; }
        .btn-add { background: #000; color: #fff; border: none; padding: 5px 12px; font-size: 9px; cursor: pointer; border-radius: 3px; }

        .close-btn { position: absolute; bottom: -60px; left: 50%; transform: translateX(-50%); color: var(--neon); cursor: pointer; font-size: 12px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <div style="font-size: 10px; color: #555;">RECORDS_SECTION</div>
                <h2 id="agentName" style="margin:0; color: var(--neon); letter-spacing: 2px;">AGENT_--</h2>
            </div>
            <div id="deviceTag" style="font-size: 9px; color: #333;">DEVICE: UNKNOWN</div>
        </div>

        <div style="font-size: 11px; color: #555; margin-bottom: 10px;">>> ACTIVE_DOSSIERS:</div>
        <div class="file-grid" id="mainFileGrid">
            </div>
    </div>

    <div id="missionOverlay">
        <div class="classified-doc">
            <div style="border: 2px solid #1a1a1a; padding: 5px; position: absolute; top: 15px; right: 15px; color: #1a1a1a; font-size: 8px; font-weight: 800;">CONFIDENTIAL</div>
            <div class="doc-title">
                <h1>MISSION ORDER</h1>
                <div id="moID" style="font-size: 10px; letter-spacing: 2px;">VA-00-RED</div>
            </div>

            <div class="data-row">
                <div class="data-label">OPERATIONAL_OBJECTIVE:</div>
                <div class="data-value" id="moObj">-- DATA_REDACTED --</div>
            </div>

            <div class="data-row">
                <div class="data-label">FUNDS_ALLOCATED (PHP):</div>
                <span class="expense-tag" id="moPrice">₱ 0.00</span>
                <button class="btn-add" onclick="addFunds()">+ INJECT_FUNDS</button>
            </div>

            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <div class="data-row" style="flex: 1;">
                    <div class="data-label">DEPLOYMENT:</div>
                    <div class="data-value" id="moStart" style="font-size: 11px;">00/00/26</div>
                </div>
                <div class="data-row" style="flex: 1;">
                    <div class="data-label">EXPIRATION:</div>
                    <div class="data-value" id="moEnd" style="font-size: 11px;">00/00/26</div>
                </div>
            </div>
            <div class="close-btn" onclick="closeDoc()">[ CLICK_TO_ARCHIVE_FILE ]</div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const agent = localStorage.getItem("cia_agent") || "LZ";
        let activeVNum = null;

        async function loadArchives() {
            document.getElementById('agentName').innerText = `AGENT_${agent}`;
            document.getElementById('deviceTag').innerText = `DEVICE: ${localStorage.getItem("device_uuid") || "---"}`;
            
            const grid = document.getElementById('mainFileGrid');
            grid.innerHTML = ""; // Clear grid

            try {
                // 1. Kuhanin lahat ng Active VAgents sa Database
                const snap = await db.collection("agents").doc(agent).collection("VAgents").get();
                
                // 2. I-render ang mga existing files
                snap.forEach(doc => {
                    const id = doc.id.replace('Agent', '');
                    grid.innerHTML += `
                        <div class="file-item" onclick="openDoc('${doc.id}')">
                            <div class="file-folder">
                                <span class="file-label">MISSION</span>
                                <span class="file-id">#${id}</span>
                            </div>
                        </div>
                    `;
                });

                // 3. I-append ang 2 Silhouette Files (Preview Only) sa dulo
                for(let i=0; i<2; i++) {
                    grid.innerHTML += `
                        <div class="file-item silhouette">
                            <div class="file-folder">
                                <span class="file-label">PENDING</span>
                                <span class="file-id">??</span>
                            </div>
                        </div>
                    `;
                }

            } catch (e) {
                console.error("Archive Read Error", e);
            }
        }

        async function openDoc(vID) {
            activeVNum = vID;
            const doc = await db.collection("agents").doc(agent).collection("VAgents").doc(vID).get();
            const data = doc.data();

            document.getElementById('moID').innerText = `CASE_REF: ${vID.toUpperCase()}`;
            document.getElementById('moObj').innerText = data.missionDetails || "NO_DESCRIPTION";
            document.getElementById('moPrice').innerText = `₱ ${parseFloat(data.expenses || 0).toLocaleString('en-PH', {minimumFractionDigits: 2})}`;
            document.getElementById('moStart').innerText = data.deploymentDate || "N/A";
            document.getElementById('moEnd').innerText = data.expirationDate || "N/A";

            document.getElementById('missionOverlay').style.display = 'flex';
        }

        function closeDoc() { document.getElementById('missionOverlay').style.display = 'none'; }

        async function addFunds() {
            const amount = prompt("Enter additional operational funds (PHP):");
            if(amount && !isNaN(amount)) {
                const ref = db.collection("agents").doc(agent).collection("VAgents").doc(activeVNum);
                const currentDoc = await ref.get();
                const newTotal = parseFloat(currentDoc.data().expenses || 0) + parseFloat(amount);
                
                await ref.update({ expenses: newTotal });
                document.getElementById('moPrice').innerText = `₱ ${newTotal.toLocaleString('en-PH', {minimumFractionDigits: 2})}`;
                alert("FINANCIAL_UPLINK_SUCCESSFUL.");
            }
        }

        window.onload = loadArchives;
    </script>
</body>
</html>
