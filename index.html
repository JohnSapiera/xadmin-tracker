<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA INTELLIGENCE UNIT - LIVE CLOUD</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(18, 18, 24, 0.95);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --text-dim: #626a77;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--accent-cyan); font-size: 11px; color: var(--accent-cyan);
        }

        .dashboard {
            display: grid; grid-template-columns: 280px 1fr 320px;
            gap: 15px; padding: 15px; flex-grow: 1;
        }

        .panel { background: var(--panel-bg); border: 1px solid var(--border); display: flex; flex-direction: column; border-radius: 4px; overflow: hidden; }
        .panel-header { padding: 8px 12px; font-size: 10px; font-weight: 800; background: rgba(255, 255, 255, 0.03); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

        /* PORTAL 1: BOUNTY */
        .bounty-list { flex-grow: 1; padding: 15px; font-size: 11px; overflow-y: auto; }
        .bounty-card { border-left: 2px solid var(--accent-cyan); padding: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.02); }
        .add-bounty-btn { background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 10px; margin: 10px; cursor: pointer; font-family: inherit; font-weight: 800; }

        /* PORTAL 2: CHAT */
        .chat-area { flex-grow: 1; overflow-y: auto; padding: 15px; font-size: 12px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 4px; }
        .chat-img { max-width: 100%; border-radius: 4px; margin-top: 5px; border: 1px solid #333; cursor: pointer; }
        .chat-input-row { padding: 10px; background: #000; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); }

        /* PORTAL 3: BAN */
        .ban-container { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        input, textarea { background: #000; border: 1px solid #333; color: var(--accent-cyan); padding: 12px; font-family: inherit; width: 100%; outline: none; border-radius: 4px; }
        textarea { height: 100px; resize: none; }
        .execute-btn { background: var(--danger-red); color: white; border: none; padding: 15px; font-weight: 800; cursor: pointer; border-radius: 4px; }
        .terminal-log { flex-grow: 1; background: rgba(0,0,0,0.6); padding: 15px; font-size: 11px; overflow-y: auto; color: #88ff88; border: 1px solid var(--border); }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: #0f1117; border: 2px solid var(--accent-cyan); width: 320px; padding: 20px; }
        .modal-step { display: none; flex-direction: column; gap: 10px; }
        .active-step { display: flex; }
        .option-btn { background: #1a1d26; border: 1px solid #333; color: #fff; padding: 10px; cursor: pointer; text-align: left; font-family: inherit; }

        .hidden { display: none !important; }
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <nav class="status-header">
        <div>OP_ID: <span style="color:white">098-GHOST</span></div>
        <div class="blink">● CLOUD_DATABASE_CONNECTED</div>
        <div id="clock">00:00:00</div>
    </nav>

    <div class="dashboard">
        <div class="panel">
            <div class="panel-header">BOUNTY_REPORTS</div>
            <div class="bounty-list" id="bountyDisplay"></div>
            <button class="add-bounty-btn" onclick="openBountyModal()">+ ADD TARGET</button>
        </div>

        <div class="panel">
            <div class="panel-header">CLASSIFIED_COMMS (LIVE)</div>
            <div class="chat-area" id="chatFeed"></div>
            <div class="chat-input-row">
                <div id="photoStatus" style="font-size: 9px; color: var(--accent-cyan); display: none;">PHOTO_QUEUED</div>
                <div style="display: flex; gap: 8px;">
                    <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="previewPhoto(this)">
                    <button onclick="document.getElementById('photoInput').click()" style="background:#222; border:1px solid #444; color:white; padding:8px 12px; cursor:pointer;">📷</button>
                    <input type="text" id="chatInput" placeholder="Secure message..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:var(--accent-cyan); border:none; padding:8px 15px; font-weight:800; cursor:pointer;">SEND</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span onclick="toggleBulkMode()" style="cursor:pointer; color:var(--accent-cyan)">TERMINATION_PROTOCOL</span>
                <span id="modeStatus" style="font-size: 9px; color: var(--text-dim);">MODE: SINGLE</span>
            </div>
            <div class="ban-container">
                <input type="text" id="singleCode" placeholder="Search blacklist..." oninput="autoSearch(this.value)">
                <textarea id="bulkCodes" class="hidden" placeholder="Bulk IDs (Deduplication)"></textarea>
                <button class="execute-btn" onclick="processBan()">EXECUTE BLACKLIST</button>
                <div class="terminal-log" id="banLog">> System Standby...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="bountyModal">
        <div class="modal-box">
            <div id="step1" class="modal-step active-step">
                <p style="font-size:11px; color:var(--accent-cyan)">SELECT AGENT:</p>
                <button class="option-btn" onclick="selectAgent('LZ')">Agent LZ</button>
                <button class="option-btn" onclick="selectAgent('JFSN')">Agent JFSN</button>
                <button onclick="closeModal()" style="background:none; border:none; color:grey; cursor:pointer; margin-top:10px;">CANCEL</button>
            </div>
            <div id="step2" class="modal-step">
                <p style="font-size:11px; color:var(--accent-cyan)">SELECT WEAPON:</p>
                <div id="weaponOptions"></div>
            </div>
            <div id="step3" class="modal-step">
                <p style="font-size:11px; color:var(--accent-cyan)">TARGET DATA:</p>
                <input type="number" id="vID" placeholder="V-Agent #">
                <input type="number" id="bAmount" placeholder="Bounty ₱">
                <button class="execute-btn" style="background:var(--accent-cyan); color:#000;" onclick="saveBounty()">DEPLOY</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, where, getDocs } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- 1. LIVE CHATS ---
        let pendingPhoto = null;
        window.previewPhoto = (input) => {
            const reader = new FileReader();
            reader.onload = (e) => { pendingPhoto = e.target.result; document.getElementById('photoStatus').style.display='block'; };
            reader.readAsDataURL(input.files[0]);
        };

        window.sendMsg = async () => {
            const text = document.getElementById('chatInput').value.trim();
            if (!text && !pendingPhoto) return;

            let imageUrl = null;
            if (pendingPhoto) {
                const storageRef = ref(storage, `chats/${Date.now()}.png`);
                await uploadString(storageRef, pendingPhoto, 'data_url');
                imageUrl = await getDownloadURL(storageRef);
            }

            await addDoc(collection(db, "chats"), { text, imageUrl, timestamp: new Date() });
            document.getElementById('chatInput').value = "";
            pendingPhoto = null;
            document.getElementById('photoStatus').style.display='none';
        };

        onSnapshot(query(collection(db, "chats"), orderBy("timestamp", "asc")), (snap) => {
            const feed = document.getElementById('chatFeed');
            feed.innerHTML = snap.docs.map(doc => {
                const data = doc.data();
                return `<div class="chat-msg"><span style="color:var(--accent-cyan)">[OP]:</span> ${data.text} ${data.imageUrl ? `<br><img src="${data.imageUrl}" class="chat-img" onclick="window.open('${data.imageUrl}')">` : ''}</div>`;
            }).join('');
            feed.scrollTop = feed.scrollHeight;
        });

        // --- 2. BOUNTY REPORTS ---
        window.saveBounty = async () => {
            const vid = document.getElementById('vID').value;
            const amt = document.getElementById('bAmount').value;
            await addDoc(collection(db, "bounties"), { agent: window.tA, weapon: window.tW, vid, amt, timestamp: new Date() });
            window.closeModal();
        };

        onSnapshot(query(collection(db, "bounties"), orderBy("timestamp", "desc")), (snap) => {
            document.getElementById('bountyDisplay').innerHTML = snap.docs.map(doc => {
                const b = doc.data();
                return `<div class="bounty-card"><div style="color:var(--accent-cyan)">${b.agent} | ${b.weapon}</div>V-ID: ${b.vid} | ₱${b.amt}</div>`;
            }).join('');
        });

        // --- 3. BAN PROTOCOL (LIVE SEARCH) ---
        window.autoSearch = async (val) => {
            const log = document.getElementById('banLog');
            const code = val.trim().toUpperCase();
            if (!code) return log.innerHTML = `> System Standby...`;
            
            const q = query(collection(db, "blacklist"), where("code", "==", code));
            const snap = await getDocs(q);
            log.innerHTML = `<div>> QUERYING: ${code}...</div>`;
            if (!snap.empty) log.innerHTML += `<div style="color:var(--danger-red)">> WARNING: ALREADY BANNED.</div>`;
            else log.innerHTML += `<div style="color:#00ff00">> STATUS: CLEAR.</div>`;
        };

        window.processBan = async () => {
            const code = document.getElementById('singleCode').value.trim().toUpperCase();
            if (code) {
                await addDoc(collection(db, "blacklist"), { code, bannedAt: new Date() });
                document.getElementById('banLog').innerHTML += `<div>> SUCCESS: ${code} BLACKLISTED.</div>`;
                document.getElementById('singleCode').value = "";
            }
        };
    </script>

    <script>
        // UI HELPERS
        window.tA = ""; window.tW = "";
        function openBountyModal() { document.getElementById('bountyModal').style.display='flex'; }
        function closeModal() { document.getElementById('bountyModal').style.display='none'; }
        function selectAgent(a) { 
            window.tA = a; document.getElementById('step1').classList.remove('active-step'); document.getElementById('step2').classList.add('active-step');
            const ws = a === 'LZ' ? ['R8', 'RM14'] : ['R9', 'TechCP'];
            document.getElementById('weaponOptions').innerHTML = ws.map(w => `<button class="option-btn" onclick="selectWeapon('${w}')">${w}</button>`).join('');
        }
        function selectWeapon(w) { window.tW = w; document.getElementById('step2').classList.remove('active-step'); document.getElementById('step3').classList.add('active-step'); }
        function toggleBulkMode() {
            document.getElementById('singleCode').classList.toggle('hidden');
            document.getElementById('bulkCodes').classList.toggle('hidden');
        }
        setInterval(() => document.getElementById('clock').innerText = new Date().toLocaleTimeString(), 1000);
    </script>
</body>
</html>
