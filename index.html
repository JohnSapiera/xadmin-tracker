<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL DASHBOARD | MOBILE V4</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a0e;
      --panel: rgba(5, 18, 24, 0.95);
      --cyan: #00f3ff;
      --red: #ff003c;
      --blue: #007bff;
      --green: #00ff66;
      --border: rgba(0, 243, 255, 0.3);
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg); 
      color: #c8e1e5; 
      font-family: var(--font-ui); 
      height: 100vh; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }

    /* --- UI COMPONENTS --- */
    header { 
      padding: 15px; 
      border-bottom: 1px solid var(--cyan); 
      background: #000; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 10;
    }

    .ticker-wrap { 
      background: rgba(0, 243, 255, 0.05); 
      border-bottom: 1px solid var(--border); 
      padding: 5px 10px; 
      font-family: var(--font-mono); 
      font-size: 11px; 
      color: var(--cyan); 
    }

    main { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px 15px 100px 15px; 
    }

    .portal-section { display: none; }
    .portal-section.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* --- SEARCH & INPUT --- */
    .search-box { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      padding: 20px; 
      border-radius: 4px; 
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    }

    .input-label { 
      font-family: var(--font-mono); 
      font-size: 11px; 
      color: var(--cyan); 
      margin-bottom: 10px; 
      display: block; 
    }

    #mission-input { 
      width: 100%; 
      background: #000; 
      border: 1px solid var(--cyan); 
      color: var(--cyan); 
      font-family: var(--font-mono); 
      font-size: 32px; 
      padding: 10px; 
      text-align: center; 
      letter-spacing: 8px; 
      outline: none; 
      margin-bottom: 20px; 
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .btn { 
      padding: 15px; 
      font-family: var(--font-mono); 
      font-size: 14px; 
      font-weight: bold; 
      border: 1px solid; 
      background: transparent; 
      text-transform: uppercase; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }

    /* Dynamic Classes */
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { background: var(--blue) !important; border-color: var(--blue) !important; color: white !important; }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    /* --- TERMINAL --- */
    #terminal { 
      background: #000; 
      border: 1px solid #1a1a1a; 
      padding: 12px; 
      font-family: var(--font-mono); 
      font-size: 11px; 
      min-height: 140px; 
      max-height: 200px;
      color: #666; 
      margin-top: 20px; 
      overflow-y: auto;
    }
    .log-entry { margin-bottom: 4px; border-bottom: 1px solid #0a0a0a; padding-bottom: 2px; }

    /* --- WEAPON SYSTEM MODAL --- */
    #weapon-modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.92); 
      z-index: 1000; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    .modal-content { 
      background: var(--panel); 
      border: 2px solid var(--red); 
      width: 100%; 
      max-width: 350px; 
      position: relative; 
      padding: 40px 20px 25px; 
      box-shadow: 0 0 40px rgba(255,0,60,0.4);
      animation: modalSlide 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    @keyframes modalSlide { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-close { 
      position: absolute; top: 0; right: 0; 
      background: var(--red); color: #fff; 
      border: none; padding: 8px 15px; 
      font-family: var(--font-mono); cursor: pointer; 
    }
    .modal-header-tag { 
      position: absolute; top: -14px; left: 50%; 
      transform: translateX(-50%); 
      background: var(--bg); padding: 2px 15px; 
      border: 1px solid var(--red); color: var(--red); 
      font-family: var(--font-mono); font-size: 13px; 
      white-space: nowrap; font-weight: bold;
    }
    .weapon-details { 
      font-family: var(--font-mono); 
      text-align: left;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 15px;
      background: rgba(0,0,0,0.3);
    }
    .weapon-details div { margin-bottom: 10px; font-size: 14px; }
    .weapon-details span { color: var(--cyan); display: block; font-size: 18px; margin-top: 4px; }

    /* --- NAVIGATION --- */
    nav { 
      position: fixed; bottom: 0; left: 0; right: 0; 
      height: 70px; background: #000; 
      border-top: 2px solid var(--cyan); 
      display: grid; grid-template-columns: 1fr 1fr; 
      z-index: 200; 
    }
    .nav-item { 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
      color: #444; font-family: var(--font-mono); font-size: 12px; 
    }
    .nav-item.active { color: var(--cyan); background: rgba(0, 243, 255, 0.1); }

  </style>
</head>
<body>

<header>
  <div style="font-family: var(--font-mono); font-size: 13px;">[ SYSTEM_V4.1_ACTIVE ]</div>
  <div id="clock" style="color: var(--cyan); font-family: var(--font-mono);">00:00:00</div>
</header>

<div class="ticker-wrap"><span id="ticker-text">INITIALIZING ENCRYPTED UPLINK...</span></div>

<main>
  <section id="mission" class="portal-section active">
    <div class="search-box">
      <label class="input-label">ENTER MISSION ORDER # (4-5 DIGITS)</label>
      <input type="tel" id="mission-input" placeholder="00000" maxlength="5">
      
      <div class="btn-row">
        <button id="main-action-btn" class="btn btn-save">SAVE</button>
        <button id="terminate-btn" class="btn btn-terminate">TERMINATE</button>
      </div>
    </div>

    <div id="terminal">
      <div class="log-entry">> STO_SECURE_GATEWAY: L-98 STANDBY...</div>
    </div>
  </section>

  <section id="vault" class="portal-section">
    <div style="text-align: center; margin-top: 50px;">
      <h2 style="color: var(--red); font-family: var(--font-mono);">[ DATA_VAULT ]</h2>
      <p style="color: #555; margin-top: 10px;">LEVEL 10 CLEARANCE REQUIRED</p>
    </div>
  </section>
</main>

<div id="weapon-modal">
  <div class="modal-content">
    <button class="modal-close" id="close-modal-btn">X</button>
    <div class="modal-header-tag" id="modal-order-title">MISSION ORDER #: 00000</div>
    <div class="weapon-details">
      <div>WEAPON SYSTEM: <span id="disp-weapon">--</span></div>
      <div>V-AGENT #: <span id="disp-agent">--</span></div>
    </div>
  </div>
</div>

<nav>
  <div class="nav-item active" id="nav-mission">PORTAL_01</div>
  <div class="nav-item" id="nav-vault">PORTAL_02</div>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // --- CONFIG: PALITAN ITO NG IYONG FIREBASE CREDENTIALS ---
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const DB_NAME = "mission_orders"; // Pangalan ng collection sa Firestore

  // Elements
  const missionInput = document.getElementById('mission-input');
  const mainBtn = document.getElementById('main-action-btn');
  const terminal = document.getElementById('terminal');
  const modal = document.getElementById('weapon-modal');

  let activeData = null;

  // --- AUTO SEARCH LOGIC ---
  missionInput.addEventListener('input', async (e) => {
    let val = e.target.value.replace(/\D/g, '');
    missionInput.value = val;

    if (val.length >= 4) {
      writeLog(`SCANNING FREQUENCY: ${val}...`, 'cyan');
      
      try {
        const q = query(collection(db, DB_NAME), where("orderNumber", "==", val));
        const snap = await getDocs(q);

        if (!snap.empty) {
          // FOUND: Switch to RETRIEVE (Blue)
          activeData = snap.docs[0].data();
          mainBtn.textContent = "RETRIEVE";
          mainBtn.classList.add('btn-retrieve');
          writeLog(`TARGET FOUND. RETRIEVE PROTOCOL ACTIVE.`, 'blue');
        } else {
          // NOT FOUND: Switch back to SAVE (Green)
          resetButton();
        }
      } catch (err) {
        writeLog(`ERROR: ${err.message}`, 'red');
      }
    } else {
      resetButton();
    }
  });

  function resetButton() {
    activeData = null;
    mainBtn.textContent = "SAVE";
    mainBtn.classList.remove('btn-retrieve');
    mainBtn.classList.add('btn-save');
  }

  // --- MAIN ACTION: SAVE OR RETRIEVE ---
  mainBtn.addEventListener('click', async () => {
    const code = missionInput.value;
    if (code.length < 4) return writeLog("ERROR: INVALID CODE LENGTH", "red");

    if (mainBtn.textContent === "RETRIEVE" && activeData) {
      // Show Weapon System Modal
      document.getElementById('modal-order-title').textContent = `MISSION ORDER #: ${code}`;
      document.getElementById('disp-weapon').textContent = activeData.weaponSystem || "NOT DEFINED";
      document.getElementById('disp-agent').textContent = activeData.agent || "UNASSIGNED";
      modal.style.display = 'flex';
      writeLog(`WEAPON SYSTEM DATA EXTRACTED.`, 'cyan');
    } else {
      // SAVE Logic (Example)
      writeLog(`UPLOADING MISSION ${code} TO CLOUD...`, 'green');
      try {
        await addDoc(collection(db, DB_NAME), {
          orderNumber: code,
          weaponSystem: "DEFAULT_TACTICAL", // Maaari mong gawing input field ito
          agent: "AGENT_" + Math.floor(100 + Math.random() * 900),
          timestamp: serverTimestamp()
        });
        writeLog(`SUCCESS: MISSION ${code} ARCHIVED.`, 'green');
        missionInput.value = '';
        resetButton();
      } catch (e) {
        writeLog(`UPLOAD FAILED: ${e.message}`, 'red');
      }
    }
  });

  // --- UI HELPERS ---
  document.getElementById('close-modal-btn').onclick = () => modal.style.display = 'none';

  function writeLog(msg, color) {
    const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.style.color = `var(--${color})`;
    entry.textContent = `[${time}] > ${msg}`;
    terminal.prepend(entry);
  }

  // Clock
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
  }, 1000);

  // Tab Switcher
  document.getElementById('nav-mission').onclick = function() {
    document.getElementById('mission').classList.add('active');
    document.getElementById('vault').classList.remove('active');
    this.classList.add('active');
    document.getElementById('nav-vault').classList.remove('active');
  };

  document.getElementById('nav-vault').onclick = function() {
    document.getElementById('vault').classList.add('active');
    document.getElementById('mission').classList.remove('active');
    this.classList.add('active');
    document.getElementById('nav-mission').classList.remove('active');
  };
</script>

</body>
</html>
