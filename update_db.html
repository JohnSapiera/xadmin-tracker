<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENCY_DEVICE_AUTHORIZATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #01080b; --green: #00ff66; --border: rgba(0, 242, 255, 0.2); --mono: 'Share Tech Mono', monospace; }
        body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-image: radial-gradient(circle at 50% 50%, #0a1f29 0%, var(--bg) 100%); }
        .card { width: 90%; max-width: 400px; background: rgba(2, 12, 18, 0.98); padding: 30px; border: 1px solid var(--border); box-shadow: 0 0 50px rgba(0,0,0,1); }
        h2 { color: var(--cyan); font-family: var(--mono); font-size: 1.2rem; border-left: 3px solid var(--cyan); padding-left: 10px; margin-bottom: 25px; }
        .info-box { background: #000; padding: 15px; border: 1px solid #1a262b; margin-bottom: 20px; font-family: var(--mono); font-size: 12px; color: #888; }
        .info-box span { color: var(--green); display: block; font-size: 14px; margin-top: 5px; word-break: break-all; }
        select { width: 100%; padding: 15px; background: #000; color: #fff; border: 1px solid #333; font-family: var(--mono); margin-bottom: 25px; outline: none; }
        .btn-auth { width: 100%; padding: 20px; background: transparent; color: var(--green); border: 2px solid var(--green); font-family: var(--mono); font-weight: 800; cursor: pointer; transition: 0.3s; letter-spacing: 2px; }
        .btn-auth:hover { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); }
        #status { font-family: var(--mono); font-size: 11px; margin-top: 15px; color: #555; }
    </style>
</head>
<body>

    <div class="card">
        <h2>DEVICE_UPLINK_v12.2</h2>
        
        <div class="info-box">
            PERMANENT_HARDWARE_ID:
            <span id="detected-device">ANALYZING...</span>
        </div>

        <label style="font-size: 10px; color: #555; font-family: var(--mono);">SELECT_AGENT_IDENTITY:</label>
        <select id="agentSelect">
            <option value="JFSN">AGENT_JFSN</option>
            <option value="LZ">AGENT_LZ</option>
        </select>

        <button class="btn-auth" onclick="authorizeAccess()">AUTHORIZE ACCESS</button>
        
        <div id="status">> SYSTEM_READY_FOR_HANDSHAKE</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- ENHANCED PERMANENT DETECTION ---
        function getPermanentDeviceSignature() {
            // 1. Check kung may existing ID na sa browser memory
            let existingID = localStorage.getItem("agency_node_secret");
            
            // 2. Kung wala pa, gumawa ng bago based sa hardware
            if (!existingID) {
                const ua = navigator.userAgent;
                let brand = "NODE";

                if (/windows/i.test(ua)) brand = "WIN_PC";
                else if (/android/i.test(ua)) {
                    const match = ua.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/);
                    brand = match ? match[2].toUpperCase().replace(/\s/g, '_') : "ANDROID";
                }
                else if (/iphone|ipad/i.test(ua)) brand = "APPLE_IOS";

                // Generate random 4-char suffix
                const suffix = Math.random().toString(36).substr(2, 4).toUpperCase();
                existingID = `${brand}_${suffix}`;
                
                // I-save para permanent na sa browser na ito
                localStorage.setItem("agency_node_secret", existingID);
            }
            return existingID;
        }

        const finalSignature = getPermanentDeviceSignature();
        document.getElementById('detected-device').innerText = finalSignature;

        async function authorizeAccess() {
            const agent = document.getElementById('agentSelect').value;
            const log = document.getElementById('status');
            
            log.innerHTML = "> INITIATING_CLOUD_UPLINK...";

            try {
                // Gamitin ang Agent Name bilang Document ID para malinis
                const agentRef = db.collection("agents").doc(agent);

                await agentRef.set({
                    agentName: agent,
                    // arrayUnion para dagdag lang nang dagdag sa iisang agent record
                    linkedDevice: firebase.firestore.FieldValue.arrayUnion(finalSignature),
                    lastSync: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                log.innerHTML = `> <span style="color:var(--green)">SUCCESS: ${finalSignature} AUTHORIZED!</span>`;
                alert("Device Authorization Successful!\n\nRegistered as: " + finalSignature);
            } catch (e) {
                log.innerHTML = "> ERROR: " + e.message;
                console.error(e);
            }
        }
    </script>
</body>
</html>
