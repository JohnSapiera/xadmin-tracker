<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA - RAPID ELIMINATION TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: 'Fira Code', monospace; overflow: hidden; }
        .scanline { width: 100%; height: 2px; background: rgba(0, 112, 243, 0.05); position: fixed; animation: scan 4s linear infinite; z-index: 100; pointer-events: none; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        
        /* Subtle Success Flash */
        .success-flash { animation: flash-green 0.5s ease-out; }
        @keyframes flash-green { 0% { background-color: rgba(34, 197, 94, 0.2); } 100% { background-color: transparent; } }

        .floating-window { display: none; position: fixed; top: 15%; right: 2%; z-index: 50; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="text-xs border-t-2 border-blue-600">
    <div class="scanline"></div>

    <nav class="bg-black/95 p-3 border-b border-white/10 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <div class="px-2 py-0.5 border border-blue-500 text-blue-500 font-bold text-[8px] tracking-tighter">CIA_RAPID_v3</div>
            <h1 class="tracking-[0.2em] uppercase font-bold text-white text-[10px]">High-Speed Elimination Terminal</h1>
        </div>
        <button onclick="toggleEliminated()" class="text-red-500 border border-red-500/30 px-3 py-1 hover:bg-red-500/10 font-bold uppercase text-[9px]">
            [ REGISTRY ]
        </button>
    </nav>

    <div class="max-w-5xl mx-auto p-4 space-y-4 h-[calc(100vh-60px)] flex flex-col">
        
        <section id="inputUnit" class="bg-zinc-900/40 border border-white/5 p-6 rounded transition-all">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-blue-500 tracking-widest uppercase font-bold text-[9px]">Input Target Code</h2>
                <span id="targetStatus" class="text-[8px] text-gray-600 font-bold">READY FOR TRANSMISSION</span>
            </div>
            
            <input type="number" id="codeInput" oninput="autoScan()" autofocus
                   placeholder="0000" 
                   class="w-full bg-black border border-white/10 p-4 outline-none focus:border-blue-500 text-blue-400 font-bold tracking-[1em] text-4xl text-center">
            
            <div id="statusReport" class="mt-4 min-h-[100px] flex items-center justify-center border border-dashed border-white/10 rounded bg-black/20 p-2">
                <p class="text-gray-700 italic uppercase tracking-widest text-[9px]">Awaiting signal...</p>
            </div>
        </section>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-hidden">
            <section class="bg-zinc-900/20 border border-white/5 rounded flex flex-col">
                <div class="bg-white/5 p-2 text-[9px] font-bold text-red-500 uppercase tracking-widest border-b border-white/5 px-4">Recent Eliminations</div>
                <div id="recentLogs" class="flex-1 p-4 overflow-y-auto space-y-1 text-red-400 font-mono text-[9px]">
                    <p class="opacity-30 italic">No activity logs found.</p>
                </div>
            </section>

            <section class="bg-zinc-900/20 border border-white/5 rounded flex flex-col">
                <div class="bg-white/5 p-2 text-[9px] font-bold text-amber-500 uppercase tracking-widest border-b border-white/5 px-4">Secure Comms</div>
                <div id="chatFeed" class="flex-1 p-4 overflow-y-auto space-y-1 bg-black/10 text-[9px] text-amber-500/80"></div>
                <div class="p-2 border-t border-white/5 flex gap-1">
                    <input type="text" id="chatMsg" placeholder="..." class="flex-1 bg-black border border-white/10 p-1.5 outline-none text-amber-500 uppercase text-[9px]">
                    <button onclick="sendMsg()" class="bg-amber-600 px-3 py-1 font-bold text-black text-[9px] uppercase hover:bg-amber-500">SEND</button>
                </div>
            </section>
        </div>
    </div>

    <div id="eliminatedWindow" class="floating-window w-72 bg-black border border-red-500 shadow-2xl">
        <div class="bg-red-900/40 p-2 border-b border-red-500 flex justify-between text-[10px] font-bold text-red-500 uppercase">
            <span>Eliminated Database</span>
            <button onclick="toggleEliminated()">[X]</button>
        </div>
        <div id="eliminatedList" class="p-4 max-h-80 overflow-y-auto space-y-1 text-red-500 text-center font-bold tracking-widest"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot, serverTimestamp, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e",
            measurementId: "G-150YYLS5FP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rdb = getDatabase(app);

        const codeInput = document.getElementById('codeInput');
        const report = document.getElementById('statusReport');
        const targetStatus = document.getElementById('targetStatus');

        // --- RAPID SCANNER ---
        window.autoScan = async () => {
            const code = codeInput.value;

            if (code.length < 4) {
                report.innerHTML = '<p class="text-gray-700 italic uppercase text-[9px]">Scanning signal strength...</p>';
                targetStatus.innerText = "WAITING FOR INPUT";
                return;
            }

            targetStatus.innerText = "INQUIRING DATABASE...";
            const q = query(collection(db, "eliminated_codes"), where("code", "==", code));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                targetStatus.innerText = "TARGET IDENTIFIED: UNKNOWN";
                report.innerHTML = `
                    <div class="text-center w-full">
                        <button onclick="initiateElimination('${code}')" class="bg-red-600 w-full py-4 text-white font-black uppercase tracking-widest hover:bg-red-700 transition-all border-b-4 border-red-900 active:border-b-0 active:translate-y-1">
                            ELIMINATE TARGET CODE: ${code}
                        </button>
                    </div>`;
            } else {
                targetStatus.innerText = "TARGET IDENTIFIED: ELIMINATED";
                report.innerHTML = `
                    <div class="text-center p-3 border border-red-600 bg-red-600/5 w-full">
                        <p class="text-red-600 font-black tracking-widest text-lg uppercase">ALREADY ELIMINATED</p>
                        <p class="text-gray-500 text-[8px] uppercase tracking-tighter italic">Cannot eliminate a neutralized target.</p>
                    </div>`;
            }
        };

        // --- RAPID ELIMINATION (No Blocking) ---
        window.initiateElimination = async (code) => {
            const inputUnit = document.getElementById('inputUnit');
            
            try {
                // Save to Firestore
                await addDoc(collection(db, "eliminated_codes"), {
                    code: code,
                    timestamp: serverTimestamp()
                });

                // Subtle Visual Feedback
                inputUnit.classList.add('success-flash');
                setTimeout(() => inputUnit.classList.remove('success-flash'), 500);

                // Quick reset for next number
                codeInput.value = "";
                codeInput.focus();
                autoScan();

            } catch (err) {
                alert("Comm-Link Failed.");
            }
        };

        // --- UI & LOGS ---
        window.toggleEliminated = () => {
            const win = document.getElementById('eliminatedWindow');
            win.style.display = win.style.display === 'block' ? 'none' : 'block';
        };

        // Live Archive
        onSnapshot(collection(db, "eliminated_codes"), (snap) => {
            const list = document.getElementById('eliminatedList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const item = document.createElement('div');
                item.className = "border-b border-red-900/10 py-1 uppercase tracking-widest text-[10px]";
                item.innerText = `ID: ${doc.data().code}`;
                list.appendChild(item);
            });
        });

        // Live Activity Logs (Huling 10)
        const qRecent = query(collection(db, "eliminated_codes"), orderBy("timestamp", "desc"), limit(10));
        onSnapshot(qRecent, (snap) => {
            const logDiv = document.getElementById('recentLogs');
            logDiv.innerHTML = "";
            snap.forEach(doc => {
                const p = document.createElement('p');
                p.className = "mb-1 border-b border-white/5 pb-1 flex justify-between";
                const time = doc.data().timestamp?.toDate().toLocaleTimeString() || "SYNCING";
                p.innerHTML = `<span>[${time}] TARGET: ${doc.data().code}</span> <span class="text-white">NEUTRALIZED</span>`;
                logDiv.appendChild(p);
            });
        });

        // --- COMMS ---
        window.sendMsg = () => {
            const input = document.getElementById('chatMsg');
            if (input.value.trim()) {
                push(ref(rdb, 'secure_comms'), { text: input.value.toUpperCase(), time: Date.now() });
                input.value = "";
            }
        };

        onChildAdded(ref(rdb, 'secure_comms'), (snap) => {
            const data = snap.val();
            const div = document.createElement('div');
            div.className = "mb-1 border-l border-amber-800 pl-2";
            div.innerHTML = `<span class="opacity-50 text-[7px] block">${new Date(data.time).toLocaleTimeString()}</span><span class="tracking-widest uppercase">${data.text}</span>`;
            document.getElementById('chatFeed').appendChild(div);
            document.getElementById('chatFeed').scrollTop = document.getElementById('chatFeed').scrollHeight;
        });

    </script>
</body>
</html>
