<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GATEWAY_v7.0_PROHIBITED</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #01080b; --panel: #051218; --cyan: #00f3ff; --red: #ff003c; 
      --blue: #007bff; --green: #00ff66; --gray: #333; --border: rgba(0, 243, 255, 0.15); 
      --mono: 'Share Tech Mono', monospace; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header { padding: 4px 12px; height: 35px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #000; font-family: var(--mono); }
    .ticker { font-size: 9px; color: var(--cyan); padding: 3px 12px; border-bottom: 1px solid var(--border); opacity: 0.7; letter-spacing: 1px; }

    main { flex: 1; padding: 12px; overflow-y: auto; padding-bottom: 70px; }
    .search-box { background: var(--panel); border: 1px solid var(--border); padding: 15px; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    
    #mission-input { 
      width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--cyan); 
      font-family: var(--mono); font-size: 28px; padding: 10px; text-align: center; 
      letter-spacing: 5px; outline: none; margin-bottom: 15px;
    }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 14px; font-family: var(--mono); font-size: 13px; font-weight: bold; border: 1px solid; background: transparent; text-transform: uppercase; cursor: pointer; transition: 0.3s; border-radius: 2px; }
    
    /* Dynamic Button States */
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { background: var(--blue) !important; border-color: var(--blue) !important; color: #fff !important; box-shadow: 0 0 10px rgba(0,123,255,0.3); }
    .btn-prohibited { background: var(--gray) !important; border-color: #444 !important; color: #777 !important; cursor: not-allowed !important; opacity: 0.8; box-shadow: none !important; }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    #terminal { background: #000; border: 1px solid #111; padding: 10px; font-family: var(--mono); font-size: 10px; min-height: 120px; color: #444; margin-top: 15px; overflow-y: auto; line-height: 1.4; border-radius: 2px; }
    
    #res-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--panel); border: 1px solid var(--cyan); width: 100%; max-width: 320px; padding: 30px 15px 20px; position: relative; }
    .modal-close { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; border: none; padding: 8px 12px; font-family: var(--mono); cursor: pointer; }
    .data-row { margin-bottom: 10px; font-family: var(--mono); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
    .data-label { font-size: 10px; color: #666; text-transform: uppercase; display: block; }
    .data-val { font-size: 15px; color: var(--cyan); }

    nav { position: fixed; bottom: 0; left: 0; right: 0; height: 55px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
    .nav-item { display: flex; align-items: center; justify-content: center; color: #333; font-size: 11px; font-family: var(--mono); }
    .nav-item.active { color: var(--cyan); background: rgba(0,243,255,0.05); }
  </style>
</head>
<body>

<header>
  <span>LOCKDOWN_v7.0</span>
  <span id="clock" style="color:var(--cyan)">00:00:00</span>
</header>
<div class="ticker">SECURITY: HIGH // BLACKLIST_PRIORITY: ACTIVE // STATUS: ARMED</div>

<main>
  <div class="search-box">
    <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="term-btn" class="btn btn-terminate">TERMINATE</button>
    </div>
  </div>

  <div id="terminal">> WAITING_FOR_UPLINK...</div>
</main>

<div id="res-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeM()">X</button>
    <div class="data-row"><span class="data-label">Mission ID</span><span class="data-val" id="r-id">#00000</span></div>
    <div class="data-row"><span class="data-label">V-Agent</span><span class="data-val" id="r-agent">--</span></div>
    <div class="data-row"><span class="data-label">Expenses</span><span class="data-val" id="r-exp">--</span></div>
    <div class="data-row"><span class="data-label">Deployed</span><span class="data-val" id="r-dep">--</span></div>
    <div class="data-row"><span class="data-label">Expiration</span><span class="data-val" id="r-expir" style="color:var(--red)">--</span></div>
    <div class="data-row" style="border:none; text-align:center; margin-top:15px;"><span class="data-val" id="r-stat">--</span></div>
  </div>
</div>

<nav>
  <div class="nav-item active">GATEWAY</div>
  <div class="nav-item">SECURITY</div>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:d996e585751d5087cd442e",
    measurementId: "G-ZSV1PYKPZQ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const termBtn = document.getElementById('term-btn');
  const termLog = document.getElementById('terminal');
  
  let currentData = null;
  let accessStatus = "NEW"; // NEW, PROHIBITED, AUTHORIZED

  // --- AUTO SEARCH LOGIC ---
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    if (val.length >= 4) {
      log(`SCANNING DATABASE: ${val}...`, 'cyan');
      try {
        // 1. PRIORITY SEARCH: BLACKLIST
        const qB = query(collection(db, "blacklist"), where("targetID", "==", val));
        const sB = await getDocs(qB);
        
        if (!sB.empty) {
          accessStatus = "PROHIBITED";
          updateButton("PROHIBITED", "btn-prohibited");
          log(`[ACCESS DENIED] ID ${val} IS PROHIBITED.`, 'red');
          return;
        }

        // 2. SECONDARY SEARCH: MISSION ORDERS
        const qM = query(collection(db, "mission_orders"), where("orderNumber", "==", val));
        const sM = await getDocs(qM);

        if (!sM.empty) {
          const data = sM.docs[0].data();
          const expDate = data.expirationDate.toDate ? data.expirationDate.toDate() : new Date(data.expirationDate);
          
          // AUTO-MIGRATION IF EXPIRED
          if (new Date() > expDate) {
            log(`[EXPIRATION DETECTED] MIGRATING ${val}...`, 'red');
            await addDoc(collection(db, "blacklist"), { targetID: val, reason: "AUTO_EXPIRY", timestamp: serverTimestamp() });
            accessStatus = "PROHIBITED";
            updateButton("PROHIBITED", "btn-prohibited");
            log(`[LOCKED] ${val} HAS BEEN MOVED TO BLACKLIST.`, 'red');
          } else {
            accessStatus = "AUTHORIZED";
            currentData = data;
            updateButton("RETRIEVE", "btn-retrieve");
            log(`[MATCH FOUND] MISSION ${val} IS ACTIVE.`, 'blue');
          }
        } else {
          accessStatus = "NEW";
          updateButton("SAVE", "btn-save");
          log(`ID ${val} CLEAR. READY FOR ARCHIVE.`, 'green');
        }
      } catch (err) { log(`SCAN_ERR: ${err.message}`, 'red'); }
    } else { resetUI(); }
  });

  function updateButton(text, className) {
    actionBtn.textContent = text;
    actionBtn.className = `btn ${className}`;
  }

  function resetUI() {
    accessStatus = "NEW";
    updateButton("SAVE", "btn-save");
    currentData = null;
  }

  // --- ACTION HANDLER ---
  actionBtn.addEventListener('click', async () => {
    if (accessStatus === "PROHIBITED") return; // Block any action if prohibited

    const val = input.value.trim();
    if (val.length < 4) return;

    if (accessStatus === "AUTHORIZED") {
      showModal();
    } else {
      // SAVE LOGIC
      log(`SAVING MISSION DATA...`, 'green');
      try {
        const depDate = new Date();
        const expDate = new Date();
        expDate.setDate(depDate.getDate() + 30);

        await addDoc(collection(db, "mission_orders"), {
          orderNumber: val,
          vAgent: "V-" + Math.floor(1000 + Math.random() * 9000),
          expenses: "₱" + (Math.floor(Math.random() * 6000) + 2000).toLocaleString(),
          deploymentDate: depDate,
          expirationDate: expDate,
          timestamp: serverTimestamp()
        });
        log(`SUCCESS: ${val} REGISTERED.`, 'green');
        input.value = ""; resetUI();
      } catch (e) { log(`SAVE_ERR`, 'red'); }
    }
  });

  // --- TERMINATE BUTTON ---
  termBtn.addEventListener('click', async () => {
    const val = input.value.trim();
    if (val.length < 4 || !confirm(`BLACKLIST MISSION #${val}?`)) return;
    try {
      await addDoc(collection(db, "blacklist"), { targetID: val, reason: "MANUAL", timestamp: serverTimestamp() });
      log(`ID ${val} BLACKLISTED.`, 'red');
      input.value = ""; resetUI();
    } catch (e) { log("TERM_ERR", "red"); }
  });

  function showModal() {
    document.getElementById('r-id').textContent = `#${input.value}`;
    const dep = currentData.deploymentDate.toDate ? currentData.deploymentDate.toDate() : new Date(currentData.deploymentDate);
    const exp = currentData.expirationDate.toDate ? currentData.expirationDate.toDate() : new Date(currentData.expirationDate);
    
    document.getElementById('r-agent').textContent = currentData.vAgent;
    document.getElementById('r-exp').textContent = currentData.expenses;
    document.getElementById('r-dep').textContent = dep.toLocaleDateString();
    document.getElementById('r-expir').textContent = exp.toLocaleDateString();
    document.getElementById('r-stat').textContent = "ACCESS: AUTHORIZED";
    document.getElementById('r-stat').style.color = "var(--green)";
    document.getElementById('res-modal').style.display = 'flex';
  }

  window.closeM = () => document.getElementById('res-modal').style.display = 'none';
  function log(m, c) {
    const d = document.createElement('div'); d.style.color = `var(--${c})`;
    d.textContent = `[${new Date().toLocaleTimeString('en-GB')}] > ${m}`;
    termLog.prepend(d);
  }
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
