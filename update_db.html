<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPDATE_DB - STATUS MANAGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 580px;
            width: 100%;
            background: #051014;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(0,243,255,0.1);
        }
        h2 {
            color: #00f3ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 18px;
        }
        .agents-section {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #1a2f37;
        }
        .section-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #05ffa1;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 15px;
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 30px;
            transition: 0.2s;
        }
        .radio-group input[type="radio"] {
            accent-color: #00f3ff;
            width: 16px;
            height: 16px;
        }
        .radio-group label:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.15);
            color: #00f3ff;
        }
        .dropdown-section {
            margin-bottom: 25px;
        }
        .dropdown-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }
        select {
            width: 100%;
            background: #01080b;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            padding: 14px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            border-radius: 8px;
            outline: none;
            text-align: center;
            cursor: pointer;
        }
        select:focus {
            border-color: #00f3ff;
        }
        .status-section {
            background: #000;
            border: 1px solid #1a2f37;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .status-title {
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }
        .status-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .status-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 20px;
            background: #01080b;
            border: 1px solid #1a2f37;
            border-radius: 40px;
            transition: 0.2s;
        }
        .status-option input {
            accent-color: #00f3ff;
            width: 16px;
            height: 16px;
        }
        .status-option span {
            color: #05ffa1;
            font-size: 12px;
            font-weight: bold;
        }
        .status-option:has(input:checked) {
            border-color: #00f3ff;
            background: rgba(0,243,255,0.1);
        }
        .status-option:has(input:checked) span {
            color: #00f3ff;
        }
        .status-option.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .update-section {
            text-align: center;
        }
        .update-btn {
            width: 100%;
            background: #00f3ff;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }
        .update-btn:hover {
            background: #05ffa1;
            box-shadow: 0 0 15px rgba(5,255,161,0.4);
        }
        .update-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-msg {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
        }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
        .warning { color: #ffbd00; }
        .loading, .empty {
            text-align: center;
            color: #5c7882;
            padding: 20px;
        }
        .info-badge {
            display: inline-block;
            background: #1a2f37;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 8px;
            color: #00f3ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 STATUS MANAGER</h2>

        <!-- AGENTS SECTION (Top Center) -->
        <div class="agents-section">
            <div class="section-title">📡 SELECT AGENT</div>
            <div id="agentRadioGroup" class="radio-group">
                <div class="loading">Loading agents...</div>
            </div>
        </div>

        <!-- SINGLE DROPDOWN -->
        <div class="dropdown-section">
            <div class="dropdown-title">🔽 SELECT DEVICE / CATEGORY</div>
            <select id="mainDropdown" disabled>
                <option value="">-- SELECT --</option>
            </select>
        </div>

        <!-- STATUS RADIO BUTTONS (3 options) -->
        <div class="status-section">
            <div class="status-title">📌 SELECT STATUS ACTION</div>
            <div class="status-options" id="statusOptions">
                <label class="status-option">
                    <input type="radio" name="status" value="ACTIVE">
                    <span>🟢 ACTIVE</span>
                </label>
                <label class="status-option">
                    <input type="radio" name="status" value="TERMINATED">
                    <span>🔴 TERMINATED</span>
                </label>
                <label class="status-option">
                    <input type="radio" name="status" value="BLACKLIST">
                    <span>⚫ BLACKLIST</span>
                </label>
            </div>
        </div>

        <!-- UPDATE BUTTON -->
        <div class="update-section">
            <button id="updateBtn" class="update-btn" disabled>💾 SAVE TO DATABASE</button>
        </div>

        <div class="status-msg" id="statusMsg">Ready</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // DOM Elements
        const agentRadioGroup = document.getElementById('agentRadioGroup');
        const mainDropdown = document.getElementById('mainDropdown');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('statusMsg');
        const statusRadios = document.querySelectorAll('input[name="status"]');

        let allAgents = [];
        let currentAgent = null;
        let dropdownOptions = [];
        let weaponData = {};
        let blacklistData = { count: 0, items: [] };

        // ========== LOAD AGENTS ==========
        async function loadAgents() {
            statusMsg.innerHTML = '⏳ Loading agents...';
            agentRadioGroup.innerHTML = '<div class="loading">Loading agents...</div>';
            
            try {
                const snapshot = await db.collection("mission_orders").get();
                const agentSet = new Set();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.agent && data.agent.trim() !== '') {
                        agentSet.add(data.agent);
                    }
                });
                
                allAgents = Array.from(agentSet).sort();
                
                if (allAgents.length === 0) {
                    agentRadioGroup.innerHTML = '<div class="empty">⚠️ No agents found</div>';
                    statusMsg.innerHTML = '<span class="error">No agents found. Please create missions first.</span>';
                } else {
                    renderAgentRadios();
                    statusMsg.innerHTML = `<span class="success">✅ Loaded ${allAgents.length} agent(s)</span>`;
                }
            } catch (error) {
                agentRadioGroup.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                statusMsg.innerHTML = `<span class="error">❌ Failed to load agents</span>`;
            }
        }

        function renderAgentRadios() {
            agentRadioGroup.innerHTML = '';
            allAgents.forEach(agent => {
                const label = document.createElement('label');
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'agent';
                radio.value = agent;
                radio.onclick = () => selectAgent(agent);
                
                label.appendChild(radio);
                label.appendChild(document.createTextNode(` ${agent}`));
                agentRadioGroup.appendChild(label);
            });
        }

        // ========== SELECT AGENT: BUILD DROPDOWN ==========
        async function selectAgent(agent) {
            currentAgent = agent;
            statusMsg.innerHTML = `⏳ Loading data for ${agent}...`;
            
            mainDropdown.disabled = true;
            mainDropdown.innerHTML = '<option value="">Loading...</option>';
            updateBtn.disabled = true;
            statusRadios.forEach(r => r.checked = false);
            
            document.querySelectorAll('.status-option').forEach(opt => {
                opt.classList.remove('disabled');
            });
            
            try {
                const snapshot = await db.collection("mission_orders")
                    .where("agent", "==", agent)
                    .get();
                
                // Collect weapon systems with their vAgent counts
                const weaponMap = new Map();
                let totalNoVAgent = 0;
                let noVAgentMissions = [];
                let blacklistItems = []; // For BLACKLIST: find documents with "blacklist" field
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const weapon = data.weaponSystem;
                    const vAgent = data.vAgentID;
                    const missionID = data.missionID;
                    const blacklistValue = data.blacklist; // field name "blacklist" sa database
                    
                    if (!weapon || weapon === 'INIT') return;
                    
                    if (!weaponMap.has(weapon)) {
                        weaponMap.set(weapon, { vAgentCount: 0, missionOrders: [], hasVAgent: false });
                    }
                    const info = weaponMap.get(weapon);
                    
                    if (vAgent && vAgent !== '' && vAgent !== 'INIT') {
                        info.vAgentCount++;
                        info.hasVAgent = true;
                        info.missionOrders.push({ missionID, vAgent, weapon });
                    } else {
                        totalNoVAgent++;
                        noVAgentMissions.push({ missionID, weapon });
                    }
                    
                    // Collect blacklist items (documents with "blacklist" field)
                    if (blacklistValue && blacklistValue !== '') {
                        blacklistItems.push({
                            targetID: blacklistValue,
                            missionID: missionID,
                            weaponSystem: weapon
                        });
                    }
                });
                
                // Store blacklist data globally
                blacklistData = {
                    count: blacklistItems.length,
                    items: blacklistItems
                };
                
                // Build dropdown options
                dropdownOptions = [];
                weaponData = {};
                
                // Device options (only those with vAgent)
                let deviceIndex = 1;
                for (const [weapon, info] of weaponMap.entries()) {
                    if (info.hasVAgent) {
                        const displayName = `Device ${deviceIndex} (${weapon}) - ${info.vAgentCount} vAgent(s)`;
                        dropdownOptions.push({
                            value: `device_${deviceIndex}`,
                            display: displayName,
                            type: 'device',
                            weaponSystem: weapon,
                            count: info.vAgentCount,
                            missionOrders: info.missionOrders
                        });
                        weaponData[`device_${deviceIndex}`] = { weaponSystem: weapon, missionOrders: info.missionOrders };
                        deviceIndex++;
                    }
                }
                
                // No Assign Agent# option
                if (totalNoVAgent > 0) {
                    dropdownOptions.push({
                        value: 'no_agent',
                        display: `⚠️ No Assign Agent# - ${totalNoVAgent} mission(s) without vAgent`,
                        type: 'no_agent',
                        count: totalNoVAgent,
                        missionOrders: noVAgentMissions
                    });
                    weaponData['no_agent'] = { missionOrders: noVAgentMissions };
                }
                
                // BLACKLIST option - only show if there are blacklist items
                if (blacklistItems.length > 0) {
                    dropdownOptions.push({
                        value: 'blacklist',
                        display: `⚫ BLACKLIST - ${blacklistItems.length} target(s) found`,
                        type: 'blacklist',
                        count: blacklistItems.length,
                        items: blacklistItems
                    });
                    weaponData['blacklist'] = { items: blacklistItems };
                }
                
                // Add default option at the beginning
                dropdownOptions.unshift({ value: '', display: '-- SELECT --', type: 'default' });
                
                // Populate dropdown
                mainDropdown.innerHTML = '';
                dropdownOptions.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt.value;
                    option.textContent = opt.display;
                    option.setAttribute('data-type', opt.type);
                    mainDropdown.appendChild(option);
                });
                mainDropdown.disabled = false;
                
                // Add event listener to update status options based on selection
                mainDropdown.onchange = updateStatusOptionsBasedOnSelection;
                
                statusMsg.innerHTML = `<span class="success">✅ Loaded ${dropdownOptions.length - 1} option(s) for ${agent}</span>`;
                
            } catch (error) {
                console.error("Error loading data:", error);
                statusMsg.innerHTML = `<span class="error">❌ Failed to load data: ${error.message}</span>`;
            }
        }

        function updateStatusOptionsBasedOnSelection() {
            const selectedValue = mainDropdown.value;
            const selectedOption = dropdownOptions.find(opt => opt.value === selectedValue);
            
            // Reset all status options to enabled
            const statusLabels = document.querySelectorAll('.status-option');
            statusLabels.forEach(label => {
                label.classList.remove('disabled');
                const radio = label.querySelector('input');
                if (radio) radio.disabled = false;
            });
            
            // If "No Assign Agent#" is selected, disable ACTIVE and BLACKLIST
            if (selectedOption && selectedOption.type === 'no_agent') {
                const activeLabel = document.querySelector('.status-option input[value="ACTIVE"]')?.closest('.status-option');
                const blacklistLabel = document.querySelector('.status-option input[value="BLACKLIST"]')?.closest('.status-option');
                if (activeLabel) {
                    activeLabel.classList.add('disabled');
                    activeLabel.querySelector('input').disabled = true;
                    if (document.querySelector('input[name="status"]:checked')?.value === 'ACTIVE') {
                        document.querySelector('input[name="status"]:checked').checked = false;
                    }
                }
                if (blacklistLabel) {
                    blacklistLabel.classList.add('disabled');
                    blacklistLabel.querySelector('input').disabled = true;
                    if (document.querySelector('input[name="status"]:checked')?.value === 'BLACKLIST') {
                        document.querySelector('input[name="status"]:checked').checked = false;
                    }
                }
                statusMsg.innerHTML = '<span class="warning">⚠️ "No Assign Agent#" can only be TERMINATED</span>';
            } 
            // If "BLACKLIST" is selected, disable ACTIVE (only TERMINATED allowed)
            else if (selectedOption && selectedOption.type === 'blacklist') {
                const activeLabel = document.querySelector('.status-option input[value="ACTIVE"]')?.closest('.status-option');
                if (activeLabel) {
                    activeLabel.classList.add('disabled');
                    activeLabel.querySelector('input').disabled = true;
                    if (document.querySelector('input[name="status"]:checked')?.value === 'ACTIVE') {
                        document.querySelector('input[name="status"]:checked').checked = false;
                    }
                }
                statusMsg.innerHTML = '<span class="warning">⚠️ BLACKLIST items will be saved to TERMINATED_INFO</span>';
            }
            else if (selectedOption && selectedOption.type === 'device') {
                statusMsg.innerHTML = `📌 Selected: ${selectedOption.display}`;
            } else {
                statusMsg.innerHTML = 'Select an option and status';
            }
            
            // Enable update button if something is selected
            updateBtn.disabled = (selectedValue === '' || selectedValue === '-- SELECT --');
        }

        // ========== SAVE TO DATABASE ==========
        async function saveToDatabase() {
            if (!currentAgent) {
                statusMsg.innerHTML = '<span class="error">❌ No agent selected</span>';
                return;
            }
            
            const selectedValue = mainDropdown.value;
            if (!selectedValue || selectedValue === '-- SELECT --') {
                statusMsg.innerHTML = '<span class="error">❌ Please select a device/category</span>';
                return;
            }
            
            let selectedStatus = null;
            statusRadios.forEach(radio => {
                if (radio.checked && !radio.disabled) selectedStatus = radio.value;
            });
            
            if (!selectedStatus) {
                statusMsg.innerHTML = '<span class="error">❌ Please select ACTIVE, TERMINATED, or BLACKLIST</span>';
                return;
            }
            
            const selectedOption = dropdownOptions.find(opt => opt.value === selectedValue);
            
            // Validation rules
            if (selectedOption.type === 'no_agent' && selectedStatus !== 'TERMINATED') {
                statusMsg.innerHTML = '<span class="error">❌ "No Assign Agent#" can only be TERMINATED</span>';
                return;
            }
            
            if (selectedOption.type === 'blacklist') {
                // BLACKLIST always goes to terminated_info
                selectedStatus = 'TERMINATED';
            }
            
            // Confirm action
            if (!confirm(`Confirm action:\n\nAgent: ${currentAgent}\nSelection: ${selectedOption.display}\nAction: ${selectedStatus}\n\nThis will save to Firebase database.`)) {
                return;
            }
            
            statusMsg.innerHTML = `⏳ Processing...`;
            updateBtn.disabled = true;
            
            try {
                if (selectedOption.type === 'blacklist') {
                    // Save blacklist items to terminated_info
                    await saveBlacklistToTerminated(selectedOption);
                } else {
                    // Save mission orders to active_info or terminated_info
                    await saveMissionOrders(selectedOption, selectedStatus);
                }
                
                statusMsg.innerHTML = `<span class="success">✅ SUCCESS: Saved "${selectedOption.display}" as ${selectedStatus}</span>`;
                
            } catch (error) {
                console.error("Error saving:", error);
                statusMsg.innerHTML = `<span class="error">❌ ERROR: ${error.message}</span>`;
            } finally {
                updateBtn.disabled = false;
            }
        }

        async function saveMissionOrders(selectedOption, status) {
            const collectionName = (status === 'ACTIVE') ? 'active_info' : 'terminated_info';
            const missionOrders = selectedOption.missionOrders;
            
            if (!missionOrders || missionOrders.length === 0) {
                throw new Error('No mission orders found for this selection');
            }
            
            const batch = db.batch();
            const timestamp = firebase.firestore.FieldValue.serverTimestamp();
            
            for (const order of missionOrders) {
                const docId = `${currentAgent}_${order.missionID}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                const docRef = db.collection(collectionName).doc(docId);
                
                batch.set(docRef, {
                    agent: currentAgent,
                    missionID: order.missionID,
                    weaponSystem: selectedOption.weaponSystem || order.weapon || 'N/A',
                    vAgent: order.vAgent || null,
                    status: status,
                    timestamp: timestamp,
                    sourceType: selectedOption.type,
                    savedBy: 'status_manager'
                });
            }
            
            await batch.commit();
            
            // Summary document
            const summaryId = `${currentAgent}_${selectedOption.value}_${Date.now()}`;
            await db.collection(collectionName).doc(summaryId).set({
                agent: currentAgent,
                selection: selectedOption.value,
                display: selectedOption.display,
                count: missionOrders.length,
                status: status,
                timestamp: timestamp,
                isSummary: true
            });
            
            console.log(`Saved ${missionOrders.length} mission orders to ${collectionName}`);
        }

        async function saveBlacklistToTerminated(selectedOption) {
            const collectionName = 'terminated_info';
            const blacklistItems = selectedOption.items;
            
            if (!blacklistItems || blacklistItems.length === 0) {
                throw new Error('No blacklist items found');
            }
            
            const batch = db.batch();
            const timestamp = firebase.firestore.FieldValue.serverTimestamp();
            
            for (const item of blacklistItems) {
                const docId = `${currentAgent}_blacklist_${item.targetID}_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                const docRef = db.collection(collectionName).doc(docId);
                
                batch.set(docRef, {
                    agent: currentAgent,
                    targetID: item.targetID,
                    missionID: item.missionID,
                    weaponSystem: item.weaponSystem,
                    status: 'TERMINATED',
                    sourceType: 'blacklist',
                    timestamp: timestamp,
                    savedBy: 'status_manager'
                });
            }
            
            await batch.commit();
            
            // Summary document
            const summaryId = `${currentAgent}_blacklist_summary_${Date.now()}`;
            await db.collection(collectionName).doc(summaryId).set({
                agent: currentAgent,
                selection: 'blacklist',
                display: `BLACKLIST - ${blacklistItems.length} target(s)`,
                count: blacklistItems.length,
                status: 'TERMINATED',
                timestamp: timestamp,
                isSummary: true
            });
            
            console.log(`Saved ${blacklistItems.length} blacklist items to ${collectionName}`);
        }

        // Event listener for update button
        updateBtn.onclick = saveToDatabase;

        // Load agents on page load
        loadAgents();
    </script>
</body>
</html>
