<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPDATE_DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #01080b;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #051014;
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0,243,255,0.1);
        }
        h2 {
            color: #00f3ff;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
            font-size: 18px;
        }
        .field-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #00f3ff;
            font-size: 11px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #1a2f37;
            color: #05ffa1;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
            border-radius: 6px;
        }
        select:focus, input:focus {
            border-color: #00f3ff;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #00f3ff;
            color: #000;
            border: none;
            font-weight: bold;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 6px;
            transition: 0.3s;
        }
        button:hover {
            background: #05ffa1;
            box-shadow: 0 0 15px rgba(5,255,161,0.3);
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #5c7882;
            border-top: 1px solid #1a2f37;
        }
        .success { color: #05ffa1; }
        .error { color: #ff003c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 AGENT KEY MANAGER</h2>

        <div class="field-group">
            <label>SELECT AGENT</label>
            <select id="agentSelect">
                <option value="AGENT_JFSN">AGENT_JFSN</option>
                <option value="AGENT_LZ">AGENT_LZ</option>
            </select>
        </div>

        <div class="field-group">
            <label>4-DIGIT SECRET KEY</label>
            <input type="text" id="secretKey" maxlength="4" placeholder="0000" autocomplete="off">
        </div>

        <button id="updateBtn">💾 UPDATE DATABASE</button>

        <div class="status" id="statusMsg">Ready to update</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // DOM Elements
        const agentSelect = document.getElementById('agentSelect');
        const secretKeyInput = document.getElementById('secretKey');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('statusMsg');

        // Function to update database
        async function updateAgentKey() {
            const agent = agentSelect.value;
            const newKey = secretKeyInput.value.trim();

            // Validate 4-digit
            if (!/^\d{4}$/.test(newKey)) {
                statusMsg.innerHTML = '<span class="error">❌ Invalid: Must be exactly 4 digits</span>';
                return;
            }

            statusMsg.innerHTML = '⏳ Updating database...';
            updateBtn.disabled = true;

            try {
                // Update the agent document in Firestore
                await db.collection("agents").doc(agent).set({
                    agentName: agent,
                    secretKey: newKey,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                statusMsg.innerHTML = `<span class="success">✅ SUCCESS: ${agent} key updated to ${newKey}</span>`;
                secretKeyInput.value = '';
            } catch (error) {
                statusMsg.innerHTML = `<span class="error">❌ ERROR: ${error.message}</span>`;
            } finally {
                updateBtn.disabled = false;
            }
        }

        // Event listener
        updateBtn.onclick = updateAgentKey;

        // Optional: Load existing key when agent changes
        async function loadExistingKey() {
            const agent = agentSelect.value;
            try {
                const docRef = await db.collection("agents").doc(agent).get();
                if (docRef.exists) {
                    const data = docRef.data();
                    if (data.secretKey) {
                        secretKeyInput.value = data.secretKey;
                        statusMsg.innerHTML = `📋 Loaded existing key for ${agent}`;
                    } else {
                        secretKeyInput.value = '';
                        statusMsg.innerHTML = `📋 No existing key for ${agent}`;
                    }
                } else {
                    secretKeyInput.value = '';
                    statusMsg.innerHTML = `📋 New agent: ${agent}`;
                }
            } catch (error) {
                console.error("Error loading key:", error);
            }
        }

        agentSelect.onchange = loadExistingKey;
        loadExistingKey();
    </script>
</body>
</html>
