<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_NETWORK // SECURE_ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon: #00f3ff; --bg: #01080b; --red: #ff003c; 
            --border: rgba(0, 243, 255, 0.15);
            --font-mono: 'Share Tech Mono', monospace;
            --font-main: 'Rajdhani', sans-serif;
            --font-doc: 'Special Elite', cursive;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: #e1f5f9; font-family: var(--font-mono); 
            height: 100vh; overflow: hidden; padding: 15px;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; overflow-y: auto; padding-bottom: 80px; }

        /* DEVICE GRID */
        #deviceGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; perspective: 1000px; padding: 20px 10px; }
        .phone-wrapper { display: flex; flex-direction: column; align-items: center; }
        .phone-container { width: 100px; height: 180px; position: relative; cursor: pointer; transition: 0.8s; transform-style: preserve-3d; }
        .phone-body { width: 100%; height: 100%; background: #0a0a0a; border: 3px solid #1a1a1a; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
        .phone-screen { width: 90%; height: 92%; background: #000; border-radius: 10px; }
        .phone-container.booting .phone-screen { background: var(--neon); box-shadow: 0 0 30px var(--neon); }
        .phone-label { margin-top: 10px; font-family: var(--font-main); font-weight: bold; color: var(--neon); font-size: 13px; }

        /* MEMOIRS BUTTON */
        .memoirs-section { padding: 40px 10px; text-align: center; border-top: 1px dashed var(--border); }
        .memoirs-btn { 
            background: none; border: 1px solid var(--neon); color: var(--neon); 
            padding: 15px 40px; font-family: var(--font-main); font-weight: 800;
            letter-spacing: 5px; cursor: pointer; transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .memoirs-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        /* CINEMATIC CREDITS (OLD FILM) */
        #creditsOverlay { 
            display: none; position: fixed; inset: 0; background: #000; z-index: 2000;
            flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .film-grain {
            position: absolute; inset: 0; pointer-events: none;
            background-image: url('https://media.giphy.com/media/oEI9uWUicT3hu/giphy.gif'); /* Film dust effect */
            opacity: 0.05; mix-blend-mode: screen;
        }
        .credit-scene {
            text-align: center; animation: scrollUp 5s linear forwards;
            opacity: 0; color: #fff; font-family: var(--font-main);
        }
        @keyframes scrollUp {
            0% { transform: translateY(100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }

        /* PAPER SHEET POPUP */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .paper-sheet {
            width: 95%; max-width: 400px; height: 80vh; background: #fdfaf0; color: #222;
            padding: 30px 20px; font-family: var(--font-doc); position: relative;
            background-image: repeating-linear-gradient(#fdfaf0 0px, #fdfaf0 24px, #e5e5e5 25px);
            overflow-y: auto; box-shadow: 0 0 50px #000;
        }

        .grand-total-banner {
            position: absolute; top: 0; left: 0; width: 100%; background: #222; color: var(--neon);
            padding: 10px; text-align: center; font-family: var(--font-mono); font-size: 14px;
            border-bottom: 2px solid var(--neon); z-index: 5;
        }

        .file-grid { display: none; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px 10px; }
        .vagent-box { width: 65px; height: 75px; background: rgba(0,243,255,0.03); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        
        nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--border); z-index: 100; }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #333; text-decoration: none; font-size: 10px; font-family: var(--font-main); }
        .nav-link.active { color: var(--neon); }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div style="padding: 20px 15px;">
        <h2 id="agentHeader" style="font-family:var(--font-main); letter-spacing:3px;">SYSTEM_ACCESS</h2>
        <div style="font-size:9px; color:var(--neon); opacity:0.6;">NETWORK_SECURED // ENCRYPTED</div>
    </div>

    <div id="deviceGrid"></div>
    <div class="file-grid" id="mainFileGrid"></div>

    <div class="memoirs-section" id="memoirSection">
        <button class="memoirs-btn" onclick="openMemoirs()">M E M O I R S</button>
    </div>
    
    <button id="btnBack" style="display:none; margin:20px; color:var(--neon); background:none; border:1px solid var(--border); padding:10px;" onclick="location.reload()">[ BACK_TO_DEVICES ]</button>
</div>

<div id="memoirOverlay" class="overlay">
    <div class="grand-total-banner">
        NETWORK_TOTAL_EXPENSES: <span id="grandTotal">₱ 0.00</span>
    </div>
    <div class="paper-sheet">
        <div onclick="closeMemoirs()" style="text-align:right; cursor:pointer; font-weight:bold; margin-bottom:20px;">[ CLOSE_REPORTS ]</div>
        <h3 style="text-align:center; text-decoration:underline;">MEMOIRS_SUMMARY</h3>
        <div id="memoir-list" style="margin-top:30px; font-size:12px;">
            </div>
    </div>
</div>

<div id="creditsOverlay">
    <div class="film-grain"></div>
    <div id="creditsContainer"></div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="intel.html" class="nav-link">INTEL</a>
    <a href="#" class="nav-link active">PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const currentAgent = localStorage.getItem("cia_agent");
    let deviceDataMap = {};

    window.onload = () => {
        if (!currentAgent) { window.location.href = "index.html"; return; }
        document.getElementById('agentHeader').innerText = "AGENT_" + currentAgent;
        loadDevices();
    };

    async function loadDevices() {
        const q = query(collection(db, "mission_orders"), where("agentName", "==", currentAgent));
        const snap = await getDocs(q);
        snap.forEach(d => {
            const data = d.data();
            const weapon = data.weaponSystem || "UNKNOWN";
            if(!deviceDataMap[weapon]) deviceDataMap[weapon] = [];
            deviceDataMap[weapon].push(data);
        });

        const grid = document.getElementById('deviceGrid');
        grid.innerHTML = Object.keys(deviceDataMap).map(name => `
            <div class="phone-wrapper" onclick="bootDevice(this, '${name}')">
                <div class="phone-container">
                    <div class="phone-body"><div class="phone-screen"></div></div>
                </div>
                <div class="phone-label">${name}</div>
            </div>
        `).join('');
    }

    window.bootDevice = (el, weaponName) => {
        el.querySelector('.phone-container').classList.add('booting');
        setTimeout(() => {
            document.getElementById('deviceGrid').style.display = 'none';
            document.getElementById('memoirSection').style.display = 'none';
            document.getElementById('mainFileGrid').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            rendervAgents(weaponName);
        }, 1500);
    };

    function rendervAgents(weaponName) {
        const fGrid = document.getElementById('mainFileGrid');
        fGrid.innerHTML = (deviceDataMap[weaponName] || []).map(d => `
            <div class="vagent-box" onclick="alert('View Mission Order manually or through Memoirs for full history')">
                <div style="font-size:20px;">👤</div>
                <span>#${d.vAgentID}</span>
            </div>
        `).join('');
    }

    // --- MEMOIRS SYSTEM ---

    window.openMemoirs = async () => {
        const creditsOverlay = document.getElementById('creditsOverlay');
        const creditsContainer = document.getElementById('creditsContainer');
        const memoirList = document.getElementById('memoir-list');
        const grandTotalDisp = document.getElementById('grandTotal');
        
        creditsOverlay.style.display = 'flex';
        memoirList.innerHTML = "L O A D I N G . . .";

        try {
            // 1. Get all bounty reports for the agent
            const q = query(collection(db, "bounty_report"));
            const snap = await getDocs(q);
            
            let allReports = [];
            let totalNetworkExpenses = 0;

            // Loop through documents that belong to this agent
            for (const d of snap.docs) {
                if (d.id.startsWith(currentAgent)) {
                    const logsSnap = await getDocs(collection(db, "bounty_report", d.id, "logs"));
                    let subTotal = 0;
                    let lastDate = "---";
                    
                    logsSnap.forEach(l => {
                        const lData = l.data();
                        subTotal += lData.amount || 0;
                        if(lData.timestamp) {
                            const dObj = lData.timestamp.toDate ? lData.timestamp.toDate() : new Date(lData.timestamp);
                            lastDate = `${dObj.getMonth()+1}/${dObj.getDate()}`;
                        }
                    });

                    const vID = d.id.split('_').pop();
                    allReports.push({ vID, subTotal, lastDate });
                    totalNetworkExpenses += subTotal;
                }
            }

            // Sort by Date or vID (Latest to Oldest logic can be applied if timestamp is available)
            allReports.sort((a,b) => b.subTotal - a.subTotal);

            // 2. Play Cinematic Credits
            creditsContainer.innerHTML = "";
            for (const report of allReports) {
                const scene = document.createElement('div');
                scene.className = 'credit-scene';
                scene.innerHTML = `
                    <h1 style="font-size:40px; color:var(--neon);">#${report.vID}</h1>
                    <p style="letter-spacing:3px;">TOTAL_BOUNTY: ₱${report.subTotal.toLocaleString()}</p>
                    <p style="opacity:0.5;">LAST_UPDATE: ${report.lastDate}</p>
                `;
                creditsContainer.appendChild(scene);
                await new Promise(r => setTimeout(r, 5000)); // 5 seconds per clip
                creditsContainer.innerHTML = "";
            }

            // 3. Show Final Paper Sheet
            creditsOverlay.style.display = 'none';
            document.getElementById('memoirOverlay').style.display = 'flex';
            grandTotalDisp.innerText = `₱ ${totalNetworkExpenses.toLocaleString()}`;
            
            memoirList.innerHTML = allReports.map(r => `
                <div style="border-bottom:1px solid #ccc; padding:10px 0;">
                    <div style="display:flex; justify-content:space-between;">
                        <b>vAGENT: #${r.vID}</b>
                        <span>${r.lastDate}</span>
                    </div>
                    <div style="text-align:right; font-weight:bold; color:#8b0000;">
                        EXPENSES: ₱${r.subTotal.toLocaleString()}
                    </div>
                </div>
            `).join('');

        } catch (e) {
            console.error(e);
            alert("CREDITS_INTERRUPTED: Check Console");
            creditsOverlay.style.display = 'none';
        }
    };

    window.closeMemoirs = () => document.getElementById('memoirOverlay').style.display = 'none';
</script>
</body>
</html>
