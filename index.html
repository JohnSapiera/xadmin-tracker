<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGIN</title>
    <style>
        body { background: #01080b; color: #00f3ff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #051014; border: 1px solid #00f3ff; padding: 40px; width: 320px; text-align: center; border-radius: 8px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #00f3ff; color: #05ffa1; font-family: monospace; font-size: 16px; }
        button { background: #00f3ff; color: #000; font-weight: bold; cursor: pointer; }
        .note { font-size: 11px; color: #5c7882; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔐 LOGIN</h2>
        <input type="text" id="agentInput" placeholder="Enter Agent Name">
        <button id="loginBtn">LOGIN</button>
        <div id="status" style="margin-top: 10px; font-size: 12px;"></div>
        <div class="note">Example: AGENT_LZ or AGENT_JFSN</div>
    </div>

    <script>
        document.getElementById('loginBtn').onclick = () => {
            const agentName = document.getElementById('agentInput').value.trim();
            const statusDiv = document.getElementById('status');
            
            if (!agentName) {
                statusDiv.innerHTML = "❌ Enter agent name";
                statusDiv.style.color = "#ff003c";
                return;
            }
            
            // Save to localStorage
            localStorage.setItem("cia_agent", agentName);
            localStorage.setItem("agent", agentName);
            localStorage.setItem("agent_verified", "true");
            
            console.log("✅ Saved:", agentName);
            console.log("localStorage:", localStorage.getItem("cia_agent"));
            
            statusDiv.innerHTML = `✅ Logged in as ${agentName}`;
            statusDiv.style.color = "#00ff66";
            
            // Go to dashboard
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1000);
        };
        
        // Enter key support
        document.getElementById('agentInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('loginBtn').click();
        });
    </script>
</body>
</html>
