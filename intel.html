<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#02080a">
  
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CORE_INTEL_v30.2</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #02080a; --panel: rgba(5, 15, 20, 0.9); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --green: #05ffa1; 
      --yellow: #ffbd00; --border: rgba(0, 243, 255, 0.2);
      --font-mono: 'Share Tech Mono', monospace; --font-main: 'Rajdhani', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: #e1f5f9; font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    header { padding: 15px 20px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; }
    .status-bar { font-size: 11px; padding: 8px 20px; background: rgba(0,243,255,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }
    
    main { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }
    .intel-module { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 4px; position: relative; }
    .module-title { color: var(--cyan); font-family: var(--font-mono); font-size: 12px; margin-bottom: 15px; letter-spacing: 2px; border-bottom: 1px solid rgba(0,243,255,0.2); padding-bottom: 5px;}
    
    .input-field { width: 100%; background: #000; border: 1px solid var(--border); color: var(--green); font-family: var(--font-mono); font-size: 20px; padding: 12px; text-align: center; outline: none; margin-bottom: 10px; }
    .device-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
    .dev-btn { background: #08161b; border: 1px solid #1a2f37; color: #fff; padding: 15px; font-size: 13px; text-align: left; font-family: var(--font-mono); display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: 0.2s; }
    .dev-btn.active { border-color: var(--cyan); background: rgba(0, 243, 255, 0.15); box-shadow: inset 0 0 10px var(--cyan-dim); }
    
    .btn-save { background: var(--green); color: #000; height: 50px; font-weight: 700; width: 100%; border: none; opacity: 0.3; pointer-events: none; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
    .btn-save.ready { opacity: 1; pointer-events: auto; box-shadow: 0 0 15px rgba(5, 255, 161, 0.3); }
    
    #scan-status { font-family: var(--font-mono); font-size: 11px; color: var(--yellow); text-align: center; margin-bottom: 10px; min-height: 15px; text-transform: uppercase; }
    
    .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #5c7882; text-decoration: none; font-size: 10px; font-weight: 700; }
    .nav-item.active { color: var(--cyan); background: var(--cyan-dim); border-top: 2px solid var(--cyan); }
    
    .blink { animation: blinker 1s linear infinite; }
    @keyframes blinker { 50% { opacity: 0.3; } }
  </style>
</head>
<body>

<header><span style="font-weight: 700; color: #fff; letter-spacing: 2px;">CORE_INTEL // v30.2</span></header>

<div class="status-bar">
    <div>SYS_TIME: <span id="clock">00:00:00</span></div>
    <div id="auth-status" style="color: var(--green);">[ OFFLINE ]</div>
</div>

<main>
  <div class="intel-module">
    <div class="module-title">TARGET IDENTIFICATION</div>
    <input type="text" id="vagent-input" class="input-field" placeholder="ENTER V_AGENT#" autocomplete="off" disabled>
    <div id="scan-status">WAITING FOR DASHBOARD UPLINK...</div>
    <div id="device-list" class="device-grid"></div>
  </div>

  <div class="intel-module" id="expense-module" style="opacity: 0.1; pointer-events: none; transition: 0.5s;">
    <div class="module-title">EXPENSE INJECTION</div>
    <input type="number" id="expense-input" class="input-field" placeholder="0.00" inputmode="decimal">
    <button id="submit-btn" class="btn-save">EXECUTE OVERRIDE</button>
  </div>
</main>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">DASHBOARD</a>
    <a href="#" class="nav-item active">INTEL</a>
    <a href="profile.html" class="nav-item">PROFILE</a>
</nav>

<script type="module">
  import { DEVICE_REGISTRY } from './config.js';
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, updateDoc, arrayUnion, increment, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { 
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
    authDomain: "my-admin-portal-12691.firebaseapp.com", 
    projectId: "my-admin-portal-12691", 
    storageBucket: "my-admin-portal-12691.firebasestorage.app", 
    messagingSenderId: "317015091563", 
    appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const vAgentInput = document.getElementById('vagent-input');
  const scanStatus = document.getElementById('scan-status');
  const deviceList = document.getElementById('device-list');
  const authStatus = document.getElementById('auth-status');
  const expenseModule = document.getElementById('expense-module');
  const submitBtn = document.getElementById('submit-btn');

  let selectedMissionDocId = null;
  const currentAgent = localStorage.getItem('cia_agent'); // MATCHED WITH DASHBOARD KEY

  // --- STEP 1: IDENTITY SYNC ---
  function establishSession() {
      if (currentAgent) {
          authStatus.innerText = `AGENT: ${currentAgent}`;
          vAgentInput.disabled = false;
          scanStatus.innerText = "READY FOR TARGET IDENTIFICATION";
      } else {
          authStatus.innerHTML = `<span style="color:var(--red)">[ UNAUTHORIZED ]</span>`;
          scanStatus.innerHTML = "ACCESS DENIED: LOG-IN VIA DASHBOARD.";
      }
  }
  establishSession();

  // --- STEP 2: DYNAMIC SEARCH ---
  let typingTimer;
  vAgentInput.addEventListener('input', () => {
    clearTimeout(typingTimer);
    const vInput = vAgentInput.value.trim();

    deviceList.innerHTML = "";
    expenseModule.style.opacity = "0.1";
    expenseModule.style.pointerEvents = "none";
    submitBtn.classList.remove('ready');

    if (vInput.length >= 2 && currentAgent) {
        scanStatus.innerHTML = `<span class="blink">[SCANNING] vAgent# ${vInput}...</span>`;
        typingTimer = setTimeout(() => {
            performHierarchySearch(vInput);
        }, 800);
    }
  });

  async function performHierarchySearch(vInput) {
    try {
        // Query missions matching vAgentID only (Flexible)
        const q = query(
            collection(db, "mission_orders"), 
            where("vAgentID", "==", vInput)
        );

        const snap = await getDocs(q);

        if (snap.empty) {
            scanStatus.innerHTML = `<span style="color:var(--red)">[ERROR] TARGET NOT FOUND: ${vInput}</span>`;
            return;
        }

        scanStatus.innerHTML = `<span style="color:var(--green)">[SUCCESS] ${snap.size} UNIT(S) LOCATED.</span>`;
        
        snap.forEach(d => {
            const data = d.data();
            const btn = document.createElement('button');
            btn.className = "dev-btn";
            const deviceName = DEVICE_REGISTRY[data.weaponSystem] || `SIG: ${data.weaponSystem}`;

            btn.innerHTML = `
              <span style="font-size:9px; color:var(--cyan)">SYSTEM: ${data.weaponSystem}</span>
              <span style="font-weight:700">> ${deviceName}</span>
              <span style="font-size:10px; color:#5c7882; align-self:flex-end">MISSION_ID: #${data.missionID}</span>
            `;
            
            btn.onclick = () => {
                document.querySelectorAll('.dev-btn').forEach(x => x.classList.remove('active'));
                btn.classList.add('active');
                selectedMissionDocId = data.missionID; // Consistent ID usage
                expenseModule.style.opacity = "1";
                expenseModule.style.pointerEvents = "auto";
                submitBtn.classList.add('ready');
            };
            deviceList.appendChild(btn);
        });
    } catch (e) {
        scanStatus.innerHTML = `<span style="color:var(--red)">[SYS ERROR] DATABASE_OFFLINE</span>`;
    }
  }

  // --- STEP 3: DATA INJECTION ---
  submitBtn.onclick = async () => {
    const amount = parseFloat(document.getElementById('expense-input').value);
    
    if (!selectedMissionDocId || isNaN(amount) || amount <= 0) {
        alert("INPUT ERROR: INVALID AMOUNT.");
        return;
    }

    submitBtn.innerText = "INJECTING...";
    submitBtn.disabled = true;

    try {
        const ref = doc(db, "mission_orders", selectedMissionDocId);
        
        // Log activity to terminal_logs
        await addDoc(collection(db, "terminal_logs"), {
            agent: currentAgent,
            message: `OVERRIDE: ₱${amount.toFixed(2)} INJECTED TO #${selectedMissionDocId}`,
            color: 'var(--yellow)',
            timestamp: serverTimestamp()
        });

        await updateDoc(ref, {
            expensesBreakdown: arrayUnion({ 
                amount: amount, 
                timestamp: new Date().toISOString(),
                injectedBy: currentAgent 
            }),
            totalExpenses: increment(amount)
        });
        
        alert("OVERRIDE SUCCESSFUL.");
        location.reload();
    } catch (e) { 
        alert("CRITICAL ERROR: DB_UPDATE_FAILED"); 
        submitBtn.innerText = "EXECUTE OVERRIDE";
        submitBtn.disabled = false;
    }
  };

  // Clock
  setInterval(() => { 
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); 
  }, 1000);
</script>
</body>
</html>
