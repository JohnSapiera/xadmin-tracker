<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_PROFILES // TOP_SECRET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --cia-bg: #01080b; --cia-cyan: #00f3ff; --cia-red: #ff003c;
            --font-digital: 'Share Tech Mono', monospace;
            --font-header: 'Rajdhani', sans-serif;
            --font-noir: 'Special Elite', cursive;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--cia-bg); color: #fff; font-family: var(--font-digital); 
            height: 100vh; overflow-x: hidden; 
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 120px; }
        header { border-left: 4px solid var(--cia-cyan); padding-left: 15px; margin-bottom: 30px; }
        .section-title { font-family: var(--font-header); letter-spacing: 4px; color: var(--cia-cyan); text-transform: uppercase; }

        /* DEVICE GRID & LIGHTS ON ANIMATION */
        .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .phone-wrapper { cursor: pointer; text-align: center; transition: 0.4s ease; }
        
        .phone-body {
            width: 130px; height: 240px; background: #050a0c; margin: 0 auto;
            border-radius: 18px; border: 2px solid #1a2a30; position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8); overflow: hidden;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            filter: grayscale(1) brightness(0.3); /* Standby mode */
        }

        .phone-screen {
            position: absolute; inset: 5px; background: #000; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.05); padding: 10px;
        }

        /* ETO YUNG LIGHTS ON & MOVE ANIMATION */
        .phone-wrapper.lights-on .phone-body { 
            filter: grayscale(0) brightness(1.2); 
            border-color: var(--cia-cyan); 
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.5); 
            transform: translateY(-15px) scale(1.05); /* Aangat siya */
        }

        .activate-text { color: var(--cia-cyan); font-size: 9px; margin-top: 10px; opacity: 0.5; }
        .phone-wrapper.lights-on .activate-text { opacity: 1; animation: blinker 0.6s infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* FILE FOLDER DESIGN */
        .vagent-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .file-icon-box { display: flex; flex-direction: column; align-items: center; padding: 10px; cursor: pointer; }
        
        .file-icon { 
            width: 45px; height: 32px; background: var(--cia-cyan); 
            border-radius: 0 4px 4px 4px; position: relative; margin-bottom: 8px; opacity: 0.8; 
        }
        .file-icon::after { 
            content: ""; position: absolute; top: -6px; left: 0; 
            width: 18px; height: 6px; background: var(--cia-cyan); border-radius: 4px 4px 0 0; 
        }
        .file-label { font-size: 10px; color: #fff; text-align: center; }

        /* OVERLAYS & NAV */
        .overlay { display: none; position: fixed; inset: 0; z-index: 2000; justify-content: center; align-items: center; background: rgba(0,0,0,0.9); }
        .paper-sheet { width: 90%; max-width: 400px; background: #e8e2d2; color: #1a1a1a; padding: 25px; font-family: var(--font-noir); position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid rgba(0,243,255,0.1); }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #444; text-decoration: none; font-size: 11px; }
        .nav-link.active { color: var(--cia-cyan); border-top: 2px solid var(--cia-cyan); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2 class="section-title" id="display-agent">AGENT_LZ</h2>
        <p style="font-size: 9px; opacity: 0.5; color: var(--cia-cyan);">NODE_RECOVERY // STATUS: ACTIVE</p>
    </header>

    <div id="deviceSection" class="device-grid">
        <div style="grid-column: span 2; text-align: center; font-size: 12px;" id="loading-text">SCANNING...</div>
    </div>
    
    <div id="vagentSection" class="vagent-grid"></div>

    <button id="btnBack" onclick="location.reload()" style="display:none; background:none; border:1px solid var(--cia-cyan); color:var(--cia-cyan); padding:12px; width:100%; margin-top:20px; font-family:var(--font-digital);">
        [ << BACK_TO_DEVICES ]
    </button>
</div>

<div id="noirOverlay" class="overlay">
    <div class="paper-sheet">
        <div onclick="document.getElementById('noirOverlay').style.display='none'" style="position:absolute; top:10px; right:15px; cursor:pointer;">[ X ]</div>
        <h3 style="text-align: center;">TOP SECRET</h3>
        <div id="noir-content" style="margin-top: 20px; font-size: 13px;"></div>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="intel.html" class="nav-link">INTEL</a>
    <a href="#" class="nav-link active">PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const fullWeaponMap = { 
        "SIG-20452634": "REDMI NOTE 14 PRO", 
        "SIG-5B0D3A5C": "REALME 8 PRO", 
        "SIG-121B8F43": "Techno Camon 40 PRO 5G" 
    };

    const currentAgent = localStorage.getItem("cia_agent") || "AGENT_LZ";
    let deviceData = {};

    window.onload = async () => {
        const q = query(collection(db, "mission_orders"), where("agent", "==", currentAgent));
        const snap = await getDocs(q);
        
        snap.forEach(d => {
            const data = d.data();
            if (data.vAgentID) {
                const weaponName = fullWeaponMap[data.weaponSystem] || data.weaponSystem;
                if(!deviceData[weaponName]) deviceData[weaponName] = [];
                deviceData[weaponName].push({ ...data, id: d.id });
            }
        });
        renderDevices();
    };

    function renderDevices() {
        const grid = document.getElementById('deviceSection');
        grid.innerHTML = Object.keys(deviceData).map(name => `
            <div class="phone-wrapper" onclick="activateDevice('${name}', this)">
                <div class="phone-body">
                    <div class="phone-screen">
                        <div style="font-size:10px; color:var(--cia-cyan); text-align:center;">${name}</div>
                    </div>
                </div>
                <div class="activate-text">[ STANDBY ]</div>
            </div>
        `).join('');
        document.getElementById('loading-text').style.display = "none";
    }

    window.activateDevice = (name, element) => {
        document.querySelectorAll('.phone-wrapper').forEach(el => el.style.opacity = "0.2");
        element.style.opacity = "1";
        element.classList.add('lights-on');
        element.querySelector('.activate-text').innerText = "[ UPLINKING... ]";
        
        setTimeout(() => {
            document.getElementById('deviceSection').style.display = 'none';
            document.getElementById('vagentSection').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            
            const vGrid = document.getElementById('vagentSection');
            vGrid.innerHTML = deviceData[name].map(v => `
                <div class="file-icon-box" onclick="openNoir('${v.id}')">
                    <div class="file-icon"></div>
                    <div class="file-label">#${v.vAgentID}</div>
                </div>
            `).join('');
        }, 1200);
    };

    window.openNoir = async (id) => {
        const overlay = document.getElementById('noirOverlay');
        const content = document.getElementById('noir-content');
        overlay.style.display = 'flex';
        content.innerHTML = "LOADING FILE...";
        
        const d = await getDoc(doc(db, "mission_orders", id));
        if(d.exists()) {
            const data = d.data();
            content.innerHTML = `
                <p><b>ORDER ID:</b> ${id}</p>
                <p><b>vAGENT:</b> #${data.vAgentID}</p>
                <p><b>TOTAL EXPENSES:</b> ₱ ${data.totalExpenses || 0}</p>
            `;
        }
    };
</script>
</body>
</html>
