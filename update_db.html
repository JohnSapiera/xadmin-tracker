<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_UPLINK_v16</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #020a0d; --green: #00ff66; --glass: rgba(0, 242, 255, 0.05); --border: rgba(0, 242, 255, 0.2); }
        body { 
            background: var(--bg); color: #fff; font-family: 'Share Tech Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Compact Tactical Card */
        .card { 
            width: 320px; background: rgba(1, 15, 20, 0.8); padding: 20px; 
            border: 1px solid var(--border); backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(0, 242, 255, 0.05);
        }

        h2 { 
            font-size: 14px; margin: 0 0 15px 0; color: var(--cyan); 
            text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid var(--border); padding-bottom: 10px;
        }

        /* Hologram Specs Display */
        .hologram-box {
            background: var(--glass); border: 1px dashed var(--border);
            padding: 12px; margin-bottom: 20px; position: relative;
            font-size: 9px; line-height: 1.5; color: #889ba3;
        }
        .hologram-box::before {
            content: "SCANNING_HARDWARE..."; position: absolute; top: -7px; right: 10px;
            background: var(--bg); padding: 0 5px; color: var(--cyan); font-size: 8px;
        }
        .spec-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0, 242, 255, 0.05); padding: 2px 0; }
        .spec-val { color: var(--cyan); font-weight: bold; text-transform: uppercase; }

        /* Unified Form Layout */
        .form-group { margin-bottom: 12px; }
        label { font-size: 9px; color: var(--cyan); text-transform: uppercase; margin-bottom: 5px; display: block; opacity: 0.7; }
        
        .input-field {
            width: 100%; box-sizing: border-box; padding: 10px; 
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: var(--green); font-family: 'Share Tech Mono'; font-size: 11px;
            outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: var(--green); background: rgba(0, 255, 102, 0.05); }

        select.input-field { cursor: pointer; appearance: none; }

        .btn-auth {
            width: 100%; padding: 15px; background: transparent; 
            color: var(--green); border: 1px solid var(--green);
            font-family: 'Share Tech Mono'; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; font-size: 12px; margin-top: 10px;
        }
        .btn-auth:hover { background: var(--green); color: #000; box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }

        #status { font-size: 8px; margin-top: 15px; color: #4a5a61; font-style: italic; }
    </style>
</head>
<body>

    <div class="card">
        <h2>UPLINK_REGISTRY</h2>

        <div class="hologram-box">
            <div class="spec-item">MODEL/BRAND: <span class="spec-val" id="val-brand">...</span></div>
            <div class="spec-item">GPU_CHIPSET: <span class="spec-val" id="val-gpu">...</span></div>
            <div class="spec-item">SCREEN_RES: <span class="spec-val" id="val-res">...</span></div>
            <div class="spec-item">PLATFORM: <span class="spec-val" id="val-plt">...</span></div>
        </div>

        <div class="form-group">
            <label>Hardware_Fingerprint (Unique_ID):</label>
            <input type="text" id="val-fp" class="input-field" readonly>
        </div>

        <div class="form-group">
            <label>Select_Agent_Profile:</label>
            <select id="agentSelect" class="input-field">
                <option value="JFSN">AGENT_JFSN</option>
                <option value="LZ">AGENT_LZ</option>
            </select>
        </div>

        <button class="btn-auth" onclick="authorizeAccess()">Authorize Device</button>
        
        <div id="status">> SYSTEM_AWAITING_LINK...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- HARDWARE DETECTION ---
        function getSpecs() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC_GPU";
            
            return {
                brand: navigator.userAgent.match(/Android\s+([^\s;]+);?\s+([^\s;]+)/)?.[2] || "WEB_NODE",
                gpu: gpu.split('/').pop().trim(),
                res: `${window.screen.width}x${window.screen.height}`,
                plt: navigator.platform
            };
        }

        function generateFP(s) {
            const raw = s.gpu + s.res + s.plt;
            let hash = 0;
            for (let i = 0; i < raw.length; i++) {
                hash = ((hash << 5) - hash) + raw.charCodeAt(i);
                hash |= 0;
            }
            return "HW-" + Math.abs(hash).toString(16).toUpperCase();
        }

        const specs = getSpecs();
        const fingerprint = generateFP(specs);

        // Update UI
        document.getElementById('val-brand').innerText = specs.brand.replace(/_/g, ' ');
        document.getElementById('val-gpu').innerText = specs.gpu;
        document.getElementById('val-res').innerText = specs.res;
        document.getElementById('val-plt').innerText = specs.plt;
        document.getElementById('val-fp').value = fingerprint;

        async function authorizeAccess() {
            const agent = document.getElementById('agentSelect').value;
            const log = document.getElementById('status');

            log.innerHTML = `> ESTABLISHING_HANDSHAKE...`;

            try {
                // I-save ang unique fingerprint at hardware details
                await db.collection("agents").doc(agent).set({
                    agentName: agent,
                    lastFingerprint: fingerprint,
                    linkedDevice: firebase.firestore.FieldValue.arrayUnion(fingerprint),
                    brandName: specs.brand,
                    lastSync: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                localStorage.setItem("agency_node_secret", fingerprint);
                log.innerHTML = `> <span style="color:var(--green)">[+] UPLINK_SUCCESSFUL</span>`;
                alert(`AUTHORIZED!\n\nAgent: ${agent}\nDevice ID: ${fingerprint}`);
            } catch (e) {
                log.innerHTML = `> <span style="color:red">[!] ERROR: ${e.message}</span>`;
            }
        }
    </script>
</body>
</html>
