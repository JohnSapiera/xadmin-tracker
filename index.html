<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SECURE TERMINAL • CIA INTELLIGENCE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0a0c12 0%, #06080e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            padding: 16px;
        }

        .terminal {
            width: 100%;
            max-width: 450px;
            background: #0d0f14;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f232c;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            padding: 8px 0;
            border-bottom: 1px solid #1f232c;
        }

        .signal-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .signal-bars {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 24px;
        }

        .bar {
            width: 4px;
            background: #2a4a3a;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .bar-1 { height: 8px; }
        .bar-2 { height: 14px; }
        .bar-3 { height: 20px; }

        .bar.active {
            background: #ffffff;
            box-shadow: 0 0 6px #ffffff;
            animation: signalPulse 0.8s ease-in-out;
        }

        @keyframes signalPulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .battery {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #5a7a6a;
        }

        .battery-level {
            width: 22px;
            height: 10px;
            background: #1a2a22;
            border-radius: 2px;
            overflow: hidden;
        }

        .battery-fill {
            width: 90%;
            height: 100%;
            background: #00ff66;
            border-radius: 2px;
        }

        /* CRT Monitor */
        .crt-monitor {
            background: #03050a;
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 20px;
            border: 1px solid #1f2a2a;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            min-height: 120px;
        }

        .terminal-screen {
            font-family: 'Courier New', monospace;
        }

        .typed-line {
            font-size: 20px;
            color: #00ff66;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-height: 50px;
            background: #000;
            padding: 10px;
            border-radius: 8px;
        }

        .prompt {
            color: #00ff66;
            font-weight: bold;
        }

        .typed-digits {
            color: #00ff66;
            letter-spacing: 6px;
            font-weight: bold;
            font-size: 24px;
            min-width: 100px;
            font-family: monospace;
        }

        .cursor {
            color: #00ff66;
            animation: blink 1s step-end infinite;
            font-weight: bold;
            font-size: 20px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .display-message {
            font-size: 12px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #1a2a2a;
            min-height: 40px;
            text-align: center;
        }

        .display-message.error {
            color: #ff4444;
        }

        .display-message.success {
            color: #00ff66;
        }

        /* Keypad */
        .keypad {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 20px 0;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        .key-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #12161f, #0a0d14);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            font-family: monospace;
            color: #e0e0e0;
            cursor: pointer;
            border: 1px solid #2a3240;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            transition: all 0.05s linear;
        }

        .key-circle:active {
            transform: scale(0.92);
            background: #00ff66;
            color: #000;
            border-color: #00ff66;
        }

        .key-zero {
            width: 70px;
            height: 70px;
        }

        .action-buttons {
            display: flex;
            gap: 14px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            background: #12161f;
            border: 1px solid #2a3240;
            border-radius: 40px;
            padding: 12px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #7a8a9a;
            text-align: center;
            cursor: pointer;
            font-family: monospace;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn.reset:active {
            background: #ffaa33;
            color: #000;
        }

        #clearBtn:active {
            background: #ff4444;
            color: #fff;
        }

        .agent-panel {
            margin-top: 20px;
            padding: 16px;
            background: #0a0d14;
            border-radius: 16px;
            border: 1px solid #1f232c;
            display: none;
        }

        .agent-panel.show {
            display: block;
        }

        .agent-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .agent-label {
            color: #5a7a6a;
        }

        .agent-value {
            color: #00ff66;
            font-weight: bold;
        }

        .devices-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .device-tag {
            background: #1a2a22;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #88ffaa;
        }

        hr {
            border-color: #1f232c;
            margin: 12px 0;
        }

        @media (max-width: 480px) {
            .key-circle { width: 60px; height: 60px; font-size: 24px; }
            .key-zero { width: 60px; height: 60px; }
            .key-row { gap: 14px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="terminal">
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="signal-section">
            <div class="signal-bars" id="signalBars">
                <div class="bar bar-1" id="bar1"></div>
                <div class="bar bar-2" id="bar2"></div>
                <div class="bar bar-3" id="bar3"></div>
            </div>
            <div class="battery">
                <span>🔋</span>
                <div class="battery-level">
                    <div class="battery-fill" id="batteryFill"></div>
                </div>
                <span id="batteryPercent">90%</span>
            </div>
        </div>
    </div>

    <!-- CRT Monitor -->
    <div class="crt-monitor">
        <div class="terminal-screen">
            <div class="typed-line">
                <span class="prompt">&gt;</span>
                <span class="typed-digits" id="typedDigits"> </span>
                <span class="cursor">_</span>
            </div>
            <div class="display-message" id="displayMessage"></div>
        </div>
    </div>

    <!-- Keypad -->
    <div class="keypad">
        <div class="key-row">
            <div class="key-circle" data-digit="1">1</div>
            <div class="key-circle" data-digit="2">2</div>
            <div class="key-circle" data-digit="3">3</div>
        </div>
        <div class="key-row">
            <div class="key-circle" data-digit="4">4</div>
            <div class="key-circle" data-digit="5">5</div>
            <div class="key-circle" data-digit="6">6</div>
        </div>
        <div class="key-row">
            <div class="key-circle" data-digit="7">7</div>
            <div class="key-circle" data-digit="8">8</div>
            <div class="key-circle" data-digit="9">9</div>
        </div>
        <div class="key-row">
            <div class="key-circle key-zero" data-digit="0">0</div>
        </div>
    </div>

    <div class="action-buttons">
        <div class="action-btn" id="clearBtn">CLEAR</div>
        <div class="action-btn reset" id="resetBtn">RESET</div>
    </div>

    <div class="agent-panel" id="agentPanel">
        <div class="agent-row">
            <span class="agent-label">AGENT DESIGNATION</span>
            <span class="agent-value" id="agentName">—</span>
        </div>
        <div class="agent-row">
            <span class="agent-label">CLEARANCE LEVEL</span>
            <span class="agent-value">ALPHA / OMEGA</span>
        </div>
        <hr>
        <div class="agent-label">REGISTERED DEVICES</div>
        <div class="devices-list" id="devicesList"></div>
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = "https://pgclrzqfpoznvrjrzced.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_GhIOC2mXVo0UrhMHZX6Qww_T12tQl4s";
    
    let supabase = null;
    let enteredPin = "";
    let isProcessing = false;
    
    // DOM Elements
    const typedDigits = document.getElementById('typedDigits');
    const displayMessage = document.getElementById('displayMessage');
    const agentPanel = document.getElementById('agentPanel');
    const agentNameSpan = document.getElementById('agentName');
    const devicesList = document.getElementById('devicesList');
    
    // Signal Animation
    let signalLevel = 0;
    function animateSignal() {
        const bar1 = document.getElementById('bar1');
        const bar2 = document.getElementById('bar2');
        const bar3 = document.getElementById('bar3');
        
        if (!bar1 || !bar2 || !bar3) return;
        
        setInterval(() => {
            signalLevel = (signalLevel % 3) + 1;
            bar1.classList.remove('active');
            bar2.classList.remove('active');
            bar3.classList.remove('active');
            
            if (signalLevel === 1) {
                bar1.classList.add('active');
            } else if (signalLevel === 2) {
                bar1.classList.add('active');
                bar2.classList.add('active');
            } else if (signalLevel === 3) {
                bar1.classList.add('active');
                bar2.classList.add('active');
                bar3.classList.add('active');
            }
        }, 2000);
    }
    
    function showMessage(msg, isError = false) {
        displayMessage.innerHTML = msg;
        displayMessage.className = isError ? 'display-message error' : 'display-message success';
        setTimeout(() => {
            if (displayMessage.innerHTML === msg && msg !== "Synchronization") {
                displayMessage.innerHTML = '';
            }
        }, 3000);
    }
    
    function updateTypedDisplay() {
        if (typedDigits) {
            let displayText = '';
            for (let i = 0; i < enteredPin.length; i++) {
                displayText += '● ';
            }
            typedDigits.innerText = displayText;
            console.log("PIN Display:", displayText);
        }
    }
    
    function clearPin() {
        enteredPin = "";
        updateTypedDisplay();
        displayMessage.innerHTML = '';
    }
    
    function resetTerminal() {
        clearPin();
        agentPanel.classList.remove('show');
        showMessage("Terminal reset.", false);
    }
    
    async function verifyPin(pin) {
        if (isProcessing) return;
        isProcessing = true;
        
        console.log("Verifying PIN:", pin);
        showMessage(`Verifying key: ${pin}...`, false);
        
        try {
            const { data: agent, error } = await supabase
                .from('agents')
                .select('agent_name, secret_key, weapon_system')
                .eq('secret_key', pin)
                .maybeSingle();
            
            if (error) {
                console.error("Supabase error:", error);
                showMessage(`Database error: ${error.message}`, true);
                isProcessing = false;
                clearPin();
                return;
            }
            
            if (!agent) {
                console.log("No agent for PIN:", pin);
                showMessage("Incorrect Key", true);
                isProcessing = false;
                clearPin();
                return;
            }
            
            // SUCCESS!
            const agentName = agent.agent_name;
            const devices = agent.weapon_system || [];
            
            console.log("✅ LOGIN SUCCESS:", agentName);
            showMessage("Synchronization", false);
            
            agentNameSpan.innerText = agentName;
            devicesList.innerHTML = devices.map(d => `<span class="device-tag">📱 ${d}</span>`).join('');
            agentPanel.classList.add('show');
            
            localStorage.setItem("cia_agent", agentName);
            localStorage.setItem("secret_key", pin);
            localStorage.setItem("agent_devices", JSON.stringify(devices));
            localStorage.setItem("last_auth", new Date().toISOString());
            
            console.log("STORED:", {agent: agentName, pin: pin, devices: devices});
            
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1500);
            
            isProcessing = false;
            
        } catch (err) {
            console.error("Error:", err);
            showMessage(`Error: ${err.message}`, true);
            isProcessing = false;
            clearPin();
        }
    }
    
    function addDigit(digit) {
        console.log("Digit pressed:", digit, "Current length:", enteredPin.length);
        
        if (isProcessing) return;
        if (enteredPin.length < 4) {
            enteredPin += digit;
            updateTypedDisplay();
            
            // Animation
            const btns = document.querySelectorAll('.key-circle');
            btns.forEach(btn => {
                if (btn.innerText === digit) {
                    btn.style.transform = 'scale(0.92)';
                    btn.style.background = '#00ff66';
                    btn.style.color = '#000';
                    setTimeout(() => {
                        btn.style.transform = '';
                        btn.style.background = '';
                        btn.style.color = '';
                    }, 150);
                }
            });
            
            if (enteredPin.length === 4) {
                verifyPin(enteredPin);
            }
        }
    }
    
    // Event Listeners
    document.querySelectorAll('.key-circle').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const digit = btn.getAttribute('data-digit');
            if (digit) addDigit(digit);
        });
        
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const digit = btn.getAttribute('data-digit');
            if (digit) addDigit(digit);
        });
    });
    
    document.getElementById('clearBtn').addEventListener('click', () => {
        clearPin();
        showMessage("Cleared.", false);
    });
    
    document.getElementById('resetBtn').addEventListener('click', () => {
        resetTerminal();
    });
    
    // Initialize
    async function init() {
        console.log("Initializing...");
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const { error } = await supabase.from('agents').select('count', { count: 'exact', head: true });
            if (error) console.warn("Supabase:", error.message);
            else console.log("✅ Supabase connected!");
        } catch(e) {
            console.error("Init error:", e);
        }
        
        animateSignal();
        updateTypedDisplay();
        console.log("Ready. Test with: 4646 (AGENT_LZ) or 1010 (AGENT_JFSN)");
    }
    
    init();
</script>
</body>
</html>
