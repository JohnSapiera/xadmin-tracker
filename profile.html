<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUREAU_REGISTRY // ARCHIVES</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon: #00f2ff; --bg: #0a0b0d; --red: #ff3c3c; 
            --folder-tan: #c2b280; --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(0, 242, 255, 0.15);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; 
            margin: 0; padding: 15px; overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
        }
        .container { max-width: 500px; margin: 0 auto; }

        /* Tactical Header */
        .header { 
            border: 1px solid var(--border); border-left: 4px solid var(--neon); 
            padding: 15px; margin-bottom: 25px; display: flex; 
            justify-content: space-between; align-items: flex-start;
            background: rgba(0, 242, 255, 0.02); backdrop-filter: blur(10px);
        }

        .btn-memoir {
            background: var(--neon); color: #000; border: none; padding: 5px 12px;
            font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase;
            margin-top: 10px; clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }

        #agentName { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; text-transform: uppercase; color: #fff; }
        #brandTag { font-size: 10px; color: var(--neon); font-weight: bold; letter-spacing: 1.5px; }

        /* File Grid */
        .file-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .file-item { position: relative; cursor: pointer; transition: 0.2s; }
        .file-item:active { transform: scale(0.9); }
        .file-folder { 
            height: 80px; background: var(--folder-tan); border-radius: 0 8px 2px 2px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); border-bottom: 3px solid rgba(0,0,0,0.2);
        }
        .file-folder::before {
            content: ""; position: absolute; top: -8px; left: 0; width: 30px; height: 10px;
            background: var(--folder-tan); border-radius: 4px 4px 0 0;
        }
        .file-label { font-size: 7px; color: rgba(0,0,0,0.6); font-weight: 800; }
        .file-id { font-size: 11px; color: #1a1a1a; font-weight: 900; }

        /* Overlay Styles */
        .overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px);
        }

        /* Dossier Style Document */
        .modal-box { 
            width: 85%; max-width: 350px; background: #fdfdfd; color: #111; 
            padding: 25px; position: relative; border: 1px solid #000;
            box-shadow: 10px 10px 0 var(--neon);
            background-image: repeating-linear-gradient(#f1f1f1 0px, #f1f1f1 1px, transparent 1px, transparent 20px);
        }
        
        .dossier-header { 
            text-align: center; border-bottom: 2px solid #000; 
            margin-bottom: 20px; padding-bottom: 10px; 
        }

        .close-btn { position: absolute; top: -10px; right: -10px; background: var(--red); color: #fff; border: 2px solid #fff; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; z-index: 1001;}
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <a href="dashboard.html" style="color:var(--neon); font-size:10px; text-decoration:none;">< SYSTEM_EXIT</a>
                <h2 id="agentName">SYNCING_NODE...</h2>
                <button class="btn-memoir" onclick="openMemoir()">MEMOIR</button>
            </div>
            <div style="text-align: right;">
                <div id="brandTag">BRAND: ---</div>
                <div id="uplinkTag" style="font-size: 7px; color: var(--red); margin-top: 8px; border: 1px solid var(--red); padding: 2px;">ENCRYPTED_UPLINK</div>
            </div>
        </div>

        <div id="terminalStatus" style="font-size: 10px; color: #555; margin-bottom: 15px; border-left: 2px solid var(--neon); padding-left: 10px;">
            >> INITIALIZING_HARDWARE_UPLINK...
        </div>

        <div class="file-grid" id="mainFileGrid"></div>
    </div>

    <div id="memoirOverlay" class="overlay" onclick="closeMemoir()">
        <div class="modal-box" style="background:#000; color:var(--neon); border: 1px solid var(--neon);" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeMemoir()">×</button>
            <h3 style="letter-spacing:2px; text-align:center;">// MEMOIR_VAULT</h3>
            <div style="height:100px; display:flex; align-items:center; justify-content:center; font-size:10px; opacity:0.5;">
                [ PENDING_UPDATES_... ]
            </div>
        </div>
    </div>

    <div id="missionOverlay" class="overlay">
        <div class="modal-box">
            <button class="close-btn" onclick="closeDoc()">×</button>
            <div class="dossier-header">
                <h2 style="margin: 0; font-size: 16px; font-weight: 900; letter-spacing: 1px;">CLASSIFIED DOSSIER</h2>
                <span id="moID" style="font-size: 10px; font-weight: bold; background: #000; color: #fff; padding: 2px 5px;">--</span>
            </div>
            <div id="docContent"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
            authDomain: "my-admin-portal-12691.firebaseapp.com", 
            projectId: "my-admin-portal-12691", 
            storageBucket: "my-admin-portal-12691.firebasestorage.app", 
            messagingSenderId: "317015091563", 
            appId: "1:317015091563:web:d996e585751d5087cd442e" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- HARDWARE FINGERPRINT LOGIC ---
        function getFingerprint() {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl');
            const debugInfo = gl ? gl.getExtension('WEBGL_debug_renderer_info') : null;
            const gpu = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "GENERIC";
            const specs = gpu + screen.width + "x" + screen.height + navigator.platform;
            let hash = 0;
            for (let i = 0; i < specs.length; i++) {
                hash = ((hash << 5) - hash) + specs.charCodeAt(i);
                hash |= 0;
            }
            return "HW-" + Math.abs(hash).toString(16).toUpperCase();
        }

        // --- ANTI-CLEAR CACHE & RECOVERY SYSTEM ---
        async function initBranding() {
            const currentFP = getFingerprint();
            const terminal = document.getElementById('terminalStatus');
            const uplink = document.getElementById('uplinkTag');
            
            // 1. Fallback Check: URL -> LocalStorage -> Fingerprint
            let accessKey = new URLSearchParams(window.location.search).get('key') || localStorage.getItem("agent_access_key");

            terminal.innerText = ">> SCANNING_NODE_SIGNATURE...";

            try {
                let agentDoc = null;

                // 2. Firestore Matching via Key
                if (accessKey) {
                    const qKey = query(collection(db, "agents"), where("accessKey", "==", accessKey));
                    const snapKey = await getDocs(qKey);
                    if (!snapKey.empty) agentDoc = snapKey.docs[0];
                }

                // 3. Automatic Recovery via Fingerprint
                if (!agentDoc) {
                    terminal.innerText = ">> CACHE_MISS: INITIATING_HARDWARE_RECOVERY...";
                    const qFP = query(collection(db, "agents"), where("lastFingerprint", "==", currentFP));
                    const snapFP = await getDocs(qFP);
                    if (!snapFP.empty) agentDoc = snapFP.docs[0];
                }

                if (agentDoc) {
                    const data = agentDoc.data();
                    document.getElementById('agentName').innerText = `AGENT_${data.agentName}`;
                    document.getElementById('brandTag').innerText = `BRAND: ${data.brandName.toUpperCase()}`;
                    
                    // Heal LocalStorage
                    localStorage.setItem("agent_access_key", data.accessKey);
                    localStorage.setItem("cia_agent", data.agentName);
                    
                    terminal.innerText = ">> DATABASE_MATCH_FOUND. UPLINK_STABLE.";
                    uplink.style.color = "var(--neon)";
                    uplink.style.borderColor = "var(--neon)";
                    uplink.innerText = "UPLINK_STABLE";

                    loadArchives(data.agentName);
                } else {
                    // Fallback Prompt
                    terminal.innerText = ">> UNAUTHORIZED_ACCESS_DETECTED.";
                    const inputKey = prompt("UNRECOGNIZED_DEVICE: ENTER AGENT_ACCESS_KEY");
                    if (inputKey) {
                        localStorage.setItem("agent_access_key", inputKey);
                        location.reload();
                    } else {
                        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>ACCESS_DENIED</h1>";
                    }
                }
            } catch (e) { 
                console.error(e); 
                terminal.innerText = ">> CRITICAL_UPLINK_FAILURE.";
            }
        }

        async function loadArchives(agentName) {
            const grid = document.getElementById('mainFileGrid');
            const q = query(collection(db, "mission_orders"), where("agentName", "==", agentName));
            const snap = await getDocs(q);
            
            grid.innerHTML = "";
            snap.forEach(d => {
                const data = d.data();
                grid.innerHTML += `
                    <div class="file-item" onclick="openDoc('${d.id}')">
                        <div class="file-folder">
                            <span class="file-label">VIA_AGENT</span>
                            <span class="file-id">#${data.vAgent || '??'}</span>
                        </div>
                    </div>`;
            });
        }

        window.openMemoir = () => document.getElementById('memoirOverlay').style.display = 'flex';
        window.closeMemoir = () => document.getElementById('memoirOverlay').style.display = 'none';
        window.closeDoc = () => document.getElementById('missionOverlay').style.display = 'none';

        window.openDoc = async (id) => {
            const snap = await getDoc(doc(db, "mission_orders", id));
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('moID').innerText = `REF_ID: V-${data.vAgent}`;
                document.getElementById('docContent').innerHTML = `
                    <div style="margin-top: 15px; font-family: 'JetBrains Mono', monospace;">
                        <p style="font-size:10px; color:#666; margin: 0;">SUBJECT_IDENTIFIER:</p>
                        <p style="font-size:15px; font-weight:bold; margin: 5px 0 15px 0; color: #000;">#${data.orderNumber}</p>
                        
                        <p style="font-size:10px; color:#666; margin: 0;">TOTAL_EXPENSES:</p>
                        <p style="font-size:24px; font-weight:900; color:var(--red); margin: 5px 0;">₱ ${parseFloat(data.expenses).toLocaleString()}</p>
                        
                        <div style="margin-top:20px; border-top:1px dashed #ccc; padding-top:10px;">
                            <p style="font-size:9px; color:#999; font-style:italic;">Note: This document is classified under Bureau protocol. Unauthorized reproduction is prohibited.</p>
                        </div>
                    </div>
                `;
                document.getElementById('missionOverlay').style.display = 'flex';
            }
        };

        window.onload = initBranding;
    </script>
</body>
</html>
