<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINATION_SCANNER</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; --bg: #050506; --green: #00ff00; }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; padding: 15px; margin: 0; }
        .panel { background: #0a0a0c; border: 1px solid #222; padding: 20px; }
        input { width: 100%; background: #000; border: 1px solid #333; color: var(--cyan); padding: 15px; font-size: 18px; outline: none; margin-bottom: 10px; box-sizing: border-box; }
        .log { background: #000; padding: 10px; font-size: 10px; color: #888; height: 60px; overflow: auto; border-left: 2px solid #333; margin-bottom: 10px; }
        .btn-green { background: var(--green); color: #000; border: none; padding: 15px; width: 100%; font-weight: 800; cursor: pointer; }
        .hidden { display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="panel">
        <h2 style="font-size:12px; color:var(--cyan);">🔒 TERMINATION_SCANNER</h2>
        <input type="text" id="moInput" placeholder="SCAN MISSION ORDER" maxlength="5" oninput="scan(this.value)">
        <div class="log" id="log">> STANDBY_</div>
        
        <div id="actionStage" class="hidden">
            <input type="text" id="wpnIn" placeholder="WEAPON NAME (e.g. RMN14)">
            <input type="number" id="vidIn" placeholder="V-AGENT # (1-100)">
            <button class="btn-green" onclick="finalize()">ACCEPT MISSION</button>
        </div>
    </div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const activeAgent = localStorage.getItem("cia_agent") || "GHOST";

        async function scan(val) {
            if(val.length < 4) return;
            const snap = await db.collection("blacklist").where("code", "==", val).get();
            if(!snap.empty) {
                document.getElementById('log').innerText = ">> ACCESS DENIED: USED";
                document.getElementById('actionStage').classList.add('hidden');
            } else {
                document.getElementById('log').innerText = ">> CLEAR. ENTER DETAILS.";
                document.getElementById('actionStage').classList.remove('hidden');
            }
        }

        async function finalize() {
            const mo = document.getElementById('moInput').value;
            const wpn = document.getElementById('wpnIn').value.toUpperCase();
            const vid = document.getElementById('vidIn').value;
            const docId = `${activeAgent}_${wpn}_V${vid}`;
            
            await db.collection("system_registry").doc(docId).update({
                missionOrder: mo,
                status: "OFFICIAL_DOCUMENT",
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            await db.collection("blacklist").add({ code: mo, timestamp: new Date() });
            alert("MISSION ARCHIVED");
            location.reload();
        }
    </script>
</body>
</html>
