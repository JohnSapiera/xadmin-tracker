<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOSSAD - MOBILE TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050506;
            --panel-bg: rgba(10, 10, 14, 0.98);
            --accent-cyan: #00f2ff;
            --danger-red: #ff3c3c;
            --text-main: #e0e6ed;
            --border: rgba(0, 242, 255, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* Tactical Overlay */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px; z-index: 9999; pointer-events: none;
        }

        .status-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; background: #000;
            border-bottom: 1px solid var(--accent-cyan); font-size: 9px;
            letter-spacing: 1px; color: var(--accent-cyan);
        }

        /* Responsive Dashboard */
        .dashboard {
            display: flex; flex-direction: column;
            flex-grow: 1; overflow: hidden; position: relative;
        }

        .panel {
            display: none; /* Hidden by default on mobile, toggled by nav */
            flex-direction: column; height: 100%; background: var(--panel-bg);
        }

        .panel.active { display: flex; }

        /* Desktop View Overrides */
        @media (min-width: 900px) {
            .dashboard { display: grid; grid-template-columns: 320px 1fr 320px; gap: 10px; padding: 10px; }
            .panel { display: flex !important; border: 1px solid var(--border); }
            .mobile-nav { display: none !important; }
        }

        .panel-header {
            padding: 12px; font-size: 10px; font-weight: 800;
            background: rgba(0, 242, 255, 0.07); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* Mobile Bottom Nav */
        .mobile-nav {
            display: flex; background: #000; border-top: 1px solid var(--accent-cyan);
            height: 60px; justify-content: space-around; align-items: center;
            z-index: 1000;
        }

        .nav-item {
            color: #444; font-size: 10px; text-align: center; cursor: pointer;
            display: flex; flex-direction: column; gap: 4px;
        }

        .nav-item.active { color: var(--accent-cyan); font-weight: 800; }

        /* Content Areas */
        .scroll-area { flex-grow: 1; overflow-y: auto; padding: 15px; }

        .bounty-card { 
            border-left: 3px solid var(--accent-cyan); 
            padding: 12px; margin-bottom: 10px; 
            background: rgba(255,255,255,0.03); font-size: 11px;
        }

        /* Comms Interface */
        .chat-msg { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 4px; margin-bottom: 10px; border-left: 1px solid #333; }
        .chat-input-row { padding: 15px; background: #08080a; border-top: 1px solid var(--border); padding-bottom: 25px; }
        
        input, button { border-radius: 0; -webkit-appearance: none; }
        input[type="text"], input[type="number"] {
            background: #000; border: 1px solid #222; color: var(--accent-cyan);
            padding: 12px; font-family: inherit; font-size: 16px; width: 100%;
        }

        .execute-btn { 
            background: var(--accent-cyan); color: #000; border: none; 
            padding: 15px; font-weight: 800; width: 100%; cursor: pointer;
            letter-spacing: 2px;
        }

        /* Floating Scan Info */
        .scan-overlay {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--accent-cyan);
            padding: 15px; border-radius: 4px; margin-top: 10px;
        }

        .terminal-log {
            height: 150px; background: #000; padding: 10px; font-size: 10px;
            overflow-y: auto; color: #00ff00; border: 1px solid #111; margin-top: 10px;
        }

        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.98); display:none; justify-content:center; align-items:center; z-index:9999;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>
</head>
<body>

    <nav class="status-header">
        <div id="agentBadge" onclick="window.location.href='profile.html'">AGENT: GHOST</div>
        <div id="clock">00:00:00</div>
    </nav>

    <div class="dashboard">
        
        <div class="panel active" id="panel-bounty">
            <div class="panel-header">🎯 BOUNTY_REPORTS</div>
            <div class="scroll-area" id="bountyDisplay"></div>
            <div style="padding: 15px;">
                <button class="execute-btn" onclick="openBountyModal()">+ INITIALIZE TARGET</button>
            </div>
        </div>

        <div class="panel" id="panel-comms">
            <div class="panel-header">📡 COMMS_ENCRYPTED</div>
            <div class="scroll-area" id="chatFeed"></div>
            <div class="chat-input-row">
                <div style="display:flex; gap:8px;">
                    <button style="background:#111; color:white; border:1px solid #333; padding:0 15px;" onclick="document.getElementById('photoInput').click()">📁</button>
                    <input type="text" id="chatInput" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:var(--accent-cyan); color:#000; padding:0 15px; font-weight:800;">SEND</button>
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="attachPhoto(this)">
            </div>
        </div>

       <div class="panel" id="panel-scanner">
    <div class="panel-header">🔒 TERMINATION_SCANNER</div>
    <div class="scroll-area">
        <label style="font-size: 9px; color: var(--accent-cyan);">INPUT MISSION ORDER:</label>
        <input type="text" id="scanInput" placeholder="SCAN 4-5 DIGIT MO#" oninput="runTacticalScan(this.value)" maxlength="5">
        
        <div class="terminal-log" id="scanLog">> System Standby...</div>

        <div id="saveStage" class="hidden" style="margin-top:15px;">
            <button class="save-btn-anim" onclick="openWeaponFolder()">📂 INITIALIZE SAVE PROTOCOL</button>
        </div>

        <div id="weaponFolder" class="hidden scan-overlay" style="margin-top:10px;">
            <div style="font-size: 10px; color: var(--accent-cyan); margin-bottom:10px;">[SELECT_WEAPON_SYSTEM]</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button class="folder-item" onclick="selectWeapon('R8P')">>> R8P</button>
                <button class="folder-item" onclick="selectWeapon('RMN14')">>> RMN14</button>
            </div>
        </div>

        <div id="finalStage" class="hidden scan-overlay" style="margin-top:10px;">
            <div style="font-size: 10px; color: var(--accent-cyan); margin-bottom:5px;">WEAPON: <span id="selWpn" style="color:#fff"></span></div>
            <input type="number" id="vAgentInput" placeholder="ENTER V.AGENTS #">
            <button class="accept-btn-anim" onclick="finalizeMission()">ACCEPT MISSION ORDER</button>
            <button onclick="resetScanner()" style="background:none; border:none; color:#555; width:100%; font-size:9px; margin-top:10px;">ABORT MISSION</button>
        </div>
    </div>
</div>

<style>
    /* Animations & Folder Styling */
    .save-btn-anim {
        width: 100%; background: #00ff00; color: #000; border: none; padding: 15px;
        font-weight: 800; cursor: pointer; border-radius: 4px;
        animation: pulseGreen 2s infinite;
    }

    @keyframes pulseGreen {
        0% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
        70% { box-shadow: 0 0 0 15px rgba(0, 255, 0, 0); }
        100% { box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
    }

    .folder-item {
        background: #111; border: 1px solid var(--accent-cyan); color: #fff;
        padding: 12px; font-size: 11px; font-family: inherit; cursor: pointer;
    }

    .accept-btn-anim {
        width: 100%; background: var(--accent-cyan); color: #000; border: none;
        padding: 15px; font-weight: 800; margin-top: 10px; cursor: pointer;
        animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .hidden { display: none !important; }
</style>

<script>
let currentMO = "";
let currentWpn = "";

async function runTacticalScan(val) {
    const log = document.getElementById('scanLog');
    const saveBtn = document.getElementById('saveStage');
    
    // Reset stages every time user types
    resetScannerUI();

    if(val.length < 4) {
        log.innerHTML = "> Awaiting Mission Order (4-5 Digits)...";
        return;
    }

    log.innerHTML = `> SCANNING DATABASE FOR MO# ${val}...`;
    
    try {
        // Tinitignan natin kung EXISTED na ang MO# na ito sa blacklist
        const snap = await db.collection("blacklist")
                       .where("code", "==", val.trim())
                       .get();

        if(!snap.empty) {
            // IF EXISTED: Hindi na pwedeng gamitin (Duplicate Prevention)
            log.innerHTML = `<div style="color:var(--danger-red)">> ACCESS DENIED: MO# ${val} IS ALREADY REGISTERED/USED.</div>`;
            saveBtn.classList.add('hidden');
        } else {
            // IF NOT EXISTED: Ibig sabihin bago ito, kaya pwedeng i-SAVE
            log.innerHTML = `<div style="color:#00ff00">> MO# ${val} IS AVAILABLE FOR DEPLOYMENT.</div>`;
            currentMO = val.trim();
            saveBtn.classList.remove('hidden'); // Lilitaw na ang Green "Initialize Save" Button
        }
    } catch (error) {
        log.innerHTML = `<div style="color:red">> ERROR: DATABASE CONNECTION INTERRUPTED.</div>`;
        console.error(error);
    }
}

// Ito ang function kapag pinindot ang 'ACCEPT MISSION ORDER'
async function finalizeMission() {
    const vID = document.getElementById('vAgentInput').value;
    if(!vID) { alert("V-AGENT ID REQUIRED"); return; }

    const log = document.getElementById('scanLog');
    log.innerHTML = "> REGISTERING NEW MISSION ORDER...";

    try {
        // 1. I-save sa 'bounties' (Para mag-reflect sa profile.html Deployment History)
        await db.collection("bounties").add({
            agent: activeAgent,
            weapon: currentWpn,
            vid: vID,
            missionOrder: currentMO, // Ang bagong scanned number
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        // 2. I-save din sa 'blacklist' para sa susunod na i-scan ito, "EXISTED" na siya
        await db.collection("blacklist").add({
            code: currentMO,
            status: "USED",
            agent: activeAgent,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        // 3. Telegram Alert
        const msg = `🆕 NEW MISSION REGISTERED\nAgent: ${activeAgent}\nMO#: ${currentMO}\nWeapon: ${currentWpn}\nV-Agent: ${vID}`;
        fetch(`${TG_URL}&text=${encodeURIComponent(msg)}`);

        log.innerHTML = `<div style="color:#00ff00">> MISSION ARCHIVED & REFLECTED IN PROFILE.</div>`;
        
        // Reset after 3 seconds
        setTimeout(() => resetScanner(), 3000);

    } catch (e) {
        log.innerHTML = `<div style="color:red">> UPLOAD FAILED: RECHECK PERMISSIONS.</div>`;
    }
}

function resetScannerUI() {
    document.getElementById('saveStage').classList.add('hidden');
    document.getElementById('weaponFolder').classList.add('hidden');
    document.getElementById('finalStage').classList.remove('hidden');
    document.getElementById('finalStage').classList.add('hidden');
}

function resetScanner() {
    document.getElementById('scanInput').value = "";
    document.getElementById('vAgentInput').value = "";
    resetScannerUI();
    document.getElementById('scanLog').innerHTML = "> Scanner Standby...";
}
</script>
</body>
</html>
