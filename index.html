<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE_GATEWAY_v3 // HARDWARE_LOCK</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #050506; --error: #ff3c3c; --success: #00ff66; }
        body { 
            background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }

        .login-card {
            width: 100%; max-width: 380px; padding: 40px; background: rgba(10, 10, 12, 0.9);
            border: 1px solid rgba(0, 242, 255, 0.1); text-align: center; position: relative;
        }

        .login-card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
        }

        h2 { font-size: 14px; letter-spacing: 4px; color: var(--neon); margin-bottom: 30px; text-transform: uppercase; }

        select {
            width: 100%; background: #000; border: 1px solid #222; color: var(--neon);
            padding: 15px; font-family: inherit; font-size: 14px; outline: none; margin-bottom: 20px;
            appearance: none; -webkit-appearance: none;
        }

        .btn-access {
            width: 100%; padding: 15px; background: var(--neon); color: #000;
            border: none; font-weight: 800; cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.4s;
        }

        .btn-access:disabled { background: #1a1a1a; color: #444; cursor: not-allowed; }

        .status-msg { font-size: 10px; margin-top: 20px; color: #444; min-height: 15px; line-height: 1.5; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="login-card">
        <h2>IDENT_VERIFICATION</h2>
        
        <div id="loginForm">
            <label style="display:block; text-align:left; font-size:9px; color:#555; margin-bottom:5px;">SELECT_ACTIVE_AGENT:</label>
            <select id="agentDropdown"></select>
            
            <button id="accessBtn" class="btn-access" onclick="verifyHardware()">GRANT_ACCESS</button>
        </div>

        <div id="status" class="status-msg">>> SYSTEM_READY_</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
            authDomain: "my-admin-portal-12691.firebaseapp.com",
            projectId: "my-admin-portal-12691",
            storageBucket: "my-admin-portal-12691.firebasestorage.app",
            messagingSenderId: "317015091563",
            appId: "1:317015091563:web:baab5171d8e0a58acd442e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. Kuhanin ang listahan ng Agents sa Database
        async function loadAgents() {
            const dropdown = document.getElementById('agentDropdown');
            const snap = await db.collection("agents").get();
            dropdown.innerHTML = "";
            snap.forEach(doc => {
                dropdown.innerHTML += `<option value="${doc.id}">AGENT_${doc.id}</option>`;
            });
        }

        // 2. LIVE HARDWARE CHECK LABAN SA DATABASE
        async function verifyHardware() {
            const selectedAgent = document.getElementById('agentDropdown').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('accessBtn');
            
            // Kunin ang "Fingerprint" ng phone mo
            const localID = localStorage.getItem("device_uuid");

            btn.disabled = true;
            status.style.color = "var(--neon)";
            status.innerText = "QUERYING_DATABASE_FOR_HARDWARE_LOCK...";

            try {
                // HUGOT NG DATA DIREKTA SA FIREBASE
                const doc = await db.collection("agents").doc(selectedAgent).get();
                
                if (doc.exists) {
                    const dbDeviceID = doc.data().linkedDevice; // Ito yung ni-register mo sa update_db.html

                    if (localID === dbDeviceID && localID !== null) {
                        // MATCH!
                        status.style.color = "var(--success)";
                        status.innerHTML = "HARDWARE_RECOGNIZED_BY_DATABASE!<br>ACCESS_GRANTED.";
                        
                        localStorage.setItem("cia_agent", selectedAgent);
                        setTimeout(() => { window.location.href = "dashboard.html"; }, 1500);
                    } else {
                        // HINDI RECOGNIZED O IBANG PHONE
                        status.style.color = "var(--error)";
                        status.innerHTML = "ACCESS_DENIED: UNKNOWN_DEVICE<br>HARDWARE_NOT_REGISTERED_FOR_" + selectedAgent;
                        btn.disabled = false;
                    }
                } else {
                    status.innerText = "ERROR: AGENT_NOT_FOUND";
                    btn.disabled = false;
                }
            } catch (e) {
                status.innerText = "UPLINK_ERROR: " + e.message;
                btn.disabled = false;
            }
        }

        window.onload = loadAgents;
    </script>
</body>
</html>
