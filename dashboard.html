<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL_CENTER_v10.2_ELITE</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #01080b; --panel: rgba(2, 15, 20, 0.98); --cyan: #00f3ff; 
      --red: #ff003c; --blue: #007bff; --green: #00ff66; 
      --border: rgba(0, 243, 255, 0.2); --mono: 'Share Tech Mono', monospace; 
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
        background: var(--bg); color: #c8e1e5; font-family: 'Rajdhani', sans-serif; 
        height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        background-image: radial-gradient(circle at 50% 50%, #0a1f29 0%, var(--bg) 100%);
    }

    header { padding: 15px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .status-bar { font-size: 9px; font-family: var(--mono); color: var(--cyan); padding: 8px 15px; background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; letter-spacing: 2px; }

    main { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }

    .command-module { 
        background: var(--panel); border: 1px solid var(--border); padding: 30px; 
        position: relative; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    .input-container { display: flex; justify-content: center; margin-bottom: 30px; }
    #mission-input { 
        width: 100%; background: #000; border: 2px solid #1a262b; border-left: 5px solid var(--cyan);
        color: var(--cyan); font-family: var(--mono); font-size: 45px; padding: 15px; 
        text-align: center; letter-spacing: 10px; outline: none; transition: 0.3s;
    }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn { 
        height: 65px; font-family: var(--mono); font-size: 12px; font-weight: 800; 
        border: 1px solid; background: rgba(0,0,0,0.4); cursor: pointer; transition: 0.3s;
        clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
    }
    
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    /* Animations & Special States */
    .pulse-blue { animation: p-blue 1.5s infinite; color: var(--blue) !important; border-color: var(--blue) !important; }
    @keyframes p-blue { 0%, 100% { box-shadow: 0 0 5px var(--blue); } 50% { box-shadow: 0 0 20px var(--blue); } }

    #terminal { 
        background: rgba(0,0,0,0.9); border: 1px solid #111; padding: 15px; 
        font-family: var(--mono); font-size: 11px; height: 160px; color: #4a5a61; 
        margin-top: 25px; overflow-y: auto; line-height: 1.6;
    }

    /* POP-UP OVERLAY */
    .overlay { 
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(0,0,0,0.9); z-index: 2000; backdrop-filter: blur(5px); 
        align-items: center; justify-content: center; 
    }
    .popup { 
        width: 310px; background: #020a0d; border: 1px solid var(--cyan); 
        padding: 20px; position: relative; box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); 
    }
    .close-x { position: absolute; top: 10px; right: 15px; color: var(--red); cursor: pointer; font-size: 18px; }
    .p-row { margin-bottom: 12px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
    .p-val { color: var(--cyan); }

    nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 2px solid var(--border); display: grid; grid-template-columns: 1fr 1fr; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #333; font-size: 11px; font-family: var(--mono); text-decoration: none; }
    .nav-btn.active { color: var(--cyan); background: rgba(0, 243, 255, 0.05); border-top: 4px solid var(--cyan); }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div style="width:12px; height:12px; background:var(--cyan); margin-right:10px; box-shadow: 0 0 10px var(--cyan);"></div>
    <span style="font-family: var(--mono); font-size: 14px; letter-spacing: 2px; color: var(--cyan);">INTEL_CORE_v10</span>
  </div>
  <button style="background:none; border:1px solid var(--cyan); color:var(--cyan); font-family:var(--mono); font-size:9px; padding:5px 10px;">AGENT_PROFILE</button>
</header>

<div class="status-bar">
    <span id="clock">00:00:00</span>
    <span id="device-tag">NODE: <span style="color:var(--cyan)">SYNCING...</span></span>
</div>

<main>
  <div class="command-module">
    <div style="font-family: var(--mono); font-size: 10px; color: var(--cyan); margin-bottom: 20px; opacity: 0.8;">// DATA_ENTRY_ENCRYPTION</div>
    <div class="input-container">
        <input type="tel" id="mission-input" placeholder="00000" maxlength="5" autocomplete="off">
    </div>
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="term-btn" class="btn btn-terminate">TERMINATE</button>
    </div>
  </div>

  <div id="terminal">> SYSTEM_READY...</div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <span class="close-x" onclick="closePopup()">×</span>
        <div style="text-align:center; margin-bottom:20px; border-bottom:1px solid var(--cyan); padding-bottom:10px;">
            <div id="pop-m-id" style="font-size:20px; color:var(--cyan);">#00000</div>
            <div id="pop-agent" style="font-size:10px; font-family:var(--mono); color:#4a5a61;">AGENT_NAME</div>
        </div>

        <div class="p-row"><span>WEAPON_SYSTEM:</span> <span class="p-val" id="pop-device">MOBILE_NODE</span></div>
        <div class="p-row">
            <span>V_AGENT#:</span> 
            <input type="text" id="v-agent-input" placeholder="REQUIRED" style="background:transparent; border:none; border-bottom:1px solid var(--blue); color:var(--cyan); width:80px; text-align:right; font-family:var(--mono); outline:none;">
        </div>
        <div class="p-row"><span>EXPENSES:</span> <span class="p-val">PHP 0.00</span></div>
        <div class="p-row"><span>DEPLOY_DATE:</span> <span class="p-val" id="pop-dep">--/--/--</span></div>
        <div class="p-row"><span>RELIEVE_DATE:</span> <span class="p-val" id="pop-rel">--/--/--</span></div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
            <button onclick="assignMission()" style="background:var(--green); color:#000; border:none; padding:12px; font-family:var(--mono); font-weight:bold; cursor:pointer;">ASSIGN</button>
            <button onclick="closePopup()" style="background:var(--red); color:#fff; border:none; padding:12px; font-family:var(--mono); cursor:pointer;">ABORT</button>
        </div>
    </div>
</div>

<nav>
  <a href="#" class="nav-btn active">DASHBOARD</a>
  <a href="intel.html" class="nav-btn">INTEL_LOGS</a>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI",
    authDomain: "my-admin-portal-12691.firebaseapp.com",
    projectId: "my-admin-portal-12691",
    storageBucket: "my-admin-portal-12691.firebasestorage.app",
    messagingSenderId: "317015091563",
    appId: "1:317015091563:web:baab5171d8e0a58acd442e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const termLog = document.getElementById('terminal');
  const deviceTag = document.getElementById('device-tag');
  const overlay = document.getElementById('modal-overlay');

  // --- LOGGING ENGINE ---
  function log(msg, color = "#4a5a61") {
    const d = document.createElement('div');
    d.innerHTML = `<span style="opacity:0.3">${new Date().toLocaleTimeString('en-GB')}</span> > <span style="color:${color}">${msg}</span>`;
    termLog.prepend(d);
  }

  // --- AUTO SCANNER LOGIC ---
  input.addEventListener('input', async (e) => {
    const val = e.target.value.trim();
    
    // Reset Button State
    actionBtn.classList.remove('pulse-blue');
    actionBtn.textContent = "SAVE";
    actionBtn.disabled = false;

    if (val.length > 0 && val.length < 4) {
        log(`SCANNING_SECTOR: ${val}...`, 'var(--cyan)');
    }

    if (val.length >= 4) {
        log(`VALIDATING: [${val}]`, 'var(--blue)');
        try {
            const qBlack = query(collection(db, "blacklist"), where("targetID", "==", val));
            const snapBlack = await getDocs(qBlack);

            if (!snapBlack.empty) {
                log(`ALERT: ID ${val} RESTRICTED.`, 'var(--red)');
                actionBtn.textContent = "LOCKED";
                actionBtn.disabled = true;
            } else {
                log(`SUCCESS: ID ${val} AVAILABLE.`, 'var(--green)');
                actionBtn.classList.add('pulse-blue');
                actionBtn.textContent = "PROCEED";
            }
        } catch (err) { log("DB_ERROR", "red"); }
    }
  });

  // --- POPUP CONTROLS ---
  actionBtn.onclick = () => {
    if (input.value.length < 4) return;
    
    const now = new Date();
    const rel = new Date();
    rel.setDate(now.getDate() + 30);

    document.getElementById('pop-m-id').innerText = `#${input.value}`;
    document.getElementById('pop-agent').innerText = localStorage.getItem("cia_agent") || "UNKNOWN_AGENT";
    document.getElementById('pop-device').innerText = navigator.platform;
    document.getElementById('pop-dep').innerText = now.toLocaleDateString('en-GB');
    document.getElementById('pop-rel').innerText = rel.toLocaleDateString('en-GB');
    
    overlay.style.display = 'flex';
  };

  window.closePopup = () => overlay.style.display = 'none';

  // --- FIREBASE SUBMIT ---
  window.assignMission = async () => {
    const vAgent = document.getElementById('v-agent-input').value;
    if (!vAgent) return alert("V_AGENT# REQUIRED");

    log("UPLOADING_MISSION_DATA...", "var(--cyan)");
    try {
        await setDoc(doc(db, "mission_orders", input.value), {
            missionID: input.value,
            agentName: localStorage.getItem("cia_agent"),
            vAgentID: vAgent,
            weaponSystem: navigator.platform,
            expenses: "PHP 0.00",
            deploymentDate: serverTimestamp(),
            relieveDate: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000),
            status: "ACTIVE"
        });
        log("MISSION_LOGGED_SUCCESSFULLY", "var(--green)");
        setTimeout(() => location.reload(), 2000);
    } catch (e) { log("UPLOAD_FAILED", "red"); }
  };

  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
