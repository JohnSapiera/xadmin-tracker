<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>INTEL MOBILE V4 | WEAPON SYSTEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020a0e;
      --panel: rgba(5, 18, 24, 0.95);
      --cyan: #00f3ff;
      --red: #ff003c;
      --blue: #007bff;
      --green: #00ff66;
      --border: rgba(0, 243, 255, 0.3);
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: #c8e1e5; font-family: var(--font-ui); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    header { padding: 15px; border-bottom: 1px solid var(--cyan); background: #000; display: flex; justify-content: space-between; align-items: center; }
    .ticker-wrap { background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid var(--border); padding: 5px 10px; font-family: var(--font-mono); font-size: 11px; color: var(--cyan); overflow: hidden; }

    main { flex: 1; overflow-y: auto; padding: 20px 15px 100px 15px; }
    .portal-section { display: none; }
    .portal-section.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- SEARCH & BUTTONS --- */
    .search-box { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 4px; }
    #mission-input { width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--cyan); font-family: var(--font-mono); font-size: 32px; padding: 10px; text-align: center; letter-spacing: 8px; outline: none; margin-bottom: 20px; }
    
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { padding: 15px; font-family: var(--font-mono); font-size: 14px; font-weight: bold; border: 1px solid; background: transparent; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
    
    /* Dynamic Button States */
    .btn-save { color: var(--green); border-color: var(--green); }
    .btn-retrieve { color: #fff; border-color: var(--blue); background: var(--blue) !important; }
    .btn-terminate { color: var(--red); border-color: var(--red); }

    #terminal { background: #000; border: 1px solid #1a1a1a; padding: 15px; font-family: var(--font-mono); font-size: 12px; min-height: 120px; color: #888; margin-top: 20px; }
    .log { margin-bottom: 5px; border-bottom: 1px solid #111; }

    /* --- WEAPON SYSTEM MODAL --- */
    #weapon-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { background: var(--panel); border: 2px solid var(--red); width: 100%; max-width: 400px; position: relative; padding: 30px 20px 20px; box-shadow: 0 0 30px rgba(255,0,60,0.3); }
    .modal-close { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; border: none; padding: 5px 12px; font-family: var(--font-mono); cursor: pointer; font-weight: bold; }
    .modal-header-order { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 2px 15px; border: 1px solid var(--red); color: var(--red); font-family: var(--font-mono); font-size: 14px; white-space: nowrap; }
    .weapon-info { font-family: var(--font-mono); margin-top: 15px; line-height: 2; }
    .weapon-info span { color: var(--cyan); }

    /* --- NAV --- */
    nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; border-top: 2px solid var(--cyan); display: grid; grid-template-columns: 1fr 1fr; z-index: 200; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #444; font-size: 12px; text-decoration: none; }
    .nav-item.active { color: var(--cyan); background: rgba(0, 243, 255, 0.1); }
  </style>
</head>
<body>

<header>
  <div style="font-family: var(--font-mono);">[ SYSTEM_ACTIVE ]</div>
  <div id="clock" style="color: var(--cyan);">00:00:00</div>
</header>

<div class="ticker-wrap"><span id="ticker-text">SECURE ACCESS GRANTED...</span></div>

<main>
  <section id="mission" class="portal-section active">
    <div class="search-box">
      <label style="font-family: var(--font-mono); font-size: 12px; color: var(--cyan);">TARGET MISSION NO.</label>
      <input type="tel" id="mission-input" placeholder="00000" maxlength="5" oninput="autoSearch(this.value)">
      
      <div class="btn-row">
        <button id="action-btn" class="btn btn-save" onclick="handlePrimaryAction()">SAVE</button>
        <button class="btn btn-terminate" onclick="handleTerminate()">TERMINATE</button>
      </div>
    </div>

    <div id="terminal">
      <div class="log">> Awaiting frequency...</div>
    </div>
  </section>

  <section id="classified" class="portal-section">
    <h2 style="color: var(--red);">[ CLASSIFIED DATABANK ]</h2>
    <p style="font-size:14px; margin-top:20px;">Access restricted to Level 9 Clearance.</p>
  </section>
</main>

<div id="weapon-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">X</button>
    <div class="modal-header-order" id="modal-order-no">MISSION ORDER #: 00000</div>
    <div class="weapon-info">
      <div>WEAPON SYSTEM: <span id="modal-weapon">N/A</span></div>
      <div>V-AGENT #: <span id="modal-agent">REDACTED</span></div>
    </div>
  </div>
</div>

<nav>
  <div class="nav-item active" onclick="switchTab('mission', this)">PORTAL_01</div>
  <div class="nav-item" onclick="switchTab('classified', this)">PORTAL_02</div>
</nav>

<script type="module">
  // Firebase Integration (Make sure to update with your config)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    projectId: "YOUR_PROJECT_ID",
    // ... rest of your config
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const COL = "mission_orders";

  let currentData = null; // Store searched data

  // --- LOGIC: AUTO SEARCH & DYNAMIC BUTTON ---
  window.autoSearch = async function(val) {
    const cleaned = val.replace(/\D/g, '');
    const btn = document.getElementById('action-btn');
    
    if (cleaned.length >= 4) {
      log(`> SCANNING DATABASE FOR [${cleaned}]...`, 'cyan');
      
      const q = query(collection(db, COL), where("orderNumber", "==", cleaned));
      const snap = await getDocs(q);

      if (!snap.empty) {
        // DATA FOUND: Switch to RETRIEVE
        currentData = snap.docs[0].data();
        btn.textContent = "RETRIEVE";
        btn.className = "btn btn-retrieve";
        log(`> DATA DETECTED. RETRIEVAL READY.`, 'cyan');
      } else {
        // DATA NOT FOUND: Stay as SAVE
        currentData = null;
        btn.textContent = "SAVE";
        btn.className = "btn btn-save";
      }
    }
  };

  // --- LOGIC: SAVE / RETRIEVE ACTION ---
  window.handlePrimaryAction = function() {
    const btn = document.getElementById('action-btn');
    const orderNo = document.getElementById('mission-input').value;

    if (btn.textContent === "RETRIEVE" && currentData) {
      showWeaponSystem(orderNo, currentData.weaponSystem, currentData.agent);
    } else {
      // Dito ilalagay ang existing SAVE logic mo (AddDoc sa Firebase)
      log(`> INITIATING NEW RECORD FOR ${orderNo}...`, 'green');
    }
  };

  // --- UI FUNCTIONS ---
  window.showWeaponSystem = function(order, weapon, agent) {
    document.getElementById('modal-order-no').textContent = `MISSION ORDER #: ${order}`;
    document.getElementById('modal-weapon').textContent = weapon || "THERMAL LANCE";
    document.getElementById('modal-agent').textContent = agent || "UNKNOWN";
    document.getElementById('weapon-modal').style.display = 'flex';
  };

  window.closeModal = function() {
    document.getElementById('weapon-modal').style.display = 'none';
  };

  window.log = function(msg, color) {
    const term = document.getElementById('terminal');
    term.innerHTML = `<div class="log" style="color:var(--${color})">${msg}</div>` + term.innerHTML;
  };

  window.switchTab = function(id, el) {
    document.querySelectorAll('.portal-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
  };

  // Basic clock
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
  }, 1000);
</script>

</body>
</html>
