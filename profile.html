<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIA_NETWORK // SECURE_ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root { 
            --neon: #00f3ff; --bg: #01080b; --red: #ff003c; 
            --border: rgba(0, 243, 255, 0.15);
            --font-mono: 'Share Tech Mono', monospace;
            --font-main: 'Rajdhani', sans-serif;
            --font-doc: 'Special Elite', cursive;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: #e1f5f9; font-family: var(--font-mono); 
            height: 100vh; overflow: hidden; padding: 15px;
            background-image: radial-gradient(circle at center, #0a1f29 0%, #01080b 100%);
        }

        .container { max-width: 500px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }

        /* DEVICE GRID (PHONES) */
        #deviceGrid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px; 
            perspective: 1000px; padding: 40px 10px;
        }

        .phone-wrapper { display: flex; flex-direction: column; align-items: center; }

        .phone-container {
            width: 100px; height: 180px;
            position: relative; cursor: pointer;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
        }

        .phone-container:hover { transform: rotateY(25deg) rotateX(5deg); }

        .phone-body {
            width: 100%; height: 100%; background: #0a0a0a;
            border: 3px solid #1a1a1a; border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,243,255,0.1);
            position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .phone-screen {
            width: 90%; height: 92%; background: #000;
            border-radius: 10px; transition: 0.5s;
            display: flex; align-items: center; justify-content: center;
        }

        /* Power On Animation */
        .phone-container.booting .phone-screen { 
            background: var(--neon); 
            box-shadow: 0 0 30px var(--neon); 
        }

        .phone-label { margin-top: 10px; font-family: var(--font-main); font-weight: bold; color: var(--neon); font-size: 13px; text-transform: uppercase; }

        /* FILE GRID (vAGENTS) */
        .file-grid { 
            display: none; grid-template-columns: repeat(4, 1fr); gap: 15px; 
            padding: 20px 10px; overflow-y: auto;
        }

        .vagent-box { 
            width: 65px; height: 75px; background: rgba(0,243,255,0.03);
            border: 1px solid var(--border); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            position: relative; transition: 0.2s;
        }
        .vagent-box:active { transform: scale(0.95); background: rgba(0,243,255,0.1); }

        .vagent-box.silhouette { opacity: 0.15; cursor: default; border-style: dashed; filter: grayscale(1); pointer-events: none; }
        .vagent-box span { font-size: 9px; color: #fff; margin-top: 5px; }

        /* DOCUMENT POPUP */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .paper-doc {
            width: 90%; max-width: 360px; background: #fdfaf0; color: #222; padding: 45px 25px;
            font-family: var(--font-doc); position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            background-image: repeating-linear-gradient(#fdfaf0 0px, #fdfaf0 24px, #e5e5e5 25px);
        }
        .stamp { 
            border: 3px solid #8b0000; color: #8b0000; padding: 4px 10px; font-weight: bold; 
            position: absolute; top: 20px; right: 20px; transform: rotate(-12deg); 
            font-size: 11px; opacity: 0.8; 
        }

        .archive-btn { 
            width: 100%; padding: 15px; background: #111; color: #fff; border: none; 
            cursor: pointer; font-family: var(--font-main); font-weight: 800; 
            transition: 0.4s; margin-top: 25px; letter-spacing: 1px;
        }
        .archive-btn.clicked { background: var(--red) !important; box-shadow: 0 0 20px var(--red); color: white; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #000; display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--border); }
        .nav-link { display: flex; align-items: center; justify-content: center; color: #333; text-decoration: none; font-size: 10px; font-family: var(--font-main); }
        .nav-link.active { color: var(--neon); }

        #btnBack { display: none; margin: 20px; color: var(--neon); background: none; border: 1px solid var(--border); padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div style="padding: 20px 15px;">
        <h2 id="agentHeader" style="font-family:var(--font-main); letter-spacing:3px; color:#fff;">ENCRYPTED_FILES</h2>
        <div style="font-size:9px; color:var(--neon); opacity:0.6;">SCANNING_FOR_ACTIVE_DEVICES...</div>
    </div>

    <div id="deviceGrid"></div>
    <div class="file-grid" id="mainFileGrid"></div>
    
    <button id="btnBack" onclick="showDevices()">[ EXIT_DEVICE ]</button>
</div>

<div id="docOverlay" class="overlay">
    <div class="paper-doc">
        <div onclick="closeDoc()" style="position:absolute; top:10px; left:15px; cursor:pointer; font-weight:bold; font-family:monospace;">[ CLOSE ]</div>
        <div class="stamp">TOP SECRET // CIA</div>
        <div style="text-align:center; text-decoration:underline; margin-bottom:20px; font-weight:bold;">MISSION DOSSIER</div>

        <div style="font-size: 12px; line-height: 1.7;">
            <p><b>MISSION ORDER#:</b> <span id="d-order">---</span></p>
            <p><b>vAGENT_ID:</b> #<span id="d-vagent">---</span></p>
            <br>
            <p><u><b>EXPENSES_LOG:</b></u></p>
            <div id="logs-list" style="padding-left:15px; font-size:11px; margin-top:5px;"></div>
            <div style="border-top:2px solid #333; margin-top:8px; text-align:right; font-weight:bold; padding-top:4px;">
                TOTAL_UPLINK: <span id="d-total">₱ 0.00</span>
            </div>
            <br>
            <p><b>DEPLOYMENT_DATE:</b> <span id="d-deploy">---</span></p>
            <p><b>RELIEVE_DATE:</b> <span id="d-relieve">---</span></p>
        </div>

        <button id="archiveBtn" class="archive-btn" onclick="archiveToBlacklist()">SEND TO ARCHIVES</button>
    </div>
</div>

<nav>
    <a href="dashboard.html" class="nav-link">DASHBOARD</a>
    <a href="intel.html" class="nav-link">INTEL</a>
    <a href="#" class="nav-link active">PROFILE</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", 
        authDomain: "my-admin-portal-12691.firebaseapp.com", 
        projectId: "my-admin-portal-12691", 
        storageBucket: "my-admin-portal-12691.firebasestorage.app", 
        messagingSenderId: "317015091563", 
        appId: "1:317015091563:web:baab5171d8e0a58acd442e" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const currentAgent = localStorage.getItem("cia_agent");
    let deviceDataMap = {};
    let activeMissionData = null;

    window.onload = () => {
        if (!currentAgent) { window.location.href = "index.html"; return; }
        document.getElementById('agentHeader').innerText = "AGENT_" + currentAgent;
        loadDevices();
    };

    async function loadDevices() {
        const q = query(collection(db, "mission_orders"), where("agentName", "==", currentAgent));
        const snap = await getDocs(q);
        deviceDataMap = {};

        snap.forEach(d => {
            const data = d.data();
            const weapon = data.weaponSystem || "UNKNOWN";
            if(!deviceDataMap[weapon]) deviceDataMap[weapon] = [];
            deviceDataMap[weapon].push(data);
        });

        const grid = document.getElementById('deviceGrid');
        grid.innerHTML = Object.keys(deviceDataMap).map(name => `
            <div class="phone-wrapper" onclick="bootDevice(this, '${name}')">
                <div class="phone-container">
                    <div class="phone-body">
                        <div class="phone-screen">
                            <div style="font-size:9px; color:#222;">BOOT_REQ</div>
                        </div>
                    </div>
                </div>
                <div class="phone-label">${name}</div>
            </div>
        `).join('');
    }

    window.bootDevice = (el, weaponName) => {
        const phone = el.querySelector('.phone-container');
        phone.classList.add('booting');
        
        setTimeout(() => {
            document.getElementById('deviceGrid').style.display = 'none';
            document.getElementById('mainFileGrid').style.display = 'grid';
            document.getElementById('btnBack').style.display = 'block';
            rendervAgents(weaponName);
        }, 2000); // 2 seconds boot animation
    };

    function rendervAgents(weaponName) {
        const fGrid = document.getElementById('mainFileGrid');
        const existed = deviceDataMap[weaponName] || [];
        
        // Priority: Display existed files
        let html = existed.map(d => `
            <div class="vagent-box" onclick="openMissionDoc('${d.vAgentID}', '${weaponName}')">
                <div style="font-size:20px;">👤</div>
                <span>#${d.vAgentID}</span>
            </div>
        `).join('');

        // Followed by 2 Shadow Files (Silhouettes)
        html += `
            <div class="vagent-box silhouette"><div style="font-size:20px;">👤</div><span>#HIDDEN</span></div>
            <div class="vagent-box silhouette"><div style="font-size:20px;">👤</div><span>#HIDDEN</span></div>
        `;
        
        fGrid.innerHTML = html;
    }

    window.openMissionDoc = async (vID, weapon) => {
        // Find existing data in local map
        let mission = deviceDataMap[weapon].find(m => m.vAgentID == vID);
        
        // Initial setup for the doc
        document.getElementById('docOverlay').style.display = 'flex';
        document.getElementById('d-vagent').innerText = vID;
        document.getElementById('d-order').innerText = "VERIFYING...";

        try {
            // SESTEMA: Smart Search for Mission Order# if unknown
            const q = query(
                collection(db, "mission_orders"), 
                where("agentName", "==", currentAgent),
                where("weaponSystem", "==", weapon),
                where("vAgentID", "==", vID)
            );
            const snap = await getDocs(q);
            
            if (!snap.empty) {
                const verifiedData = snap.docs[0].data();
                activeMissionData = { ...verifiedData, weaponSystem: weapon };
                
                // Display the 4-5 digit Mission Order#
                document.getElementById('d-order').innerText = verifiedData.orderNumber || "NOT_FOUND";
                
                // Date Formatting MM/DD/YYYY
                const fmtDate = (val) => {
                    if(!val) return "---";
                    let d = val.seconds ? val.toDate() : new Date(val);
                    return isNaN(d.getTime()) ? val : `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
                };

                document.getElementById('d-deploy').innerText = fmtDate(verifiedData.deploymentDate);
                document.getElementById('d-relieve').innerText = fmtDate(verifiedData.relieveDate);
            }
        } catch (e) { document.getElementById('d-order').innerText = "ERR_SEARCH"; }

        // Render Expenses logic
        renderExpensesLogic(vID, weapon, mission.expenses);
    };

    async function renderExpensesLogic(vID, weapon, fallbackTotal) {
        const reportID = `${currentAgent}_${weapon}_${vID}`.replace(/\s+/g, '_');
        const logsList = document.getElementById('logs-list');
        const totalDisp = document.getElementById('d-total');
        
        try {
            const logSnap = await getDocs(collection(db, "bounty_report", reportID, "logs"));
            let sum = 0;
            logsList.innerHTML = "";
            
            if(!logSnap.empty) {
                logSnap.forEach(l => {
                    const data = l.data();
                    sum += data.amount;
                    logsList.innerHTML += `<div>(+) ₱${data.amount.toLocaleString()}</div>`;
                });
                totalDisp.innerText = `₱ ${sum.toLocaleString()}`;
            } else {
                totalDisp.innerText = `₱ ${parseFloat(fallbackTotal || 0).toLocaleString()}`;
            }
        } catch(e) { totalDisp.innerText = `₱ ${parseFloat(fallbackTotal || 0).toLocaleString()}`; }
    }

    window.archiveToBlacklist = async () => {
        const btn = document.getElementById('archiveBtn');
        btn.classList.add('clicked');
        btn.innerText = "MOVING_TO_BLACKLIST...";

        try {
            const blacklistID = `BL_${currentAgent}_${activeMissionData.vAgentID}_${Date.now()}`;
            await setDoc(doc(db, "blacklist", blacklistID), {
                ...activeMissionData,
                archive_timestamp: new Date(),
                agent_signature: currentAgent,
                status: "RETIRED"
            });
            alert("SUCCESS: DATA TRANSFERRED TO BLACKLIST VAULT.");
            location.reload();
        } catch (e) { alert("ERROR: ARCHIVE INTERRUPTED"); }
    };

    window.closeDoc = () => document.getElementById('docOverlay').style.display = 'none';
    window.showDevices = () => location.reload();
</script>
</body>
</html>
