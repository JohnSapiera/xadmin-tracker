<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>CORE_DASH_v26.7_PERSIST</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #02080a; --panel: rgba(5, 15, 20, 0.9); --cyan: #00f3ff; 
      --cyan-dim: rgba(0, 243, 255, 0.1); --red: #ff003c; --blue: #007bff; 
      --green: #05ffa1; --border: rgba(0, 243, 255, 0.2);
      --font-mono: 'Share Tech Mono', monospace; --font-main: 'Rajdhani', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: #e1f5f9; font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    header { padding: 15px 20px; background: #000; border-bottom: 2px solid var(--cyan); display: flex; justify-content: space-between; }
    .status-bar { font-size: 11px; padding: 8px 20px; background: rgba(0,243,255,0.05); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; color: var(--cyan); font-family: var(--font-mono); }
    main { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .command-module { background: var(--panel); border: 1px solid var(--border); padding: 25px; border-radius: 4px; }
    #mission-input { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--cyan); color: #fff; font-family: var(--font-mono); font-size: 50px; text-align: center; outline: none; margin-bottom: 20px; letter-spacing: 8px; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { height: 55px; font-weight: 700; text-transform: uppercase; border: none; cursor: pointer; font-family: var(--font-main); font-size: 16px; }
    .btn-save { background: var(--green); color: #000; }
    .btn-retrieve { background: var(--blue); color: #fff; }
    .btn-reserve { background: transparent; color: #fff; border: 1px solid #fff; }
    #terminal { background: rgba(0,0,0,0.8); border-left: 3px solid var(--cyan); padding: 15px; font-family: var(--font-mono); font-size: 11px; height: 180px; overflow-y: auto; color: #9ab4bc; }
    .term-line { margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.02); padding-bottom: 2px; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
    .popup { width: 100%; max-width: 380px; background: #051014; border: 1px solid var(--cyan); padding: 25px; }
    .pop-title { font-size: 40px; color: var(--cyan); text-align: center; margin-bottom: 20px; font-weight: 700; }
    .pop-input { width: 100%; background: #000; border: 1px solid var(--cyan); color: var(--green); padding: 12px; font-family: var(--font-mono); margin-bottom: 20px; text-align: center; font-size: 18px; }
    .device-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 20px; max-height: 150px; overflow-y: auto; }
    .dev-btn { background: #08161b; border: 1px solid #1a2f37; color: #5c7882; padding: 12px; font-size: 11px; cursor: pointer; font-family: var(--font-mono); text-align: left; text-transform: uppercase; }
    .dev-btn.active { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .pop-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>

<header>
  <span style="font-weight: 700; color: #fff; letter-spacing: 2px;">CORE_SYSTEM_v26.7</span>
</header>

<div class="status-bar">
    <div>TIME: <span id="clock">00:00:00</span></div>
    <div>AGENT: <span id="agent-display" style="color:#fff">---</span></div>
    <div>DEVICE: <span id="device-display" style="color:#fff">---</span></div>
</div>

<main>
  <div class="command-module">
    <input type="tel" id="mission-input" placeholder="ID NO" maxlength="5">
    <div class="btn-row">
      <button id="action-btn" class="btn btn-save">SAVE</button>
      <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
    </div>
  </div>
  <div id="terminal"></div>
</main>

<div class="overlay" id="modal-overlay">
    <div class="popup">
        <div class="pop-title" id="pop-m-id">#0000</div>
        <div style="font-size:11px; color:#5c7882; margin-bottom:5px; font-family:var(--font-mono)">V_AGENT_ID:</div>
        <input type="text" id="v-agent-input" class="pop-input" placeholder="REQUIRED">
        <div style="font-size:11px; color:var(--cyan); margin-bottom:8px; font-family:var(--font-mono)">WEAPON_SYSTEMS_LINKED:</div>
        <div class="device-grid" id="pop-device-list"></div>
        <div class="pop-btn-row">
            <button id="modal-submit" onclick="submitMission()" class="btn">ACTION</button>
            <button onclick="closePopup()" class="btn btn-reserve">ABORT</button>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, doc, setDoc, addDoc, serverTimestamp, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyD7SFXKTIx3ocIBD9B5JfWiI_sJmZPpbAI", authDomain: "my-admin-portal-12691.firebaseapp.com", projectId: "my-admin-portal-12691", storageBucket: "my-admin-portal-12691.firebasestorage.app", messagingSenderId: "317015091563", appId: "1:317015091563:web:baab5171d8e0a58acd442e" };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const fullWeaponMap = {
    "SIG-3A14D65A": "REDMI NOTE 14 PRO 5G", "SIG-5B0D3A5C": "REALME 8 PRO",
    "SIG-6AC68A2E": "LAPTOP: ACER", "SIG-X921FFA": "IPHONE 15 PRO",
    "SIG-K882190": "POCO X6 PRO", "SIG-V001122": "VIVO V30"
  };

  const currentAgent = localStorage.getItem("cia_agent") || "UNKNOWN";
  const currentDeviceSig = localStorage.getItem("device_signature") || "SIG-3A14D65A";
  
  document.getElementById('agent-display').innerText = currentAgent;
  document.getElementById('device-display').innerText = fullWeaponMap[currentDeviceSig] || "DEV_UNDEFINED";

  const input = document.getElementById('mission-input');
  const actionBtn = document.getElementById('action-btn');
  const reserveBtn = document.getElementById('reserve-btn');
  const terminal = document.getElementById('terminal');

  let isRetrieveMode = false;
  let activeRecord = null;
  let selectedDeviceSig = currentDeviceSig;

  // --- CRITICAL: LIVE TERMINAL SYNC ---
  // Ito ang magbabasa ng logs galing database at magpapakita sa screen mo
  onSnapshot(query(collection(db, "terminal_logs"), orderBy("timestamp", "desc"), limit(15)), (snap) => {
    terminal.innerHTML = ""; // Clear for refresh
    snap.forEach(d => {
      const data = d.data();
      const div = document.createElement('div');
      div.className = "term-line";
      div.innerHTML = `> <span style="color:${data.color || '#9ab4bc'}">${data.message}</span>`;
      terminal.appendChild(div); // Newest on top if you use prepend, or standard order
    });
  });

  const sendLog = async (msg, color = "#9ab4bc") => {
    await addDoc(collection(db, "terminal_logs"), { message: msg, color: color, timestamp: serverTimestamp(), agent: currentAgent });
  };

  // --- AUTO SCAN ---
  input.addEventListener('input', async () => {
    const val = input.value.trim();
    if (val.length < 4) return;
    
    const q = query(collection(db, "mission_orders"), where("missionID", "==", val));
    const snap = await getDocs(q);

    if (!snap.empty) {
      activeRecord = snap.docs[0].data();
      isRetrieveMode = true;
      actionBtn.className = "btn btn-retrieve";
      actionBtn.textContent = "RETRIEVE";
      reserveBtn.disabled = true;
    } else {
      isRetrieveMode = false;
      actionBtn.className = "btn btn-save";
      actionBtn.textContent = "SAVE";
      reserveBtn.disabled = false;
    }
  });

  // --- POPUP ACTION ---
  actionBtn.onclick = async () => {
    if (input.value.length < 4) return;
    document.getElementById('modal-overlay').style.display = 'flex';
    document.getElementById('pop-m-id').innerText = `#${input.value}`;
    const modalBtn = document.getElementById('modal-submit');
    
    if (isRetrieveMode) {
        modalBtn.innerText = "DEPLOY";
        modalBtn.className = "btn btn-retrieve";
        selectedDeviceSig = activeRecord.weaponSystem;
    } else {
        modalBtn.innerText = "SAVE";
        modalBtn.className = "btn btn-save";
        selectedDeviceSig = currentDeviceSig;
    }

    const q = query(collection(db, "mission_orders"), where("agentName", "==", currentAgent));
    const snap = await getDocs(q);
    const myDeviceSigs = new Set([currentDeviceSig]);
    snap.forEach(d => { if(d.data().weaponSystem) myDeviceSigs.add(d.data().weaponSystem); });

    const grid = document.getElementById('pop-device-list');
    grid.innerHTML = "";
    myDeviceSigs.forEach(sig => {
      if(!fullWeaponMap[sig]) return;
      const btn = document.createElement('button');
      btn.className = `dev-btn ${sig === selectedDeviceSig ? 'active' : ''}`;
      btn.innerText = fullWeaponMap[sig];
      btn.onclick = () => {
        document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDeviceSig = sig;
      };
      grid.appendChild(btn);
    });
    document.getElementById('v-agent-input').value = isRetrieveMode ? activeRecord.vAgentID : "";
  };

  window.submitMission = async () => {
    const targetID = input.value.trim();
    const vID = document.getElementById('v-agent-input').value.trim();
    const data = { missionID: targetID, agentName: currentAgent, vAgentID: vID, weaponSystem: selectedDeviceSig, expenses: 0, timestamp: serverTimestamp() };

    await setDoc(doc(db, "mission_orders", targetID), data, { merge: true });
    
    const logMsg = isRetrieveMode ? `RETRIEVED & RE-DEPLOYED: ID ${targetID}` : `NEW UPLINK SUCCESS: ID ${targetID}`;
    await sendLog(logMsg, isRetrieveMode ? 'var(--blue)' : 'var(--green)');
    
    location.reload();
  };

  window.closePopup = () => document.getElementById('modal-overlay').style.display = 'none';
  setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
</script>
</body>
</html>
