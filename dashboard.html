<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CORE_DASH | v30.5</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#02080a">
    
    <link rel="stylesheet" href="styles/dbintel.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Konting inline fix para sa visibility ng secure field */
        #secure-input-field {
            display: none;
            width: 100%;
            margin-top: 10px;
        }
        #secure-input-field.show {
            display: block;
        }
        .weapon-btn.selected {
            border: 1px solid #05ffa1;
            background: rgba(5, 255, 161, 0.2);
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <span style="font-weight: 700; color: #fff; letter-spacing: 2px;">CORE_DASH // SECURE_ACCESS</span>
    </header>

    <div class="status-bar">
        <div>SYS_TIME: <span id="clock">00:00:00</span></div>
        <div style="color: #05ffa1; text-shadow: 0 0 5px #05ffa1;">UPLINK_STABLE</div>
    </div>

    <main>
        <div class="command-module">
            <label for="mission-input" style="font-size: 0.7rem; color: #5c7882; margin-bottom: 5px; display: block;">TARGET_MISSION_ID</label>
            <input type="tel" id="mission-input" placeholder="0000" maxlength="5" autocomplete="off">
            
            <div id="mission-status" style="margin: 10px 0; min-height: 20px; font-size: 0.8rem;">
                </div>

            <div class="btn-row">
                <button id="action-btn" class="btn btn-save">SAVE</button>
                <button id="reserve-btn" class="btn btn-reserve">RESERVE</button>
            </div>
        </div>

        <div id="terminal">
            <div class="term-line">INITIALIZING SYSTEM...</div>
            <div class="term-line">AWAITING MISSION_ID...</div>
        </div>

        <div class="profile-mini">
            <div class="avatar" id="avatar-init">?</div>
            <div class="profile-info">
                <div id="prof-name" style="font-weight: 700; color: #00f3ff;">AGENT_PENDING</div>
                <div style="font-size: 0.7rem; color: #5c7882;">AUTH_LEVEL: OMEGA_CLEARANCE</div>
            </div>
        </div>
    </main>

    <div class="overlay" id="modal-overlay" style="display: none;">
        <div class="popup">
            <div id="pop-header" style="font-size: 1.5rem; color: #00f3ff; margin-bottom: 15px;">#00000</div>
            
            <div class="input-group">
                <span class="label">vAGENT_IDENTIFIER:</span>
                <input type="text" id="v-agent-input" class="pop-input" placeholder="V_ID_REQUIRED">
            </div>
            
            <div class="secure-line-wrapper" style="margin: 15px 0;">
                <span id="add-secure-btn" style="cursor: pointer; color: #ffbd00; font-size: 0.8rem;">+ Add Secure Line</span>
                <input type="tel" id="secure-input-field" maxlength="11" placeholder="09XXXXXXXXX" class="pop-input">
            </div>

            <div class="input-group">
                <span class="label">SYSTEM_LINK (WEAPON_SELECT):</span>
                <div class="weapon-selector" id="weapon-list">
                    </div>
            </div>

            <div class="btn-row" style="margin-top: 20px;">
                <button id="modal-submit" class="btn btn-save" onclick="window.emergencyDeploy()">DEPLOY</button>
                <button id="modal-close" class="btn">ABORT</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">DASHBOARD</a>
        <a href="intel.html" class="nav-item">INTEL</a>
        <a href="profile.html" class="nav-item">PROFILE</a>
    </nav>

    <script type="module" src="js/jsdash.js"></script>

</body>
</html>
